         announces them should look like it belongs to the brand.

         It does not compete with the wordmark, because it is a third of
         the size and it is type rather than artwork. */
      const head = 'MUSIC IS ON';
      const big = Math.round(s * FEEL.TITLE_MUSIC_SIZE);
      const room = w * 0.90 * (1 - FEEL.BRAND_TEXT_STROKE)
                 - s * FEEL.BRAND_TEXT_SHADOW_X * 2;
      brandText(head, w / 2, y, fittedSize(head, '900', big, room), 1);
      y += big * 0.62 + s * FEEL.TITLE_MUSIC_GAP;
      ctx.globalAlpha = FEEL.TITLE_MUSIC_ALPHA;
      const sub = 'the note button, bottom left, turns it off';
      text(sub, w / 2, y,
           fittedSize(sub, '700', Math.round(s * FEEL.TITLE_MUSIC_SUB), w * 0.94),
           '700', 'center', COLOUR.TEXT);
      ctx.globalAlpha = 1;
    }

    /* AND THEN NOTHING, ALL THE WAY DOWN TO THE BOTTOM BUTTON. That
       emptiness is the design and not an oversight. */
    dailyRect.live = false;
    altRect.live = false;
    /* THE CALIBRATION OWNS THIS BAND WHILE IT IS UP, and it is the only
       thing in the game that ever takes a row off another screen. It is
       a few seconds, it is asked for deliberately, and the alternative
       is a prompt drawn straight through a button. */
    if (tiltCalOnScreen()) return;

    /* THE SECOND CHOICE, anchored to the bottom edge where RESTART sits
       on the death screen and the mode switch sits on the pause overlay.
       Its one line of explanation goes UNDERNEATH it, because a caption
       above a button reads as belonging to whatever is above THAT. */
    /* THE WHOLE BOTTOM GROUP LIFTS BY THE FINE PRINT'S HEIGHT, and only
       on this screen. The death and completion screens read
       DEATH_BOTTOM on its own a few hundred lines from here and are
       untouched, because they carry no fine print: it is a title screen
       thing and it lives and dies with the title screen. */
    const by0 = h - safeBottom - FEEL.DEATH_BOTTOM - fine;
    altRect.to = ENDLESS;
    canvasButton(altRect, 'RANDOM TRACK', w / 2, by0 - s * 0.050,
                 Math.round(s * 0.038), COLOUR.TEXT, w);
    ctx.globalAlpha = FEEL.TITLE_SUB_ALPHA;
    const sub = 'not scored against the world'
              + (hasKeyboard ? '     press R' : '');
    text(sub, w / 2, by0 + s * 0.012,
         fittedSize(sub, '700', Math.round(s * 0.027), w * 0.92), '700',
         'center', COLOUR.TITLE_DIM);
    ctx.globalAlpha = 1;
    /* THE CAR, ABOVE THE SECOND CHOICE and well clear of the centre of
       the bottom row, which is where a reflex tap lands hardest and
       where nothing that changes anything belongs. Named rather than
       shown as a swatch, because the name is what the unlock announced
       and the car itself is on screen behind this the moment you tap. */
    if (carsUnlocked() > 1) {
      canvasButton(carRect, 'CAR  ' + activeCar().name, w / 2,
                   by0 - s * 0.050 - s * 0.098, Math.round(s * 0.032),
                   COLOUR.SCORE_BEST, w);
    } else {
      carRect.live = false;
    }
  } else if (state === DEAD) {
    dailyRect.live = false;
    altRect.live = false;
    carRect.live = false;
    drawResult(w, h);
  } else if (state === FINISHED) {
    dailyRect.live = false;
    altRect.live = false;
    carRect.live = false;
    drawFinish(w, h);
  } else {
    dailyRect.live = false;
    altRect.live = false;
    carRect.live = false;
  }
}

/* Did that tap land on the car cycle? Same shape as every other canvas
   button in this file, and tested BEFORE the tap anywhere so it cannot
   be swallowed by the thing that starts a run. */
function hitCar(e) {
  if (!carRect.live || state !== TITLE) return false;
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  return x >= carRect.x && x <= carRect.x + carRect.w
      && y >= carRect.y && y <= carRect.y + carRect.h;
}

function hitDaily(e) {
  if (!dailyRect.live) return false;
  if (state !== TITLE && state !== DEAD) return false;
  return hitRect(dailyRect, e);
}

/* THE COMPLETION SCREEN CARRIES ONE TOO, once the day is done, so the
   state test is both of them. The input lock applies there exactly as it
   does to every other target on that screen: a button that could be hit
   on the frame the finale ends is a button the reflex tap hits. */
function hitAlt(e) {
  if (!altRect.live) return false;
  if (state === TITLE) return hitRect(altRect, e);
  if (state === FINISHED && deadFor >= FEEL.DEATH_INPUT_LOCK) return hitRect(altRect, e);
  return false;
}

/* THE FRONT DOOR, AND IT NEVER ASKS. The furthest level not yet
   finished today, which is level one on a first visit and the last level
   once the day is done, so a finished day is replayable for a better
   score without ever offering a choice. */
function startDaily() {
  mode = DAILY;
  rollDayIfNeeded();
  level = nextLevel();
  startRun();
}

/* Rolling forward off the completion screen. The SAME one input that
   restarts everywhere else, so finishing a level and dying on one cost
   the player exactly the same thing. The last level rolls to itself:
   the day is over and another go at it is what is left. */
function startNextLevel() {
  mode = DAILY;
  if (level < levelCount() && recFor(level).done) level = level + 1;
  startRun();
}

function startEndless() {
  mode = ENDLESS;
  startRun();
}

function startMode(m) {
  mode = m;
  startRun();
}

/* The scrape budget, drawn low and central. It shows what is left rather
   than what is spent, so a full bar means safe, and it fades out entirely
   when there is nothing to say. */
/* The run's score and the live multiplier. Read by the display and by
   nothing else, and reset by startRun with everything else. */
let score = 0;
let multiplier = 1;
let multPop = 0;          // seconds left on the kick when it passes a whole number
/* Banked is what a crash lets you keep. score is what is pending on top
   of it, which a crash does not. */
let banked = 0;
let clock = 0;
let nextGate = 0;         // segment index of the gate not yet crossed
let gateFlash = 0;        // seconds left on the crossing response
let clockPop = 0;         // seconds left on the big time payout
/* Where the score was drawn this frame, so the timer can hang off it
   rather than guessing at a fraction of the screen. */
let scoreTop = 0, scoreSize = 0, hudBottom = 0;
let runBestMult = 1;      // the best multiplier this run reached
let gatesPassed = 0;
let runDistance = 0;      // metres, for the summary
let bestScore = (function () {
  const raw = storeGet('best');
  const n = raw === null ? 0 : parseInt(raw, 10);
  return isFinite(n) && n > 0 ? n : 0;
})();
/* The second record, and the reason continues can exist without hollowing
   out the first one. Distance is what a continued run is actually good
   at, so it gets a scoreboard of its own and BEST SCORE is left alone. */
let furthest = (function () {
  const raw = storeGet('far');
  const n = raw === null ? 0 : parseInt(raw, 10);
  return isFinite(n) && n > 0 ? n : 0;
})();

/* Section 4.4, AND PROXIMITY TO THE EDGE IS NO LONGER PART OF IT.

   ONE TERM NOW. slipTerm is how far past MULT_MIN_SLIP the car is
   sideways, bent by MULT_SLIP_POWER so a shallow slide is worth far less
   than half of a deep one. Chain length is the other half and it always
   was: updateScore integrates this over time, so holding a slide is what
   climbs the number and breaking it is what loses it.

   WHY THE EDGE TERM IS GONE, and this reverses a founding pillar so the
   reasoning belongs here as well as in the brief.

   IT DID NOT REGISTER. Hundreds of runs by the author and lateral
   position was never once a thing being thought about: the game is hard
   enough that surviving is the whole job. A tester who had played
   repeatedly asked whether the game scores you for holding the CENTRE
   line, which is the exact opposite of what it did.

   THE SCRAPE BAND WAS DOING TWO CONTRADICTORY JOBS AT ONCE. The same
   lateral position drained the clock and peaked the multiplier, so it
   was punished and rewarded simultaneously. That is a reliable way to
   make scoring unreadable, and it made the band impossible to describe
   in one sentence.

   AND SLIP IS VISIBLE WHERE POSITION IS NOT. The car is sideways and the
   trail runs hot; you can see the whole of it. You cannot judge your
   distance from an edge you are steering away from, and the camera is
   behind the car. Scoring what the player can see is the difference
   between a mechanic and noise.

   This still scores the risk in the sense that matters, because a deep
   slide is riskier than a shallow one. It stops scoring a dimension
   nobody perceives. The scrape band keeps its clock drain, its sparks,
   its shake, its speed penalty and its meter, and becomes purely the
   mercy gradient section 4.2 always described it as. */
function multiplierEarn() {
  const slipTerm = Math.pow(
    clamp((drift.slipNorm - FEEL.MULT_MIN_SLIP) / (1 - FEEL.MULT_MIN_SLIP), 0, 1),
    FEEL.MULT_SLIP_POWER);
  return slipTerm;
}

/* The clock's own slip term, which was ALREADY just the slip half and is
   unchanged. It has its own floor, CLOCK_MIN_SLIP, because the two are
   answering different questions and always have been. What has changed
   is that the multiplier no longer asks a second question on top. */
function slipPay() {
  return Math.pow(
    clamp((drift.slipNorm - FEEL.CLOCK_MIN_SLIP) / (1 - FEEL.CLOCK_MIN_SLIP), 0, 1),
    FEEL.MULT_SLIP_POWER);
}

function updateClock(dt) {
  if (state !== DRIVING) return;
  if (gateFlash > 0) gateFlash -= dt;
  if (clockPop > 0) clockPop -= dt;
  /* Nothing to survive during the on ramp. A new player has enough to
     think about without a number counting down at them.

     A FLOOR, NOT AN ASSIGNMENT, AND THAT WAS A REAL BUG. Writing
     CLOCK_START every frame threw away any gate bonus banked inside the
     window. It never showed while the daily was six to eight gates,
     because gate one was one of many; on a two gate level it is half of
     them, and the discarded sixteen seconds is the difference between
     reaching the line and not.

     AND THE EASIEST LEVEL IS PINNED FOR ITS WHOLE LENGTH, for exactly
     the reason the sentence above gives. Measured: driven perfectly
     straight, with no drifting to pay the clock, level one ran out of
     time at 50 seconds with the line at 56.7. A first time player who
     drives it well and is then told they were too slow has met a failure
     they could not see coming, which is the one thing level one exists
     to not do. The test is the level band, so it follows LEVEL_COUNT and
     a single level configuration still has a clock. */
  const noClock = (mode === DAILY && levelBand(level) <= 0)
               || (!skipOnRamp && runTime < FEEL.ONRAMP_SECONDS);
  if (noClock) { if (clock < FEEL.CLOCK_START) clock = FEEL.CLOCK_START; return; }
  clock += (FEEL.CLOCK_DRIFT_RATE * slipPay() - 1) * dt;
  if (clock > FEEL.CLOCK_MAX) clock = FEEL.CLOCK_MAX;
  if (clock <= 0) { clock = 0; crash(); }
}

/* Crossing a gate. Everything a gate does happens here, once, on the
   frame the car passes it. */
function crossGate() {
  const at = nextGate;
  const took = Math.floor(score);
  banked += took;
  score = 0;
  gatesPassed++;

  /* THE LAST GATE IS THE LINE. On the daily, crossing gate N ends the
     run and there is no lap two. A player with clock left will feel cut
     short and that is the correct feeling: the moment survival past the
     line contributes to a score, two runs stop being comparable and the
     daily is endless with extra steps. Finishing is the achievement. */
  if (mode === DAILY && gatesPassed >= dailyGates) { finishRun(); return; }

  clock = Math.min(FEEL.CLOCK_MAX, clock + FEEL.CLOCK_CHECKPOINT);
  gateFlash = FEEL.CHECKPOINT_FLASH;
  clockPop = FEEL.CLOCK_POP_TIME;
  nextGate += FEEL.CHECKPOINT_EVERY;
  /* The peak of the stage, and it lands as a moment rather than as a
     fade: the wash and the shake fire on this frame and the new biome
     arrives underneath them, so the turnover is something that happened
     rather than something that was noticed later. */
  gateFlash2 = FEEL.CHECKPOINT_FLASH;
  addShake(FEEL.GATE_SHAKE_PX);
  audioSting(STING_GATE);
  /* THE GATE COUNTS DOWN, and it is delivered here rather than as a
     standing readout because this is the exact moment it means
     something and it costs nothing on screen for the rest of the run.
     The second to last says what the next one is, so the closing stretch
     is driven in the knowledge that it IS the closing stretch, which is
     where the tension of a finite track lives. */
  let said = 'BANKED  +' + took;
  if (mode === DAILY) {
    const left = dailyGates - gatesPassed;
    said += left === 1 ? '   FINAL STRETCH'
          : '   ' + left + ' TO GO';
  }
  sayCallout(said, CALL_GATE, COLOUR.GATE);
  /* NOT the next one round the wheel. Marching through the hues in order
     means every gate is a small step and the change stops being an
     event; the bag guarantees a big step and still shows every hue once
     before any of them comes back. */
  applyBiome(nextBiome());
  // Everything a continue needs, taken after the gate has done its work
  // so a resume arrives in exactly the state the crossing left.
  saveCheckpoint(at);
}

/* ==================================================================
   THE FINISH.

   Deliberately not a crash with a different word on it. Nothing
   explodes, nothing falls, the car keeps its shape and the screen says
   the run was completed. It is the one outcome in this game that is a
   win and it has to read as one.

   THREE THINGS ARE RECORDED, in the order they matter:

     SCORE, which is primary, because this game is about drifting and a
       finish that was crawled round is not the same achievement as a
       finish that was thrown round.
     TIME, which is what the ghost is raced against.
     CLEAN, meaning zero continues, which is the binary most worth
       knowing and is therefore the loudest thing on the screen.
   ================================================================== */
let finishTime = 0;         // this run's time to the line
let finishMargin = null;    // against the ghost's, seconds, null if none
let finishClean = false;
let finishRecord = false;   // did this run set today's record
// Where on the road the car crossed. The donut is centred on it, so the
// celebration happens where the run ended rather than in the middle.
let finishX = 0;

function finishRun() {
  finishTime = runTime;
  finishX = carX;
  finishClean = continues === 0;
  runDistance = Math.round(position / 100);
  banked += Math.floor(score);
  score = 0;
  /* The margin against the line the ghost was recorded on, which is only
     meaningful if that run reached the line too. */
  finishMargin = (finishClean && dailyTime > 0) ? finishTime - dailyTime : null;
  /* BEFORE the bank, because banking is what sets dailyDone, and the
     finale wants to know whether this was the first clean finish of the
     day rather than whether it is one now. */
  finaleFirstToday = !dailyClean;
  finishRecord = bankScore(true);
  // The margin above is read off the record's time, so the line is kept
  // after it, not before, or a run would be measured against itself.
  ghostBank();
  stopTiltHint(true);
  onRunEnded();
  state = FINISHED;
  deadFor = 0;
  restartWanted = false;
  scraping = false;
  calloutLife = 0;
  driftLife = 0;
  breakChain();
  gateFlash = FEEL.CHECKPOINT_FLASH;
  gateFlash2 = FEEL.CHECKPOINT_FLASH;
  clockPop = 0;
  coastSpeed = FEEL.SPEED;
  /* The crossing, and only the crossing. The volleys, the donut and the
     rest of the fanfare are beats of their own and they arrive on the
     finale's clock, not here. The shake goes through addShake like every
     other source, so it is capped and does not sum with the gate's own. */
  startFinale();
}

function updateScore(dt) {
  if (multPop > 0) multPop -= dt;
  if (state !== DRIVING) return;
  if (carSegIndex >= nextGate) crossGate();
  const earn = multiplierEarn();
  const was = Math.floor(multiplier);
  /* THE AIR HOLDS. There is no grip in flight, so there is no slip to
     earn from, and a decaying multiplier would make every jump a
     punishment for taking it. It neither climbs nor falls until the
     wheels are back on the road. */
  if (airborne) { /* held */ }
  else if (earn > 0) multiplier += FEEL.MULT_CLIMB_RATE * earn * dt;
  else multiplier -= FEEL.MULT_DECAY_RATE * dt;
  multiplier = clamp(multiplier, 1, FEEL.MULT_MAX);
  // A kick on every whole number crossed upward, which is the only thing
  // that has to be noticed for the rule to be worked out.
  if (multiplier > runBestMult) runBestMult = multiplier;
  if (Math.floor(multiplier) > was) multPop = FEEL.MULT_POP_TIME;
  score += (FEEL.SCORE_SURVIVE_RATE
            + FEEL.SCORE_RISK_RATE * (multiplier - 1)) * dt;
}

/* ==================================================================
   TODAY'S RECORD, AND THE LINE THAT WENT WITH IT.

   Its own record, separate from BEST SCORE and FURTHEST, because it is
   answering a different question: those two are "how good are you", this
   is "how good are you at TODAY'S road". It resets when the local date
   changes and it takes the ghost with it, because a line recorded on
   yesterday's generation is a line through a road that no longer exists.

   Continues are allowed on the daily and unlimited attempts are the
   point, but the RECORD is closed to a continued run, which is the same
   rule BEST SCORE already lives under and for the same reason.

   Every read and write goes through storeGet and storeSet, which are
   already try/catch wrapped. With storage unavailable dailyBest simply
   stays at zero for the session and the ghost never appears: the daily
   is still fully playable and remembers nothing, which is the required
   behaviour rather than a degradation.
   ================================================================== */
/* ONE ENTRY PER LEVEL, AND THE ARRAYS ARE SIZED FROM LEVEL_COUNT.

   Three ghosts is three arrays, not three systems: the ghost that is
   LOADED is still the single one the existing renderer draws, and these
   are the stored blobs it is loaded from when a level starts.

   THE KEYS CARRY THE LEVEL NUMBER, so a stored day survives LEVEL_COUNT
   changing under it: entries for levels that no longer exist are simply
   never read, and levels that did not exist before read as empty.

   levelRec is indexed 1..levelCount(). Index 0 is left unused rather
   than shifting every read by one, because every other level number in
   the file is one indexed and a single off by one here would be silent. */
const levelRec = [];
let dailyGhostBytes = 0;

function recFor(lvl) {
  const i = clampLevel(lvl);
  while (levelRec.length <= i) levelRec.push(null);
  if (!levelRec[i]) levelRec[i] = { best: 0, time: 0, done: false, clean: false, ghost: '' };
  return levelRec[i];
}

/* The current level's record, which is what every existing reader wants.
   These four were plain variables and are now views onto the array; they
   are refreshed by syncLevelRecord whenever the level changes. */
let dailyBest = 0;         // best score on a clean run, THIS level
let dailyTime = 0;         // and its time to the line, zero if it never got there
let dailyDone = false;     // has this level been finished at all
let dailyClean = false;    // and was it ever finished with no continues

function syncLevelRecord() {
  const r = recFor(level);
  dailyBest = r.best;
  dailyTime = r.time;
  dailyDone = r.done;
  dailyClean = r.clean;
  dailyGhostBytes = r.ghost.length;
  ghostClear();
  if (r.ghost) ghostDecode(r.ghost);
}

function clearDailyRecords() {
  levelRec.length = 0;
  ghostClear();
  dailyBest = 0; dailyTime = 0; dailyDone = false; dailyClean = false;
  dailyGhostBytes = 0;
  storeSet('daily.day', String(todayStamp));
  storeSet('daily.gen', String(ROAD_GEN));
  /* Every level's keys wiped, and a couple past the current count, so
     turning LEVEL_COUNT down and back up cannot resurrect yesterday's
     level three under today's date. */
  for (let i = 1; i <= levelCount() + 2; i++) {
    storeSet('daily.best.' + i, '0');
    storeSet('daily.time.' + i, '0');
    storeSet('daily.done.' + i, '0');
    storeSet('daily.ghost.' + i, '');
  }
}

/* WHICH GENERATION OF THE ROAD A STORED RECORD BELONGS TO.

   The day stamp answers "is this today's road", and until now that was
   the whole question, because the road for a given day was fixed for
   ever. It is not: fixing the frame rate leak CHANGED the road every
   seed produces, slightly, so a score or a ghost banked this morning was
   set on a road that no longer exists. Worse, it may have been set on a
   road that never existed for anybody else, because that is precisely
   what the bug was.

   So a record has to match the day AND the generation, and a stored
   record that predates this marker is discarded exactly the way a
   yesterday's record is. Bump this whenever a change alters the geometry
   a seed produces. It costs the day's records once and it is the only
   honest thing to do with a time set on a different track.

   BUMPED TO 3 FOR THE FIVE LEVEL DAY, and it is level three that forces
   it. The seeds did not move: every level's road is the same road it was
   for a given date. The LENGTHS did. Level three used to run six gates
   and now runs four, so a best score banked on the old level three was
   set over 190 seconds of scoring on a track that now ends at 123, and
   it would sit there unbeatable for the rest of the day. Levels four and
   five are new and have no records to lose, and levels one and two are
   the same length they always were.

   THE ALL TIME BEST IS DELIBERATELY NOT TOUCHED. Jump points and the
   close call raise a run's score by five to ten percent, which makes an
   old record marginally easier to beat rather than impossible, and that
   is a difference the next good run settles on its own. Deleting
   somebody's best score is a real loss and a scoring change does not
   earn it: session C moved scores three to four times and did not, and
   this is a tenth of that. */
const ROAD_GEN = 3;

(function loadDaily() {
  const day = parseInt(storeGet('daily.day'), 10);
  const gen = parseInt(storeGet('daily.gen'), 10);
  if (day !== todayStamp || gen !== ROAD_GEN) {
    // A different day, an older road, or nothing stored. Either way
    // there is nothing here that belongs to today's roads.
    clearDailyRecords();
    return;
  }
  for (let i = 1; i <= levelCount(); i++) {
    const r = recFor(i);
    const b = parseInt(storeGet('daily.best.' + i), 10);
    if (isFinite(b) && b > 0) r.best = b;
    const t = parseFloat(storeGet('daily.time.' + i));
    if (isFinite(t) && t > 0) r.time = t;
    /* DONE AND CLEAN IN ONE FIELD, because they are two bits of the same
       fact and a level cannot be clean without being done. 0 unfinished,
       1 finished, 2 finished with no continues. */
    const d = parseInt(storeGet('daily.done.' + i), 10);
    if (isFinite(d) && d > 0) { r.done = true; r.clean = d >= 2; }
    r.ghost = storeGet('daily.ghost.' + i) || '';
  }
  syncLevelRecord();
})();

/* ------------------------------------------------------------------
   PROGRESSION, AND THERE IS NEVER A CHOICE.

   Handoff section 9 forbids new screens and BRIEF.md section 12 forbids
   menus, so there is no level select and there never will be. The front
   door picks for you: the furthest level not yet finished today, which
   on a first visit is level one and after a completed day is the last
   level, replayable for a better score.
   ------------------------------------------------------------------ */
function nextLevel() {
  for (let i = 1; i <= levelCount(); i++) if (!recFor(i).done) return i;
  return levelCount();
}

/* Has the whole day been finished, and was every level of it clean. The
   clean version is the hardest thing available in the game and it is the
   loudest thing recorded. */
function dayDone() {
  for (let i = 1; i <= levelCount(); i++) if (!recFor(i).done) return false;
  return true;
}
function dayClean() {
  for (let i = 1; i <= levelCount(); i++) if (!recFor(i).clean) return false;
  return true;
}
function levelsDone() {
  let n = 0;
  for (let i = 1; i <= levelCount(); i++) if (recFor(i).done) n++;
  return n;
}

/* Which of two clean runs is the better one.

   A FINISH BEATS AN UNFINISHED RUN WHATEVER THE SCORES. Score stays
   primary between two runs of the same kind, and that is the right way
   round: this game is about drifting, so the higher score wins. But a
   run that reached the line and one that died at gate four are not
   comparable at all, and letting a big score on a dead run hold the
   record would keep a ghost that runs out halfway and a time that does
   not exist. */
function dailyBeatsRecord(finished, score) {
  /* Against the CLEAN record, not against the done bit. done can now be
     set by a continued run, which takes no record, so comparing against
     it would let a continued finish lock out every later clean one. */
  if (finished !== dailyClean) return finished;   // a finish always wins
  return score > dailyBest;
}

/* Called at the end of a run, before anything is reset. Returns whether
   this run took the record, which is what the completion screen says. */
function bankDaily(finished) {
  if (mode !== DAILY) return false;
  const r = recFor(level);
  /* COMPLETION IS BANKED EVEN ON A CONTINUED RUN, and this is the one
     place the two ideas have to come apart. Finishing a level is what
     unlocks the next one, and refusing to record it because the player
     used their continue would strand them on a level they have already
     driven to the end. The RECORD, meaning the score, the time and the
     word clean, is still closed to a continued run exactly as before.

     So: done is progression, clean is achievement, and only clean is a
     record. A DAY COMPLETED CLEAN needs every level's clean bit. */
  if (finished) {
    /* THE CUMULATIVE COUNT, WRITTEN BUT NOT SHOWN. Session D puts a
       tracks finished total on the title screen; handoff section 4 is
       explicit that it replaces any notion of a streak, so it only ever
       goes up and there is no consecutive day logic anywhere near it.
       Counted here, on the first completion of a level on a given day,
       so a replay for a better score does not inflate it. Nothing reads
       it yet on purpose: storing it now means the number is real when
       the display arrives rather than starting from zero. */
    const wasUnlocked = carsUnlocked();
    if (!r.done) {
      finishedEver++;
      storeSet('finished', String(finishedEver));
    }
    r.done = true;
    if (continues === 0) r.clean = true;
    /* AND A WHOLE DAY CLEAN, WHICH EARNED NOTHING UNTIL NOW. It is the
       hardest thing available in this game: every level of the day
       finished with no continues at all. Counted once per day, AFTER
       this level's clean bit is set, because this run may be the one
       that completes it.

       ONCE PER DAY IS ENFORCED BY A STAMP, not by a flag that a replay
       could set again: the day it was last credited is stored, so
       replaying the last level of an already clean day cannot pay
       twice. */
    if (dayClean() && storeGet('cleanday') !== String(todayStamp)) {
      cleanDaysEver++;
      storeSet('cleandays', String(cleanDaysEver));
      storeSet('cleanday', String(todayStamp));
    }
    /* THE ANNOUNCEMENT, in the language the game already uses for
       everything else worth saying. Said once, here, at the moment it
       is earned, and held for the completion screen to show as well,
       because that screen is where the player is actually looking. */
    if (carsUnlocked() > wasUnlocked) {
      for (let i = CARS.length - 1; i >= 0; i--) {
        if (!carUnlocked(i)) continue;
        carJustUnlocked = CARS[i].name;
        break;
      }
      if (carJustUnlocked) {
        /* URGENT, AND IT HAS TO BE. Measured without it: the line was
           set and then immediately overwritten by CLEAN, which is said
           a moment later on the same finish, so the announcement never
           reached the screen at all. Unlocking a car happens a handful
           of times in a player's whole history; CLEAN happens most
           runs. This one wins. */
        sayDrift('NEW CAR  ' + carJustUnlocked, COLOUR.SCORE_BEST, 1, true);
        driftLock = FEEL.CALLOUT_LOCK;
        // Earned it, so drive it: nothing to find and nothing to choose.
        pickCar(CARS.map(function (c, i) { return i; })
                    .filter(function (i) { return CARS[i].name === carJustUnlocked; })[0]);
      }
    }
    storeSet('daily.day', String(todayStamp));
  storeSet('daily.gen', String(ROAD_GEN));
    storeSet('daily.done.' + clampLevel(level), r.clean ? '2' : '1');
    dailyDone = r.done;
    dailyClean = r.clean;
  }
  if (continues > 0) return false;              // not a lap
  if (!dailyBeatsRecord(!!finished, banked)) return false;
  r.best = banked;
  r.time = finished ? finishTime : 0;
  dailyBest = r.best;
  dailyTime = r.time;
  storeSet('daily.day', String(todayStamp));
  storeSet('daily.gen', String(ROAD_GEN));
  storeSet('daily.best.' + clampLevel(level), String(r.best));
  storeSet('daily.time.' + clampLevel(level), r.time ? r.time.toFixed(2) : '0');
  /* THE LINE NO LONGER GOES WITH THE RECORD. It used to be written here,
     which tied the ghost to the best clean run; it is written by
     ghostBank at the end of every run instead. The record and the ghost
     are answering different questions and want opposite rules, and this
     line moving out of this function is that separation. */
  return true;
}

function bankScore(finished) {
  const tookDaily = bankDaily(finished);
  /* FURTHEST is open to every run, continued or not, because seeing more
     of the track is exactly what a continue is for and it deserves to be
     worth something. */
  if (runDistance > furthest) {
    furthest = runDistance;
    storeSet('far', String(furthest));
  }
  /* BEST SCORE IS CLOSED TO A CONTINUED RUN, and this line is the whole
     of score integrity. Without it the live best score break, which is
     the strongest moment in the game, becomes reachable by pressing
     continue enough times and stops meaning anything at all. */
  if (continues > 0) return tookDaily;
  // Only what was banked survives. The pending run is what a gate is for.
  const final = banked;
  if (final > bestScore) {
    bestScore = final;
    // In memory even if the write failed, so the NEXT run has something
    // real to chase whether or not this profile allows storage.
    bestKnown = true;
    storeSet('best', String(bestScore));
  }
  return tookDaily;
}


/* ==================================================================
   SPECTACLE

   Everything here is a RESPONSE. Nothing in this section fires on a wall
   clock or on a random roll: the heat is the multiplier, the callouts are
   things the player just did, the close call is measured geometry, and
   the gate is a place on the road. That is the whole design rule and it
   is what stops this being decoration.

   PRECEDENCE, decided explicitly rather than left to emerge, because a
   hard corner beside a hazard on a run that is beating its best can put
   four of these in the same frame:

       best score break  >  checkpoint  >  close call  >  drift callout

   Higher suppresses lower for CALLOUT_LOCK seconds. Shake is separate and
   is combined by addShake, which takes the loudest rather than the sum.
   ================================================================== */

/* Shake, from every source in the game, through one door.

   Section 7 says overdoing shake tips into disorientation and that the
   threshold is lower on a phone held close to the face. Two sources were
   already here and this session adds three, so they combine by MAXIMUM
   rather than by sum and the result is clamped. Simultaneous events are
   therefore exactly as violent as the loudest one of them, and nothing in
   the game can shake harder than a crash. */
function addShake(px) {
  if (px > shake) shake = px;
  if (shake > FEEL.SHAKE_MAX_PX) shake = FEEL.SHAKE_MAX_PX;
}

/* The world's reaction to the multiplier, as one analogue number from 0
   to 1. Continuous, lagged so it swells rather than flickers, and bent by
   HEAT_CURVE so a small multiplier is a hint and a big one is
   unmistakable. Everything the world does reads this and nothing reads
   the multiplier directly. */
let worldHeat = 0;
let heatPulse = 1;        // the travelling pulse, 1 at rest, and exactly 1 at zero heat

/* How much of the city is awake, 0 to 1. Its own value rather than a
   second reader of worldHeat, because the two answer different questions:
   worldHeat is the multiplier, which decays and which needs the edge, and
   this is how well the car is being driven RIGHT NOW.

   NOTHING HERE ACCUMULATES. cityGlow is recomputed toward a live target
   every frame and can fall as freely as it rises, and there is no list of
   lit windows anywhere: a window is lit when the glow is past the fixed
   threshold it was born with and dark when it is not, which is why they
   go out in the same order they came on. */
let cityGlow = 0;
let cityPulse = 1;        // the throb, 1 at rest and never above 1
let cityPhase = 0;

/* AN ENVELOPE, RECOMPUTED EVERY FRAME FROM LIVE DRIFT. Fast attack, slower
   release, and a target that is genuinely zero on a straight.

   THE BUG THIS REPLACES, because it is worth writing down. The target used
   to be chainTerm * (base + rest * slipTerm), which reads as "the chain
   decides how far it goes and slip decides how hard". It latches, and
   badly: chainLinks only ever grows, the chain survives
   CALLOUT_CHAIN_GRACE of not drifting, and slip was an ADDITIVE term, so
   at zero slip the target was still base times chainTerm. Measured on a
   dead straight with no slip at all: the whole city, all 360 windows,
   stayed lit for two full seconds, was still half lit at three, and did
   not reach zero until eight. That is a latch wearing a linger's clothes.

   SLIP IS NOW A GATE, NOT A TERM. It multiplies the whole thing, so
   however long the chain is, the moment the car stops sliding the target
   is zero and the release takes it down. The chain still decides how far
   a slide can go, which is the "longer" half of the brief, but it can no
   longer hold the lights on by itself.

   The two time constants ARE the feel of this, which is why both are
   named and both are on the cycler: the ratio between them is what makes
   it breathe rather than flicker or smear. */
function updateCity(dt) {
  const driving = state === DRIVING;
  const slipTerm = Math.pow(
    clamp((drift.slipNorm - FEEL.CHAIN_MIN_SLIP) / (1 - FEEL.CHAIN_MIN_SLIP), 0, 1),
    FEEL.CITY_SLIP_POWER);
  const chainTerm = clamp(chainLinks / Math.max(1, FEEL.CITY_CHAIN_FULL), 0, 1);
  const target = driving
    ? slipTerm * (FEEL.CITY_BASE + (1 - FEEL.CITY_BASE) * chainTerm)
    : 0;
  const tau = target > cityGlow ? FEEL.CITY_ATTACK : FEEL.CITY_RELEASE;
  cityGlow += (target - cityGlow) * (1 - Math.exp(-dt / tau));
  /* An exponential never actually arrives. Without this the city sits at
     a thousandth of a window for the rest of the run, which is the same
     class of mistake as the latch it replaces. */
  if (target <= 0 && cityGlow < FEEL.CITY_SILENT) cityGlow = 0;
  // The city too. Every window is lit at one, which a good run does
  // reach; the finale is what holds it there with nobody driving.
  if (finaleGlow > cityGlow) cityGlow = finaleGlow;
  // The skyline too, so a great landing lifts the whole picture briefly.
  if (landFlare > cityGlow) cityGlow = landFlare;

  /* The throb. Depth and rate both scale with the envelope, so at rest
     there is no pulse at all and only a hard sustained slide makes the
     city breathe. It rides the ALPHA and never the thresholds: modulating
     which windows are lit would read as flicker rather than as a pulse,
     and section 7 is specific about overdoing motion on a phone. Default
     low, and CITY_PULSE_DEPTH takes it to nothing. */
  cityPhase += dt * (FEEL.CITY_PULSE_HZ + FEEL.CITY_PULSE_HZ_GAIN * cityGlow)
                  * Math.PI * 2;
  if (cityPhase > Math.PI * 2) cityPhase -= Math.PI * 2;
  cityPulse = 1 - FEEL.CITY_PULSE_DEPTH * cityGlow * (0.5 - 0.5 * Math.cos(cityPhase));
}

/* TWO LANES.

   The EVENT lane carries the things that happen to a run: a checkpoint, a
   close call, a best score break. They are rare, so they need no rate
   limit, and they keep their own precedence, best over gate over close.

   The DRIFT lane carries the thing the player is doing, which is the
   entire game, so it is not queued behind events and it cannot be
   outbid by one. It has its own row on the screen, its own slot and its
   own rate floor. The only thing that may take it away is a best score
   break, which is the one moment loud enough to deserve the whole screen.

   Each lane holds one callout, newest wins. Neither ever stacks. */
const CALL_CLOSE = 2, CALL_CHAIN = 3, CALL_GATE = 4, CALL_BEST = 5;
let calloutText = '';
let calloutColour = '';
let calloutPri = 0;
let calloutLife = 0;
let calloutSide = 1;
let calloutLock = 0;      // a louder event holding the event lane

let driftText = '';
let driftColour = '';
let driftSize = 1;        // multiples of the base size, so a tier reads bigger
let driftLife = 0;
let driftSide = 1;
let driftLock = 0;        // only a best score break sets this
let driftGap = 0;         // the rate floor on this lane

// Away from the car, so a callout can never sit over the car or over the
// line the player is actually reading.
function calloutAwaySide() { return carFrac >= 0 ? -1 : 1; }

function sayCallout(str, pri, colour) {
  // Deferred, not queued: a callout that lost its moment has nothing left
  // to say by the time the channel is free.
  if (calloutLock > 0 && pri < calloutPri) return;
  calloutText = str;
  calloutColour = colour;
  calloutPri = pri;
  calloutLife = FEEL.CALLOUT_TIME;
  calloutLock = FEEL.CALLOUT_LOCK;
  calloutSide = calloutAwaySide();
  /* The one crossing between the lanes. A best score break is the whole
     screen's business for a moment, so it clears the drift lane and holds
     it; nothing else in the event lane touches it at all. */
  if (pri >= CALL_BEST) { driftLife = 0; driftLock = FEEL.CALLOUT_LOCK; }
}

/* urgent skips the rate floor. A TIER RISE is urgent by definition: the
   ladder widens, so tiers are self limiting and cannot become a stream,
   and holding one back means the player never sees a rung. Measured, the
   floor was swallowing tier two entirely, which is exactly the rung that
   says a chain is going somewhere. Tier one and a perfect entry are the
   repeatable ones and they wait their turn. */
function sayDrift(str, colour, size, urgent) {
  if (driftLock > 0) return;
  if (!urgent && driftGap > 0) return;
  driftText = str;
  driftColour = colour;
  driftSize = size;
  driftLife = FEEL.CALLOUT_TIME;
  driftGap = FEEL.CALLOUT_GAP;
  driftSide = calloutAwaySide();
}

/* The best score break. bestKnown is the whole of the fresh install and
   no storage handling: with nothing stored there is nothing to beat, so
   the effect simply does not exist for that run. */
let bestKnown = bestScore > 0;
let beatBest = false;
let beatFlash = 0;

/* AND THE OTHER BAR, WHICH IS THE ONE A PLAYER MEETS MOST DAYS.

   BEST SCORE is every run that has ever been driven, so passing it is
   rare and mostly happens on the last level. Today's best on THIS level
   is the number the ghost is a picture of, it is different on every
   level, and it resets every night, so it is the bar that is actually in
   play on an ordinary run.

   ONE HALO, TWO WAYS TO EARN IT. Both breaks light the score for the
   rest of the run and neither can fire twice, so a run that passes both
   erupts twice at most and the second one costs nothing on screen that
   the first did not already spend. scoreBeaten is what the three draw
   sites read.

   NOTHING TO BEAT IS THE DEFAULT, NOT AN ERROR. dailyBest is zero on a
   first ever run, on a level not yet finished today, on a fresh install
   and whenever localStorage is unavailable, which section 6 says is
   common on school profiles. The comparison is against a positive
   number, so all four of those cases switch the whole thing off for the
   run without a single special case. */
let beatDaily = false;
function scoreBeaten() { return beatBest || beatDaily; }

/* The chain: unbroken DRIFTING, which is slip and not the multiplier's
   two term test, so a tidy drift down the middle of a wide on ramp road
   still counts. It survives CALLOUT_CHAIN_GRACE of not drifting, which is
   long enough to cross the straight between two corners, and every
   CALLOUT_CHAIN_STEP of drifting is one link.

   The ladder escalates on TIERS, not on links: the pitch in the audio
   moves on every single link, which is the continuous reward and costs no
   screen space at all, and the text only changes when a tier is reached,
   which is what keeps the praise loud without becoming clutter. */
/* Alternates per rung, so the same word is not read back twice running.
   The variant is picked off a counter rather than off rng(), which is the
   road generator's seeded stream: consuming from it here would change the
   road a pinned seed produces and quietly break every A/B comparison in
   the project. */
const DRIFT_TIERS = [
  ['DRIFT', 'SIDEWAYS', 'HOLD IT'],
  ['NICE', 'CLEAN', 'TIDY'],
  ['GREAT', 'LOVELY', 'SWEET'],
  ['SUPERB', 'SUBLIME', 'MASTERFUL'],
  ['BLISTERING', 'SCORCHING', 'ON FIRE'],
  ['UNREAL', 'MONSTROUS', 'RIDICULOUS']
];
let chainTime = 0;
let chainLapse = 0;
let chainLinks = 0;
let chainTier = 0;
let chainSaidAt = 0;      // links at the last thing said, for the repeats past the top
let chainBestSaid = false;   // this chain has already claimed the run best
let driftWordN = 0;       // which alternate, so a rung never repeats its own word
let runBestChain = 0;     // the longest chain this run, for the louder event

function driftWord(tier) {
  const words = DRIFT_TIERS[Math.min(tier, DRIFT_TIERS.length) - 1];
  return words[driftWordN++ % words.length];
}

let gateFlash2 = 0;       // the crossing wash, separate from the score's own flash
let wasScraping = false;
let edgeClear = 0;        // seconds since the car was last in the scrape band
/* THE LANDING FLARE. A short spike on the world reaction, set by a great
   landing and decaying on its own, and it is a FLOOR on worldHeat and
   cityGlow rather than an addition: it cannot take anything away from a
   player who is already running hot, and it cannot push either past the
   ceiling the finale owns. */
let landFlare = 0;

function resetSpectacle() {
  finaleT = -1;
  finaleLevel = 0;
  finaleGlow = 0;
  finaleFree = 0;
  finaleSky = 0;
  finaleStrobe = 0;
  finaleFlash = 0;
  finaleWavesFired = 0;
  finaleShellsFired = 0;
  finaleHueDue = 0;
  finaleHueN = 0;
  finaleSpin = 0;
  finaleSwing = 0;
  finaleDriving = false;
  landFlare = 0;
  worldHeat = 0;
  heatPulse = 1;
  cityGlow = 0;
  cityPulse = 1;
  cityPhase = 0;
  calloutText = '';
  calloutLife = 0;
  calloutPri = 0;
  calloutLock = 0;
  driftText = '';
  driftLife = 0;
  driftLock = 0;
  driftGap = 0;
  beatBest = false;
  beatDaily = false;
  beatFlash = 0;
  breakChain();
  runBestChain = 0;
  gateFlash2 = 0;
  wasScraping = false;
  edgeClear = 0;
}

/* Called when the chain LAPSES, not when the run ends, so every new chain
   earns its praise from scratch: a tier four chain at four minutes is
   worth exactly what a tier four chain at twenty seconds is worth,
   because it is harder. runBestChain is deliberately NOT reset here, and
   it is deliberately not a gate on anything: it only decides whether the
   separate louder event fires. */
function breakChain() {
  chainTime = 0;
  chainLapse = 0;
  chainLinks = 0;
  chainTier = 0;
  chainSaidAt = 0;
  chainBestSaid = false;
}

/* Which tier a link count has reached, 0 for none. The thresholds widen,
   so the ladder does not run out inside ten seconds. */
function chainTierFor(links) {
  const at = FEEL.DRIFT_TIER_LINKS;
  let t = 0;
  for (let i = 0; i < at.length; i++) if (links >= at[i]) t = i + 1;
  return t;
}

function updateSpectacle(dt) {
  if (calloutLife > 0) calloutLife -= dt;
  if (calloutLock > 0) calloutLock -= dt;
  if (driftLife > 0) driftLife -= dt;
  if (driftLock > 0) driftLock -= dt;
  if (driftGap > 0) driftGap -= dt;
  if (beatFlash > 0) beatFlash -= dt;
  if (gateFlash2 > 0) gateFlash2 -= dt;
  if (resumeFlash > 0) resumeFlash -= dt;
  if (explodeFlash > 0) explodeFlash -= dt;
  /* Before the debris, because a shell that bursts this frame should
     have its sparks moved this frame rather than next. */
  updateFinale(dt);
  updateDebris(dt);

  const driving = state === DRIVING;
  const want = driving
    ? Math.pow(clamp((multiplier - 1) / (FEEL.MULT_MAX - 1), 0, 1), FEEL.HEAT_CURVE)
    : 0;
  worldHeat += (want - worldHeat) * (1 - Math.exp(-dt / FEEL.HEAT_TIME));
  /* THE FINALE OWNS THE FLOOR OF BOTH SYSTEMS. It cannot lower them, so
     a player who arrives at the line already at full heat loses nothing,
     and it holds them at their ceiling for the whole of the finale,
     which no amount of driving can do once the car has stopped. Going
     PAST the ceiling is done at the draw sites, because a worldHeat
     above one would run off the end of every ramp table that reads it. */
  if (finaleGlow > worldHeat) worldHeat = finaleGlow;
  /* AND THE LANDING FLARE, on the same terms: a FLOOR rather than an
     addition, so it can only ever lift a world that was cooler than the
     landing deserved and can never push past the ceiling. Decays on its
     own clock so the spike falls away without anything else driving it. */
  if (landFlare > 0) {
    landFlare = Math.max(0, landFlare - dt / Math.max(0.01, FEEL.JUMP_LAND_FLARE_TIME));
    if (landFlare > worldHeat) worldHeat = landFlare;
  }
  /* Phase off distance travelled rather than off a clock, so it is the
     world going past. Depth is multiplied by heat, so at a multiplier of
     one this is exactly 1 and there is no pulse at all. */
  const wave = 0.5 + 0.5 * Math.sin(position * (Math.PI * 2 / FEEL.HEAT_PULSE_LENGTH));
  heatPulse = 1 - FEEL.HEAT_PULSE_DEPTH * worldHeat * (1 - wave);
  // After the chain has been updated it would lag a frame, and before the
  // early return so the city still cools down over a death screen.
  updateCity(dt);

  if (!driving) { wasScraping = false; edgeClear = 0; return; }

  /* The strongest moment available, and one comparison to find it. It
     only arms on a CLEAN run: a continued run cannot reach the best
     score, so it must not be told that it has. */
  const onScreen = banked + Math.floor(score);
  if (bestKnown && continues === 0 && !beatBest && onScreen > bestScore) {
    beatBest = true;
    beatFlash = FEEL.BEST_FLASH_TIME;
    addShake(FEEL.BEST_SHAKE_PX);
    audioSting(STING_BEST);
    sayCallout('NEW BEST', CALL_BEST, COLOUR.SCORE_BEST);
  }
  /* TODAY'S BEST ON THIS LEVEL, which is the bar an ordinary run
     actually meets. Same shape as the break above and the same three
     guards, plus the daily's own: it is a daily idea, so it does not
     exist in a random track, and dailyBest is per level because
     syncLevelRecord loads it from that level's own key.

     ZERO MEANS THERE IS NOTHING TO BEAT and that is the whole of the
     fresh install, the never finished level, and the school profile with
     storage switched off. No special case, just a positive number.

     ELSE, NOT A SECOND if, so a run that clears both bars on one frame
     speaks once. Passing every score ever driven implies passing today's
     and only the louder of the two should be heard. */
  else if (mode === DAILY && dailyBest > 0 && continues === 0 && !beatDaily
           && onScreen > dailyBest) {
    beatDaily = true;
    beatFlash = FEEL.BEST_FLASH_TIME;
    addShake(FEEL.BEST_SHAKE_PX);
    audioSting(STING_BEST);
    sayCallout('BEST TODAY  BEATEN', CALL_BEST, COLOUR.SCORE_BEST);
  }

  /* A perfect entry: arriving in the scrape band already committed,
     rather than sliding wide into it. The edge itself only, because
     clipping a hazard is not an entry, it is a mistake, and only after
     genuinely leaving the band, because a re touch is not an arrival. */
  const onEdge = scraping && Math.abs(carFrac) > FEEL.SCRAPE_START;
  if (onEdge) {
    if (!wasScraping && edgeClear >= FEEL.CALLOUT_ENTRY_CLEAR
        && drift.slipNorm >= FEEL.CALLOUT_ENTRY_SLIP) {
      sayDrift('PERFECT ENTRY', COLOUR.HAZARD_WARN, 1);
    }
    edgeClear = 0;
  } else {
    edgeClear += dt;
  }
  wasScraping = onEdge;

  /* The chain. Every link steps the pitch of the audio blip, which is the
     continuous reward and costs nothing on screen; the text only speaks
     when a whole tier is reached. */
  /* THE AIR IS NOT A LAPSE. A jump taken straight would otherwise read as
     letting go of the wheel and cost the chain, which would teach the
     player to avoid the ramps. Frozen rather than fed: the chain neither
     grows nor breaks in flight, and picks up exactly where it left off. */
  if (airborne) { resolveCloseCalls(); return; }

  if (drift.slipNorm >= FEEL.CHAIN_MIN_SLIP) {
    chainLapse = 0;
    chainTime += dt;
    const links = Math.floor(chainTime / FEEL.CALLOUT_CHAIN_STEP) + 1;
    if (links > chainLinks) {
      chainLinks = links;
      audioChain(links);
      const tier = chainTierFor(links);
      const top = DRIFT_TIERS.length;
      /* Two reasons to speak, and the second is what stops the silence.
         A NEW RUNG, or, once the ladder has run out, every further
         DRIFT_TOP_REPEAT links of a chain that is still going. */
      const rung = tier > chainTier;
      const past = tier >= FEEL.DRIFT_TIER_LINKS.length
                   && links >= chainSaidAt + FEEL.DRIFT_TOP_REPEAT;
      if (rung || past) {
        chainTier = tier;
        chainSaidAt = links;
        const shown = Math.min(tier, top);
        // Past the top the word stops growing and the count takes over,
        // so a chain that keeps going keeps reading as bigger.
        const label = tier <= top ? driftWord(shown)
                                  : driftWord(shown) + '  ×' + links;
        sayDrift(label, scoreHeatColour((shown - 1) / Math.max(1, top - 1)),
                 1 + FEEL.DRIFT_TIER_GROWTH * (shown - 1), tier > 1);
      }
      /* The run's longest chain, once per chain, in the EVENT lane so it
         is louder and so it is beside the ordinary praise rather than in
         front of it. */
      if (!chainBestSaid && links > runBestChain && links >= FEEL.DRIFT_BEST_MIN) {
        chainBestSaid = true;
        sayCallout('LONGEST CHAIN  ×' + links, CALL_CHAIN, COLOUR.SCORE_BEST);
        audioSting(STING_CHAIN);
      }
      if (links > runBestChain) runBestChain = links;
    }
  } else {
    chainLapse += dt;
    if (chainLapse > FEEL.CALLOUT_CHAIN_GRACE) breakChain();
  }

  resolveCloseCalls();
}

/* ==================================================================
   THE EXPLOSION

   Hitting a solid object now looks like hitting a solid object. Debris,
   a flash, a hard shake and a few frames of the world standing still.

   IT MUST NEVER DELAY GETTING BACK IN, which is section 5 and is the one
   constraint that overrides everything here. So it is purely cosmetic:
   nothing waits on it, the death screen comes up underneath it on exactly
   the schedule it always did, and a tap or a key at any point during it
   goes straight through to continue or restart. The only input gate is
   DEATH_INPUT_LOCK, the accidental input guard that was already there,
   and the hit stop does not extend it, because deadFor advances on real
   time while the world is frozen.

   The pieces are held in SCREEN space rather than world space. They live
   for about a second over a car that is not moving any more, so there is
   nothing for world space to buy, and screen space means the whole effect
   is a handful of numbers and one batched path.
   ================================================================== */
/* ONE POOL, TWO CUSTOMERS, and the fireworks are the second one. The
   finale wanted particles and this system already had all of them:
   screen space, pooled, no allocation, batched by colour. Writing a
   second one would have been two update loops and two draw loops for the
   same handful of numbers.

   `col` is the batch a piece belongs to and it is the only thing that
   differs between a lump of car and a firework spark. `fuse` is the one
   addition: a piece with a fuse is a SHELL, which climbs, is not drawn
   like a spark, and BURSTS into sparks when the fuse runs out.

   THE POOL IS SIZED FOR THE FINALE and the explosion barely touches it.
   A crash uses a few dozen; a burst at the top level uses fifty and
   several can be in the air at once. Allocation is at load and never
   again, so the cost of the bigger pool is one array of small objects.

   SIZED OFF A MEASUREMENT, WITH HEADROOM. A top level finale peaks at
   between 380 and 443 live pieces depending on how the launches happen
   to land, so 460 was right up against it and a slightly unlucky pass
   would have started stealing from bursts still on screen. The extra
   slots cost one walk each in the draw, which measured under a tenth of
   a millisecond, and buy the guarantee that no burst is ever drawn part
   eaten. */
/* RESIZED AGAIN FOR THE VOLLEYS. A trickle of shells never had more than
   about four hundred pieces alive; five discrete volleys a second apart,
   each bigger than the last and each still in the air when the next one
   goes up, peak far higher, because two waves are always overlapping by
   design. Measured at the top level, saturated a 520 slot pool outright. */
const PARTICLE_POOL = 900;
const PART_CAR = 0, PART_FIRE = 1;          // the explosion's own two
const PART_FW = 2;                          // and four firework colours from here
const PART_COLOURS = 6;

const debris = [];
let debrisCount = 0;
let hitStop = 0;
let explodeFlash = 0;
(function () {
  for (let i = 0; i < PARTICLE_POOL; i++) {
    debris.push({ x: 0, y: 0, vx: 0, vy: 0, r: 0, life: 0, spin: 0, rot: 0,
                  col: 0, fuse: 0, drag: 0, grav: 0, fade: 0 });
  }
})();

function clearDebris() {
  for (let i = 0; i < debris.length; i++) { debris[i].life = 0; debris[i].fuse = 0; }
  debrisCount = 0;
  hitStop = 0;
  explodeFlash = 0;
}

/* The first free slot, or the shortest lived one if the pool is full.
   Stealing the shortest lived rather than refusing means a burst at full
   pool thins the oldest smoke rather than coming out half drawn, which
   is the failure that would be noticed. */
let particleCursor = 0;
function takeParticle() {
  /* Round robin from where the last one was found. A burst asks for
     forty slots in a row and they are almost always adjacent, so this is
     one step per particle instead of a walk of the whole pool from zero
     every time. */
  for (let n = 0; n < debris.length; n++) {
    const i = particleCursor;
    particleCursor = (particleCursor + 1) % debris.length;
    if (debris[i].life <= 0) {
      if (i >= debrisCount) debrisCount = i + 1;
      return debris[i];
    }
  }
  let worst = 0;
  for (let i = 1; i < debris.length; i++) if (debris[i].life < debris[worst].life) worst = i;
  return debris[worst];
}

function explode() {
  addShake(FEEL.EXPLODE_SHAKE_PX);
  hitStop = FEEL.HIT_STOP_TIME;
  explodeFlash = FEEL.EXPLODE_FLASH_TIME;
  const s = Math.min(view.w, view.h);
  // The car's own screen position, which the rear light points already
  // record every frame, so the debris comes off the car rather than off
  // the middle of the screen.
  const cx = (carParts.rlx + carParts.rrx) * 0.5;
  const cy = (carParts.rly + carParts.rry) * 0.5;
  const n = Math.min(debris.length, Math.round(FEEL.EXPLODE_PARTICLES));
  if (n > debrisCount) debrisCount = n;
  /* Math.random, NOT rng(). This drew nine values a particle off the ROAD
     GENERATOR'S stream for four sessions, so every crash permanently
     shifted every corner generated after it: a pinned seed stopped
     reproducing its own road the moment anybody died on it, and two
     players on the same daily road who had crashed a different number of
     times were driving different roads from that point on. Nothing this
     side of the game may draw from rng(). It is the road's, and only the
     road's, and debris is decoration. */
  for (let i = 0; i < n; i++) {
    const p = debris[i];
    const a = Math.random() * Math.PI * 2;
    // Biased upward and outward, because that is what an impact throws.
    const speed = FEEL.EXPLODE_SPEED * (FEEL.EXPLODE_SPREAD
                  + (1 - FEEL.EXPLODE_SPREAD) * Math.random());
    p.x = cx + (Math.random() * 2 - 1) * s * 0.02;
    p.y = cy + (Math.random() * 2 - 1) * s * 0.02;
    p.vx = Math.cos(a) * speed;
    p.vy = Math.sin(a) * speed - speed * 0.45;
    p.r = s * FEEL.EXPLODE_SIZE * (0.35 + 0.65 * Math.random());
    p.rot = Math.random() * Math.PI;
    p.spin = (Math.random() * 2 - 1) * FEEL.EXPLODE_SPIN;
    p.life = FEEL.EXPLODE_TIME * (0.6 + 0.4 * Math.random());
    // A third of the pieces are hot: they are the fire and the rest are
    // the car. Two colours, two batched fills, and it reads as both.
    p.col = Math.random() < 0.38 ? PART_FIRE : PART_CAR;
    p.fuse = 0;
    p.drag = FEEL.EXPLODE_DRAG;
    p.grav = FEEL.EXPLODE_GRAVITY;
    p.fade = FEEL.EXPLODE_TIME;
  }
}

function updateDebris(dt) {
  if (debrisCount === 0) return;
  let live = 0, burst = 0;
  for (let i = 0; i < debrisCount; i++) {
    const p = debris[i];
    if (p.life <= 0) continue;
    p.life -= dt;
    /* A SHELL BURSTS RATHER THAN DYING. Its fuse is the climb; when it
       runs out it hands its position and a share of its momentum to a
       ring of sparks and stops existing. Collected and fired AFTER this
       loop, because a burst writes into the same pool this is walking. */
    if (p.fuse > 0) {
      p.fuse -= dt;
      if (p.fuse <= 0) {
        if (burst < burstAt.length) { burstAt[burst] = i; burst++; }
        p.life = 0;
      }
    }
    const drag = Math.exp(-dt / Math.max(0.01, p.drag));
    p.vx *= drag;
    p.vy = p.vy * drag + p.grav * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.spin * dt;
    if (p.life > 0) live++;
  }
  for (let i = 0; i < burst; i++) fireworkBurst(debris[burstAt[i]]);
  if (live === 0 && burst === 0) debrisCount = 0;
}
/* Which slots burst this frame. Fixed length, because allocating here
   would be an allocation in the update loop.

   SIZED FROM THE POOL IT INDEXES, AND IT USED TO BE SIXTY FOUR. The old
   comment said a frame cannot burst more shells than there are shells,
   which is true, and then sized the array at 64 while the pool holds 900.
   At sixty frames a second no more than a handful of fuses expire in the
   same frame and it never showed. At a big enough step they expire
   together: updateDebris wrote burstAt[burst++] with no bound, read past
   the end, and handed fireworkBurst debris[undefined], which throws on
   .x and kills the frame loop.

   That is the finale, on a five year old Chromebook, the first time
   somebody finishes the last level. It reproduced at 10fps and on all
   three stuttering profiles.

   The size is now derived from the thing it indexes rather than guessed
   at, so the sentence in the old comment is actually true of the array.
   The bound in the loop is kept anyway: this array being one number
   smaller than the pool is a crash, and a crash in the reward moment is
   worth two lines of belt and braces. */
const burstAt = new Int32Array(PARTICLE_POOL);

/* One colour per batch, in the order they are drawn. The first two are
   the explosion's and the rest are the fireworks', which are the score's
   own gold, its record pale gold, the gate colour so the burst belongs
   to the world it is over, and a near white for the hottest sparks. */
function particleColour(i) {
  if (i === PART_CAR) return COLOUR.CAR_SIDE;
  if (i === PART_FIRE) return COLOUR.HAZARD_TOP;
  if (i === PART_FW) return COLOUR.SCORE;
  if (i === PART_FW + 1) return COLOUR.SCORE_BEST;
  if (i === PART_FW + 2) return COLOUR.GATE;
  return COLOUR.CAR_LIGHT_HOT;
}

/* ==================================================================
   THE FINALE.

   Reaching the line is the hardest thing in this game and it used to be
   a full stop: the car froze on the spot and the result screen replaced
   the world. This is the arrival.

   IT IS NOT A STATE. state goes straight to FINISHED on the line exactly
   as it always did, so every input path, the pause guard, the credit
   overlay and the restart lock all keep working untouched. The finale is
   a CLOCK laid over that state, and the only thing it gates is how much
   of the result screen has arrived yet.

   THAT IS ALSO WHAT MAKES IT SKIPPABLE FOR FREE. Section 5 is not
   suspended because the moment is nice: a tap or a key at any point,
   including the first frame, winds the clock to the end and the result
   is simply there. Nothing waits on an animation, because nothing here
   is on the path to anything.

   THE SHAPE OF IT, AND THE SHAPE MATTERS MORE THAN THE VOLUME. A
   celebration that fires everything on the first frame has nowhere left
   to go and reads as one event rather than as a celebration, so this is
   built as distinct beats laid end to end. Every duration is a named
   constant on the cycler and every boundary below is DERIVED from them,
   so moving one beat moves the ones after it and the sequence can never
   develop a hole in the middle.

     a APPROACH   the closing stretch escalating continuously from the
                  final gate, so the crossing is a peak and not a
                  surprise.
     b CROSSING   hit stop, full screen flash, shake, the world slammed
                  to maximum.
     c HUSH       and the world DROPS for it. This is the beat that makes
                  the first volley land.
     d WAVE ONE   the first volley, the city flashing with it.
     e THE DONUT  the victory drift, which starts on wave one and is the
                  centrepiece of the whole thing.
     f WAVES      each volley bigger than the last, the palette walking
                  the hue wheel, the city strobing in time.
     g SETTLE     the car comes to rest.
     h AFTERGLOW  the world stays lit under the result and comes down
                  slowly rather than snapping back.

   THE TWO OVER CAPS ARE SPLIT BY WHERE THEY LAND, not by how loud they
   are. finaleFree is everything ON the road and it waits for the car to
   stop, which is hard limit one holding by construction. finaleSky is
   everything ABOVE THE HORIZON, which is sky and only sky and cannot
   cost the road a thing, so it is free from the first volley and is what
   strobes with them.
   ================================================================== */
let finaleT = -1;         // seconds since the line, negative when there is no finale
let finaleLevel = 0;      // 0 to 4, how much this run actually achieved
let finaleGlow = 0;       // 0 to 1, the world's intensity through the beats
let finaleFree = 0;       // 0 to 1, the ROAD over cap, once the car has stopped
let finaleSky = 0;        // 0 to 1, the SKY over cap, free from the first volley
let finaleStrobe = 0;     // 1 on a volley, decaying, and it is what flashes
let finaleFlash = 0;
let finaleWavesFired = 0;
let finaleShellsFired = 0;
let finaleHueDue = 0;
let finaleHueN = 0;
let finaleFirstToday = false;   // captured before the record is banked

/* THE DONUT. Its own three numbers, because the drift model belongs to
   the player and this is not the player driving. */
let finaleSpin = 0;       // radians, added into carYaw, zero outside a finale
let finaleSwing = 0;      // the phase of the lateral sweep
let finaleDriving = false;

function finaleActive() { return finaleT >= 0; }

/* The volley flash, squared so it falls away rather than fading. One
   function, read by the three sky draw sites, so a volley cannot flash
   the windows and the roof line on different curves. */
function strobe2() { return finaleStrobe * finaleStrobe; }

/* How much there is to celebrate. Four things can be true and each one
   buys another volley, a bigger burst and a longer sequence, so a clean
   run that took the record cannot look like one that squeaked over. */
function finaleLevelFor() {
  let n = 0;
  if (finishClean) n++;
  if (finishRecord) n++;
  if (finishMargin !== null && finishMargin < 0) n++;   // faster than the ghost
  if (finishClean && finaleFirstToday) n++;
  /* AND THE WHOLE DAY, CLEAN, WHICH IS THE HARDEST THING AVAILABLE. It
     is worth two because it is not one more good thing about this run,
     it is the only fact in the game that is about all of them. */
  if (dayClean()) n += 2;
  return n;
}

/* The word that says WHY it is loud, or nothing when the answer is just
   "you finished". One line, and the loudest thing available is chosen. */
function finaleBadge() {
  // Loudest first, and nothing is louder than the whole day clean.
  if (dayClean()) return 'DAY COMPLETE, CLEAN';
  if (dayDone()) return 'DAY COMPLETE';
  if (finishRecord && finishClean) return "TODAY'S BEST";
  if (finishMargin !== null && finishMargin < 0) return 'NEW FASTEST';
  if (finishClean && finaleFirstToday) return 'FIRST CLEAN FINISH';
  if (finishRecord) return 'NEW RECORD';
  return null;
}

/* ------------------------------------------------------------------
   THE BEAT BOUNDARIES. All derived, all in seconds since the line, and
   this is the only place any of them is worked out.
   ------------------------------------------------------------------ */
/* CAPTURED AT THE LINE, not read live, because the level rolls forward
   the moment the player taps and every beat boundary below would then
   move under a sequence already running. */
let finaleScale = 1;
function finaleScaleFor() {
  if (mode !== DAILY) return 1;
  const f = clamp(FEEL.FINALE_LEVEL_FLOOR, 0, 1);
  return f + (1 - f) * levelBand(level);
}

function finaleWaveCount() {
  return Math.max(1, Math.round((FEEL.FINALE_WAVES
                                 + FEEL.FINALE_WAVE_PER_LEVEL * finaleLevel)
                                * finaleScale));
}
/* THE CROSSING AND THE HUSH ARE NOT SCALED. They are the moment of
   arrival itself and they are already under a second; shrinking them
   turns the line into a thing that happened rather than a thing that
   was noticed. Everything after them is the celebration, and that is
   what an early level gets less of. */
function finaleHushEnd() { return FEEL.FINALE_CROSS + FEEL.FINALE_HUSH; }
function finaleWaveAt(n) { return finaleHushEnd() + n * FEEL.FINALE_WAVE_GAP * finaleScale; }
function finaleLastWave() { return finaleWaveAt(finaleWaveCount() - 1); }
function finaleDriftEnd() { return finaleLastWave() + FEEL.FINALE_DRIFT_TAIL * finaleScale; }
function finaleSettleEnd() { return finaleDriftEnd() + FEEL.FINALE_SETTLE * finaleScale; }
function finaleRevealAt() { return finaleSettleEnd() + FEEL.FINALE_REVEAL_AFTER; }
function finaleLitEnd() { return finaleSettleEnd() + FEEL.FINALE_AFTERGLOW * finaleScale; }

/* THE END, and it is the end of the MESSAGE rather than of the light.
   The afterglow is deliberately allowed to outlive it: the result screen
   sits over a world that is still warm and coming down, which is what
   "do not snap back to normal" means. */
function finaleEnd() { return finaleRevealAt() + FEEL.FINALE_REVEAL_TIME; }

function startFinale() {
  finaleT = 0;
  finaleScale = finaleScaleFor();
  finaleLevel = finaleLevelFor();
  finaleGlow = 1;
  finaleFree = 0;
  finaleSky = 1;
  finaleStrobe = 1;
  finaleFlash = FEEL.FINALE_FLASH_TIME;
  finaleWavesFired = 0;
  finaleShellsFired = 0;
  finaleHueDue = 0;
  finaleHueN = 0;
  finaleSpin = 0;
  finaleSwing = 0;
  finaleDriving = true;
  finaleBiome0 = biome;
  hitStop = FEEL.FINALE_HIT_STOP;
  addShake(FEEL.FINALE_SHAKE_PX);          // capped and never summed, see addShake
  audioFinishHit();
}

/* THE WHOLE THING, IN ONE CALL. Winds the clock past every beat, stops
   the car, puts the palette back and clears what is in the air. The
   result screen is then simply drawn, because everything that gates it
   reads this clock. Nothing here waits on anything: the impatient path
   is one tap to the result and a second to run it again, which is
   exactly what it was before any of this existed. */
function skipFinale() {
  finaleT = finaleEnd();
  finaleGlow = 0;
  finaleFree = 0;
  finaleSky = 0;
  finaleStrobe = 0;
  finaleFlash = 0;
  finaleDriving = false;
  finaleSpin = 0;
  hitStop = 0;
  coastSpeed = 0;
  drift.slipNorm = 0;
  finaleRestoreHue();
  clearDebris();
  clearSmoke();
}

// Is the sequence still running, and therefore still worth skipping?
function finaleRunning() {
  return state === FINISHED && finaleT >= 0 && finaleT < finaleEnd();
}

/* How much of the result screen has arrived, 0 to 1. Everything on that
   screen fades in on this one number. */
function finaleReveal() {
  if (finaleT < 0) return 1;
  return clamp((finaleT - finaleRevealAt())
               / Math.max(0.01, FEEL.FINALE_REVEAL_TIME), 0, 1);
}

/* And how much of the banner. It lands on the crossing, alone and large,
   which is the first of the two beats the message has. */
function finaleBanner() {
  if (finaleT < 0) return 1;
  return clamp((finaleT - FEEL.FINALE_BANNER_AT)
               / Math.max(0.01, FEEL.FINALE_BANNER_IN), 0, 1);
}

/* And how far it has TRAVELLED from the middle of the screen to the top
   of the result stack. Finishes exactly as the reveal begins, so the two
   never occupy the screen at once. */
function finaleSettleT() {
  if (finaleT < 0) return 1;
  const move = Math.max(0.01, FEEL.FINALE_BANNER_MOVE);
  return clamp((finaleT - (finaleRevealAt() - move)) / move, 0, 1);
}

/* THE APPROACH RAMP. Continuous from the final gate to the line, so the
   closing stretch escalates rather than the line firing on its own. It
   is the same number the crossing then slams to one, so there is no seam
   between the build and the peak. */
function finaleApproach() {
  if (state !== DRIVING || !atFinishGate() || finishSeg <= 0) return 0;
  const from = gateSegment(Math.max(1, dailyGates - 1));
  const span = Math.max(1, finishSeg - from);
  return clamp((carSegIndex - from) / span, 0, 1) * FEEL.FINALE_APPROACH;
}

/* THE ENVELOPE, and the hush is the whole reason it is a function rather
   than a hold. Up on the line, DOWN for the near silence, up again and
   held through every volley and the afterglow, then down slowly. */
function finaleEnvelope(t) {
  const cross = Math.max(0.01, FEEL.FINALE_CROSS);
  if (t <= cross) return 1;
  const hush = Math.max(0.01, FEEL.FINALE_HUSH);
  const low = clamp(FEEL.FINALE_HUSH_LEVEL, 0, 1);
  const hushEnd = finaleHushEnd();
  if (t <= hushEnd) {
    /* Down over the first half of the hush and back up over the second,
       so the quiet is a dip with a shape rather than a hole with edges. */
    const u = (t - cross) / hush;
    return u < 0.55 ? 1 + (low - 1) * (u / 0.55)
                    : low + (1 - low) * ((u - 0.55) / 0.45);
  }
  if (t <= finaleLitEnd()) return 1;
  return clamp(1 - (t - finaleLitEnd()) / Math.max(0.01, FEEL.FINALE_COOL), 0, 1);
}

/* ------------------------------------------------------------------
   THE RAINBOW VICTORY LAP.

   applyBiome is a whole palette rotation and it measured a tenth of a
   millisecond, which is why this is affordable at five hues a second.

   IT MUST NOT MOVE THE BIOME ORDER. The shuffle remembers the last hue
   it handed out so it never puts two neighbours back to back, and on the
   daily that bag is seeded from the day so two devices see the same
   twelve places. Walking the wheel here would rewrite that memory, so
   the marker is saved and put straight back. The run's own biome is
   restored when the finale ends, for the same reason.
   ------------------------------------------------------------------ */
let finaleBiome0 = 0;
function finaleHue(i) {
  const keep = lastBiomeHue;
  applyBiome(i);
  lastBiomeHue = keep;
}
function finaleRestoreHue() {
  if (biome !== finaleBiome0) finaleHue(finaleBiome0);
}

/* ------------------------------------------------------------------
   A VOLLEY. Everything that fires together fires here, in one place, so
   the fireworks, the city flash, the shake and the note cannot drift out
   of time with each other.
   ------------------------------------------------------------------ */
function finaleShells(n) {
  const shells = Math.max(1, Math.round(FEEL.FINALE_WAVE_SHELLS
                                        * (1 + FEEL.FINALE_WAVE_GROWTH * n)));
  for (let i = 0; i < shells; i++) fireworkLaunch(1);
}

function finaleWave(n) {
  finaleStrobe = 1;
  addShake(FEEL.FINALE_WAVE_SHAKE_PX);     // capped and never summed
  audioFanfareWave(n, finaleWaveCount(), finaleLevel);
}

function updateFinale(dt) {
  // The approach owns the value while the car is still driving.
  if (state === DRIVING) {
    const want = finaleApproach();
    finaleGlow += (want - finaleGlow)
                * (1 - Math.exp(-dt / Math.max(0.01, FEEL.FINALE_SLAM)));
    finaleFree = 0;
    finaleSky = finaleGlow;
    return;
  }
  if (finaleFlash > 0) finaleFlash -= dt;
  if (finaleStrobe > 0) {
    finaleStrobe = Math.max(0, finaleStrobe - dt / Math.max(0.01, FEEL.FINALE_STROBE_TIME));
  }
  if (!finaleActive()) {
    // Not a finale, so nothing here may hold the world hot.
    if (finaleGlow > 0) finaleGlow = Math.max(0, finaleGlow - dt / FEEL.FINALE_COOL);
    finaleFree = 0;
    finaleSky = 0;
    return;
  }
  finaleT += dt;
  finaleGlow = finaleEnvelope(finaleT);

  /* THE VOLLEYS, ON TWO SCHEDULES, AND THAT IS THE WHOLE TRICK. A shell
     spends FIREWORK_RISE climbing before it bursts, so launching it on
     the beat puts the burst a second LATE and the volley arrives as two
     separate events: a flash and a note, then some fireworks. Measured
     at wave one there was nothing in the sky at all when the note
     played.

     So the shells go up EARLY, by exactly the rise, and everything that
     happens instantly happens on the beat. The burst, the city flash,
     the shake and the note then land together, which is what makes a
     volley read as one thing.

     A while rather than an if on both, so a long frame fires every wave
     it stepped over instead of swallowing one. */
  while (finaleShellsFired < finaleWaveCount()
         && finaleT >= finaleWaveAt(finaleShellsFired) - FEEL.FIREWORK_RISE) {
    finaleShells(finaleShellsFired);
    finaleShellsFired++;
  }
  while (finaleWavesFired < finaleWaveCount()
         && finaleT >= finaleWaveAt(finaleWavesFired)) {
    finaleWave(finaleWavesFired);
    finaleWavesFired++;
  }

  /* THE HUE WHEEL, walked for the length of the waves and no longer.
     Every biome hue is seen, which is the point of it, and nothing in
     normal play ever changes the palette more than once a gate. */
  if (finaleT >= finaleHushEnd() && finaleT < finaleDriftEnd()
      && finaleHueN < BIOMES.length) {
    finaleHueDue -= dt;
    if (finaleHueDue <= 0) {
      finaleHueDue = Math.max(0.03, FEEL.FINALE_HUE_STEP);
      finaleHueN++;
      finaleHue(finaleBiome0 + finaleHueN);
    }
  } else if (finaleT >= finaleDriftEnd() && finaleHueN > 0) {
    // Home again as the car settles, so the result is read on the road's
    // own colour rather than on whichever hue the walk stopped on.
    finaleHueN = 0;
    finaleRestoreHue();
  }

  /* THE ROAD'S OVER CAP WAITS FOR THE CAR. Hard limit one says the road
     stays readable, and it stays readable while there is a car on it to
     read it for. The moment there is not, it comes in.

     MEASURED, AND IT WAS WRONG THE FIRST TIME. Gating this on the DONUT
     BEAT being over let the over cap reach 0.95 while the car was still
     rolling at a third of full speed through the settle, which is the
     one thing this rule exists to stop. It is gated on the car's ACTUAL
     SPEED as well now, so no amount of retiming the beats can put it
     back. */
  const stillMoving = finaleDriving
                   || coastSpeed > FEEL.SPEED * FEEL.FINALE_STOP_AT;
  const freeWant = stillMoving ? 0 : 1;
  finaleFree += (freeWant - finaleFree)
              * (1 - Math.exp(-dt / Math.max(0.01, FEEL.FINALE_FREE_TIME)));
  finaleFree *= finaleGlow;                 // and it leaves with the rest

  /* THE SKY'S DOES NOT. Nothing above the horizon can cost the road a
     thing, so the city is free to go past its ceiling from the first
     volley. This is the STEADY term only: finaleStrobe is added on top
     of it at each draw site, because folding the two together here put
     the flash inside a clamp that was already satisfied. */
  finaleSky = finaleGlow;
}

/* ==================================================================
   THE VICTORY DONUT.

   The car crosses the line and celebrates by drifting, which is the one
   thing in this finale that could not be any other game. It is driven
   through the SAME drift feedback a corner is: layTyreMarks reads the
   yaw and the slip, the smoke emitter reads the slip, so the marks and
   the smoke are the game's own, laid by something other than the player.

   THE MARKS PERSIST because they live on the road segments and the road
   has stopped moving, so what the car wrote across the finish line is
   still there under the result screen. That is the signature of the run.

   THE CAMERA IS NOT TOUCHED. Section 7 warns about overdoing motion and
   the camera has caused more complaints on this project than anything
   else, so it holds perfectly still while the car spins in front of it.
   ================================================================== */
function updateFinishRoll(dt) {
  deadFor += dt;
  const overDrift = finaleT >= finaleDriftEnd();
  if (finaleDriving && overDrift) finaleDriving = false;

  /* Winding in and out. The spin ramps up over FINALE_DRIFT_IN and back
     down over the settle, so the donut starts and ends as a movement
     rather than as a switch. */
  let env;
  if (!finaleActive()) env = 0;
  else if (finaleT < finaleHushEnd()) {
    env = clamp((finaleT - FEEL.FINALE_CROSS)
                / Math.max(0.01, FEEL.FINALE_DRIFT_IN), 0, 1);
  } else if (!overDrift) env = 1;
  else {
    env = clamp(1 - (finaleT - finaleDriftEnd())
                    / Math.max(0.01, FEEL.FINALE_SETTLE), 0, 1);
  }

  /* Forward speed. It does not stop dead: it settles to a slow travel
     for the length of the donut and only then comes to rest, which is
     what lays the marks ALONG the line rather than in one spot. */
  const want = FEEL.SPEED * FEEL.FINALE_DRIFT_SPEED * env;
  coastSpeed += (want - coastSpeed) * (1 - Math.exp(-dt / FEEL.FINALE_SETTLE));
  /* AND THE SETTLE ACTUALLY ARRIVES. A lerp toward zero approaches it
     and never reaches it, which left the car creeping at a tenth of full
     speed for the whole result screen and held the road's over cap off
     the whole time. env falls to exactly zero at the end of beat g, so
     capping the speed with it stops the car at a definite moment without
     putting a step in the deceleration. */
