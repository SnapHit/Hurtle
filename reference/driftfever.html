/* Five buttons do not fit across a narrow phone held upright without
   dropping them under the size a thumb reliably hits, and the reason this
   exists at all is landscape, where there is room to spare. So on a
   narrow portrait screen it stands down. Re evaluated on every resize,
   so rotating the handset brings it back. */
function syncFullButton() {
  // Wherever fullscreen actually works, in both orientations. Feature
  // detection is the only reason to hide it.
  fullBtn.hidden = !canFullscreen;
}
paintFull();
fullReady = true;
syncFullButton();

const soundBtn = document.getElementById('soundBtn');
const musicBtn = document.getElementById('musicBtn');
function padSwitch(btn, set) {
  btn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    btn.blur();
    firstGesture();
    set();
    applyAudio();
  });
}
padSwitch(soundBtn, function () { sfxOn = !sfxOn; });
padSwitch(musicBtn, function () {
  musicOn = !musicOn;
  /* Unmuting mid run has to be able to start the download, because the
     title screen tick is the only other place that ever does and this
     player is nowhere near it. Muting is handled by updateMusic, which
     sees musicOn go false on the next frame and stops the element. */
  if (musicOn) {
    /* A DELIBERATE PRESS CLEARS THE BACKOFF. Somebody asking for the
       music back is a better signal than any timer, so it tries again
       now rather than waiting out a retry window. */
    tune.retryIn = 0; tune.tries = 0;
    tuneWake(); tuneRevive(); tuneStart();
  }
});
paintSound();

/* Resumed from every gesture path there is, not just from the dial. A
   context can be suspended again by the tab going away, by an incoming
   call, or by the browser deciding the page was idle, and a game whose
   sound never comes back reads as broken. */
function resumeAudio() {
  if (!audio) return;
  if (audio.ac.state === 'suspended') { try { audio.ac.resume(); } catch (e) {} }
}

function audioOn() { return audio !== null && sfxOn; }

/* One envelope on a voice that is already running. cancel then hold the
   current value first, or retriggering mid decay steps and clicks. */
function pluck(g, peak, decay, when) {
  const p = g.gain;
  p.cancelScheduledValues(when);
  p.setValueAtTime(p.value, when);
  p.linearRampToValueAtTime(peak, when + FEEL.MUSIC_ATTACK);
  p.exponentialRampToValueAtTime(0.0001, when + FEEL.MUSIC_ATTACK + decay);
}

/* The sequencer. Notes are scheduled a short way in front of the clock
   rather than on the frame they fall, so a long frame cannot make the
   music stumble. Nothing here allocates. */
function updateMusic() {
  const s = TRACKS[track];
  const a = audio;
  if (!musicOn) {
    ramp(a.musicGain.gain, 0, FEEL.AUDIO_FADE_TIME);
    if (tune.playing) tuneStop();
    return;
  }

  const duck = a.ac.currentTime < a.crashUntil ? FEEL.MUSIC_DUCK : 1;

  /* THE RECORDED TRACKS, AND NOTHING IN HERE READS THE DRIVING.

     `duck` is a crash, which is a discrete event and not a style of
     driving, and it is here so the music stops fighting the crash sound.
     `tune.lvl` is the crossfade envelope between one track and the next.
     That is the whole list. a.heat is deliberately not consulted: see
     tuneWire for why the filter that used to read it was taken out. */
  if (tune.playing) {
    for (let i = 0; i < 2; i++) {
      if (!tune.g[i]) continue;
      ramp(tune.g[i].gain, FEEL.TUNE_GAIN * duck * tune.lvl[i], FEEL.AUDIO_FADE_TIME);
    }
  }

  /* AND THE PROCEDURAL TRACK IS THE FALLBACK, not a companion. It runs
     when the fetch has FAILED, and it stays quiet while a recorded track
     is on its way: a run that starts before the download lands is a
     quiet run, per the brief, not one with two pieces of music in it. */
  if (!tune.failed) {
    ramp(a.musicGain.gain, 0, FEEL.AUDIO_FADE_TIME);
    return;
  }
  ramp(a.musicGain.gain, FEEL.MUSIC_GAIN * duck, FEEL.AUDIO_FADE_TIME);
  // The layers that arrive under pressure. Levels, not switches.
  ramp(a.octLevel.gain, FEEL.MUSIC_OCTAVE_GAIN * a.heat, FEEL.AUDIO_FADE_TIME);
  ramp(a.hatLevel.gain, FEEL.MUSIC_HAT_GAIN * (0.35 + 0.65 * a.heat), FEEL.AUDIO_FADE_TIME);
  ramp(a.arpLow.frequency,
       FEEL.MUSIC_ARP_CUTOFF_LOW
       + (FEEL.MUSIC_ARP_CUTOFF_HIGH - FEEL.MUSIC_ARP_CUTOFF_LOW) * a.heat,
       FEEL.AUDIO_FADE_TIME);

  const stepTime = 60 / (FEEL.MUSIC_BPM * s.tempo) / (FEEL.MUSIC_STEPS / 4);
  const until = a.ac.currentTime + FEEL.MUSIC_LOOKAHEAD;
  // A long stall must not leave the scheduler pouring out a backlog.
  if (a.nextNote < a.ac.currentTime) a.nextNote = a.ac.currentTime;
  while (a.nextNote < until) {
    const t = a.nextNote;
    const n = a.step;
    // Bass on every other sixteenth, which is the eighth note pulse.
    if ((n & 1) === 0) {
      const b = s.bass[(n >> 1) % s.bass.length];
      a.bassOsc.frequency.setValueAtTime(semis(s.root, b), t);
      pluck(a.bassGain, FEEL.MUSIC_BASS_GAIN, FEEL.MUSIC_BASS_DECAY, t);
    }
    // The arp runs the whole sixteenth grid. That is the drive.
    const note = s.arp[n % s.arp.length];
    a.arpOsc.frequency.setValueAtTime(semis(s.root * 4, note), t);
    pluck(a.arpGain, FEEL.MUSIC_ARP_GAIN, FEEL.MUSIC_NOTE_DECAY, t);
    a.octOsc.frequency.setValueAtTime(semis(s.root * 8, note), t);
    pluck(a.octGain, 1, FEEL.MUSIC_NOTE_DECAY, t);
    // Offbeat hats, so the grid has something on the back of it.
    if ((n & 1) === 1) pluck(a.hatGain, 1, FEEL.MUSIC_HAT_DECAY, t);
    a.step = (n + 1) % 64;
    a.nextNote += stepTime;
  }
}

/* Called once a frame from the main loop, whatever the state, so the
   pause sweep and the wind down still run when nothing else does. */
function updateAudio(dt) {
  /* THE TRACK CLOCK RUNS WHETHER OR NOT THERE IS A GRAPH, because the
     on screen title and the crossfade are the element's business and the
     element exists from the title screen onward. */
  tuneUpdate(dt);
  if (!audio) return;
  const a = audio;
  if (a.ac.state === 'suspended') return;
  const fade = FEEL.AUDIO_FADE_TIME;

  ramp(a.pauseFilter.frequency,
       paused ? FEEL.AUDIO_PAUSE_CUTOFF : FEEL.AUDIO_OPEN_CUTOFF,
       FEEL.AUDIO_PAUSE_TIME);

  const driving = state === DRIVING && !paused;
  const slip = driving ? drift.slipNorm : 0;

  /* The heat the music reads. Slip and the spent budget both count, and
     it lags hard, so the arrangement swells rather than flickering.

     The multiplier is the third term, so the octave layer and the hats
     come up with the rest of the world rather than on their own schedule.
     It goes in by MAXIMUM rather than by sum, the same discipline the
     shake uses, so three loud things at once are as loud as the loudest
     and the arrangement cannot pile up. */
  const want = Math.max(slip, driving ? scrapeRisk : 0,
                        driving ? worldHeat * FEEL.HEAT_MUSIC : 0);
  a.heat += (want - a.heat) * (1 - Math.exp(-dt / FEEL.MUSIC_HEAT_TIME));

  // The skid. Level, band and Q, all off the one slip value.
  const bite = clamp((slip - FEEL.SKID_MIN_SLIP) / (1 - FEEL.SKID_MIN_SLIP), 0, 1);
  ramp(a.skidGain.gain, FEEL.SKID_GAIN_MAX * bite, fade);
  ramp(a.skidBand.frequency,
       FEEL.SKID_FREQ_LOW + (FEEL.SKID_FREQ_HIGH - FEEL.SKID_FREQ_LOW) * bite, fade);
  ramp(a.skidBand.Q, FEEL.SKID_Q_LOW + (FEEL.SKID_Q_HIGH - FEEL.SKID_Q_LOW) * bite, fade);

  // The scrape, which is a state and so is its sound.
  const rasp = driving && scraping ? 1 : 0;
  ramp(a.scrapeGain.gain,
       FEEL.SCRAPE_GAIN_MAX * rasp * (1 - FEEL.SCRAPE_RISK_LIFT * (1 - scrapeRisk)), fade);
  ramp(a.scrapeA.frequency, FEEL.SCRAPE_FREQ * (1 + 0.25 * scrapeRisk), fade);

  updateMusic();
}

/* The stings. Three moments, three shapes, one voice.

   Each is a short rising figure scheduled on the sting oscillator that is
   already running. Nothing is built here, nothing allocates, and the note
   tables are semitone offsets from the music's own root so a sting always
   belongs to the same key the arpeggio is in.

   They are all responses. There is no sting anywhere in this game that
   fires because time passed. */
const STING_BEST  = { notes: [12, 19, 24, 31], step: 0.075, gain: 0.16, decay: 0.30 };
const STING_GATE  = { notes: [12, 19, 24],     step: 0.070, gain: 0.13, decay: 0.24 };
const STING_CLOSE = { notes: [24, 31],         step: 0.055, gain: 0.09, decay: 0.16 };
const STING_CHAIN = { notes: [19, 24, 28],     step: 0.065, gain: 0.12, decay: 0.22 };
/* PASSING THE GHOST. Rising, because going past somebody is a rising
   thing, and quieter than the record break because it can happen more
   than once in a run and the record break cannot. Being passed BY the
   ghost gets nothing: it is bad news and bad news does not get a
   fanfare. */
const STING_GHOST = { notes: [14, 21, 26],     step: 0.058, gain: 0.10, decay: 0.20 };
// Up off the lip, and back down onto the road. The jump rises, the
// landing falls, so the pair reads as one arc without a word of copy.
const STING_JUMP  = { notes: [7, 14, 21, 26],  step: 0.045, gain: 0.13, decay: 0.20 };
const STING_LAND  = { notes: [26, 19, 12],     step: 0.050, gain: 0.12, decay: 0.26 };
/* And the top rung, which RISES where the ordinary landing falls. Same
   ladder, opposite direction, which is the whole of the difference the
   ear needs and it costs one line. */
const STING_LAND_BIG = { notes: [12, 19, 24, 31], step: 0.048, gain: 0.15, decay: 0.30 };

function audioSting(sting) {
  if (!audioOn()) return;
  const a = audio, root = TRACKS[track].root;
  const p = a.stingGain.gain;
  const t = a.ac.currentTime;
  p.cancelScheduledValues(t);
  p.setValueAtTime(p.value, t);
  for (let i = 0; i < sting.notes.length; i++) {
    const at = t + i * sting.step;
    a.stingOsc.frequency.setValueAtTime(semis(root * 8, sting.notes[i]), at);
    p.setValueAtTime(sting.gain, at);
    p.exponentialRampToValueAtTime(0.0001, at + sting.decay);
  }
}

/* THE LANDING, and it is two voices doing two jobs.

   THE THUMP is the crash voice at a fraction of its gain: a short low
   knock with the same fall in it, which is what a car dropping onto its
   suspension sounds like and is already the one voice in this graph that
   can make a body sound. It scales with the landing, so a routine one is
   a tap and a great one lands.

   THE STING only turns up on the top rung, rising rather than falling,
   because a note that goes up is the arcade's own way of saying that was
   good and it is the same figure the drift chain climbs. A routine
   landing does NOT get one: jumps are frequent, and a fanfare on every
   one of them is the clutter this whole section is written against. */
function audioLanding(tier, q, bad) {
  if (!audioOn()) return;
  const a = audio;
  const t = a.ac.currentTime;
  const g = a.crashGain.gain;
  const hit = FEEL.JUMP_LAND_THUMP * (bad ? 1.15 : 0.45 + 0.75 * q);
  g.cancelScheduledValues(t);
  g.setValueAtTime(0.0001, t);
  g.linearRampToValueAtTime(hit, t + 0.008);
  g.exponentialRampToValueAtTime(0.0001, t + FEEL.JUMP_LAND_THUMP_TIME);
  const f = a.crashLow.frequency;
  const from = FEEL.JUMP_LAND_THUMP_FREQ * (bad ? 0.8 : 1);
  f.cancelScheduledValues(t);
  f.setValueAtTime(from, t);
  f.exponentialRampToValueAtTime(Math.max(20, from * 0.35),
                                 t + FEEL.JUMP_LAND_THUMP_TIME);
  if (bad) { audioSting(STING_CLOSE); return; }
  if (tier >= 2) audioSting(STING_LAND_BIG);
  else if (tier >= 1) audioSting(STING_LAND);
}

/* THE FANFARE, and it is on the EFFECTS bus.

   Music is off by default for this audience, so a finish that celebrated
   in the arrangement would land silently for almost everybody. This goes
   through the sting voice, which is the effects side, so it plays for
   anybody who has turned sound on at all.

   IT PLAYS OUT RATHER THAN CUTTING. Nothing in the finish path touches
   the sting bus afterwards, unlike a crash, which cancels it deliberately
   because a sting over a wreck is wrong. The tail is allowed to ring
   under the result screen.

   IT HAS THE SAME WAVE STRUCTURE AS THE PICTURE. One stab on the line,
   then near silence, then one rising figure per volley, each starting
   higher than the last off the same ladder, and the final one given the
   long tail. Shape before volume, in the ear as well as the eye: a
   continuous fanfare under three discrete volleys would fight them. */
const FANFARE_LADDER = [0, 7, 12, 16, 19, 24, 28, 31, 36, 40, 43, 48];

/* Beat b. Two notes, low, short, and then it gets out of the way so the
   hush is actually a hush. */
function audioFinishHit() {
  if (!audioOn()) return;
  const a = audio, root = TRACKS[track].root;
  const p = a.stingGain.gain;
  const t = a.ac.currentTime;
  p.cancelScheduledValues(t);
  p.setValueAtTime(p.value, t);
  for (let i = 0; i < 2; i++) {
    const at = t + i * FEEL.FANFARE_STEP * 1.4;
    a.stingOsc.frequency.setValueAtTime(semis(root * 4, i === 0 ? 0 : 7), at);
    p.setValueAtTime(FEEL.FANFARE_GAIN, at);
    p.exponentialRampToValueAtTime(0.0001, at + FEEL.FANFARE_STEP * 2.2);
  }
}

/* Beats d and f. One figure per volley, climbing the ladder further each
   time, so wave three is audibly bigger than wave one in the same way it
   is visibly bigger. The last one rings out rather than cutting, which
   is what carries the afterglow. */
function audioFanfareWave(n, total, level) {
  if (!audioOn()) return;
  const a = audio, root = TRACKS[track].root;
  const p = a.stingGain.gain;
  const t = a.ac.currentTime;
  const last = n >= total - 1;
  const notes = Math.min(6, 3 + n + Math.max(0, level >> 1));
  const from = Math.min(FANFARE_LADDER.length - notes, n * 2);
  p.cancelScheduledValues(t);
  p.setValueAtTime(p.value, t);
  for (let i = 0; i < notes; i++) {
    const at = t + i * FEEL.FANFARE_STEP;
    a.stingOsc.frequency.setValueAtTime(semis(root * 8, FANFARE_LADDER[from + i]), at);
    p.setValueAtTime(FEEL.FANFARE_GAIN, at);
    // Every note but the last is clipped by the next; the last note of
    // the last wave is the one given the long decay.
    p.exponentialRampToValueAtTime(0.0001,
      at + (i === notes - 1 && last ? FEEL.FANFARE_TAIL : FEEL.FANFARE_STEP * 1.6));
  }
}

/* The chain blip, and it is the continuous reward for drifting.

   One step up the ladder per link, resetting when the chain breaks, which
   is the oldest and most satisfying combo feedback there is and it costs
   no screen space at all. The ladder is a major pentatonic over two
   octaves, so it climbs without ever landing on a note that argues with
   the music's own key, and past the top it stays there rather than
   running off into a whistle. */
const CHAIN_LADDER = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];

function audioChain(link) {
  if (!audioOn()) return;
  const a = audio, t = a.ac.currentTime;
  const n = CHAIN_LADDER[Math.min(link - 1, CHAIN_LADDER.length - 1)];
  a.chainOsc.frequency.setValueAtTime(semis(TRACKS[track].root * 8, n), t);
  const p = a.chainGain.gain;
  p.cancelScheduledValues(t);
  p.setValueAtTime(FEEL.CHAIN_GAIN, t);
  p.exponentialRampToValueAtTime(0.0001, t + FEEL.CHAIN_DECAY);
}

/* The crash, and then a clean wind down. One envelope and one sweep on
   voices that already exist, so nothing is built at the worst possible
   moment for the frame budget. */
function audioCrash() {
  if (!audioOn()) return;
  const a = audio, t = a.ac.currentTime;
  a.crashUntil = t + FEEL.CRASH_TIME;
  const g = a.crashGain.gain;
  g.cancelScheduledValues(t);
  g.setValueAtTime(0.0001, t);
  g.linearRampToValueAtTime(FEEL.CRASH_GAIN, t + 0.01);
  g.exponentialRampToValueAtTime(0.0001, t + FEEL.CRASH_TIME);
  const f = a.crashLow.frequency;
  f.cancelScheduledValues(t);
  f.setValueAtTime(FEEL.CRASH_FREQ_FROM, t);
  f.exponentialRampToValueAtTime(FEEL.CRASH_FREQ_TO, t + FEEL.CRASH_TIME);
  // Nothing survives the car. The skid especially must not outlive it,
  // and neither does a sting that was mid figure when it happened.
  ramp(a.skidGain.gain, 0, 0.05);
  ramp(a.scrapeGain.gain, 0, 0.05);
  a.stingGain.gain.cancelScheduledValues(t);
  ramp(a.stingGain.gain, 0, 0.05);
  a.chainGain.gain.cancelScheduledValues(t);
  ramp(a.chainGain.gain, 0, 0.05);
}


/* ==================================================================
   MAIN LOOP
   ================================================================== */
/* THE ONLY ASSIGNMENT THAT STARTS IT, and it happens once, at load. There
   is deliberately no function anywhere that sets this to anything other
   than zero, so no run, restart or continue can bring the credit back.
   See the BOOT_FADE_IN block. */
/* The three phases added up, in the one place they are ever added up. */
function bootTotal() {
  return Math.max(0, FEEL.BOOT_FADE_IN) + Math.max(0, FEEL.BOOT_HOLD)
       + Math.max(0, FEEL.BOOT_FADE_OUT);
}
let bootFlash = bootTotal();

function skipBoot() { bootFlash = 0; endBootChrome(); }

/* The chrome comes back once, whichever way the credit ends. */
let bootChromeHidden = true;
function endBootChrome() {
  if (!bootChromeHidden) return;
  bootChromeHidden = false;
  try { document.documentElement.classList.remove('booting'); } catch (e) {}
  // Whichever way the splash ended, skipped or expired, it goes now.
  if (bootShown) { bootShown = false; bootEl.hidden = true; }
  /* The pad row was display:none for the whole of the boot flash, so the
     measurement resize took of it was zero. This is the moment it exists,
     so this is the moment to measure it again. */
  resize();
}

/* THE BOOT SPLASH, which is now the publisher lockup and not type.

   Everything about WHEN it happens is unchanged and deliberately so.
   bootFlash is set once where it is declared, is never assigned anything
   but zero anywhere else, and startRun, continueRun, switchMode and
   resetSpectacle do not mention it and must not. Section 5 says restart
   is instant on the same input, and that outranks any flourish: a
   splash between attempts is exactly the thing that breaks the one more
   go loop. This function only makes the overlay agree with the
   countdown; it cannot start one.

   The element is REMOVED, not faded to transparent, so there is nothing
   left over the game for a stray opacity to bring back. */
let bootShown = true;

/* IN, HOLD, OUT, read off the ONE countdown rather than off a second
   clock, so there is still exactly one number that can end the splash
   and it is still only ever set once and zeroed.

   THE TWO FADES ARE ON DIFFERENT ELEMENTS, and that is not an oddity, it
   is the whole reason the load is covered:

     IN is the LOCKUP arriving over a field that has been opaque since
     the first paint. Fading the field in as well would uncover the page
     while the script is still parsing.
     OUT is the WHOLE THING leaving, field included, because what is
     underneath at that point is the title screen and that is what the
     player should be fading through to.

   The fade in is measured from the start and the fade out from the end,
   so the hold is simply whatever is between them and needs no arithmetic
   of its own. Both guard against a zero length phase, because both are
   tunable and zero is a reasonable thing to want: a fade of nothing
   should be a hard cut, not a division by nothing. */
function bootMarkAlpha() {
  const gone = bootTotal() - bootFlash;           // seconds since it appeared
  if (!(FEEL.BOOT_FADE_IN > 0)) return 1;
  return clamp(gone / FEEL.BOOT_FADE_IN, 0, 1);
}

function bootFieldAlpha() {
  if (!(FEEL.BOOT_FADE_OUT > 0)) return 1;
  return clamp(bootFlash / FEEL.BOOT_FADE_OUT, 0, 1);
}

function syncBoot() {
  if (bootFlash <= 0) {
    if (bootShown) { bootShown = false; bootEl.hidden = true; }
    return;
  }
  if (bootMark) bootMark.style.opacity = bootMarkAlpha();
  bootEl.style.opacity = bootFieldAlpha();
}

let lastTime = 0;

function frame(now) {
  window.requestAnimationFrame(frame);

  const rawDt = lastTime ? (now - lastTime) / 1000 : 0;
  lastTime = now;
  const dt = Math.min(rawDt, FEEL.MAX_FRAME_DELTA);

  if (noteTimer > 0) {
    noteTimer -= dt;
    if (noteTimer <= 0) noteEl.hidden = true;
  }

  if (bootFlash > 0) { bootFlash -= dt; if (bootFlash <= 0) { bootFlash = 0; endBootChrome(); } }
  updateRepeat(dt);
  updateTiltHint(dt);
  updateFlipHold(dt);
  /* Before the pause return, because the gesture is not part of the game
     and must finish whether the game is running or not. */
  updateTiltCal(dt);
  // Before the early return, so the pause sweep and the crash wind down
  // both keep running while nothing else does.
  updateAudio(dt);
  if (paused) {
    // Nothing moves and nothing is read, but the frame still runs so the
    // cover is drawn and the buttons stay live.
    clearHeldInput();
    render();
    sampleFps(rawDt);
    return;
  }
  /* The reflex input that came in during the input lock, spent the
     first frame it is allowed to be. Ahead of everything else in the
     frame, so a run that starts here runs its whole first frame rather
     than half of one. */
  spendRestartWanted();
  /* Hit stop. The world stands still for a few frames, which is what
     sells an impact as an impact, and the DEATH TIMER KEEPS RUNNING on
     real time so this cannot delay getting back in by a single
     millisecond. Input is handled in listeners, not here, so a tap during
     the freeze goes straight through. */
  if (hitStop > 0) {
    hitStop -= dt;
    deadFor += dt;
    render();
    sampleFps(rawDt);
    return;
  }
  updateTilt(dt);
  updateSteering(dt);
  update(dt);
  updateScore(dt);
  updateClock(dt);
  // After the score, because the best score break compares the number the
  // score has just settled on, and after update, because the close call
  // ledger is written by the collision pass.
  updateSpectacle(dt);
  // After the spectacle, so a ghost pass takes the drift lane only if
  // nothing louder has already claimed it this frame.
  ghostUpdate(dt);
  updateBar(dt);
  render();
  sampleFps(rawDt);
}

if (bootFlash > 0) { try { document.documentElement.classList.add('booting'); } catch (e) {} }
else bootChromeHidden = false;
// Before the first road is built, for the same reason updateDifficulty is:
// the eased ramp is one of the inputs to it.
loadRunsEver();
loadFinishedEver();
recomputeCamera();
if (debugAllowed) { setDebug(true); tiltAssert(); }
// Before the first road is built, or the title screen is generated at
// deep game difficulty and the first thing anybody sees is a lie.
updateDifficulty();
resetRoad(nextSeed());
resize();
window.requestAnimationFrame(frame);
</script>
</body>
</html>
