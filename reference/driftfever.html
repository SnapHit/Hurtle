    for (let i = h.from; i <= h.to; i++) {
      const n = i - baseIndex;
      if (n < first || n > last || !bvis[n]) continue;
      const seg = segAt(i);
      if (!seg) continue;
      any = true;
      const half = h.half / seg.hw;
      const rise = bh[n] * FEEL.HAZARD_HEIGHT;
      const y = by[n] - rise;
      const t = Math.max(1.2, bh[n] * 90);
      const l1 = bx[n] + bw[n] * (x - half), r1 = bx[n] + bw[n] * (x + half);
      ctx.moveTo(l1, y - t); ctx.lineTo(r1, y - t);
      ctx.lineTo(r1, y + t); ctx.lineTo(l1, y + t);
      ctx.closePath();
    }
  }
  if (any) { ctx.fillStyle = COLOUR.HAZARD_LIP; ctx.fill(); }
}

/* One colour, both sides of the road, every segment on the given stripe.
   from and to are fractions of the half width, measured outward from the
   centre line. */
function bandPass(first, last, wantLight, from, to, colour) {
  ctx.beginPath();
  let any = false;
  for (let n = first; n <= last; n++) {
    if (!bvis[n] || blight[n] !== wantLight) continue;
    any = true;
    const y1 = by[n], y2 = by[n + 1] - 1;
    const a1 = bw[n] * from, a2 = bw[n + 1] * from;
    const c1 = bw[n] * to, c2 = bw[n + 1] * to;
    ctx.moveTo(bx[n] - c1, y1); ctx.lineTo(bx[n] - a1, y1);
    ctx.lineTo(bx[n + 1] - a2, y2); ctx.lineTo(bx[n + 1] - c2, y2);
    ctx.closePath();
    ctx.moveTo(bx[n] + c1, y1); ctx.lineTo(bx[n] + a1, y1);
    ctx.lineTo(bx[n + 1] + a2, y2); ctx.lineTo(bx[n + 1] + c2, y2);
    ctx.closePath();
  }
  if (!any) return;
  ctx.fillStyle = colour;
  ctx.fill();
}

function surfacePass(first, last, wantLight, colour) {
  ctx.beginPath();
  let any = false;
  for (let n = first; n <= last; n++) {
    if (!bvis[n] || blight[n] !== wantLight) continue;
    any = true;
    const y1 = by[n], y2 = by[n + 1] - 1;
    ctx.moveTo(bx[n] - bw[n], y1); ctx.lineTo(bx[n] + bw[n], y1);
    ctx.lineTo(bx[n + 1] + bw[n + 1], y2); ctx.lineTo(bx[n + 1] - bw[n + 1], y2);
    ctx.closePath();
  }
  if (!any) return;
  ctx.fillStyle = colour;
  ctx.fill();
}

function lanePass(first, last) {
  const f = FEEL.LANE_DASH_FRACTION;
  ctx.beginPath();
  let any = false;
  for (let n = first; n <= last; n++) {
    if (!bvis[n] || !blight[n]) continue;
    any = true;
    const y1 = by[n], y2 = by[n + 1] - 1;
    const l1 = bw[n] * f, l2 = bw[n + 1] * f;
    ctx.moveTo(bx[n] - l1, y1); ctx.lineTo(bx[n] + l1, y1);
    ctx.lineTo(bx[n + 1] + l2, y2); ctx.lineTo(bx[n + 1] - l2, y2);
    ctx.closePath();
  }
  if (!any) return;
  ctx.fillStyle = COLOUR.LANE;
  ctx.fill();
}

/* The wide faint half of the glow, over the road and the void alike so it
   spills both ways. One fill for both edges and the whole draw distance.

   THE HEAT HALF IS A SEPARATE PASS AND IT SKIPS THE LIP, and that is not
   tidiness, it is hard limit one holding. The glow band covers the lip,
   so simply raising its alpha with the multiplier DARKENS the brightest
   thing on screen: measured, the lip fell from 207 to 182 in luminance
   going from a multiplier of one to the cap, while the car sat unmoved at
   246. That is the spectacle making the road harder to read, which is
   exactly the failure the limits are there to catch.

   So the resting pass is untouched, to the pixel, and the heat pass is
   drawn inboard and outboard of the lip only. The edge therefore gains
   width and glow as the multiplier climbs and the lip itself can only
   ever gain luminance, from the hot ramp on its dim stripe. */
function edgeGlowPass(first, last) {
  glowBandPath(first, last, EDGE_OUT - FEEL.EDGE_LIP_FRACTION - FEEL.EDGE_GLOW_SPREAD,
               EDGE_OUT + FEEL.EDGE_GLOW_SPREAD);
  ctx.globalAlpha = FEEL.EDGE_GLOW_ALPHA;
  ctx.fillStyle = EDGE_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
  if (worldHeat <= 0.01) return;

  const lip = FEEL.EDGE_LIP_FRACTION;
  /* PAST THE CEILING, and only once the car has stopped. worldHeat is
     already one at this point, so these two terms are the whole of what
     the finale adds: an edge burning wider and brighter than a
     multiplier of twelve can buy. finaleFree is zero for every frame the
     car is still rolling, which is hard limit one holding. */
  const spread = FEEL.EDGE_GLOW_SPREAD
               * (1 + FEEL.HEAT_EDGE_SPREAD * worldHeat
                    + FEEL.FINALE_EDGE_SPREAD * finaleFree);
  ctx.beginPath();
  glowBandPath(first, last, EDGE_OUT - lip - spread, EDGE_OUT - lip, true);
  glowBandPath(first, last, EDGE_OUT, EDGE_OUT + spread, true);
  ctx.globalAlpha = Math.min(1, FEEL.HEAT_EDGE_GLOW * worldHeat
                                + FEEL.FINALE_EDGE_GLOW * finaleFree);
  ctx.fillStyle = EDGE_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* Both edges, the whole draw distance, between two fractions of the half
   width. Pass keep to add to a path already open rather than start one. */
function glowBandPath(first, last, inner, outer, keep) {
  if (!keep) ctx.beginPath();
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    // The band is under a pixel from here on, so it costs fill rate and
    // shows nothing. Widths shrink with distance, so this can break.
    if (bw[n] < GLOW_CULL_PX) break;
    const y1 = by[n], y2 = by[n + 1] - 1;
    const a1 = bw[n] * inner, a2 = bw[n + 1] * inner;
    const c1 = bw[n] * outer, c2 = bw[n + 1] * outer;
    ctx.moveTo(bx[n] - c1, y1); ctx.lineTo(bx[n] - a1, y1);
    ctx.lineTo(bx[n + 1] - a2, y2); ctx.lineTo(bx[n + 1] - c2, y2);
    ctx.closePath();
    ctx.moveTo(bx[n] + c1, y1); ctx.lineTo(bx[n] + a1, y1);
    ctx.lineTo(bx[n + 1] + a2, y2); ctx.lineTo(bx[n + 1] + c2, y2);
    ctx.closePath();
  }
}

/* The bleed. Hangs off the outer bottom corner of the slab, downward and
   outward onto the void, and dies fast.

   Its top edge lies exactly on the slab's outer bottom corner and it only
   ever goes down and out from there, so it never touches the drivable
   surface, the lip or the shoulder and cannot move any of the numbers the
   hard rule is about. */
function edgeBleedPass(first, last) {
  // Zero means off, and off costs nothing rather than three transparent
  // fills. The cycler can take it to zero, so this is the real path.
  if (FEEL.EDGE_BLEED_ALPHA <= 0) return;
  const w = view.w;
  const bands = Math.max(1, Math.round(FEEL.EDGE_BLEED_BANDS));
  const px = Math.min(w, view.h) * FEEL.EDGE_BLEED_PX;

  /* STROKED, NOT FILLED, and that is a performance decision with a
     measurement behind it. The first version filled a quad per segment
     per band: about 380 subpaths in each of three paths, and it measured
     between two and five milliseconds a frame for roughly six hundred
     visible pixels, because the rasteriser pays for path complexity and
     bounding boxes rather than for lit pixels. On a five year old Celeron
     that is a tenth of the frame budget for a subtle glow, which is not a
     trade worth making.

     The edge is a line, so stroke the line. Two polylines, one per side,
     in a single path, offset DOWNWARD by half the stroke width so the
     whole stroke lands below the slab's outer corner and none of it
     spills back up onto the road. Wider and fainter first, so the stack
     is the falloff exactly as before.

     The width is in screen pixels rather than scaled per segment, which
     is the one thing given up by stroking. It is the right thing to give
     up: a spill that is tight to the edge everywhere is what was asked
     for, and a spill that grew with the near geometry was the part most
     at risk of reading as ground. */
  ctx.lineCap = 'butt';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = EDGE_GLOW_FILL;
  for (let k = bands; k >= 1; k--) {
    const t = k / bands;
    const lw = px * t;
    let any = false;
    ctx.beginPath();
    for (const side of [-1, 1]) {
      let started = false;
      for (let n = first; n <= last; n++) {
        if (!bvis[n]) continue;
        if (bw[n] < GLOW_CULL_PX) break;
        const x = bx[n] + side * (bw[n] * EDGE_OUT + bf[n]);
        // Off the side of the screen near the camera, where the corner is
        // hundreds of pixels wide of the frame and costs the most.
        if (x < -lw || x > w + lw) { started = false; continue; }
        const y = by[n] + bt[n] + lw * 0.5;
        if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
        any = true;
      }
    }
    if (!any) continue;
    ctx.lineWidth = lw;
    ctx.globalAlpha = FEEL.EDGE_BLEED_ALPHA;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
}

/* A second glowing line, along the bottom of the slab. Two lit lines with
   darkness between them state the thickness outright, where one line and
   an occluded silhouette only implied it. */
function drawSlabUnderline(first, last) {
  const scaleW = FEEL.SLAB_BOTTOM_WIDTH / FEEL.ROAD_HALF_WIDTH_BASE;
  const scaleG = FEEL.SLAB_BOTTOM_GLOW / FEEL.ROAD_HALF_WIDTH_BASE;
  underlinePath(first, last, scaleG);
  ctx.globalAlpha = FEEL.EDGE_GLOW_ALPHA;
  ctx.fillStyle = SLAB_BOTTOM_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
  underlinePath(first, last, scaleW);
  ctx.fillStyle = COLOUR.SLAB_BOTTOM;
  ctx.fill();
}

function underlinePath(first, last, thick) {
  ctx.beginPath();
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    if (bw[n] < GLOW_CULL_PX) break;
    const o1 = bw[n] * EDGE_OUT + bf[n], o2 = bw[n + 1] * EDGE_OUT + bf[n + 1];
    const y1 = by[n] + bt[n], y2 = by[n + 1] + bt[n + 1];
    const t1 = bw[n] * thick, t2 = bw[n + 1] * thick;
    ctx.moveTo(bx[n] - o1, y1 - t1); ctx.lineTo(bx[n] - o1, y1 + t1);
    ctx.lineTo(bx[n + 1] - o2, y2 + t2); ctx.lineTo(bx[n + 1] - o2, y2 - t2);
    ctx.closePath();
    ctx.moveTo(bx[n] + o1, y1 - t1); ctx.lineTo(bx[n] + o1, y1 + t1);
    ctx.lineTo(bx[n + 1] + o2, y2 + t2); ctx.lineTo(bx[n + 1] + o2, y2 - t2);
    ctx.closePath();
  }
}

/* Posts down both edges. Three batched fills for the lot: the faint glow,
   the ordinary posts and the taller marker posts. */
function drawPylons(first, last, baseIndex, w) {
  const spacing = FEEL.PYLON_SPACING;
  const scaleH = 1 / FEEL.ROAD_HALF_WIDTH_BASE;
  /* The pylons pulsing with the multiplier. The pulse rides the glow pass
     only, so the posts themselves never move or change size and the road
     edge outboard of which they stand is untouched. heatPulse is exactly
     1 at a multiplier of one, so at rest this is the old drawing to the
     pixel and there is no pulse to notice. */
  const glow = FEEL.PYLON_GLOW_SPREAD * (1 + FEEL.HEAT_PYLON_SPREAD * worldHeat
                                            + FEEL.FINALE_PYLON_SPREAD * finaleFree);
  pylonPath(first, last, baseIndex, spacing, glow, scaleH, 2);
  ctx.globalAlpha = Math.min(1,
    (FEEL.PYLON_GLOW_ALPHA + FEEL.HEAT_PYLON_GLOW * worldHeat) * heatPulse
    + FEEL.FINALE_PYLON_GLOW * finaleFree);
  ctx.fillStyle = PYLON_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
  pylonPath(first, last, baseIndex, spacing, 1, scaleH, 0);
  ctx.fillStyle = COLOUR.PYLON;
  ctx.fill();
  pylonPath(first, last, baseIndex, spacing, 1, scaleH, 1);
  ctx.fillStyle = COLOUR.PYLON_MAJOR;
  ctx.fill();

  // The lit heads, item 9. Two more batched fills for every lamp in
  // shot, wide and faint then solid, on top of the posts they stand on.
  drawLampHeads(first, last, baseIndex, spacing, scaleH);
}

/* THE HEADS, AS A PAINTER OF THEIR OWN AND NOT TWO FILLS INSIDE
   drawPylons. Suppressing a painter is how everything in this file is
   measured, and stubbing lampHeadPath alone would have left the marker
   posts' path still open with two fills about to land on it: the posts
   would have been redrawn in the lamp colour and the measurement would
   have reported the heads at the brightness of the posts. Only whole
   painters may be stubbed, which this project has paid for before. */
function drawLampHeads(first, last, baseIndex, spacing, scaleH) {
  lampHeadPath(first, last, baseIndex, spacing, FEEL.LAMP_HEAD_GLOW, scaleH);
  ctx.globalAlpha = FEEL.LAMP_HEAD_GLOW_ALPHA;
  ctx.fillStyle = COLOUR.LAMP;
  ctx.fill();
  ctx.globalAlpha = 1;
  lampHeadPath(first, last, baseIndex, spacing, 1, scaleH);
  ctx.fill();
}

/* THE LAMP HEADS, ITEM 9. Walked with the same test pylonPath uses, so a
   head exists exactly where a marker post exists and the two can never
   disagree about spacing, and thinned again by LAMP_EVERY so only every
   nth marker post carries one.

   IT DOES NOT MOVE WITH THE MULTIPLIER. The pylon glow pulses with the
   heat and the finale opens it right up; a street lamp does neither,
   because a lamp that brightens when you drift is a scoring readout
   rather than a light source, and the whole point of item 9 is that the
   road is being LIT by something that exists in the world. */
function lampHeadPath(first, last, baseIndex, spacing, widen, scaleH) {
  const every = Math.max(1, Math.round(FEEL.PYLON_MAJOR_EVERY
                                       * Math.max(1, Math.round(FEEL.LAMP_EVERY))));
  ctx.beginPath();
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    const idx = baseIndex + n;
    if (idx % spacing !== 0) continue;
    if (((idx / spacing) % every) !== 0) continue;

    const rise = bw[n] * FEEL.PYLON_MAJOR_HEIGHT * scaleH;
    if (rise < FEEL.PYLON_MIN_PX) continue;
    const hh = bw[n] * FEEL.LAMP_HEAD_HEIGHT * scaleH * 0.5;
    const hx = Math.max(FEEL.LAMP_HEAD_MIN_PX,
                        bw[n] * FEEL.LAMP_HEAD_WIDTH * scaleH * 0.5) * widen;
    const hy = Math.max(FEEL.LAMP_HEAD_MIN_PX, hh) * widen;
    const side = lampSide(idx, spacing);
    const out = side * bw[n] * (EDGE_OUT + FEEL.PYLON_OUT);
    // Centred on the top of the post, so the head caps it rather than
    // floating above it.
    const cy = by[n] - rise + hh;
    ctx.rect(bx[n] + out - hx, cy - hy, hx * 2, hy * 2);
  }
}

/* WHICH VERGE THIS LAMP STANDS ON. Alternating, off the lamp's own index
   rather than off anything that moves, so a given post is lit from the
   same side every frame of every run and the row reads as a street
   rather than as a flicker. */
function lampSide(idx, spacing) {
  const p = Math.round(idx / spacing / Math.max(1, Math.round(FEEL.PYLON_MAJOR_EVERY))
                       / Math.max(1, Math.round(FEEL.LAMP_EVERY)));
  return (p % 2) ? 1 : -1;
}

/* THE LIGHT ON THE GROUND. Item 9, and the one thing in this whole pass
   that is unavoidably ON the drivable road.

   ONE RADIAL GRADIENT, BUILT ONCE PER PALETTE REBUILD and filled through
   a translate and a scale, so a pool costs a single fill and allocates
   nothing. That is the pattern the car's own pool already uses.

   THE WIDTH IS CLAMPED IN FRACTIONS OF THE HALF WIDTH, NOT IN WORLD
   UNITS, because the rule it has to keep is a rule about the picture and
   not about the road: it may never reach the centre line, at any
   distance, on any screen. A world sized pool keeps that promise near
   the camera and breaks it at the planning horizon, where the half width
   is a few pixels and everything is on top of everything else.

   AND CAPPED IN PIXELS AT THE NEAR END, because a radial gradient costs
   per pixel: the cost of this feature is the area of the closest pool
   and has almost nothing to do with how many of them are in shot. */
function lampPoolPass(first, last, baseIndex, spacing) {
  if (!LAMP_POOL_GRAD || FEEL.LAMP_POOL_ALPHA <= 0) return;
  const every = Math.max(1, Math.round(FEEL.PYLON_MAJOR_EVERY
                                       * Math.max(1, Math.round(FEEL.LAMP_EVERY))));
  const outF = FEEL.LAMP_POOL_OUT;
  const room = outF - FEEL.LANE_DASH_FRACTION - FEEL.LAMP_POOL_GAP;
  if (room <= 0) return;
  ctx.save();
  ctx.globalAlpha = FEEL.LAMP_POOL_ALPHA;
  ctx.fillStyle = LAMP_POOL_GRAD;
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    const idx = baseIndex + n;
    if (idx % spacing !== 0) continue;
    if (((idx / spacing) % every) !== 0) continue;
    const rx = Math.min(bw[n] * FEEL.LAMP_POOL_SIZE, bw[n] * room,
                        FEEL.LAMP_POOL_MAX_PX);
    if (rx < FEEL.LAMP_POOL_MIN_PX) continue;
    // The same side the head is on, or the light would be coming from
    // the wrong place, which is the one mistake a lighting pass cannot
    // survive.
    ctx.save();
    ctx.translate(bx[n] + lampSide(idx, spacing) * bw[n] * outF, by[n]);
    ctx.scale(rx, rx * FEEL.LAMP_POOL_SQUASH);
    ctx.beginPath();
    ctx.arc(0, 0, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* THE WET SHEEN, ITEM 7. surfacePass's shape, the far segments only,
   filled with the cached vertical gradient.

   THE CULL IS BACKWARDS FROM THE GLOW'S ON PURPOSE. edgeGlowPass stops
   when segments get too SMALL; this stops when they get too BIG, because
   the whole point is to stay on the cheap far geometry and off the near
   quads that cost the frame. The loop breaks rather than continues: the
   road only gets wider toward the camera, so once one segment is over
   the threshold every segment after it is too. */
function wetSheenPass(first, last) {
  if (!wetSheenGradient || FEEL.WET_SHEEN_ALPHA <= 0) return;
  ctx.beginPath();
  let any = false;
  for (let n = last; n >= first; n--) {
    if (!bvis[n]) continue;
    if (bw[n] > FEEL.WET_SHEEN_FROM) break;
    any = true;
    const y1 = by[n], y2 = by[n + 1] - 1;
    ctx.moveTo(bx[n] - bw[n], y1); ctx.lineTo(bx[n] + bw[n], y1);
    ctx.lineTo(bx[n + 1] + bw[n + 1], y2); ctx.lineTo(bx[n + 1] - bw[n + 1], y2);
    ctx.closePath();
  }
  if (!any) return;
  ctx.fillStyle = wetSheenGradient;
  ctx.fill();
}

/* THE STREAKS THE POSTS THROW ON A WET ROAD. Item 2.

   Walked with the same test pylonPath uses, so a streak exists exactly
   where a post exists and the two can never disagree about spacing.

   CLAMPED INBOARD OF THE LIP AND OUTBOARD OF THE LANE DASHES. The post
   stands outboard of the road at EDGE_OUT + PYLON_OUT; its reflection
   has to be ON the road, so the near end is pulled toward the middle,
   and both ends are then clamped into the band between the lane dash
   fraction and the inner edge of the lip. That is the one part of the
   surface where a bright smear cannot be read as either of the two
   things the player steers by. */
function reflectPass(first, last, baseIndex, spacing) {
  const lip = FEEL.EDGE_LIP_FRACTION;
  const inner = FEEL.LANE_DASH_FRACTION;
  const outer = EDGE_OUT - lip;
  ctx.beginPath();
  let any = false;
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    const idx = baseIndex + n;
    if (idx % spacing !== 0) continue;
    const m = n - FEEL.REFLECT_SEGMENTS;
    if (m < first || !bvis[m]) continue;

    const major = ((idx / spacing) % FEEL.PYLON_MAJOR_EVERY) === 0;
    const wWorld = major ? FEEL.PYLON_MAJOR_WIDTH : FEEL.PYLON_WIDTH;
    const scaleH = 1 / FEEL.ROAD_HALF_WIDTH_BASE;
    // The post's own half width at each end, the near one widened.
    const h0 = Math.max(FEEL.REFLECT_MIN_PX, bw[n] * wWorld * scaleH * 0.5);
    const h1 = Math.max(FEEL.REFLECT_MIN_PX,
                        bw[m] * wWorld * scaleH * 0.5 * FEEL.REFLECT_WIDEN);
    for (let side = -1; side <= 1; side += 2) {
      /* Both ends as a FRACTION of the local half width, so the clamp is
         in the same units the lip and the lane are quoted in and cannot
         drift with the projection.

         THE QUAD'S OWN WIDTH IS PART OF THE CLAMP, AND LEAVING IT OUT
         WAS A REAL FAILURE. Clamping the CENTRE line to the inner edge
         of the lip put half the quad inside the lip, and because the lip
         is laid down before the surface in this file, a pass drawn after
         the surface paints straight over it. Measured: the streaks came
         out at 206.3 against a road edge that never draws below 199.7,
         so the reflection was brighter than the thing it may not
         outrank, on a handful of pixels right where the eye is looking.
         The half width is converted into the same fractional units and
         subtracted before the clamp. */
      const g0 = h0 / Math.max(1e-6, bw[n]);
      const g1 = h1 / Math.max(1e-6, bw[m]);
      let f0 = clamp(EDGE_OUT + FEEL.PYLON_OUT, inner + g0, outer - g0);
      let f1 = clamp(EDGE_OUT + FEEL.PYLON_OUT - FEEL.REFLECT_INBOARD,
                     inner + g1, outer - g1);
      if (outer - g0 <= inner + g0 || outer - g1 <= inner + g1) continue;
      any = true;
      const x0 = bx[n] + side * bw[n] * f0, y0 = by[n];
      const x1 = bx[m] + side * bw[m] * f1, y1 = by[m];
      ctx.moveTo(x0 - h0, y0); ctx.lineTo(x0 + h0, y0);
      ctx.lineTo(x1 + h1, y1); ctx.lineTo(x1 - h1, y1);
      ctx.closePath();
    }
  }
  if (!any) return;
  ctx.globalAlpha = FEEL.REFLECT_ALPHA;
  ctx.fillStyle = PYLON_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* which: 0 ordinary posts, 1 marker posts, 2 both. */
function pylonPath(first, last, baseIndex, spacing, widen, scaleH, which) {
  ctx.beginPath();
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    const idx = baseIndex + n;
    if (idx % spacing !== 0) continue;
    const major = ((idx / spacing) % FEEL.PYLON_MAJOR_EVERY) === 0;
    if (which !== 2 && (which === 1) !== major) continue;

    const hWorld = major ? FEEL.PYLON_MAJOR_HEIGHT : FEEL.PYLON_HEIGHT;
    const wWorld = (major ? FEEL.PYLON_MAJOR_WIDTH : FEEL.PYLON_WIDTH) * widen;
    // Heights use the horizontal scale, as everything standing up does.
    const rise = bw[n] * hWorld * scaleH;
    if (rise < FEEL.PYLON_MIN_PX) continue;
    const half = bw[n] * wWorld * scaleH * 0.5;
    const out = bw[n] * (EDGE_OUT + FEEL.PYLON_OUT);
    const base = by[n];
    const top = base - rise;

    ctx.moveTo(bx[n] - out - half, top); ctx.lineTo(bx[n] - out + half, top);
    ctx.lineTo(bx[n] - out + half, base); ctx.lineTo(bx[n] - out - half, base);
    ctx.closePath();
    ctx.moveTo(bx[n] + out - half, top); ctx.lineTo(bx[n] + out + half, top);
    ctx.lineTo(bx[n] + out + half, base); ctx.lineTo(bx[n] + out - half, base);
    ctx.closePath();
  }
}

/* The sides of the slab, every visible one batched into a single path so
   the whole cliff costs one fill rather than one per segment.

   These are drawn on both sides regardless of which way the road turns.
   Strictly the outside wall of a corner faces away from the camera and
   should not be there, and on a dead straight road neither wall is
   visible at all, because a vertical plane seen from directly behind and
   above is exactly edge on. Drawing only the true ones would mean the
   road has no thickness on any straight, which is the flat decal the
   whole change is meant to avoid. So this is a stylisation and the one
   place here where the look wins over the geometry. */
function drawWalls(count) {
  ctx.beginPath();
  for (let n = 0; n < count; n++) {
    if (bz[n] <= CAMERA_DEPTH) continue;
    if (by[n + 1] >= by[n]) continue;
    if (bw[n] < WALL_CULL_PX) break;
    const o1 = bw[n] * EDGE_OUT, o2 = bw[n + 1] * EDGE_OUT;
    const l1 = bx[n] - o1, l2 = bx[n + 1] - o2;
    const r1 = bx[n] + o1, r2 = bx[n + 1] + o2;
    const y1 = by[n], y2 = by[n + 1];
    const d1 = y1 + bt[n], d2 = y2 + bt[n + 1];
    const f1 = bf[n], f2 = bf[n + 1];
    ctx.moveTo(l1, y1); ctx.lineTo(l2, y2);
    ctx.lineTo(l2 - f2, d2); ctx.lineTo(l1 - f1, d1);
    ctx.closePath();
    ctx.moveTo(r1, y1); ctx.lineTo(r2, y2);
    ctx.lineTo(r2 + f2, d2); ctx.lineTo(r1 + f1, d1);
    ctx.closePath();
  }
  ctx.fillStyle = COLOUR.WALL;
  ctx.fill();
}

/* The trail. Two lines from the rear wheel contact points, so they still
   scissor apart under drift, but they now fade out behind the car and run
   from cool to hot with the slip that laid them. A run driven on the
   limit leaves a brighter line than a tidy one, which is the whole point:
   the prettiest thing on screen is the thing risk buys. */
/* Deep blue, through cyan, to a hot white. Precomputed, because this is
   read once per marked segment.

   It went through magenta while the road was blue, and magenta was the
   wrong choice the moment the road turned warm: it is close enough in hue
   to the asphalt that the mark stopped separating from it. Blue to cyan
   to white is the far side of the wheel from every road colour, and it
   also puts the intensity in value, which is what survives a hue rotation
   with the mark still legible against the surface. */
const TRAIL_RAMP = [];
const TRAIL_STOPS = ['TRAIL_0', 'TRAIL_1', 'TRAIL_2', 'TRAIL_3', 'TRAIL_4'];

/* ==================================================================
   THE CARS, AND THERE IS NO GARAGE.

   Handoff section 9 forbids new screens and BRIEF.md section 12 forbids
   menus, so this is not one: it is a ladder of cosmetic variants, earned
   by playing, cycled by one small control on the title screen that
   nobody has to touch. One tap to play still stands, because the tap
   anywhere is still the tap that plays.

   COSMETIC ONLY, AND THIS IS THE PART THAT IS NOT NEGOTIABLE. Nothing
   here touches handling, speed, grip, scoring or the clock. Handoff
   section 4 kills anything that makes the daily non comparable between
   two players, because that breaks the ghost and the share at once, and
   a car that gripped better would do exactly that.

   WHAT MAY VARY AND WHAT MAY NOT. The body colour is derived from the
   biome at maximum hue separation and that is what keeps the car
   findable against all twelve. It is not on this list. What varies is
   everything not doing the finding: the spoiler's shape, the rims, the
   light bar, the panel seams and the cool end of the tyre marks.

   TWO CURRENCIES, BOTH ALREADY COUNTED. finishedEver is cumulative
   levels finished, which session B already stored and nothing read.
   cleanDaysEver is days completed with every level clean, which is the
   hardest thing in this game and earned nothing at all until now. The
   rare cars are on that one.

   SIX, WELL SPACED, because few that look different beats many that look
   the same. wing: 0 none, 1 the stock blade, 2 a low ducktail, 3 a wide
   thin blade.
   ================================================================== */
const CARS = [
  { name: 'STOCK',      need: 0,  days: 0, wing: 1,
    rim: 'CAR_RIM',      light: 'CAR_LIGHT',       seam: 'CAR_SEAM',
    trail: 'TRAIL_0' },
  { name: 'DUCKTAIL',   need: 3,  days: 0, wing: 2,
    rim: 'CAR_RIM_DARK', light: 'CAR_LIGHT',       seam: 'CAR_SEAM',
    trail: 'TRAIL_0' },
  { name: 'WIDEBODY',   need: 10, days: 0, wing: 3,
    rim: 'CAR_RIM',      light: 'CAR_LIGHT_AMBER', seam: 'CAR_SEAM_LIGHT',
    trail: 'TRAIL_0' },
  { name: 'SLICKTOP',   need: 25, days: 0, wing: 0,
    rim: 'CAR_RIM_DARK', light: 'CAR_LIGHT_COOL',  seam: 'CAR_SEAM_LIGHT',
    trail: 'TRAIL_ALT' },
  { name: 'NIGHT SHIFT', need: 0, days: 1, wing: 2,
    rim: 'CAR_RIM_DARK', light: 'CAR_LIGHT_COOL',  seam: 'CAR_SEAM',
    trail: 'TRAIL_ALT' },
  { name: 'GOLD CHAIN', need: 0,  days: 5, wing: 3,
    rim: 'CAR_RIM_GOLD', light: 'CAR_LIGHT_AMBER', seam: 'CAR_SEAM_GOLD',
    trail: 'TRAIL_0' }
];

/* HOW MANY LEVELS HAVE EVER BEEN FINISHED, and how many whole days have
   been finished clean. Both wrapped, both surviving storage being
   refused: with no memory the player simply drives the stock car for
   ever, which is the required behaviour and not a degradation. */
let cleanDaysEver = (function () {
  const raw = storeGet('cleandays');
  const n = raw === null ? 0 : parseInt(raw, 10);
  return isFinite(n) && n > 0 ? n : 0;
})();
let carPick = (function () {
  const raw = storeGet('car');
  const n = raw === null ? 0 : parseInt(raw, 10);
  return isFinite(n) && n > 0 ? n : 0;
})();
/* Named on the completion screen when it happens, cleared when the next
   run starts, because the moment IS the reward and a badge that lingers
   into the following run stops being a moment. */
let carJustUnlocked = '';

function carUnlocked(i) {
  const c = CARS[i];
  if (!c) return false;
  return finishedEver >= c.need && cleanDaysEver >= c.days;
}
function carsUnlocked() {
  let n = 0;
  for (let i = 0; i < CARS.length; i++) if (carUnlocked(i)) n++;
  return n;
}
/* THE ACTIVE CAR IS ALWAYS ONE THAT IS ACTUALLY UNLOCKED. carPick comes
   out of storage, which a previous version of the ladder may have
   written, so it is checked rather than trusted: an index naming a car
   this player has not earned falls back to stock rather than handing out
   a reward for editing localStorage. */
function activeCar() {
  const i = Math.round(carPick);
  return (i >= 0 && i < CARS.length && carUnlocked(i)) ? CARS[i] : CARS[0];
}
/* The next unlocked car after this one, wrapping. This is the whole of
   the cycle control's behaviour. */
function nextCar() {
  const from = Math.max(0, Math.min(CARS.length - 1, Math.round(carPick)));
  for (let k = 1; k <= CARS.length; k++) {
    const i = (from + k) % CARS.length;
    if (carUnlocked(i)) return i;
  }
  return 0;
}
function pickCar(i) {
  carPick = i;
  storeSet('car', String(i));
  // The cosmetics are cached fills and ramps, so they are rebuilt here
  // for exactly the reason everything else in that function is.
  rebuildDerivedColours();
}


function trailColour(intensity) {
  let i = Math.round(intensity * (TRAIL_RAMP.length - 1));
  if (i < 0) i = 0; else if (i >= TRAIL_RAMP.length) i = TRAIL_RAMP.length - 1;
  return TRAIL_RAMP[i];
}

function drawTrail(first, last, baseIndex) {
  const base = FEEL.ROAD_HALF_WIDTH_BASE;
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    const s = segAt(baseIndex + n);
    if (!s || s.ma <= 0) continue;
    // Age behind the car, which is what fades it.
    const age = carSegIndex - s.index;
    if (age < 0) continue;
    const fade = 1 - age / FEEL.TRAIL_FADE_SEGMENTS;
    if (fade <= 0) continue;

    const mw = FEEL.TYRE_MARK_WIDTH * base / s.hw;
    const colour = trailColour(s.ma);
    const y1 = by[n], y2 = by[n + 1] - 1;
    const w1 = bw[n], w2 = bw[n + 1];

    /* The donut's signature burns. The marks the celebration lays are
       the same marks a corner lays, drawn by the same two passes, and
       the finale simply lifts both: what the car wrote across the finish
       line is meant to be the loudest thing left on the road when the
       result arrives over it. */
    const lift = 1 + FEEL.FINALE_MARK_GLOW * finaleGlow;
    ctx.fillStyle = colour;
    ctx.globalAlpha = Math.min(1,
      s.ma * FEEL.TYRE_MARK_MAX_ALPHA * FEEL.TRAIL_GLOW_ALPHA * fade * lift);
    trailQuads(s, mw * FEEL.TRAIL_GLOW_SPREAD, bx[n], bx[n + 1], w1, w2, y1, y2);
    ctx.globalAlpha = Math.min(1, s.ma * FEEL.TYRE_MARK_MAX_ALPHA * fade * lift);
    trailQuads(s, mw, bx[n], bx[n + 1], w1, w2, y1, y2);
  }
  ctx.globalAlpha = 1;
}

function trailQuads(s, mw, x1, x2, w1, w2, y1, y2) {
  ctx.beginPath();
  ctx.moveTo(x1 + (s.ml0 - mw) * w1, y1); ctx.lineTo(x1 + (s.ml0 + mw) * w1, y1);
  ctx.lineTo(x2 + (s.ml1 + mw) * w2, y2); ctx.lineTo(x2 + (s.ml1 - mw) * w2, y2);
  ctx.closePath();
  ctx.moveTo(x1 + (s.mr0 - mw) * w1, y1); ctx.lineTo(x1 + (s.mr0 + mw) * w1, y1);
  ctx.lineTo(x2 + (s.mr1 + mw) * w2, y2); ctx.lineTo(x2 + (s.mr1 - mw) * w2, y2);
  ctx.closePath();
  ctx.fill();
}

/* ==================================================================
   THE CAR

   A real box in the world, not a sprite. Its corners are defined in car
   local space, rolled, yawed, moved out to where the car is, and then
   projected one at a time through the same projection the road uses. The
   front corners are further from the camera than the rear ones, so they
   come back smaller and the two ends move differently on screen without
   anything animating them. That is the entire illusion.

   Faces are filled flat, one tone each, and culled by their own normal
   rather than by any winding convention. The box is convex, so culling
   alone gives the right answer and nothing needs sorting.
   ================================================================== */

// Car local space: x right, y up from the road surface, z forward.
const carT = { worldX: 0, worldY: 0, worldZ: 0, cosY: 1, sinY: 0, cosR: 1, sinR: 0, cosP: 1, sinP: 0 };

const boxPts = [];
for (let i = 0; i < 8; i++) boxPts.push({ wx: 0, wy: 0, wz: 0, sx: 0, sy: 0 });

const BOX_FACES = [
  { idx: [0, 1, 2, 3], nx: 0, ny: 0, nz: -1 },   // rear, the one facing the camera
  { idx: [5, 4, 7, 6], nx: 0, ny: 0, nz: 1 },    // front
  { idx: [4, 0, 3, 7], nx: -1, ny: 0, nz: 0 },   // left
  { idx: [1, 5, 6, 2], nx: 1, ny: 0, nz: 0 },    // right
  { idx: [3, 2, 6, 7], nx: 0, ny: 1, nz: 0 },    // top
  { idx: [4, 5, 1, 0], nx: 0, ny: -1, nz: 0 }    // bottom
];

/* Local to world. roll is applied about the forward axis first, so the
   body leans while the wheels stay flat on the road, then yaw, then the
   car's position. */
function carToWorld(out, lx, ly, lz, rolled) {
  let rx = lx, ry = ly;
  if (rolled) {
    const py = ly - FEEL.CAR_ROLL_PIVOT;
    rx = lx * carT.cosR - py * carT.sinR;
    ry = py * carT.cosR + lx * carT.sinR + FEEL.CAR_ROLL_PIVOT;
  }
  // Pitch about the car's own lateral axis. Flat while driving, and the
  // tumble once it has gone over the edge.
  const pz = lz * carT.cosP - ry * carT.sinP;
  const py2 = ry * carT.cosP + lz * carT.sinP;
  out.wx = carT.worldX + rx * carT.cosY + pz * carT.sinY;
  out.wy = carT.worldY + py2;
  out.wz = carT.worldZ + pz * carT.cosY - rx * carT.sinY;
  return out;
}

const dirOut = { wx: 0, wy: 0, wz: 0 };
function carDirToWorld(lx, ly, lz, rolled) {
  let rx = lx, ry = ly;
  if (rolled) {
    rx = lx * carT.cosR - ly * carT.sinR;
    ry = ly * carT.cosR + lx * carT.sinR;
  }
  const pz = lz * carT.cosP - ry * carT.sinP;
  const py2 = ry * carT.cosP + lz * carT.sinP;
  dirOut.wx = rx * carT.cosY + pz * carT.sinY;
  dirOut.wy = py2;
  dirOut.wz = pz * carT.cosY - rx * carT.sinY;
  return dirOut;
}

/* Build, transform, project and fill one box. Offsets are in car local
   space; yaw is an extra rotation about the box's own centre, which is
   what turns the front wheels against the body. */
/* ------------------------------------------------------------------
   THE BODY, lofted through the stations in FEEL.CAR_STATIONS.

   Each station is a closed ring of eight points: sill, hip, shoulder and
   roof, mirrored. Consecutive rings are joined into quads, which gives a
   chamfered, tapered solid with a fastback roofline and arches flared at
   the axles, out of nothing but numbers. Flat fills per face, no
   gradients, no textures: section 7.5's cut and folded from paper, which
   is what this technique is actually good at.

   Backfaces are culled from a real cross product in world space rather
   than a table, because a lofted hull has no fixed winding to rely on.
   With a convex hull that is the whole visibility problem solved and no
   sort is needed.
   ------------------------------------------------------------------ */
const RING = 8;
const ringPts = [];
for (let i = 0; i < 128; i++) ringPts.push({ wx: 0, wy: 0, wz: 0, sx: 0, sy: 0 });

/* One station's eight points, anticlockwise seen from the front:
   0 sill left, 1 sill right, 2 hip right, 3 shoulder right, 4 roof right,
   5 roof left, 6 shoulder left, 7 hip left. */
function stationRing(st, halfW, bodyH, y0, out, base, camX, w, h) {
  const z = st[0], sill = st[1], hip = st[2], sh = st[3], roof = st[4];
  const yl = st[5], yh = st[6], ys = st[7], yr = st[8];
  const xs = [-sill, sill, hip, sh, roof, -roof, -sh, -hip];
  const ys2 = [yl, yl, yh, ys, yr, yr, ys, yh];
  for (let i = 0; i < RING; i++) {
    const pt = out[base + i];
    carToWorld(pt, xs[i] * halfW, y0 + ys2[i] * bodyH, z * halfW * 0, false);
    // z is a fraction of the half LENGTH and is applied separately so the
    // ring maths above stays in width units.
    carToWorld(pt, xs[i] * halfW, y0 + ys2[i] * bodyH, z * carMesh.halfL, false);
    projectPoint(pt, pt.wx, pt.wy, pt.wz, camX, w, h);
  }
}

const carMesh = { halfL: 0 };
const meshN = { wx: 0, wy: 0, wz: 0 };

function faceVisible(a, b, c, d, camX) {
  const ux = b.wx - a.wx, uy = b.wy - a.wy, uz = b.wz - a.wz;
  const vx = c.wx - a.wx, vy = c.wy - a.wy, vz = c.wz - a.wz;
  meshN.wx = uy * vz - uz * vy;
  meshN.wy = uz * vx - ux * vz;
  meshN.wz = ux * vy - uy * vx;
  const cx = (a.wx + b.wx + c.wx + d.wx) * 0.25 - camX;
  const cy = (a.wy + b.wy + c.wy + d.wy) * 0.25 - camHeight;
  const cz = (a.wz + b.wz + c.wz + d.wz) * 0.25;
  return meshN.wx * cx + meshN.wy * cy + meshN.wz * cz < 0;
}

/* Which tone a face of the hull takes. The band it sits in does the
   shading, exactly the way a flat shaded model has to: roof catches the
   sky, shoulder is the upper flank, hip is the widest and brightest edge
   of the side, sill is always in its own shadow. */
function hullColour(i, z0, z1) {
  const mid = (z0 + z1) * 0.5;
  const glass = mid > FEEL.CAR_GLASS_FROM && mid < FEEL.CAR_GLASS_TO;
  /* From directly above, which is what portrait gives you, the top face
     is nearly all you see. Painting it one colour for the whole length is
     what turned the car into a blob. So the roof over the cabin is GLASS
     and the roof either side of it is body, which reads top down as body,
     glass, body: three bands that describe the taper instead of hiding
     it. The upper flanks stay light, so the dark glass is framed rather
     than bleeding into the sides. */
  if (i === 4) return glass ? COLOUR.CAR_GLASS : COLOUR.CAR_TOP;    // roof
  if (i === 3 || i === 5) return COLOUR.CAR_CABIN_TOP;              // shoulder
  if (i === 2 || i === 6) return COLOUR.CAR_END;                    // shoulder
  if (i === 1 || i === 7) return COLOUR.CAR_HIP;                    // hip, widest
  return COLOUR.CAR_SILL;                                           // sill
}

function drawHull(halfW, bodyH, y0, camX, w, h, seam) {
  const st = FEEL.CAR_STATIONS;
  const n = st.length;
  for (let k = 0; k < n; k++) {
    stationRing(st[k], halfW, bodyH, y0, ringPts, k * RING, camX, w, h);
  }
  // The skin.
  for (let k = 0; k < n - 1; k++) {
    const a0 = k * RING, b0 = (k + 1) * RING;
    for (let i = 0; i < RING; i++) {
      const j = (i + 1) % RING;
      const p1 = ringPts[a0 + i], p2 = ringPts[a0 + j];
      const p3 = ringPts[b0 + j], p4 = ringPts[b0 + i];
      if (!faceVisible(p1, p2, p3, p4, camX)) continue;
      ctx.fillStyle = hullColour(i, st[k][0], st[k + 1][0]);
      polygon(p1.sx, p1.sy, p2.sx, p2.sy, p3.sx, p3.sy, p4.sx, p4.sy);
      if (seam) ctx.stroke();
    }
  }
  // The tail cap, which is the face the player looks at all run.
  const t = 0;
  ctx.beginPath();
  ctx.moveTo(ringPts[t].sx, ringPts[t].sy);
  for (let i = 1; i < RING; i++) ctx.lineTo(ringPts[t + i].sx, ringPts[t + i].sy);
  ctx.closePath();
  ctx.fillStyle = COLOUR.CAR_END;
  ctx.fill();
  if (seam) ctx.stroke();
}

/* A flat quad placed in car space, used for the light bar. Four points,
   no culling: it sits on the tail and the camera is behind the tail. */
const quadPts = [{wx:0,wy:0,wz:0,sx:0,sy:0},{wx:0,wy:0,wz:0,sx:0,sy:0},
                 {wx:0,wy:0,wz:0,sx:0,sy:0},{wx:0,wy:0,wz:0,sx:0,sy:0}];
function quadInCar(x0, y0, z0, x1, y1, z1, camX, w, h) {
  // Upright when z0 and z1 match, flat on its back when they do not, which
  // is how the same helper draws both the light strip and the wing shadow.
  const flat = z0 !== z1;
  const xs = [x0, x1, x1, x0];
  const ys = flat ? [y0, y0, y1, y1] : [y0, y0, y1, y1];
  const zs = flat ? [z0, z0, z1, z1] : [z0, z0, z0, z0];
  for (let i = 0; i < 4; i++) {
    const pt = quadPts[i];
    carToWorld(pt, xs[i], ys[i], zs[i], false);
    projectPoint(pt, pt.wx, pt.wy, pt.wz, camX, w, h);
  }
  polygon(quadPts[0].sx, quadPts[0].sy, quadPts[1].sx, quadPts[1].sy,
          quadPts[2].sx, quadPts[2].sy, quadPts[3].sx, quadPts[3].sy);
}

function drawBox(ox, oy, oz, hw, hh, hl, extraYaw, rolled, faceColours, stroked, camX, w, h) {
  const cy = Math.cos(extraYaw), sy = Math.sin(extraYaw);
  for (let i = 0; i < 8; i++) {
    const sx = (i === 0 || i === 3 || i === 4 || i === 7) ? -hw : hw;
    const sh = (i === 2 || i === 3 || i === 6 || i === 7) ? hh : -hh;
    const sl = (i >= 4) ? hl : -hl;
    // Spin the box about its own vertical axis before it is placed.
    const lx = ox + sx * cy + sl * sy;
    const lz = oz + sl * cy - sx * sy;
    carToWorld(boxPts[i], lx, oy + sh, lz, rolled);
    projectPoint(boxPts[i], boxPts[i].wx, boxPts[i].wy, boxPts[i].wz, camX, w, h);
  }

  for (let f = 0; f < 6; f++) {
    const face = BOX_FACES[f];
    const colour = faceColours[f];
    if (!colour) continue;
    // The face normal, spun with the box and then transformed like any
    // other direction. No winding convention to get wrong.
    const nlx = face.nx * cy + face.nz * sy;
    const nlz = face.nz * cy - face.nx * sy;
    const n = carDirToWorld(nlx, face.ny, nlz, rolled);
    const a = boxPts[face.idx[0]], b = boxPts[face.idx[1]];
    const c = boxPts[face.idx[2]], d = boxPts[face.idx[3]];
    // Centre of the face, against the camera at (camX, CAMERA_HEIGHT, 0).
    const vx = (a.wx + b.wx + c.wx + d.wx) * 0.25 - camX;
    const vy = (a.wy + b.wy + c.wy + d.wy) * 0.25 - camHeight;
    const vz = (a.wz + b.wz + c.wz + d.wz) * 0.25;
    if (n.wx * vx + n.wy * vy + n.wz * vz >= 0) continue;   // facing away
    if (f === 0) drawBox.drewRear = true;
    ctx.fillStyle = colour;
    polygon(a.sx, a.sy, b.sx, b.sy, c.sx, c.sy, d.sx, d.sy);
    // The fold lines. At fifty pixels across, flat tones alone do not
    // separate the roof from the boot from the side, and the car reads as
    // one yellow blob. The edges are what make it read as folded paper.
    if (stroked) ctx.stroke();
  }
}
drawBox.drewRear = false;

/* A sub rectangle of a face that has already been projected, by bilinear
   interpolation of its four screen corners. Cheaper and exactly right for
   putting lights on the flat back panel. */
function faceInset(quad, u0, u1, v0, v1) {
  const p = faceInset.buf;
  const bl = quad[0], br = quad[1], tr = quad[2], tl = quad[3];
  for (let i = 0; i < 4; i++) {
    const u = (i === 0 || i === 3) ? u0 : u1;
    const v = (i < 2) ? v0 : v1;
    const bx = bl.sx + (br.sx - bl.sx) * u, by = bl.sy + (br.sy - bl.sy) * u;
    const tx = tl.sx + (tr.sx - tl.sx) * u, tyy = tl.sy + (tr.sy - tl.sy) * u;
    p[i].x = bx + (tx - bx) * v;
    p[i].y = by + (tyy - by) * v;
  }
  return p;
}
faceInset.buf = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];

const rearFaceQuad = [{ sx: 0, sy: 0 }, { sx: 0, sy: 0 }, { sx: 0, sy: 0 }, { sx: 0, sy: 0 }];
const WING_COLOURS = [COLOUR.CAR_SPOILER, COLOUR.CAR_SPOILER, COLOUR.CAR_SPOILER,
                      COLOUR.CAR_WING_GAP, COLOUR.CAR_END, COLOUR.CAR_END];
let CAR_RIM_GLOW_FILL = 'rgb(' + COLOUR.CAR_RIM_GLOW + ')';
let CAR_LIGHT_GLOW_FILL = 'rgb(' + COLOUR.CAR_LIGHT_GLOW + ')';

/* Copy the rear face of whichever box was drawn last, so an inset can be
   painted on it without projecting anything again. */
function captureRearFace() {
  for (let i = 0; i < 4; i++) {
    rearFaceQuad[i].sx = boxPts[BOX_FACES[0].idx[i]].sx;
    rearFaceQuad[i].sy = boxPts[BOX_FACES[0].idx[i]].sy;
  }
}

/* A lit strip on that captured face, given a centre and half sizes in
   face coordinates, where u runs across it and v up it. */
function lightStrip(u, du, v, dv) {
  const q = faceInset(rearFaceQuad, u - du, u + du, v - dv, v + dv);
  polygon(q[0].x, q[0].y, q[1].x, q[1].y, q[2].x, q[2].y, q[3].x, q[3].y);
}

/* Screen positions the smoke spawns from, filled in here and read on the
   next frame. One frame of lag on a puff's starting point is invisible. */
const carParts = { rlx: 0, rly: 0, rrx: 0, rry: 0, scale: 20 };
const poolPt = { wx: 0, wy: 0, wz: 0, sx: 0, sy: 0 };

/* The car's own glow, running the same way the trail does, from amber
   when it is gripping to a hot white when it is fully sideways. It stays
   warm at both ends, because one warm object in a cool world is how the
   eye finds it instantly, and that discipline is not up for negotiation.
   Slip drives the trail and the car from one variable. */
const CAR_GLOW_RAMP = [];
/* The fold lines. Dark rather than lit: on a body this chamfered the
   seams are already doing their job by separating tones, and a bright
   outline on every face turns a solid into a wireframe and eats the
   silhouette section 7 asks for. */
const CAR_SEAM_RAMP = [];
const CAR_HEAT_STOPS = ['CAR_HEAT_0', 'CAR_HEAT_1', 'CAR_HEAT_2', 'CAR_HEAT_3'];
function carGlowIndex() {
  let i = Math.round(drift.slipNorm * (CAR_GLOW_RAMP.length - 1));
  if (i < 0) i = 0; else if (i >= CAR_GLOW_RAMP.length) i = CAR_GLOW_RAMP.length - 1;
  return i;
}

const BODY_COLOURS = [COLOUR.CAR_END, COLOUR.CAR_END, COLOUR.CAR_SIDE, COLOUR.CAR_SIDE, COLOUR.CAR_TOP, null];
/* Only the back of the cabin is glass. The sides are pillars and painted
   metal, and colouring them dark made the roof read as a hole. */
const CABIN_COLOURS = [COLOUR.CAR_GLASS, COLOUR.CAR_GLASS, COLOUR.CAR_SIDE, COLOUR.CAR_SIDE, COLOUR.CAR_CABIN_TOP, null];
const WHEEL_COLOURS = [COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE_TOP, null];
const SHADOW_COLOURS = [null, null, null, null, COLOUR.CAR_SHADOW, null];

/* The light pool, as a falloff rather than as flat steps. Nested flat
   quads read as nested rectangles, which is worse than no pool at all.
   One radial gradient per ramp step, built once and then filled through a
   scaled transform, so it costs a single fill and no allocation. */
const CAR_POOL_GRADS = [];

/* ==================================================================
   EVERYTHING PRECOMPUTED FROM THE PALETTE, IN ONE PLACE.

   A hue rotation that reaches COLOUR but not the ramps and cached fills
   built out of it leaves last biome's colours scattered through the new
   one, and they show up in exactly the places the eye is already looking:
   the edge glow, the tyre marks, the car. So every derived value is
   rebuilt here and nowhere else, and every one of them is a `let` or an
   array mutated in place rather than a const built at load.
   ================================================================== */
const stopBuf = [];
function stopRampInto(out, keys, n) {
  out.length = 0;
  const stops = [];
  for (let i = 0; i < keys.length; i++) stops.push(rgbOf('rgb(' + COLOUR[keys[i]] + ')'));
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1) * (stops.length - 1);
    const a = stops[Math.floor(t)], b = stops[Math.min(stops.length - 1, Math.floor(t) + 1)];
    const f = t - Math.floor(t);
    out.push([Math.round(a[0] + (b[0] - a[0]) * f),
              Math.round(a[1] + (b[1] - a[1]) * f),
              Math.round(a[2] + (b[2] - a[2]) * f)]);
  }
  return out;
}
function setFaces(into, from) { for (let i = 0; i < from.length; i++) into[i] = from[i]; }

/* HOW FAR TO TURN THE SIGN, ITEM 8. The wish is SIGN_HUE_SHIFT degrees
   off this biome's amber, which holds the sign a constant distance from
   everything that turns with the biome. The rule is that it may not come
   within SIGN_KEEP_CLEAR of either pinned family, because those do not
   turn and the wish would sweep straight through them.

   TWICE, because pushing clear of one zone can push into the other. Two
   passes settle it at these widths and the result is checked rather than
   assumed: signhue reports the closest approach across all twelve. */
/* THE TWO HUES THAT MEAN SOMETHING, and they are the LOUD members of
   each family rather than the first key in it. JUMP_DECK is the ramp's
   brown deck, not the go colour: aiming the avoidance at it steered the
   sign clear of a brown nobody reads and left it one degree off the
   green that means go. The lip is the thing the eye takes the meaning
   from, in both families. */
const SIGN_AVOID = ['HAZARD_TOP', 'JUMP_LIP'];
function signHueShift() {
  const c = rgbOf(COLOUR.SIGN);
  const h0 = rgbToHsl(c[0], c[1], c[2])[0];
  let h = h0 + FEEL.SIGN_HUE_SHIFT;
  const keep = FEEL.SIGN_KEEP_CLEAR;
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < SIGN_AVOID.length; i++) {
      const p = rgbOf(COLOUR[SIGN_AVOID[i]]);
      const ph = rgbToHsl(p[0], p[1], p[2])[0];
      const d = ((h - ph) % 360 + 360) % 360;
      // Pushed to whichever edge of the zone it is already nearer, so
      // the correction is the smallest one that clears it.
      if (d < keep) h += keep - d;
      else if (d > 360 - keep) h -= keep - (360 - d);
    }
  }
  return h - h0;
}

function rebuildDerivedColours() {
  EDGE_HOT_RAMP = rampBetween(COLOUR.EDGE_DARK, COLOUR.EDGE_LIGHT);
  // The roof lights run toward this biome's own hot hue, so the ramp has
  // to follow the place.
  SKYLINE_HOT_RAMP = rampBetween(COLOUR.SKYLINE_TOP, COLOUR.HORIZON_FADE);
  GRID_HOT_RAMP = rampBetween(COLOUR.GRID, COLOUR.GRID_NEAR);
  JUMP_DECK_RAMP = rampBetween(COLOUR.JUMP_DECK_DARK, COLOUR.JUMP_DECK);

  SMOKE_FILL = 'rgb(' + COLOUR.SMOKE + ')';
  EDGE_GLOW_FILL = 'rgb(' + COLOUR.EDGE_GLOW + ')';
  SLAB_BOTTOM_GLOW_FILL = 'rgb(' + COLOUR.SLAB_BOTTOM_GLOW + ')';
  PYLON_GLOW_FILL = 'rgb(' + COLOUR.PYLON_GLOW + ')';
  JUMP_GLOW_FILL = 'rgb(' + COLOUR.JUMP_GLOW + ')';
  HAZARD_GLOW_FILL = 'rgb(' + COLOUR.HAZARD_GLOW + ')';
  GATE_GLOW_FILL = 'rgb(' + COLOUR.GATE_GLOW + ')';
  CAR_RIM_GLOW_FILL = 'rgb(' + COLOUR.CAR_RIM_GLOW + ')';
  CAR_LIGHT_GLOW_FILL = 'rgb(' + COLOUR.CAR_LIGHT_GLOW + ')';

  /* THE SIGN COLOUR, AS AN OFFSET RATHER THAN A COLOUR. Item 8. The base
     entry has already been turned by this biome's own rotation, so
     turning it a further fixed amount here lands it the same distance
     from the road, the car, the hazards and the jumps in every biome.
     rotateHue holds luminance while it turns, which is exactly what is
     wanted: the sign's brightness is decided once, in COLOUR.SIGN, and
     the wheel cannot walk it up toward the road edge. */
  SIGN_FILL = rotateHue(COLOUR.SIGN, signHueShift());
  /* The lamp's pool on the road, same pattern as the car's: one radial
     gradient, filled through a scaled transform, so a pool is a single
     fill and allocates nothing per frame. */
  LAMP_POOL_GRAD = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
  LAMP_POOL_GRAD.addColorStop(0, 'rgba(' + COLOUR.LAMP_POOL + ',1)');
  LAMP_POOL_GRAD.addColorStop(0.42, 'rgba(' + COLOUR.LAMP_POOL + ',0.40)');
  LAMP_POOL_GRAD.addColorStop(1, 'rgba(' + COLOUR.LAMP_POOL + ',0)');

  /* THE ACTIVE CAR'S COSMETICS, applied here and nowhere else, so a
     biome change and a car change go through the same one door. */
  const car = activeCar();
  CAR_RIM_FILL = COLOUR[car.rim] || COLOUR.CAR_RIM;
  CAR_LIGHT_FILL = COLOUR[car.light] || COLOUR.CAR_LIGHT;
  CAR_LIGHT_GLOW_FILL = 'rgb(' + rgbOf(CAR_LIGHT_FILL).slice(0, 3).join(',') + ')';

  // The cool end of the tyre marks is the car's, so the variant owns it.
  TRAIL_STOPS[0] = car.trail;
  stopRampInto(stopBuf, TRAIL_STOPS, 24);
  TRAIL_RAMP.length = 0;
  for (let i = 0; i < stopBuf.length; i++) {
    const c = stopBuf[i];
    TRAIL_RAMP.push('rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')');
  }

  stopRampInto(stopBuf, CAR_HEAT_STOPS, 16);
  CAR_GLOW_RAMP.length = 0;
  CAR_SEAM_RAMP.length = 0;
  CAR_POOL_GRADS.length = 0;
  for (let i = 0; i < stopBuf.length; i++) {
    const c = stopBuf[i], rgb = c[0] + ',' + c[1] + ',' + c[2];
    CAR_GLOW_RAMP.push('rgb(' + rgb + ')');
    CAR_SEAM_RAMP.push(COLOUR[car.seam] || COLOUR.CAR_SEAM);
    /* The light pool, as a falloff rather than as flat steps. Nested flat
       quads read as nested rectangles, which is worse than no pool at
       all. One radial gradient per ramp step, filled through a scaled
       transform, so it costs a single fill and no allocation per frame. */
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    grad.addColorStop(0, 'rgba(' + rgb + ',1)');
    grad.addColorStop(0.45, 'rgba(' + rgb + ',0.45)');
    grad.addColorStop(1, 'rgba(' + rgb + ',0)');
    CAR_POOL_GRADS.push(grad);
  }

  setFaces(WING_COLOURS, [COLOUR.CAR_SPOILER, COLOUR.CAR_SPOILER, COLOUR.CAR_SPOILER,
                          COLOUR.CAR_WING_GAP, COLOUR.CAR_END, COLOUR.CAR_END]);
  setFaces(BODY_COLOURS, [COLOUR.CAR_END, COLOUR.CAR_END, COLOUR.CAR_SIDE,
                          COLOUR.CAR_SIDE, COLOUR.CAR_TOP, null]);
  setFaces(CABIN_COLOURS, [COLOUR.CAR_GLASS, COLOUR.CAR_GLASS, COLOUR.CAR_SIDE,
                           COLOUR.CAR_SIDE, COLOUR.CAR_CABIN_TOP, null]);
  setFaces(WHEEL_COLOURS, [COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE,
                           COLOUR.CAR_TYRE, COLOUR.CAR_TYRE_TOP, null]);
  setFaces(SHADOW_COLOURS, [null, null, null, null, COLOUR.CAR_SHADOW, null]);
}
rebuildDerivedColours();

/* The rim, glowed like everything else lit in this world: wide and faint
   under a solid core. It is a small thing but it is at the corners of the
   silhouette, where the eye already is. */
function rimGlow() {
  captureRearFace();
  ctx.globalAlpha = FEEL.CAR_RIM_GLOW_ALPHA;
  ctx.fillStyle = CAR_RIM_GLOW_FILL;
  lightStrip(0.5, 0.30 * FEEL.CAR_RIM_GLOW_SPREAD, 0.5, 0.09 * FEEL.CAR_RIM_GLOW_SPREAD);
  ctx.globalAlpha = 1;
  ctx.fillStyle = CAR_RIM_FILL;
  lightStrip(0.5, 0.30, 0.5, 0.09);
}

function drawCar(w, h) {
  /* An impact destroys the car. It is held for the length of the hit
     stop, which is the frozen moment of contact, and after that there is
     only debris. Going off the road is untouched: that car falls. */
  if (state === DEAD && deathKind === HIT_OBJECT && hitStop <= 0) return;
  /* Projected against the camera, positioned at the car. Those were the
     same thing until the camera started leaning into corners, and keeping
     them apart is what slides the car off centre while it does. */
  const camX = cameraX;
  const yaw = carYaw();
  const roll = clamp(drift.lateralAccel / FEEL.CAR_ROLL_REFERENCE, -1, 1)
             * FEEL.CAR_ROLL_DEG * Math.PI / 180;

  carT.worldX = carX + carCurveX;      // the car rides the road, curve and all
  carT.worldY = carY;
  carT.worldZ = FEEL.CAMERA_DISTANCE;
  carT.cosY = Math.cos(yaw);
  carT.sinY = Math.sin(yaw);
  carT.cosR = Math.cos(roll);
  carT.sinR = Math.sin(roll);
  carT.cosP = Math.cos(carPitch);
  carT.sinP = Math.sin(carPitch);

  const halfW = FEEL.CAR_BODY_WIDTH / 2;
  const halfL = FEEL.CAR_BODY_LENGTH / 2;
  const wheelR = FEEL.CAR_WHEEL_DIAMETER / 2;
  const trackHalf = FEEL.CAR_TRACK / 2;
  const baseHalf = FEEL.CAR_WHEELBASE / 2;
  const steer = steering.value * FEEL.CAR_FRONT_STEER_DEG * Math.PI / 180;

  // The shadow is the yawed footprint of the box rather than a fixed
  // ellipse. With a solid body a shape that did not turn read as a sticker
  // underneath a car; the lane dashes, the shoulder and the tyre marks are
  // the fixed reference, and they are far more legible than an ellipse.
  const glowIdx = carGlowIndex();

  // A pool of the car's own light on the road, so it sits in the world
  // rather than on it, with the contact shadow still under it. Gone once
  // it has left the road, because there is nothing there to light.
  if (carY === 0) {
    carToWorld(poolPt, 0, 0, 0, false);
    projectPoint(poolPt, poolPt.wx, poolPt.wy, poolPt.wz, camX, w, h);
    const scale = CAMERA_DEPTH / FEEL.CAMERA_DISTANCE;
    const rx = scale * halfW * FEEL.CAR_POOL_SIZE * w / 2;
    ctx.save();
    ctx.translate(poolPt.sx, poolPt.sy);
    ctx.scale(rx, rx * FEEL.CAR_POOL_SQUASH);
    ctx.globalAlpha = FEEL.CAR_POOL_ALPHA;
    ctx.fillStyle = CAR_POOL_GRADS[glowIdx];
    ctx.beginPath();
    ctx.arc(0, 0, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
    drawBox(0, 1, 0, halfW * 0.96, 1, halfL * 0.96, 0, false, SHADOW_COLOURS, false, camX, w, h);
  }

  // Panel seams, lit rather than drawn in shadow.
  ctx.strokeStyle = CAR_SEAM_RAMP[glowIdx];
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';

  // Far to near: front wheels, body, rear wheels.
  drawBox(-trackHalf, wheelR, baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, steer, false, WHEEL_COLOURS, false, camX, w, h);
  drawBox(trackHalf, wheelR, baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, steer, false, WHEEL_COLOURS, false, camX, w, h);

  /* The body. One lofted hull rather than a box and a box on top of it,
     so the roofline can fall into the tail and the flanks can taper. */
  carMesh.halfL = halfL;
  drawHull(halfW, FEEL.CAR_BODY_HEIGHT, FEEL.CAR_RIDE_HEIGHT, camX, w, h, true);

  /* The rear light bar. The camera lives behind this car, so this is the
     single detail it sees most of, and it gets the same two pass glow the
     road edges get: once wide and faint, once solid, no shadowBlur.

     It burns brighter under braking, which here means scraping, so the
     one thing always in view also reports the one state that is about to
     kill you. */
  const tail = FEEL.CAR_STATIONS[0];
  const lightY = FEEL.CAR_RIDE_HEIGHT + FEEL.CAR_LIGHT_Y * FEEL.CAR_BODY_HEIGHT;
  const lightHalf = halfW * tail[2] * FEEL.CAR_LIGHT_HALF;
  const lightT = FEEL.CAR_BODY_HEIGHT * FEEL.CAR_LIGHT_THICK;
  const lightZ = tail[0] * halfL - 6;
  const hot = scraping ? 1 : 0;
  // Laterally clamped, vertically and rearwardly free.
  const glowHalf = Math.min(lightHalf * FEEL.CAR_LIGHT_GLOW_SPREAD,
                            halfW * tail[2] * FEEL.CAR_LIGHT_GLOW_MAX);
  for (let pass = 0; pass < 2; pass++) {
    const wide = pass === 0 ? glowHalf : lightHalf;
    const tall = pass === 0 ? lightT * FEEL.CAR_LIGHT_GLOW_SPREAD : lightT;
    const z = pass === 0 ? lightZ - FEEL.CAR_LIGHT_GLOW_BACK : lightZ;
    ctx.globalAlpha = pass === 0 ? FEEL.CAR_LIGHT_GLOW_ALPHA * (1 + hot * 0.8) : 1;
    ctx.fillStyle = pass === 0 ? CAR_LIGHT_GLOW_FILL
                  : (hot ? COLOUR.CAR_LIGHT_HOT : CAR_LIGHT_FILL);
    quadInCar(-wide, lightY - tall, z, wide, lightY + tall, z, camX, w, h);
  }
  ctx.globalAlpha = 1;

  /* The spoiler. Two posts and a blade above the tail: it reads as
     performance instantly and it gives the silhouette something along its
     top edge, which is the line the player actually sees against the
     sky. */
  /* AND ITS SHAPE IS THE ONE THING THE UNLOCKS CHANGE ABOUT THE
     SILHOUETTE. Four of them, off the active car: none, the stock blade
     on posts, a low ducktail sitting straight on the boot, and a wide
     thin blade. The top edge against the sky is the line the player
     actually sees, so it is the right thing to vary and it costs no
     extra geometry: the same two boxes with different numbers. */
  const wing = activeCar().wing;
  const wingHalf = wing === 2 ? FEEL.CAR_SPOILER_HALF * FEEL.CAR_WING_DUCK_HALF
                 : wing === 3 ? FEEL.CAR_SPOILER_HALF * FEEL.CAR_WING_WIDE_HALF
                 : FEEL.CAR_SPOILER_HALF;
  const wingThick = wing === 3 ? FEEL.CAR_SPOILER_THICK * FEEL.CAR_WING_WIDE_THICK
                  : FEEL.CAR_SPOILER_THICK;
  const spY = FEEL.CAR_RIDE_HEIGHT
            + (wing === 2 ? FEEL.CAR_WING_DUCK_Y : FEEL.CAR_SPOILER_Y)
              * FEEL.CAR_BODY_HEIGHT;
  const spZ = FEEL.CAR_SPOILER_Z * halfL;
  const postX = halfW * FEEL.CAR_SPOILER_POST;
  const postH = (spY - (FEEL.CAR_RIDE_HEIGHT + 0.9 * FEEL.CAR_BODY_HEIGHT)) / 2;
  // A ducktail sits ON the boot, so it has no posts to draw, and with no
  // wing at all there is nothing here at any.
  if (wing === 1 || wing === 3) {
    drawBox(-postX, spY - postH, spZ + 10, 12, postH, 26, 0, false, WING_COLOURS, false, camX, w, h);
    drawBox(postX, spY - postH, spZ + 10, 12, postH, 26, 0, false, WING_COLOURS, false, camX, w, h);
  }
  if (wing !== 0) {
  /* The shadow the wing casts on the boot. Seen from above, a spoiler is
     a horizontal plane floating over another horizontal plane and the two
     merge into one surface: the ONLY thing that separates them is the gap
     underneath. So the gap is drawn. A dark band on the boot lid, wider
     and longer than the blade, and it is what makes the wing exist at all
     in a top down framing. */
  ctx.globalAlpha = FEEL.CAR_SPOILER_SHADOW;
  ctx.fillStyle = COLOUR.CAR_WING_GAP;
  quadInCar(-halfW * wingHalf * 1.06,
            spY - wingThick * 1.5,
            spZ + halfL * FEEL.CAR_SPOILER_CHORD * 1.5,
            halfW * wingHalf * 1.06,
            spY - wingThick * 1.5,
            spZ - halfL * FEEL.CAR_SPOILER_CHORD * 1.5, camX, w, h);
  ctx.globalAlpha = 1;
  drawBox(0, spY, spZ, halfW * wingHalf, wingThick / 2,
          halfL * FEEL.CAR_SPOILER_CHORD, 0, false, WING_COLOURS, true, camX, w, h);
  }

  drawBox.drewRear = false;
  drawBox(-trackHalf, wheelR, -baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, 0, false, WHEEL_COLOURS, false, camX, w, h);
  carParts.rlx = (boxPts[0].sx + boxPts[1].sx) * 0.5;
  carParts.rly = (boxPts[0].sy + boxPts[1].sy) * 0.5;
  if (drawBox.drewRear) rimGlow();
  drawBox.drewRear = false;
  drawBox(trackHalf, wheelR, -baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, 0, false, WHEEL_COLOURS, false, camX, w, h);
  if (drawBox.drewRear) rimGlow();
  carParts.rrx = (boxPts[0].sx + boxPts[1].sx) * 0.5;
  carParts.rry = (boxPts[0].sy + boxPts[1].sy) * 0.5;
  carParts.scale = Math.max(8, Math.abs(carParts.rrx - carParts.rlx));
}

function drawScrapeFlash(w, h) {
  if (!scraping) return;
  ctx.save();
  // The band brightens and turns as the scrape timer runs down, so the
  // player can feel the clock without a meter on the screen.
  ctx.globalAlpha = FEEL.SCRAPE_FLASH_ALPHA * (0.55 + 0.45 * scrapeRisk);
  if (scrapeSide < 0) {
    ctx.fillStyle = scrapeGradientLeft;
    ctx.fillRect(0, 0, scrapeBandWidth, h);
  } else {
    ctx.fillStyle = scrapeGradientRight;
    ctx.fillRect(w - scrapeBandWidth, 0, scrapeBandWidth, h);
  }
  if (scrapeRisk > 0.4) {
    ctx.globalAlpha = (scrapeRisk - 0.4) / 0.6 * FEEL.SCRAPE_FLASH_ALPHA;
    ctx.fillStyle = scrapeSide < 0 ? scrapeOutGradientLeft : scrapeOutGradientRight;
    if (scrapeSide < 0) ctx.fillRect(0, 0, scrapeBandWidth, h);
    else ctx.fillRect(w - scrapeBandWidth, 0, scrapeBandWidth, h);
  }
  ctx.restore();
}

function text(str, x, y, size, weight, align, fill) {
  ctx.font = weight + ' ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = COLOUR.TEXT_SHADOW;
  ctx.fillText(str, x, y + Math.max(1, size * 0.06));
  ctx.fillStyle = fill || COLOUR.TEXT;
  ctx.fillText(str, x, y);
}

/* ------------------------------------------------------------------
   THE PUBLISHER CREDIT, with the game's own mark beside it.

   Small and quiet, and the mark does not change that: it is drawn at the
   credit's own alpha and at a height set from the credit's own type
   size, so making the credit smaller makes the mark smaller and there is
   no second number to keep in step. The pair is centred as a unit, which
   is why the word is measured before anything is drawn.

   NEVER IN THE HUD. This is an end of run screen only. A logo sitting on
   the road while somebody is driving is the exact opposite of section
   7's argument that the road edge owns the top of the value range.
   ------------------------------------------------------------------ */
/* ==================================================================
   THE SNAPHIT LOCKUPS, WHICH ARE DOM AND NOT CANVAS.

   The markup is inlined in the body, above the canvas, and the whole of
   the script's involvement is deciding where the credit sits and when
   each one is visible. Nothing here draws anything.

   THE ASPECT RATIO IS READ OFF THE MARKUP, not written down twice. Both
   viewBoxes are in the body and the browser has already parsed them, so
   asking the element is both shorter and impossible to get out of step
   with the artwork. It falls back to the measured crop ratio only if the
   element is missing entirely, which would mean the markup is gone.
   ================================================================== */
const bootEl = document.getElementById('boot');
// The lockup inside it, which fades in on its own while the field
// behind it stays opaque. See syncBoot.
const bootMark = bootEl ? bootEl.querySelector('svg') : null;
const creditEl = document.getElementById('credit');

function lockupAspect(el, fallback) {
  const svg = el && el.querySelector('svg');
  const vb = svg && svg.viewBox && svg.viewBox.baseVal;
  return (vb && vb.height > 0) ? vb.width / vb.height : fallback;
}
const LOCKUP_ASPECT = lockupAspect(creditEl, 1686.8 / 327.0);

/* Written only when something actually moved. The death screen and the
   completion screen put the credit at different heights and both are
   pure functions of the viewport, so in practice this writes on a resize
   and on a change of screen and never once per frame. */
let creditKey = '';
let creditWant = false;      // did this frame ask for it
/* Starts false because the markup starts `hidden`, and those two have to
   agree or the reconcile below sees no change and never writes. They
   disagreed on the first attempt and the credit sat on the title screen
   and over the whole of a run, which is precisely what section 4 of this
   session's brief forbids. */
let creditShown = false;     // and is it actually in the document

/* fade is the completion screen's reveal, so the lockup arrives with the
   rest of the result rather than snapping in at full strength under it.
   It is in the key, rounded, because the key is what stops this writing
   to the DOM on a frame where nothing moved. */
function placeCredit(cx, cy, width, height, fade) {
  creditWant = true;
  const a = FEEL.CREDIT_ALPHA * (fade === undefined ? 1 : fade);
  const key = Math.round(cx) + ':' + Math.round(cy) + ':' + Math.round(width)
            + ':' + Math.round(a * 50);
  if (key === creditKey) return;
  creditKey = key;
  creditEl.style.width = width + 'px';
  creditEl.style.opacity = a;
  // transform rather than left and top, so this never triggers a layout.
  creditEl.style.transform = 'translate(' + (cx - width / 2) + 'px,'
                                          + (cy - height / 2) + 'px)';
}

/* ONE RECONCILE AT THE END OF THE FRAME, and it writes only on a change.

   A DOM overlay does not disappear because nothing drew it, so its
   absence has to be as deliberate as its presence. It is only ever on
   the death and completion screens, which is what creditWant carries.
   Everything else, including the title screen and the whole of a run,
   gets nothing: section 4 of this session's brief, and section 6 of the
   game's, which is strict about anything that makes this look like a
   portal rather than a single purpose site.

   The pause term is belt and braces rather than a live case. setPaused
   refuses to pause outside DRIVING, and DRIVING never asks for the
   credit, so the two cannot currently overlap. If that guard ever moves,
   this stops an opaque cover from having a lockup floating over it. */
function syncCredit() {
  const want = creditWant && !paused;
  creditWant = false;
  if (want === creditShown) return;
  creditShown = want;
  creditEl.hidden = !want;
}


/* ------------------------------------------------------------------
   THE FINE PRINT, WHICH IS ONLY EVER ON THE TITLE SCREEN AND ONLY EVER
   WHEN THIS PAGE IS THE PAGE.

   FRAMED, IT IS DELETED. The game is embedded in an arcade cabinet on
   all seven content pages, and inside that frame these links are worse
   than useless in both directions a link can go. Left alone, one
   navigates the iframe, and the reader is left looking at a content page
   rendered inside a picture of a phone. Given target="_top" it throws
   them out of the article they were reading to go to another article
   they can already see linked in the text beside them. Neither is a
   thing to do to somebody.

   They are also redundant there: every content page carries the whole
   cluster in its own copy, so the frame would be offering a second, worse
   copy of the navigation the page already has. And a cabinet screen with
   a row of links along the bottom stops reading as a cabinet and starts
   reading as a browser, which is the one thing that mock is for.

   THE CRAWLER IS UNAFFECTED, AND THAT IS THE WHOLE REASON THIS IS SAFE.
   Google fetches and renders driftfever.com as a top level document of
   its own; it does not discover this file only through the iframes.
   Rendered at the top level, self and top are the same window, so the
   links are there. This is not cloaking either: the test is the
   embedding context, never the user agent, so a crawler at
   driftfever.com is shown exactly what a person at driftfever.com is
   shown.

   REMOVED RATHER THAN HIDDEN, because there is no state of this game in
   which a framed copy should have them, and an element that is not in
   the document cannot be revealed by a later bug.

   THE try/catch IS NOT DECORATION. Reading window.top across origins is
   allowed for this comparison and throws on nothing current, but a
   throw here would take the whole script with it, and a game that does
   not boot because of a footer would be an absurd way to lose.
   ------------------------------------------------------------------ */
const moreEl = document.getElementById('more');
let framed = false;
try { framed = window.self !== window.top; } catch (e) { framed = true; }
if (framed && moreEl && moreEl.parentNode) moreEl.parentNode.removeChild(moreEl);

/* The markup ships visible and the script only ever takes it away, so
   this starts true to agree with it, exactly as creditShown starts false
   to agree with its own hidden attribute. Get that wrong and the first
   reconcile sees no change and never writes again. */
let moreShown = true;

/* ONE RECONCILE PER FRAME, WRITING ONLY ON A CHANGE, which is the same
   discipline syncCredit is built on and for the same reason: this is a
   DOM write inside a 60fps loop and it must not happen sixty times a
   second.

   THE TILT CALIBRATION TERM. The calibration is the one thing in this
   game that takes a row off another screen, and the row it takes is this
   one: while it is up the title screen returns before it draws its
   bottom block at all. So the fine print goes with it and comes back
   when it does. */
function syncMore() {
  if (framed) return;
  const want = state === TITLE && !paused && !tiltCalOnScreen();
  if (want === moreShown) return;
  moreShown = want;
  moreEl.classList.toggle('away', !want);
}

/* The lockup is an HTML overlay and the plate under it is canvas, and
   that split is deliberate. The overlay stays sharp at any device pixel
   ratio for free and costs nothing per frame; the plate has to be in the
   canvas so it sits UNDER the lockup and OVER the road, and so it can be
   measured in the same pixels as the road it is dimming.

   THE PLATE IS THE CONTRAST ANSWER. The biome hue rotates at every gate,
   which puts the whole world through twelve palettes, and one of them is
   orange, which is the lockup's own colour. Measured across all twelve,
   the plate lifts the worst case contrast from unreadable to comfortable
   and the numbers are in the session report. It is a soft radial rather
   than a panel because a hard edged box on a death screen reads as a
   dialog asking a question. */
let creditPlate = null;
let creditPlateKey = '';

function drawCredit(w, s, cy, fade) {
  const width = s * FEEL.CREDIT_WIDTH;
  const height = width / LOCKUP_ASPECT;
  const rx = width * FEEL.CREDIT_PLATE_WIDE;
  const ry = height * FEEL.CREDIT_PLATE_TALL;

  /* Built on demand and cached, like every other gradient in this file,
     because a radial rebuilt sixty times a second is pure waste on the
     hardware section 6 describes. The key is every number that shapes
     it, so nothing can go stale. */
  const key = Math.round(w) + ':' + Math.round(cy) + ':' + Math.round(rx) + ':' + Math.round(ry);
  if (key !== creditPlateKey) {
    const g2 = ctx.createRadialGradient(w / 2, cy, 0, w / 2, cy, 1);
    g2.addColorStop(0, 'rgba(6,3,2,' + FEEL.CREDIT_PLATE_ALPHA + ')');
    // Flat out to here, so the mark never sits half on a bright rim.
    g2.addColorStop(clamp(FEEL.CREDIT_PLATE_FLAT, 0, 0.99),
                    'rgba(6,3,2,' + FEEL.CREDIT_PLATE_ALPHA + ')');
    g2.addColorStop(1, 'rgba(6,3,2,0)');
    creditPlate = g2;
    creditPlateKey = key;
  }
  // The gradient is built in a unit circle and stretched by the
  // transform, which is how a canvas radial becomes an ellipse.
  ctx.save();
  ctx.translate(w / 2, cy);
  ctx.scale(rx, ry);
  ctx.translate(-w / 2, -cy);
  ctx.fillStyle = creditPlate;
  ctx.fillRect(w / 2 - 1, cy - 1, 2, 2);
  ctx.restore();

  // And the lockup itself, which is DOM. Nothing is written unless the
  // geometry actually moved.
  placeCredit(w / 2, cy, width, height, fade);
}

/* The size that makes a string fill a share of the width and no more,
   so the game's own name cannot clip off the side of a narrow handset. */
function fittedSize(str, weight, want, maxWidth) {
  ctx.font = weight + ' ' + want + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const width = ctx.measureText(str).width;
  return width <= maxWidth ? want : Math.floor(want * maxWidth / width);
}

/* The score and the multiplier, and no words anywhere near them. The
   number climbing while the trail runs hot is the whole explanation: one
   corner taken deep and near the edge should make the rule obvious, and
   if it does not then this display is what is wrong. */
/* ------------------------------------------------------------------
   THE READOUT. Three quantities, three treatments, one representation
   each, because five numbers in one typeface is five numbers nobody can
   tell apart at a glance.

   SCORE is an arcade score: heavy, gold, outlined, the biggest thing up
   there. It is the prize.
   TIME is a pit timer: tabular monospace on a dark plate, in minutes and
   seconds, so it cannot possibly be mistaken for points.
   MULTIPLIER is neither: it sits off to one side in the colour the tyre
   marks run through, so the line on the road and the number are one
   signal.

   What was there before, and why it was unreadable: the banked score and
   the pending score were the SAME quantity in two forms side by side, the
   clock and the seconds to the next gate were two more numbers in the
   same typeface, and the live payback rate was a fifth. All five were
   white or cyan sans digits at similar sizes. The pending score is gone,
   the payback rate is now an arrow rather than a number, and the gate is
   inside the time plate where it belongs.
   ------------------------------------------------------------------ */
const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';

/* Minutes and seconds, always the same width, so the digits do not
   jitter as they count. That stillness is most of what makes a readout
   look like a stopwatch rather than a score. */
function timeLabel(sec) {
  const t = Math.max(0, sec);
  const m = Math.floor(t / 60);
  const r = t - m * 60;
  return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1);
}

/* The arcade treatment: an outline behind a heavy fill. Two draws, no
   shadow blur, exactly the discipline everything else lit in this game
   uses. */
function arcadeNumber(str, x, y, size, fill) {
  ctx.font = '900 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size * 0.14);
  ctx.strokeStyle = COLOUR.SCORE_EDGE;
  ctx.strokeText(str, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

/* WHICH OF THE TWO ARRANGEMENTS THIS SCREEN GETS. A ratio and not a
   simple w > h, because a nearly square window has no horizontal room to
   spare either and the strip would be four cramped columns instead of
   four roomy rows. Portrait is untouched by every part of this. */
function hudIsBar(w, h) {
  return w >= h * FEEL.HUD_BAR_RATIO;
}

function drawScore(w, h) {
  if (state !== DRIVING) return;
  if (hudIsBar(w, h)) { drawHudBar(w, h); return; }
  const s = Math.min(w, h);
  const flash = gateFlash > 0 ? gateFlash / FEEL.CHECKPOINT_FLASH : 0;
  /* The multiplier, carried by the score rather than by a number of its
     own. Hotter and very slightly larger as it climbs, with a short kick
     on each whole one crossed, which is the moment worth noticing. */
  const heat = clamp((multiplier - 1) / (FEEL.MULT_MAX - 1), 0, 1);
  const pop = multPop > 0 ? multPop / FEEL.MULT_POP_TIME : 0;
  const size = Math.round(s * FEEL.SCORE_SIZE
    * (1 + 0.3 * flash + FEEL.SCORE_HEAT_GROWTH * heat + FEEL.SCORE_HEAT_POP * pop));
  scoreTop = safeTop + h * FEEL.SCORE_TOP;
  scoreSize = size;
  const label = String(banked + Math.floor(score));
  /* Once the stored best has been passed the score keeps a halo for the
     rest of the run. It is the same wide then normal glow everything lit
     in this game uses, and it is the one piece of this session that is
     allowed to persist, because the whole point of it is that the player
     is in new territory until the run ends. */
  if (scoreBeaten()) {
    ctx.font = '900 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(4, size * FEEL.BEST_GLOW_SPREAD);
    ctx.globalAlpha = FEEL.BEST_GLOW_ALPHA;
    ctx.strokeStyle = 'rgb(' + COLOUR.SCORE_GLOW + ')';
    ctx.strokeText(label, w / 2, scoreTop);
    ctx.globalAlpha = 1;
  }
  arcadeNumber(label, w / 2, scoreTop,
               size, flash > 0 ? COLOUR.GATE : scoreHeatColour(heat));
  drawClock(w, h);
}

/* ------------------------------------------------------------------
   THE LANDSCAPE STRIP. One row, laid out left to right.

   The centre is placed FIRST and everything else is fitted around what
   it turns out to need, because the clock is the one element whose width
   is not a choice: it is however wide two mono time labels are, and on a
   640 wide handset that is a real fraction of the strip. Laying the ends
   out first and hoping would put the score under the plate at the exact
   moment the score is longest, which is the moment it matters.

   NOTHING HERE PAINTS A BACKGROUND BEHIND THE WHOLE STRIP. The clock
   keeps its own plate because that plate is part of what makes a time
   look like a time, but a bar wide band of dark across the sky would be
   a new large shape competing with the road edges for attention, which
   section 7 spends a paragraph warning about.
   ------------------------------------------------------------------ */
function drawHudBar(w, h) {
  const s = Math.min(w, h);
  const flash = gateFlash > 0 ? gateFlash / FEEL.CHECKPOINT_FLASH : 0;
  const heat = clamp((multiplier - 1) / (FEEL.MULT_MAX - 1), 0, 1);
  const pop = multPop > 0 ? multPop / FEEL.MULT_POP_TIME : 0;
  const size = Math.round(s * FEEL.HUD_BAR_SCORE
    * (1 + 0.3 * flash + FEEL.SCORE_HEAT_GROWTH * heat + FEEL.SCORE_HEAT_POP * pop));
  const cy = safeTop + h * FEEL.HUD_BAR_TOP;
  const padx = w * FEEL.HUD_BAR_PAD;
  const x0 = padx, x1 = w - padx;
  scoreTop = cy;
  scoreSize = size;

  // THE CENTRE: both times, in their own instrument, which reports back
  // how much of the strip it took.
  const boxW = drawClock(w, h, w / 2, cy, Math.round(s * FEEL.HUD_BAR_CLOCK));
  /* What is left at each end once the plate has taken the middle, which
     is what the score and the track line are both fitted into. The floor
     is a guard and not a design: fittedSize divides by its maximum
     width, so a room that came out zero or negative would give nonsense.
     It cannot be reached above HUD_BAR_RATIO, where the narrowest case
     measured leaves 138 pixels. */
  const room = Math.max(8, w / 2 - boxW / 2 - s * 0.03 - x0);

  // THE LEFT: the score, in exactly the treatment it has in portrait.
