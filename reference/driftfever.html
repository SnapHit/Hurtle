     so for a warning run of 45 segments to be on screen at all the
     curvature has to stay under about 9.2. Set below that with margin.

     It deliberately does NOT try to be the safety bound as well. The
     crossing check in hazardFits already uses the actual curvature of the
     actual span, so it rejects anything unreachable by arithmetic rather
     than by a blanket rule, and it self limits long before this: at 7.0,
     centrifugal has eaten 87% of the steering and almost nothing passes.
     Setting this to 3.0 as a catch-all made hazards so rare that a player
     met one every ten minutes. */
  HAZARD_MAX_CURVE:         7.0,
  HAZARD_SAFETY:           1.35,     // required margin on the crossing check
  /* A gap exactly one car wide is not a gap. The car carries GRIP_TIME of
     lag, so it cannot be placed into a slot and held there, and a check
     that only asks whether the centre fits will happily build one. Every
     usable gap has to admit the car and this much slack as well. Movers
     were the ones that exposed it: at the ends of their swing they left
     a sliver against the far edge that passed a centre-fits test and was
     undriveable in practice. */
  HAZARD_MIN_GAP:           260,     // world units of slack beyond the car

  /* The crossing has to be made at the ENTRY. Once alongside a hazard the
     car only has to hold a lane, which is a much weaker requirement, so
     the strict curvature gate covers the warning run and the first few
     segments and the body is allowed to bend further.

     Without this a splitter never places at all: 44 segments of hazard
     plus 45 of warning is 89 segments, and 89 segments under a post scale
     curvature of 3.0 essentially never occurs in this grammar. The body
     limit is set below the point where centrifugal eats the whole of the
     steering, which is 1/CENTRIFUGAL, about 8.0, so the car can always
     still hold its lane. */
  HAZARD_ENTRY_SEGMENTS:      8,
  HAZARD_BODY_CURVE:        6.0,

  BLOCKER_HALF:             420,     // world units
  BLOCKER_SEGMENTS:           5,
  BLOCKER_OFFSET_MIN:      0.28,     // road half widths from the centre line
  BLOCKER_OFFSET_MAX:      0.62,
  SPLITTER_HALF:            300,
  SPLITTER_SEGMENTS:         44,     // about a second of committing to one side
  MOVER_HALF:               320,
  MOVER_SEGMENTS:             5,
  MOVER_SWING:             0.36,     // road half widths either side of centre
  /* Slow enough to read, and that is a hard number rather than a feel.
     A mover the car cannot outrun sideways is not a timing problem, it is
     a coin toss: commit to a side, watch it follow you, die. So the sweep
     speed is gated against the car's own lateral speed in hazardFits and
     the placement is rejected if the ratio is under MOVER_OUTRUN. At a
     swing of 0.52 and this period the mover crosses at about 0.54 half
     widths per second against roughly 2.0 the car can manage in the worst
     curvature a hazard is allowed to sit in. */
  MOVER_PERIOD:             6.0,     // seconds for a full sweep
  MOVER_OUTRUN:             2.5,     // times faster the car must be, sideways

  /* When each kind first appears, in seconds of the run, and how often
     one is tried after that. The on ramp has none at all: a new player
     never meets a mover and a good player meets everything, which is the
     same split the difficulty ramp already uses and it does the
     forgiveness work for free. EVERY is a mean gap in segments, so
     smaller is more often. All six are LIVE. */
  /* A hazard is SCHEDULED first and the road is then built to suit it,
     rather than a suitable gap being hunted for in road that already
     exists. That is the right dependency order and it is what makes them
     common enough to be a mechanic: hunting refused about 1160 of every
     1600 candidates, almost all of them warning runs that fell inside a
     corner, and it capped the whole system at roughly one hazard a
     minute.

     It also improves the road rather than costing anything. A readable
     approach IS the planning time section 4.3 asks for, and a hazard that
     resolves properly beats one that appears out of a bend.

     The approach is a lazy bend rather than a dead straight most of the
     time, because a game that lays sixty segments of nothing every time
     it wants to show you something has traded one kind of boring for
     another. Anything up to CURVE_GENTLE stays inside the readability
     gate with room to spare. */
  HAZARD_APPROACH_CURVE:    0.7,     // of CURVE_GENTLE, the lazy bend it arrives on
  HAZARD_STRAIGHT_CHANCE:  0.40,     // how often the approach is dead straight instead
  HAZARD_RUNOUT:             16,     // segments of gathering up afterwards

  /* The first blocker is inside the on ramp on purpose. A blocker on a
     wide road at eighteen seconds is not a threat, it is the teaching
     moment section 5 says to use instead of words: it is unmissable, it
     is survivable, and it explains itself. */
  BLOCKER_TIME:              18,     // seconds, inside the on ramp
  SPLITTER_TIME:             55,
  MOVER_TIME:                85,
  /* Mean segments between hazards of that kind, and now that the road is
     built to suit them these are the real spacing rather than an attempt
     rate that mostly failed. A segment is about a fortieth of a second,
     so a thousand segments is roughly twenty two seconds. All LIVE. */
  BLOCKER_EVERY:           1000,     // LIVE
  SPLITTER_EVERY:          3200,     // LIVE
  MOVER_EVERY:             2400,     // LIVE

  /* ----------------------------------------------------------------
     JUMPS, AND THEY ARE FOR FUN RATHER THAN FOR CHALLENGE.

     Ramps went out with the old rings in session nine and never came
     back. The version that was removed was an edge commitment with a
     collectible on top and it added nothing, so this is deliberately the
     opposite of it: centred, unmissable, forgiving to land, and worth
     doing because the air is good rather than because it is scored.

     THE DRIFT SURVIVES THE AIR, which is the whole point. Nothing here
     touches drift.headingV or drift.lateralV, so the slip angle the
     driver launched with is the slip angle they land on. The multiplier
     is held rather than decayed while airborne and the chain does not
     lapse, so a jump is part of a drift rather than an interruption to
     one. Landing a slide is meant to be the best thing in the game.

     LANDING IS FORGIVING. Only landing off the road kills. Landing in the
     scrape band is a bad landing and costs speed and a shake; landing on
     the road costs almost nothing. The three bands are the road's own, so
     there is nothing new to learn. */
  JUMP_RAMP_SEGMENTS:         9,     // how long the ramp itself is
  JUMP_RAMP_HEIGHT:        1100,     // world units at the lip, and the height the car leaves at
  JUMP_RAMP_HALF:          0.62,     // of the local half width, so it is centred and wide
  JUMP_LAUNCH_V:          14000,     // LIVE, world units a second, straight up off the lip
  JUMP_GRAVITY:           30000,     // LIVE, world units per second squared
  /* Enough to correct a bad launch, not enough to make the launch free.
     A share of the ground steering rate. */
  JUMP_AIR_STEER:          0.34,     // LIVE
  /* THE LANDING, AND IT USED TO COST YOU. A player asked whether he was
     meant to hit these or avoid them, and reading the old constants the
     honest answer was AVOID: a clean landing multiplied speed by 0.82 and
     fewer than half of them carried any time at all.

     A reward that arrives less than half the time cannot be learned. It
     is worse than no reward, because the player cannot form a rule and so
     forms the wrong one. So: EVERY jump pays, and a landing that is on
     the road is not slowed at all. The only speed penalty left is for
     landing in the scrape band, which is a bad landing and should cost. */
  JUMP_LAND_SLOW_TIME:     0.45,     // seconds the landing costs speed for
  JUMP_LAND_SLOW:          1.00,     // LIVE, a landing ON the road is free
  JUMP_LAND_SLOW_BAD:      0.58,     // and on a landing in the scrape band
  JUMP_LAND_SHAKE:            5,     // pixels, routine
  JUMP_LAND_SHAKE_BAD:       11,     // pixels, bad, and still capped with everything else
  JUMP_LAND_SHAKE_BIG:        9,     // LIVE, a great landing, and still capped
  /* WHAT THE LANDING IS WORTH, and REWARD THE LANDING RATHER THAN THE
     JUMP. This is a drifting game, so the thing worth paying for is
     coming down still sideways. Anybody can drive up a ramp; landing on
     opposite lock is a skill expression, and it is measured with the slip
     angle the whole rest of the game already runs on.

     quality = SLIP_WEIGHT * (slip at touchdown / SLIP_REF)
             + AIR_WEIGHT  * (air time / AIR_REF)
     clamped to 0..1, and the two weights sum to one so quality really is
     a share. Air contributes because a fuller commitment off the lip
     should pay, but slip is worth more because slip is the game. */
  JUMP_BOOST_SECONDS:      0.90,     // LIVE, seconds every landing pays
  JUMP_BOOST_BEST:         1.80,     // LIVE, seconds more at quality one
  /* AND POINTS, WHICH IS THE HALF THAT WAS MISSING. A bit of clock is
     insurance, not a reward: it pays out later, invisibly, as a run that
     happened to last longer, and nothing about it says a thing was
     landed.

     SIZED AGAINST WHAT A SECOND OF DRIVING IS WORTH, measured rather
     than picked. At these rates a second at a good multiplier is 800 to
     1200 points, so a minimum landing pays about a second and a full one
     about four. That is a number big enough to see arrive on a counter
     that is already climbing, and small enough that a day of jumps moves
     a total by single figure percentages.

     ON THE SAME QUALITY AS THE CLOCK, so slip and air decide both and
     there is one rule to learn. Slip is 0.68 of it and air 0.32: a
     sideways landing pays about four times a straight one, which is the
     skill expression and the reason to aim at a ramp rather than take
     it.

     FLAT, NOT MULTIPLIED BY THE MULTIPLIER, and that is deliberate. Every
     other point in this game arrives through the multiplier, so a jump
     award that also scaled would be the only thing paying it twice, and
     it would be worth four hundred seconds of driving at a multiplier of
     one and four at twelve. A landing is worth what a landing is worth. */
  JUMP_POINTS:              900,     // LIVE, points every landing pays
  JUMP_POINTS_BEST:        3600,     // LIVE, points more at quality one
  JUMP_LAND_SLIP_REF:      0.62,     // slipNorm that counts as fully sideways
  JUMP_LAND_SLIP_WEIGHT:   0.68,     // LIVE, slip's share of the quality
  JUMP_LIP_LOSS:           0.34,     // LIVE, share of the launch lost at the ramp's edge
  JUMP_LAND_AIR_REF:       0.98,     // seconds of air that counts as full commitment
  JUMP_LAND_AIR_WEIGHT:    0.32,     // and air's share, the two summing to one
  JUMP_LAND_BAD_KEEP:      0.25,     // LIVE, share of the pay a bad landing keeps
  /* THE TWO RUNGS, and the gap between them is the whole point. Jumps are
     frequent, so a full celebration on every one goes stale inside a run
     and becomes exactly the clutter this game has spent sessions keeping
     off the road. A routine landing gets a number and a thump. Only a
     landing over TIER_BIG earns the burst, the flare and the sting. */
  JUMP_TIER_GOOD:          0.40,     // LIVE, quality for the middle rung
  JUMP_TIER_BIG:           0.72,     // LIVE, quality for the full treatment
  /* The touchdown itself. Particles off the wheels, a mark burnt into the
     road, and a short spike in the world reaction that is nowhere near
     what the finale does and clearly more than driving does. */
  JUMP_LAND_BITS:            10,     // LIVE, particles at quality zero
  JUMP_LAND_BITS_GAIN:       26,     // LIVE, more at quality one
  JUMP_LAND_PUFFS:            6,     // LIVE, smoke puffs off each rear wheel
  JUMP_LAND_MARK:          0.85,     // LIVE, the mark burnt in on touchdown
  JUMP_LAND_FLARE:         0.55,     // LIVE, the world reaction spike at quality one
  JUMP_LAND_FLARE_TIME:    0.70,     // LIVE, seconds it takes to fall away
  /* The thump, on the crash voice at a fraction of its gain, because that
     is already the one voice in the graph that can make a body sound. */
  JUMP_LAND_THUMP:         0.30,     // LIVE, peak gain at a great landing
  JUMP_LAND_THUMP_TIME:    0.22,     // LIVE, seconds it takes to die
  JUMP_LAND_THUMP_FREQ:     110,     // Hz it knocks from
  /* The camera follows the car up, damped, so the jump reads as height
     without the car leaving the frame. A share of the car's height, with
     a lag on it. */
  JUMP_CAM_FOLLOW:         0.62,     // LIVE
  JUMP_CAM_TIME:           0.18,     // seconds of lag on that
  /* THE ARROW, and it must never be confused with the hazard warning.
     The hazard's arrow lies FLAT ON THE ROAD and points ALONG it: it says
     move sideways, now. This one STANDS UP off the road and points at the
     SKY: it says aim here and go up. Different plane, different axis,
     different colour family, and a cold player read the old ramp markings
     as a hazard once already. */
  JUMP_ARROW_COUNT:           4,     // chevrons standing before the ramp
  JUMP_ARROW_SPACING:        11,     // segments between them
  JUMP_ARROW_HEIGHT:        820,     // world units, taller than a pylon so it reads far out
  JUMP_ARROW_HALF:         0.26,     // of the half width
  JUMP_ARROW_THICK:        0.34,     // of the chevron height, the stroke
  /* When the first one turns up and how often after that. Inside the
     first minute and often enough to meet several in a normal run, which
     is the lesson the hazards paid for: a feature met once every few runs
     may as well not exist. Both LIVE. */
  JUMP_TIME:                 30,     // LIVE, seconds into the run
  JUMP_EVERY:              1200,     // LIVE, mean segments between them, about 52s
  JUMP_RUNOUT:               34,     // segments of landing room past the lip, and
                                    // it must exceed the flight, which is about 23

  /* ----------------------------------------------------------------
     THE BIOME WHEEL. One palette, turned. BIOME_COUNT is how many equal
     steps the hue wheel is cut into, so it is exactly how many distinct
     biomes a run can see before any repeats. BIOME_MIN_STEP is the
     smallest angle allowed between two consecutive gates, which is what
     stops the shuffle putting two near identical places back to back.
     Both LIVE, and changing the count regenerates the wheel. */
  BIOME_COUNT:               12,     // LIVE
  BIOME_MIN_STEP:            90,     // LIVE, degrees

  /* ----------------------------------------------------------------
     THE DAILY IS A FIXED LENGTH TRACK WITH A FINISH LINE.

     Endless has no end and none of this touches it. The daily needs one,
     because a deterministic road with no end is only endless with extra
     steps: it makes finishing impossible, so there is nothing to
     compare, and the ghost is a pace car rather than a rival.

     THE DAY IS THREE TRACKS, NOT ONE, and they are played in order.

     THE TOTAL IS THE DESIGN CONSTRAINT, not the level count. Handoff 2.5:
     a daily works as an appointment at three to five minutes and becomes
     homework at ten. At the current spacing of 33.3 seconds a gate, the
     count below is 2, 4 and 5 gates, which is 57 + 123 + 157 = 337
     seconds clean, five minutes thirty seven. If a length ever drifts
     upward the fix is to shorten it, not to accept the total.

     THREE, BECAUSE THREE CONFIGURATIONS ALREADY EXIST. The on ramp
     values, the mid values and the deep values. Level one is the on ramp
     band held for the whole level, level two completes the on ramp and
     never goes deep, level three is the game as it was. Nothing here is
     an invented difficulty setting; see levelBand.

     THE COUNT IS NOT HARDCODED ANYWHERE. Everything downstream, the
     progression, the records, the ghosts, the finale and every layout,
     reads LEVEL_COUNT, and the gate counts and difficulty bands are
     INTERPOLATED across whatever it is set to. Two levels gives 2 and 5
     gates at the on ramp and deep bands; four gives 2, 3, 4, 5. The
     right count is exactly the sort of question watching people play
     will answer, so it has to be one number to change.

     THE LENGTHS NO LONGER VARY BY DAY. They used to come off the seed,
     six to eight gates, and that was right when the day was one track.
     Three tracks with three independent lengths puts the TOTAL, which is
     the thing that actually has to hold, on a random walk. The road
     still changes completely every day; only its length is fixed.

     THE LAST GATE IS THE FINISH. There is no extra structure after a
     count of checkpoints: gate N ends the run, which is why the pips and
     the countdown and the line are all the same number. */
  LEVEL_COUNT:                5,     // LIVE, and read by everything
  LEVEL_GATES_FIRST:          2,     // LIVE, gates on level one
  LEVEL_GATES_LAST:           6,     // LIVE, gates on the last level
  /* THE SHAPE OF THE RAMP BETWEEN THEM, and it is not linear. See
     levelBand. Above one compresses the middle levels toward the easy
     end and leaves both ends untouched, which is how level two stops
     being a wall without level one gaining anything or level three
     losing anything. One is the old straight line. */
  LEVEL_RAMP_POWER:         1.6,     // LIVE
  /* WHERE THE DIFFICULTY STOPS CLIMBING, and it is the whole of how five
     levels extend the ceiling without raising the floor.

     THE PROBLEM IT SOLVES. Difficulty used to be a pure function of how
     far along the levels a level sat, so going from three to five
     stretched the curve: measured, level three fell from the full
     difficulty band to 0.33, which is what level TWO used to be. A
     player who gets stuck at level three today would have cleared three
     and four and stopped at five, and the day would have got longer for
     exactly the people it must not get longer for.

     So difficulty reaches its ceiling at THIS level and holds. At three,
     levels one two and three have the bands they have always had, to the
     bit, and four and five are the same road at the same settings, only
     longer. The early curve is not touched and the newcomer's wall does
     not move.

     LENGTH IS A SEPARATE RAMP, and a straight one. See levelGatesFor.
     Difficulty is bent because level two was a wall; length is not,
     because an even step is the thing that was asked for and 2 3 4 5 6
     gates is 33.3 seconds a level, every level. */
  LEVEL_HARD_AT:              3,     // LIVE, the level that reaches full difficulty
  /* The run out past the finish, laid in fixed size pieces so the
     slicing is a pure function of the segment index rather than of how
     far the camera had got. See topUpRoad. NOT live: changing it changes
     the road, which is the one thing the daily may not do per device. */
  FINISH_RUNOUT_CHUNK:       64,     // segments
  /* Nothing is placed inside this of the line. The closing stretch is
     meant to be the hardest part of the day, not a lottery on the last
     corner, and a blocker straddling the finish would decide the run
     rather than test it. */
  FINISH_CLEAR_SEGMENTS:     40,
  /* The finish, drawn in the world. Taller and wider than a gate on
     purpose: it has to resolve out of the draw distance as a thing
     arriving rather than appear as a thing that was suddenly there. */
  FINISH_HEIGHT:           3800,     // LIVE, world units to the banner
  FINISH_POST:              320,     // world units, post thickness
  FINISH_BANNER:           0.20,     // banner depth, as a share of the height
  FINISH_BARS:                7,     // light bars down each post
  /* The pips: one per gate, filling as they are passed. Daily only, so
     their presence is also what says which mode this is. */
  PIP_SIZE:               0.020,     // LIVE, of the smaller screen dimension
  PIP_GAP:                0.009,     // LIVE
  PIP_ALPHA_DONE:          0.85,     // LIVE
  PIP_ALPHA_TODO:          0.22,     // LIVE
  /* How long the one sentence under the mode marker stays up. Long
     enough to read on the way into the first corner, short enough that
     it is gone before it becomes furniture. */
  MODE_NOTE_SECONDS:          5,     // LIVE

  /* ----------------------------------------------------------------
     THE GHOST, WHICH ONLY EXISTS ON THE DAILY.

     A recorded car is only worth watching if it drove the road you are
     on. In endless the road is fresh every run, so a replayed line would
     drive through hazards and off the edge inside seconds; there is
     deliberately no fallback for it and there should not be one.

     SAMPLED BY DISTANCE, NOT BY TIME, which is what makes the record
     small and the replay exact. Sample i is at exactly i * step world
     units, so the ghost's position along the road needs no storage at
     all and cannot drift. What IS stored per sample is the time it took
     to get there, which is the only thing that varies between two runs
     of the same road, and it is what lets the ghost be passed. */
  GHOST_STEP_SEGMENTS:        5,     // 1000 world units, about nine samples a second
  GHOST_MAX_SAMPLES:       4000,     // a bit over seven minutes, then it stops recording
  GHOST_ALPHA:             0.42,     // LIVE, it must never compete with the road
  GHOST_HEIGHT:             320,     // world units to the roof
  GHOST_CABIN_WIDE:        0.66,     // the roof, as a share of the footprint
  GHOST_CABIN_LONG:        0.46,
  GHOST_CABIN_BACK:        0.22,     // and set back, so it has a bonnet
  GHOST_PASS_GAP:           900,     // world units of hysteresis, so a dead heat is not a strobe
  GHOST_PASS_COOLDOWN:      2.5,     // seconds between pass callouts

  /* ----------------------------------------------------------------
     Progressive difficulty, in two halves that are deliberately not the
     same thing.

     THE ON RAMP is the first ONRAMP_SECONDS and it replaces the tutorial
     section 5 refuses to allow. Wide road, gentle curves, nothing above
     ONRAMP_INTENSITY, and rests often. A player who understands nothing
     should get through it, and a player who understands the game should
     pass through it in a minute without ever noticing it was there.

     THE DEEP GAME is everything after, and it keeps ramping over
     RAMP_SECONDS: curve scale up, road down to ROAD_SQUEEZE, everything
     unlocked, rests rare.

     Difficulty comes from geometry, width and frequency, and never from
     speed. Speed is the wrong lever in this engine: centrifugal is per
     second, so a faster car spends less time in a corner and the corner
     gets weaker, and all a speed ramp really buys is less reaction time.

     ADAPTATION TOUCHES THE ON RAMP AND NOTHING ELSE. It moves where the
     easy part ends inside the window, never where the window ends, so
     difficulty past ONRAMP_SECONDS is a pure function of elapsed time and
     identical for everybody. That is what keeps scores comparable: every
     score worth comparing was earned in the shared part of the run. */
  /* FORGIVENESS COMES FROM MARGIN, NOT FROM ABSENCE. The first version of
     this on ramp was specified as an absence of things: rests seven times
     in ten, most of the phrase library locked out, corners that barely
     bent, for a whole minute. It was survivable and it was the least
     interesting minute in the game, which is the minute almost everybody
     plays.

     What actually stops a new player dying is the width and the scrape
     band, so those stay generous and everything else comes back. Corners
     that are real corners on a road wide enough to survive them are the
     thing worth learning; a straight is punctuation. All of these are
     LIVE so the balance can be found by playing rather than by argument. */
  ONRAMP_SECONDS:            30,     // LIVE, the whole on ramp, the same for everyone
  ONRAMP_FLAT:                6,     // seconds of it that stay at the easiest setting
  ONRAMP_CURVE:             1.9,     // LIVE, curve scale at the start of a run
  ONRAMP_WIDTH:            1.22,     // LIVE, road width multiplier at the start
  ONRAMP_INTENSITY:           2,     // LIVE, hardest phrase the on ramp may use
  ONRAMP_REST:             0.22,     // LIVE, chance of a forced breath after a phrase
  RAMP_SECONDS:             100,     // LIVE, on ramp end to full difficulty
  /* Equal to CURVE_SCALE, so the curve does not escalate past the on
     ramp at all. It was 3.1, which pushed curvature 24% past anything the
     camera was set up for and walked most of the drivable surface off the
     side of the screen on every hard corner. Width, intensity and rest
     frequency carry the deep game instead, and they are better levers in
     this engine anyway. Raising this above CURVE_SCALE costs visible road
     roughly in proportion: see the note above CAMERA_HEIGHT. */
  CURVE_SCALE_DEEP:         2.5,     // where the curve scale ends up
  ROAD_SQUEEZE:            0.88,     // road width multiplier at full difficulty
  DEEP_INTENSITY:             3,
  /* ------------------------------------------------------------------
     THE UNFAILABLE OPENING. Not easy. Unfailable.

     The first OPENING_SECONDS of every run cannot end it. No hazards, no
     jumps, and the road edge does not kill: a car that runs out of road
     is held at the lip, scraping, until the opening is over.

     WHY IT IS A HELD EDGE AND NOT A GENTLE CURVE, which is what was
     asked for. "Curvature low enough that the car cannot leave the road
     even with the steering held hard over" cannot be built, and not
     because of tuning. Curvature is the centrifugal push the ROAD makes;
     the steering is the driver's own input and it is independent of it.
     At full lock the car crosses the road and leaves it on any curvature
     there is, including none at all, and no width survives twenty
     seconds of it. So the thing that has to give is the death, and the
     acceptance test that was asked for, hold one direction from the
     first frame and be alive at twenty seconds, is exactly the test of
     that. Driven, both directions, several seeds: see the report.

     It is also the right shape for section 5, which refuses a tutorial
     and says the first seconds of the real game are the tutorial. A new
     player who holds the wrong thing meets the edge, hears it, sees the
     sparks, and drives on. That teaches the edge. Dying teaches nothing
     in the first twenty seconds because there was nothing to have known.
     ------------------------------------------------------------------ */
  OPENING_SECONDS:           20,     // LIVE, the part of a run that cannot end it
  /* WHERE THE OPENING HOLDS THE CAR, in the same half widths as the
     bands above. INSIDE the scrape band and not at the lip, and the
     difference is the whole handover.

     MEASURED. Held at OFF_ROAD, every one of thirty two driven cases
     died on the LAST FRAME of the window: the car sat exactly on the
     lip for twenty seconds and the instant the protection lifted it was
     already off the road. That is a cliff at 20.000 seconds, which is a
     worse thing to hand a new player than the death it was meant to
     prevent. Held here, the car is on the road when the protection
     lifts, loudly scraping, with the whole of SCRAPE_TIME_LIMIT to do
     something about it. Nothing is teleported and nothing changes on
     the stroke of twenty; the rules simply start counting. */
  OPENING_EDGE:            1.18,     // LIVE, between SCRAPE_START and OFF_ROAD
  /* THERE IS NO ADAPTIVE DIFFICULTY ANY MORE and the ADAPT_ terms that
     were here are gone. It softened the on ramp for a player who kept
     dying in it, was kept off the daily so the shared road stayed
     shared, and it is still the wrong shape: two players comparing a
     score have to have driven the same thing, and a road that quietly
     differs by who has been struggling makes both the ghost and the
     share meaningless the moment it ever reaches the daily.

     What replaces it is deterministic and has no memory of how anybody
     drove: the first FIRST_RUNS runs this browser has ever seen ramp
     more gently AFTER the opening, and then never again. A count, not a
     judgement. */
  FIRST_RUNS:                 3,     // how many runs get the gentler ramp
  FIRST_RUN_FLAT_EXTRA:      12,     // extra seconds of the easiest setting
  FIRST_RUN_CURVE_EASE:     0.3,     // curve scale taken off the start
  FIRST_RUN_WIDTH_EASE:    0.14,     // road width added at the start

  /* Frame. Clamped so a stutter cannot teleport the player off the road. */
  MAX_FRAME_DELTA:      1 / 20
};


/* ------------------------------------------------------------------
   PALETTE. Neon on dark.

   Section 7 refuses this look and the reasoning there is about
   distinctiveness and about readability. The distinctiveness argument has
   been overruled deliberately by the author. The readability argument has
   not, and it is binding, so this block is ordered by luminance and the
   order is the specification:

     1. the road edge, brightest thing on screen, nothing may beat it
     2. the car, bright and warm so it never reads as part of the road
     3. tyre marks, glowing, a third hue so they are never an edge
     4. the road surface, dark but plainly lighter than the void
     5. the centre line, dimmer than the edge and never competing
     6. the walls of the slab, darker than its top, so the edge catches
        light and the wall does not
     7. the grid and the void

   The Beakdown failure this is closest to is a dark surface lost against
   a dark background, so item 4 above is the one to check first if any of
   this is changed.
   ------------------------------------------------------------------ */
/* The palette is one decision, made twice.

   The world is warm: reds and oranges, saturated, dark where it needs to
   be dark and hot where it needs to be seen. The car is cool, and that is
   not a taste, it is the whole reason it reads. A yellow car worked
   because it was the one warm object in a cool world; turning the world
   warm without turning the car would have hidden it. So the relationship
   is inverted rather than kept, and the car is now the one cool object in
   a warm world. It stays the highest contrast thing on screen, which is
   the only rule about it that matters.

   The three rules from the neon session are unchanged and still bind:
   the road edges are the brightest thing on screen, the road surface
   stays plainly above the void in value, and the centre line stays dim
   enough that it can never be mistaken for an edge. The tyre marks are a
   fourth: they ran cool to hot through magenta before, and magenta on
   warm asphalt is a much weaker read than magenta on blue, so the ramp is
   now blue to cyan to white and carries its intensity in value rather
   than in hue. */
/* The place the run is in. Only the background moves: the sky, the glow
   on the horizon, the grid under the road and the skyline on it. The road
   itself and the car are deliberately untouched, because the readability
   rules from the neon session are load bearing and a biome that breaks
   them is a biome that kills people. This is the smallest thing that
   honestly reads as somewhere new, and it cannot make the game unfair. */
/* ==================================================================
   THE BIOMES, GENERATED RATHER THAN AUTHORED.

   There used to be four hand written palettes here. Four is not enough:
   a run that reaches eleven gates cycles the same four three times over
   and the moment stops being a moment.

   So the palette below is the ONE palette, and a biome is that palette
   ROTATED AROUND THE HUE WHEEL. Every colour turns by the same angle,
   which is what makes this safe: hue rotation is a rigid motion on the
   wheel, so every RELATIVE hue separation in the world survives it
   exactly. The car sits about a hundred and seventy degrees from the road
   in the base palette, which is very nearly the maximum, and it still
   sits a hundred and seventy degrees from it at every rotation. Section 7
   does not have to be re-argued per biome, because there is nothing
   per biome to argue about.

   THE LUMINANCE IS HELD, NOT THE LIGHTNESS, and that distinction is the
   whole of the generator. Rotating hue in HSL and keeping L looks like it
   should preserve brightness and does not: HSL's L is the midpoint of the
   largest and smallest channel, and the eye weights green about ten times
   more than blue. Rotating the road edge from amber toward blue at fixed
   L drops it far enough to lose the edge, which is hard limit one. So
   every rotated colour is bisected back onto the sRGB relative luminance
   the original had. Value relationships are therefore invariant, which is
   exactly what the five readability rules are written in terms of.
   ================================================================== */

function srgbLuma(r, g, b) {
  const lr = r / 255, lg = g / 255, lb = b / 255;
  const a = lr <= 0.04045 ? lr / 12.92 : Math.pow((lr + 0.055) / 1.055, 2.4);
  const c = lg <= 0.04045 ? lg / 12.92 : Math.pow((lg + 0.055) / 1.055, 2.4);
  const d = lb <= 0.04045 ? lb / 12.92 : Math.pow((lb + 0.055) / 1.055, 2.4);
  return 0.2126 * a + 0.7152 * c + 0.0722 * d;
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  const l = (mx + mn) / 2;
  if (d === 0) return [0, 0, l];
  const sat = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  let h;
  if (mx === r) h = ((g - b) / d) % 6;
  else if (mx === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  h *= 60;
  if (h < 0) h += 360;
  return [h, sat, l];
}

function hslToRgb(h, sat, l) {
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * sat;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function hex2(v) { return (v < 16 ? '0' : '') + v.toString(16); }

/* Turn one colour, holding its saturation and its measured luminance.
   The output keeps whatever notation the input used, because the palette
   mixes hex, bare triples and rgba and every reader of it expects the
   form it was written in.

   THE TRANSLUCENT LAYERS ARE MEASURED AS COMPOSITES, and that correction
   is the second thing this generator had to learn. Holding the luminance
   of a colour that is drawn at alpha 0.22 holds the luminance of a colour
   nobody ever sees: what reaches the eye is that colour OVER the void,
   and sRGB alpha blending is not luminance preserving, so two hues at the
   same layer luminance land at different composite luminances over the
   same background. Measured, that alone moved the drivable surface
   against the void from 2.2 units of separation to 1.1 at sixty degrees,
   which is rule two failing on a palette that passed on paper. So a
   colour with alpha is matched on its composite over the background it
   will actually be drawn on, which for the grid is the void.

   `was` and `now` are the background before and after the same rotation.
   They have the same luminance and different hues, which is precisely why
   the target has to be measured on one and solved on the other. */
function rotateHue(colour, deg, was, now) {
  // The unturned biome is the palette exactly as it was written, not the
  // palette after a round trip through HSL and back.
  if (!deg) return colour;
  const c = rgbOf(colour);
  const a = c[3];
  function over(rgb, bg) {
    if (a >= 1 || !bg) return srgbLuma(rgb[0], rgb[1], rgb[2]);
    return srgbLuma(rgb[0] * a + bg[0] * (1 - a),
                    rgb[1] * a + bg[1] * (1 - a),
                    rgb[2] * a + bg[2] * (1 - a));
  }
  const want = over(c, was);
  const hsl = rgbToHsl(c[0], c[1], c[2]);
  const h = hsl[0] + deg, sat = hsl[1];
  /* Luminance rises monotonically with L at fixed hue and saturation, and
     compositing at fixed alpha is monotonic in it too, so twenty
     bisections put it within a thousandth. Cheaper solutions were not
     looked for: this runs once per colour per biome at load. */
  let lo = 0, hi = 1, out = hslToRgb(h, sat, hsl[2]);
  for (let i = 0; i < 20; i++) {
    const mid = (lo + hi) / 2;
    out = hslToRgb(h, sat, mid);
    if (over(out, now) < want) lo = mid; else hi = mid;
  }
  if (colour.charAt(0) === '#') return '#' + hex2(out[0]) + hex2(out[1]) + hex2(out[2]);
  if (colour.indexOf('(') >= 0) {
    return 'rgba(' + out[0] + ',' + out[1] + ',' + out[2] + ',' + c[3] + ')';
  }
  return out[0] + ',' + out[1] + ',' + out[2];
}

/* What does NOT turn with the world. The HUD is a readout, and a readout
   whose colour changes every gate is a readout that has to be re-learned
   every gate. The arcade gold and the white text stay put. Everything
   else in the palette, including the car, the hazards, the gate, the
   jumps, the tyre marks and the smoke, turns together. */
/* THE COLOURS THE HUE WHEEL MAY NOT TOUCH.

   THE HAZARD AND JUMP FAMILIES ARE HERE BECAUSE OF A BUG, and it is the
   reason two different players confused the two IN OPPOSITE DIRECTIONS.
   Every colour in this file rotated with the biome, including these, so
   MEASURED across the twelve biomes:

     biome 0   hazard #ff3d7a hot pink      jump #4dff7a green
     biome 4   hazard #32a000 GREEN         jump #e4dcff pale lavender
     biome 5   hazard #00a21e GREEN         jump #f5d6ff pale pink
     biome 10  hazard #c955ff purple        jump #b6f300 lime
               and the hazard's own warning arrows #4dff62 BRIGHT GREEN

   So a player who learns "green means jump" on the first road is shown
   green hazards four biomes later, and the warning arrows painted in
   front of a hazard come out the exact green the ramp used. The visual
   language does not merely fade, it INVERTS. No amount of restyling
   survives that, so danger is danger in every biome and go is go in
   every biome, pinned exactly the way the score colours already are and
   for exactly the same reason: they mean something. */
const PALETTE_FIXED = { SCORE: 1, SCORE_BEST: 1, SCORE_RECORD: 1, SCORE_GLOW: 1,
                        SCORE_EDGE: 1, TEXT: 1, TEXT_SHADOW: 1,
                        BAR_TRACK: 1, BAR_FILL: 1, BAR_LOW: 1,
                        // The title screen's own family. See COLOUR.
                        TITLE_DIM: 1, TITLE_SCRIM: 1,
                        // Danger. Never green, never anywhere near the jump.
                        HAZARD_TOP: 1, HAZARD_SIDE: 1, HAZARD_LIP: 1,
                        HAZARD_GLOW: 1, HAZARD_DARK: 1, HAZARD_WARN: 1,
                        HAZARD_WARN_BAR: 1, HAZARD_WARN_ARROW: 1,
                        // Go. Never red, never anywhere near the hazard.
                        JUMP_DECK: 1, JUMP_DECK_DARK: 1, JUMP_SIDE: 1,
                        JUMP_LIP: 1, JUMP_GLOW: 1, JUMP_ARROW: 1 };

let PALETTE_BASE = null;
let BIOMES = [];
function buildBiomes() {
  if (!PALETTE_BASE) {
    PALETTE_BASE = {};
    for (const k in COLOUR) PALETTE_BASE[k] = COLOUR[k];
  }
  const n = Math.max(1, Math.round(FEEL.BIOME_COUNT));
  const wasVoid = rgbOf(PALETTE_BASE.VOID);
  BIOMES = [];
  for (let i = 0; i < n; i++) {
    const deg = i * 360 / n;
    const b = {};
    // The void first, because the translucent layers are solved against
    // it and it has to be this biome's void rather than the last one's.
    b.VOID = rotateHue(PALETTE_BASE.VOID, deg);
    const nowVoid = rgbOf(b.VOID);
    for (const k in PALETTE_BASE) {
      if (k === 'VOID') continue;
      b[k] = PALETTE_FIXED[k] ? PALETTE_BASE[k]
                              : rotateHue(PALETTE_BASE[k], deg, wasVoid, nowVoid);
    }
    BIOMES.push(b);
  }
  biomeBag.length = 0;
  biomeRecent.length = 0;
  lastBiomeHue = -999;
}

function biomeHue(i) { return i * 360 / BIOMES.length; }
function hueGap(a, b) {
  const d = Math.abs(((a - b) % 360 + 360) % 360);
  return d > 180 ? 360 - d : d;
}

/* THE ORDER, AND IT IS NOT RANDOM. Picking at random puts two neighbours
   on the wheel back to back about as often as not, and two similar hues
   in a row wastes the moment entirely. Instead: a bag holding every hue
   exactly once, drawn greedily from whatever is still far enough from the
   last one, and refilled when it runs out. Every hue is therefore seen
   before any repeats, and the tail of a bag falls back to the FARTHEST
   remaining rather than to nothing, so the rule never simply gives up.

   THE STREAM IT DRAWS FROM IS NOT rng(). rng() belongs to the road
   generator and drawing from it here would move the road, which is the
   bug that pinned seeds exist to catch. So the bag has a mulberry32 of
   its own.

   On ENDLESS that generator is seeded from Math.random and the order is
   different every run, which is what it should be. ON THE DAILY IT IS
   SEEDED FROM THE DAY, so two devices see the same twelve places in the
   same order on the same road. The biome sequence is a generator input
   like any other and the brief lists it by name. */
const biomeBag = [];
const biomeRecent = [];
let lastBiomeHue = -999;

let biomeRngState = 1;
function biomeSeed(v) { biomeRngState = (v >>> 0) || 1; }
function biomeRandom() {
  biomeRngState = (biomeRngState + 0x6D2B79F5) | 0;
  let t = Math.imul(biomeRngState ^ (biomeRngState >>> 15), 1 | biomeRngState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/* One greedy shuffle: take everything still far enough from the hue
   before it and from the last few seen at all, pick at random among
   those, and fall back to the FARTHEST remaining when nothing qualifies
   rather than giving up on the rule. */
function biomeOrder() {
  const n = BIOMES.length;
  const left = [];
  for (let i = 0; i < n; i++) left.push(i);
  const recent = biomeRecent.slice();
  const order = [];
  let prev = lastBiomeHue, bad = 0;
  while (left.length) {
    const ok = [];
    for (let i = 0; i < left.length; i++) {
      if (prev > -180 && hueGap(biomeHue(left[i]), prev) < FEEL.BIOME_MIN_STEP) continue;
      if (recent.indexOf(left[i]) >= 0) continue;
      ok.push(i);
    }
    let pick;
    if (ok.length) pick = ok[Math.floor(biomeRandom() * ok.length)];
    else {
      pick = 0;
      for (let i = 1; i < left.length; i++) {
        if (hueGap(biomeHue(left[i]), prev) > hueGap(biomeHue(left[pick]), prev)) pick = i;
      }
      bad++;
    }
    prev = biomeHue(left[pick]);
    order.push(left[pick]);
    recent.push(left[pick]);
    while (recent.length > Math.max(2, Math.floor(n / 3))) recent.shift();
    left.splice(pick, 1);
  }
  return { order: order, bad: bad };
}

/* The greedy pass can paint itself into a corner at the tail of a bag,
   where only one hue is left and it happens to sit next to the one just
   used. Measured, that was about one gate in forty. So the shuffle is
   built several times and the cleanest is kept, which costs nothing once
   per twelve gates and takes it to none. */
function refillBiomeBag() {
  let best = null;
  for (let t = 0; t < 24; t++) {
    const c = biomeOrder();
    if (!best || c.bad < best.bad) best = c;
    if (!best.bad) break;
  }
  biomeBag.length = 0;
  for (let i = best.order.length - 1; i >= 0; i--) biomeBag.push(best.order[i]);
}
function nextBiome() {
  if (!biomeBag.length) refillBiomeBag();
  const i = biomeBag.pop();
  lastBiomeHue = biomeHue(i);
  /* Remembered ACROSS bags, so a hue cannot come back one gate after the
     bag turned over. The bag alone only promises no repeats inside
     itself, and the seam between two bags is exactly where a repeat
     would be most noticeable. */
  biomeRecent.push(i);
  while (biomeRecent.length > Math.max(2, Math.floor(BIOMES.length / 3))) biomeRecent.shift();
  return i;
}

let biome = 0;
function applyBiome(i) {
  if (!BIOMES.length) buildBiomes();
  biome = ((i % BIOMES.length) + BIOMES.length) % BIOMES.length;
  // A continue restores a biome by index rather than drawing one, so the
  // shuffle has to be told where it landed or the next gate could repeat
  // the hue the player is already looking at.
  lastBiomeHue = biomeHue(biome);
  const b = BIOMES[biome];
  for (const k in b) COLOUR[k] = b[k];
  // Everything precomputed from the palette, in one place, because a
  // ramp or a cached fill that missed a rotation is a colour from the
  // last biome sitting in the middle of this one.
  rebuildDerivedColours();
  // The horizon and haze gradients are cached, so they have to be rebuilt.
  if (view.h) resize();
}

/* Built once, at load, because a Path2D constructed per frame would be a
   parse of five kilobytes of d string sixty times a second.

   The try/catch is not decoration. Path2D has been everywhere since 2014
   and section 6's Chromebooks are far newer than that, but a title screen
   with no heading on it would be a bad way to find out otherwise. A null
   path makes drawBrand a no op and the callers fall back to type. */
function brandPath(art) {
  try { return new Path2D(art.d); } catch (e) { return null; }
}
BRAND.wordmark.path = brandPath(BRAND.wordmark);
BRAND.icon.path = brandPath(BRAND.icon);
function brandReady() { return !!(BRAND.wordmark.path && BRAND.icon.path); }

/* Draws one mark centred on cx, cy at the given width, and returns the
   height it took, so a caller can lay out under it without duplicating
   the aspect ratio. Nothing about the treatment is exposed: a caller
   picks a position and a width and gets the mark, which is the whole
   point of it being brand rather than art direction. */
function drawBrand(g, art, cx, cy, width, alpha) {
  if (!art.path || !(width > 0)) return 0;
  const k = width / art.w;
  const height = art.h * k;
  g.save();
  if (alpha !== undefined) g.globalAlpha = alpha;
  // Into the artwork's own coordinate space, viewBox origin included, so
  // everything below is written in the numbers the export used.
  g.translate(cx - width / 2, cy - height / 2);
  g.scale(k, k);
  g.translate(-art.x, -art.y);
  g.lineJoin = 'round';
  g.lineCap = 'round';
  g.lineWidth = art.stroke;

  g.save();
  g.translate(art.dx, art.dy);
  g.fillStyle = BRAND.SHADOW;
  g.strokeStyle = BRAND.SHADOW;
  g.fill(art.path, 'evenodd');
  g.stroke(art.path);
  g.restore();

  g.strokeStyle = BRAND.OUTLINE;
  g.stroke(art.path);

  g.fillStyle = BRAND.FILL;
  g.fill(art.path, 'evenodd');
  g.restore();
  return height;
}

/* ------------------------------------------------------------------
   LAYING OUT BY THE INK RATHER THAN BY THE BOX.

   Both viewBoxes carry a margin, and neither margin is symmetrical: the
   export sized them to hold the stroke AND the offset shadow, so there
   is more room on the right and underneath than on the left and above.
   Centring the BOX therefore leaves the letters visibly off centre, and
   asking for a box width gives a mark noticeably smaller than the number
   asked for.

   These four shares per mark are MEASURED off a real render at 520 and
   400 pixels wide, not derived from the d string, because the d string
   is relative and says nothing about where the stroke and the shadow
   land. Re measure them if the artwork is ever replaced.
   ------------------------------------------------------------------ */
function brandInkAspect(art) {
  return (art.w * (art.ink.r - art.ink.l)) / (art.h * (art.ink.b - art.ink.t));
}

/* ------------------------------------------------------------------
   DRAWN ONCE PER SIZE, NOT ONCE PER FRAME.

   The treatment is four fills and strokes of a five kilobyte path, and
   MEASURED on the title screen that came to 1.66ms a frame on a machine
   far quicker than section 6's Chromebooks. The title screen was already
   the most expensive screen in the game because it draws the whole road
   behind a stationary car, so adding a seventh of a frame to it for a
   mark that never moves is exactly the thing that turns a 60fps target
   into a 40fps one on the hardware that matters.

   So each mark is rasterised into its own offscreen canvas the first
   time a size is asked for and blitted after that. The key is the box
   width in DEVICE pixels, so a rotation or a resize rebuilds it and
   nothing else does. Two canvases, a few hundred kilobytes between them
   at the largest size either is ever drawn.

   THE DESTINATION IS SNAPPED TO WHOLE DEVICE PIXELS. Blitting a bitmap
   to a fractional offset resamples it, and on a mark with a one pixel
   outline at icon size that reads as a smear. Snapping costs at most
   half a device pixel of position on a thing that is centred by eye
   anyway.
   ------------------------------------------------------------------ */
function brandBitmap(art, boxW, boxH, dpr) {
  const pw = Math.max(1, Math.round(boxW * dpr));
  const ph = Math.max(1, Math.round(boxH * dpr));
  const key = pw + 'x' + ph;
  if (art.cacheKey === key && art.cache) return art.cache;
  let c = art.cache;
  if (!c) { c = document.createElement('canvas'); art.cache = c; }
  c.width = pw;
  c.height = ph;
  const g = c.getContext('2d');
  if (!g) { art.cache = null; return null; }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, pw, ph);
  drawBrand(g, art, pw / 2, ph / 2, pw);
  art.cacheKey = key;
  return c;
}

/* ------------------------------------------------------------------
   THE WORDMARK'S TREATMENT, APPLIED TO TYPE.

   The same three draws in the same order off the same three colours:
   the shadow, offset and both filled and stroked, then the outline, then
   the face. So a line of text set this way belongs to the brand without
   anybody having to draw it as artwork.

   THE OFFSET AND THE STROKE SCALE WITH THE TYPE, expressed as shares of
   the size rather than as pixels, for exactly the reason the wordmark's
   own do: a fixed stroke swallows the counters when it is small and
   disappears when it is large.

   Used by the finale banner and by nothing else so far. It is here
   rather than beside drawBrand because it is a text helper.
   ------------------------------------------------------------------ */
function brandText(str, cx, cy, size, alpha) {
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.font = '900 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = size * FEEL.BRAND_TEXT_STROKE;
  const dx = size * FEEL.BRAND_TEXT_SHADOW_X;
  const dy = size * FEEL.BRAND_TEXT_SHADOW_Y;
  ctx.fillStyle = BRAND.SHADOW;
  ctx.strokeStyle = BRAND.SHADOW;
  ctx.strokeText(str, cx + dx, cy + dy);
  ctx.fillText(str, cx + dx, cy + dy);
  ctx.strokeStyle = BRAND.OUTLINE;
  ctx.strokeText(str, cx, cy);
  ctx.fillStyle = BRAND.FILL;
  ctx.fillText(str, cx, cy);
  ctx.restore();
}

/* Centres the INK on cx, cy at the given ink width, and returns the ink
   height so callers can stack under it. */
function drawBrandInk(art, cx, cy, inkWidth, alpha) {
  const boxW = inkWidth / (art.ink.r - art.ink.l);
  const boxH = boxW * art.h / art.w;
  const inkH = boxH * (art.ink.b - art.ink.t);
  if (!art.path || !(boxW > 0)) return inkH;
  // Where the ink's own centre sits inside the box, as a share, so the
  // box is pushed the other way by exactly the asymmetry.
  const bcx = cx - ((art.ink.l + art.ink.r) / 2 - 0.5) * boxW;
  const bcy = cy - ((art.ink.t + art.ink.b) / 2 - 0.5) * boxH;
  const dpr = view.dpr || 1;
  const bmp = brandBitmap(art, boxW, boxH, dpr);
  if (!bmp) { drawBrand(ctx, art, bcx, bcy, boxW, alpha); return inkH; }
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.drawImage(bmp,
                Math.round((bcx - boxW / 2) * dpr) / dpr,
                Math.round((bcy - boxH / 2) * dpr) / dpr,
                bmp.width / dpr, bmp.height / dpr);
  ctx.restore();
  return inkH;
}


/* ------------------------------------------------------------------
   Colour ramps, precomputed.

   Every one of these is read once or twice a frame and they all say the
   same handful of things, so building a colour string per frame would be
   pure waste. Both endpoints always come out of the palette above rather
   than being written again here, so a repalette moves the ramps with
   everything else, and RAMP_STEPS is coarse on purpose: sixteen steps is
   below the point where the eye can see the stepping on a smooth swell
   and it keeps the tables tiny. */
const RAMP_STEPS = 16;
/* Accepts #rrggbb, a bare "r,g,b" triple, and rgba(...), and always
   returns four components so a ramp can carry alpha. The grid is the only
   palette entry with alpha baked into it, and it needs to ramp. */
function rgbOf(c) {
  if (c.charAt(0) === '#') {
    return [parseInt(c.slice(1, 3), 16),
            parseInt(c.slice(3, 5), 16),
            parseInt(c.slice(5, 7), 16), 1];
  }
  const p = c.replace(/^rgba?\(/, '').replace(/\)$/, '').split(',');
  return [+p[0], +p[1], +p[2], p.length > 3 ? +p[3] : 1];
}
function rampBetween(from, to) {
  const a = rgbOf(from), b = rgbOf(to), out = [];
  const opaque = a[3] >= 1 && b[3] >= 1;
  for (let i = 0; i < RAMP_STEPS; i++) {
    const f = i / (RAMP_STEPS - 1);
    const r = Math.round(a[0] + (b[0] - a[0]) * f);
    const g = Math.round(a[1] + (b[1] - a[1]) * f);
    const bl = Math.round(a[2] + (b[2] - a[2]) * f);
    out.push(opaque ? 'rgb(' + r + ',' + g + ',' + bl + ')'
                    : 'rgba(' + r + ',' + g + ',' + bl + ','
                      + (a[3] + (b[3] - a[3]) * f).toFixed(3) + ')');
  }
  return out;
}
function rampAt(ramp, t) {
  let i = Math.round(t * (ramp.length - 1));
  if (i < 0) i = 0; else if (i >= ramp.length) i = ramp.length - 1;
  return ramp[i];
}

/* The score, at rest and once the stored best has been passed. */
const SCORE_RAMP = rampBetween(COLOUR.SCORE, COLOUR.SCORE_BEST);
const SCORE_RECORD_RAMP = rampBetween(COLOUR.SCORE_BEST, COLOUR.SCORE_RECORD);
/* The road lip burning hotter: the dim half of the edge running toward
   the light half. This only ever RAISES the edge, which is why it is safe
   against hard limit one. */
let EDGE_HOT_RAMP = rampBetween(COLOUR.EDGE_DARK, COLOUR.EDGE_LIGHT);
/* The skyline lights coming up: the roof line running toward the biome's
   own hot hue, so it changes place with the place. Rebuilt by applyBiome,
   which is the only thing that moves either endpoint. */
let SKYLINE_HOT_RAMP = rampBetween(COLOUR.SKYLINE_TOP, COLOUR.HORIZON_FADE);
/* The floor under the road, answering the drift far more faintly than the
   skyline does. Both ends already exist in the palette, so this only
   changes WHEN the near colour is used rather than adding a colour. */
let GRID_HOT_RAMP = rampBetween(COLOUR.GRID, COLOUR.GRID_NEAR);

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

function storeGet(key) {
  try { return window.localStorage.getItem(STORAGE_PREFIX + key); }
  catch (e) { return null; }
}
function storeSet(key, value) {
  try { window.localStorage.setItem(STORAGE_PREFIX + key, value); }
  catch (e) { /* no memory is fine, the game still plays */ }

/* ------------------------------------------------------------------
   Canvas and view.
   ------------------------------------------------------------------ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const view = { w: 0, h: 0, dpr: 1 };
let hazeGradient = null;
let horizonGradient = null;
let wetSheenGradient = null;
let safeTop = 0;         // notch or camera cutout, measured from CSS
let safeBottom = 0;      // home indicator and gesture bar, measured from CSS
let padsTop = 1e9;       // top of the corner pad row, measured from the DOM
let fineBand = 0;        // room the title screen gives the fine print, from the DOM
let scrapeGradientLeft = null;
let scrapeGradientRight = null;
let scrapeOutGradientLeft = null;
let scrapeOutGradientRight = null;
let scrapeBandWidth = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, FEEL.MAX_PIXEL_RATIO);
  const w = Math.max(1, canvas.clientWidth);
  const h = Math.max(1, canvas.clientHeight);
  view.w = w;
  view.h = h;
  view.dpr = dpr;
  // Live tuning calls this many times a second while a button is held, and
  // assigning width or height reallocates the backing store even when the
  // value has not changed. Only touch it when it actually moved.
  const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
  if (canvas.width !== cw) canvas.width = cw;
  if (canvas.height !== ch) canvas.height = ch;

  horizonY = Math.round(h * FEEL.HORIZON_FRACTION);

  const probe = window.getComputedStyle(document.getElementById('safe'));
  safeBottom = parseFloat(probe.paddingBottom) || 0;
  /* The top inset only bites in fullscreen, where the browser chrome is
     no longer sitting over the cutout for us. resize already runs on
     rotation and on entering and leaving fullscreen, which is exactly the
     three moments this changes. */
  safeTop = parseFloat(probe.paddingTop) || 0;
  /* WHERE THE CORNER PADS START, measured rather than derived. The pad
     row's height is a fixed pixel size in the stylesheet with four media
     queries on it, while everything on the canvas is a fraction of the
     smaller screen dimension. On a tablet those two disagree badly
     enough that a canvas button sized in s reaches down into a pad row
     sized in pixels, which is exactly what the share button did at 768
     wide. Read here, on the three occasions it can change, so nothing in
     the draw loop ever touches layout. */
  const padRow = document.getElementById('pads');
  const padBox = padRow ? padRow.getBoundingClientRect() : null;
  /* A zero height means the row is display:none, which it is for the
     whole of the boot flash. Fall back to the bottom of the safe area,
     which constrains nothing, rather than to zero, which would push
     every button that respects this clean off the top of the screen.
     endBootChrome calls resize again the moment the row exists. */
  padsTop = (padBox && padBox.height > 0) ? padBox.top : (h - safeBottom);
  /* HOW MUCH ROOM THE FINE PRINT NEEDS, read rather than assumed.

     The bottom of the title screen had exactly fourteen pixels of free
     space in portrait and ten in landscape, measured on the rendered
     frame, and eight links need twenty. So the title screen reserves the
     band instead of the fine print being squeezed into what was left,
     and the reserve is the element's real height because that is the
     only thing that knows whether the type broke over one line or two.

     ZERO WHEN THERE IS NO FINE PRINT, which is the framed case, where
     the element has been removed outright. The title screen then sits
     exactly where it always did, so a cabinet on a content page is
     composed identically to the game before this existed.

     Measurable even while it is away, because away is visibility rather
     than display: see the note in the stylesheet. Without that this
     would read zero on any resize during a run and the title screen
     would come back with its bottom row sitting on top of the links. */
  const fineEl = document.getElementById('more');
  const fineH = fineEl ? fineEl.offsetHeight : 0;
  /* A HEIGHT OF ZERO MEANS THERE IS NOTHING TO RESERVE FOR, and the gap
     must not be reserved on its own. Zero happens three ways: framed, so
     the element was removed; a landscape handset, where the stylesheet
     takes it off with display; and the boot flash, where the whole pad
     row is display:none. endBootChrome calls resize again the moment
     that row exists. */
  fineBand = fineH ? fineH + FEEL.TITLE_FINE_GAP : 0;
  measureTiltPad();

  // The distant road fades into the horizon glow rather than staying sharp
  // all the way to the vanishing point.
  const fade = h * FEEL.HORIZON_FADE_FRACTION;
  hazeGradient = ctx.createLinearGradient(0, horizonY, 0, horizonY + fade);
  hazeGradient.addColorStop(0, 'rgba(' + COLOUR.HAZE + ',0.92)');
  hazeGradient.addColorStop(1, 'rgba(' + COLOUR.HAZE + ',0)');

  /* Section 7.3 wants a horizon to read curvature against, and taking the
     ground away would have removed it. This band puts it back: a glow on
     the line the road converges to, brighter than the void and nowhere
     near as bright as the road edges. */
  const glow = h * FEEL.HORIZON_GLOW_FRACTION;
  horizonGradient = ctx.createLinearGradient(0, horizonY - glow, 0, horizonY + glow);
  horizonGradient.addColorStop(0, 'rgba(' + COLOUR.HORIZON_FADE + ',0)');
  horizonGradient.addColorStop(0.5, COLOUR.HORIZON_GLOW);
  horizonGradient.addColorStop(1, 'rgba(' + COLOUR.HORIZON_FADE + ',0)');

  /* The wet sheen's gradient, item 7. Built HERE and not at load, for
     the reason the wiring notes give: resize is what a biome change
     calls, so a gradient built once at load is the wrong colour from
     the first biome change and the wrong size from the first rotation. */
  const sheen = h * FEEL.WET_SHEEN_FADE;
  wetSheenGradient = ctx.createLinearGradient(0, horizonY, 0, horizonY + sheen);
  wetSheenGradient.addColorStop(0, 'rgba(' + COLOUR.WET_SHEEN + ','
                                  + FEEL.WET_SHEEN_ALPHA.toFixed(3) + ')');
  wetSheenGradient.addColorStop(1, 'rgba(' + COLOUR.WET_SHEEN + ',0)');

  // Cached, because the scrape flash is drawn on the frames where the
  // player is under the most pressure and can least afford a hitch.
  scrapeBandWidth = w * 0.22;
  scrapeGradientLeft = ctx.createLinearGradient(0, 0, scrapeBandWidth, 0);
  scrapeGradientLeft.addColorStop(0, COLOUR.SCRAPE);
  scrapeGradientLeft.addColorStop(1, 'rgba(' + COLOUR.SCRAPE_FADE + ',0)');
  scrapeGradientRight = ctx.createLinearGradient(w, 0, w - scrapeBandWidth, 0);
  scrapeGradientRight.addColorStop(0, COLOUR.SCRAPE);
  scrapeGradientRight.addColorStop(1, 'rgba(' + COLOUR.SCRAPE_FADE + ',0)');
  scrapeOutGradientLeft = ctx.createLinearGradient(0, 0, scrapeBandWidth, 0);
  scrapeOutGradientLeft.addColorStop(0, COLOUR.SCRAPE_OUT);
  scrapeOutGradientLeft.addColorStop(1, 'rgba(' + COLOUR.SCRAPE_OUT_FADE + ',0)');
  scrapeOutGradientRight = ctx.createLinearGradient(w, 0, w - scrapeBandWidth, 0);
  scrapeOutGradientRight.addColorStop(0, COLOUR.SCRAPE_OUT);
  scrapeOutGradientRight.addColorStop(1, 'rgba(' + COLOUR.SCRAPE_OUT_FADE + ',0)');

  if (showDebug) measureChrome();
  // fullReady is a var on purpose: resize runs during start up, well
  // before the fullscreen block further down has been evaluated, and a
  // let or a const would be in its temporal dead zone at that point.
  if (fullReady) syncFullButton();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
// resize fires on rotation too, and on some Android browsers it is the
// only one that does, so the tilt re zero hangs off it as well.
window.addEventListener('resize', function () {
  if (typeof onOrientationChanged === 'function') onOrientationChanged();
});


/* ==================================================================
   INPUT LAYER

   Everything below writes into steering.value, a single continuous
   number from -1 to +1. Section 8.1: the update loop reads that value
   and nothing else, and does not know or care where it came from.
   Keyboard and touch are the digital special case and ramp toward the
   extreme. Tilt is analogue and writes its smoothed value straight in.
   ================================================================== */
const steering = { value: 0 };

const held = { keyLeft: false, keyRight: false, touchLeft: false, touchRight: false };
const touchSides = new Map();   // pointerId -> -1 or +1

function digitalTarget() {
  const left = held.keyLeft || held.touchLeft;
  const right = held.keyRight || held.touchRight;
  return (left ? -1 : 0) + (right ? 1 : 0);
}

function updateSteering(dt) {
  const target = digitalTarget();
  if (tilt.active && target === 0) {
    steering.value = tilt.value;
  } else {
    const step = dt / FEEL.STEER_RAMP_TIME;
    if (steering.value < target) steering.value = Math.min(steering.value + step, target);
    else if (steering.value > target) steering.value = Math.max(steering.value - step, target);
  }
  steering.value = clamp(steering.value, -1, 1);
}

function clearHeldInput() {
  held.keyLeft = held.keyRight = held.touchLeft = held.touchRight = false;
  touchSides.clear();
}


/* --- Keyboard. Both cases of every letter, so caps lock is not a dead key. --- */
window.addEventListener('keydown', function (e) {
  if (e.repeat) { return; }
  /* THE SPLASH IS DISMISSED BY ANY KEY, AND THIS IS THE FIRST THING THE
     HANDLER DOES, which is the whole of "any key".

     It used to sit at the bottom, after every named key had had a look,
     so Escape and P reached togglePause and returned without dismissing
     anything. That was invisible at half a second and is not at a second
     and a half. Somebody who has seen this a hundred times must never be
     held up by it, and on a phone, where tabs are evicted and restored
     constantly, a cold load happens far more often than it sounds.

     The key is SWALLOWED rather than also starting a run, exactly as the
     tap is, so dismissing the credit cannot begin a game nobody has
     looked at yet. */
  if (bootFlash > 0) { firstGesture(); skipBoot(); return; }
  /* THE FINE PRINT IS KEYBOARD REACHABLE, AND THAT TAKES TWO CARVE OUTS
     FROM "ANY KEY STARTS A RUN", both of them here.

     Section 6 is blunt that many sessions on a school Chromebook are
     keyboard only, and a link nobody can reach with a keyboard is a link
     that audience does not have. Without these two lines it is exactly
     that: the first Tab press would start a run and take the whole
     footer off the screen before focus ever arrived, and if focus did
     somehow get there Enter would follow the link AND begin a game
     behind it.

     TAB, because it is the key that means "move", not the key that means
     "go", and nobody has ever pressed it to start an arcade game.

     ANYTHING AIMED AT A LINK, because once focus is in the footer the
     player is reading it rather than playing. F, T, R, E, S, Escape and
     P are all already carved out of "any key" a few lines below; these
     are the same idea for the same reason. */
  if (e.key === 'Tab') return;
  if (e.target && e.target.closest && e.target.closest('#more')) return;
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { held.keyLeft = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { held.keyRight = true; e.preventDefault(); }
  else if (k === 'f' || k === 'F') { if (debugAllowed) setDebug(!showDebug); return; }
  /* T for today's track and E for endless, and neither is optional.
     Section 6 says many sessions are keyboard only, and a canvas button
     is a tap target a keyboard cannot reach at all.

     T ALSO WORKS ON THE DEATH SCREEN after an endless run, because that
     is the other place the daily is offered and the keyboard has to be
     able to take it. E is title only: there is no endless offer on a
     death screen, and a stray E during a run must never change the mode.

     Both cases, so caps lock is not a dead key, and both carve their
     letter out of "any key starts a run" the same way R and P are. */
  else if ((k === 't' || k === 'T') && bootFlash <= 0
           && (state === TITLE
               || (state === DEAD && mode === ENDLESS
                   && deadFor >= FEEL.DEATH_INPUT_LOCK))) {
    firstGesture(); startDaily(); return;
  }
  /* R FOR THE RANDOM TRACK, on the title screen only, because R on the
     death screen is RESTART and those two states are disjoint. E still
     works, silently, so anyone who learned it when the mode was called
     endless is not stranded by the rename. */
  /* AND ON THE COMPLETION SCREEN ONCE THE DAY IS DONE, which is the
     keyboard's half of the RANDOM TRACK button that screen now carries.
     Section 6 says many sessions are keyboard only and a canvas button
     is a target a keyboard cannot reach at all, so a route that exists
     only as a rectangle does not exist for that half of the audience.

     Behind the same input lock as the button, so the key cannot be part
     of a reflex either, and only when the day is done, which is the only
     state the button is drawn in. */
  else if ((k === 'r' || k === 'R' || k === 'e' || k === 'E')
           && bootFlash <= 0
           && (state === TITLE
               || (state === FINISHED && mode === DAILY && dayDone()
                   && deadFor >= FEEL.DEATH_INPUT_LOCK))) {
    firstGesture(); startEndless(); return;
  }
  /* S SHARES, because section 6 says many sessions are keyboard only and
     a canvas button is a target a keyboard cannot reach at all. */
  else if ((k === 's' || k === 'S')
           && (state === DEAD || state === FINISHED)
           && deadFor >= FEEL.DEATH_INPUT_LOCK) {
    firstGesture(); shareRun(); return;
  }
  else if (k === 'Escape' || k === 'p' || k === 'P') { togglePause(); return; }
  /* R is the keyboard twin of the RESTART button, for the same reason it
     exists: the reflex key now continues, so starting over has to be a
     deliberate second thing. Both cases, so caps lock is not a dead key. */
  else if ((k === 'r' || k === 'R') && state === DEAD
           && deadFor >= FEEL.DEATH_INPUT_LOCK) { firstGesture(); startRun(); return; }
  // The tuning keys are the keyboard twin of the on screen buttons, and
  // like F they must not also start a run.
  else if (debugAllowed && k === '[') { selectTuning(-1); return; }
  else if (debugAllowed && k === ']') { selectTuning(1); return; }
  else if (debugAllowed && (k === '-' || k === '_')) { nudgeTuning(-1); return; }
  else if (debugAllowed && (k === '=' || k === '+')) { nudgeTuning(1); return; }
  else if (debugAllowed && k === '0') { resetTuning(); return; }
  firstGesture();
  // The boot credit was already dealt with at the top of this handler,
  // before any named key got a look at the event.
  // A key while the calibration is up is the skip, and it goes no
  // further, exactly as the boot credit does.
  if (endTiltCal(false)) return;
  startOrRestart();
});

window.addEventListener('keyup', function (e) {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') held.keyLeft = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') held.keyRight = false;
});

window.addEventListener('blur', clearHeldInput);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    clearHeldInput();
    // A game still making noise in a tab nobody is looking at is exactly
    // what gets it closed, so the whole graph goes quiet with the tab.
    if (audio) { try { audio.ac.suspend(); } catch (e) {} }
  } else {
    resumeAudio();
  }
});


/* --- Touch and mouse, through pointer events, one code path for both.
       Left half of the screen is left, right half is right, nothing held
       is the neutral from section 4.1. --- */
function pointerSide(e) {
  return (e.clientX < view.w / 2) ? -1 : 1;
}

function applyTouchSides() {
  let left = false, right = false;
  touchSides.forEach(function (side) {
    if (side < 0) left = true; else right = true;
  });
  held.touchLeft = left;
  held.touchRight = right;
}

canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  /* A tap anywhere on the covered view resumes, and does not also steer.
     The mode button is tested FIRST, or the resume eats it: it is the
     only thing on that screen that is not "tap to resume". */
  if (paused) {
    if (hitMode(e)) { firstGesture(); switchMode(); }
    else setPaused(false);
    return;
  }
  /* The restart button is drawn on the canvas, so it is tested here,
     before the reflex tap is read. It only exists on the death screen and
     only when continuing is possible, so this cannot eat a steering tap. */
  if (hitRestart(e) && deadFor >= FEEL.DEATH_INPUT_LOCK) {
    firstGesture();
    startRun();
    return;
  }
  /* The other mode's button, on the title screen, and the daily offer on
     the death screen after an endless run. Both are places where no run
     is in progress, so neither can eat a steering tap, and both are
     tested before the reflex tap so a deliberate choice wins over it. */
  /* THE CAR CYCLE, FIRST, because it is the smallest target on the
     title screen and the tap that starts a run is the largest. It does
     NOT start a run and it does not cost the one tap to play anything:
     it is a deliberate press on a named button, exactly like RANDOM
     TRACK beside it. */
  if (bootFlash <= 0 && hitCar(e)) {
    firstGesture();
    pickCar(nextCar());
    return;
  }
  if (bootFlash <= 0 && hitAlt(e)) {
    firstGesture();
    startMode(altRect.to);
    return;
  }
  if (bootFlash <= 0 && hitDaily(e)
      && (state === TITLE || deadFor >= FEEL.DEATH_INPUT_LOCK)) {
    firstGesture();
    startDaily();
    return;
  }
  /* SHARE. Tested before the reflex tap like every other canvas button,
     and it sits off to the side of RESTART rather than under it so the
     reflex tap can never land on it. */
  if (hitShare(e) && deadFor >= FEEL.DEATH_INPUT_LOCK) {
    firstGesture();
    shareRun();
    return;
  }
  touchSides.set(e.pointerId, pointerSide(e));
  applyTouchSides();
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  firstGesture();
  if (bootFlash > 0) { skipBoot(); return; }
  // A tap while the calibration is up is the skip. It still steers, like
  // every other tap on the canvas, so nothing is taken away by it.
  if (endTiltCal(false)) return;
  startOrRestart();
});

canvas.addEventListener('pointermove', function (e) {
  if (!touchSides.has(e.pointerId)) return;
  touchSides.set(e.pointerId, pointerSide(e));
  applyTouchSides();
});

function releasePointer(e) {
  touchSides.delete(e.pointerId);
  applyTouchSides();
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });


/* ==================================================================
   TILT

   Opt in behind a button. The game is completely playable by someone
   who never touches it. One permission code path, per section 8.2:
   call requestPermission if it exists, otherwise treat it as granted,
   and handle a denial as a first class outcome.

   ------------------------------------------------------------------
   THE CONVENTION. READ THIS BEFORE TOUCHING ANY SIGN BELOW.

   This has been reversed FIVE times. Every previous time it was reasoned
   about from scratch, and reasoning from scratch is what keeps producing
   a different answer. So the whole path is written out here once, and
   tiltAssert below CHECKS it rather than trusting it.

   THE PATH, END TO END. There is exactly ONE sign in it.

     1. THE RAW READING. deviceorientation gives beta and gamma in the
        DEVICE's frame. Neither is what the game wants on its own,
        because the screen is rotated inside the device frame.

     2. THE REMAP INTO SCREEN SPACE, in tiltReading. One rotation of the
        pair by screen.orientation.angle:

            deg = gamma * cos(angle) + beta * sin(angle) * LANDSCAPE_SENSE

        which lands on gamma, beta, -gamma, -beta at 0, 90, 180 and 270.
        EVERY LANDSCAPE BRANCH IS DERIVED FROM THE PORTRAIT ONE. That is
        the point: the old code wrote four branches out by hand and one
        session flipped the landscape pair on its own, which is reversal
        number two. A hand written branch cannot drift from portrait if
        there is no hand written branch.

        WHICH PHYSICAL EDGE A POSITIVE deg MEANS IS NOT KNOWN TO THIS
        FILE, and pretending otherwise is what has cost five sessions.
        The spec says gamma is positive when the right edge drops; the
        handset this game is played on behaves as though it is the left.
        This file cannot see which, so it does not claim to. What it DOES
        guarantee, and what tiltAssert checks, is that all four
        orientations respond to the same physical movement identically,
        because all four come out of the one formula above.

     3. THE ZERO POINT. rel = deg - zeroDeg. Nobody holds a phone flat,
        so everything is relative to the posture captured at the start of
        the run. Subtraction only, no sign.

     4. TILT_DIRECTION, and this is the ONLY sign in the whole path.
        rel is multiplied by it, once, in tiltSteer.

     5. THE DEADZONE AND THE NORMALISE. A magnitude is taken, the
        deadzone is subtracted, the remainder is divided by the span to
        full lock, clamped to 0..1, and Math.sign(rel) is put straight
        back on. Sign preserving by construction.

     6. INTO THE STEERING VALUE. updateTilt smooths toward that target
        and updateSteering assigns tilt.value to steering.value
        unmodified. A POSITIVE STEERING VALUE TURNS THE CAR RIGHT: that
        is fixed by the keyboard, where the right key sets the digital
        target to +1, and it runs through untouched to carX, where
        positive is the right hand side of the road.

   THE CORRECT SIGN AT EACH ORIENTATION. Two tables, because there are
   two different claims and running them together is the mistake that has
   cost this project six sessions.

   FIRST, WHAT THIS FILE GUARANTEES, which tiltAssert checks and which is
   true on every device. A MORE POSITIVE READING STEERS THE WAY
   TILT_DIRECTION SAYS, at every orientation, and here is the raw
   quantity that has to rise for that to happen:

        angle    reading is     rises when
          0        gamma          gamma rises
         90         beta          beta  rises
        180       -gamma          gamma falls
        270        -beta          beta  falls

   All four come out of one rotation formula, so no orientation can drift
   away from portrait. THAT IS ALL AN ASSERTION CAN EVER CHECK. Four
   orientations agreeing with each other says nothing about whether any
   of them agrees with the phone: internally consistent at the wrong sign
   is still wrong, which is exactly why they all passed while the handset
   was still backwards.

   SECOND, WHAT THE HANDSET DOES, and THE HANDSET IS THE ORACLE. TILTING
   THE PHONE LEFT MUST TURN THE CAR LEFT. This file cannot check that and
   must not try to derive it: which physical edge a positive gamma means
   varies across handsets and browsers, and no amount of reasoning here
   changes what the phone in someone's hands does.

   WHY THE OLDER REPORTS COULD NOT PIN THIS AND THE LATEST ONE CAN, which
   is the thing that was missing every previous time:
