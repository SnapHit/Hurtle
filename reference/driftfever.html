     and 15 at the ninety ninth, so a full mark of 26 was far past
     anywhere real play ever reaches: the first version peaked at a glow of
     0.20 in play, which is forty windows out of three hundred and sixty.

     Measured at these values over 9056 frames of play: the median frame
     lights 80 windows of 360, the upper quartile 227, and the top tenth
     the whole city. Ordinary drifting wakes a corner of it, a strong
     chain wakes all of it, and the difference is visible. */
  CITY_SLIP_POWER:          1.0,     // LIVE, how sharply depth counts
  CITY_BASE:               0.40,     // LIVE, the share a deep slide lights with no chain behind it
  CITY_CHAIN_FULL:           12,     // LIVE, links at which the chain term is full
  /* THE ENVELOPE, and the ratio between these two is the whole feel of
     it. Attack short enough that the surge lands on the frame the driver
     commits, release long enough that straightening up is a fade rather
     than a switch, and short enough that a straight genuinely goes dark.
     Both LIVE, because this is a ratio that can only be judged by
     driving. */
  CITY_ATTACK:             0.10,     // LIVE, seconds
  CITY_RELEASE:            0.60,     // LIVE, seconds
  CITY_SILENT:            0.004,     // below this on a zero target it is snapped to nothing
  /* The throb on top. Restrained by default and section 7 is the reason:
     the skyline is in peripheral vision for the whole run, which is
     exactly where overdone motion does its damage. Depth is LIVE and zero
     switches it off entirely. */
  CITY_PULSE_DEPTH:        0.16,     // LIVE, how deep the trough goes at full intensity
  CITY_PULSE_HZ:           0.80,     // LIVE, cycles a second at rest
  CITY_PULSE_HZ_GAIN:      1.30,     // LIVE, extra cycles a second at full intensity
  CITY_WINDOW_FILL:        0.46,     // of the cell, so windows are small and regular
  CITY_MIN_BUILDING_PX:       9,     // shorter than this and a window is not worth drawing
  /* ----------------------------------------------------------------
     WINDOWS THAT READ AS LIGHT. Item 5.

     The same two pass treatment every other lit thing in this game gets:
     the shape wide and faint under the shape solid. No shadowBlur, per
     the file's standing rule; this is the convention that replaces it.

     AND A COOL MINORITY, because every night city photograph has two
     colour temperatures in it and having one is what makes a render look
     like a lighting diagram. It costs no new state: every window already
     carries a threshold, so the ones whose threshold falls in a chosen
     band go into a third path in the cool colour.

     THE MINORITY STAYS A MINORITY. The existing comment justifies the
     amber as the road edge's fire spreading to the city, and a cool
     minority weakens that a little, so it is kept near one window in
     eight and drawn dimmer than the amber. */
  CITY_GLOW_INFLATE:        1.6,     // LIVE, pixels each window grows for the faint pass
  CITY_GLOW_ALPHA:         0.34,     // LIVE, share of the solid alpha
  /* MEASURED AND NARROWED. The band 0.42 to 0.55 caught 92 of the 360
     windows, which is 25.6 per cent and not a minority: the city read as
     two colours rather than as one colour with exceptions in it. */
  CITY_COOL_FROM:          0.46,     // LIVE, thresholds in this band light cool
  CITY_COOL_TO:            0.52,     // LIVE
  CITY_COOL_ALPHA:         0.72,     // LIVE, share of the amber alpha, so it stays quieter
  /* ----------------------------------------------------------------
     NEON SIGNAGE. Item 8.

     A city at night and a city STREET at night are different pictures,
     and the thing that separates them is signage. A handful of bars of
     light on the building faces, mostly vertical, and the background
     stops being scenery and starts being a place.

     NO TEXT, NO GLYPHS, NO FONT. At this size a bar of light reads as a
     sign perfectly well, and anything actually legible up there would
     be a second thing to read while driving.

     THE COLOUR IS THE WHOLE PROBLEM AND IT IS SOLVED BY ROTATION. The
     palette already spends four saturated families: the warm road, the
     cool car, pinned pink for danger and pinned green for go. A fifth
     that rides the wheel independently will eventually land on top of
     one of them, and the one it must never land on is the car. So the
     sign colour is not a colour, it is an OFFSET: this biome's own
     amber turned by a fixed number of degrees, which puts it a known
     distance from everything else on the wheel in all twelve biomes
     rather than in eleven of them.

     ABOVE THE HORIZON ONLY. Clipped at the horizon line, so a sign can
     never appear alongside the far road however tall the city gets. */
  SIGN_SHARE:              0.38,     // LIVE, share of buildings carrying one
  SIGN_VERTICAL_SHARE:     0.72,     // LIVE, of those, how many run down the face
  SIGN_LEN_MIN:            0.30,     // LIVE, of the face, the shortest sign
  SIGN_LEN_SPAN:           0.34,     // LIVE, and the span above it
  SIGN_THICK:              0.16,     // LIVE, of the face, across the sign
  SIGN_INSET:              0.12,     // LIVE, of the face, kept clear of both edges
  SIGN_MIN_PX:              1.4,     // never thinner than this, at any dpr
  SIGN_MIN_BUILDING_PX:      16,     // shorter than this and a sign is a smudge
  SIGN_GLOW_INFLATE:        2.2,     // LIVE, pixels the faint pass grows by
  SIGN_GLOW_ALPHA:         0.30,     // LIVE, share of the solid alpha
  SIGN_ALPHA:              0.80,     // LIVE
  SIGN_HUE_SHIFT:           210,     // degrees off this biome's own amber
  /* AND A FLOOR AGAINST THE TWO PINNED FAMILIES, because the rotation on
     its own does NOT solve them and the investigation's reasoning misses
     it. A fixed offset from the biome holds a fixed distance from
     everything that TURNS with the biome, and the car is one of those:
     measured, the sign sits 52 degrees off the car in all twelve, which
     is the result the document wanted. But danger and go do not turn.
     They are pinned, deliberately, because rotating them once inverted
     the visual language and two players confused the two in opposite
     directions. So a sign that turns sweeps past them, and measured it
     did: 1 degree off the jump green in biome five and 12 off the hazard
     pink in biome three. Green bars in the sky in the biome where green
     means go is the same failure in a quieter place.

     So the offset is a wish and this is the rule: if the turn lands the
     sign inside this many degrees of either pinned hue, it is pushed to
     the near edge of that zone and no further. */
  SIGN_KEEP_CLEAR:           34,     // degrees, from danger and from go
  /* ----------------------------------------------------------------
     THE CITY LIGHTS THE SKY. Item 6. One more fill of the horizon band
     that is already cached, keyed to the city glow rather than to the
     multiplier, so the sky over the city has a source.

     THE UPPER HALF ONLY, AND THAT IS NOT DECORATION. The road converges
     to the horizon from BELOW, so the lower half of that band sits
     directly behind the far road. The file records deepening it there
     once: it lit the void without lighting the road, and the surface
     against void contrast at the planning horizon went from a difference
     of 0.4 to one of 4.8 the wrong way. Above the line is sky and only
     sky. */
  CITY_HALO_ALPHA:         0.30,     // LIVE, at full city glow
  HEAT_HORIZON:            0.55,     // LIVE, a second pass of the horizon band at this alpha
  HEAT_MUSIC:              0.85,     // LIVE, how much of the music's heat the multiplier may drive

  /* Breaking the stored best, live, mid run. One comparison a frame and
     it is the strongest moment this game has: it makes the previous run
     present inside this one.

     It fires on the number on the screen, which is banked plus pending,
     because that is the number the player is reading and the moment they
     mean. The pending half is still at risk until the next gate, which is
     the tension rather than a bug, and the death screen still only calls
     a new best when the banked figure actually cleared it.

     It CANNOT fire when there is no stored best to beat. bestKnown is
     false on a fresh install and false when localStorage is unavailable,
     which section 6 says is common on school profiles, and in both cases
     the whole effect stays switched off for the run. */
  BEST_FLASH_TIME:         0.55,     // LIVE, seconds of the screen wash
  BEST_FLASH_ALPHA:        0.30,     // and how strong it is allowed to get
  BEST_SHAKE_PX:              9,     // under the crash, and capped with everything else
  BEST_GLOW_ALPHA:         0.34,     // the permanent halo the score keeps for the run
  BEST_GLOW_SPREAD:        0.34,     // of the score size

  /* Drift callouts. Transient text that flies in, reads and dies.

     THE DISCIPLINE IS THE FEATURE. Three sessions were spent stripping
     the HUD back and this must not put it back, so: nothing persists,
     nothing is ever drawn over the driving line, only one is on screen at
     a time and the newest wins, and the chatty kind is rate limited so a
     long chain cannot produce a stream of text.

     TWO LANES, NOT ONE PRIORITY LIST. The first version put drift
     feedback at the bottom of a single queue behind checkpoints and close
     calls, which put the core loop of the game last and meant that in
     practice it never spoke. Drifting is what this game IS, so it gets a
     channel of its own, at its own height, with its own slot and its own
     timing, and it never competes with an event for the screen. Only a
     best score break may interrupt it.

     Placement is derived rather than fixed. Both lanes sit in the band of
     sky between the bottom of the HUD stack and the horizon, which is
     empty in both orientations and is never road, on separate rows so
     they can both be up at once without stacking, and offset to whichever
     side of the screen the car is NOT on. */
  CALLOUT_TIME:            1.05,     // LIVE, seconds on screen, in and out included
  CALLOUT_IN:              0.14,     // of that, the fly in
  CALLOUT_OUT:             0.38,     // of that, the fade
  CALLOUT_SLIDE:           0.05,     // of screen width, how far it flies. Kept tiny: section 7.
  CALLOUT_SIZE:           0.042,     // of the smaller screen dimension
  CALLOUT_SIDE:            0.24,     // of screen width, offset from centre
  CALLOUT_MAX_WIDTH:       0.52,     // of screen width, the widest a callout may be
  CALLOUT_RISE:            0.06,     // of the smaller dimension, how far above the horizon it sits
  CALLOUT_GAP_TOP:         0.05,     // and the least it may sit below the HUD stack
  /* The two rows, as a share of the sky band between the HUD and the
     horizon. Events sit high in it and drift feedback low, nearer the
     road, because that is the one the eyes should catch while driving. */
  CALLOUT_ROW_EVENT:       0.10,
  CALLOUT_ROW_DRIFT:       0.78,
  /* The rate floor on the DRIFT lane, which is the only lane that can be
     chatty. Events are rare by their nature and are not limited.
     Dropped from 3.20, which was tuned when drift feedback shared a lane
     with everything else and had to be held back to protect it. It has
     its own lane now, so praise can come often. */
  CALLOUT_GAP:             1.60,     // LIVE, seconds between repeatable drift callouts
  CALLOUT_LOCK:            0.70,     // LIVE, seconds a louder callout suppresses quieter ones for
  /* An ENTRY has to be an entry. Slip alone is not enough: a driver
     living on the edge re touches it every second or two, and calling
     each of those a perfect entry measured nine in eighty seconds, which
     is exactly the clutter three sessions were spent removing. So the car
     must have been clear of the band for CALLOUT_ENTRY_CLEAR first, and
     then arrive at it already committed. */
  CALLOUT_ENTRY_SLIP:      0.72,     // slip needed on touching the edge for a perfect entry
  CALLOUT_ENTRY_CLEAR:     1.60,     // LIVE, seconds clear of the band before one counts

  /* THE CHAIN, which is the reward for drifting and therefore the reward
     for playing the game at all. Both numbers below were measured off the
     phrase library rather than guessed, because they are a property of
     the road and not a matter of taste. Over 166 seconds of driving, with
     a beginner holding the middle of the on ramp and a committed driver
     riding the edge:

       a continuous stretch of drifting is 0.50s at the median, 1.10 at
       the upper quartile and 2.52 at the ninetieth
       a gap between two of them is 0.20s at the median, 0.63 at the
       upper quartile, 1.80 at the ninetieth and 2.45 at the ninety fifth

     The old values were a step of 2.20 and a grace of 0.30. Almost no
     corner in this game gives 2.2 seconds of continuous slip, and three
     gaps in four are longer than 0.3 seconds, so LINKING CORNERS, which
     is the best driving available here, broke the chain every time and
     link one was never reached. A player finished a run of 7322m at a
     best multiplier of 6.2 and the game never once said anything.

     So: a step at the median stretch, which means one ordinary corner is
     worth a link, and a grace above the upper quartile gap, which means
     A CHAIN SURVIVES THE STRAIGHT BETWEEN TWO CORNERS and only breaks
     when the driving actually stops. About one gap in eight is longer
     than the grace, so a chain runs several corners and then ends,
     which is what makes ending it mean something.

     CHAIN_MIN_SLIP is what counts as drifting for this purpose and it is
     deliberately NOT the multiplier's test. The multiplier wants slip AND
     the edge, so a tidy drift down the middle earns nothing from it. That
     is right for scoring and wrong for praise: the first acknowledgement
     has to reach a new player in their first twenty seconds, on a modest
     drift, in the middle of a wide on ramp road. */
  CHAIN_MIN_SLIP:          0.45,     // LIVE, what counts as drifting for the chain
  CALLOUT_CHAIN_STEP:      0.50,     // LIVE, seconds of drifting per chain link
  CALLOUT_CHAIN_GRACE:     2.20,     // LIVE, seconds it may lapse without breaking
  /* Links at which the praise escalates a tier. Widening on purpose: a
     chain accrues about one link a second of wall time, so evenly spaced
     tiers would run off the end of the ladder inside ten seconds. These
     put the first two within a corner or two of starting and then make
     each further tier cost more than the last, which is what makes a long
     chain visibly worth more than a short one. */
  DRIFT_TIER_LINKS:  [1, 2, 4, 7, 11, 16, 22],
  DRIFT_TIER_GROWTH:       0.12,     // LIVE, size added per tier, of the base size
  /* PAST THE TOP OF THE LADDER THE PRAISE MUST NOT STOP, and this is the
     constant that stops it stopping.

     Measured over a forty second run: the chain never broke once, reached
     56 links, hit the top tier at 18 seconds, and after that the only
     drift callout left was the occasional perfect entry. Thirteen
     callouts in the first thirty seconds and two in the next ten. The
     better the driving, the quieter it went, which is exactly backwards
     and is the same failure the Beakdown spec records for escalation
     freezing at wave 32: anything gated on a new maximum goes silent as
     soon as the player is good.

     A tier IS a maximum, per chain. The tier reset on a chain break was
     already correct and was not the cause. The cause was that a good
     driver's chain does not break, so the ladder ran out underneath a
     chain that was still going. Past the last threshold the top rung
     therefore repeats every this many further links, carrying the count,
     so a chain that keeps going keeps being acknowledged. */
  DRIFT_TOP_REPEAT:           8,     // LIVE, links between repeats past the top rung
  /* A chain that beats anything else this run is a separate, louder
     event in the OTHER lane. It is not allowed to be the gate on ordinary
     praise, which is what created the silence in the first place: it sits
     beside the normal ladder rather than in front of it, and it fires at
     most once per chain. */
  DRIFT_BEST_MIN:            12,     // LIVE, links before a run best is worth announcing
  /* The blip itself. Quiet: it fires about once a second through a good
     stretch of driving, so it has to sit under the tyres rather than over
     them, and a short decay keeps it a tick rather than a tone. */
  CHAIN_GAIN:              0.10,     // LIVE
  CHAIN_DECAY:             0.13,     // seconds

  /* Close calls. Section 4.4's philosophy applied to obstacles rather
     than to the road edge: the risky line is the rewarding one. The
     geometry is known exactly, so this is measured rather than guessed.
     The margin is the clear air in WORLD UNITS between the side of the
     car and the outside of the hazard's clip shoulder, at its closest
     over the whole pass, and clipping the hazard at any point disqualifies
     it. The car is 600 wide, so this is two thirds of a car. Measured over
     28 hazards passed cleanly, it calls 39% of them close, at a median
     gap of 215. */
  HAZARD_CLOSE_MARGIN:      400,     // LIVE, world units of clear air that counts as close
  /* RAISED FROM 260, WHICH WAS BELOW THE NOISE FLOOR OF SIMPLY DRIVING.

     The mechanism was built and it works: driven, it fires on the
     hazards it should and stays silent on the ones it should not. What
     it did not do was register, and the arithmetic says why. A second of
     driving at a good multiplier measures 800 to 1200 points, so 260 was
     a quarter of a second. The callout said a thing had happened and the
     score disagreed with it.

     1200 is about a second of driving: enough to see on the counter,
     and still under a minimum jump landing, which is the harder thing to
     do and should stay the bigger prize. */
  HAZARD_CLOSE_BONUS:      1200,     // LIVE, points

  /* The checkpoint, which is the structural beat of the run. Light runs
     down the posts as the car closes on it, which is earned because the
     approach is the player's, and the crossing fires.

     GATE_FLASH_ALPHA is deliberately low. It has to land as a moment and
     also has to not blind anybody at the exact instant a new biome and a
     new stretch of road arrive. */
  GATE_SWEEP_SEGMENTS:      260,     // LIVE, how far out the light starts running down
  GATE_SWEEP_LENGTH:       0.16,     // of the post height, the lit band itself
  GATE_FLASH_ALPHA:        0.26,     // LIVE
  GATE_BAR_WIDTH:          0.05,     // of screen width, the posts sweeping past
  GATE_SHAKE_PX:              7,

  /* SHAKE FROM DIFFERENT SOURCES MUST NOT SUM WITHOUT A CAP. Section 7
     warns that overdoing shake tips into disorientation and that the
     threshold is lower on a phone held close to the face, and this
     session added three new sources to a system that had two.

     Everything goes through addShake, which takes the LOUDEST claim
     rather than adding them up, and then clamps. So a best score break
     landing on a gate crossing beside a hazard scrape is exactly as
     violent as the loudest one of those alone, and nothing in the game
     can ever shake harder than a crash. */
  SHAKE_MAX_PX:              16,     // LIVE, and equal to CRASH_SHAKE_PX on purpose

  /* ----------------------------------------------------------------
     HITTING SOMETHING, which is now a different death from leaving the
     road and looks like one. Going off the edge is a fall: the car slides
     over the lip and drops into the void, and that stays exactly as it
     was. Hitting a hazard is an impact: it stops dead, comes apart, and
     throws debris.

     THE ONE HARD CONSTRAINT IS THAT IT MUST NOT DELAY GETTING BACK IN.
     Section 5 says restart is instant and this cannot be the thing that
     breaks it. So the explosion is purely cosmetic: nothing waits on it,
     the death screen appears under it on the same schedule as before, and
     a tap or a key at any point during it goes straight through. The only
     input gate is DEATH_INPUT_LOCK, which is the accidental input guard
     that was already there and which the hit stop does NOT extend,
     because the death timer runs on real time while the world is frozen.

     Hit stop is a handful of frames of the world standing still, which is
     what sells an impact as an impact. Kept short: at a tenth of a second
     it reads as weight, and past about a fifth it reads as a stutter. */
  HIT_STOP_TIME:           0.11,     // seconds the world freezes on impact
  EXPLODE_TIME:            1.10,     // seconds the debris lives
  EXPLODE_PARTICLES:         26,     // LIVE
  EXPLODE_SPEED:            620,     // pixels per second, at the fastest
  EXPLODE_SPREAD:          0.45,     // how much slower the slowest piece is
  EXPLODE_GRAVITY:          900,     // pixels per second squared
  EXPLODE_DRAG:            0.55,     // seconds, how fast sideways speed bleeds off
  EXPLODE_SIZE:            0.026,    // of the smaller screen dimension, the biggest piece
  EXPLODE_SPIN:             7.0,     // radians per second
  EXPLODE_FLASH_TIME:      0.22,     // the white flash at the moment of impact
  EXPLODE_FLASH_ALPHA:     0.38,
  /* Hard, because this is the hardest thing that happens. It still goes
     through addShake, so it is clamped with everything else and cannot
     sum with a gate or a best score break landing on the same frame. */
  EXPLODE_SHAKE_PX:          16,     // LIVE

  /* ----------------------------------------------------------------
     CONTINUES, which settle section 14's open question about lives and
     recoveries: neither, and instead an unlimited resume from the last
     gate that costs a scoreboard rather than a life.

     The problem it solves is that a player who dies often replays the
     opening of the track over and over and rarely sees anything new. A
     continue puts them back at the last gate at that gate's difficulty,
     so continuing never hands out an easier stretch, and there is no on
     ramp on a continue because somebody on their fourth continue is not
     a new player.

     SCORE INTEGRITY IS THE PART THAT IS NOT OPTIONAL. The live best score
     break is the strongest moment in the game, and if continues carried
     the score forward it would be reachable by pressing continue enough
     times and would stop meaning anything. So the records are split:
     BEST SCORE only moves on a run with zero continues, FURTHEST is a
     distance record any run may set, and the live break only arms on a
     clean run. Exploring and scoring get their own scoreboards and both
     still mean something. */
  CONTINUE_CLOCK_GRACE:     1.0,     // extra seconds on the clock, so a resume is not instant pressure
  /* Section 4.3 asks for three and a half seconds of visible road to plan
     with. A resume that drops the car into a generated phrase after one
     and a half has taken that away at the exact moment the player is
     re orienting, so the arrival straight is the planning horizon and not
     a token. It is not a rest: it is what a fresh run's scripted opening
     already gives, without the beginner's gentle first curve. */
  RESUME_STRAIGHT:          160,     // segments, about three and a half seconds
  /* The prompt and the restart button hang off the BOTTOM edge rather
     than off a fraction of the height, which is what keeps them clear of
     the car in both orientations. Above the safe area and above the
     corner pads, which are 64 across with a 12 margin. */
  /* ----------------------------------------------------------------
     THE BOOT FLASH. The arcade convention of a manufacturer credit before
     the attract loop, and the right home for a publisher name: it is the
     one moment where branding is expected rather than intrusive.

     IT CAN ONLY EVER HAPPEN ON A COLD LOAD. bootFlash is a module level
     countdown set once where it is declared and never assigned anywhere
     else except to zero when it is skipped. startRun, continueRun and
     resetSpectacle do not mention it and must not: section 5 says restart
     is instant on the same input, and that is worth more than any
     flourish. A flourish between attempts is exactly the thing that
     breaks the one more go loop.

     Skippable on the first tap or key, which is SWALLOWED rather than
     also starting a run, so dismissing the credit cannot accidentally
     begin a game the player has not looked at yet.

     THREE PHASES, NOT ONE DURATION, and the middle one is the point. It
     was 0.55 seconds with a fade at the tail, which was too fast to read
     STUDIOS and INSTANT. PLAY. without effort: the eye had barely
     finished arriving before the thing began to leave. The hold is now
     long enough to read the whole lockup at a glance, and it is a HOLD,
     at full opacity, with nothing moving. A beat of stillness is what
     makes a splash feel deliberate rather than slow.

     THE FADES ARE SHORT ON PURPOSE. They exist so the lockup arrives and
     leaves rather than being cut in and out, and that is all. Together
     they add under half a second to the hold; making them long enough to
     be noticed as animation would turn a 1.5 second splash into a three
     second wait, which is a different and much worse thing.

     TOTAL IS THE SUM OF ALL THREE, and it is derived rather than written
     down a fourth time. bootTotal() is the one place it exists. */
  BOOT_FADE_IN:            0.18,     // LIVE, seconds, arriving
  /* CUT FROM 1.50 ON A COLD PLAY. A publisher lockup is worth a beat and
     it is not worth a second and a half: at 1.50 the whole splash ran
     1.96 seconds, which is long enough to be waited through rather than
     seen. At 1.00 it is 1.46, a third off, and the two fades are
     untouched because the arrival and the departure were never the part
     that dragged. Everything else about it stands: skippable from the
     first frame, cold load only, never between runs, nothing waits on
     it. */
  BOOT_HOLD:               1.00,     // LIVE, seconds at full opacity
  BOOT_FADE_OUT:           0.28,     // LIVE, seconds, leaving
  /* Small and quiet on the death screen, under the score. It must not
     crowd the score, the records, the continue button or the share
     button, which are what that screen is for.

     THE LOCKUP IS CROPPED TO THE SNAPHIT WORDMARK, and the width below
     is why. Measured on a 390 wide handset, the full lockup needs to be
     180 pixels across, 46 per cent of the screen, before INSTANT. PLAY.
     reaches a 7 pixel cap height and becomes readable at arm's length.
     That is a billboard on the screen the score lives on. At the width
     that actually fits, the taglines measure 3 to 4 pixels, which is
     shipping text nobody can read. So they are not shipped. */
  CREDIT_WIDTH:           0.185,     // of the smaller dimension
  CREDIT_ALPHA:            0.72,     // the lockup is dimmer than the plate is dark
  /* THE PLATE BEHIND IT, and it exists because the biome hue rotates at
     every gate and the lockup's orange can land on an orange world. It
     is a soft radial rather than a box: a hard edged panel on the death
     screen reads as a dialog, and this has to read as a credit.

     RADIUS IS A MULTIPLE OF THE LOCKUP'S OWN WIDTH, so it cannot come
     adrift of it at any screen size. */
  /* MEASURED, AND THE FIRST TRY WAS NOWHERE NEAR ENOUGH. In landscape
     the death screen stack sits high and the credit lands INSIDE the
     horizon glow, which is the one part of the world that is bright and
     is orange at some hues. Without a plate the lockup's own orange
     measured 1.24 to 1 against it. That is invisible, and it is exactly
     the failure this constant exists to stop.

     The plate is FLAT ACROSS THE MARK and only falls off outside it, so
     the whole lockup sits on one even field rather than on a bright rim.
     The radii are multiples of the lockup's own size, so the shape
     cannot come adrift of it at any screen size, and both are wide
     enough that the box corners are still inside the flat part. */
  CREDIT_PLATE_ALPHA:      0.70,     // over the mark, then fading to nothing
  CREDIT_PLATE_FLAT:       0.62,     // of the radius, the evenly dark part
  CREDIT_PLATE_WIDE:       1.00,     // of the lockup width, the radius across
  CREDIT_PLATE_TALL:       2.60,     // of the lockup height, the radius down

  /* ----------------------------------------------------------------
     THE TITLE SCREEN, WHICH IS AN ARCADE SPLASH AND NOT A WEB PAGE.

     THE SCRIM IS THE ROOT OF IT AND EVERYTHING ELSE FOLLOWS. The game
     keeps running underneath, which is the attract mode and is worth
     keeping, but at full brightness the road, the pylons and the car
     compete with every word on top of them. A dark wash between the two
     lets the type sit on near black without stopping the road moving.

     IT IS ALSO THE PERMANENT CONTRAST ANSWER. The biome hue rotates
     through twelve palettes, so without a scrim the legibility of this
     screen is a different number at every hue and can only ever be
     checked, never fixed. With one, the backdrop is the scrim and the
     hue underneath stops mattering.

     THE SIZES AND GAPS ARE ALL SHARES OF s, THE SMALLER SCREEN
     DIMENSION, so the whole hierarchy scales as one thing. Only the top
     margin comes off h. The wordmark then takes whatever height is left
     once the three lines under it, the air above the bottom button and
     the bottom button itself have taken theirs, which is what makes
     landscape work without a second layout. */
  /* The wordmark's treatment on a line of type. Shares of the type size,
     so the stroke and the shadow scale with it. See brandText. */
  BRAND_TEXT_STROKE:      0.115,     // LIVE
  BRAND_TEXT_SHADOW_X:    0.028,
  BRAND_TEXT_SHADOW_Y:    0.038,
  TITLE_SCRIM_ALPHA:       0.84,     // LIVE, the wash over the running game
  TITLE_TOP:              0.055,     // of h, the margin above the wordmark
  TITLE_WM_WIDTH:          0.88,     // of w, the wordmark's ink width
  /* AND A CAP ON ITS HEIGHT AS A SHARE OF h, which only ever bites in
     landscape. Cutting three rows of text off this screen handed the
     wordmark all of the room they used to take, and on a 844 by 390
     screen that made it two fifths of the height, which is a mark
     dominating a splash rather than heading one. Portrait is still
     governed by the width and this does not touch it. */
  TITLE_WM_TALL:           0.34,     // of h, the ceiling on its ink height
  TITLE_WM_MIN:            0.14,     // of s, the floor under its ink height
  TITLE_GAP_PROMPT:       0.075,     // of s, wordmark down to the prompt
  TITLE_PROMPT_SIZE:      0.058,     // of s
  TITLE_GAP_FACTS:        0.072,     // of s, prompt down to the track line
  TITLE_FACT_SIZE:        0.029,     // of s
  TITLE_AIR:               0.10,     // of s, the least air above the bottom button
  /* THE BLINK, and it is a blink and not a pulse. A sine fade reads as a
     web page breathing; a hard on and off reads as a cabinet asking for
     a coin, which is the whole point of the change. Lit for most of the
     cycle so it is never missed by somebody who glanced away. */
  TITLE_BLINK_PERIOD:      1.15,     // LIVE, seconds
  TITLE_BLINK_ON:          0.62,     // LIVE, share of the period lit
  TITLE_FACT_ALPHA:        0.80,
  TITLE_SUB_ALPHA:         0.55,
  /* THE RESET LINE, and it is its own row because it was a footnote.

     The road genuinely regenerates every local midnight and two devices
     on the same date get the same five roads. That is the single best
     reason to come back and it was the last of five things joined by
     middots on the dimmest line on the screen, at 0.029 of the smaller
     dimension and 0.80 alpha, where it read as a timestamp.

     ONE LINE, NOT A BLOCK. It is half again the size of the facts line
     and at full alpha, which is enough to be read rather than skimmed,
     and it is still a third of the prompt and a fifth of the wordmark,
     so nothing on this screen has moved in the order it is read. The
     facts line loses the countdown in the same change, so the screen
     carries the same amount of text and simply weights it correctly. */
  TITLE_GAP_RESET:        0.042,     // LIVE, of s, facts line down to it
  TITLE_RESET_SIZE:       0.042,     // LIVE, of s
  TITLE_RESET_ALPHA:       1.00,     // LIVE
  /* The music warning. Its own three numbers rather than the facts
     line's, because it is the one line on that screen a player might
     need to act on and it is allowed to be a little louder than the
     scenery. */
  TITLE_GAP_MUSIC:        0.072,     // LIVE, of the smaller dimension
  TITLE_MUSIC_SIZE:       0.066,     // LIVE, the headline, in the wordmark's treatment
  TITLE_MUSIC_GAP:        0.026,     // LIVE, headline down to the sentence
  TITLE_MUSIC_SUB:        0.030,     // LIVE, the sentence under it
  TITLE_MUSIC_ALPHA:       0.82,     // LIVE

  /* ----------------------------------------------------------------
     THE FINALE, WHICH IS THE ONE PLACE IN THIS GAME WHERE RESTRAINT IS
     WRONG. Reaching the line is the hardest thing here and it used to be
     a full stop: the car froze, the screen changed, nothing happened.

     TWO PRINCIPLES SHAPE EVERY NUMBER BELOW.

     THE CELEBRATION STARTS BEFORE THE LINE. FINALE_APPROACH is how hot
     the world gets on the closing stretch, ramped continuously from the
     final gate, so by the time the line arrives it already feels like
     something is about to happen. If it all fired on the line it would
     read as a stop rather than an arrival.

     THE BEST FIREWORK IS THE GAME ITSELF. The world already intensifies
     with the multiplier, and MEASURED over five minutes of hard driving
     a good player reaches worldHeat 1.00 and cityGlow 1.00 and sits over
     0.9 about a fifth of the time. So merely pinning those to one is not
     "past anything reachable in normal play", it is Tuesday. The
     FINALE_ over cap constants below go PAST the ceilings those systems
     have, and they are the ones worth tuning first.

     AND THE ROAD STAYS READABLE WHILE THERE IS A CAR ON IT. That is hard
     limit one and it is not suspended because the moment is nice, so the
     over cap is split in two by WHERE IT LANDS rather than by how loud it
     is. Everything on or beside the road waits for the car to stop
     (finaleFree). Everything ABOVE THE HORIZON is sky and only sky, so it
     is free from the first volley (finaleSky) and can strobe with them.

     THE SHAPE MATTERS MORE THAN THE VOLUME. Every duration below is a
     BEAT, and the beats are laid end to end rather than pinned to
     absolute times, so moving one moves everything after it and the
     sequence cannot develop a hole in the middle. In order:

       a APPROACH   FINALE_APPROACH, while still driving
       b CROSSING   FINALE_CROSS
       c HUSH       FINALE_HUSH, and the world DROPS for it. A
                    celebration that peaks on the first frame has
                    nowhere to go, and the near silence is what makes
                    the first volley land.
       d f WAVES    FINALE_WAVES volleys, FINALE_WAVE_GAP apart, each
                    FINALE_WAVE_GROWTH bigger than the last
       e DRIFT      the victory donut, which starts with wave one and
                    runs FINALE_DRIFT_TAIL past the last volley
       g SETTLE     FINALE_SETTLE
       h AFTERGLOW  FINALE_AFTERGLOW, then down over FINALE_COOL

     About five seconds for a scrape home and about seven for a perfect
     run, because the wave count is what the achievement buys. */
  FINALE_APPROACH:         0.62,     // LIVE, how hot the closing stretch gets
  FINALE_SLAM:             0.09,     // seconds to reach full at the line
  FINALE_CROSS:            0.34,     // LIVE, beat b, the crossing itself
  FINALE_HUSH:             0.46,     // LIVE, beat c, the near silence
  FINALE_HUSH_LEVEL:       0.30,     // LIVE, how far the world drops for it
  FINALE_COOL:             3.00,     // seconds to come back down at the very end
  FINALE_HIT_STOP:         0.17,     // seconds the world stands still on the line
  FINALE_SHAKE_PX:           14,     // LIVE, under SHAKE_MAX_PX, and it never sums
  FINALE_FLASH_TIME:       0.60,
  FINALE_FLASH_ALPHA:      0.46,     // LIVE
  FINALE_FREE_TIME:        0.60,     // seconds for the road's over cap to arrive
  /* ----------------------------------------------------------------
     THE WAVES. Discrete volleys rather than a trickle, because three
     things arriving is a celebration and a steady stream is weather. */
  /* ----------------------------------------------------------------
     HOW BIG THE FINALE IS FOR THE LEVEL THAT WAS JUST FINISHED.

     Completing the last level has to feel bigger than completing the
     first, or the escalation is hollow. One scalar does it: it multiplies
     the volley count and the length of every beat after the crossing, so
     an early level is both LIGHTER and SHORTER. Short matters as much as
     light here, because the next level is one input away and a finale
     that delays it is a toll on the thing the day is made of.

     The floor is what stops the first level's arrival being nothing.
     Interpolated across the level band like everything else, so it
     follows LEVEL_COUNT rather than assuming three. */
  FINALE_LEVEL_FLOOR:      0.38,     // LIVE, the scale at the first level
  FINALE_WAVES:               3,     // LIVE, volleys at level zero
  FINALE_WAVE_PER_LEVEL:   0.50,     // more for a better result, rounded
  FINALE_WAVE_GAP:         0.95,     // LIVE, seconds between volleys
  FINALE_WAVE_SHELLS:         5,     // LIVE, shells in the first volley
  FINALE_WAVE_GROWTH:      0.45,     // share more in each one after it
  FINALE_WAVE_SHAKE_PX:       7,     // per volley, capped, and it never sums
  /* MEASURED AND SPLIT. The strobe was folded into the sky gate, which
     was already pinned at one during the waves, so the clamp ate it
     whole and the volleys did not flash the city at all. Each strobe
     term is its own now, and the STEADY terms were cut to leave it room
     to move: a flash needs somewhere to flash TO. */
  FINALE_STROBE_TIME:      0.34,     // LIVE, seconds a volley lights the city for
  FINALE_STROBE_CITY:      0.30,     // LIVE, the window alpha on a volley
  FINALE_STROBE_THICK:     1.60,     // LIVE, extra roof line pixels on a volley
  FINALE_STROBE_HORIZON:   0.16,     // LIVE, extra horizon glow on a volley
  /* THE RAINBOW VICTORY LAP. The hue wheel already exists and a whole
     palette rotation measured a tenth of a millisecond, so cycling every
     biome hue during the waves really is nearly free. Nothing in normal
     play ever does this: a gate changes the hue once and then leaves it
     alone for a minute. */
  FINALE_HUE_STEP:         0.22,     // LIVE, seconds per hue during the waves
  /* ----------------------------------------------------------------
     THE VICTORY DONUT, AND IT IS THE CENTREPIECE. Fireworks over a
     stationary car could be any game. A car celebrating by drifting,
     throwing smoke and leaving its own marks across the finish line,
     could only be this one, and it is made of the vocabulary the whole
     run was written in.

     The marks go through layTyreMarks and the smoke through the same
     emitter a corner uses, so this is the game's own drift feedback
     driven by something other than the player. */
  FINALE_DRIFT_TAIL:       0.90,     // LIVE, seconds the donut runs past the last volley
  FINALE_DRIFT_IN:         0.30,     // seconds the spin takes to wind up
  FINALE_DRIFT_SPEED:      0.30,     // LIVE, share of full speed it travels at
  FINALE_DRIFT_SPIN:       3.40,     // LIVE, radians per second at full
  FINALE_DRIFT_SWING:      0.52,     // LIVE, share of the road half width it sweeps
  FINALE_DRIFT_RATE:       1.30,     // LIVE, sweeps per second
  FINALE_DRIFT_SLIP:       0.92,     // the slip it reports, which is what smokes
  FINALE_STOP_AT:          0.05,     // share of full speed that counts as still
  /* MEASURED AND CUT, from 0.55. At that value the donut's marks came
     out a solid white ribbon brighter than the road edge, and section 7
     is explicit that the lip is the brightest thing on screen and must
     stay that way. The marks are meant to be the loudest thing ON THE
     ROAD, not on the screen. */
  FINALE_MARK_GLOW:        0.20,     // LIVE, extra alpha on the marks it lays
  FINALE_SETTLE:           0.55,     // LIVE, beat g, donut over to car still
  FINALE_AFTERGLOW:        1.60,     // LIVE, beat h, the world stays lit under the result
  /* The two beats of the message. The banner lands first, alone and
     large; the result arrives under it once the car has settled. */
  FINALE_BANNER_AT:        0.20,     // seconds before LEVEL COMPLETE lands
  FINALE_BANNER_IN:        0.26,     // seconds it takes to land
  FINALE_BANNER_SIZE:     0.108,     // of the smaller dimension, at its largest
  /* THE BANNER TRAVELS BEFORE THE RESULT ARRIVES, not during it. Both
     were hung off the same reveal at first and they crossed: the banner
     was still coming down the screen while the records line was fading
     up into it. The banner is home before the result exists. */
  FINALE_BANNER_MOVE:      0.38,     // seconds it takes to settle into the headline
  FINALE_REVEAL_AFTER:     0.25,     // LIVE, seconds after the car settles
  FINALE_REVEAL_TIME:      0.55,
  /* THE OVER CAP. Each of these is ADDED to a term that was already at
     its own ceiling, so the world does something here it cannot do at a
     multiplier of twelve with the city fully awake. The first four are
     ON the road and wait for the car; the last four are SKY and do not. */
  FINALE_EDGE_GLOW:        0.30,     // LIVE, on top of HEAT_EDGE_GLOW
  FINALE_EDGE_SPREAD:      1.60,     // LIVE
  FINALE_PYLON_GLOW:       0.34,     // LIVE
  FINALE_PYLON_SPREAD:     1.40,
  FINALE_SKY_LIFT:         0.60,     // LIVE, on top of HEAT_SKYLINE_LIFT
  FINALE_SKY_THICK:        1.20,
  FINALE_HORIZON:          0.14,     // LIVE
  FINALE_CITY_ALPHA:       0.16,     // LIVE, on top of CITY_ALPHA
  /* ----------------------------------------------------------------
     THE FIREWORKS, on the particle pool the explosion already uses
     rather than a second system. Shells rise from along the road and
     from where the finish structure went past, then burst.

     GENEROUS SCALES WITH WHAT WAS ACHIEVED. finaleLevel counts the
     things worth celebrating, and the wave count, the volley size and
     the burst size all read it, so a clean run that took the record
     cannot look like a scrappy one that squeaked over. */
  /* MEASURED, TWICE. At 0.72 the shells burst at head height and read
     as sparks off the road; at 1.30 they burst level with the car. The
     sky above the skyline is where a firework belongs, and on an 844
     tall screen that is 450 pixels of climb from the launch line. */
  FIREWORK_RISE:           0.80,     // seconds a shell climbs before it bursts
  FIREWORK_SPEED:          0.98,     // LIVE, of the SCREEN HEIGHT per second
  /* MEASURED AND CUT, from 24 and 6. Volleys overlap by design, and at
     the top level wave five alone wanted six hundred sparks with wave
     four's still in the air. THE SHELL COUNT IS WHAT READS AS GENEROUS,
     not the spark count inside each burst: sixteen flowers of eighteen
     look bigger than six of forty two, and they fit in the pool. */
  FIREWORK_SPARKS:           18,     // LIVE, per burst at level zero
  FIREWORK_SPARK_GAIN:        4,     // more per level
  FIREWORK_SPARK_SPEED:    0.38,     // of the smaller dimension per second
  FIREWORK_LIFE:           1.20,     // seconds a spark lives
  FIREWORK_DRAG:           0.60,     // seconds, the velocity time constant
  FIREWORK_GRAVITY:        0.34,     // of the smaller dimension per second squared
  FIREWORK_SIZE:          0.0065,    // of the smaller dimension
  FIREWORK_SHELL_SIZE:     0.60,     // of a spark, so the rising shell is smaller

  DEATH_BOTTOM:              96,     // pixels above the safe area, the button's centre
  /* THE AIR BETWEEN THE TITLE SCREEN'S LAST LINE AND THE FINE PRINT
     UNDER IT. The fine print's own height is not a constant and must not
     become one: it is one line of type in landscape and two in portrait,
     it depends on the width, the type metrics and where the browser
     chooses to break, and it is read off the DOM on every resize. This
     is only the gap above it, which is a look and therefore belongs
     here. The title screen is the only screen that reserves any of this;
     the death and completion screens still sit on DEATH_BOTTOM alone. */
  TITLE_FINE_GAP:             6,     // pixels, canvas copy to fine print
  DEATH_PROMPT_GAP:        0.115,    // of the smaller dimension, prompt above the button
  RESUME_FLASH_TIME:       0.45,     // the wash on arriving back at the gate

  /* ----------------------------------------------------------------
     THE SHARE CARD, which is the growth engine rather than a feature.

     Handoff 2.5: the Wordle grid, not the puzzle, took that game from
     ninety players to millions, and it worked because it showed the
     SHAPE of an attempt rather than reducing it to a number. A shape
     leaves the recipient something to ask about. A score does not.

     1200 BY 630 because it is the card shape every chat app, every
     scraper and every feed already handles, and because og-card.png is
     that shape, so a link preview and a shared result look like the same
     product. Drawn at exactly this size, not scaled: a card is generated
     once per run and there is nothing to gain from a device pixel ratio.

     EVERYTHING ON IT IS SIZED FOR A THUMBNAIL. The smallest type on the
     card is the URL at 40px, which is a hair over 3% of the width, and
     the level blocks read as three different densities before any of the
     type resolves at all. Nothing here is fine detail.

     THE COLOURS ARE WRITTEN OUT rather than read from COLOUR, for the
     same reason the boot splash writes its own field: COLOUR is what a
     biome rotates, and a card whose palette depended on which biome the
     player happened to die in would not be a brand. */
  CARD_W:                  1200,
  CARD_H:                   630,
  CARD_PAD:                  64,     // the margin everything sits inside
  CARD_WORDMARK:            300,     // ink width of DRIFT FEVER
  CARD_BLOCK_GAP:            18,     // between two level blocks
  CARD_BLOCK_H:              92,     // and how tall they are
  /* How long to wait for toBlob before giving up and sharing the text.
     It has never been reached in testing: the whole card measures a few
     milliseconds. It exists because a share that hangs is worse than a
     share that is plain, and a callback that never fires is exactly how
     that happens. */
  CARD_BLOB_TIMEOUT:       2500,     // milliseconds

  /* ----------------------------------------------------------------
     Audio. Everything here is synthesised: oscillators and one generated
     noise buffer. Nothing is fetched, nothing is decoded, and there is no
     sample data in the file, because section 6's audience is behind a
     content filter and a single blocked request is a broken game.

     It is off until a station is picked, and it is off again on the next
     load. Section 5 says audio defaults off and stays off across sessions,
     so the chosen station is deliberately NOT persisted: these are shared
     classroom machines and the next person to open the page gets silence.
     ---------------------------------------------------------------- */
  /* The finish fanfare. On the effects bus, because music is off by
     default and this has to land for somebody with it disabled. */
  FANFARE_STEP:           0.085,     // LIVE, seconds between notes
  FANFARE_GAIN:            0.19,     // LIVE, above a sting and below the master
  FANFARE_TAIL:            1.60,     // LIVE, seconds the last note rings out
  AUDIO_MASTER:            0.55,     // the whole graph, never near 1
  AUDIO_FADE_TIME:         0.08,     // seconds, the follow on every live level
  AUDIO_START_TIME:        0.35,     // seconds to fade the graph in on a station change
  /* The very first start is slower than a station change, because it is
     the one nobody asked for. A game that comes up at full level in a
     quiet room gets closed before the player finds the mute. */
  AUDIO_FIRST_FADE:         1.2,     // seconds, silence to full on the first gesture
  /* The pause does not mute. It closes a lowpass over the whole graph, so
     the music is still there and muffled, which reads as the game being
     set aside rather than as the audio having crashed. */
  AUDIO_PAUSE_CUTOFF:       300,     // Hz the master lowpass closes to
  AUDIO_OPEN_CUTOFF:      18000,     // Hz it sits at otherwise
  AUDIO_PAUSE_TIME:        0.18,     // seconds of sweep, each way

  /* The skid, and it is the one that matters. ONE voice, started once and
     never retriggered: a looping noise buffer through a bandpass whose
     frequency, Q and level are all driven by the slip angle. Retriggering
     a skid per event is what makes drift games sound like a stuck record.

     Fatigue is the thing to design against here, because this sound is
     present for most of a good run. Three defences: the top end is rolled
     off by a fixed lowpass after the bandpass, the band moves over a
     deliberately modest range so it reads as a tyre loading up rather
     than as a siren, and SKID_WOBBLE keeps it alive at a held slip angle
     without any of that movement being large.

     SKID_GAIN_MAX is NOT a level and must not be read as one. It is a
     gain applied before two filters that throw most of the energy away,
     so it compensates for them and the number that matters is what comes
     out. Measured at the master output at full slip: at 0.30 the skid was
     0.016 RMS against the music's 0.046, so the sound carrying the core
     mechanic was three times quieter than the backing track despite the
     two constants looking comparable. 1.10 only brought it to parity, so
     this is 1.60, which measures 0.075 RMS against the music's 0.049, a
     lead of about four decibels. The worst case the graph can produce,
     full slip plus a scrape plus a crash on top, peaks at 0.40 of full
     scale, so there are eight decibels of headroom left. There is
     no clipping and no distortion: the path is linear, so a louder skid
     is a louder skid and not a harsher one.

     RE BALANCED IN SESSION FORTY, AGAINST THE RECORDED TRACKS. Those
     numbers were the skid against the PROCEDURAL arp, and putting the
     skid four decibels ahead of it was right: two textures, and the one
     carrying the mechanic should lead. It is wrong against four original
     tracks, which are the feature and not texture.

     Measured again the same way, at the master, with the car ACTUALLY
     drifting rather than with slipNorm pinned by hand, because the skid
     reads a bite computed off the live state and a pinned slip does not
     produce one. Scaled to full slip, at 0.85 the skid comes out about
     0.076 RMS, and a recorded track at TUNE_GAIN 1.35 comes out about
     0.145, a lead of roughly six decibels. At the shipped 1.60 and 0.62
     the music TRAILED the skid.

     THE ONE NUMBER THAT COULD NOT BE MEASURED HERE is the source level
     of the four m4a files, because this browser has no AAC decoder. The
     stand in used for these measurements is a sine and the real figure
     above assumes a fairly ordinary master. Both constants are on the
     cycler for exactly that reason: the last of this has to be found by
     playing it.

     Note that bite scales this by slip, and a typical fast lap sits near
     0.65 slip rather than 1.0, so the sustained level in play is roughly
     two thirds of the figure above. */
  SKID_GAIN_MAX:           0.85,     // LIVE
  SKID_MIN_SLIP:           0.08,     // slipNorm below this is silent
  SKID_FREQ_LOW:            520,     // Hz at the first hint of slip
  SKID_FREQ_HIGH:          1250,     // Hz fully sideways. Modest on purpose.
  SKID_Q_LOW:               1.1,
  SKID_Q_HIGH:              4.2,     // tighter as it bites, which is the whistle
  SKID_TOP_CUTOFF:         2600,     // Hz, the fixed roll off that stops the hiss
  SKID_WOBBLE_HZ:           5.7,     // a slow, small breath on the band
  SKID_WOBBLE_FREQ:          70,     // Hz of deviation, audio rate, no per frame cost

  /* The scrape. Also one continuous voice, because scraping is a state
     rather than an event, but it has to be unmistakable against the skid
     at a glance: two high Q bands at a deliberately non harmonic ratio
     ring like metal on metal, where the skid is broad and soft. It also
     tightens as the budget runs out, which is the same thing the edge
     flash is already saying. */
  SCRAPE_GAIN_MAX:         0.26,
  SCRAPE_FREQ:             2100,     // Hz, the first band
  SCRAPE_FREQ_RATIO:       1.48,     // the second, off any harmonic of the first
  SCRAPE_Q:                  11,
  SCRAPE_RISK_LIFT:        0.35,     // how far under full it starts, so the max is the max

  /* The crash, and then quiet. One envelope on a noise burst with the
     filter sweeping down, and every other voice pulled to nothing under
     it, so the wind down is clean rather than a skid that outlives the
     car. */
  CRASH_GAIN:              0.50,
  CRASH_FREQ_FROM:         1400,     // Hz the sweep starts at
  CRASH_FREQ_TO:            110,     // Hz it lands on
  CRASH_TIME:              0.90,     // seconds of tail

  /* The music. Driving, arpeggiated, and built in layers rather than as
     one part, so the intensity can rise smoothly with what the car is
     doing instead of switching between arrangements. MUSIC_HEAT_TIME is
     what keeps that smooth: the heat follows slip and scrape through a
     long lag, so a flick does not make the music stutter. */
  MUSIC_GAIN:              0.34,
  MUSIC_BPM:                148,     // high tempo, per the brief
  MUSIC_STEPS:               16,     // steps in a bar, so these are sixteenths
  MUSIC_LOOKAHEAD:         0.14,     // seconds of notes scheduled in front
  MUSIC_HEAT_TIME:         0.90,     // seconds of lag on the intensity
  MUSIC_BASS_GAIN:         0.30,
  MUSIC_ARP_GAIN:          0.20,
  MUSIC_OCTAVE_GAIN:       0.13,     // the layer that only arrives under pressure
  MUSIC_HAT_GAIN:          0.09,
  MUSIC_ARP_CUTOFF_LOW:     700,     // Hz at rest, dull
  MUSIC_ARP_CUTOFF_HIGH:   4200,     // Hz on the edge, open
  MUSIC_NOTE_DECAY:        0.16,     // seconds
  MUSIC_BASS_DECAY:        0.20,
  MUSIC_HAT_DECAY:        0.045,
  MUSIC_ATTACK:           0.006,     // seconds. Short, but not zero, or it clicks.
  MUSIC_DUCK:              0.35,     // how far the music drops under a crash
  /* ----------------------------------------------------------------
     THE FOUR RECORDED TRACKS, AND WHY THEY ARE ALLOWED TO EXIST.

     Sections 5 and 6 say audio defaults off and that nothing is ever
     fetched. The author is reversing both, deliberately, and the
     mitigations are what make it safe rather than a change of mind:

       NOTHING IS FETCHED BEFORE THE TITLE SCREEN. A first ever visitor
       who loads the page and looks at it downloads the HTML and nothing
       else, which is the whole of section 6's actual concern.
       THE TITLE SCREEN SAYS SO before a note plays, and the mute is
       already on screen and one tap away when it does.
       NOTHING EVER WAITS ON AUDIO. Not the title screen, not a run, not
       a restart, not a continue. A track that has not arrived is a run
       that starts quiet.
       A FAILED FETCH FALLS BACK TO THE PROCEDURAL TRACK, which is still
       here and still costs nothing.

     STREAMED, NOT DECODED. decodeAudioData on a three minute track is
     tens of megabytes of PCM and the target is a five year old Celeron
     Chromebook. An HTMLAudioElement streams it, and
     createMediaElementSource puts it back inside the Web Audio graph so
     the existing ducking and the filter still apply. */
  /* THE RECORDED TRACK'S OWN LEVEL, and it is deliberately NOT
     MUSIC_GAIN. That belongs to the procedural arp, which is four thin
     oscillator voices and is tuned for a completely different kind of
     sound; sharing a constant between a synth patch and a finished
     stereo master would mean neither could be set right.

     MEASURED AT THE MASTER OUTPUT, which is the only comparison that
     means anything here, for the reason written out beside
     SKID_GAIN_MAX. See the note there for the numbers. */
  TUNE_GAIN:               1.35,     // LIVE, the recorded track's own level
  TUNE_FADE_IN:            2.00,     // LIVE, seconds. Time to react to being caught.
  TUNE_CROSSFADE:          2.40,     // LIVE, seconds between one track and the next
  TUNE_TAIL:               6.00,     // seconds before the end that the next one starts
  /* THERE IS NO LAYER THAT ARRIVES UNDER PRESSURE ANY MORE. Three
     constants used to live here driving a lowpass whose cutoff opened
     with the multiplier. Played, it did not read as the music
     responding; it read as the tracks being broken, so it is gone
     rather than retuned. The recorded music is a plain playlist and the
     only things that touch it are the crossfade and the crash duck. */
  TUNE_NAME_TIME:          3.60,     // LIVE, seconds the track's name is shown
  TUNE_NAME_FADE:          0.80,     // LIVE, seconds it takes to leave
  TUNE_NAME_SIZE:         0.030,     // LIVE, of the smaller dimension
  TUNE_NAME_ALPHA:         0.72,     // LIVE
  /* WAITING IS NOT FAILING, so there is no give up timer here any more.
     These two are about RECOVERY rather than about patience: how often
     to re ask a browser that may have rejected play(), and how long to
     wait before trying a failed fetch again. The retry backoff doubles,
     so a genuinely dead file stops costing anything within a few runs
     and a momentary network drop costs one. */
  TUNE_RETRY_PLAY:          2.5,     // seconds between re asking play()
  TUNE_RETRY_AFTER:         4.0,     // seconds before a failed fetch is retried
  TUNE_RETRIES:               4,     // and how many times, backing off each time

  /* Tilt. TILT_SMOOTHING_TIME matters most on cheap Android handsets that
     derive orientation from the accelerometer.

     The two LIVE ones move together or not at all. TILT_DEADZONE_DEG is
     subtracted from TILT_FULL_LOCK_DEG to get the usable span, so shrinking
     the full lock angle without shrinking the deadzone hands a bigger share
     of the wrist to the dead part. The readout prints the deadzone as a
     percentage of full lock for exactly that reason: hold that percentage
     roughly steady while hunting for the lock angle. */
  /* Which way a tilt steers, and it is the ONLY sign in the entire tilt
     path. THE FULL CONVENTION IS AT THE TOP OF THE TILT SECTION, with
     the table of correct signs at 0, 90, 180 and 270, and tiltAssert
     below it checks every claim that block makes.

     SET FROM THE HANDSET, NEVER FROM A DERIVATION. The spec's reading of
     gamma argues one way and the phone has done the other, and the phone
     is the thing being played. See the convention block for why the older
     reports could not pin this and the latest one can.

     AND IT NOW MATTERS FAR LESS THAN IT DID, which is the point of the
     calibration gesture: on the first enable the device is asked which
     way it reads, and the answer replaces this. This is the fallback for
     a player who skips the gesture and nothing more. */
  TILT_DIRECTION:             1,
  /* The sign on the sine term of the screen space remap, which is the one
     value that can make the two landscape orientations disagree with
     portrait. It flips 90 and 270 together and cannot touch portrait, so
     landscape being backwards is a one value question rather than two
     independent guesses. TILT_DIRECTION flips all four together, which is
     why "backwards in both" is one edit and not two. LIVE. */
  TILT_LANDSCAPE_SENSE:       1,
  TILT_SMOOTHING_TIME:     0.08,     // seconds, exponential smoothing
  TILT_DEADZONE_DEG:       1.50,     // LIVE, the neutral state from section 4.1
  TILT_FULL_LOCK_DEG:        15,     // LIVE, degrees from the calibrated zero to full lock
  /* Past this share of the full lock angle, the deadzone has eaten most of
     the analogue range and the gyro is behaving like a switch. The readout
     says so rather than clamping it, because the right answer is to shrink
     the deadzone, not to stop looking for sensitivity. */
  TILT_DEADZONE_WARN:      0.30,
  TILT_SENSOR_TIMEOUT:      1.5,     // seconds to wait for a first real reading
  /* THE CALIBRATION GESTURE. Hold the phone how you want to play, then
     tilt left. The sign of the change IS the direction, so the handset
     answers a question this file has guessed wrong seven times, and the
     posture it was held in is the zero point section 8.4 asks for. One
     gesture, two jobs.

     TILT_CAL_SETTLE is how long the posture has to be still before the
     gesture is read at all, so the movement of picking the phone up is
     not mistaken for the answer. TILT_CAL_ANGLE is the excursion that
     decides it, comfortably past TILT_FULL_LOCK_DEG's deadzone and well
     inside a wrist. TILT_CAL_MIN_DEG is the floor: below it the gesture
     said nothing and the source default stands. TILT_CAL_SECONDS is how
     long it waits before giving up, and giving up is not a failure, it is
     the skip path. TILT_CAL_HOLD is the press on the flip button that
     runs the whole thing again. */
  TILT_CAL_SETTLE:         0.45,     // seconds of stillness before the read starts
  TILT_CAL_ANGLE:             8,     // degrees of change that decide it
  TILT_CAL_MIN_DEG:           3,     // below this the gesture said nothing
  TILT_CAL_SECONDS:         6.0,     // then give up and keep the source default
  TILT_CAL_HOLD:           0.55,     // seconds on the flip button to run it again
  /* Section 5 says no tutorial and that stands. Tilt is the one exception
     because it is an invisible option behind a button nobody has a reason
     to press, and a ring that breathes around that button is not a
     tutorial: no overlay, no words, nothing to dismiss.

     The timer is the important half. It stops on the stored flag, but
     storage fails silently on locked down school profiles, which is
     precisely this audience, so first visit detection quietly becomes
     every visit for some players. A pulse that gives up after a few
     seconds regardless is fine. One that greets a returning player for
     ever is not. Frame time, so it does not run down in a hidden tab.

     AND IT ONLY RUNS WHILE THE CAR IS. Measured: the clock used to start
     at page load, so a player who read the title screen for six seconds
     arrived at the road with four seconds of hint left. The ring keeps
     breathing on the title screen for as long as it takes, and the ten
     seconds is ten seconds of DRIVING, which is what "the opening
     stretch" means. It also survives a crash in the first few seconds:
     the countdown carries over into the restart rather than resetting or
     being lost. */
  TILT_HINT_SECONDS:         18,
  /* THE WORDS. A ring says "something is here". It does not say "you can
     steer by tilting the phone", and nobody guesses that. So the same
     timer now also draws a short line above the tilt button with a
     pointer down at it: the words explain, the ring locates.

     LOW AND TO THE RIGHT, in the band the pads already own, so it is
     never over the road ahead. Section 7's whole argument about the edge
     being the difference between living and dying applies to anything
     laid over the driving surface, and this is not an exception. */
  /* MEASURED BY TESTERS FAILING TO FIND IT. At 0.043 of the smaller
     dimension this was 17 pixels on a 390 wide phone, which is smaller
     than the score's own subtitle, for the one message in the game aimed
     at somebody who has never played it. It is the sanctioned exception
     to section 5 and it was too timid to do the job. */
  TILT_HINT_SIZE:          0.068,    // LIVE, of the smaller dimension
  TILT_HINT_SUB:           0.54,     // LIVE, the sentence under it, of that size
  TILT_HINT_SUB_ALPHA:     0.90,     // LIVE
  TILT_HINT_IN:             0.45,    // seconds to fade up
  TILT_HINT_FADE:           1.60,    // LIVE, seconds of fade at the end
  TILT_HINT_GAP:            0.30,    // of the pad's height, words above it
  TILT_HINT_ALPHA:          0.94,    // LIVE
  TILT_HINT_ARROW:          0.62,    // LIVE, of the type size, the pointer's reach
  TILT_HINT_BOB:            0.22,    // of the pointer's reach, how far it bobs
  TILT_HINT_BOB_HZ:         1.15,    // LIVE

  /* The car, in world units, the same units as the road. It is a real box
     in the world now, so these are its actual dimensions and they set the
     perceived mass. Where it sits on screen is not a constant: it falls
     out of CAMERA_DISTANCE and HORIZON_FRACTION, and the front of the car
     is further from the camera than the back, so the two ends project at
     different scales on their own.

     The road is 4600 units across, so a unit is roughly two and a half
     millimetres and the car is about 1.5 by 2.2 metres. BODY_WIDTH sets the
     margin: SCRAPE_START is 1 minus half the body width in road half
     widths, so the outside wheels reach the shoulder as the scrape begins.
     Move one, check the other.

     One caution about the length. The ground plane is stretched along the
     road by the same anisotropy the car's height dodges, so a car that is
     twice as long as it is wide in world units reads closer to three times
     on screen. The length below is set by how it looks, not by the ratio.
     If the road ever gets an isotropic projection, lengthen it again. */
  CAR_BODY_WIDTH:           600,
  CAR_BODY_LENGTH:          880,
  CAR_BODY_HEIGHT:          250,
  CAR_RIDE_HEIGHT:           85,     // ground to the underside of the body
  /* The body is lofted through stations along its length rather than
     built from boxes, because a box is exactly what it looked like.

     Every number below is a fraction, of the half width or of the body
     height, at a station given as a fraction of the half length from the
     tail (0) to the nose (1). Three things make it read as a car rather
     than a crate and all three live here: it TAPERS, so no two sides are
     parallel; every hard edge is CHAMFERED, which is the sill and shoulder
     rows below and costs twice the faces for a dramatically softer read;
     and it is WIDEST AT THE AXLES, which is what a flared arch is.

     The camera is behind and above and essentially never sees the nose,
     so the stations are packed toward the tail. The rear three quarter is
     the only view that matters and it gets the geometry. */
  CAR_STATIONS: [
    // z,    sill,  hip,   shoulder, roof,  yLow,  yHip,  yShoulder, yRoof
    [-1.00,  0.72,  0.86,  0.80,     0.50,  0.10,  0.34,  0.70,      0.94],
    [-0.80,  0.80,  1.06,  0.92,     0.62,  0.04,  0.32,  0.74,      1.06],
    [-0.42,  0.82,  0.99,  0.93,     0.72,  0.02,  0.32,  0.80,      1.30],
    [-0.05,  0.84,  0.98,  0.94,     0.70,  0.02,  0.32,  0.82,      1.34],
    [ 0.34,  0.82,  0.97,  0.88,     0.52,  0.03,  0.32,  0.72,      0.96],
    [ 0.68,  0.74,  1.02,  0.80,     0.44,  0.06,  0.30,  0.56,      0.62],
    [ 1.00,  0.52,  0.68,  0.58,     0.34,  0.14,  0.28,  0.44,      0.48]
  ],
  CAR_GLASS_FROM:         -0.50,     // stations between these two are glass
  CAR_GLASS_TO:            0.36,
  /* The rear light bar, which is the detail the player sees most of and
     therefore the one worth spending on. Fractions of the tail station. */
  CAR_LIGHT_Y:             0.62,     // of body height, up the tail
  CAR_LIGHT_HALF:          0.74,     // of the tail half width
  CAR_LIGHT_THICK:         0.10,     // of body height
  CAR_SPOILER_Z:          -1.02,     // of half length
  CAR_SPOILER_Y:           1.16,     // of body height
  CAR_SPOILER_HALF:        0.92,     // of half width
  CAR_SPOILER_CHORD:       0.16,     // of half length
  CAR_SPOILER_THICK:         26,     // world units
  CAR_SPOILER_POST:         0.5,     // of half width, how far out the posts sit
  CAR_SPOILER_SHADOW:      0.55,     // alpha of the gap band under the blade
  /* THE UNLOCKABLE WING SHAPES, as multiples of the stock one, so the
     stock car is untouched by construction and a variant cannot drift
     away from it when the stock numbers are tuned. */
  CAR_WING_DUCK_HALF:      0.66,     // LIVE, the ducktail's span
  CAR_WING_DUCK_Y:         0.98,     // LIVE, of body height, sitting on the boot
  CAR_WING_WIDE_HALF:      1.14,     // LIVE, the wide blade's span
  CAR_WING_WIDE_THICK:     0.55,     // LIVE, and it is thinner for it
  /* The glow may spread upward and backward as much as it likes, because
     that reads as light on air. It may NOT spread sideways past the car's
     own tail, because that reads as bodywork: at a spread of 2.3 on a
     strip already 0.74 of the tail half width, the red bloom finished up
     70% wider than the rear of the car and looked like a bar bolted
     across it. This is a hard ceiling in tail half widths and the spread
     is clamped to it however large it gets. */
  CAR_LIGHT_GLOW_MAX:      0.98,     // of the tail half width, laterally
  CAR_LIGHT_GLOW_BACK:       34,     // world units the glow sits behind the strip
  CAR_RIM_GLOW_SPREAD:      1.9,
  CAR_RIM_GLOW_ALPHA:      0.30,
  CAR_CABIN_LENGTH:         380,
  CAR_CABIN_WIDTH:          450,
  CAR_CABIN_HEIGHT:         175,
  CAR_CABIN_OFFSET:         -40,     // negative sits the cabin back towards the rear
  CAR_WHEEL_DIAMETER:       230,
  CAR_WHEEL_WIDTH:          100,
  CAR_TRACK:                630,     // wheel centre to wheel centre, wider than the body
  CAR_WHEELBASE:            560,     // front axle to rear axle
  CAR_FRONT_STEER_DEG:       30,     // how far the front wheels turn at full lock

  /* Body roll. It leans away from the direction it is being accelerated,
     which is what makes it read as having weight. Section 7 warns about
     overdoing motion on a phone held close to the face, so this is small
     on purpose. CAR_ROLL_REFERENCE is the sideways acceleration, in road
     half widths per second squared, at which the lean saturates. */
  /* Off. It read as the car tilting rather than as the car drifting, which
     is a different and worse thing to say. The constant and the code stay
     so it can be put back by moving one number. */
  CAR_ROLL_DEG:             0.0,
  CAR_ROLL_REFERENCE:       8.0,
  CAR_ROLL_PIVOT:            60,     // height of the axis it leans about
  CAR_POOL_ALPHA:          0.30,     // the light the car spills onto the road
  CAR_POOL_SIZE:            5.2,     // multiple of the body half width
  CAR_POOL_SQUASH:         0.62,     // it lies on the road, so it is an ellipse
  CAR_LIGHT_GLOW_SPREAD:    2.3,     // multiple of the light strip, for its glow
  CAR_LIGHT_GLOW_ALPHA:    0.34,

  /* Tyre marks. They live on the road segments, so they are bounded by
     the segment window and cannot grow through a long run. They are only
     visible between the camera and the car, which means CAMERA_DISTANCE
     decides how much of your own line you get to see. They are laid from
     the two rear wheel contact points, which yaw with the body, so the
     pair sweeps apart as the car comes sideways. */
  TYRE_MARK_WIDTH:        0.028,     // road half widths
  /* Low, so that a tidy line still leaves a faint cool trace and the ramp
     has somewhere to start. The intensity doubles as the alpha, so near
     the threshold the mark is there but almost invisible. */
  TYRE_MARK_MIN_SLIP:      0.05,
  /* Higher than it was, because the road underneath is far darker now.
     At the old value the marks came out a muted purple instead of the
     glow the palette needs them to be. Still nowhere near the edge. */
  TYRE_MARK_MAX_ALPHA:     0.70,
  /* The trail. The marks are the trail, rather than a second ribbon that
     would compete with them. They fade out behind the car over this many
     segments, and their colour runs from a dim cool line when the car is
     gripping to a hot one when it is fully sideways. That ramp is 4.4's
     argument made visually: the best looking thing on screen is the thing
     the player earns by taking risk, and it exists before any score does. */
  TRAIL_FADE_SEGMENTS:       46,
  TRAIL_GLOW_SPREAD:        3.4,     // multiple of the mark width
  TRAIL_GLOW_ALPHA:        0.34,

  /* Tyre smoke. Screen space, because the car is at a fixed screen
     position, and capped so a long slide cannot grow the buffer. */
  SMOKE_MIN_SLIP:          0.30,
  SMOKE_RATE:                60,     // puffs per second at full slip
  SMOKE_LIFE:              0.45,     // seconds
  SMOKE_BACK_SPEED:         340,     // pixels per second down the screen
  SMOKE_GROWTH:              50,     // pixels per second of radius. Overdo this and
                                     // the puffs merge into one grey boulder.
  SMOKE_START_RADIUS:      0.09,     // of the car width
  SMOKE_ALPHA:             0.16,
  SMOKE_MAX:                 70,     // hard cap on live puffs

  /* Road generation. The road is built from phrases rather than from an
     independent random pick per section, so corners can set each other up.
     Lengths below are in segments and every phrase jitters them, so these
     are centres rather than exact values.

     The corner strengths are at their ceiling and must not be raised.
     CURVE_HARD times CENTRIFUGAL is already 55% of full lock, and at 100%
     a corner is unsurvivable however well it is driven. Difficulty comes
     from sequencing and from road width. */
  OPENING_STRAIGHT:         140,     // segments of calm before anything happens
  RAMP_SHORT:                10,
  RAMP_MED:                  26,
  RAMP_LONG:                 48,
  HOLD_SHORT:                16,
  HOLD_MED:                  52,
  HOLD_LONG:                125,
  LINK_SHORT:                14,     // the breath between linked corners
  /* Straights are connectors, not scenery. Long enough to read the next
     corner and reset the line, short enough that they are never the thing
     you are doing. They are not deleted, because without them the hard
     sequences have nothing to be hard against, and section 4.3 needs
     somewhere to look ahead from. */
  RECOVERY_MIN:              20,
  RECOVERY_MAX:              44,
  STRAIGHT_WEIGHT:            1,     // against PHRASE_WEIGHT for everything else
  PHRASE_WEIGHT:              3,
  DIRECTION_FLIP_CHANCE:   0.68,     // how often a phrase turns the other way
  PHRASE_JITTER:           0.28,     // fractional variation on every length
  /* The three corner strengths, and one gain over all of them.

     Visual tightness and difficulty are two dials, not one. These values
     and CURVE_SCALE decide how sharply the road bends on screen. That
     product times CENTRIFUGAL decides how hard it throws the car, and only
     the second one has a ceiling at 1.0. So the shape can be made far
     tighter at unchanged difficulty by raising this and dropping
     CENTRIFUGAL to match, and the two can then be tuned apart.

     CURVE_SCALE is applied where the curvature is read rather than where
     it is stored, so moving it live reshapes the road already on screen
     instead of only the road not yet generated. The three below keep their
     relationship to each other and are not separately tunable on purpose. */
  CURVE_GENTLE:             1.6,
  CURVE_MEDIUM:             3.2,
  CURVE_HARD:               5.0,
  CURVE_SCALE:              2.5,     // LIVE, the reference the ramp is built around

  /* ----------------------------------------------------------------
     Road hazards, which is section 4.5: escalate by KIND, not by degree.
     Three of them, each a different skill, introduced one at a time.

     BLOCKER  occupies part of the width. A line change. Placed off centre
              so the clean line often runs near an edge, which spends the
              scrape economy that already exists rather than inventing a
              second one.
     SPLITTER a long bar down the middle. Pick a side and commit. A
              decision rather than a reflex, and a fork in feel without
              any fork geometry.
     MOVER    a blocker sliding across the road. Timing.

     All three are the same box with different parameters, so there is one
     piece of geometry, one collision test and one draw pass.

     THEY MUST NEVER BE UNAVOIDABLE, and that is enforced rather than
     hoped for. See hazardFits: every candidate is checked against the
     lateral distance the car can actually cover in the warning distance,
     at the worst curvature in the span, from the worst starting side, and
     rejected if the margin is under HAZARD_SAFETY. Nothing is placed that
     has not passed.

     THEY GET THE SAME THREE BANDS AS THE ROAD EDGE. Clipping the shoulder
     of one drives the existing scrape state, so it costs speed and budget
     and brings the flash and the shake with it. Hitting the core kills.
     Section 4.2's argument against a binary cliff applies to a hazard
     exactly as it applies to the road edge. */
  /* Taller and striped, because a cold player read these as jumps and
     aimed at them. Height alone is not the fix: what says "solid" is a
     dark vertical face carrying diagonal hazard striping, which is the
     one marking that universally means do not hit. */
  HAZARD_HEIGHT:            900,     // world units, tall enough to read at distance
  HAZARD_STRIPE_COUNT:        7,     // diagonal bands across the front face
  HAZARD_STRIPE_SLANT:      0.9,     // of the face height, how far the bands lean
  HAZARD_CLIP:              140,     // world units of shoulder each side, the middle band
  HAZARD_WARN_SEGMENTS:      45,     // a full second of warning, painted on the road
  HAZARD_WARN_STRIPES:        4,     // arrowheads painted in the OPEN lane
  HAZARD_WARN_ALPHA:       0.50,     // LIVE, those arrowheads
  HAZARD_WARN_BARS:           5,     // LIVE, barrier bars across the BLOCKED width
  HAZARD_WARN_BAR_THICK:   0.55,     // LIVE, of the segment's own drawn depth
  HAZARD_WARN_BAR_ALPHA:   0.72,     // LIVE
  HAZARD_ARROW_LENGTH:        7,     // segments each arrowhead spans
  /* The curvature a hazard may sit in at its entry, after the scale.

     This is a READABILITY bound and nothing else. The road slides off the
     side of the screen at about 2L/(CAMERA_DEPTH x curvature) segments,
