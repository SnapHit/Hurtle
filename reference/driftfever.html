  if (overDrift) coastSpeed = Math.min(coastSpeed, want);
  position += coastSpeed * dt;

  // The road has to keep arriving under a car that is still moving.
  topUpRoad(Math.floor(position / FEEL.SEGMENT_LENGTH));
  const prevX = carX;
  carSegIndex = Math.floor((position + FEEL.CAMERA_DISTANCE) / FEEL.SEGMENT_LENGTH);

  // The spin, which is the whole of the celebration in one number.
  finaleSpin += FEEL.FINALE_DRIFT_SPIN * env * dt;
  finaleSwing += FEEL.FINALE_DRIFT_RATE * env * dt;

  /* And the sweep across the road that turns a spin into a donut. It is
     centred on wherever the car crossed and clamped well inside the
     edges, because a celebration that drives off the road would be a
     poor one. */
  const seg = segAt(carSegIndex);
  const half = seg ? seg.hw : FEEL.ROAD_HALF_WIDTH_BASE;
  const swing = Math.sin(finaleSwing * Math.PI * 2) * half * FEEL.FINALE_DRIFT_SWING * env;
  carX = clamp(finishX + swing, -half * FEEL.OFF_ROAD, half * FEEL.OFF_ROAD);
  carFrac = carX / half;

  /* THE SLIP IS REPORTED, NOT DERIVED. Everything downstream of a drift
     reads slipNorm, so writing it here is what makes the smoke pour and
     the marks go dark without a single special case in either. */
  drift.lateralV = (carX - prevX) / Math.max(dt, 0.0001);
  drift.headingV = 0;
  drift.headingAngle = 0;
  drift.travelAngle = 0;
  drift.slip = 0;
  drift.slipDeg = FEEL.SLIP_MAX_DEG * FEEL.FINALE_DRIFT_SLIP * env;
  drift.slipNorm = clamp(FEEL.FINALE_DRIFT_SLIP * env, 0, 1);

  // The game's own drift feedback, driven by the celebration.
  layTyreMarks(carSegIndex, prevX);
  updateSmoke(dt);
}
/* ==================================================================
   THE FIREWORKS, ON THE EXPLOSION'S OWN POOL.

   A SHELL RISES AND BURSTS, which is two stages and is why fireworks
   read as fireworks rather than as confetti appearing. The rise is what
   the eye follows and the burst is what it was following for; a burst
   with no climb in front of it is just a flash.

   SCREEN SPACE, like the debris, and for a stronger reason here: these
   are meant to be over the world rather than in it, and a firework that
   converged on the vanishing point with the road would look like the
   road throwing sparks. Launch positions are spread across the width and
   biased toward the middle, so they read as coming from where the finish
   structure went past and from along the road either side of it.
   ================================================================== */
function fireworkLaunch(spread) {
  const s = Math.min(view.w, view.h);
  /* THE CLIMB IS MEASURED IN SCREEN HEIGHTS, NOT IN THE SMALLER
     DIMENSION. Everything else in this file scales off min(w, h) because
     it has to look the same size in both orientations, and that is right
     for a burst. It is wrong for the RISE: in landscape the smaller
     dimension IS the height, so a shell told to climb 1.85 of it left
     the screen entirely and every volley burst above the top edge. In
     portrait nothing looked wrong, which is why it survived a session.
     Measured in landscape, the shells cleared the top by 190 pixels. */
  const up = view.h;
  const p = takeParticle();
  /* Biased to the middle by squaring a signed random, so most go up over
     the road and the rest fan out along it. */
  const t = Math.random() * 2 - 1;
  p.x = view.w * (0.5 + t * Math.abs(t) * 0.5 * spread);
  p.y = view.h * (0.86 + Math.random() * 0.10);
  const lean = (p.x - view.w * 0.5) / Math.max(1, view.w) * 0.55;
  p.vx = -lean * up * FEEL.FIREWORK_SPEED * 0.5;
  p.vy = -up * FEEL.FIREWORK_SPEED * (0.82 + 0.36 * Math.random());
  p.r = s * FEEL.FIREWORK_SIZE * FEEL.FIREWORK_SHELL_SIZE;
  p.rot = Math.PI * 0.25;
  p.spin = 0;
  // A shell holds its speed far better than a spark does, or it never
  // gets out of the road and bursts at head height.
  p.drag = FEEL.FIREWORK_DRAG * 3;
  p.grav = up * FEEL.FIREWORK_GRAVITY * 0.40;
  p.fuse = FEEL.FIREWORK_RISE * (0.78 + 0.44 * Math.random());
  p.life = p.fuse + 0.02;                     // it never outlives its fuse
  p.fade = p.life;
  p.col = PART_FW + (Math.random() * 4 | 0);
}

/* The burst inherits the shell's colour, so a spark can be traced back to
   the streak it came from, and a share of its momentum, so the whole
   flower drifts the way the shell was going. */
function fireworkBurst(shell) {
  const s = Math.min(view.w, view.h);
  const n = Math.round(FEEL.FIREWORK_SPARKS
                       + FEEL.FIREWORK_SPARK_GAIN * finaleLevel);
  const speed = s * FEEL.FIREWORK_SPARK_SPEED;
  /* A ring rather than a scatter: evenly spaced angles with a little
     jitter is what makes a burst look like one burst instead of a cloud,
     and the radius wobble is what stops it looking like a wheel. */
  const off = Math.random() * Math.PI * 2;
  for (let i = 0; i < n; i++) {
    const p = takeParticle();
    const a = off + (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.22;
    const v = speed * (0.55 + 0.45 * Math.random());
    p.x = shell.x;
    p.y = shell.y;
    p.vx = Math.cos(a) * v + shell.vx * 0.30;
    p.vy = Math.sin(a) * v + shell.vy * 0.30;
    p.r = s * FEEL.FIREWORK_SIZE * (0.5 + 0.7 * Math.random());
    p.rot = Math.random() * Math.PI;
    p.spin = (Math.random() * 2 - 1) * 2.2;
    p.drag = FEEL.FIREWORK_DRAG;
    p.grav = s * FEEL.FIREWORK_GRAVITY;
    p.life = FEEL.FIREWORK_LIFE * (0.55 + 0.45 * Math.random());
    p.fade = FEEL.FIREWORK_LIFE;
    p.fuse = 0;
    // Mostly the shell's colour, with a few white hot ones through it.
    p.col = Math.random() < 0.18 ? PART_FW + 3 : shell.col;
  }
}

function drawDebris() {
  if (debrisCount === 0) return;
  // One batched fill per colour, the same discipline the road and the
  // tyre marks use. A pass with nothing in it costs a walk and no fill.
  for (let pass = 0; pass < PART_COLOURS; pass++) {
    let any = false;
    ctx.beginPath();
    for (let i = 0; i < debrisCount; i++) {
      const p = debris[i];
      if (p.life <= 0 || p.col !== pass) continue;
      any = true;
      const t = clamp(p.life / Math.max(0.01, p.fade), 0, 1);
      const r = p.r * (0.35 + 0.65 * t);
      // Squares rather than circles: flat shading, cut and folded from
      // paper, and four line segments beat an arc for this many pieces.
      const c = Math.cos(p.rot) * r, sn = Math.sin(p.rot) * r;
      ctx.moveTo(p.x - c + sn, p.y - sn - c);
      ctx.lineTo(p.x + c + sn, p.y + sn - c);
      ctx.lineTo(p.x + c - sn, p.y + sn + c);
      ctx.lineTo(p.x - c - sn, p.y - sn + c);
      ctx.closePath();
    }
    if (!any) continue;
    ctx.fillStyle = particleColour(pass);
    ctx.fill();
  }
}

/* Close calls, section 4.4 applied to obstacles. The gap is recorded by
   hazardBand while the car is alongside, in world units of clear air
   between the side of the car and the outside of the clip shoulder, and
   this settles up once the hazard is behind. Clipping it at any point
   during the pass disqualifies it: the reward is for the line that was
   nearly a mistake and was not one. */
function resolveCloseCalls() {
  for (let i = 0; i < hazards.length; i++) {
    const h = hazards[i];
    if (h.done || h.to >= carSegIndex) continue;
    h.done = true;
    if (h.hit || h.gap > FEEL.HAZARD_CLOSE_MARGIN) continue;
    score += FEEL.HAZARD_CLOSE_BONUS;
    audioSting(STING_CLOSE);
    sayCallout('CLOSE CALL  +' + FEEL.HAZARD_CLOSE_BONUS, CALL_CLOSE, COLOUR.HAZARD_LIP);
  }
}

/* The callouts. Each flies in a very short way, reads, and dies. The
   slide is deliberately tiny: section 7 warns that motion is the thing
   most easily overdone here, and the job is legibility not choreography.

   Both lanes go through one drawing routine and differ only in which row
   of the sky band they sit on and how big they are. */
/* WHICH MODE, AND WHAT THE GHOST IS DOING. In play, small and dim and
   always in the same place, hanging off hudBottom the way everything
   else in this stack does rather than off a fraction of the height.

   ENDLESS USED TO DRAW NOTHING, on the reasoning that there was no
   second mode to be confused with. There is now, and the consequence was
   that a player looking for the ghost had no way to tell whether they
   were in the mode that has one. Silence is not the same as "you are in
   the ordinary mode", so endless says so too.

   THE SECOND LINE IS THE ANSWER TO "WHERE IS THE GHOST". Everything the
   ghost can be doing is a state the player cannot otherwise see: daily
   only, and it is the LAST run rather than the best one, which is the
   half that decides whether the line ahead is worth trusting. Each of
   those now says itself, at the start of the run, and then gets out of
   the way. */
function modeSecondLine() {
  if (mode !== DAILY) return null;
  if (continues > 0) return 'CONTINUED RUN, IT CANNOT TAKE THE RECORD';
  if (!ghost.live) return 'NO GHOST YET, THIS RUN BECOMES ONE';
  return 'CHASING YOUR LAST RUN';
}

/* ------------------------------------------------------------------
   THE PIPS. One mark per gate, filling as they are passed.

   A COUNTER WOULD BE WORSE AND THAT IS THE WHOLE ARGUMENT. "GATE 3"
   tells the player nothing about whether there are five more or fifty,
   which is exactly the question a finite track has to answer. A row
   shows the SHAPE of the day in one look with nothing to parse, and it
   is the same glance that says how much is left.

   THE LAST PIP IS THE LINE and it is drawn wider and in the score's own
   gold, so the end of the row reads as an end rather than as one more
   of the same.

   PIPS ONLY EXIST ON THE DAILY, because endless has no end to draw. That
   makes their presence the mode indicator as well, which is the cheapest
   possible answer to the question the last session had to spend a line
   of text on.
   ------------------------------------------------------------------ */
function drawPips(w, h, y) {
  const s = Math.min(w, h);
  const n = dailyGates;
  const pip = s * FEEL.PIP_SIZE;
  const gap = s * FEEL.PIP_GAP;
  // The finish pip is wider, so the row itself has a shape.
  const lastW = pip * 1.9;
  const total = (n - 1) * (pip + gap) + lastW;
  let x = w / 2 - total / 2;
  // Measured at 0.5: three pixels tall on a 320 wide handset, which is a
  // row you can see and not a row you can count.
  const hgt = Math.max(2.5, pip * 0.60);
  for (let i = 0; i < n; i++) {
    const last = i === n - 1;
    const wdt = last ? lastW : pip;
    const done = i < gatesPassed;
    ctx.globalAlpha = done ? FEEL.PIP_ALPHA_DONE : FEEL.PIP_ALPHA_TODO;
    ctx.fillStyle = last ? COLOUR.SCORE : COLOUR.GATE;
    roundRect(x, y - hgt / 2, wdt, hgt, hgt * 0.5);
    ctx.fill();
    /* The one being driven toward, breathing. It is the only pip that
       moves and it is always the next thing to happen, so the row reads
       as a position and not only as a total. */
    if (!done && i === gatesPassed && state === DRIVING) {
      ctx.globalAlpha = 0.30 + 0.35 * Math.abs(Math.sin(runTime * 3));
      roundRect(x, y - hgt / 2, wdt, hgt, hgt * 0.5);
      ctx.fill();
    }
    x += wdt + gap;
  }
  ctx.globalAlpha = 1;
  return hgt;
}

/* WHICH TRACK THIS IS AND WHAT THE GHOST IS DOING, as a string, because
   both arrangements want the same sentence in different places: the
   portrait stack puts it under the pips, the landscape strip puts it at
   the right hand end.

   The pips carry the mode on the daily, so the word is not needed there.
   Endless has no pips, so it says so.

   ENDLESS NAMES ITSELF AND SAYS WHAT IT COSTS. The bare word was doing
   its job and was not enough: it told the player which mode they were in
   without telling them what they were missing, so somebody hunting for
   the ghost read it and carried on hunting. */
/* WHICH LEVEL, in the same words in both places it is shown, and the
   same treatment as the track number it sits beside. It is a readout and
   not a new screen: handoff section 9 and BRIEF.md section 12 both hold.

   Suppressed entirely at a count of one, because "LEVEL 1 OF 1" is a
   sentence about a system the player does not have. */
function levelLabel(lvl) {
  if (levelCount() <= 1) return '';
  return 'LEVEL ' + clampLevel(lvl) + '/' + levelCount();
}

function modeLine() {
  if (mode !== DAILY) {
    return { line: 'RANDOM TRACK   NO FINISH, NO GHOST', colour: COLOUR.TEXT };
  }
  const bits = ['TRACK #' + trackNumber(todayStamp)];
  const lv = levelLabel(level);
  if (lv) bits.push(lv);
  if (dailyBest > 0) bits.push('BEST ' + dailyBest);
  let line = bits.join('   ');
  if (continues > 0) line += '   CONTINUED';
  else if (ghost.live) line += '   ' + ghostGapLabel();
  return { line: line, colour: COLOUR.GATE };
}

function drawModeMark(w, h) {
  /* WHILE DRIVING ONLY. The death screen says all of this in its own
     records line, and drawing both put two lines of teal on top of each
     other at the top of that screen. */
  if (state !== DRIVING) return;
  const s = Math.min(w, h);
  const bar = hudIsBar(w, h);
  const y = hudBottom + s * 0.026;
  const info = modeLine();
  const line = info.line, colour = info.colour;
  let below = y;

  /* IN LANDSCAPE THE PIPS AND THE TRACK LINE ARE ALREADY IN THE STRIP,
     so all that is left here is the opening note, which is a sentence
     rather than a readout and is gone after a few seconds. It sits under
     the strip for those seconds and the steady state is still one row. */
  if (bar) {
    const second = modeSecondLine();
    if (second && runTime < FEEL.MODE_NOTE_SECONDS) {
      const fade = clamp((FEEL.MODE_NOTE_SECONDS - runTime) / 0.8, 0, 1);
      ctx.globalAlpha = 0.42 * fade;
      text(second, w / 2, y,
           fittedSize(second, '700', Math.round(s * 0.023), w * 0.9), '700',
           'center', continues > 0 ? COLOUR.SCORE : colour);
      ctx.globalAlpha = 1;
    }
    return;
  }
  if (mode === DAILY) {
    drawPips(w, h, y);
    below = y + s * 0.028;
  }
  ctx.globalAlpha = 0.42;
  text(line, w / 2, below, fittedSize(line, '700', Math.round(s * 0.026), w * 0.85),
       '700', 'center', colour);

  /* Once, at the start of the run, then gone. It is the one thing here
     that is a sentence rather than a readout, and a sentence that stays
     on screen becomes furniture and stops being read. */
  const second = modeSecondLine();
  if (second && runTime < FEEL.MODE_NOTE_SECONDS) {
    const fade = clamp((FEEL.MODE_NOTE_SECONDS - runTime) / 0.8, 0, 1);
    ctx.globalAlpha = 0.42 * fade;
    text(second, w / 2, below + s * 0.032,
         fittedSize(second, '700', Math.round(s * 0.023), w * 0.9), '700',
         'center', continues > 0 ? COLOUR.SCORE : colour);
  }
  ctx.globalAlpha = 1;
}

/* Where you stand against the ghost, in seconds, which is the only unit
   a driver thinks in. It is here rather than only in the callouts
   because the ghost spends most of a run outside the draw distance: the
   callouts say when you pass it, this says where it is the rest of the
   time. */
function ghostGapLabel() {
  if (runTime >= ghost.t[ghost.n - 1]) return 'GHOST OUTLASTED';
  const gap = (position - ghost.pos) / FEEL.SPEED;
  if (Math.abs(gap) < 0.05) return 'GHOST LEVEL';
  return 'GHOST ' + (gap > 0 ? '+' : '') + gap.toFixed(1) + 's';
}

function drawCallout(w, h) {
  drawLane(w, h, calloutText, calloutColour, calloutLife, calloutSide,
           FEEL.CALLOUT_ROW_EVENT, 1);
  drawLane(w, h, driftText, driftColour, driftLife, driftSide,
           FEEL.CALLOUT_ROW_DRIFT, driftSize);
}

function drawLane(w, h, str, colour, life, side, row, scale) {
  if (life <= 0) return;
  const s = Math.min(w, h);
  const t = 1 - life / FEEL.CALLOUT_TIME;             // 0 at birth, 1 at death
  let alpha = 1, slide = 0;
  if (t < FEEL.CALLOUT_IN) {
    const u = t / FEEL.CALLOUT_IN;
    alpha = u;
    slide = (1 - u) * w * FEEL.CALLOUT_SLIDE;
  } else if (t > 1 - FEEL.CALLOUT_OUT) {
    alpha = (1 - t) / FEEL.CALLOUT_OUT;
  }
  /* The band of sky between the bottom of the HUD stack and the horizon.
     Both ends are measured rather than assumed, so it holds in portrait
     and in landscape, and it is never over road: everything above the
     horizon line is sky by construction. The two lanes take fixed shares
     of that band, so they cannot collide however tall it is. */
  const top = hudBottom + s * FEEL.CALLOUT_GAP_TOP;
  const bottom = horizonY - s * FEEL.CALLOUT_RISE;
  const y = bottom > top ? top + (bottom - top) * row : top;
  /* Sized to fit and then clamped on screen. Offset to the side plus a
     long string plus a narrow handset runs the text off the edge, and a
     callout that cannot be read has cost clutter and bought nothing. */
  const size = fittedSize(str, '800', Math.round(s * FEEL.CALLOUT_SIZE * scale),
                          w * FEEL.CALLOUT_MAX_WIDTH);
  ctx.font = '800 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const half = ctx.measureText(str).width / 2;
  const edge = s * FEEL.CALLOUT_GAP_TOP;
  let x = w / 2 + side * (w * FEEL.CALLOUT_SIDE + slide);
  x = clamp(x, half + edge, w - half - edge);
  ctx.globalAlpha = alpha;
  text(str, x, y, size, '800', 'center', colour);
  ctx.globalAlpha = 1;
}

/* The two full screen washes, both short and both capped low. They are
   the only things in the game that cover the road, so they are the ones
   that get checked hardest against hard limit two. */
function drawSpectacleFlash(w, h) {
  if (gateFlash2 > 0) {
    const u = gateFlash2 / FEEL.CHECKPOINT_FLASH;
    ctx.globalAlpha = FEEL.GATE_FLASH_ALPHA * u * u;
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillRect(0, 0, w, h);
    // The posts sweeping past, which is what a gate crossing looks like
    // from inside the car.
    const bar = w * FEEL.GATE_BAR_WIDTH;
    ctx.globalAlpha = FEEL.GATE_FLASH_ALPHA * u;
    ctx.fillRect(0, 0, bar * (0.4 + u), h);
    ctx.fillRect(w - bar * (0.4 + u), 0, bar * (0.4 + u), h);
    ctx.globalAlpha = 1;
  }
  if (beatFlash > 0) {
    const u = beatFlash / FEEL.BEST_FLASH_TIME;
    ctx.globalAlpha = FEEL.BEST_FLASH_ALPHA * u * u;
    ctx.fillStyle = COLOUR.SCORE_BEST;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
  if (resumeFlash > 0) {
    const u = resumeFlash / FEEL.RESUME_FLASH_TIME;
    ctx.globalAlpha = FEEL.GATE_FLASH_ALPHA * u * u;
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
  if (explodeFlash > 0) {
    const u = explodeFlash / FEEL.EXPLODE_FLASH_TIME;
    ctx.globalAlpha = FEEL.EXPLODE_FLASH_ALPHA * u * u;
    ctx.fillStyle = COLOUR.HAZARD_LIP;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
  /* THE LINE. The score's own gold rather than the crash's red, because
     this is the opposite outcome and the colour is the fastest thing
     about it to read. Squared, like the others, so it is a flash that
     falls away rather than a fade. */
  if (finaleFlash > 0) {
    const u = finaleFlash / Math.max(0.01, FEEL.FINALE_FLASH_TIME);
    ctx.globalAlpha = FEEL.FINALE_FLASH_ALPHA * u * u;
    ctx.fillStyle = COLOUR.SCORE_BEST;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
}

let barShow = 0;
function updateBar(dt) {
  const wanted = state === DRIVING && scrapeRisk > 0.01 ? 1 : 0;
  if (wanted) barShow = 1;
  else barShow = Math.max(0, barShow - dt / FEEL.BAR_FADE_TIME);
}

function drawBar(w, h) {
  if (barShow <= 0) return;
  const left = 1 - scrapeRisk;
  const bw2 = w * FEEL.BAR_WIDTH;
  const bh2 = FEEL.BAR_HEIGHT;
  const x = (w - bw2) / 2;
  const y = h - safeBottom - FEEL.BAR_BOTTOM - bh2;

  ctx.globalAlpha = barShow * FEEL.BAR_ALPHA;
  ctx.fillStyle = COLOUR.BAR_TRACK;
  ctx.fillRect(x, y, bw2, bh2);
  // Cool while there is room, warm as it runs out, which is the same thing
  // the edge flash is saying at the same moment.
  ctx.fillStyle = left < 0.35 ? COLOUR.BAR_LOW : COLOUR.BAR_FILL;
  ctx.fillRect(x, y, bw2 * left, bh2);
  ctx.globalAlpha = 1;
}

/* The debug readout. Everything needed to report a camera back sits on
   one line, so a screenshot is a complete answer. */
function drawHud(w, h) {
  if (!showDebug) return;
  const pad = 10;
  let lines = [
    fpsShown.toFixed(0) + ' fps   worst ' + fpsWorstShown.toFixed(1) + ' ms'
      + (tunerDirty() ? '   TUNED' : ''),
    tunerLine(0),
    tunerLine(1),
    tunerLine(2),
    tunerLine(3),
    tunerLine(4),
    tunerLine(5),
    tunerLine(6),
    tunerLine(7),
    tunerLine(8),
    tunerLine(9),
    tunerLine(10),
    tunerLine(11),
    tunerLine(12),
    tunerLine(13),
    tunerLine(14),
    tunerLine(15),
    tunerLine(16),
    tunerLine(17),
    tunerLine(18),
    tunerLine(19),
    tunerLine(20),
    tunerLine(21),
    tunerLine(22),
    /* 23 to 26 were added in the last two sessions and never listed here,
       so the jump, biome and ghost groups could be cycled to and tuned
       but never read. A cycler with an invisible group is a cycler that
       lies about what is selected. */
    tunerLine(23),
    tunerLine(24),
    tunerLine(25),
    tunerLine(26),
    tunerLine(27),
    tunerLine(28),
    'slip ' + drift.slipDeg.toFixed(0) + '°  edge ' + (scrapeRisk * 100).toFixed(0)
      + '%  ' + (seedPinned ? 'seed ' + lastSeed : 'seed free'),
    't ' + runTime.toFixed(0) + 's  live curve ' + curveScale.toFixed(2)
      + '  width ' + widthScale.toFixed(2) + '  int ' + maxIntensity()
      + '  runs ' + runsEver + (firstRunEase() ? ' EASED' : ''),
    (mode === DAILY ? 'DAILY ' + todayStamp + ' seed ' + dailySeed() : 'endless')
      + '  today ' + dailyBest
      + '  ghost ' + (ghost.live ? ghost.n + ' pts ' + dailyGhostBytes + 'B' : 'none')
      + (ghostRec.live ? '  REC ' + ghostRec.n : '')
      + (ghost.shown ? '  gap ' + Math.round((ghost.pos - position) / 100) + 'm' : '')
  ];
  /* Sized to fit AND wrapped, because the readout gains values most
     sessions and a line that runs off the side of a phone is a line that
     cannot be read at the moment it is needed. Shrinking alone stopped
     being enough: it is clamped at eight pixels, and the spectacle
     session took several groups past what eight pixels could hold, so
     anything still too wide is now folded at a space instead of being
     cut off. Continuation lines are indented so a fold cannot be
     mistaken for a new group. */
  const pad2 = pad * 2 + 10;
  let size = 13;
  const font = s => '600 ' + s + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.font = font(size);
  const room = w - pad2;
  let widest = 0;
  for (let i = 0; i < lines.length; i++) {
    const tw = ctx.measureText(lines[i]).width;
    if (tw > widest) widest = tw;
  }
  if (widest > room) {
    size = Math.max(8, Math.floor(size * room / widest));
    ctx.font = font(size);
  }
  const wrapped = [];
  for (let i = 0; i < lines.length; i++) {
    /* Every tuner line begins with the cursor column, which is a space on
       all but one of them, so the search for a fold point starts at index
       one. Starting at zero finds that leading space, measures an empty
       string, and quietly decides the line already fits. */
    let rest = lines[i];
    let lead = '';
    for (;;) {
      if (ctx.measureText(lead + rest).width <= room) break;
      let cut = -1;
      for (let k = rest.indexOf(' ', 1); k > 0; k = rest.indexOf(' ', k + 1)) {
        if (ctx.measureText(lead + rest.slice(0, k)).width > room) break;
        cut = k;
      }
      if (cut <= 0) break;
      wrapped.push(lead + rest.slice(0, cut));
      // The groups are separated by two spaces, so skip whatever run of
      // them the fold landed on rather than starting the next line on one.
      while (cut < rest.length && rest.charAt(cut) === ' ') cut++;
      rest = rest.slice(cut);
      lead = '   ';
    }
    wrapped.push(lead + rest);
  }
  lines = wrapped;
  widest = 0;
  for (let i = 0; i < lines.length; i++) {
    const tw = ctx.measureText(lines[i]).width;
    if (tw > widest) widest = tw;
  }
  const lineH = Math.round(size * 1.38);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  const top = hudTop;
  ctx.fillStyle = 'rgba(26,10,4,0.66)';
  ctx.fillRect(pad - 5, top - 4, widest + 10, lines.length * lineH + 8);
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], pad, top + i * lineH);
  }
}

function render() {
  const w = view.w, h = view.h;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);

  /* THE CAMERA FOLLOWS THE CAR UP, damped, and only ever partly. camLift
     is the fraction of the rise the camera cancels, so the conversion to
     a camera height has to undo the projection's anisotropy: a world
     height lands on screen through w/2 and the camera's height through
     h/2. Raising the camera pushes the whole world down the screen, which
     is what sells the height; the car still climbs the part the camera
     does not take, so it never leaves the frame either. */
  // Clamped at zero because carY also carries the death fall, and the
  // camera must not chase a car that is dropping into the void.
  camHeight = FEEL.CAMERA_HEIGHT + camLift * Math.max(0, carY) * (w / h);

  ctx.save();
  ctx.translate(shakeX, shakeY);

  /* Everything shakes together. There is no ground any more, so the void
     is the whole background and the road is an object floating in it. */
  ctx.fillStyle = COLOUR.VOID;
  ctx.fillRect(-40, -40, w + 80, h + 80);

  const glow = h * FEEL.HORIZON_GLOW_FRACTION;
  ctx.fillStyle = horizonGradient;
  ctx.fillRect(-40, horizonY - glow, w + 80, glow * 2);
  /* The horizon deepening with the multiplier. A second pass of the band
     that is already cached rather than a rebuilt gradient, so it costs
     one fill and nothing else.

     ONLY THE HALF ABOVE THE HORIZON LINE, and that is hard limit two
     holding. The road converges to the horizon from BELOW, so the lower
     half of this band sits directly behind the far road: deepening it
     there lit the void without lighting the road, and the surface against
     void contrast between 1.7 and 3.3 seconds out, which is the planning
     horizon section 4.3 is about, fell from a difference of 0.4 to one of
     4.8 the wrong way. Above the line is sky and only sky, so the glow
     can swell as much as it likes there and the road cannot lose by it. */
  if (worldHeat > 0.01 || finaleSky > 0.01) {
    ctx.globalAlpha = Math.min(1, FEEL.HEAT_HORIZON * worldHeat
                                  + FEEL.FINALE_HORIZON * finaleSky
                                  + FEEL.FINALE_STROBE_HORIZON * strobe2());
    ctx.fillRect(-40, horizonY - glow, w + 80, glow);
    ctx.globalAlpha = 1;
  }
  /* AND THE CITY LIGHTS THE SKY, item 6. A third fill of the same cached
     band, keyed to cityGlow rather than to the multiplier, so the sky
     over the city has a source rather than being a glow that happens to
     be there. One fillRect, no new gradient, no new state.

     THE UPPER HALF ONLY, exactly as the pass above it. See
     CITY_HALO_ALPHA: the lower half of this band is the void directly
     behind the far road, and the file has already measured what
     deepening it costs the planning horizon. */
  if (cityGlow > 0.01) {
    ctx.globalAlpha = Math.min(1, FEEL.CITY_HALO_ALPHA * cityGlow);
    ctx.fillRect(-40, horizonY - glow, w + 80, glow);
    ctx.globalAlpha = 1;
  }

  drawSkyline(w, h);
  drawGrid(w, h);
  drawRoad(w, h);
  ctx.fillStyle = hazeGradient;
  ctx.fillRect(-40, horizonY - 1, w + 80, h * FEEL.HORIZON_FADE_FRACTION + 2);
  drawSmoke();
  drawCar(w, h);
  drawDebris();
  ctx.restore();

  drawScrapeFlash(w, h);
  drawSpectacleFlash(w, h);
  drawBar(w, h);
  // The score first, because the callout measures itself against the
  // bottom of the HUD stack and the clock is what sets it.
  drawScore(w, h);
  drawModeMark(w, h);
  drawCallout(w, h);
  drawOverlay(w, h);
  drawPauseCover(w, h);
  /* Over the pause cover, because the gesture keeps running while the
     game does not and a prompt hidden behind the cover would be a prompt
     nobody answers. Under the boot credit, which owns the first second
     of the page outright. */
  drawTiltCal(w, h);
  // After the calibration, which is the thing this hint exists to get
  // somebody to, and which owns the screen once it is running.
  drawTiltHint(w, h);
  drawTuneName(w, h);
  /* Both lockups and the fine print are DOM, so the frame ends by making
     the document agree with what was just drawn rather than by drawing
     them. None of the three writes anything unless something changed. */
  syncBoot();
  syncCredit();
  syncMore();
  drawHud(w, h);
}

/* ------------------------------------------------------------------
   THE CALIBRATION PROMPT. An arrow, two words and a line of state, sat
   in the band above the pads where nothing else lives.

   IT IS NOT A SCREEN. No cover, no dimming, no dismissal: the game is
   still there behind it and still fully playable on touch and keys. That
   is deliberate, because a modal here would be the settings screen
   section 12 forbids wearing a different hat.

   The arrow points LEFT because left is what is being asked for, and it
   is the whole instruction. The two words underneath are for anybody who
   does not read an arrow as an instruction, which on a first ever visit
   is most people.
   ------------------------------------------------------------------ */
function drawTiltCal(w, h) {
  if (tiltCal.phase === CAL_OFF) return;
  const s = Math.min(w, h);
  const y = h - safeBottom - FEEL.DEATH_BOTTOM - s * 0.10;

  if (tiltCal.phase === CAL_DONE) {
    const line = tiltCal.ok ? 'TILT SET' : 'KEEPING THE DEFAULT';
    ctx.globalAlpha = clamp(tiltCal.said, 0, 1);
    text(line, w / 2, y, fittedSize(line, '800', Math.round(s * 0.05), w * 0.8),
         '800', 'center', tiltCal.ok ? COLOUR.GATE : COLOUR.TEXT);
    ctx.globalAlpha = 1;
    return;
  }

  const reading = tiltCal.phase === CAL_READ;
  /* The arrow only wakes up once the posture has settled, so the two
     phases are told apart without a word: hold still, then move. */
  const pulse = reading ? 0.55 + 0.45 * Math.abs(Math.sin(tiltCal.waited * 4)) : 0.3;
  const a = s * 0.068;
  const cx = w / 2, cy = y - s * 0.055;
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = COLOUR.GATE;
  ctx.lineWidth = Math.max(4, s * 0.015);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + a * 0.85, cy - a * 0.6);
  ctx.lineTo(cx - a * 0.55, cy);
  ctx.lineTo(cx + a * 0.85, cy + a * 0.6);
  ctx.stroke();
  ctx.globalAlpha = 1;

  const line = reading ? 'TILT LEFT' : 'HOLD STILL';
  text(line, w / 2, y + s * 0.030,
       fittedSize(line, '800', Math.round(s * 0.055), w * 0.8), '800',
       'center', COLOUR.GATE);
  ctx.globalAlpha = 0.55;
  const sub = 'hold the phone how you want to play     tap to skip';
  text(sub, w / 2, y + s * 0.072,
       fittedSize(sub, '600', Math.round(s * 0.028), w * 0.9), '600');
  ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------------
   THE TRACK'S NAME, briefly, when one starts.

   These are original tracks and saying so is the point of having them.
   Small, quiet, in the same dim treatment the other secondary lines on
   this screen use, low on the LEFT so it is nowhere near the drift lane,
   the checkpoint lane or the road ahead. It fades rather than cutting.
   ------------------------------------------------------------------ */
function drawTuneName(w, h) {
  if (tune.nameLife <= 0 || !tune.nameText) return;
  if (state !== DRIVING || paused) return;
  const s = Math.min(w, h);
  const a = Math.min(1, tune.nameLife / Math.max(0.05, FEEL.TUNE_NAME_FADE))
          * FEEL.TUNE_NAME_ALPHA;
  const size = Math.round(s * FEEL.TUNE_NAME_SIZE);
  const line = '\u266a  ' + tune.nameText;
  const x = Math.max(w * 0.04, s * 0.04);
  ctx.globalAlpha = a;
  text(line, x, padsTop - size * 1.9, size, '700', 'left', COLOUR.TITLE_DIM);
  ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------------
   TILT TO STEER, AND IT IS THE SAME HINT THE RING ALREADY WAS.

   Nobody guesses that a phone steers by tilting, or that one of four
   identical circles turns it on. The ring says something is here; it
   cannot say what. So the timer TILT_HINT_SECONDS already runs now also
   draws three words and a pointer, and the two halves do different jobs:
   THE WORDS EXPLAIN, THE RING LOCATES. Neither is a second mechanism and
   neither can outlive the other, because there is one clock.

   IT IS NOT A TUTORIAL AND SECTION 5 STILL STANDS. Nothing is modal,
   nothing is dismissed, nothing waits for it, and the game is fully
   playable on touch and keys for the whole ten seconds. It exists
   because tilt is a DISCOVERY problem rather than a comprehension one:
   an invisible option behind an unlabelled button. Dying still teaches
   the edges and the numbers still teach the scoring.

   WHERE IT SITS. In the band the pads already own, right of centre, hard
   against the tilt button and pointing down at it. Never over the road
   ahead, which is the rule everything else in this game obeys.
   ------------------------------------------------------------------ */
function drawTiltHint(w, h) {
  const a = tiltHintAlpha();
  if (a <= 0) return;
  const s = Math.min(w, h);
  const size = Math.round(s * FEEL.TILT_HINT_SIZE);
  const reach = size * FEEL.TILT_HINT_ARROW;

  /* The pointer bobs toward the button. A static arrow is a diagram; one
     that moves is a gesture, and it is the same trick the calibration's
     own arrow uses one screen later. */
  const bob = Math.sin(runTime * FEEL.TILT_HINT_BOB_HZ * Math.PI * 2)
            * reach * FEEL.TILT_HINT_BOB;
  const tipY = tiltPad.top - size * FEEL.TILT_HINT_GAP + bob;
  const line = 'TILT TO STEER';
  const sub = 'tap here to turn it on';
  const subSize = Math.round(size * FEEL.TILT_HINT_SUB);

  /* Right aligned to the button's own right edge and pushed back inside
     the screen if the phone is too narrow to hold it there. Aligning to
     the BUTTON rather than to the screen is what keeps the words and the
     pointer reading as one object.

     BOTH LINES FIT, and the WIDER of the two is what the fit is measured
     against, or the headline shrinks to fit and the sentence under it
     runs off the side. */
  ctx.font = '900 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  let wide = ctx.measureText(line).width;
  ctx.font = '700 ' + subSize + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  wide = Math.max(wide, ctx.measureText(sub).width);
  const pad = size * 0.4;
  let right = tiltPad.cx + tiltPad.w / 2;
  if (right - wide < pad) right = Math.min(w - pad, wide + pad);

  ctx.globalAlpha = a;
  const headY = tipY - reach - subSize - size * 0.62;
  text(line, right, headY, size, '900', 'right', COLOUR.GATE);

  /* AND THE SENTENCE UNDER IT, because testers kept failing to find the
     button and a pointer alone was not saying enough. "TILT TO STEER" is
     a claim about the phone; this is the instruction that follows from
     it, and between them they say the two things somebody who has never
     seen this needs: that tilting works, and what to press. */
  ctx.globalAlpha = a * FEEL.TILT_HINT_SUB_ALPHA;
  text(sub, right, tipY - reach - subSize * 0.45, subSize, '700', 'right',
       COLOUR.TEXT);
  ctx.globalAlpha = a;

  // And the pointer, from under the words down at the button itself.
  ctx.strokeStyle = COLOUR.GATE;
  ctx.lineWidth = Math.max(3, size * 0.13);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(tiltPad.cx, tipY - reach);
  ctx.lineTo(tiltPad.cx, tipY);
  ctx.moveTo(tiltPad.cx - reach * 0.52, tipY - reach * 0.5);
  ctx.lineTo(tiltPad.cx, tipY);
  ctx.lineTo(tiltPad.cx + reach * 0.52, tipY - reach * 0.5);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

/* The cover. Opaque, over everything except the debug readout, because
   leaving the road visible turns the pause into a free look at the corner
   ahead. */
/* ==================================================================
   THE WAY BACK, AND WHY IT IS ON THE PAUSE OVERLAY.

   Once you are in the daily there has to be a way out of it, and there
   are only three places it could go.

   NOT THE DEATH SCREEN. That is the one action restart from section 5
   and it stays one action: the reflex tap continues or restarts, and it
   is never a question. Putting a mode choice there would make the loop
   that the whole game hangs off into a decision.

   NOT THE TITLE SCREEN ALONE, because you only get back to it by
   reloading, which is the problem being solved.

   PAUSE. It is already a deliberate action, it is already off the
   restart path, and it already obscures the view, so nothing is being
   given up. Section 12 forbids menus and this is not one: it is a single
   button on a screen that already exists, and nothing is ever asked of
   a player who does not press pause.
   ================================================================== */
const modeRect = { x: 0, y: 0, w: 0, h: 0, live: false };

function drawPauseCover(w, h) {
  modeRect.live = false;
  if (!paused) return;
  ctx.fillStyle = COLOUR.PAUSE_COVER;
  ctx.fillRect(0, 0, w, h);
  const s = Math.min(w, h);
  text('PAUSED', w / 2, h * 0.44, Math.round(s * 0.11), '800');
  text('tap to resume', w / 2, h * 0.53, Math.round(s * 0.045), '600');

  /* Anchored to the bottom edge, exactly where RESTART sits on the death
     screen and where TODAY'S TRACK sits on the title screen. Three canvas
     buttons, one place: a player who has met one already knows the next. */
  const daily = mode === DAILY;
  const label = daily ? 'SWITCH TO A RANDOM TRACK' : "SWITCH TO TODAY'S TRACK";
  const size = Math.round(s * 0.038);
  ctx.font = '800 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const bw = ctx.measureText(label).width + size * 2.2;
  const bh = size * 2.2;
  const by0 = h - safeBottom - FEEL.DEATH_BOTTOM;
  modeRect.x = w / 2 - bw / 2;
  modeRect.y = by0 - bh / 2;
  modeRect.w = bw;
  modeRect.h = bh;
  modeRect.live = true;

  // It starts a fresh run, so say so. Switching mid run cannot mean
  // anything else: the road under the car belongs to the mode it is in.
  ctx.globalAlpha = 0.6;
  text('starts a new run', w / 2, by0 - bh * 0.95,
       Math.round(s * 0.030), '700');
  ctx.globalAlpha = 1;

  ctx.globalAlpha = 0.9;
  ctx.fillStyle = COLOUR.BAR_TRACK;
  roundRect(modeRect.x, modeRect.y, bw, bh, bh * 0.3);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = daily ? COLOUR.SCORE : COLOUR.GATE;
  ctx.stroke();
  ctx.globalAlpha = 1;
  text(label, w / 2, by0, size, '800', 'center', daily ? COLOUR.SCORE : COLOUR.GATE);
}

function hitMode(e) {
  if (!modeRect.live || !paused) return false;
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  return x >= modeRect.x && x <= modeRect.x + modeRect.w
      && y >= modeRect.y && y <= modeRect.y + modeRect.h;
}

function switchMode() {
  mode = mode === DAILY ? ENDLESS : DAILY;
  setPaused(false);
  startRun();
}


/* ==================================================================
   AUDIO

   Synthesised in full: three oscillators, one generated noise buffer,
   and a fixed graph of filters and gains. No fetch, no decodeAudioData,
   no sample data anywhere in this file. Section 6 again: one blocked
   request is a broken game for this audience.

   The graph is built once, on the gesture that picks a station, and then
   never grows. Nothing is created or destroyed per note, per skid or per
   crash: notes are a frequency step and an envelope on a voice that is
   already running, and the skid is a single looping noise source whose
   filter is steered. That is what keeps the per frame cost flat, and it
   is also what makes the skid sound like a tyre rather than like a sound
   effect being retriggered.

   ON by default, which overrules sections 5 and 6. That was a deliberate
   call and not an oversight, and it comes with the mitigations that make
   it survivable for a classroom:

     nothing is built or heard until the first gesture, which is what the
     browser enforces anyway, so the graph is created inside that gesture
     and starts unlocked rather than fighting the policy;

     the first start fades from silence over AUDIO_FIRST_FADE rather than
     arriving at level;

     the mute pad is on screen and one tap away from the very first frame,
     not behind a start screen or a menu;

     and the choice is stored, so anyone who mutes once is never surprised
     again on any later visit.

   The dial still exists, but it now picks between tracks rather than
   between silence and sound.
   ================================================================== */

/* Three states, cycled by one button, in this order. The dial that used
   to sit on the splash screen is gone: it was a menu on the way into a
   game whose whole pitch is that there is nothing between you and the
   road, and one button says the same thing in less space.

   TYRES rather than NEON is the default, and that is the classroom
   argument from section 6 taken seriously. The skid is quiet, textural
   and is most of what makes the drift read; music is unmistakably a game
   from across a room and is what gets somebody caught. Anyone who wants
   music is one tap away and their choice is remembered. */
const TRACKS = [
  { id: 'neon',
    // A natural minor run, and a saw.
    wave: 'sawtooth', root: 55, tempo: 1,
    arp: [0, 3, 7, 10, 12, 10, 7, 3], bass: [0, 0, 7, 0, 10, 0, 7, 5] }
];

/* ==================================================================
   THE RECORDED MUSIC.

   Four original tracks, played in order, looping back to the first. The
   titles are HERE, in one place, so putting the real ones in is a data
   change: they are shown on screen when a track starts and that is the
   whole point of having them.

   THE PATH IS RELATIVE, so this works from a filesystem, from a static
   host and from a phone, which is what section 1 asks for. It is the
   same origin as the HTML: the same kind of request that fetched the
   page, which is why it is not the class of thing section 6 forbids. */
const TUNES = [
  { file: 'music/track-1.m4a', name: 'TRACK ONE' },
  { file: 'music/track-2.m4a', name: 'TRACK TWO' },
  { file: 'music/track-3.m4a', name: 'TRACK THREE' },
  { file: 'music/track-4.m4a', name: 'TRACK FOUR' }
];

/* TWO ELEMENTS, NOT ONE, because a crossfade needs both tracks audible
   at once and an element can only be in one place at a time. They swap
   roles every change: whichever is playing is `live`, the other is the
   one being faded out or the one being got ready.

   A MediaElementAudioSourceNode may be created ONCE per element, ever,
   so the pair is built at the same moment as the rest of the graph and
   nothing is ever rebuilt. */
const tune = {
  el: [null, null],       // the two HTMLAudioElements
  src: [null, null],      // their MediaElementAudioSourceNodes
  g: [null, null],        // and each one's own gain
  live: 0,                // which side is the one playing
  /* THE FADE LIVES HERE, not in the gain node. updateMusic writes the
     live side's gain every frame with a short follow, so a slow ramp set
     once at play() was overwritten inside a frame and the two second
     fade in measured a quarter of a second. These are the envelope;
     updateMusic multiplies by them and cannot fight them. */
  lvl: [0, 0],            // where each side actually is, 0 to 1
  want: [0, 0],           // where it is heading
  rate: [1, 1],           // and how fast, in units a second
  index: -1,              // which TUNES entry is on the live side
  loaded: -1,             // which TUNES entry the idle side has been given
  pending: -1,            // and one waiting for the outgoing track to finish
  wired: false,           // are the elements inside the audio graph yet
  playing: false,
  failed: false,          // not using recorded music RIGHT NOW, see tuneFailed
  begun: false,           // has this track ever actually produced a sample
  waited: 0,              // seconds since play() was asked for, while not begun
  frozen: 0,              // seconds playback has been stopped AFTER beginning
  tries: 0,               // how many times a failure has been retried
  retryIn: 0,             // seconds until the next retry is allowed
  nameLife: 0,            // seconds left on the on screen title
  nameText: '',
  lastTime: -1
};

/* THE ELEMENTS ARE MADE AT THE TITLE SCREEN AND NOT ONE MOMENT EARLIER.
   Creating them is what starts the download, so this is the line that
   section 6's exception actually turns on, and it is called from exactly
   one place. */
function tuneWake() {
  /* AND NOT AT ALL FOR SOMEBODY WHO HAS MUTED. Being remembered has to
     mean the download does not happen either, or a muted player on a
     school connection still pays for music they will never hear. */
  if (!musicOn) return;
  if (tune.el[0] || tune.failed) return;
  for (let i = 0; i < 2; i++) {
    let el;
    try { el = new Audio(); } catch (e) { tune.failed = true; return; }
    el.preload = 'auto';
    /* NO crossOrigin. It was set to 'anonymous' at first and it broke
       running from a filesystem outright: the attribute forces a CORS
       check, and file:// cannot satisfy one, so every track failed with
       "Cross origin requests are only supported for protocol schemes"
       and the game fell back to the procedural music for anybody opening
       the HTML directly. Section 1 says this runs from a filesystem, a
       static host or a phone, and it does.

       Nothing is lost. The attribute exists so that a CROSS origin
       media element can still be read by Web Audio, and these are same
       origin by construction: a relative path, alongside the HTML. */
    el.loop = false;
    /* Muted at the ELEMENT is wrong: it would mute the graph tap as
       well. The gain nodes are the volume and these stay at one. */
    el.volume = 1;
    el.addEventListener('error', function () { tuneFailed('error event'); });
    /* THE ELEMENT'S OWN "I AM READY" SIGNAL, and it is what makes a
       revive stick. play() asked for on an element whose load() was
       called a microsecond earlier does not always take, so rather than
       poll for it, the element is asked again at the moment it says it
       has data. Same principle as the rest of this: use the signals,
       do not infer from a clock. */
    el.addEventListener('canplay', function () {
      if (!tune.playing || tune.failed || tune.begun) return;
      if (tune.el[tune.live] !== el) return;
      try { const q = el.play(); if (q && q.catch) q.catch(function () {}); }
      catch (e) {}
    });
    tune.el[i] = el;
  }
  tuneLoad(1 - tune.live, 0);        // track one, onto the idle side
  /* AND INTO THE GRAPH, IF THE GRAPH GOT HERE FIRST. This is the line
     that was missing and it cost every player who taps.

     There are exactly two things that have to meet: the elements, made
     here, and the audio graph, made by the first gesture. Either can
     happen first. buildAudio already calls tuneWire, which covers the
     elements arriving first. Nothing covered the graph arriving first,
     because tuneWire begins `if (tune.wired || !tune.el[0]) return` and
     that is a silent no.

     AND THE GRAPH ARRIVES FIRST FOR ANYBODY WHO TAPS. The boot splash
     owns the first seconds of the page and tuneWake is only reached
     once it has finished; a tap SKIPS the splash, and that same tap is
     the gesture that builds the graph. So the tap that gets a player to
     the title screen quickly is the tap that guarantees them silence:
     wired stayed false for the whole session, tuneStart returned on it
     every run, and nothing failed, so tuneRevive, which carries the only
     other wiring line in the file, never ran either. Measured: tap
     within the splash and the music never starts; let the splash end on
     its own and it plays. That is the whole bug. */
  if (!tune.wired && audio) tuneWire(audio);
}

/* ------------------------------------------------------------------
   WHAT COUNTS AS A FAILURE, AND WHAT IS JUST SLOW.

   THIS WAS WRONG AND IT WAS THE BUG THE AUTHOR HIT. The detector counted
   seconds in which el.currentTime did not advance and gave up after
   twelve of them. A track that is still DOWNLOADING also has a
   currentTime that is not advancing, so the detector could not tell "on
   its way" from "never coming", and twelve seconds into a first run it
   threw away a perfectly healthy file and handed over to the procedural
   track for the rest of the session. Toggling the music button rebuilt
   it by which time the download had finished, which is exactly the
   symptom reported: the wrong music on a first run, the right music
   after a toggle.

   WAITING IS NOT FAILING. The two states are told apart by the ELEMENT'S
   OWN SIGNALS now, not inferred from a clock:

     A REAL FAILURE is an `error` event, or networkState NO_SOURCE, which
     is the browser saying it looked and there is nothing there.
     A SLOW START is readyState below HAVE_CURRENT_DATA with no error.
     It can take as long as it likes. The run is already under way and
     the music joins when it arrives.
     A FREEZE AFTER PLAYBACK BEGAN is a rebuffer. It waits too, and it
     retries play(), because the one thing that genuinely can leave an
     element silent for ever is a play() promise that was rejected.
   ------------------------------------------------------------------ */
const NET_NO_SOURCE = 3;          // HTMLMediaElement.NETWORK_NO_SOURCE

/* AND THERE IS A ROUTE BACK. A blocked network is a fact about a moment,
   not about a session: a school wifi that dropped one request will serve
   the next one, and the author should not have to reload to get the real
   music back. Each new run retries, after a backoff that doubles, up to
   TUNE_RETRIES times, so a genuinely dead fetch stops costing anything
   quickly and a hiccup costs one run. */
function tuneFailed(reason) {
  if (tune.failed) return;
  tune.failed = true;
  tune.playing = false;
  tune.begun = false;
  tune.reason = reason || 'error';
  tune.retryIn = FEEL.TUNE_RETRY_AFTER * Math.pow(2, tune.tries);
  for (let i = 0; i < 2; i++) {
    const el = tune.el[i];
    if (el) { try { el.pause(); } catch (e) {} }
  }
}

/* The way back in. Everything about the pair is thrown away and rebuilt,
   because an element that failed keeps its error and will not try again
   on its own. The MediaElementSourceNodes cannot be rebuilt, so the
   elements themselves are kept and only their sources are re set, which
   is what load() with a fresh src does. */
function tuneRevive() {
  if (!tune.failed || !musicOn) return false;
  if (tune.tries >= FEEL.TUNE_RETRIES) return false;
  if (tune.retryIn > 0) return false;
  // And if the graph turned up after the failure did, wire it in now.
  if (!tune.wired && audio) tuneWire(audio);
  tune.tries++;
  tune.failed = false;
  tune.begun = false;
  tune.waited = 0;
  tune.frozen = 0;
  tune.loaded = -1;
  tune.pending = -1;
  for (let i = 0; i < 2; i++) {
    const el = tune.el[i];
    if (el && el.dataset) el.dataset.tune = '';
  }
  tuneLoad(1 - tune.live, tune.index < 0 ? 0 : tune.index);
  return true;
}

/* EVERY TRACK NUMBER IN THIS FILE GOES THROUGH HERE FIRST.

   MEASURED, AND THIS KILLED THE MUSIC AFTER TRACK FOUR. The wrap used to
   live inside tuneLoad alone, so the FILE it picked was always right
   while tune.index and tune.loaded carried the raw counter: 4, 5, 6. Two
   things then went wrong at once. The comparisons that choose a side are
   made against those numbers, so they were being made in a different
   space from the files they name. And TUNES[4] is undefined, so the very
   next line, the one that puts the title on screen, threw before play()
   was ever asked for and before the fade envelope was set. Traced: at
   12.94 seconds the live side swapped to the track one element, its
   currentTime stayed at zero, the gain stayed at zero, and the master
   went silent for the remaining eleven seconds of the test.

   So the wrap belongs at the source. Nothing downstream ever sees a
   number outside 0 to TUNES.length - 1, and every comparison is made in
   the same space as every other. */
function tuneWrap(index) {
  return ((index % TUNES.length) + TUNES.length) % TUNES.length;
}

// Give one side a track and let it start buffering. Never more than the
// one being played and the one after it, which is what this enforces.
function tuneLoad(side, index) {
  const el = tune.el[side];
  if (!el || tune.failed) return;
  index = tuneWrap(index);
  const t = TUNES[index];
  /* THE EARLY RETURN STILL RECORDS WHAT IS THERE, and it used to not.
     "This side already holds that file" is the same fact as "this side
     is loaded with that index", and dropping the second one left
     tune.loaded naming a track that had moved on, which is precisely the
     disagreement that picks the wrong side. It matters most at the wrap,
     where the next file to load is track one and the idle side may still
     be holding track one from earlier in the session. */
  if (el.dataset && el.dataset.tune === t.file) { tune.loaded = index; return; }
  if (el.dataset) el.dataset.tune = t.file;
  el.src = t.file;
  try { el.load(); } catch (e) { tuneFailed(); }
  tune.loaded = index;
}

/* Into the graph, once there is a graph. Called from buildAudio, which
   only ever runs after a gesture, so the elements may already have been
   buffering for a while by then and nothing has waited on them. */
function tuneWire(a) {
  /* NOT GATED ON tune.failed, AND IT USED TO BE. Wiring is plumbing: two
     source nodes, two gains, silent until something plays. Refusing to
     build it because the FIRST fetch had failed meant that a player
     whose first request was blocked never got the elements into the
     graph at all, so no later retry could ever produce a sound. The
     revive path looked like it worked and was silent, which is the worst
     kind of broken. */
  /* THERE WAS A LOWPASS HERE AND IT IS GONE. Its cutoff opened with the
     drift multiplier, the same lever the procedural arp uses, on the
     reasoning that a finished mix cannot grow a layer so brightness had
     to be the response instead. Played, it did not read as the music
     responding to the driving. It read as the tracks being broken, which
     is the worst possible reading of an effect: it costs the player
     confidence in the whole thing rather than merely adding nothing.

     So the recorded tracks are now a plain playlist. Source into gain
     into the bus, and the only two things that ever touch that gain are
     the crossfade envelope and the crash duck, neither of which is a
     response to how anybody is driving. */
  if (tune.wired || !tune.el[0]) return;
  for (let i = 0; i < 2; i++) {
    let src;
    try { src = a.ac.createMediaElementSource(tune.el[i]); }
    catch (e) { tuneFailed(); return; }
    const g = a.ac.createGain();
    g.gain.value = 0;
    src.connect(g); g.connect(a.bus);
    tune.src[i] = src; tune.g[i] = g;
  }
  tune.wired = true;
}

/* THE RUN IS WHAT STARTS THE MUSIC, so the first note lands with the
   first corner rather than over a title screen somebody is reading.

   NOTHING WAITS. play() is asked for and whatever it returns is
   ignored: if the track has not buffered, the run is already under way
   and the audio joins when it can. */
function tuneStart() {
  /* THE ELEMENTS, IF THE TITLE SCREEN NEVER MADE THEM. tuneWake is
     reached from exactly one place, a title screen tick after the boot
     splash has finished, and a player who taps twice quickly can be in a
     run before that tick ever happened. tuneWake returns immediately
     once the elements exist, so this costs nothing on every run after
     the first, and a run cannot begin during the splash, so it does not
     put the download back where section 6 says it may not go. */
  tuneWake();
  // A new run is the moment to try again after a hiccup.
  if (tune.failed) tuneRevive();
  if (!musicOn || tune.failed || !tune.wired) return;
  if (tune.playing) return;
  const next = tune.index < 0 ? 0 : tune.index;
  tunePlay(next, FEEL.TUNE_FADE_IN);
}

function tunePlay(index, fade) {
  // Wrapped FIRST, so the comparison below and TUNES[index] both mean the
  // same thing on the fifth track as they do on the first.
  index = tuneWrap(index);
  const side = tune.loaded === index ? 1 - tune.live : tune.live;
  tuneLoad(side, index);
  const el = tune.el[side];
  if (!el || !tune.g[side]) return;
  /* THE STATE IS COMMITTED BEFORE play() IS ASKED FOR, and that order
     matters. It used to be the other way round with a `return` in the
     catch, so an element that threw, which one that has just been
     reloaded after an error will, left the player marked not playing
     with no side selected and NOTHING EVER TRIED AGAIN. That is what
     stopped a revive from taking: the music came back on paper and
     stayed silent. Asking to play is now the last thing that happens
     and it cannot abandon the attempt; the canplay listener and the
     retry in tuneUpdate both pick it up from here. */
  tune.live = side;
  tune.index = index;
  tune.playing = true;
  tune.begun = false;
  tune.waited = 0;
  tune.frozen = 0;
  tune.lastTime = -1;
  tune.nameText = TUNES[index].name;
  tune.nameLife = FEEL.TUNE_NAME_TIME;
  try {
    // A rejected play is a browser saying not yet. It is not an error
    // and it must not take the music away for the rest of the session.
    const q = el.play();
    if (q && q.catch) q.catch(function () {});
  } catch (e) { /* the retry will have another go */ }
  const per = 1 / Math.max(0.05, fade);
  tune.want[side] = 1;     tune.rate[side] = per;
  tune.want[1 - side] = 0; tune.rate[1 - side] = per;
  /* AND THE NEXT ONE WAITS FOR THE OLD ONE TO FINISH LEAVING.

     MEASURED, AND THIS WAS BROKEN. Loading the next track onto the other
     side immediately sets that element's src, which PAUSES IT AND RESETS
     IT TO ZERO, and that element is the track still fading out. So the
     crossfade was a fade up from silence with the outgoing track cut
     dead at the first frame of it, which is the one thing a crossfade is
     for. Traced: side one went from 8.0 seconds playing to paused at
     zero on the frame the swap happened.

     The load is deferred until the outgoing level has actually reached
     nothing. There is a whole track's length to do it in. */
  tune.pending = tuneWrap(index + 1);
}

function tuneStop() {
  tune.playing = false;
  for (let i = 0; i < 2; i++) {
    tune.want[i] = 0; tune.lvl[i] = 0;
    if (tune.g[i]) ramp(tune.g[i].gain, 0, FEEL.AUDIO_FADE_TIME);
    const el = tune.el[i];
    if (el) { try { el.pause(); } catch (e) {} }
  }
}

// Is a recorded track actually making sound right now? The procedural
// music runs only when the answer is no AND the fetch has failed.
function tuneAudible() {
  if (!tune.playing || tune.failed || !tune.wired) return false;
  const el = tune.el[tune.live];
  return !!(el && !el.paused && el.currentTime > 0);
}

function tuneUpdate(dt) {
  if (tune.nameLife > 0) tune.nameLife -= dt;
  if (tune.retryIn > 0) tune.retryIn = Math.max(0, tune.retryIn - dt);
  /* THE ENVELOPE, ON FRAME TIME. Linear and rate limited rather than a
     follow, because a fade in is a promise about how long somebody has
     to react and an exponential tail does not keep it. */
  for (let i = 0; i < 2; i++) {
    const d = tune.want[i] - tune.lvl[i];
    const step = tune.rate[i] * dt;
    tune.lvl[i] = Math.abs(d) <= step ? tune.want[i] : tune.lvl[i] + Math.sign(d) * step;
  }
  /* The deferred load, now that the side it would land on is silent. */
  if (tune.pending >= 0 && tune.lvl[1 - tune.live] <= 0) {
    const idle = 1 - tune.live;
    const el = tune.el[idle];
    if (el) { try { el.pause(); } catch (e) {} }
    tuneLoad(idle, tune.pending);
    tune.pending = -1;
  }
  if (!tune.wired || tune.failed) return;
  if (!tune.playing) return;
  const el = tune.el[tune.live];
  if (!el) return;

  /* THE ONLY THING HERE THAT ENDS IN A FAILURE. The browser has looked
     for the media and found nothing there, which is what a blocked or
     missing file looks like when no error event is raised. */
  if (el.networkState === NET_NO_SOURCE) { tuneFailed('no source'); return; }

  const moved = el.currentTime !== tune.lastTime;
  if (moved) { tune.lastTime = el.currentTime; }
  if (el.currentTime > 0) tune.begun = true;

  if (!tune.begun) {
    /* STILL ARRIVING, and that is all it is. No clock runs out here.
       The one thing that can leave an element silent for ever without
       an error is a play() promise the browser rejected, so play() is
       simply asked for again every so often. Asking twice costs
       nothing; a track that is buffering ignores it. */
    tune.waited += dt;
    if (tune.waited > FEEL.TUNE_RETRY_PLAY) {
      tune.waited = 0;
      try { const q = el.play(); if (q && q.catch) q.catch(function () {}); }
      catch (e) {}
    }
    return;
  }

  /* AND A FREEZE AFTER IT STARTED IS A REBUFFER, which also waits. The
     same retry, for the same reason, and still no give up: the track is
     demonstrably real, so going quiet for a moment is not a reason to
     replace it with a different piece of music for the rest of the
     session. */
  if (!moved && !el.paused) {
    tune.frozen += dt;
    if (tune.frozen > FEEL.TUNE_RETRY_PLAY) {
      tune.frozen = 0;
      try { const q = el.play(); if (q && q.catch) q.catch(function () {}); }
      catch (e) {}
    }
  } else tune.frozen = 0;

  /* THE CROSSFADE. Started TUNE_TAIL before the end so the two overlap
     rather than one stopping and the next beginning, and the next track
     has been buffering on the other side since this one started. */
  const dur = el.duration;
  if (dur && isFinite(dur) && el.currentTime > 0
      && dur - el.currentTime <= FEEL.TUNE_TAIL) {
    tunePlay(tune.index + 1, FEEL.TUNE_CROSSFADE);
  } else if (el.ended) {
    tunePlay(tune.index + 1, FEEL.TUNE_CROSSFADE);
  }
}
let track = 0;            // only one for now, and the list is here so that
                          // adding a second is a data change and not a
                          // rewrite. Nothing selects between them yet.

/* Two switches rather than one cycle, because they are two decisions and
   they default differently.

   SOUND is the tyres, the scrape and the crash, and it is on. The skid is
   quiet, textural and is most of what makes the drift read at all.

   MUSIC IS NOW ON, and it used to be off. The old comment here argued
   that an arpeggio at 148bpm is what gets somebody caught in a
   classroom, and that argument was right about the arpeggio. It is the
   author's call to reverse it for four original tracks, and what makes
   it defensible is not the music being better: it is that THE TITLE
   SCREEN SAYS SO BEFORE A NOTE PLAYS, the mute is already on screen and
   one tap away when it does, the title screen itself is silent, and a
   mute is remembered forever.

   A STORED VALUE ALWAYS WINS OVER THE DEFAULT, IN BOTH DIRECTIONS, and
   that is the half of this that matters most now the default is on:
   somebody who muted once is never surprised again. With storage
   blocked the mute still holds for the whole session, which is the same
   fallback the tilt hint has and the same limit: there is no way to
   remember a person across loads on a device that refuses to remember
   anything. */
let sfxOn = storeGet('sfx') !== '0';
let musicOn = storeGet('music') !== '0';
function anySound() { return sfxOn || musicOn; }

let audio = null;         // the graph, once there is one, and never before one

/* Equal temperament from a root, so the note tables above are semitone
   offsets and a station is a scale plus a waveform rather than a tune. */
function semis(root, n) { return root * Math.pow(2, n / 12); }

function buildAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  let ac;
  try { ac = new Ctx(); } catch (e) { return null; }

  /* Two seconds of white noise, generated here. It is the source for the
     skid, the scrape and the crash, and two seconds is long enough that
     the loop point is not a rhythm. */
  const frames = Math.floor(ac.sampleRate * 2);
  const noise = ac.createBuffer(1, frames, ac.sampleRate);
  const data = noise.getChannelData(0);
  for (let i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;

  function node(type) { return ac['create' + type](); }
  function loopNoise() {
    const src = node('BufferSource');
    src.buffer = noise;
    src.loop = true;
    return src;
  }
  function filter(kind, freq, q) {
    const f = node('BiquadFilter');
    f.type = kind;
    f.frequency.value = freq;
    if (q !== undefined) f.Q.value = q;
    return f;
  }
  function gain(v) { const g = node('Gain'); g.gain.value = v; return g; }

  // Master. Everything lands on the pause filter first, so the pause can
  // close a lowpass over the lot rather than muting it.
  const pauseFilter = filter('lowpass', FEEL.AUDIO_OPEN_CUTOFF, 0.7);
  const master = gain(0);
  pauseFilter.connect(master);
  master.connect(ac.destination);
  const bus = gain(1);
  bus.connect(pauseFilter);

  // --- The skid. One voice, started once, never retriggered. ---
  const skidSrc = loopNoise();
  const skidBand = filter('bandpass', FEEL.SKID_FREQ_LOW, FEEL.SKID_Q_LOW);
  const skidTop = filter('lowpass', FEEL.SKID_TOP_CUTOFF, 0.6);
  const skidGain = gain(0);
  skidSrc.connect(skidBand); skidBand.connect(skidTop);
  skidTop.connect(skidGain); skidGain.connect(bus);
  /* A small, slow breath on the band, at audio rate, so a held slip angle
     still moves instead of settling into a static tone. It costs nothing
     per frame because nothing schedules it. */
  const wobble = node('Oscillator');
  wobble.frequency.value = FEEL.SKID_WOBBLE_HZ;
  const wobbleDepth = gain(FEEL.SKID_WOBBLE_FREQ);
  wobble.connect(wobbleDepth); wobbleDepth.connect(skidBand.frequency);

  // --- The scrape. Two high Q bands, off any harmonic of each other. ---
  const scrapeSrc = loopNoise();
  const scrapeA = filter('bandpass', FEEL.SCRAPE_FREQ, FEEL.SCRAPE_Q);
  const scrapeB = filter('bandpass', FEEL.SCRAPE_FREQ * FEEL.SCRAPE_FREQ_RATIO, FEEL.SCRAPE_Q);
  const scrapeGain = gain(0);
  scrapeSrc.connect(scrapeA); scrapeA.connect(scrapeB);
  scrapeB.connect(scrapeGain); scrapeGain.connect(bus);

  // --- The crash. Idle until something hits it. ---
  const crashSrc = loopNoise();
  const crashLow = filter('lowpass', FEEL.CRASH_FREQ_FROM, 1.4);
  const crashGain = gain(0);
  crashSrc.connect(crashLow); crashLow.connect(crashGain); crashGain.connect(bus);

  // --- Music. Four mono voices, each one persistent. ---
  const musicGain = gain(0);
  musicGain.connect(bus);

  const bassOsc = node('Oscillator');
  bassOsc.type = 'square';
  const bassLow = filter('lowpass', 260, 0.8);
  const bassGain = gain(0);
  bassOsc.connect(bassLow); bassLow.connect(bassGain); bassGain.connect(musicGain);

  const arpOsc = node('Oscillator');
  const arpLow = filter('lowpass', FEEL.MUSIC_ARP_CUTOFF_LOW, 3.5);
  const arpGain = gain(0);
  arpOsc.connect(arpLow); arpLow.connect(arpGain); arpGain.connect(musicGain);

  const octOsc = node('Oscillator');
  octOsc.type = 'triangle';
  const octGain = gain(0);
  const octLevel = gain(0);        // the layer's own level, driven by heat
  octOsc.connect(octGain); octGain.connect(octLevel); octLevel.connect(musicGain);

  const hatSrc = loopNoise();
  const hatHigh = filter('highpass', 7000, 0.9);
  const hatGain = gain(0);
  const hatLevel = gain(0);
  hatSrc.connect(hatHigh); hatHigh.connect(hatGain);
  hatGain.connect(hatLevel); hatLevel.connect(musicGain);

  /* --- The sting. One voice for every earned moment in the game.
     It hangs off the BUS rather than off musicGain, because these are
     responses to what the player did and they have to be there for
     somebody who has never turned the music on. It is a mono voice like
     everything else here: started once, never rebuilt, and a sting is a
     handful of scheduled frequency changes on it. --- */
  const stingOsc = node('Oscillator');
  stingOsc.type = 'triangle';
  const stingGain = gain(0);
  stingOsc.connect(stingGain); stingGain.connect(bus);

  /* --- The chain blip. Its own voice rather than the sting's, because a
     chain link and a close call can land on the same frame and a shared
     voice would cut one of them off mid note. On the BUS, not on the
     music, because music is off by default and this is the reward for
     playing well. --- */
  const chainOsc = node('Oscillator');
  chainOsc.type = 'square';
  const chainLow = filter('lowpass', 2600, 0.9);
  const chainGain = gain(0);
  chainOsc.connect(chainLow); chainLow.connect(chainGain); chainGain.connect(bus);

  const t0 = ac.currentTime;
  skidSrc.start(t0); scrapeSrc.start(t0); crashSrc.start(t0); hatSrc.start(t0);
  wobble.start(t0); bassOsc.start(t0);
  arpOsc.start(t0); octOsc.start(t0); stingOsc.start(t0); chainOsc.start(t0);

  const built = {
    ac: ac, master: master, pauseFilter: pauseFilter, bus: bus,
    skidBand: skidBand, skidGain: skidGain,
    scrapeA: scrapeA, scrapeGain: scrapeGain,
    crashLow: crashLow, crashGain: crashGain,
    musicGain: musicGain,
    bassOsc: bassOsc, bassGain: bassGain,
    arpOsc: arpOsc, arpLow: arpLow, arpGain: arpGain,
    octOsc: octOsc, octGain: octGain, octLevel: octLevel,
    hatGain: hatGain, hatLevel: hatLevel,
    stingOsc: stingOsc, stingGain: stingGain,
    chainOsc: chainOsc, chainGain: chainGain,
    step: 0, nextNote: 0, heat: 0, crashUntil: 0
  };
  // The recorded tracks join the same bus, so the master, the pause
  // sweep and the crash duck all apply to them without a second path.
  tuneWire(built);
  return built;
}

/* Every live level goes through this rather than through a bare
   assignment: an AudioParam set outright jumps at the render quantum
   boundary and that is audible as a zip on anything moving at 60Hz. */
function ramp(param, value, tau) {
  param.setTargetAtTime(value, audio.ac.currentTime, tau);
}

/* --------------------------------------------------------------
   The sound pad. One button, three states, and the icon is the label.
   -------------------------------------------------------------- */
/* Inline SVG rather than glyphs or words: a font may not have the glyph,
   and text at this size reads as a debug control. Nothing is fetched,
   these are paths in the file. */
const ICON = {
  /* THE FLIP. Two opposed arrows, and this is a REDRAW.

     It used to be a U turn: a bar with a hook on the end and two
     arrowheads at different scales, drawn at stroke-width 2 where the
     rest of the row is 2.2. Next to five solid centred glyphs it read as
     a rendering error rather than a control, and it was: the shape was
     not symmetric about either axis, so it could not sit on the same
     optical centre as its neighbours whatever it was nudged to.

     This one is EXACTLY ROTATIONALLY SYMMETRIC about the middle of the
     box. Rotate it half a turn and every point lands on another point of
     itself, so it is centred by construction rather than by eye, and the
     two heads are the same head. Same stroke weight, caps and joins as
     the fullscreen icon, which is the other purely stroked glyph in the
     row, and the same 4 to 20 span so the optical size matches. */
  flip:
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"'
    + ' stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M20 9H5"/><path d="M9 5.2 5 9l4 3.8"/>'
    + '<path d="M4 15h15"/><path d="M15 11.2 19 15l-4 3.8"/></svg>',
  speakerOff:
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
    + ' stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M3 9.5h3.5L11 6v12L6.5 14.5H3z" fill="currentColor" stroke-linejoin="round"/>'
    + '<path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>',
  speakerOn:
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
    + ' stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M3 9.5h3.5L11 6v12L6.5 14.5H3z" fill="currentColor" stroke-linejoin="round"/>'
    + '<path d="M14.5 9.8a3.6 3.6 0 010 4.4"/></svg>',
  // A note with a bar through it, and the same note plain.
  noteOff:
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
    + ' stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M10 18V7.2l8-1.8V16"/>'
    + '<circle cx="7.6" cy="18" r="2.6" fill="currentColor"/>'
    + '<circle cx="15.6" cy="16" r="2.6" fill="currentColor"/>'
    + '<path d="M3.4 21.2L20.6 3.4" stroke-width="2.2"/></svg>',
  noteOn:
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
    + ' stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M10 18V7.2l8-1.8V16"/>'
    + '<circle cx="7.6" cy="18" r="2.6" fill="currentColor"/>'
    + '<circle cx="15.6" cy="16" r="2.6" fill="currentColor"/></svg>',
  expand:
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"'
    + ' stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  shrink:
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"'
    + ' stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
  pause:
    '<svg viewBox="0 0 24 24" fill="currentColor">'
    + '<rect x="6.5" y="5" width="4" height="14" rx="1.2"/>'
    + '<rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  play:
    '<svg viewBox="0 0 24 24" fill="currentColor">'
    + '<path d="M7.5 5.2l11.2 6.4a0.45 0.45 0 010 0.8L7.5 18.8A0.45 0.45 0 016.8 18.4V5.6a0.45 0.45 0 01 0.7-0.4z"/></svg>',
  /* A handset leaning over, with the screen drawn in so it reads as a
     phone rather than as a shape, and a tick either side for the rocking.
     The ticks sit clear of the body at every rotation. */
  tilt:
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"'
    + ' stroke-linecap="round" stroke-linejoin="round">'
    + '<g transform="rotate(-24 12 12)">'
    + '<rect x="8.4" y="3.4" width="7.2" height="17.2" rx="1.9"/>'
    + '<path d="M10.8 5.6h2.4" stroke-width="1.5"/>'
    + '<path d="M8.4 17.6h7.2" stroke-width="1.5"/>'
    + '</g>'
    + '<path d="M2.6 8.6l1.7 1.5M21.4 13.4l-1.7-1.5" stroke-width="1.7"/></svg>',
  // Two ways through one handset, which is what the reverse does.
  tiltEnd: 0
};

/* The icons are the whole readout. There is no third state to show now
   that the two switches are separate, so each is simply on or off. */
function paintSound() {
  soundBtn.innerHTML = sfxOn ? ICON.speakerOn : ICON.speakerOff;
  soundBtn.classList.toggle('on', sfxOn);
  musicBtn.innerHTML = musicOn ? ICON.noteOn : ICON.noteOff;
  musicBtn.classList.toggle('on', musicOn);
}

/* fade is the time to reach level, which is longer for the first start
   than for a switch. Building the graph is deferred until a gesture has
   happened: called before then this only moves the setting and paints it,
   and firstGesture picks it up. */
function applyAudio(fade) {
  paintSound();
  storeSet('sfx', sfxOn ? '1' : '0');
  storeSet('music', musicOn ? '1' : '0');
  if (!anySound()) {
    if (audio) {
      ramp(audio.master.gain, 0, FEEL.AUDIO_FADE_TIME);
      // Suspending frees the audio thread entirely rather than leaving a
      // silent graph running, which matters on the Chromebooks in
      // section 6 far more than it does here.
      setTimeout(function () {
        if (audio && !anySound()) { try { audio.ac.suspend(); } catch (e) {} }
      }, 400);
    }
    return;
  }
  if (!audio) {
    if (!gestureUsed) return;      // no gesture yet, so nothing may sound
    audio = buildAudio();
  }
  if (!audio) return;
  resumeAudio();
  audio.step = 0;
  audio.nextNote = audio.ac.currentTime + 0.06;
  const t = TRACKS[track];
  audio.arpOsc.type = t.wave;
  audio.octOsc.type = t.wave === 'square' ? 'square' : 'triangle';
  ramp(audio.master.gain, FEEL.AUDIO_MASTER, fade || FEEL.AUDIO_START_TIME);
}

/* Called once, from the first gesture. Until this runs there is no
   AudioContext at all, which is both what the browser wants and what the
   room wants. */
function startAudio() {
  if (audio || !anySound()) return;
  applyAudio(FEEL.AUDIO_FIRST_FADE);
}

/* The other two pads never change except through their own handlers, so
   they are painted once here, where ICON exists. */
pauseBtn.innerHTML = ICON.pause;
tiltBtn.innerHTML = ICON.tilt;
flipBtn.innerHTML = ICON.flip;
syncFlipBtn();


/* ----------------------------------------------------------------
   Fullscreen. Two paths, because neither one covers every handset.

   The API path works on Android Chrome, on desktop and on iPadOS. On an
   iPhone it simply is not there, which the feature test below picks up,
   and the meta tags in the head cover that case through Add to Home
   Screen instead. The button is hidden wherever the API is genuinely
   unavailable, exactly as the tilt button is, because shipping a control
   that does nothing is worse than shipping no control.

   The request has to be made synchronously inside the tap, same
   discipline as the tilt permission: anything asynchronous before it and
   the browser refuses without saying so. */
var fullReady = false;
const fullBtn = document.getElementById('fullBtn');
const fullRoot = document.documentElement;
function standalone() {
  if (window.navigator && window.navigator.standalone === true) return true;
  try { return window.matchMedia('(display-mode: standalone)').matches; }
  catch (e) { return false; }
}
const canFullscreen = !standalone()
  && !!(fullRoot.requestFullscreen || fullRoot.webkitRequestFullscreen)
  && document.fullscreenEnabled !== false;

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function paintFull() {
  fullBtn.innerHTML = isFullscreen() ? ICON.shrink : ICON.expand;
  fullBtn.classList.toggle('on', isFullscreen());
}
function toggleFullscreen() {
  if (isFullscreen()) {
    if (document.exitFullscreen) { document.exitFullscreen().catch(function () {}); }
    else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
    return;
  }
  if (fullRoot.requestFullscreen) {
    const r = fullRoot.requestFullscreen();
    if (r && r.catch) r.catch(function () {});
  } else if (fullRoot.webkitRequestFullscreen) {
    fullRoot.webkitRequestFullscreen();
  }
}
fullBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
fullBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  fullBtn.blur();
  firstGesture();
  toggleFullscreen();          // synchronous, inside the gesture
});
/* Entering or leaving changes the viewport, and on a phone it also
   changes the safe area insets, because the insets the browser reports
   depend on whether its own chrome is there. resize reads both. */
function onFullscreenChange() {
  paintFull();
  resize();
  // The viewport settles a frame or two after the event on some browsers.
  window.requestAnimationFrame(resize);
  setTimeout(resize, 250);
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
