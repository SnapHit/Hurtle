     Between sessions ten and thirteen a FLIP BUTTON existed and wrote
     'tiltflip' to localStorage. From session fourteen the tuning cycler
     could write TILT_DIRECTION to storage as well. Through that whole
     stretch the sign actually in force was the source constant TIMES a
     stored value that nobody could see and this file no longer reads. So
     every report of "backwards" before session twenty six was a report
     about an unknown product, not about this constant, and flipping the
     constant on the strength of one could never have been more than a
     coin toss. It was flipped four times on exactly that basis.

     Session twenty six closed both leaks: stored tuning is debug only,
     these two constants are noSave, and the key is versioned. From that
     point the source constant IS the sign in force, and a report of
     backwards finally means something about this line.

     Session twenty eight shipped -1 and it was reported backwards, so
     session twenty nine shipped +1. That one was reported backwards too,
     and the reason is now known: the flip button arrived in the same
     session, the author had been pressing it, and the stored departure
     inverted the new default straight back. The stored value was doing
     to the source exactly what the stored TUNING used to do to it, three
     sessions after that leak was closed and by a route that had just
     been opened.

     Session thirty one shipped -1 with the key bumped, and it was
     reported backwards for the SEVENTH time. That is the end of the
     argument: seven reports, seven sign flips, and every one of them a
     guess dressed up as a derivation.

   SO THE DEVICE IS ASKED, AND THAT IS WHAT SESSION THIRTY TWO DID.

     The finding this file already recorded is the answer to it. If
     gamma's sign varies by handset and this file cannot see which
     handset it is on, then NO SHIPPED DEFAULT IS RIGHT FOR EVERYONE and
     some share of players get inverted tilt whatever is shipped.
     Guessing harder cannot fix that. Only the device can.

     ON THE FIRST ENABLE, the player is asked to hold the phone how they
     want to play and then tilt LEFT. The SIGN OF THE CHANGE is the
     direction, and the posture it started from is the zero point that
     section 8.4 requires anyway. One gesture, two jobs. See tiltCal.

     WHICH MAKES TILT_DIRECTION NEARLY IRRELEVANT, and that is the point
     of it. It is the fallback for a player who skips the gesture, for a
     device that reports nothing, and for nothing else. It was inverted
     to +1 in the same edit for the ordinary reason, that the author
     reported -1 backwards, and TILT_FLIP_KEY was bumped with it so no
     device can carry a departure from the OLD default into the new one.
     Those two changes belong together and neither is safe alone.

   AND THE FLIP BUTTON STAYS, as the override for anyone the gesture got
   wrong, stored as the player's departure from this constant rather than
   as an absolute sign. Holding it re-runs the calibration. See tiltSign.
   ------------------------------------------------------------------ */
const tilt = {
  supported: false,
  active: false,
  listening: false,
  value: 0,         // smoothed, -1 to +1, written into steering.value
  rawDeg: null,     // latest reading, already remapped for screen orientation
  zeroDeg: null,    // the posture captured at enable and at every run start
  seenSensor: false,
  waitedFor: 0
};

const tiltBtn = document.getElementById('tiltBtn');
const flipBtn = document.getElementById('flipBtn');
const noteEl = document.getElementById('note');
let noteTimer = 0;

function showNote(text, seconds) {
  noteEl.textContent = text;
  noteEl.hidden = false;
  noteTimer = seconds;
}

function inCrossOriginFrame() {
  if (window.top === window.self) return false;
  try { return window.top.location.origin !== window.location.origin; }
  catch (e) { return true; }
}

function detectTiltSupport() {
  // Desktop has the interface but no sensor, so the button would sit there
  // doing nothing. A cross origin frame gets no events at all and cannot be
  // made to. Hide the button in both cases, per the section 8.3 table.
  if (!('DeviceOrientationEvent' in window)) return false;
  if (inCrossOriginFrame()) return false;
  if (window.matchMedia && !window.matchMedia('(any-pointer: coarse)').matches) return false;
  return true;
}

function orientationAngle() {
  if (window.screen && window.screen.orientation && typeof window.screen.orientation.angle === 'number') {
    return window.screen.orientation.angle;
  }
  return (typeof window.orientation === 'number') ? ((window.orientation + 360) % 360) : 0;
}

/* Exact cos and sin for the four quarter turns, so the remap never picks
   up float dust and the four cases stay exactly four cases. */
const ORIENT_COS = [1, 0, -1, 0];
const ORIENT_SIN = [0, 1, 0, -1];

/* ------------------------------------------------------------------
   THE TWO PURE FUNCTIONS. No side effects, no globals written, nothing
   read but FEEL. Everything the sensor path does to a number happens in
   here, so tiltAssert can drive the whole thing without a phone.

   tiltReading  : raw pair plus screen angle  ->  degrees, positive when
                  the SCREEN's right edge is down
   tiltSteer    : the same plus the calibrated zero  ->  steering value,
                  -1 to +1, the number the physics eventually reads
   ------------------------------------------------------------------ */
function tiltReading(gamma, beta, angle) {
  // Snapped to the nearest quarter turn, because a handset mid rotation
  // can report something in between, and taken off an exact integer table
  // so nothing here is ever 6e-17 instead of zero.
  const q = ((Math.round((angle || 0) / 90) % 4) + 4) % 4;
  return (gamma || 0) * ORIENT_COS[q]
       + (beta || 0) * ORIENT_SIN[q] * FEEL.TILT_LANDSCAPE_SENSE;
}

/* ------------------------------------------------------------------
   THE PLAYER'S OWN REVERSAL.

   This exists because of a finding rather than as a convenience. If
   gamma's sign genuinely varies across handsets, and this file cannot
   see which handset it is on, then NO SINGLE SHIPPED DEFAULT IS CORRECT
   FOR EVERYONE and some share of players will get inverted tilt whatever
   is shipped. One tap has to fix it, on their device, for good.

   STORED AS A DEPARTURE FROM THE SHIPPED DEFAULT, never as an absolute
   sign. Three things follow from that and all three matter:

     - The button is unlit on a fresh install and lit only once it has
       been deliberately touched, so it reads as "you changed this".
     - THE SOURCE DEFAULT WINS UNTIL THE PLAYER SETS ONE. A missing key
       is not a stored 'off'; it is no opinion at all, and the constant
       decides. Session twenty six was lost to a stored value silently
       beating the source and that is not coming back.
     - Changing the shipped default later cannot silently reverse the
       controls for everybody who already set one.

   THE KEY IS VERSIONED, AND IT IS BUMPED WHENEVER TILT_DIRECTION MOVES.
   That rule is the whole of it, and the history is why:

     'tiltflip'   Sessions ten to thirteen. A flip button existed and
                  wrote this, then the button was removed, so any device
                  that played in that window still carries the value.
                  Nothing reads it.
     'tiltflip2'  Session twenty nine, when the button came back. Bumped
                  so that the stale 'tiltflip' could not override the
                  shipped default on the handset being fixed for.
     'tiltflip3'  Session thirty one, and this one is the rule earning
                  its keep. The source default moved from +1 to -1, and
                  the author had been pressing the button to correct the
                  old default, so 'tiltflip2' on that device says FLIP.
                  Left alone it would have inverted the new default
                  straight back and produced a seventh identical report.
     'tiltflip4'  Session thirty two. The default moved back to +1 and the
                  same rule applies, but this key now carries a second
                  job: IT IS ALSO THE RECORD THAT THE DEVICE HAS SPOKEN.
                  Written by the calibration gesture as well as by the
                  button, and its presence is what "never ask again"
                  reads. One key, because "has a direction been settled
                  on this device" and "what is it" are one question.

   A STORED FLIP IS A DEPARTURE FROM A PARTICULAR DEFAULT, so it means
   nothing once that default changes. Moving TILT_DIRECTION without
   moving this key is therefore not a smaller change, it is a broken one.
   ------------------------------------------------------------------ */
const TILT_FLIP_KEY = 'tiltflip4';
let tiltFlipped = (function () {
  const raw = storeGet(TILT_FLIP_KEY);
  // Only an explicit stored choice counts. Anything else, including a
  // key that is not there at all, leaves the source constant in charge.
  return raw === '1';
})();
let tiltFlipChosen = (function () {
  const raw = storeGet(TILT_FLIP_KEY);
  return raw === '1' || raw === '0';
})();

function tiltSign() { return FEEL.TILT_DIRECTION * (tiltFlipped ? -1 : 1); }

function tiltSteer(gamma, beta, angle, zeroDeg, dir) {
  /* The direction is applied HERE rather than where the reading is taken,
     so that flipping it mid run does not also flip the captured posture
     and force a recalibration. The flip therefore takes effect on the
     very next frame with no recalibration and no dead moment. */
  const sign = dir === undefined ? tiltSign() : dir;
  const rel = (tiltReading(gamma, beta, angle) - (zeroDeg || 0)) * sign;
  const magnitude = Math.abs(rel);
  if (magnitude <= FEEL.TILT_DEADZONE_DEG) return 0;
  const span = Math.max(1, FEEL.TILT_FULL_LOCK_DEG - FEEL.TILT_DEADZONE_DEG);
  return clamp((magnitude - FEEL.TILT_DEADZONE_DEG) / span, 0, 1) * Math.sign(rel);
}

function onDeviceOrientation(e) {
  if (e.gamma === null || e.gamma === undefined) return;   // no real sensor behind the event
  tilt.seenSensor = true;
  const deg = tiltReading(e.gamma, e.beta, orientationAngle());
  tilt.rawDeg = deg;
  if (tilt.zeroDeg === null) tilt.zeroDeg = deg;
}

/* Rotating the handset mid run changes which physical axis the reading
   comes off, so a zero captured in portrait is being subtracted from a
   completely different quantity in landscape. The result feels exactly
   like a sign bug and is not one. Re assemble the zero from whatever the
   new orientation reports.

   The reading is dropped as well as the zero, because the first event
   after a rotation can still carry the old frame on some browsers, and
   updateTilt sits out the frame or two until a fresh pair arrives. */
let lastOrientation = -1;
function onOrientationChanged() {
  const angle = orientationAngle();
  if (angle === lastOrientation) return;
  lastOrientation = angle;
  tilt.rawDeg = null;
  tilt.zeroDeg = null;
  tilt.value = 0;
}
window.addEventListener('orientationchange', onOrientationChanged);
if (window.screen && window.screen.orientation
    && typeof window.screen.orientation.addEventListener === 'function') {
  // The modern event. Both are bound because coverage of each still
  // varies, and the guard above makes a double fire a no op.
  window.screen.orientation.addEventListener('change', onOrientationChanged);
}

/* ------------------------------------------------------------------
   THE ASSERTIONS. Debug only, run once at startup, and written to catch
   every one of the five reversals rather than to be tidy.

   What each one would have caught:

     WHAT THEY CANNOT COVER, SAID FIRST BECAUSE IT IS THE LESSON. Checks
     1 to 5 verify that the four orientations agree WITH EACH OTHER and
     that the pipeline is sign preserving. They CANNOT check that any of
     them agrees with the handset, because this file cannot see the
     handset. Internally consistent at the wrong sign is still wrong,
     and that is exactly what shipped for seven sessions running with
     every assertion passing.

     CHECK 6 IS THE ONE THAT CAN, and it is new in session thirty two.
     The calibration gesture takes the handset's own reading as its
     input, so the loop from "the player tilted left" to "the car goes
     left" is closed inside this file and CAN be asserted. It holds
     whichever way round the handset reports gamma, which is the whole
     reason the gesture exists.

     1. THE PORTRAIT SIGN. Asserts that a rising reading steers the way
        TILT_DIRECTION says, so a flip of the constant without a matching
        edit to the table above fails immediately instead of shipping.
     2. THE FOUR ORIENTATIONS AGREEING. Reversal two, where a session
        rewrote the landscape pair by hand and inverted 90 and 270
        together while portrait stayed right. Asserts that the SAME
        physical roll produces the SAME steering sign at 0, 90, 180 and
        270, which no hand written branch can satisfy by accident.
     3. THE STORED OVERRIDE. The one found in session twenty six, where
        localStorage carried a nudged direction that beat the source
        silently. Asserts the live constants still equal their source
        defaults, so a value arriving from anywhere else is visible, and
        that the player's flip is OFF unless it was deliberately set.
     4. THE ZERO POINT. Asserts that the calibrated posture reads as
        neutral whatever it was, and that the subtraction has not been
        turned round.
     5. THE DEADZONE AND THE NORMALISE. Asserts neutral inside the
        deadzone, full lock at the lock angle, monotonic between, and
        that the sign survives all of it.

   The failures go to the on screen note as well as the console, because
   a console message on a phone is a message nobody reads.
   ------------------------------------------------------------------ */
function tiltAssert() {
  const fails = [];
  function ok(claim, cond) { if (!cond) fails.push(claim); }

  const D = FEEL.TILT_DEADZONE_DEG, L = FEEL.TILT_FULL_LOCK_DEG;
  const past = (D + L) / 2;                 // comfortably outside the deadzone
  /* The convention in one number: which way a MORE POSITIVE reading
     steers. Negative is left. Everything below is checked against this
     rather than against a physical edge, because which edge a positive
     reading means is a property of the handset and not of this file. */
  const SIGN = Math.sign(FEEL.TILT_DIRECTION);
  const WAY = SIGN < 0 ? 'left' : 'right';
  /* Everything below drives the pipeline with the SHIPPED constant
     explicitly, not with the live sign. A player who has deliberately
     flipped has not broken anything, and telling them the tilt is broken
     for using the button correctly would be worse than useless. The flip
     itself is checked separately, on its own terms. */
  const D0 = FEEL.TILT_DIRECTION;
  const steer = function (g, b2, a, z) { return tiltSteer(g, b2, a, z, D0); };
  // The same function with the sign left open, for the calibration checks,
  // which are about a sign this file does not know in advance.
  const steerDir = function (g, b2, a, z, d) { return tiltSteer(g, b2, a, z, d); };

  // 3. The constants are the source's, not something that arrived later.
  ok('TILT_DIRECTION is not its source default',
     FEEL.TILT_DIRECTION === TUNABLE_DEFAULTS.TILT_DIRECTION);
  ok('TILT_LANDSCAPE_SENSE is not its source default',
     FEEL.TILT_LANDSCAPE_SENSE === TUNABLE_DEFAULTS.TILT_LANDSCAPE_SENSE);
  ok('TILT_DIRECTION is not plus or minus one', Math.abs(FEEL.TILT_DIRECTION) === 1);
  ok('the deadzone has eaten the whole range', D < L);
  // The source default is in charge until the player says otherwise. A
  // key that is not there is no opinion, not a stored 'off'.
  ok('the flip is on without the player having chosen it',
     tiltFlipChosen || !tiltFlipped);
  ok('the effective sign is not the constant when the flip is off',
     tiltFlipped || tiltSign() === FEEL.TILT_DIRECTION);
  ok('the flip does not reverse the effective sign',
     tiltSign() === FEEL.TILT_DIRECTION * (tiltFlipped ? -1 : 1));
  /* THE FLIP REVERSES EVERY ORIENTATION TOGETHER, which is the whole
     point of it: a player whose handset reads the other way taps once
     and is right in portrait and in both landscapes, not in one of
     them. Driven through the real function with an explicit sign so
     nothing is mutated to test it. */
  for (const angle of [0, 90, 180, 270]) {
    const g = angle === 0 ? past : (angle === 180 ? -past : 0);
    const b2 = angle === 90 ? past / FEEL.TILT_LANDSCAPE_SENSE
             : (angle === 270 ? -past / FEEL.TILT_LANDSCAPE_SENSE : 0);
    const plain = tiltSteer(g, b2, angle, 0, FEEL.TILT_DIRECTION);
    const flipped = tiltSteer(g, b2, angle, 0, -FEEL.TILT_DIRECTION);
    ok('the flip does not reverse orientation ' + angle,
       Math.abs(plain + flipped) < 1e-12 && Math.abs(plain) > 0);
  }

  /* 2. The four orientations, driven from ONE physical description.

     A right edge drop of `past` degrees is expressed in the raw pair the
     handset would report in each orientation, taken from the remap that
     tiltReading itself is: at 0 it lands on gamma, at 90 on beta, at 180
     on minus gamma and at 270 on minus beta. Every one of them must then
     produce the SAME steering sign, because it is the same physical
     movement of the same hands. */
  const S = FEEL.TILT_LANDSCAPE_SENSE;
  const cases = [
    [0,   past, 0,        'portrait',              'gamma rises'],
    [90,  0,    past / S, 'landscape 90',          'beta rises'],
    [180, -past, 0,       'portrait upside down',  'gamma falls'],
    [270, 0,    -past / S,'landscape 270',         'beta falls']
  ];
  for (let i = 0; i < cases.length; i++) {
    const angle = cases[i][0], g = cases[i][1], b = cases[i][2];
    const name = cases[i][3], moves = cases[i][4];
    ok(name + ': the reading does not rise when ' + moves,
       tiltReading(g, b, angle) > 0);
    ok(name + ': ' + moves + ' does not steer ' + WAY,
       Math.sign(steer(g, b, angle, 0)) === SIGN);
    ok(name + ': the opposite movement does not steer the other way',
       Math.sign(steer(-g, -b, angle, 0)) === -SIGN);
    // The same physical movement, so the same steering value, to the
    // last decimal and not merely the same sign. This is the one that
    // catches a landscape branch drifting away from portrait.
    ok(name + ': does not match portrait exactly for the same movement',
       Math.abs(steer(g, b, angle, 0) - steer(past, 0, 0, 0)) < 1e-12);
    // And an angle reported a few degrees off a quarter turn is the same
    // orientation, because a handset mid rotation reports exactly that.
    ok(name + ': an angle a few degrees off a quarter turn changed orientation',
       tiltReading(g, b, angle + 8) === tiltReading(g, b, angle));
  }

  /* 6. THE CALIBRATION GESTURE, which is the one thing here that CAN be
        checked against a handset, because it is the only part of the
        path that takes the handset's own answer as its input.

        The player was asked to tilt LEFT, so whatever the reading did,
        the sign it settles on must steer LEFT for that same movement,
        at every orientation and from any posture. That is a closed loop
        and it holds whichever way round the handset's gamma runs, which
        is exactly what seven sessions of guessing could not achieve. */
  for (const rel of [-30, -9, -3.2, 3.2, 9, 30]) {
    const sign = tiltCalSign(rel);
    for (const z of [-40, 0, 22]) {
      ok('calibrating on a change of ' + rel + ' from posture ' + z
         + ' does not then steer left',
         steerDir(z + rel, 0, 0, z, sign) < 0);
      ok('calibrating on a change of ' + rel + ' from posture ' + z
         + ' does not then steer right the other way',
         steerDir(z - rel, 0, 0, z, sign) > 0);
    }
    for (const angle of [0, 90, 180, 270]) {
      // The same gesture in landscape. tiltReading is the identity at
      // angle 0, which is the space rawDeg is already in, so this drives
      // the raw pair the handset would report at each quarter turn.
      const g = angle === 0 ? rel : (angle === 180 ? -rel : 0);
      const b3 = angle === 90 ? rel / FEEL.TILT_LANDSCAPE_SENSE
               : (angle === 270 ? -rel / FEEL.TILT_LANDSCAPE_SENSE : 0);
      ok('the calibrated sign does not steer left at orientation ' + angle,
         steerDir(g, b3, angle, 0, sign) < 0);
    }
  }
  // And a gesture that said nothing leaves the source constant in charge.
  ok('a zero movement does not fall back to the source default',
     tiltCalSign(0) === FEEL.TILT_DIRECTION);

  // 1. Portrait against the table in the convention block, spelled out
  //    rather than derived, so the table and the code cannot part company.
  ok('portrait: a rising reading does not steer ' + WAY,
     Math.sign(steer(past, 0, 0, 0)) === SIGN);
  ok('portrait: a falling reading does not steer the other way',
     Math.sign(steer(-past, 0, 0, 0)) === -SIGN);

  // 4. The zero point. Any posture reads neutral once it is the zero.
  for (const z of [-40, -12, 0, 7, 33]) {
    ok('zero ' + z + ' does not read neutral', steer(z, 0, 0, z) === 0);
    ok('zero ' + z + ' does not steer ' + WAY + ' past the deadzone',
       Math.sign(steer(z + past, 0, 0, z)) === SIGN);
    // The zero is a subtraction and nothing else: shifting the posture
    // and the reading together cannot change the answer.
    ok('zero ' + z + ' is not a pure subtraction',
       Math.abs(steer(z + past, 0, 0, z) - steer(past, 0, 0, 0)) < 1e-12);
  }

  // 5. The deadzone, the normalise, and the clamp.
  ok('the deadzone is not neutral', steer(D * 0.99, 0, 0, 0) === 0);
  ok('the deadzone edge is not neutral', steer(D, 0, 0, 0) === 0);
  ok('just past the deadzone is not moving', Math.abs(steer(D + 0.5, 0, 0, 0)) > 0);
  ok('full lock is not full', Math.abs(steer(L, 0, 0, 0)) > 0.999);
  ok('past full lock is not clamped', Math.abs(steer(L * 4, 0, 0, 0)) <= 1.0000001);
  let last = 0;
  for (let d = D; d <= L; d += (L - D) / 12) {
    const v = Math.abs(steer(d, 0, 0, 0));
    ok('the ramp to full lock is not monotonic', v >= last - 1e-9);
    last = v;
  }

  if (fails.length) {
    // eslint-disable-next-line no-console
    if (window.console) console.error('TILT ASSERTIONS FAILED', fails);
    showNote('TILT BROKEN: ' + fails[0], 12);
  } else if (window.console && window.console.log) {
    console.log('tilt assertions pass, direction ' + FEEL.TILT_DIRECTION
                + ', landscape sense ' + FEEL.TILT_LANDSCAPE_SENSE);
  }
  return fails;
}

function calibrateTilt() {
  // Nobody holds a phone flat. Everything is relative to the posture the
  // player is actually in, recaptured at the start of every run.
  tilt.zeroDeg = tilt.rawDeg;
  tilt.value = 0;
}

/* ==================================================================
   THE CALIBRATION GESTURE, WHICH IS WHAT ENDS THE SIGN ARGUMENT.

   Hold the phone how you want to play, then tilt LEFT. That is the whole
   of it. The sign of the change is the direction, and the posture it
   started from is the zero point. ONE GESTURE, TWO JOBS, and the second
   one is required by section 8.4 whether the first is wanted or not.

   WHY THIS RATHER THAN AN EIGHTH GUESS. Seven reports of backwards tilt
   and seven sign flips, each one reasoned from gamma's definition and
   each one wrong for somebody. The finding underneath all seven is that
   gamma's physical sense varies by handset, which means no single
   shipped constant can be right for everyone. The device knows. Ask it.

   IT IS NOT A SETTINGS SCREEN AND IT MUST NOT FEEL LIKE ONE:

     - It runs ONCE, on the first enable, and never again unless the
       player holds the flip button to ask for it.
     - It is one arrow and two words on the canvas, over whatever is
       already there. It does not pause, it does not cover the screen,
       and it does not take the game away.
     - Tilt contributes NOTHING to steering while it runs, so a player
       who ignores it entirely is playing on touch or keys exactly as
       before rather than fighting a half calibrated sensor.
     - ANY TAP OR KEY ENDS IT. That is the skip, and skipping falls back
       to the source default rather than blocking anybody.
     - It gives up on its own after TILT_CAL_SECONDS. Giving up is a
       normal outcome, not an error.

   WHAT IT DOES WITH A GESTURE IT CANNOT READ:

     TILTED THE WRONG WAY. It believes them, because it has no way not
     to, and tilt is then reversed. The flip button is one tap away and
     is exactly the fix, and holding it runs this again.
     BARELY MOVED. Nothing reaches TILT_CAL_ANGLE, it times out, and the
     peak excursion is checked against TILT_CAL_MIN_DEG: above that the
     sign of the peak is used, below it the gesture said nothing at all
     and the source default stands with nothing written to storage, so
     the next enable asks again.
     NEVER STILL. The settle phase restarts whenever the reading moves
     more than the deadzone, so a phone being carried never starts a
     read it would immediately misinterpret. The overall timeout still
     ends it, and a gesture that never settled is treated as a skip.
   ================================================================== */
const CAL_OFF = 0, CAL_SETTLE = 1, CAL_READ = 2, CAL_DONE = 3;
const tiltCal = {
  phase: CAL_OFF,
  base: 0,          // the posture, which becomes the zero point
  still: 0,         // seconds held steady so far
  waited: 0,        // seconds since the whole thing started
  peak: 0,          // signed largest excursion seen
  said: 0,          // seconds left on the result flash
  ok: false,        // did the result flash come from a reading
  asked: false,     // this page load has already offered it
  pending: false    // owed, but the car is moving, so it waits
};

function tiltCalRunning() { return tiltCal.phase === CAL_SETTLE || tiltCal.phase === CAL_READ; }
/* Including the result flash, because that occupies the same band and
   the row underneath has to stay out of it for the whole of both. */
function tiltCalOnScreen() { return tiltCal.phase !== CAL_OFF; }

/* Started from the tilt button on a first enable, and from a hold on the
   flip button whenever the player wants it back. `force` is the second of
   those: it runs even on a device that has already settled a direction. */
function startTiltCal(force) {
  if (!tilt.supported || !tilt.active) return false;
  if (!force && (tiltFlipChosen || tiltCal.asked)) return false;
  tiltCal.asked = true;
  /* NOT WHILE THE CAR IS MOVING, and this is the case that matters most.
     The preference persists but the grant does not, so a returning player
     who skipped the gesture last time gets the permission re-request on
     their FIRST GESTURE, which is the tap that starts the run. Asking
     somebody to hold a phone still while they are driving is asking for
     an answer they cannot give, and it would time out having taken tilt
     away from them for six seconds of an actual run. It waits instead. */
  if (state === DRIVING) {
    tiltCal.pending = true;
    if (force) showNote('Tilt calibration will run when this run ends.', 3);
    return false;
  }
  tiltCal.pending = false;
  tiltCal.phase = CAL_SETTLE;
  tiltCal.base = tilt.rawDeg === null ? 0 : tilt.rawDeg;
  tiltCal.still = 0;
  tiltCal.waited = 0;
  tiltCal.peak = 0;
  tiltCal.said = 0;
  tilt.value = 0;
  return true;
}

/* The skip, and every route out that is not a reading comes through here.
   A skip writes NOTHING: the source default stands and the next enable is
   free to ask again, which is the correct behaviour for somebody who was
   in the middle of something rather than somebody who has an opinion. */
function endTiltCal(flash) {
  if (!tiltCalRunning()) return false;
  tiltCal.phase = flash ? CAL_DONE : CAL_OFF;
  tiltCal.said = flash ? 1.1 : 0;
  tiltCal.ok = false;
  // Whatever posture they are in now is the zero, so a skip still leaves
  // tilt usable rather than referenced to a posture from a minute ago.
  calibrateTilt();
  return true;
}

/* The reading, and the ONLY place a direction is ever derived from a
   handset. `rel` is how far the reading moved from the posture, and the
   player was asked to move LEFT, so the sign that must come out of
   tiltSteer for that reading is negative. rel * sign < 0 gives
   sign = -Math.sign(rel), and the stored flip is that against the source
   default rather than an absolute, which is what makes a later change to
   TILT_DIRECTION safe. */
function tiltCalSign(rel) { return -Math.sign(rel) || FEEL.TILT_DIRECTION; }

function settleTiltCal(rel) {
  const want = tiltCalSign(rel);
  tiltCal.phase = CAL_DONE;
  tiltCal.said = 1.4;
  tiltCal.ok = true;
  tilt.zeroDeg = tiltCal.base;
  tilt.value = 0;
  setTiltFlipped(want !== FEEL.TILT_DIRECTION, true);
}

function updateTiltCal(dt) {
  if (tiltCal.said > 0) {
    tiltCal.said -= dt;
    if (tiltCal.said <= 0 && tiltCal.phase === CAL_DONE) tiltCal.phase = CAL_OFF;
  }
  if (tiltCal.pending && tiltCal.phase === CAL_OFF && state !== DRIVING) {
    tiltCal.pending = false;
    startTiltCal(true);
  }
  if (!tiltCalRunning()) return;
  // Tilt is switched off underneath it, or the sensor never turned up.
  if (!tilt.active) { tiltCal.phase = CAL_OFF; tiltCal.pending = false; return; }
  tiltCal.waited += dt;
  if (tilt.rawDeg === null) return;

  if (tiltCal.phase === CAL_SETTLE) {
    /* Still means still. Any movement past the deadzone restarts the
       count, so the movement of picking the phone up and looking at it
       can never be read as the answer. */
    if (Math.abs(tilt.rawDeg - tiltCal.base) > FEEL.TILT_DEADZONE_DEG) {
      tiltCal.base = tilt.rawDeg;
      tiltCal.still = 0;
    } else {
      tiltCal.base += (tilt.rawDeg - tiltCal.base) * 0.25;   // settle onto the posture
      tiltCal.still += dt;
      if (tiltCal.still >= FEEL.TILT_CAL_SETTLE) tiltCal.phase = CAL_READ;
    }
  } else {
    const rel = tilt.rawDeg - tiltCal.base;
    if (Math.abs(rel) > Math.abs(tiltCal.peak)) tiltCal.peak = rel;
    // Decided the moment the wrist gets there, because waiting out a
    // fixed window when the answer is already in is what makes a thing
    // feel like a form to fill in.
    if (Math.abs(rel) >= FEEL.TILT_CAL_ANGLE) { settleTiltCal(rel); return; }
  }

  if (tiltCal.waited < FEEL.TILT_CAL_SECONDS) return;
  // Out of time. A small but real movement is still an answer; anything
  // less said nothing and the source default keeps the job.
  if (Math.abs(tiltCal.peak) >= FEEL.TILT_CAL_MIN_DEG) settleTiltCal(tiltCal.peak);
  else endTiltCal(true);
}

function updateTilt(dt) {
  if (!tilt.active) return;

  if (!tilt.seenSensor) {
    tilt.waitedFor += dt;
    if (tilt.waitedFor > FEEL.TILT_SENSOR_TIMEOUT) {
      disableTilt();
      tilt.supported = false;
      tiltBtn.hidden = true;
      showNote('No motion sensor on this device.', 4);
    }
    return;
  }
  if (tilt.rawDeg === null || tilt.zeroDeg === null) return;
  /* NOTHING WHILE THE GESTURE IS BEING READ. The direction is exactly
     what is not known yet, so steering from it would be a coin toss
     against the player's own wrist. Touch and keys are untouched, so the
     game stays fully playable through the whole of it. */
  if (tiltCalRunning()) { tilt.value = 0; return; }

  /* rawDeg is already through tiltReading, so this passes it back in at
     angle 0, where tiltReading is the identity. One function decides the
     steering value and the assertions drive that same function. */
  const target = tiltSteer(tilt.rawDeg, 0, 0, tilt.zeroDeg);
  const k = 1 - Math.exp(-dt / FEEL.TILT_SMOOTHING_TIME);
  tilt.value += (target - tilt.value) * k;
}

function onTiltPermission(result) {
  if (result !== 'granted') {
    // Denial is sticky on iOS. Never let the button appear to do nothing.
    tilt.active = false;
    tiltBtn.classList.remove('on');
    storeSet('tilt', '0');
    showNote('Tilt was blocked. This browser will not ask again for this page.', 5);
    return;
  }
  if (!tilt.listening) {
    window.addEventListener('deviceorientation', onDeviceOrientation);
    tilt.listening = true;
  }
  tilt.active = true;
  tilt.waitedFor = 0;
  tilt.value = 0;
  tilt.zeroDeg = null;
  tiltBtn.classList.add('on');
  syncFlipBtn();
  storeSet('tilt', '1');
  /* THE FIRST ENABLE ON THIS DEVICE ASKS THE DEVICE WHICH WAY IT READS,
     and that gesture also captures the posture, so there is nothing left
     for a sentence about zeroing to say. Every later enable goes
     straight to driving with the answer already stored. */
  if (startTiltCal(false)) return;
  showNote('Tilt on. It zeroes to your posture at the start of every run.', 3);
}

function requestTilt() {
  // Must be called synchronously inside a gesture handler, with no async
  // work before it, or it silently fails. One path, both platforms.
  const DOE = window.DeviceOrientationEvent;
  const request = (DOE && typeof DOE.requestPermission === 'function')
    ? DOE.requestPermission()
    : Promise.resolve('granted');
  request.then(onTiltPermission, function () { onTiltPermission('denied'); });
}

function disableTilt() {
  tilt.active = false;
  tilt.value = 0;
  tiltBtn.classList.remove('on');
  syncFlipBtn();
}

/* Only visible while tilt is on. It is meaningless otherwise and the pad
   row is already tight on a phone held upright, which is why the
   stylesheet shrinks the pads twice on narrow screens. */
const padsEl = document.getElementById('pads');
function syncFlipBtn() {
  const show = !!(tilt.supported && tilt.active);
  flipBtn.hidden = !show;
  flipBtn.classList.toggle('on', tiltFlipped);
  // Six across does not fit at the ordinary size. See the stylesheet.
  padsEl.classList.toggle('six', show);
  // The row just changed size and contents, so the pointer has to be
  // told where the button went.
  measureTiltPad();
}

/* `quiet` is the calibration writing its result: the flash on the canvas
   has already said it and a note underneath would be the same sentence
   twice. Everything else about the two routes is identical, and
   deliberately so, because the stored value has to mean exactly one
   thing however it got there. */
function setTiltFlipped(on, quiet) {
  tiltFlipped = on;
  tiltFlipChosen = true;
  syncFlipBtn();
  storeSet(TILT_FLIP_KEY, on ? '1' : '0');
  if (quiet) return;
  showNote(on ? 'Tilt reversed. Tap again to put it back. Hold to set it from the phone.'
              : 'Tilt back to the default direction. Hold to set it from the phone.', 3);
}

/* TAP REVERSES, HOLD RE CALIBRATES. Section 8.4 asks for a recalibrate
   that cannot be triggered by accident, and a hold on the button that
   already owns the tilt direction is exactly that: no second pad, no
   settings screen, and the two actions are the same question asked
   coarsely and precisely. A hold does not also fire the tap, which is why
   the reversal moved out of the click handler and into pointerup. */
let flipHeld = -1;              // negative means no finger down
let flipFired = false;
flipBtn.addEventListener('pointerdown', function (e) {
  e.stopPropagation();
  resumeAudio();
  flipHeld = 0;
  flipFired = false;
  if (flipBtn.setPointerCapture) { try { flipBtn.setPointerCapture(e.pointerId); } catch (err) {} }
});
function endFlipPress(fire) {
  flipBtn.blur();
  const held = flipHeld;
  flipHeld = -1;
  if (!fire || flipFired || held < 0) return;
  setTiltFlipped(!tiltFlipped);
}
flipBtn.addEventListener('pointerup', function (e) { e.stopPropagation(); endFlipPress(true); });
flipBtn.addEventListener('pointercancel', function (e) { e.stopPropagation(); endFlipPress(false); });
// The click still has to be swallowed, or it reaches the canvas and
// starts a run behind the button.
flipBtn.addEventListener('click', function (e) { e.stopPropagation(); });

function updateFlipHold(dt) {
  if (flipHeld < 0) return;
  flipHeld += dt;
  if (flipFired || flipHeld < FEEL.TILT_CAL_HOLD) return;
  flipFired = true;
  startTiltCal(true);
}

tiltBtn.addEventListener('pointerdown', function (e) {
  e.stopPropagation();
});
tiltBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  // Drop focus, or the next space or enter meant for the game activates
  // the button again instead of starting the run.
  tiltBtn.blur();
  stopTiltHint(true);
  if (tilt.active) {
    disableTilt();
    storeSet('tilt', '0');
    showNote('Tilt off.', 2);
  } else {
    requestTilt();
  }
});

/* Seconds of pulse left. Zero means never, or never again. */
let tiltHintLeft = 0;
function stopTiltHint(remember) {
  tiltHintLeft = 0;
  tiltBtn.classList.remove('hint');
  if (remember) storeSet('tilthint', '1');
}
function updateTiltHint(dt) {
  if (tiltHintLeft <= 0) return;
  /* ONLY WHILE THE CAR IS MOVING. The ring keeps breathing on the title
     screen and between runs for as long as it takes, and the budget is
     spent on the road, where the words belong and where somebody is
     actually looking at the bottom of the screen. */
  if (state !== DRIVING || paused) return;
  tiltHintLeft -= dt;
  if (tiltHintLeft <= 0) stopTiltHint(false);
}

/* How much of the message is on screen, 0 to 1: up over TILT_HINT_IN and
   away over TILT_HINT_FADE, so it arrives and leaves rather than
   appearing and cutting. Zero everywhere it must not show, and the whole
   of that rule is here rather than spread through the drawing. */
function tiltHintAlpha() {
  if (tiltHintLeft <= 0 || !tilt.supported || tilt.active) return 0;
  if (state !== DRIVING || paused || tiltCalOnScreen() || tiltPad.w <= 0) return 0;
  const shown = FEEL.TILT_HINT_SECONDS - tiltHintLeft;
  const up = clamp(shown / Math.max(0.01, FEEL.TILT_HINT_IN), 0, 1);
  const out = clamp(tiltHintLeft / Math.max(0.01, FEEL.TILT_HINT_FADE), 0, 1);
  return Math.min(up, out) * FEEL.TILT_HINT_ALPHA;
}

/* WHERE THE TILT BUTTON IS, in CSS pixels, measured rather than derived.
   The pad row is sized in the stylesheet with media queries on it and the
   flip button appears beside it later, which shifts everything, so there
   is no expression on the canvas side that could work this out. Read on
   a resize and again whenever the row's contents change, so the draw loop
   never touches layout. */
const tiltPad = { cx: 0, top: 0, w: 0, h: 0 };
function measureTiltPad() {
  const box = (typeof tiltBtn !== 'undefined' && tiltBtn && !tiltBtn.hidden)
    ? tiltBtn.getBoundingClientRect() : null;
  if (box && box.width > 0) {
    tiltPad.cx = box.left + box.width / 2;
    tiltPad.top = box.top;
    tiltPad.w = box.width;
    tiltPad.h = box.height;
  } else {
    tiltPad.w = 0;
    tiltPad.h = 0;
  }
}

/* The preference persists, the grant does not: most iOS versions want a
   fresh gesture every page load, so re-request on the first one. */
let wantsTilt = storeGet('tilt') === '1';
let gestureUsed = false;
function firstGesture() {
  resumeAudio();
  if (gestureUsed) return;
  gestureUsed = true;
  // Both of these need a real gesture behind them, and this is the only
  // place that is guaranteed to have one.
  startAudio();
  if (wantsTilt && tilt.supported) requestTilt();
}

tilt.supported = detectTiltSupport();
tiltBtn.hidden = !tilt.supported;
measureTiltPad();

// Only where there is a sensor to find, and only until it has been found.
if (tilt.supported && storeGet('tilthint') !== '1') {
  tiltHintLeft = FEEL.TILT_HINT_SECONDS;
  tiltBtn.classList.add('hint');
}


/* ------------------------------------------------------------------
   Frame rate counter, toggled with the button or the F key, so it can
   be measured on a real device rather than assumed on this one.
   ------------------------------------------------------------------ */
const pauseBtn = document.getElementById('pauseBtn');
const tunerEl = document.getElementById('tuner');

/* The pause button lives inside #chrome, which already has the
   pointer-events discipline described in the stylesheet. That is the whole
   reason it is there and not in a container of its own. */
pauseBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
pauseBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  pauseBtn.blur();
  resumeAudio();
  togglePause();
});
/* Live tuning, behind ?debug=1 and completely absent otherwise. Tuning by
   playing has been the most useful thing on this project and it went away
   with the FPS button, so it comes back on a URL rather than on a control
   the audience can find. The F key still works once the parameter is
   present, so it can be toggled off mid run without editing the URL. */
const debugAllowed = (function () {
  try {
    const q = window.location.search;
    return /[?&]debug=1(&|$)/.test(q);
  } catch (e) { return false; }
})();
let showDebug = false;
let fpsFrames = 0, fpsElapsed = 0, fpsWorst = 0, fpsShown = 0, fpsWorstShown = 0;

/* ==================================================================
   ?probe=1, AND IT EXISTS BECAUSE OF A BUG NOBODY HERE CAN REPRODUCE.

   A player on iPhone Safari reported a dark rounded rectangle appearing
   mid screen, right of centre, while playing. Neither the author nor
   this session can reproduce it: there is no iPhone on this project and
   the shape does not appear on any engine available here.

   So rather than guess, this makes the page describe itself. It outlines
   EVERY element that is over the canvas or can take a pointer, labels
   each one, and prints a readout of what the browser thinks each one is
   doing: computed display, visibility, opacity, its rectangle, and
   whether it is genuinely the topmost thing at its own centre. One
   screenshot from the affected phone then identifies the culprit by
   name, or shows that the culprit is not in this list at all, which is
   itself the answer: if nothing is outlined where the rectangle is, the
   rectangle is not ours and it is the platform's own callout.

   IT IS OFF UNLESS ASKED FOR, it never takes a pointer, and it is the
   same shape as ?debug=1 so there is nothing new to learn. */
const probeAllowed = (function () {
  try { return /[?&]probe=1(&|$)/.test(window.location.search); }
  catch (e) { return false; }
})();

/* Everything that is not the canvas and could conceivably paint. The
   selector is deliberately broad: an element that SHOULD never show is
   exactly the one worth outlining, so hidden ones are listed too and
   marked. */
const PROBE_WHAT = '#chrome, #buttons, #tuner, #tuner button, #note, #pads,'
                 + ' .padGroup, #pads button, #boot, #boot svg, #credit,'
                 + ' #credit svg, #safe, canvas';

let probeBox = null;
function probeStart() {
  if (!probeAllowed || probeBox) return;
  probeBox = document.createElement('div');
  probeBox.id = 'probe';
  probeBox.style.cssText =
    'position:fixed;left:0;top:0;right:0;bottom:0;z-index:9;pointer-events:none;'
    + 'font:600 10px/1.25 system-ui,-apple-system,sans-serif';
  document.body.appendChild(probeBox);
  probeTick();
  /* On a timer rather than in the frame loop, so it cannot cost the game
     a frame and cannot be the thing being diagnosed. */
  setInterval(probeTick, 500);
}

function probeVisible(el, cs, r) {
  return cs.display !== 'none' && cs.visibility !== 'hidden'
      && parseFloat(cs.opacity) > 0.01 && r.width > 0 && r.height > 0;
}

function probeTick() {
  if (!probeBox) return;
  const els = document.querySelectorAll(PROBE_WHAT);
  const lines = [];
  let html = '';
  let n = 0;
  els.forEach(function (el) {
    const cs = getComputedStyle(el);
    const r = el.getBoundingClientRect();
    const shown = probeVisible(el, cs, r);
    const name = el.id ? '#' + el.id
               : (el.className && typeof el.className === 'string'
                  ? '.' + el.className.split(' ')[0] : el.tagName.toLowerCase());
    /* Is it actually the thing under its own middle? A yes on an element
       that should be invisible is the Beakdown failure: a transparent
       overlay eating taps. */
    let top = '';
    if (shown && r.width > 0) {
      const hit = document.elementFromPoint(
        Math.min(innerWidth - 1, Math.max(0, r.left + r.width / 2)),
        Math.min(innerHeight - 1, Math.max(0, r.top + r.height / 2)));
      top = hit === el ? 'HIT' : (hit ? 'under ' + (hit.id || hit.tagName.toLowerCase()) : '-');
    }
    lines.push(name + (el.hidden ? '[hidden]' : '') + ' '
      + (shown ? 'SHOWN' : 'gone') + ' '
      + Math.round(r.left) + ',' + Math.round(r.top) + ' '
      + Math.round(r.width) + 'x' + Math.round(r.height)
      + ' op' + (+cs.opacity).toFixed(2) + ' pe:' + cs.pointerEvents
      + (cs.backdropFilter && cs.backdropFilter !== 'none' ? ' BACKDROP' : '')
      + (top ? ' ' + top : ''));
    if (!shown || r.width <= 0) return;
    n++;
    const hue = (n * 61) % 360;
    html += '<div style="position:fixed;left:' + r.left + 'px;top:' + r.top
         + 'px;width:' + Math.max(0, r.width - 2) + 'px;height:' + Math.max(0, r.height - 2)
         + 'px;border:1px solid hsl(' + hue + ',100%,60%);box-sizing:border-box"></div>'
         + '<div style="position:fixed;left:' + r.left + 'px;top:' + Math.max(0, r.top - 11)
         + 'px;color:hsl(' + hue + ',100%,70%);background:#000;padding:0 2px">'
         + name + '</div>';
  });
  let ua = '';
  try { ua = navigator.userAgent; } catch (e) { ua = 'unknown'; }
  /* THE ONE THING THIS HAS TO PROVE IS THAT THE FIX IS LIVE ON HIS
     PHONE. A screenshot that says callout:none is a screenshot that
     rules the callout out; one that says anything else says the CSS
     never reached him. */
  const csBody = getComputedStyle(document.body);
  const callout = csBody.webkitTouchCallout || csBody.getPropertyValue('-webkit-touch-callout')
                || 'not supported';
  /* Anchored to the BOTTOM and above the pads, so the middle of the
     screen stays clear. That is where the rectangle was reported and
     covering it with the readout would defeat the whole exercise. */
  html += '<div style="position:fixed;left:4px;bottom:92px;right:4px;color:#fff;'
       + 'background:rgba(0,0,0,0.72);padding:4px;'
       + 'white-space:pre-wrap;word-break:break-all">'
       + escapeProbe(innerWidth + 'x' + innerHeight + ' dpr' + (window.devicePixelRatio || 1)
           + '  callout:' + callout + '\n' + ua + '\n' + lines.join('\n'))
       + '</div>';
  probeBox.innerHTML = html;
}

function escapeProbe(str) {
  return String(str).replace(/[&<>]/g, function (c) {
    return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;';
  });
}

probeStart();

/* The readout sits under the button row, which wraps to two lines on a
   narrow phone, so its height is measured rather than assumed. */
let hudTop = 54;
function measureChrome() {
  const box = document.getElementById('buttons').getBoundingClientRect();
  if (box.height > 0) hudTop = Math.round(box.bottom) + 8;
}

/* No button. The counter is a development tool and the F key is enough
   for it, where a permanent button on a phone is one more thing between
   the player and the road. */
function setDebug(on) {
  if (on && !debugAllowed) return;
  showDebug = on;
  tunerEl.hidden = !on;
  fpsFrames = 0; fpsElapsed = 0; fpsWorst = 0;
  if (on) window.requestAnimationFrame(measureChrome);
}
function sampleFps(rawDt) {
  fpsFrames++;
  fpsElapsed += rawDt;
  if (rawDt > fpsWorst) fpsWorst = rawDt;
  if (fpsElapsed >= 0.5) {
    fpsShown = fpsFrames / fpsElapsed;
    fpsWorstShown = fpsWorst * 1000;
    fpsFrames = 0; fpsElapsed = 0; fpsWorst = 0;
  }
}


/* ------------------------------------------------------------------
   Live camera tuning. The camera can only be judged by driving, so the
   four LIVE constants are adjustable from the road, on a phone, behind
   the same toggle as the frame rate counter. The readout on the canvas
   is the whole answer: screenshot it and the numbers are reportable.

   The values persist, so a reload in the middle of a tuning session does
   not throw the work away. That could hide stale numbers behind a hidden
   panel, so the button reads FPS* whenever anything is off default.
   ------------------------------------------------------------------ */
let tuneIndex = 0;

function tunerLine(group) {
  let out = '';
  for (let i = 0; i < TUNABLES.length; i++) {
    const t = TUNABLES[i];
    if (t.group !== group) continue;
    out += (i === tuneIndex ? '▸' : ' ') + t.label + ' ' + FEEL[t.key].toFixed(t.dp) + '  ';
  }
  if (group === 1) {
    // The deadzone only means anything as a share of the usable span.
    out += '(' + Math.round(deadShare() * 100) + '% dead)';
    if (deadShare() > FEEL.TILT_DEADZONE_WARN) out += ' SHRINK DEAD';
  }
  if (group === 2) {
    out += 'slide ' + worstOvershoot().toFixed(2)
        + '/' + (FEEL.OFF_ROAD - FEEL.SCRAPE_START).toFixed(2);
  }
  if (group === 3) {
    // Below this the flare loses to the width one segment gains by being
    // nearer, and the cliff stops being visible at all.
    out += 'min ' + Math.round(660000 / FEEL.CAMERA_DISTANCE);
  }
  if (group === 5) {
    /* The ceiling, live. The share of full steering lock the hardest
       corner on the road consumes just to hold a line, against the largest
       curvature the generator has actually produced and after the scale,
       rather than against the constant. At 1.00 that corner cannot be
       driven at all however well it is driven. */
    const peak = maxCurveSeen * curveScale;
    out += 'ceil ' + (peak * FEEL.CENTRIFUGAL).toFixed(2) + ' @' + peak.toFixed(1);
  }
  if (group === 12) {
    out += 'clock ' + clock.toFixed(1) + '  banked ' + banked + '  biome ' + biome;
  }
  if (group === 13) {
    // The world reaction, live, because an intensity that cannot be seen
    // as a number beside the thing it is driving cannot be tuned.
    out += 'heat ' + worldHeat.toFixed(2) + '  pulse ' + heatPulse.toFixed(2)
        + '  ×' + multiplier.toFixed(1);
  }
  if (group === 15) {
    out += 'best ' + bestScore + (bestKnown ? '' : ' (none)')
        + (beatBest ? ' BEATEN' : '') + '  shake ' + shake.toFixed(1);
  }
  if (group === 18) {
    // The chain, live, because it is the one thing here that has to be
    // watched while driving to know whether the numbers are right.
    out += 'link ' + chainLinks + ' tier ' + chainTier + ' said@' + chainSaidAt
        + '  runBest ' + runBestChain
        + '  held ' + chainTime.toFixed(1) + 's  lapse ' + chainLapse.toFixed(2) + 's';
  }
  if (group === 21) {
    out += 'city ' + cityGlow.toFixed(2) + '  slip ' + drift.slipNorm.toFixed(2)
        + '  link ' + chainLinks;
  }
  if (group === 22) {
    out += 'throb ' + cityPulse.toFixed(2);
  }
  if (group === 23) {
    // The flight, live. Apex and hang time are what the launch speed and
    // the gravity actually mean, and neither is readable from the pair.
    const apex = FEEL.JUMP_LAUNCH_V * FEEL.JUMP_LAUNCH_V / (2 * FEEL.JUMP_GRAVITY);
    out += 'apex ' + Math.round(apex) + '  hang '
        + (2 * FEEL.JUMP_LAUNCH_V / FEEL.JUMP_GRAVITY).toFixed(2) + 's'
        + (airborne ? '  UP ' + Math.round(carY) : '  down');
  }
  if (group === 25) {
    out += 'at ' + biome + '/' + BIOMES.length + '  hue ' + Math.round(biomeHue(biome))
        + '  bag ' + biomeBag.length;
  }
  if (group === 27) {
    out += (mode === DAILY
      ? 'gates ' + gatesPassed + '/' + dailyGates
        + '  finish @' + finishSeg + ' (' + Math.round(finishClock()) + 's)'
        + '  to go ' + Math.max(0, finishSeg - carSegIndex)
      : 'endless, no finish');
  }
  if (group === 26) {
    // The ghost, live, because a replay that is somewhere else cannot be
    // tuned against a number that is not on screen.
    out += (mode === DAILY ? 'TRACK #' + trackNumber(todayStamp) + ' ' + todayStamp
                           : 'RANDOM, no ghost')
        + (ghost.live ? '  line ' + ghost.n + ' pts ' + dailyGhostBytes + 'B' : '  no line')
        + (ghost.shown ? '  gap ' + Math.round((ghost.pos - position) / 100) + 'm'
                       + (ghost.ahead ? ' ahead' : ' behind') : '')
        + (ghostRec.live ? '  REC ' + ghostRec.n : '  not recording');
  }
  if (group === 24) {
    let next = -1;
    for (let i = 0; i < jumps.length; i++) {
      if (!jumps[i].done) { next = jumps[i].from - carSegIndex; break; }
    }
    out += 'live ' + jumps.length + (next >= 0 ? '  next ' + next : '  none')
        + '  due ' + (jumpDue - segBase - segments.length)
        + (jumpUnlocked() ? '' : '  LOCKED');
  }
  if (group === 20) {
    out += 'cont ' + continues + (cpValid ? '  gate@' + cpSeg + ' t' + cpTime.toFixed(0) + 's' : '  no gate')
        + '  far ' + furthest + 'm' + (skipOnRamp ? '  NO RAMP' : '');
  }
  if (group === 8) {
    // What is actually on the road in front of you, live, because spawn
    // rates cannot be tuned against a number that is not visible.
    let b = 0, sp = 0, m = 0;
    for (let i = 0; i < hazards.length; i++) {
      if (hazards[i].kind === HAZ_BLOCKER) b++;
      else if (hazards[i].kind === HAZ_SPLITTER) sp++; else m++;
    }
    out += 'live ' + b + '/' + sp + '/' + m;
  }
  if (group === 6) {
    // Seconds of road still in frame, ahead of the car. Below the 3.5 of
    // section 4.3 the corner cannot be planned for, whatever the
    // difficulty says, and see the note above CAMERA_HEIGHT for why this
    // is bounded by the curve scale rather than by the camera.
    const secs = sightSeg < 0
      ? FEEL.DRAW_DISTANCE_SEGMENTS * FEEL.SEGMENT_LENGTH / FEEL.SPEED
      : sightSeg * FEEL.SEGMENT_LENGTH / FEEL.SPEED;
    out += 'sight ' + secs.toFixed(1) + 's' + (sightSeg < 0 ? '+' : '');
  }
  return out;
}

function deadShare() {
  return FEEL.TILT_DEADZONE_DEG / Math.max(0.01, FEEL.TILT_FULL_LOCK_DEG);
}

/* How far the car keeps running outwards after the driver slams the lock
   the other way, in road half widths, worst case.

   Reversing sets a new target of minus the current sideways speed, so the
   speed follows v0 minus 2 v0 exp(minus t over tau), which reaches zero at
   tau ln2, and the ground covered getting there is 0.31 v0 tau rather than
   the v0 tau a first guess gives. Compared against the width of the scrape
   band, this is the number that says whether the current STEER_RATE and
   GRIP_TIME leave a mistake recoverable. Worst case is full lock outwards
   with the hardest corner pushing the same way, on the narrowest road. */
const REVERSAL_FACTOR = 0.31;
function worstOvershoot() {
  const v = FEEL.STEER_RATE
          * (1 + FEEL.CURVE_HARD * curveScale * FEEL.CENTRIFUGAL)
          / FEEL.ROAD_WIDTH_NARROW;
  return REVERSAL_FACTOR * v * FEEL.GRIP_TIME;
}

/* ------------------------------------------------------------------
   Difficulty, live. Everything here is a function of runTime and of one
   adaptation value, and everything that reads the road reads these
   rather than the constants.
   ------------------------------------------------------------------ */
let runTime = 0;          // seconds of the current run, DRIVING only
let titleTime = 0;        // seconds on the title screen, for the blink
/* HOW MANY RUNS THIS BROWSER HAS EVER STARTED, and the whole of what
   is left of difficulty easing.

   WHAT WENT, AND WHY. There used to be an adaptive `ease` here that rose
   when a run ended quickly and fell when one got through the on ramp. It
   was already held off the daily so the shared road stayed shared, and
   it was still the wrong shape: the moment a road differs by how the
   player has been doing, two people's scores stop being comparable and
   the ghost and the share are both measuring nothing. It also could not
   be reasoned about, because no two players and no two sessions had the
   same road.

   WHAT REPLACES IT reads nothing about how anybody drove. The first
   FIRST_RUNS runs get a gentler ramp AFTER the opening, and run four
   onwards is the same game for everybody, for ever. A count, not a
   judgement.

   STORED, so it survives a reload, which is the whole point of "the
   first three runs this browser has ever seen". When storage is
   unavailable the read fails and every run is a first run, which is the
   correct direction to fail in: a locked down profile gets the gentler
   ramp rather than the deep game. */
let runsEver = 0;

/* Tracks finished, ever, across every day. Monotonic by construction.
   See bankDaily: written now, displayed in a later session. */
let finishedEver = 0;
function loadFinishedEver() {
  const v = parseInt(storeGet('finished'), 10);
  finishedEver = isFinite(v) && v > 0 ? v : 0;
}

function loadRunsEver() {
  const v = parseInt(storeGet('runs'), 10);
  runsEver = isFinite(v) && v > 0 ? v : 0;
}

function countRun() {
  runsEver++;
  storeSet('runs', String(runsEver));
}

/* 1 while this is one of the first runs, 0 after. Read through this
   everywhere rather than comparing the count in place.

   IT APPLIES ON THE DAILY TOO, and the adaptation it replaced could not.
   That is the point of it being a fixed count: everybody's first three
   runs are eased by exactly the same amount, so the road a beginner
   drives on their fourth run is the road everybody else is driving, and
   the first three were the same first three for all of them. */
function firstRunEase() { return runsEver <= FEEL.FIRST_RUNS ? 1 : 0; }

/* THE UNFAILABLE OPENING, in one place, so nothing has to remember the
   rule. A continue is past it by definition: skipOnRamp says the player
   has already driven the road once and is resuming, not starting. */
function inOpening() {
  return !skipOnRamp && runTime < FEEL.OPENING_SECONDS;
}

/* THE HANDOVER, and it is the whole difficulty of this feature.

   MEASURED, TWICE. The protection lifting must not itself be lethal, and
   the first two attempts both were. Held at the lip, the car was already
   off the road the instant the rules resumed and thirty two driven cases
   out of thirty three died on the last frame of the window. Held inside
   the band instead, the position was fine and they ALL STILL DIED on the
   same frame, because the scrape meter had been pinned at its limit for
   twenty seconds and one more frame of dt took it over.

   So the meter is handed over empty. The player who arrives at twenty
   seconds leaning on the edge gets the whole of SCRAPE_TIME_LIMIT to
   come off it, which is the same thing any other player gets for
   entering the band. Nothing is teleported, nothing changes on screen;
   the rules simply start counting from zero. */
let wasInOpening = false;
function openingHandover() {
  const now = inOpening();
  if (wasInOpening && !now) scrapeMeter = 0;
  wasInOpening = now;
}

/* Nothing may be PLACED before the opening is over either, and this is
   the floor under every unlock time rather than a set of edited
   constants. Tuning BLOCKER_TIME back under the opening on a phone would
   otherwise quietly put a blocker inside it. */
function unlockAt(seconds) { return Math.max(FEEL.OPENING_SECONDS, seconds); }

/* CALLED THE INSTANT A RUN ENDS, by both the crash and the line, and it
   is where the share card is started.

   NOT WHEN THE BUTTON IS DRAWN, which is where this began and which was
   measured to be too late. toBlob encodes off the main thread but
   delivers its callback as a task, and on the frames right after a
   finale, with the fireworks running, that task was measured arriving
   between 500 and 1500 milliseconds later. A player who taps SHARE
   quickly would have got the plain text share and never known why.

   Started here it has the whole of the finale, the result roll and the
   input lock to finish in, which on any machine is several seconds.
   buildShareCardSoon is keyed on the result, so the drawShareButton call
   that remains is a free safety net rather than a second build. */
function onRunEnded() {
  buildShareCardSoon();
}

/* ------------------------------------------------------------------
   THE CLOCK THE ROAD IS BUILT AGAINST, AND WHY THE DAILY NEEDS ITS OWN.

   In ENDLESS it is the run's elapsed time, exactly as it always has
   been, and nothing about endless changes.

   ON THE DAILY IT IS DISTANCE. Elapsed time is a property of the PLAYER,
   not of the road: a scrape costs speed, so does a bad landing, so two
   players reach segment five thousand at measurably different moments,
   and every input the generator reads off the clock would then differ
   between them. The phrase it picks, whether it owes a breath, how wide
   it builds the road, whether a hazard or a jump has unlocked yet: all of
   it. The daily road has to be a property of the DAY, so on the daily
   every one of those becomes a pure function of the seed and the segment
   index, and nothing the player does can move it.

   SPEED / SEGMENT_LENGTH is the nominal segments a second, so on a clean
   run the two clocks agree to within a few per cent and the escalation
   feels exactly as it always has.

   Two callers, two indices. The GENERATOR asks about the segment it is
   about to build; the live difficulty asks about the segment the car is
   on. Both are the same for every player at the same place. */
function roadClock(segIndex) {
  if (mode !== DAILY) return runTime;
  return segIndex * FEEL.SEGMENT_LENGTH / FEEL.SPEED;
}
function buildClock() { return roadClock(segBase + segments.length); }
function liveClock() { return roadClock(carSegIndex); }

/* How far through the on ramp, 0 to 1. The flat part at the front is
   what adaptation lengthens; the far end does not move, so this reaches
   1 at ONRAMP_SECONDS for everyone regardless of the first run ease. */
function onRampProgress(t) {
  // A continue is past it by definition. See the continues block.
  if (skipOnRamp) return 1;
  const flat = FEEL.ONRAMP_FLAT + firstRunEase() * FEEL.FIRST_RUN_FLAT_EXTRA;
  const span = Math.max(1, FEEL.ONRAMP_SECONDS - flat);
  return clamp(((t === undefined ? runTime : t) - flat) / span, 0, 1);
}

/* And how far into the deep game after it, 0 to 1. No adaptation term
   anywhere in here, on purpose.

   ON THE DAILY THE SPAN IS THE TRACK. In endless the ramp reaches its
   peak at RAMP_SECONDS and everything after that is the same difficulty
   for as long as the player lasts, which is right for a road with no
   end. A finite track wants the opposite shape: it should still be
   climbing at the line, so the closing stretch is the hardest part of
   the day and the run builds to something. Measured, a seven gate track
   runs 223 seconds and the endless ramp would have finished at 130,
   leaving the last two fifths flat. */
function deepProgress(t) {
  const now = (t === undefined ? runTime : t);
  const span = mode === DAILY
    ? Math.max(1, finishClock() - FEEL.ONRAMP_SECONDS)
    : FEEL.RAMP_SECONDS;
  return clamp((now - FEEL.ONRAMP_SECONDS) / span, 0, 1);
}

/* The curve scale actually in force. FEEL.CURVE_SCALE stays the
   reference the ramp is built around and the cycler still tunes it, so
   moving it on a phone still moves the whole curve. */
let curveScale = FEEL.CURVE_SCALE;
let widthScale = 1;

function updateDifficulty() {
  const t = liveClock();
  /* CAPPED BY THE LEVEL. See levelHardP and levelHardD: a level says how
     far along the existing ramp it is allowed to get, so level one holds
     the on ramp values for its whole length and the last level is the
     game exactly as it was. In ENDLESS both are 1, because endless is
     not a level and has never had a ceiling. */
  const cap = mode === DAILY;
  const p = onRampProgress(t) * (cap ? levelHardP() : 1);
  const d = deepProgress(t) * (cap ? levelHardD() : 1);
  const e = firstRunEase();
  const start = Math.max(0.2, FEEL.ONRAMP_CURVE - e * FEEL.FIRST_RUN_CURVE_EASE);
  const base = start + (FEEL.CURVE_SCALE - start) * p;
  curveScale = base + (FEEL.CURVE_SCALE_DEEP - FEEL.CURVE_SCALE) * d;
  const wide = FEEL.ONRAMP_WIDTH + e * FEEL.FIRST_RUN_WIDTH_EASE;
  widthScale = (wide + (1 - wide) * p) + (FEEL.ROAD_SQUEEZE - 1) * d;
}

/* The hardest phrase the generator may reach for, and how often it owes
   a breath afterwards. Both open up across the run rather than at one
   step, so a new kind of corner arrives as a thing to learn rather than
   as a wall. */
function maxIntensity() {
  // The BUILD clock: this decides what goes on the road ahead, not what
  // is under the car.
  const t = buildClock();
  let n;
  if (!skipOnRamp && t < FEEL.ONRAMP_SECONDS) {
    // 0 and 1 only for most of the on ramp, then a taste of 2 at the end.
    n = onRampProgress(t) > 0.75 ? FEEL.ONRAMP_INTENSITY + 1 : FEEL.ONRAMP_INTENSITY;
  } else {
    n = FEEL.DEEP_INTENSITY;
  }
  /* AND A CEILING PER LEVEL, interpolated across the band the same way
     everything else about a level is. Level one never sees a phrase
     above the on ramp's own hardest; the last level sees everything. */
  if (mode !== DAILY) return n;
  const cap = FEEL.ONRAMP_INTENSITY
            + (FEEL.DEEP_INTENSITY - FEEL.ONRAMP_INTENSITY) * levelBand(level);
  return Math.min(n, Math.round(cap));
}

function restChance() {
  // The two halves meet at ONRAMP_REST/2 rather than stepping, or the
  // road audibly changes rhythm on the stroke of sixty seconds.
  const half = FEEL.ONRAMP_REST * 0.5;
  const t = buildClock();
  if (!skipOnRamp && t < FEEL.ONRAMP_SECONDS) {
    return FEEL.ONRAMP_REST - half * onRampProgress(t);
  }
  return half * (1 - deepProgress(t));
}

function tunerDirty() {
  for (let i = 0; i < TUNABLES.length; i++) {
    if (FEEL[TUNABLES[i].key] !== TUNABLE_DEFAULTS[TUNABLES[i].key]) return true;
  }
  return false;
}

function markTuning() {
  recomputeCamera();
}

/* ------------------------------------------------------------------
   TUNING PERSISTENCE, AND THE BUG IT CAUSED, WRITTEN DOWN SO IT CANNOT
   HAPPEN AGAIN.

   This block used to load stored tuning on EVERY page load, with no debug
   flag and nothing on screen to say so. The cycler exists so values can be
   settled on a real handset, which is exactly what was done with
   TILT_DIRECTION in session fourteen: it was nudged on a phone under
   ?debug=1, that nudge was written to localStorage, and from then on it
   was reapplied silently on every ordinary load and OVERRODE THE SOURCE.

   That is the whole of the tilt "regression" that came back three times.
   The source constant was correct and unchanged the entire time; the
   running game was reading a stored value nobody could see. Flipping the
   sign in the source could never have fixed it, because the stored value
   is applied afterwards and wins.

   Three things stop it:

     1. STORED TUNING IS ONLY APPLIED UNDER ?debug=1. A tuning session is a
        debug session and it does not get to follow the player into
        ordinary play. This is the fix; the other two are belt and braces.
     2. TILT_DIRECTION IS NEVER STORED AT ALL, marked noSave below. It is a
        correctness value rather than a feel value, and after four
        reversals the source is the only place it may live.
     3. THE STORAGE KEY IS VERSIONED. Bumping it abandons every blob
        written by an older build in one move, including the one currently
        overriding this player's tilt.

   And when tuning IS loaded, it says so on screen. Silence is what made
   this cost three sessions. */
const TUNE_KEY = 'tune3';

function saveTuning() {
  const out = {};
  TUNABLES.forEach(function (t) { if (!t.noSave) out[t.key] = FEEL[t.key]; });
  storeSet(TUNE_KEY, JSON.stringify(out));
}

function loadTuning() {
  // The one line that matters. See the block above.
  if (!debugAllowed) return;
  const raw = storeGet(TUNE_KEY);
  if (!raw) return;
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch (e) { return; }
  if (!parsed || typeof parsed !== 'object') return;
  let n = 0;
  TUNABLES.forEach(function (t) {
    if (t.noSave) return;
    const v = parsed[t.key];
    if (typeof v === 'number' && isFinite(v) && v !== FEEL[t.key]) {
      FEEL[t.key] = clamp(v, t.min, t.max);
      n++;
    }
  });
  if (n > 0) showNote(n + ' stored tuning values loaded. Press 0 or tap reset for the defaults.', 6);
}

function nudgeTuning(dir) {
  const t = TUNABLES[tuneIndex];
  const next = clamp(FEEL[t.key] + dir * t.step, t.min, t.max);
  FEEL[t.key] = parseFloat(next.toFixed(t.dp + 2));
  // Cutting the wheel into a different number of steps is a different set
  // of colours, so it is regenerated rather than left stale.
  if (t.key === 'BIOME_COUNT') { buildBiomes(); applyBiome(biome); }
  markTuning();
  saveTuning();
}

function selectTuning(dir) {
  tuneIndex = (tuneIndex + dir + TUNABLES.length) % TUNABLES.length;
}

function resetTuning() {
  TUNABLES.forEach(function (t) { FEEL[t.key] = TUNABLE_DEFAULTS[t.key]; });
  buildBiomes();
  applyBiome(0);
  markTuning();
  saveTuning();
}

/* ==================================================================
   THE TWO MODES.

   DAILY is one road that everybody in the world drives for the length of
   their own local day, and it is what makes a ghost worth recording,
   because a recorded line is only worth watching if it was driven on the
   road you are on. It is what a tap gets, for everybody.

   ENDLESS is the game as it has always been: a fresh road every run.
   THE PLAYER IS TOLD IT IS CALLED THE RANDOM TRACK, and the rename is
   the whole reason to mention it in a comment. "Endless" describes the
   ending, which only means something to somebody who has already played;
   "random" describes the ROAD, which is what a first timer is choosing
   between. The internal name is left alone because renaming a constant
   that appears in fifty places to match a button label buys nothing and
   risks a typo in each of them.

   THE SEED COMES FROM THE LOCAL DATE, NOT UTC, and that is a decision
   about the audience rather than about tidiness. UTC rolls over in the
   middle of the afternoon in the United States, which would hand a
   player a different track at lunchtime than at first period, and school
   children in the United States are the entire market. The local date is
   what a player means by today.
   ================================================================== */
const ENDLESS = 0, DAILY = 1;
/* THE DAILY IS THE DEFAULT FOR EVERYBODY, FIRST VISIT INCLUDED.

   It was briefly decided by whether the browser had played before, so a
   first timer got endless and a returning player got the daily. That is
   gone. It was more machinery than the question deserved and it made the
   thing worth coming back for depend on a localStorage key that this
   audience's locked down profiles frequently refuse to keep.

   ONE ROAD, EVERY VISITOR, AND STILL ONE TAP TO PLAY. Section 5 asks
   that the game start on one action and it does; it says nothing about
   which road, and today's is the better answer for everyone. The random
   road is the clearly marked second button.

   `mode` is still the single variable every route into a run reads, so
   the front door stays consistent by construction with no second code
   path to keep in step. */
let mode = DAILY;

/* The day as one integer, yyyymmdd, off the LOCAL clock. */
function localDayStamp(when) {
  const d = when || new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

/* And that integer hashed, so consecutive days are not consecutive roads.
   The stamp itself would give three near identical seeds in a row, and
   mulberry32 started at 20260803 and 20260804 produces two openings that
   are recognisably the same corner. */
function dailySeedFor(stamp) {
  let h = (stamp >>> 0) ^ 0x9e3779b9;
  h = Math.imul(h ^ (h >>> 16), 0x7feb352d);
  h = Math.imul(h ^ (h >>> 15), 0x846ca68b);
  return (h ^ (h >>> 16)) >>> 0;
}

let todayStamp = localDayStamp();
function dailySeed() { return dailySeedFor(todayStamp); }

/* ------------------------------------------------------------------
   THE TRACK NUMBER, AND THE COUNTDOWN TO THE NEXT ONE.

   Neither one changes a single thing about the road. They are both about
   the daily HAVING AN IDENTITY: a track with a number is a thing that
   happened on a particular day and can be talked about afterwards, and a
   number that goes up is a history the player is part of. A countdown is
   the return hook and it costs nothing to draw.

   THE EPOCH IS THE DAY THE DAILY ACTUALLY STARTED. Numbering from an
   invented earlier date would open at a bigger number and would be a
   claim about days of tracks that never existed. Move this constant if
   the game is ever relaunched with a history behind it; do not move it
   to look older than it is.
   ------------------------------------------------------------------ */
const DAILY_EPOCH = 20260802;        // track number one

/* Local noon, deliberately. Midnight plus a daylight saving jump lands on
   the previous day and would make the number stutter twice a year. */
function stampDate(stamp) {
  return new Date(Math.floor(stamp / 10000),
                  Math.floor(stamp / 100) % 100 - 1,
                  stamp % 100, 12, 0, 0, 0);
}

function trackNumber(stamp) {
  const days = Math.round((stampDate(stamp) - stampDate(DAILY_EPOCH)) / 86400000);
  return Math.max(1, days + 1);
}

/* Seconds to the next LOCAL midnight, which is when the seed rolls, for
   the same reason the seed is local in the first place. */
function untilNextTrack() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0);
  return Math.max(0, (next - now) / 1000);
}

/* Coarse on purpose. Nobody is timing the rollover to the second from
   seven hours out, and a seconds field ticking on the title screen is a
   thing the eye cannot stop reading. */
function countdownLabel() {
  const left = untilNextTrack();
  const h = Math.floor(left / 3600);
  const m = Math.floor((left - h * 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm';
  return Math.max(1, Math.floor(left)) + 's';
}

/* ------------------------------------------------------------------
   HOW LONG TODAY'S TRACK IS.

   Off the seed, hashed a second time with a different constant, so the
   length is not correlated with the road the same seed produces and two
   consecutive days do not tend toward the same length. Not from rng(),
   which belongs to the road generator, and not from the biome stream,
   which belongs to the palette: a third consumer of either would move
   what they produce.

   Held in a variable for the length of a run rather than recomputed,
   because the cycler can move the bounds mid session and a track that
   changed length under the car would be worse than either bound.
   ------------------------------------------------------------------ */
/* ==================================================================
   THE LEVELS.

   Three tracks a day, played in order, escalating. Everything about them
   is DERIVED from FEEL.LEVEL_COUNT so that changing it to two or four
   changes the game and not the code. Nothing below writes 3.

   Levels are ONE INDEXED throughout, because that is what is shown on
   screen and a level zero that means level one is the kind of thing that
   is right until somebody reads it.
   ================================================================== */
function levelCount() { return Math.max(1, Math.round(FEEL.LEVEL_COUNT)); }
function clampLevel(n) { return clamp(Math.round(n), 1, levelCount()); }

/* WHERE A LEVEL SITS BETWEEN EASY AND HARD, 0 to 1. The first level is
   0, the last is 1, and everything in between is spaced evenly. With one
   level only there is nothing to interpolate and it is the whole game,
   so it is 1. */
/* HOW HARD AND HOW LONG A LEVEL IS, as one number from nought at the
   first to one at the last. Everything that ramps across the day reads
   this: the gate count, the hazard density, the intensity, the finale's
   scale, and the guards that switch the clock and the hazards off
   entirely on level one.

   AND IT IS BENT, NOT LINEAR. Linear put level two exactly halfway,
   which measured as 57 seconds then 123: more than double the length AND
   the middle of the difficulty range, both arriving at once, for a
   player who had just cleared a level designed to be unfailable. Carl
   hit that wall and the times say why.

   A POWER ABOVE ONE COMPRESSES THE MIDDLE TOWARD THE START and leaves
   BOTH ENDS EXACTLY WHERE THEY WERE, which is the property that matters:
   band(first) is still 0 to the bit, so level one keeps its no clock and
   no hazards guards, and band(last) is still 1, so the last level keeps
   the full difficulty. Only the middle moves. */
/* AND IT SATURATES AT LEVEL_HARD_AT RATHER THAN AT THE LAST LEVEL, which
   is what lets the count grow without the curve stretching under it. The
   denominator is the hard level, not the count, so levels past it all
   come out at exactly 1 and are the same road at the same settings. */
function levelBand(lvl) {
  const n = levelCount();
  if (n <= 1) return 1;
  const hard = clamp(Math.round(FEEL.LEVEL_HARD_AT), 2, n);
  const t = clamp((clampLevel(lvl) - 1) / (hard - 1), 0, 1);
  return Math.pow(t, Math.max(0.1, FEEL.LEVEL_RAMP_POWER));
}

/* GATES PER LEVEL, AND THIS RAMP IS STRAIGHT.

   It used to interpolate across levelBand, which tied length to
   difficulty. That was invisible at three levels and wrong at five: the
   bent band put levels one and two at the same two gates, then stepped
   3, 5, 6, so two levels were the same length and the step into level
   four was twice the step either side of it.

   Straight across the whole count instead, so the gates come out 2 3 4 5
   6 and every level is one gate and 33.3 seconds longer than the one
   before it. The even step was the thing asked for and this is the only
   integer ramp from two to six over five levels that gives it.

   Rounded, and never fewer than one. */
function levelGatesFor(lvl) {
  const a = Math.max(1, Math.round(FEEL.LEVEL_GATES_FIRST));
  const b = Math.max(1, Math.round(FEEL.LEVEL_GATES_LAST));
  const n = levelCount();
  const t = n <= 1 ? 1 : (clampLevel(lvl) - 1) / (n - 1);
  return Math.max(1, Math.round(a + (b - a) * t));
}

/* A LEVEL'S OWN SEED. The day's seed hashed with the level, so the three
   roads have nothing to do with each other and all three are a pure
   function of the local date. Two devices on the same date generate the
   same three roads, which is the guarantee the ghost and the share both
   rest on, extended to all of them rather than weakened. */
function levelSeedFor(stamp, lvl) {
  let h = (dailySeedFor(stamp) ^ Math.imul(clampLevel(lvl), 0x85ebca6b)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0xc2b2ae35);
  h = Math.imul(h ^ (h >>> 13), 0x27d4eb2f);
  return (h ^ (h >>> 16)) >>> 0;
}

/* WHICH LEVEL IS BEING DRIVEN. Only ever set by the routes that start a
   run, and read by the road generator, the records, the ghost, the
   finale and the readouts. */
let level = 1;

/* THE TWO HALVES OF THE DIFFICULTY BAND, and this is what makes three
   levels three EXISTING configurations rather than three new ones.

   The run's own ramp already runs the road from the on ramp values up to
   the normal values, and then on from there to the deep values. A level
   simply says how far along that existing path it is allowed to get:

     hardP  how much of the ON RAMP the level may complete
     hardD  how much of the DEEP GAME it may reach

   The first half of the level range opens the on ramp and the second
   half opens the deep game, so at three levels they come out as (0,0),
