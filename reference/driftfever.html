    if (hi <= x - clip || lo >= x + clip) continue;
    h.hit = true;
    if (hi > x - core && lo < x + core) return 2;
    worst = 1;
    // The flash belongs on the side the hazard is, not the side of the
    // road the car happens to be on.
    hazardSide = carFrac < x ? -1 : 1;
  }
  return worst;
}

/* Two ways to die, and they no longer look the same.

   OFF_ROAD is a fall: the car slides over the lip and drops into the
   void, which is the whole point of a narrow slab at altitude and it is
   unchanged.

   HIT_OBJECT is an impact: the car stops dead, comes apart and throws
   debris, and the world holds still for a moment. A hazard was a solid
   thing that killed you by being touched, and it read as the game simply
   stopping. */
const OFF_ROAD = 0, HIT_OBJECT = 1;
let deathKind = OFF_ROAD;

function crash(kind) {
  deathKind = kind === HIT_OBJECT ? HIT_OBJECT : OFF_ROAD;
  audioCrash();
  runDistance = Math.round(position / 100);   // world units are centimetres
  bankScore();
  /* THE LINE IS KEPT WHETHER THE RUN WAS ANY GOOD OR NOT. A crash is
     still the most recent thing that happened on this road, and the
     ghost is the last run. See the ghost block header. */
  ghostBank();
  /* THE HINT SURVIVES A CRASH, and it did not used to. When it was a
     ring alone, one run was a fair chance to notice a button. Now that it
     carries the words that say what the button is FOR, dying is not the
     same as having read them: a first run can be over in four seconds
     and this is exactly the player the message exists for. The budget is
     ten seconds of DRIVING, spent across as many attempts as it takes,
     and using tilt is what ends it. See TILT_HINT_SECONDS. */
  onRunEnded();
  state = DEAD;
  deadFor = 0;
  restartWanted = false;
  scraping = false;
  /* Both lanes go quiet. A callout is feedback on driving and there is no
     driving any more, and leaving one to fade over the result screen is
     exactly the clutter the two lanes were built to avoid. */
  calloutLife = 0;
  driftLife = 0;
  breakChain();
  carFallV = 0;
  carY = 0;
  carPitch = 0;
  coastSpeed = FEEL.SPEED;
  if (deathKind === HIT_OBJECT) {
    explode();
  } else {
    addShake(FEEL.CRASH_SHAKE_PX);
  }
}

/* The fall. Cheap, because the car is already a box in the world: it just
   needs a height and a rotation about its own lateral axis.

   An impact does not fall. It stopped against something solid, so the
   car stays where it hit and the debris carries the motion instead. */
function updateFall(dt) {
  deadFor += dt;
  if (deathKind === HIT_OBJECT) return;

  coastSpeed *= Math.exp(-dt / FEEL.CRASH_COAST_TIME);
  position += coastSpeed * dt;
  carX += drift.lateralV * dt;

  const seg = segAt(Math.floor((position + FEEL.CAMERA_DISTANCE) / FEEL.SEGMENT_LENGTH));
  const localHalf = seg ? seg.hw : FEEL.ROAD_HALF_WIDTH_BASE;
  carFrac = carX / localHalf;

  // Nothing drops until it is actually past the lip, or the car would sink
  // through a road it is still standing on.
  if (Math.abs(carFrac) > EDGE_OUT) {
    carFallV += FEEL.CRASH_GRAVITY * dt;
    carY -= carFallV * dt;
    carPitch -= FEEL.CRASH_TUMBLE * dt;
  }
}


/* ==================================================================
   DRIFT FEEDBACK

   Section 7 calls tyre marks the highest value single effect in a drift
   game. They are stored on the road segments rather than in a list of
   their own, so they curve with the road for free and get thrown away
   with it.
   ================================================================== */
/* How far the car is turned, in radians, and the single source of it. The
   drawn body and the rear wheel contact points both read this, so the
   marks can never come off a car pointing somewhere else.

   Two terms, but only one of them is live. The first is the steering the
   driver is asking for. The second was the curvature of the road under
   the car, which is not physical and which is now zero, because a car
   that turns without being asked reads as the game steering for you. See
   CAR_CURVE_YAW. Nothing here may rotate the car off the driver's own
   input while that constant is zero. */
// Used by the drawing to ask "is the run over", so a finish counts.
function dead() { return state === DEAD || state === FINISHED; }

/* finaleSpin is the victory donut and it is zero on every frame of every
   run, so this is the same expression it always was while anybody is
   driving. It is added HERE rather than drawn separately so the body,
   the wheel contact points and therefore the marks all come off one
   angle: a car cannot spin without its marks spinning with it. */
function carYaw() {
  return drift.headingAngle * FEEL.CAR_YAW_GAIN + carCurve * FEEL.CAR_CURVE_YAW
       + finaleSpin;
}

/* Where the two rear wheels touch the road, in world units, given a centre
   position. They yaw with the body, so as the car comes sideways the pair
   swings apart and the two marks sweep away from each other. That
   divergence is the rotation, drawn. */
const rearContact = { left: 0, right: 0 };
function rearWheelOffsets(centreX) {
  const yaw = carYaw();
  const c = Math.cos(yaw), s = Math.sin(yaw);
  const trackHalf = FEEL.CAR_TRACK / 2;
  const shared = -FEEL.CAR_WHEELBASE / 2 * s;
  rearContact.left = centreX - trackHalf * c + shared;
  rearContact.right = centreX + trackHalf * c + shared;
  return rearContact;
}

function layTyreMarks(carIndex, prevX) {
  const alpha = (drift.slipNorm - FEEL.TYRE_MARK_MIN_SLIP) / (1 - FEEL.TYRE_MARK_MIN_SLIP);
  // The marks come off the rear axle, which is behind the car's centre, so
  // they start where the wheels are rather than where the middle is.
  const axleZ = position + FEEL.CAMERA_DISTANCE - FEEL.CAR_WHEELBASE / 2;
  const axleIndex = Math.floor(axleZ / FEEL.SEGMENT_LENGTH);
  if (alpha <= 0) { lastMarkSeg = axleIndex; return; }
  // Stored as the raw slip intensity from zero to one. The renderer turns
  // it into a colour and an alpha, because both now depend on it.
  const a = clamp(alpha, 0, 1);

  const prev = rearWheelOffsets(prevX);
  const pl = prev.left, pr = prev.right;
  const now = rearWheelOffsets(carX);

  // Fill in any segment the car stepped over this frame, so a long frame
  // does not punch a hole in the line.
  let from = axleIndex;
  if (lastMarkSeg >= 0 && axleIndex - lastMarkSeg > 0 && axleIndex - lastMarkSeg <= 4) {
    from = lastMarkSeg + 1;
  }
  for (let i = from; i <= axleIndex; i++) {
    const s = segAt(i);
    if (!s) continue;
    // Stored against this segment's own width, because that is what the
    // projection hands back when the segment is drawn.
    if (s.ma === 0) { s.ml0 = pl / s.hw; s.mr0 = pr / s.hw; }
    s.ml1 = now.left / s.hw;
    s.mr1 = now.right / s.hw;
    if (a > s.ma) s.ma = a;
  }
  lastMarkSeg = axleIndex;
}

/* Smoke is screen space. The car is pinned to one spot on screen, so
   there is nothing to gain from putting the puffs in the world, and a
   ring buffer of fixed objects means no allocation while sliding. */
let SMOKE_FILL = 'rgb(' + COLOUR.SMOKE + ')';
const smoke = [];
let smokeCount = 0;
let smokeHead = 0;
let smokeAcc = 0;
for (let i = 0; i < FEEL.SMOKE_MAX; i++) {
  smoke.push({ x: 0, y: 0, vx: 0, vy: 0, r: 0, life: 0 });
}

// Used by the finale skip, which has to leave nothing on the screen.
function clearSmoke() {
  for (let i = 0; i < FEEL.SMOKE_MAX; i++) smoke[i].life = 0;
  smokeCount = 0;
  smokeAcc = 0;
}

function spawnSmoke(side) {
  const p = smoke[smokeHead];
  smokeHead = (smokeHead + 1) % FEEL.SMOKE_MAX;
  if (smokeCount < FEEL.SMOKE_MAX) smokeCount++;
  // Off whichever rear wheel, at the position the last frame drew it.
  const jitter = carParts.scale * 0.18;
  p.x = (side < 0 ? carParts.rlx : carParts.rrx) + (Math.random() * 2 - 1) * jitter;
  p.y = (side < 0 ? carParts.rly : carParts.rry) + (Math.random() * 2 - 1) * jitter * 0.4;
  p.vx = -drift.lateralV * 40 + (Math.random() * 2 - 1) * 45;
  p.vy = FEEL.SMOKE_BACK_SPEED * (0.75 + Math.random() * 0.5);
  p.r = carParts.scale * FEEL.SMOKE_START_RADIUS;
  p.life = FEEL.SMOKE_LIFE;
}

function updateSmoke(dt) {
  for (let i = 0; i < FEEL.SMOKE_MAX; i++) {
    const p = smoke[i];
    if (p.life <= 0) continue;
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.r += FEEL.SMOKE_GROWTH * dt;
  }
  if (drift.slipNorm <= FEEL.SMOKE_MIN_SLIP) { smokeAcc = 0; return; }
  const strength = (drift.slipNorm - FEEL.SMOKE_MIN_SLIP) / (1 - FEEL.SMOKE_MIN_SLIP);
  smokeAcc += dt * FEEL.SMOKE_RATE * strength;
  let guard = 0;
  while (smokeAcc >= 1 && guard < 8) {
    smokeAcc -= 1;
    guard++;
    spawnSmoke(guard & 1 ? -1 : 1);
  }
  if (smokeAcc > 1) smokeAcc = 1;
}

/* Something under the cliff. A plane of lines well below the road, so the
   void has a floor and a sense of speed of its own. The rows scroll with
   the camera, the columns slide with the car, and the whole thing is two
   stroked paths. Kept dim: nothing down here may compete with the edges. */
function drawGrid(w, h) {
  const rise = camHeight + FEEL.GRID_DEPTH;
  const spacing = FEEL.GRID_SPACING;
  const offset = position - Math.floor(position / spacing) * spacing;

  ctx.lineWidth = 1;
  /* The floor answers the drift too, far more faintly than the skyline
     does, because it sits BEHIND the road rather than beyond it and the
     void beside the road has to stay empty. One ramp lookup and no extra
     geometry, no extra pass and no extra fill, so it is genuinely free.
     At a lift of zero this is exactly COLOUR.GRID, as it always was. */
  ctx.strokeStyle = rampAt(GRID_HOT_RAMP, cityGlow * FEEL.GRID_DRIFT_LIFT);
  ctx.beginPath();

  let nearY = 0, farY = 0, nearScale = 0, farScale = 0;
  for (let i = 1; i <= FEEL.GRID_ROWS; i++) {
    const dz = i * spacing - offset;
    if (dz <= CAMERA_DEPTH) continue;
    const scale = CAMERA_DEPTH / dz;
    const y = horizonY + scale * rise * h / 2;
    if (y > h + 40) continue;
    if (!nearScale) { nearScale = scale; nearY = y; }
    farScale = scale; farY = y;
    ctx.moveTo(-40, y);
    ctx.lineTo(w + 40, y);
  }

  if (nearScale) {
    const half = (FEEL.GRID_COLUMNS - 1) / 2;
    for (let i = -half; i <= half; i++) {
      const wx = i * FEEL.GRID_COLUMN_SPACING - cameraX;
      ctx.moveTo(w / 2 + nearScale * wx * w / 2, nearY);
      ctx.lineTo(w / 2 + farScale * wx * w / 2, farY);
    }
  }
  ctx.stroke();
}

/* Distant towers across the void, below the road. Generated once from a
   fixed pattern so it is the same every frame, repeated horizontally, and
   parallaxed slowly against both the car's sideways position and the
   distance travelled. Dark silhouettes with a dim lit top: it is an
   anchor to read the road against, and it must never pull the eye off the
   edges, so nothing here goes anywhere near their brightness. */
const skylineH = [];
/* The window layout, generated once at load and never again. Each
   building gets a grid and each window a fixed threshold, so lighting the
   city is a comparison per window and nothing else: no allocation, no
   randomness at draw time, and the same city every frame.

   THE THRESHOLDS ARE CLUSTERED PER BUILDING. A window's threshold is its
   building's base plus a small jitter, so buildings come on roughly whole
   and one after another rather than as a uniform speckle spreading across
   the skyline. That is the difference between a city waking up block by
   block and a brightness slider.

   Its own generator, not rng(), which belongs to the road: consuming from
   that stream here would change the track a pinned seed produces. */
const cityRows = [];
const cityCols = [];
const cityStart = [];
const cityThr = [];
/* THE WINDOW BUFFER, sized once for the worst case the walk can produce:
   every building repeated across the widest screen, with the largest
   grid any of them carries. Allocated at load, written every frame,
   never grown. */
const MAX_WINDOWS = 4096;
const winXY = new Float32Array(MAX_WINDOWS * 4);
const winCool = new Uint8Array(MAX_WINDOWS);

/* WHAT SHAPE EACH BUILDING IS. Item 4, and it is one number a building,
   drawn from the same separate stream everything else up here comes
   from. 0 plain, 1 setback, 2 crowned, 3 masted. */
const SKY_PLAIN = 0, SKY_SETBACK = 1, SKY_CROWN = 2, SKY_MAST = 3;
const cityShape = [];
// And the far layer's own heights, which are not the near layer's.
const skylineFarH = [];
/* THE SIGNAGE, ITEM 8, generated once at load like everything else up
   here. Five raw numbers a building and not one decision: which face
   carries a sign, which way it runs, where it sits, how long it is and
   how far across the face. RAW, in nought to one, with every FEEL
   constant applied at DRAW time, so the tuner can move any of them on
   the phone without regenerating the city. */
const signRnd = [];
const signVert = [];
const signAlong = [];
const signLen = [];
const signAcross = [];
/* THE SIGN BUFFER, sized for the worst case the repeat walk can produce
   and written in place, for the same reason the window buffer exists:
   nothing in the draw path may allocate. */
const MAX_SIGNS = 256;
const signXY = new Float32Array(MAX_SIGNS * 4);
(function () {
  let seed = 1337;
  function next() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return (seed % 1000) / 1000; }
  for (let i = 0; i < FEEL.SKYLINE_COUNT; i++) {
    skylineH.push(next());
    skylineFarH.push(next());
    /* THE SHAPE, weighted. Plain is still the common case, because a
       skyline where every building has a hat is as uniform as one where
       none does; the variety is in the minority. */
    const r = next();
    cityShape.push(r < 0.46 ? SKY_PLAIN
                 : r < 0.72 ? SKY_SETBACK
                 : r < 0.89 ? SKY_CROWN : SKY_MAST);
    const rows = 2 + (i % 4);
    const cols = 2 + (i % 2);
    cityRows.push(rows);
    cityCols.push(cols);
    cityStart.push(cityThr.length);
    // Taller buildings light later, so the skyline fills from the low
    // blocks upward and the tallest are the reward for a long chain.
    const base = 0.06 + 0.72 * (0.45 * next() + 0.55 * skylineH[i]);
    for (let k = 0; k < rows * cols; k++) {
      cityThr.push(clamp(base + (next() - 0.5) * 0.22, 0, 1));
    }
  }
  /* A SECOND LOOP RATHER THAN FIVE MORE DRAWS INSIDE THE FIRST ONE, and
     that is not tidiness. Every value above comes off this one stream in
     a fixed order, so inserting a draw anywhere in that loop shifts every
     height, every shape and every window threshold after it and rebuilds
     a city that has already been played and signed off. Appended, the
     city is byte for byte the one that shipped and the signs are new. */
  for (let i = 0; i < FEEL.SKYLINE_COUNT; i++) {
    signRnd.push(next());
    signVert.push(next());
    signAlong.push(next());
    signLen.push(next());
    signAcross.push(next());
  }
})();

/* ONE BUILDING INTO A PATH THAT IS ALREADY OPEN. Item 4. Two or three
   rectangles instead of one, so the whole city is still a single fill.
   The body is returned so the window grid and the roof line can use the
   same top the silhouette used. */
function skylineBody(x, wid, baseY, th, shape) {
  ctx.rect(x, baseY - th, wid, th);
  if (shape === SKY_PLAIN) return;
  const cx = x + wid * 0.5;
  if (shape === SKY_SETBACK) {
    const w2 = wid * FEEL.SKYLINE_SETBACK_W, h2 = th * FEEL.SKYLINE_SETBACK_H;
    ctx.rect(cx - w2 * 0.5, baseY - th - h2, w2, h2);
    return;
  }
  if (shape === SKY_CROWN) {
    const w2 = wid * FEEL.SKYLINE_CROWN_W, h2 = th * FEEL.SKYLINE_CROWN_H;
    ctx.rect(cx - w2 * 0.5, baseY - th - h2, w2, h2);
    return;
  }
  // Masted: a spike, with a floor in PIXELS so it cannot vanish at dpr 1
  // or shimmer at dpr 2. Same guard the window fill already uses.
  const w2 = Math.max(FEEL.SKYLINE_MAST_MIN_PX, wid * FEEL.SKYLINE_MAST_W);
  const h2 = th * FEEL.SKYLINE_MAST_H;
  ctx.rect(cx - w2 * 0.5, baseY - th - h2, w2, h2);
}

/* THE FAR CITY, ITEM 3. The same walk as the near one with a second set
   of numbers, no detail of any kind on it, and drawn first so the near
   city stands in front of it. Its own heights, so the two layers are not
   the same skyline at two sizes. */
function drawSkylineFar(w, h) {
  const period = FEEL.SKYLINE_FAR_PERIOD;
  const step = period / FEEL.SKYLINE_COUNT;
  const baseY = horizonY + h * FEEL.SKYLINE_FAR_DROP;
  const minH = h * FEEL.SKYLINE_FAR_MIN_HEIGHT;
  const spanH = h * Math.max(0, FEEL.SKYLINE_FAR_MAX_HEIGHT - FEEL.SKYLINE_FAR_MIN_HEIGHT);
  let shift = -carX * FEEL.SKYLINE_FAR_PARALLAX - position * FEEL.SKYLINE_FAR_DRIFT;
  shift = shift - Math.floor(shift / period) * period;
  ctx.beginPath();
  for (let rep = -1; rep <= Math.ceil(w / period); rep++) {
    for (let i = 0; i < FEEL.SKYLINE_COUNT; i++) {
      const x = shift + rep * period + i * step;
      if (x > w + step || x < -step * 2) continue;
      ctx.rect(x, baseY - (minH + skylineFarH[i] * spanH),
               step * 0.86, minH + skylineFarH[i] * spanH);
    }
  }
  ctx.fillStyle = COLOUR.SKYLINE_FAR;
  ctx.fill();
}

/* THE SIGNAGE, ITEM 8. The same repeat walk and the same cull the
   bodies and the windows use, into the same kind of preallocated
   buffer, and then two fills for every sign in shot: the bar wide and
   faint, then the bar solid. That is the two pass glow convention this
   file uses everywhere instead of shadowBlur.

   ON ALWAYS, unlike the windows. The windows come up with the chain
   because they are the reward for driving well; a neon sign is simply
   switched on, and having the street furniture wait for a good run is
   what would make the opening look unfinished rather than dark.

   ITS OWN FUNCTION RATHER THAN A BLOCK INSIDE drawSkyline, so it can
   be suppressed on its own when the twelve biome ranking is taken.
   An element that cannot be measured separately cannot be argued
   about separately, and every hard limit in this file is a claim
   about one element against another. */
function drawSigns(w, period, step, shift, baseY, minH, spanH) {
  let signN = 0;
  for (let rep = -1; rep <= Math.ceil(w / period); rep++) {
    for (let i = 0; i < FEEL.SKYLINE_COUNT && signN < MAX_SIGNS; i++) {
      if (signRnd[i] >= FEEL.SIGN_SHARE) continue;
      const x = shift + rep * period + i * step;
      if (x > w + step || x < -step * 2) continue;
      const th = minH + skylineH[i] * spanH;
      // Too short to carry a bar that would read as one rather than as
      // a smudge, which is the same judgement the windows already make.
      if (th < FEEL.SIGN_MIN_BUILDING_PX) continue;
      const bwid = step * 0.86;
      const top = baseY - th;
      const inset = FEEL.SIGN_INSET;
      const lenF = FEEL.SIGN_LEN_MIN + signLen[i] * FEEL.SIGN_LEN_SPAN;
      let sx, sy, sw, sh;
      if (signVert[i] < FEEL.SIGN_VERTICAL_SHARE) {
        sh = th * lenF;
        sw = Math.max(FEEL.SIGN_MIN_PX, bwid * FEEL.SIGN_THICK);
        sx = x + bwid * inset
           + signAcross[i] * Math.max(0, bwid * (1 - inset * 2) - sw);
        sy = top + signAlong[i] * Math.max(0, th - sh);
      } else {
        sw = bwid * lenF;
        sh = Math.max(FEEL.SIGN_MIN_PX, th * FEEL.SIGN_THICK);
        sx = x + signAlong[i] * Math.max(0, bwid - sw);
        sy = top + th * inset
           + signAcross[i] * Math.max(0, th * (1 - inset * 2) - sh);
      }
      /* ABOVE THE HORIZON, AND TRIMMED RATHER THAN DROPPED. The
         building bases sit a little BELOW the horizon line, by
         SKYLINE_DROP, so a sign low on a short block can reach past it
         and end up alongside the far road, which is the one place in
         this game nothing new is allowed to appear. Cutting the bottom
         off keeps the sign and loses only the part that was never
         allowed to be there. */
      if (sy >= horizonY) continue;
      if (sy + sh > horizonY) sh = horizonY - sy;
      if (sh < 1 || sw < 1) continue;
      const at = signN * 4;
      signXY[at] = sx; signXY[at + 1] = sy;
      signXY[at + 2] = sw; signXY[at + 3] = sh;
      signN++;
    }
  }
  if (signN) {
    const g = FEEL.SIGN_GLOW_INFLATE;
    ctx.beginPath();
    for (let k = 0; k < signN; k++) {
      const at = k * 4;
      // The faint pass is held to the horizon as well, or the glow
      // alone would put light beside the far road.
      const gy = signXY[at + 1] - g;
      const gh = Math.min(signXY[at + 3] + g * 2, horizonY - gy);
      if (gh <= 0) continue;
      ctx.rect(signXY[at] - g, gy, signXY[at + 2] + g * 2, gh);
    }
    ctx.globalAlpha = FEEL.SIGN_ALPHA * FEEL.SIGN_GLOW_ALPHA;
    ctx.fillStyle = SIGN_FILL;
    ctx.fill();
    ctx.beginPath();
    for (let k = 0; k < signN; k++) {
      const at = k * 4;
      ctx.rect(signXY[at], signXY[at + 1], signXY[at + 2], signXY[at + 3]);
    }
    ctx.globalAlpha = FEEL.SIGN_ALPHA;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawSkyline(w, h) {
  drawSkylineFar(w, h);
  const period = FEEL.SKYLINE_PERIOD;
  const step = period / FEEL.SKYLINE_COUNT;
  const baseY = horizonY + h * FEEL.SKYLINE_DROP;
  const minH = h * FEEL.SKYLINE_MIN_HEIGHT;
  const spanH = h * (FEEL.SKYLINE_MAX_HEIGHT - FEEL.SKYLINE_MIN_HEIGHT);
  let shift = -carX * FEEL.SKYLINE_PARALLAX - position * FEEL.SKYLINE_DRIFT;
  shift = shift - Math.floor(shift / period) * period;

  ctx.beginPath();
  for (let rep = -1; rep <= Math.ceil(w / period); rep++) {
    for (let i = 0; i < FEEL.SKYLINE_COUNT; i++) {
      const x = shift + rep * period + i * step;
      if (x > w + step || x < -step * 2) continue;
      const th = minH + skylineH[i] * spanH;
      skylineBody(x, step * 0.86, baseY, th, cityShape[i]);
    }
  }
  ctx.fillStyle = COLOUR.SKYLINE;
  ctx.fill();

  /* The windows, between the silhouettes and the roof line so the roofs
     stay on top of them. One batched fill for every lit window in shot,
     using the same repeat loop and the same culling the bodies use. */
  if (cityGlow > 0.01) {
    /* THREE PATHS, ITEM 5, AND STILL THREE FILLS FOR THE WHOLE CITY.
       The wide faint one under the solid one is the same two pass glow
       convention everything else lit in this game uses, and the cool
       path is the minority. Walked ONCE; which path a window lands in is
       decided from the threshold it already carries.

       INTO A PREALLOCATED BUFFER, not into three arrays built per frame.
       Nothing in the draw path may allocate, and three arrays of a few
       hundred entries sixty times a second is exactly the garbage this
       file's Float64Array boundary tables exist to avoid. Path2D would
       be the tidy answer and is not available: the file supports an
       environment without it, and brandrules tests that. */
    let winN = 0;
    let any = false;
    for (let rep = -1; rep <= Math.ceil(w / period); rep++) {
      for (let i = 0; i < FEEL.SKYLINE_COUNT; i++) {
        const x = shift + rep * period + i * step;
        if (x > w + step || x < -step * 2) continue;
        const th = minH + skylineH[i] * spanH;
        // Too short to hold a window that would read as one.
        if (th < FEEL.CITY_MIN_BUILDING_PX) continue;
        const rows = cityRows[i], cols = cityCols[i], at = cityStart[i];
        const bwid = step * 0.86;
        const cellW = bwid / cols, cellH = th / rows;
        const ww = Math.max(1, cellW * FEEL.CITY_WINDOW_FILL);
        const wh = Math.max(1, cellH * FEEL.CITY_WINDOW_FILL);
        const top = baseY - th;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const thr = cityThr[at + r * cols + c];
            if (thr > cityGlow) continue;
            any = true;
            const wx = x + (c + 0.5) * cellW - ww / 2;
            const wy = top + (r + 0.5) * cellH - wh / 2;
            if (winN < MAX_WINDOWS) {
              const at2 = winN * 4;
              winXY[at2] = wx; winXY[at2 + 1] = wy;
              winXY[at2 + 2] = ww; winXY[at2 + 3] = wh;
              winCool[winN] = (thr >= FEEL.CITY_COOL_FROM
                            && thr <= FEEL.CITY_COOL_TO) ? 1 : 0;
              winN++;
            }
          }
        }
      }
    }
    if (any) {
      // Brighter as well as more numerous, but the alpha is the thing the
      // hard rule bites on and it is capped by CITY_ALPHA.
      /* THE ONE THING THE CITY CANNOT DO IN PLAY. cityGlow reaches one
         on a good run, which lights every window, but the ALPHA is
         capped at CITY_ALPHA and nothing in the game may pass it, so a
         fully lit city is still a dim one. The finale passes it.

         IT DOES NOT WAIT FOR THE CAR, because the city is above the
         horizon and cannot cost the road a thing however bright it
         gets. That is what lets it FLASH IN TIME WITH THE VOLLEYS while
         the donut is still going, which is the whole point of it. */
      const solid = Math.min(1,
        FEEL.CITY_ALPHA * (0.45 + 0.55 * cityGlow) * cityPulse
        + FEEL.FINALE_CITY_ALPHA * finaleSky
        + FEEL.FINALE_STROBE_CITY * strobe2());
      // The wide faint pass, every window grown a pixel or two.
      const g = FEEL.CITY_GLOW_INFLATE;
      ctx.beginPath();
      for (let k = 0; k < winN; k++) {
        const at2 = k * 4;
        ctx.rect(winXY[at2] - g, winXY[at2+1] - g,
                 winXY[at2+2] + g * 2, winXY[at2+3] + g * 2);
      }
      ctx.globalAlpha = solid * FEEL.CITY_GLOW_ALPHA;
      ctx.fillStyle = COLOUR.SKYLINE_WINDOW;
      ctx.fill();
      // Then the solid ones, warm and then the cool minority.
      for (let want = 0; want <= 1; want++) {
        ctx.beginPath();
        let some = false;
        for (let k = 0; k < winN; k++) {
          if (winCool[k] !== want) continue;
          some = true;
          const at2 = k * 4;
          ctx.rect(winXY[at2], winXY[at2+1], winXY[at2+2], winXY[at2+3]);
        }
        if (!some) continue;
        ctx.globalAlpha = want ? solid * FEEL.CITY_COOL_ALPHA : solid;
        ctx.fillStyle = want ? COLOUR.SKYLINE_WINDOW_COOL : COLOUR.SKYLINE_WINDOW;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  drawSigns(w, period, step, shift, baseY, minH, spanH);
  /* A dim lit line on the roofs, so they read as built rather than as a
     ragged hole in the background. This is where the city lights come up
     with the multiplier: the line thickens and runs toward this biome's
     own hot hue. The building bodies are deliberately left alone, because
     they are the silhouette the far road is read against and lifting them
     would cost contrast rather than buy anything. */
  const lit = 1.5 + FEEL.HEAT_SKYLINE_THICK * worldHeat * heatPulse
            + FEEL.FINALE_SKY_THICK * finaleSky
            + FEEL.FINALE_STROBE_THICK * strobe2();
  ctx.beginPath();
  for (let rep = -1; rep <= Math.ceil(w / period); rep++) {
    for (let i = 0; i < FEEL.SKYLINE_COUNT; i++) {
      const x = shift + rep * period + i * step;
      if (x > w + step || x < -step * 2) continue;
      const th = minH + skylineH[i] * spanH;
      ctx.rect(x, baseY - th, step * 0.86, lit);
    }
  }
  // The ramp clamps its own index, so the finale term simply drives it
  // to the hot end and holds it there rather than running off it.
  ctx.fillStyle = rampAt(SKYLINE_HOT_RAMP, worldHeat * FEEL.HEAT_SKYLINE_LIFT
                                           + FEEL.FINALE_SKY_LIFT * finaleSky);
  ctx.fill();
}

function drawSmoke() {
  if (smokeCount === 0) return;
  ctx.fillStyle = SMOKE_FILL;
  for (let i = 0; i < FEEL.SMOKE_MAX; i++) {
    const p = smoke[i];
    if (p.life <= 0) continue;
    const t = p.life / FEEL.SMOKE_LIFE;
    ctx.globalAlpha = t * FEEL.SMOKE_ALPHA;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}


/* ==================================================================
   RENDER
   ================================================================== */
/* A general point projection, for anything that is not lying flat on the
   road. Same camera, same segments, one deliberate difference.

   The inherited projection is anisotropic: it scales across the screen by
   half the width and down it by half the height, which on a portrait phone
   is a two to one vertical stretch. A flat road never shows it up, and the
   camera was tuned with it in place, so it stays. A box with real height
   does show it up, and would come out twice as tall as it should be.

   So the ground stays exactly where the road puts it, and only the rise
   above the ground uses the horizontal scale. The wheels still touch the
   road to the pixel, and the car keeps its own proportions. */
function projectPoint(out, wx, wy, wz, camX, w, h) {
  const scale = CAMERA_DEPTH / wz;
  out.sx = w / 2 + scale * (wx - camX) * w / 2;
  out.sy = horizonY + scale * camHeight * h / 2 - scale * wy * w / 2;
  return out;
}

function polygon(x1, y1, x2, y2, x3, y3, x4, y4) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineTo(x3, y3);
  ctx.lineTo(x4, y4);
  ctx.closePath();
  ctx.fill();
}


/* How far the road has wandered sideways by the time it reaches the car.
   The curve in this technique is faked by sliding the segments across, so
   a car drawn at a fixed screen position would sit off its own road in a
   corner, and off its own tyre marks with it. Captured during the walk
   and used to place the car. */
let carCurveX = 0;

/* The road is walked once into these, then drawn from them twice: the
   walls of the slab, and its top surface. Boundary k is where segment k
   starts, so segment n runs between boundary n and boundary n + 1. */
const MAX_BOUNDS = 520;
const bx = new Float64Array(MAX_BOUNDS);
const by = new Float64Array(MAX_BOUNDS);
const bw = new Float64Array(MAX_BOUNDS);
const bz = new Float64Array(MAX_BOUNDS);
const bt = new Float64Array(MAX_BOUNDS);
const bf = new Float64Array(MAX_BOUNDS);
const bh = new Float64Array(MAX_BOUNDS);   // world height to pixels at this boundary
/* The nearest segment whose road centre has left the screen, or -1 while
   the whole draw distance is still visible. */
let sightSeg = -1;
/* Segments between the camera and the car. Road under the car is road the
   player is already committed to, so it is not lookahead and is left out
   of the sight measure, which otherwise reports the near field swinging
   out of frame whenever the camera leans. */
const carAheadSegs = Math.ceil(FEEL.CAMERA_DISTANCE / FEEL.SEGMENT_LENGTH) + 2;
const bvis = new Uint8Array(MAX_BOUNDS);
const blight = new Uint8Array(MAX_BOUNDS);

/* Past these projected half widths the wide faint passes and the cliff
   are smaller than a pixel. Widths shrink monotonically with distance, so
   the loops break rather than continue. */
const GLOW_CULL_PX = 2.5;
const WALL_CULL_PX = 1.6;

let EDGE_GLOW_FILL = 'rgb(' + COLOUR.EDGE_GLOW + ')';
let SLAB_BOTTOM_GLOW_FILL = 'rgb(' + COLOUR.SLAB_BOTTOM_GLOW + ')';
let PYLON_GLOW_FILL = 'rgb(' + COLOUR.PYLON_GLOW + ')';
/* The signage, item 8, and the road pool under a lamp, item 9. Both are
   built in rebuildDerivedColours rather than here, for the reason the
   whole of that function exists: a cached fill or a gradient that misses
   a rotation puts the last biome's colour in the middle of this one. The
   pool is a single gradient rather than a ramp of them, unlike the car's,
   because a lamp is one fixed warm neutral and nothing indexes it. */
let SIGN_FILL = 'rgb(255,154,60)';
/* The two car parts drawCar used to read straight off COLOUR. They are
   cached here instead because the active car may substitute a different
   palette entry for either, and a substitution that missed a biome
   change is the exact failure rebuildDerivedColours exists to prevent. */
let CAR_RIM_FILL = '#c4f2fa';
let CAR_LIGHT_FILL = '#ff3a4f';
let LAMP_POOL_GRAD = null;
// The outer lip of the slab, half width plus the shoulder, as a multiple
// of the half width. The shoulder is the scrape band, so the drawn edge of
// the road really is the last place the car may be.
const EDGE_OUT = 1 + FEEL.RUMBLE_WIDTH_FRACTION;

function drawRoad(w, h) {
  const seg = FEEL.SEGMENT_LENGTH;
  const baseIndex = Math.floor(position / seg);
  const base = segAt(baseIndex);
  if (!base) return;
  const percent = (position - baseIndex * seg) / seg;
  // The camera, which is the car plus its lean into the corner.
  const camX = cameraX;

  let x = 0;
  let dx = -(base.curve * curveScale * percent);

  const carZ = position + FEEL.CAMERA_DISTANCE;
  const carIdx = Math.floor(carZ / seg);
  const carSegFrac = (carZ - carIdx * seg) / seg;

  /* One walk, recording every boundary between segments, because the road
     is now drawn in two passes over the same geometry and walking it twice
     would mean accumulating the curve twice. */
  const want = Math.min(FEEL.DRAW_DISTANCE_SEGMENTS, MAX_BOUNDS - 1);
  let count = 0;
  let lastHw = base.hw;
  for (let k = 0; k <= want; k++) {
    const s = segAt(baseIndex + k);
    if (s) lastHw = s.hw;
    const dz = (baseIndex + k) * seg - position;
    const scale = CAMERA_DEPTH / dz;
    bx[k] = w / 2 + scale * (x - camX) * w / 2;
    by[k] = horizonY + scale * camHeight * h / 2;
    bw[k] = scale * lastHw * w / 2;
    bz[k] = dz;
    // Thickness is a height, so it uses the horizontal scale, the same way
    // the car's height does and for the same reason.
    bt[k] = scale * FEEL.ROAD_THICKNESS * w / 2;
    bf[k] = scale * FEEL.ROAD_FLARE * w / 2;
    bh[k] = scale * w / 2;
    count = k;
    if (baseIndex + k === carIdx) carCurveX = x + dx * carSegFrac;
    if (!s) break;
    x += dx;
    dx += s.curve * curveScale;
  }

  /* Decide once which segments are drawn and which stripe they are on,
     then draw the whole road one colour at a time. Per segment this used
     to be five to seven fills; batched it is a fixed handful for the
     entire road, which is what pays for the pylons and the glow. */
  let maxy = h;
  let first = -1, last = -1;
  sightSeg = -1;
  for (let n = 0; n < count; n++) {
    const s = segAt(baseIndex + n);
    bvis[n] = 0;
    if (!s) break;
    if (bz[n] <= CAMERA_DEPTH || by[n + 1] >= by[n] || by[n + 1] >= maxy) continue;
    bvis[n] = 1;
    blight[n] = (Math.floor(s.index / FEEL.RUMBLE_SEGMENTS) & 1) === 0 ? 1 : 0;
    /* How far ahead the road is still on screen. Curves are faked by
       sliding segments sideways, so a tight enough corner walks the road
       out of frame and the player cannot see where it goes. That distance,
       in seconds, is the true ceiling on corner tightness, and it is worth
       watching rather than discovering. */
    if (sightSeg < 0 && n > carAheadSegs && (bx[n] < 0 || bx[n] > w)) sightSeg = n;
    if (first < 0) first = n;
    last = n;
    maxy = by[n + 1];
  }
  if (first < 0) return;

  drawWalls(count);
  drawSlabUnderline(first, last);
  /* AFTER the underline, not before. The underline's own glow is drawn
     around the slab bottom and is up to three pixels tall, against a mean
     bleed drop of six, so putting the bleed underneath it hid most of the
     effect: measured, only 44 pixels in the whole frame changed. It also
     reads better this way round, because the underline is the thing doing
     the radiating and the spill belongs on top of it. */
  edgeBleedPass(first, last);

  const lip = FEEL.EDGE_LIP_FRACTION;
  const band = FEEL.RUMBLE_WIDTH_FRACTION - lip;
  bandPass(first, last, 1, band, EDGE_OUT - lip, COLOUR.SHOULDER_LIGHT);
  bandPass(first, last, 0, band, EDGE_OUT - lip, COLOUR.SHOULDER_DARK);
  bandPass(first, last, 1, EDGE_OUT - lip, EDGE_OUT, COLOUR.EDGE_LIGHT);
  // The dim half of the lip runs toward the light half as the multiplier
  // climbs, so the edge stripe burns hotter and the edge as a whole only
  // ever gains luminance.
  bandPass(first, last, 0, EDGE_OUT - lip, EDGE_OUT,
           rampAt(EDGE_HOT_RAMP, worldHeat * FEEL.HEAT_EDGE_LIFT));
  surfacePass(first, last, 1, COLOUR.ROAD_LIGHT);
  surfacePass(first, last, 0, COLOUR.ROAD_DARK);
  /* ON THE SURFACE, UNDER EVERYTHING THAT MATTERS. Both of these paint
     the road itself, so they go here: after the surface that carries
     them and before the lane dashes, the edge glow and everything else
     the player steers by. The lip was laid down before the surface and
     is outboard of both. */
  wetSheenPass(first, last);
  reflectPass(first, last, baseIndex, FEEL.PYLON_SPACING);
  // And the light the lamps throw on the road, item 9, which belongs in
  // the same place and for the same reason: it is ON the surface, so it
  // goes after the surface and before everything the player steers by.
  lampPoolPass(first, last, baseIndex, FEEL.PYLON_SPACING);
  lanePass(first, last);
  edgeGlowPass(first, last);
  drawTrail(first, last, baseIndex);
  drawGate(first, last, baseIndex);
  drawHazardWarnings(first, last, baseIndex);
  drawJumps(first, last, baseIndex);
  drawPylons(first, last, baseIndex, w);
  drawHazards(first, last, baseIndex);
  // Last in the world and before the car, which render draws afterwards,
  // so the ghost can never sit on top of the thing you are steering.
  drawGhost(first, last, baseIndex);
}

/* The warning, painted on the road surface a full second before the
   hazard, across exactly the width the hazard occupies. This is what real
   roads do and it costs one batched fill for every warning in shot.

   It matters more here than on a real road, because sight is about two
   seconds and a hazard that resolves at the same moment it has to be
   avoided is the unfairness section 4.3 is about. The stripes are on the
   ground, so they are visible while the object itself is still a speck. */
/* The checkpoint gate: a post either side of the road and a beam across
   the top of them. Drawn from the same boundary tables the road is, so it
   sits in the world rather than on the screen, and it is only ever one
   object so it costs three fills.

   It is deliberately the widest thing on the road and it has nothing in
   the driving line, because a gate is the one thing out here that is
   purely good news. */
/* Is the gate being approached the LINE? Gate N is the finish, so this
   is true for the whole of the closing stretch, which is what makes the
   structure resolve out of the draw distance instead of appearing. */
function atFinishGate() {
  return mode === DAILY && gatesPassed >= dailyGates - 1;
}

/* ==================================================================
   THE FINISH, DRAWN IN THE WORLD.

   The payoff of a finite track is not a message on a HUD. It is a thing
   on the road that comes up out of the distance and gets bigger, so the
   last thirty seconds are driven at something rather than toward a
   number counting down.

   Built as a gate that has grown up: the same two posts and beam, the
   same two pass glow, in the same palette, so it reads as the same
   family and not as a foreign object. What makes it the LAST one is
   scale and a banner. It is more than four times the height of a
   checkpoint, which is what lets it clear the horizon and be visible
   from the far end of the draw distance while a gate is still a smudge.
   ================================================================== */
function drawFinishGate(first, last, baseIndex) {
  const n = nextGate - baseIndex;
  if (n < first || n > last || !bvis[n]) return;
  const seg = segAt(nextGate);
  if (!seg) return;
  const out = 1 + FEEL.RUMBLE_WIDTH_FRACTION;
  const post = FEEL.FINISH_POST / seg.hw;
  const top = by[n] - bh[n] * FEEL.FINISH_HEIGHT;
  const lx = bx[n] + bw[n] * (out + post * 0.5), rx = bx[n] - bw[n] * (out + post * 0.5);
  const pw = Math.max(2, bw[n] * post);
  const banner = (by[n] - top) * FEEL.FINISH_BANNER;

  for (let pass = 0; pass < 2; pass++) {
    const spread = pass === 0 ? pw * 2.2 : 0;
    ctx.globalAlpha = pass === 0 ? 0.26 : 1;
    ctx.fillStyle = pass === 0 ? GATE_GLOW_FILL : COLOUR.GATE_POST;
    ctx.beginPath();
    ctx.rect(lx - pw / 2 - spread / 2, top, pw + spread, by[n] - top);
    ctx.rect(rx - pw / 2 - spread / 2, top, pw + spread, by[n] - top);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* The banner across the top, in the score's own gold rather than the
     gate's cyan. Every checkpoint all day has been cyan; the one that
     ends the run is the colour of the number it is ending. */
  const bl = Math.min(lx, rx) - pw / 2, bwid = Math.abs(rx - lx) + pw;
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = 'rgb(' + COLOUR.SCORE_GLOW + ')';
  ctx.fillRect(bl - pw, top - banner * 0.35, bwid + pw * 2, banner * 1.7);
  ctx.globalAlpha = 1;
  ctx.fillStyle = COLOUR.SCORE;
  ctx.fillRect(bl, top, bwid, banner);
  // A dark band through the middle of it, so the banner reads as a sign
  // with something on it rather than as a solid bar.
  ctx.fillStyle = COLOUR.SCORE_EDGE;
  ctx.fillRect(bl, top + banner * 0.36, bwid, banner * 0.28);

  /* Light bars running down both posts, evenly spaced, so the height is
     legible at distance. A single tall rectangle at this scale reads as
     a wall; a ladder reads as a structure. */
  const postH = by[n] - top;
  ctx.fillStyle = COLOUR.GATE;
  ctx.globalAlpha = 0.75;
  const bars = Math.max(1, Math.round(FEEL.FINISH_BARS));
  for (let i = 1; i <= bars; i++) {
    const y = top + postH * (i / (bars + 1));
    const bh2 = Math.max(1.5, postH * 0.016);
    ctx.fillRect(lx - pw * 0.9, y, pw * 1.8, bh2);
    ctx.fillRect(rx - pw * 0.9, y, pw * 1.8, bh2);
  }
  ctx.globalAlpha = 1;

  /* The road under it, painted across the full width. This is the only
     marking in the game that spans the driving line, and it is allowed
     to because there is nothing to avoid on it and nothing after it. */
  const nn = Math.min(last, n + 6);
  if (nn > n && bvis[n]) {
    const bars2 = 8;
    ctx.beginPath();
    for (let k = 0; k < bars2; k += 2) {
      const f0 = -1 + 2 * k / bars2, f1 = -1 + 2 * (k + 1) / bars2;
      ctx.moveTo(bx[n] + bw[n] * f0 * out, by[n]);
      ctx.lineTo(bx[n] + bw[n] * f1 * out, by[n]);
      ctx.lineTo(bx[nn] + bw[nn] * f1 * out, by[nn]);
      ctx.lineTo(bx[nn] + bw[nn] * f0 * out, by[nn]);
      ctx.closePath();
    }
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = COLOUR.SCORE;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // The same approach sweep a gate has, so the last one still counts the
  // car in the way every gate before it did.
  const away = nextGate - carSegIndex;
  if (away > 0 && away < FEEL.GATE_SWEEP_SEGMENTS && state === DRIVING) {
    const u = 1 - away / FEEL.GATE_SWEEP_SEGMENTS;
    const band = Math.max(2, postH * FEEL.GATE_SWEEP_LENGTH);
    const y = top + (postH - band) * u;
    ctx.fillStyle = COLOUR.SCORE_BEST;
    ctx.fillRect(lx - pw * 1.1, y, pw * 2.2, band);
    ctx.fillRect(rx - pw * 1.1, y, pw * 2.2, band);
  }
}

function drawGate(first, last, baseIndex) {
  if (atFinishGate()) { drawFinishGate(first, last, baseIndex); return; }
  const n = nextGate - baseIndex;
  if (n < first || n > last || !bvis[n]) return;
  const seg = segAt(nextGate);
  if (!seg) return;
  const out = 1 + FEEL.RUMBLE_WIDTH_FRACTION;
  const post = FEEL.CHECKPOINT_POST / seg.hw;
  const top = by[n] - bh[n] * FEEL.CHECKPOINT_HEIGHT;
  const beam = Math.max(2, bh[n] * FEEL.CHECKPOINT_POST * 0.8);
  const lx = bx[n] + bw[n] * (out + post * 0.5), rx = bx[n] - bw[n] * (out + post * 0.5);
  const pw = Math.max(2, bw[n] * post);

  // Wide and faint, then solid, the same two pass glow everything lit in
  // this game uses.
  for (let pass = 0; pass < 2; pass++) {
    const spread = pass === 0 ? pw * 1.9 : 0;
    ctx.globalAlpha = pass === 0 ? 0.3 : 1;
    ctx.fillStyle = pass === 0 ? GATE_GLOW_FILL : COLOUR.GATE_POST;
    ctx.beginPath();
    ctx.rect(lx - pw / 2 - spread / 2, top, pw + spread, by[n] - top);
    ctx.rect(rx - pw / 2 - spread / 2, top, pw + spread, by[n] - top);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // The beam across, in the bright colour, so the eye reads a doorway.
  ctx.fillStyle = COLOUR.GATE;
  ctx.fillRect(Math.min(lx, rx) - pw / 2, top - beam / 2,
               Math.abs(rx - lx) + pw, beam);

  /* Light running down the posts as the car closes. Driven by the
     distance still to run rather than by a clock, so it is the player's
     own approach that moves it and a gate that is never reached never
     finishes its sweep. Two rects. */
  const away = nextGate - carSegIndex;
  if (away > 0 && away < FEEL.GATE_SWEEP_SEGMENTS && state === DRIVING) {
    const u = 1 - away / FEEL.GATE_SWEEP_SEGMENTS;
    const postH = by[n] - top;
    const band = Math.max(2, postH * FEEL.GATE_SWEEP_LENGTH);
    const y = top + (postH - band) * u;
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillRect(lx - pw * 0.85, y, pw * 1.7, band);
    ctx.fillRect(rx - pw * 0.85, y, pw * 1.7, band);
  }
}

/* The warning, painted on the road a full second before the hazard, and
   it points at the way THROUGH rather than at the obstruction.

   It used to be a bar across the blocked width, which said "something is
   coming" when what the player needs is "go this way". A cold player read
   it as a marker for a jump and drove at it. Now the road carries only
   the direction cue, arrowheads laid in the lane that is open, and the
   object carries the danger signal by itself. A splitter gets both of its
   lanes marked, because either one is a correct answer and choosing is
   the whole point of it.

   One batched fill for every warning in shot. */
function laneArrows(h, warn) {
  // Where the open lanes are, in fractions of the local half width, using
  // the same rule the placement check used to decide the hazard was fair.
  const seg = segAt(h.from);
  if (!seg) return null;
  const lim = FEEL.SCRAPE_START;
  const carHalf = (FEEL.CAR_BODY_WIDTH / 2) / seg.hw;
  const band = (h.half + FEEL.HAZARD_CLIP) / seg.hw;
  const x = hazardX(h);
  const lanes = [];
  if (x - band - carHalf >= -lim) lanes.push((-lim + (x - band - carHalf)) / 2);
  if (x + band + carHalf <= lim) lanes.push(((x + band + carHalf) + lim) / 2);
  /* A splitter keeps both, because either side is a correct answer and
     choosing between them is the entire mechanic. Everything else keeps
     only the roomier one: two arrows on a blocker is not a direction, it
     is a shrug, and the point of this marking is to say go THIS way. */
  if (h.kind !== HAZ_SPLITTER && lanes.length === 2) {
    const leftRoom = Math.abs((x - band) - (-lim));
    const rightRoom = Math.abs(lim - (x + band));
    return [leftRoom >= rightRoom ? lanes[0] : lanes[1]];
  }
  return lanes;
}

/* ==================================================================
   THE RAMP, AND THE CHEVRONS THAT LEAD UP TO IT.

   The ramp is a wedge: two flanks, a deck banded across its length so the
   rise is legible, and a lit lip at the top which is the edge the car
   leaves from. Built from the same boundary tables everything else is, so
   it sits in the world, and drawn one colour at a time like the road.

   THE CHEVRONS ARE THE HALF OF THIS THAT MATTERS. The hazard warning
   lies FLAT on the road, points ALONG it, is washed out to half alpha and
   is cyan. This STANDS UP off the road, points at the SKY, is opaque and
   is green. Four axes of difference at once, and at speed the standing
   one has a silhouette against the sky that the flat one physically
   cannot have. They are not confusable, and they were never meant to be
   told apart by hue alone.
   ================================================================== */
let JUMP_GLOW_FILL = 'rgb(' + COLOUR.JUMP_GLOW + ')';
let JUMP_DECK_RAMP = rampBetween(COLOUR.JUMP_DECK_DARK, COLOUR.JUMP_DECK);

function jumpHeightAt(j, i) {
  return FEEL.JUMP_RAMP_HEIGHT
       * clamp((i - j.from) / (j.to - j.from + 1), 0, 1);
}

function drawJumps(first, last, baseIndex) {
  if (!jumps.length) return;
  for (let k = 0; k < jumps.length; k++) drawRamp(jumps[k], first, last, baseIndex);
  /* Wide and faint, then solid. The same two pass glow the road edges
     use, and still no shadowBlur anywhere in this file. */
  if (jumpChevrons(first, last, baseIndex, 1.22)) {
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = JUMP_GLOW_FILL;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (jumpChevrons(first, last, baseIndex, 1)) {
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = COLOUR.JUMP_ARROW;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

const rampL = [], rampR = [], rampY = [];
function drawRamp(j, first, last, baseIndex) {
  const RH = FEEL.JUMP_RAMP_HALF;
  const a = Math.max(j.from - baseIndex, first);
  const b = Math.min(j.to + 1 - baseIndex, last + 1);
  if (b - a < 1) return;
  for (let n = a; n < b; n++) if (!bvis[n]) return;
  rampL.length = 0; rampR.length = 0; rampY.length = 0;
  for (let n = a; n <= b; n++) {
    const rise = bh[n] * jumpHeightAt(j, n + baseIndex);
    rampL.push(bx[n] - bw[n] * RH);
    rampR.push(bx[n] + bw[n] * RH);
    rampY.push(by[n] - rise);
  }
  const top = rampY.length - 1;

  // The flanks, so the wedge is a solid rather than a decal.
  ctx.beginPath();
  for (const side of [rampL, rampR]) {
    ctx.moveTo(side[0], rampY[0]);
    for (let i = 1; i <= top; i++) ctx.lineTo(side[i], rampY[i]);
    for (let i = top; i >= 0; i--) ctx.lineTo(side[i], by[a + i]);
    ctx.closePath();
  }
  ctx.fillStyle = COLOUR.JUMP_SIDE;
  ctx.fill();

  /* The deck, one quad per segment, running from the road's own value at
     the bottom to nearly the lip's at the top.

     BANDS WERE TRIED FIRST AND FAILED. Alternating light and dark stripes
     across a rising surface read as a zebra crossing painted flat on the
     road, which is the exact opposite of the thing being built. A value
     that climbs with the deck reads as a surface turning up into the
     light, and that is what says ramp. */
  for (let i = 0; i < top; i++) {
    ctx.beginPath();
    ctx.moveTo(rampL[i], rampY[i]);
    ctx.lineTo(rampR[i], rampY[i]);
    ctx.lineTo(rampR[i + 1], rampY[i + 1]);
    ctx.lineTo(rampL[i + 1], rampY[i + 1]);
    ctx.closePath();
    ctx.fillStyle = rampAt(JUMP_DECK_RAMP,
                           jumpHeightAt(j, a + i + baseIndex + 1) / FEEL.JUMP_RAMP_HEIGHT);
    ctx.fill();
  }

  /* Rails up both sides. A line that visibly climbs away from the road is
     the single clearest statement that a surface rises, and it is what
     carries the ramp at draw distance once the deck is only a few pixels
     across. */
  ctx.lineWidth = Math.max(1.5, bh[a] * FEEL.JUMP_RAMP_HEIGHT * 0.06);
  ctx.strokeStyle = COLOUR.JUMP_LIP;
  ctx.globalAlpha = 0.55;
  for (const side of [rampL, rampR]) {
    ctx.beginPath();
    ctx.moveTo(side[0], rampY[0]);
    for (let i = 1; i <= top; i++) ctx.lineTo(side[i], rampY[i]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // The lip, only when the real lip is the boundary on screen.
  if (b !== j.to + 1 - baseIndex) return;
  const thick = Math.max(2, bh[b] * FEEL.JUMP_RAMP_HEIGHT * 0.12);
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = JUMP_GLOW_FILL;
  ctx.fillRect(rampL[top] - thick, rampY[top] - thick * 1.6,
               rampR[top] - rampL[top] + thick * 2, thick * 3.2);
  ctx.globalAlpha = 1;
  ctx.fillStyle = COLOUR.JUMP_LIP;
  ctx.fillRect(rampL[top], rampY[top], rampR[top] - rampL[top], thick);
}

/* The run of standing chevrons. One path for every chevron in shot,
   whatever else is on the road, which is the same batching discipline the
   rest of the frame is drawn under. */
function jumpChevrons(first, last, baseIndex, grow) {
  let any = false;
  ctx.beginPath();
  for (let k = 0; k < jumps.length; k++) {
    const j = jumps[k];
    if (j.done) continue;                    // taken, and behind the player
    for (let m = 1; m <= FEEL.JUMP_ARROW_COUNT; m++) {
      const n = j.from - m * FEEL.JUMP_ARROW_SPACING - baseIndex;
      if (n < first || n > last || !bvis[n]) continue;
      any = true;
      // The run grows toward the ramp, so it reads as leading somewhere
      // rather than as a row of identical markers.
      const shrink = grow * (1 - (m - 1) * 0.12);
      const hy = bh[n] * FEEL.JUMP_ARROW_HEIGHT * shrink;
      const hx = bw[n] * FEEL.JUMP_ARROW_HALF * shrink;
      const tx = hx * FEEL.JUMP_ARROW_THICK, ty = hy * FEEL.JUMP_ARROW_THICK;
      const cx = bx[n], base = by[n];
      ctx.moveTo(cx, base - hy);
      ctx.lineTo(cx + hx, base);
      ctx.lineTo(cx + hx - tx, base);
      ctx.lineTo(cx, base - hy + ty);
      ctx.lineTo(cx - hx + tx, base);
      ctx.lineTo(cx - hx, base);
      ctx.closePath();
    }
  }
  return any;
}

/* ==================================================================
   THE GHOST. DAILY ONLY, AND THERE IS NO FALLBACK FOR ENDLESS.

   Section 4.5 asks for a recorded rival and gives the reason: a visible
   opponent turns an abstract number into a race, and it solves the cold
   start problem because the second player is always yourself. What it
   could not have on an endless road is a road to be recorded ON. A line
   replayed over a different generation drives through the hazards and off
   the edge inside seconds, so the ghost waited for the daily and arrives
   with it.

   THE RECORD. Sampled by DISTANCE rather than by time, which is what
   makes it both small and exact:

     - Sample i is at exactly i * GHOST_STEP world units. The ghost's
       position along the road therefore costs nothing to store and
       cannot accumulate drift over a long run, which a delta encoded
       z would.
     - What is stored is where it was ACROSS the road, how far round the
       car was, and how long it took to get there. The first two are the
       line the player is trying to learn. The third is the only thing
       that differs between two runs of the same road, and it is what
       makes the ghost passable rather than a rail.

   THE ENCODING is thirty bits a sample, written as five characters of a
   sixty four character alphabet:

       x    12 bits   world units across, two unit steps, plus or minus 4096
       yaw   9 bits   plus or minus 90 degrees, about a third of a degree
       dt    9 bits   zero to half a second, about a millisecond

   Five bytes a sample at nine samples a second is under fifty bytes a
   second of driving. A two minute run is about five and a half kilobytes.

   ------------------------------------------------------------------
   THE GHOST IS YOUR LAST RUN. EVERY RUN. THIS IS A CHANGED RULE.

   It used to be the best CLEAN run, borrowed from BEST SCORE, and that
   was wrong. A GHOST IS A LEARNING TOOL AND A RECORD IS A SCOREBOARD
   ENTRY, and those two want opposite rules:

     A RECORD has to be hard to take, or it means nothing. BEST SCORE,
     today's record and the completion time are therefore still closed to
     any run with a continue on it, and none of that is relaxed here.

     A GHOST has to be RECENT, or it teaches nothing. The line worth
     watching is the one you drove a minute ago on the corner you are
     about to arrive at, not a line from an hour ago that happened to
     score well. So every run records: continued runs, and runs that
     ended in a crash, both included, and the newest always wins.

   WHAT A CONTINUE DOES TO THE RECORDING. It rewinds it to the checkpoint
   and carries on writing from there, so the stored line is the path the
   attempt actually took through each section rather than a splice of the
   failed excursions. Which means that on a resume the ghost shows what
   was done on THAT section last time, which is the whole point of having
   one there.

   The one thing that will not overwrite a line is a run too short to be
   a line at all. Two samples is the floor, because one point cannot be
   interpolated between and storing it would only wipe what is there.
   ================================================================== */
const GHOST_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const GHOST_INDEX = (function () {
  const m = {};
  for (let i = 0; i < GHOST_ALPHABET.length; i++) m[GHOST_ALPHABET.charAt(i)] = i;
  return m;
})();

function ghostStep() { return FEEL.GHOST_STEP_SEGMENTS * FEEL.SEGMENT_LENGTH; }

/* What is being recorded this run, and what is being replayed. Two
   separate things on purpose: the run in progress is not the ghost, and
   only becomes one if it turns out to be the day's best. */
const ghostRec = { x: [], yaw: [], dt: [], n: 0, live: false, nextZ: 0, lastT: 0 };
const ghost = {
  x: [], yaw: [], t: [], n: 0,
  live: false,        // there is a line to replay
  shown: false,       // and it is on screen right now
  i: 0,               // replay cursor, monotonic
  pos: 0,             // where it is along the road, same space as `position`
  frac: 0, yawNow: 0,
  ahead: true,        // is it in front of the player
  said: 0             // seconds until another pass callout may fire
};

function ghostClear() {
  ghost.x.length = 0; ghost.yaw.length = 0; ghost.t.length = 0;
  ghost.n = 0; ghost.live = false; ghost.shown = false;
}

function ghostEncode() {
  const out = [];
  for (let i = 0; i < ghostRec.n; i++) {
    const x = clamp(Math.round(ghostRec.x[i] / 2) + 2048, 0, 4095);
    const y = clamp(Math.round(ghostRec.yaw[i] * 180 / Math.PI * 2.83) + 256, 0, 511);
    const d = clamp(Math.round(ghostRec.dt[i] * 1000), 0, 511);
    // Thirty bits, most significant first, five characters.
    let v = x * 262144 + y * 512 + d;
    const five = ['', '', '', '', ''];
    for (let k = 4; k >= 0; k--) { five[k] = GHOST_ALPHABET.charAt(v & 63); v = Math.floor(v / 64); }
    out.push(five.join(''));
  }
  return out.join('');
}

function ghostDecode(str) {
  ghostClear();
  if (!str || str.length < 5) return false;
  const n = Math.floor(str.length / 5);
  let t = 0;
  for (let i = 0; i < n; i++) {
    let v = 0;
    for (let k = 0; k < 5; k++) {
      const c = GHOST_INDEX[str.charAt(i * 5 + k)];
      if (c === undefined) { ghostClear(); return false; }   // not ours, or truncated
      v = v * 64 + c;
    }
    const d = v % 512; v = Math.floor(v / 512);
    const y = v % 512; v = Math.floor(v / 512);
    t += d / 1000;
    ghost.x.push((v - 2048) * 2);
    ghost.yaw.push((y - 256) / 2.83 * Math.PI / 180);
    ghost.t.push(t);
  }
  ghost.n = n;
  ghost.live = n > 1;
  return ghost.live;
}

/* Recording. Called once a frame while driving, after the car has moved.
   `prevPos` and `prevX` are what update already has to hand for the tyre
   marks, so nothing extra is tracked to get the crossing right, and `dt`
   is this frame's own delta.

   THE FRAME DELTA IS NOT OPTIONAL AND LEAVING IT OUT IS WHAT MADE THE
   GHOST JUDDER. This used to reconstruct the crossing time as

       at = runTime - (1 - f) * (runTime - ghostRec.lastT)

   where f is the fraction of THIS FRAME at which the step was crossed.
   The quantity it multiplied f by has to be the frame, and
   runTime - lastT is the gap since the previous SAMPLE, which is seven
   frames long. So every recorded interval came out as f times the true
   interval, with f effectively uniform over 0 to 1.

   Measured on shipped road, the recorded intervals ran 0.078, 0.052,
   0.204, 0.078, 0.052, 0.204 where the truth is a steady 0.111. The
   ghost's replay speed therefore changed by a factor of four nine times
   a second, which is exactly the bobbing that was reported. The total
   time was right, because the error telescopes, which is why nothing
   downstream ever noticed. */
function ghostRecord(prevPos, prevX, dt) {
  if (!ghostRec.live) return;
  const frameT0 = runTime - dt;              // runTime is the END of this frame
  while (position >= ghostRec.nextZ && ghostRec.n < FEEL.GHOST_MAX_SAMPLES) {
    /* Interpolated to the exact crossing rather than snapped to the
       frame. A frame covers about an eighth of a step at speed, and
       snapping would put an eighth of a step of jitter into the timing
       of every sample. */
    const span = Math.max(1e-6, position - prevPos);
    const f = clamp((ghostRec.nextZ - prevPos) / span, 0, 1);
    const at = frameT0 + f * dt;
    ghostRec.x.push(prevX + (carX - prevX) * f);
    ghostRec.yaw.push(carYaw());
    ghostRec.dt.push(Math.max(0, at - ghostRec.lastT));
    ghostRec.lastT = at;
    ghostRec.n++;
    ghostRec.nextZ += ghostStep();
  }
  if (ghostRec.n >= FEEL.GHOST_MAX_SAMPLES) ghostRec.live = false;
}

function ghostStartRecording() {
  ghostRec.x.length = 0; ghostRec.yaw.length = 0; ghostRec.dt.length = 0;
  ghostRec.n = 0;
  ghostRec.nextZ = 0;
  ghostRec.lastT = 0;
  /* Daily only, and there is no longer a second condition. Every run on
     today's road records, because the ghost is the last run and not the
     best one. See the block header. */
  ghostRec.live = mode === DAILY;
}

/* A CONTINUE REWINDS THE RECORDING TO THE CHECKPOINT rather than ending
   it, which is what makes the stored line the attempt's real path instead
   of a splice with a dead end in the middle of it.

   Sample i is at exactly i * step, so which samples are behind the resume
   point is arithmetic and not a search. The time axis follows: runTime is
   put back to the checkpoint's time by continueRun, and the cumulative
   time of the last kept sample is at or before that, so the next sample
   recorded spans the join correctly with nothing to reconcile. */
function ghostRewind() {
  if (mode !== DAILY) { ghostRec.live = false; return; }
  const step = ghostStep();
  const keep = clamp(Math.floor(position / step) + 1, 0, ghostRec.n);
  let t = 0;
  for (let i = 0; i < keep; i++) t += ghostRec.dt[i];
  ghostRec.x.length = keep;
  ghostRec.yaw.length = keep;
  ghostRec.dt.length = keep;
  ghostRec.n = keep;
  ghostRec.nextZ = keep * step;
  ghostRec.lastT = t;
  ghostRec.live = keep < FEEL.GHOST_MAX_SAMPLES;
}

/* Stored at the end of every daily run, which is the whole of the new
   rule, and decoded straight back so the very next attempt, restart or
   continue, is already racing it. */
function ghostBank() {
  if (mode !== DAILY) return false;
  if (ghostRec.n < 2) return false;          // too short to be a line
  const blob = ghostEncode();
  dailyGhostBytes = blob.length;
  // The LEVEL's own line. Three ghosts is three stored blobs; the
  // renderer still only ever has the one loaded.
  recFor(level).ghost = blob;
  storeSet('daily.ghost.' + clampLevel(level), blob);
  ghostDecode(blob);
  return true;
}

/* ------------------------------------------------------------------
   THE LINE BETWEEN SAMPLES, AND WHY IT IS A CURVE AND NOT A CHORD.

   The samples are evenly spaced in DISTANCE, so index space is the
   natural parameter for the line across the road and for the heading:
   both are functions of how far along the road the car was, and neither
   has anything to do with how long it took to get there. A uniform
   Catmull-Rom through four consecutive samples is therefore exactly the
   right shape, and it costs nothing at all in storage.

   WHAT IT FIXES. Joining the samples with straight lines puts a corner
   at every one of them, nine times a second. Measured on shipped road
   the sideways velocity stepped by 36 units at the median join and 810
   at the ninety fifth, on a car whose own sideways velocity is moved
   smoothly by GRIP_TIME and never steps at all. A rival that changes
   direction instantaneously does not read as a car being driven.

   It is not applied to the position along the road. That one has to stay
   MONOTONIC, because a ghost that goes backwards for a frame is a far
   worse artefact than the one being fixed, and a cubic through four
   points carries no such guarantee. It does not need it either: with the
   frame delta bug fixed its speed steps measure zero at the median.
   ------------------------------------------------------------------ */
function ghostSpline(arr, i, f) {
  const n = ghost.n;
  // The ends have no neighbour outside, so they lean on themselves,
  // which is the ordinary clamped end condition and keeps the curve
  // inside the data there.
  const p0 = arr[i > 0 ? i - 1 : 0];
  const p1 = arr[i];
  const p2 = arr[i + 1];
  const p3 = arr[i + 2 < n ? i + 2 : n - 1];
  const f2 = f * f, f3 = f2 * f;
  return 0.5 * (2 * p1
              + (p2 - p0) * f
              + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f2
              + (3 * p1 - 3 * p2 + p3 - p0) * f3);
}

/* Replay. The cursor only ever goes forward, so this is a step and not a
   search however long the record is. */
function ghostUpdate(dt) {
  ghost.shown = false;
  if (ghost.said > 0) ghost.said -= dt;
  if (!ghost.live || mode !== DAILY || state !== DRIVING) return;
  const t = runTime;
  /* THE CURSOR HAS TO BE ABLE TO GO BACKWARDS, and this is a bug fix.

     A CONTINUE sets runTime back to the checkpoint's time, which is
     EARLIER than wherever the cursor had walked to on the run that just
     ended. A forward only walk cannot follow that: the cursor stayed
     ahead, the interpolation clamped, and the ghost froze thousands of
     units up the road where it was never drawn again. The ghost was
     therefore missing for the whole of every continued run, which is
     exactly half of what was reported.

     Reset and re walk rather than search: it costs one pass over at most
     four thousand entries on the single frame a resume happens, and it
     is right for any backwards jump rather than only for the one that
     was found. */
  if (t < ghost.t[ghost.i]) ghost.i = 0;
  while (ghost.i < ghost.n - 2 && ghost.t[ghost.i + 1] <= t) ghost.i++;
  if (t >= ghost.t[ghost.n - 1]) {
    /* The recorded run ended here. Nothing is invented past the end: the
       ghost simply is not there any more, which is exactly what having
       outlasted it means. */
    ghost.pos = (ghost.n - 1) * ghostStep();
    ghostPass();
    return;
  }
  const a = ghost.t[ghost.i], b = ghost.t[ghost.i + 1];
  const f = b > a ? clamp((t - a) / (b - a), 0, 1) : 0;
  ghost.pos = (ghost.i + f) * ghostStep();
  ghost.frac = ghostSpline(ghost.x, ghost.i, f);
  ghost.yawNow = ghostSpline(ghost.yaw, ghost.i, f);
  ghost.shown = true;
  ghostPass();
}

/* Passing, and being passed, in the DRIFT lane. It goes there rather than
   in the event lane because the event lane is the checkpoint and the best
   score break, and a ghost pass must not push either of those aside. The
   gap is hysteresis: without it a dead heat strobes the callout on every
   other frame, which is the failure this cost on the chain in session
   twenty three. */
function ghostPass() {
  const ahead = ghost.pos > position;
  if (ahead === ghost.ahead) return;
  if (Math.abs(ghost.pos - position) < FEEL.GHOST_PASS_GAP) return;
  ghost.ahead = ahead;
  if (ghost.said > 0) return;
  ghost.said = FEEL.GHOST_PASS_COOLDOWN;
  if (ahead) sayDrift('GHOST AHEAD', COLOUR.GHOST_EDGE, 1, true);
  else {
    sayDrift('PASSED THE GHOST', COLOUR.GATE, 1.1, true);
    /* A SOUND, WHICH IT NEVER HAD. Going past the only rival in the game
       was a line of text and nothing else, which is the definition of a
       silent event. No flash: the screen wash belongs to the record
       break and stacking two of them is exactly what the juice audit is
       for. The cooldown above already stops a dead heat repeating it. */
    audioSting(STING_GHOST);
  }
}

/* Drawn from the SAME boundary tables the road is, so it sits in the
   world rather than on the screen and it rides the curve for free.

   bw[k] / hw is scale * w / 2, which is exactly bh[k], so a world x at
   boundary k lands at bx[k] + bh[k] * x with no width lookup at all and
   no chance of using the wrong segment's half width. */
const ghostPt = { sx: 0, sy: 0, ok: false };
function ghostPoint(worldZ, worldX, worldY, first, last, baseIndex) {
  const k = (worldZ + FEEL.CAMERA_DISTANCE) / FEEL.SEGMENT_LENGTH - baseIndex;
  const i = Math.floor(k);
  ghostPt.ok = false;
  if (i < first || i + 1 > last || !bvis[i]) return ghostPt;
  const f = k - i;
  const bxk = bx[i] + (bx[i + 1] - bx[i]) * f;
  const byk = by[i] + (by[i + 1] - by[i]) * f;
  const bhk = bh[i] + (bh[i + 1] - bh[i]) * f;
  ghostPt.sx = bxk + bhk * worldX;
  ghostPt.sy = byk - bhk * worldY;
  ghostPt.ok = true;
  return ghostPt;
}

const ghostCorners = [0, 0, 0, 0, 0, 0, 0, 0];      // four x,y pairs, road plane
const ghostRoof = [0, 0, 0, 0, 0, 0, 0, 0];
function drawGhost(first, last, baseIndex) {
  /* The state test belongs here as well as in ghostUpdate. The frame loop
     returns early on a pause and on the hit stop without updating, so a
     rival left frozen beside the wreck is one early return away at any
     time. The invariant is that the ghost is only ever on screen while
     the car is being driven, so it is asserted where the drawing happens. */
  if (!ghost.shown || state !== DRIVING) return;
  const c = Math.cos(ghost.yawNow), sn = Math.sin(ghost.yawNow);
  const hw = FEEL.CAR_BODY_WIDTH / 2, hl = FEEL.CAR_BODY_LENGTH / 2;
  /* The roof is INSET, and it is what makes this read as a car rather
     than as two slabs floating one above the other. A cabin narrower and
     shorter than the footprint gives the silhouette its shoulders, which
     is the whole of section 7's argument about detail living in the
     shape and not in the shading. */
  const rw = hw * FEEL.GHOST_CABIN_WIDE, rl = hl * FEEL.GHOST_CABIN_LONG;
  const back = hl * FEEL.GHOST_CABIN_BACK;
  const corners = [[-hw, -hl], [hw, -hl], [hw, hl], [-hw, hl]];
  const cabin = [[-rw, -rl + back], [rw, -rl + back], [rw, rl + back], [-rw, rl + back]];
  for (let i = 0; i < 4; i++) {
    const lx = corners[i][0], lz = corners[i][1];
    const wx = ghost.frac + lx * c - lz * sn;
    const wz = ghost.pos + lx * sn + lz * c;
    const p = ghostPoint(wz, wx, 0, first, last, baseIndex);
    if (!p.ok) return;                       // any corner off the tables, skip the frame
    ghostCorners[i * 2] = p.sx; ghostCorners[i * 2 + 1] = p.sy;
    const cx2 = cabin[i][0], cz2 = cabin[i][1];
    const qx = ghost.frac + cx2 * c - cz2 * sn;
    const qz = ghost.pos + cx2 * sn + cz2 * c;
    const q = ghostPoint(qz, qx, FEEL.GHOST_HEIGHT, first, last, baseIndex);
    if (!q.ok) return;
    ghostRoof[i * 2] = q.sx; ghostRoof[i * 2 + 1] = q.sy;
  }
  /* Footprint, then roof, then the roof outlined. Three operations, no
     side walls: a filled box at this alpha reads as a smear where the
     faces overlap, and the gap between two quads reads as height without
     putting anything solid over the road. */
  ctx.globalAlpha = FEEL.GHOST_ALPHA * 0.5;
  ctx.fillStyle = COLOUR.GHOST;
  polygon(ghostCorners[0], ghostCorners[1], ghostCorners[2], ghostCorners[3],
          ghostCorners[4], ghostCorners[5], ghostCorners[6], ghostCorners[7]);
  ctx.fill();
  ctx.globalAlpha = FEEL.GHOST_ALPHA;
  polygon(ghostRoof[0], ghostRoof[1], ghostRoof[2], ghostRoof[3],
          ghostRoof[4], ghostRoof[5], ghostRoof[6], ghostRoof[7]);
  ctx.fill();
  ctx.strokeStyle = COLOUR.GHOST_EDGE;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawHazardWarnings(first, last, baseIndex) {
  const warn = FEEL.HAZARD_WARN_SEGMENTS;
  const count = FEEL.HAZARD_WARN_STRIPES;
  const alen = FEEL.HAZARD_ARROW_LENGTH;
  const gap = Math.max(alen + 1, Math.floor(warn / count));
  let any = false;
  ctx.beginPath();
  for (let k = 0; k < hazards.length; k++) {
    const h = hazards[k];
    if (h.from - warn > baseIndex + last || h.from < baseIndex + first) continue;
    const lanes = laneArrows(h, warn);
    if (!lanes || !lanes.length) continue;
    for (let m = 1; m <= count; m++) {
      const tail = h.from - m * gap;          // the wide end, nearest the player
      const head = tail + alen;               // the point, further up the road
      const nt = tail - baseIndex, nh = head - baseIndex;
      if (nt < first || nh > last || !bvis[nt] || !bvis[nh]) continue;
      const st = segAt(tail);
      if (!st) continue;
      const wide = (FEEL.CAR_BODY_WIDTH * 0.55) / st.hw;
      for (let g = 0; g < lanes.length; g++) {
        any = true;
        const lx = lanes[g];
        // An arrowhead pointing the way the car is going: wide across the
        // near end, coming to a point up the road.
        ctx.moveTo(bx[nt] + bw[nt] * (lx - wide), by[nt]);
        ctx.lineTo(bx[nt] + bw[nt] * (lx + wide), by[nt]);
        ctx.lineTo(bx[nh] + bw[nh] * lx, by[nh]);
        ctx.closePath();
      }
    }
  }
  if (any) {
    ctx.globalAlpha = FEEL.HAZARD_WARN_ALPHA;
    // The go colour. The arrow only ever says which way through; danger
    // is carried by the bars, the striping and the hazard's own body.
    ctx.fillStyle = COLOUR.HAZARD_WARN_ARROW;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  hazardBarriers(first, last, baseIndex);
}

/* THE BARRIER BARS, and they are the half of this that says STOP.

   The arrows say where the gap is, which is useful and stays. What was
   missing is anything that says do not go HERE, and without it a run of
   marks on the road in front of a hazard has the same grammar as a run of
   marks on the road in front of a ramp: pointed, forward facing, leading
   you on. Two players read the two the wrong way round.

   These are TRANSVERSE. Short bars laid straight across the blocked
   width, near white on the hazard's own red, which is the striping every
   road works on earth uses. A horizontal form cannot be confused with a
   rising chevron at any speed or any distance, and it does not depend on
   telling two colours apart. */
function hazardBarriers(first, last, baseIndex) {
  const warn = FEEL.HAZARD_WARN_SEGMENTS;
  const count = FEEL.HAZARD_WARN_BARS;
  const gap = Math.max(2, Math.floor(warn / Math.max(1, count)));
  let any = false;
  ctx.beginPath();
  for (let k = 0; k < hazards.length; k++) {
    const h = hazards[k];
    if (h.from - warn > baseIndex + last || h.from < baseIndex + first) continue;
    const seg = segAt(h.from);
    if (!seg) continue;
    const x = hazardX(h);
    for (let m = 1; m <= count; m++) {
      const at = h.from - m * gap;
      const n = at - baseIndex;
      if (n < first || n + 1 > last || !bvis[n] || !bvis[n + 1]) continue;
      const st = segAt(at);
      if (!st) continue;
      /* The blocked width, plus the clip shoulder, because the shoulder
         is where a scrape starts and the bar is the promise that the
         whole of it is bad news. Fades toward the player so the run reads
         as approaching rather than as a fence. */
      const half = (h.half + FEEL.HAZARD_CLIP) / st.hw;
      const thick = (by[n] - by[n + 1]) * FEEL.HAZARD_WARN_BAR_THICK;
      any = true;
      const l = bx[n] + bw[n] * (x - half), r = bx[n] + bw[n] * (x + half);
      ctx.moveTo(l, by[n]);
      ctx.lineTo(r, by[n]);
      ctx.lineTo(r, by[n] - Math.max(1, thick));
      ctx.lineTo(l, by[n] - Math.max(1, thick));
      ctx.closePath();
    }
  }
  if (!any) return;
  ctx.globalAlpha = FEEL.HAZARD_WARN_BAR_ALPHA;
  ctx.fillStyle = COLOUR.HAZARD_WARN_BAR;
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* The hazards themselves. One box per hazard, standing on the road, drawn
   in four batched passes over every hazard in shot: a wide faint glow, the
   near face, the top face and a lit leading edge. Four fills for the whole
   screen however many are in view, which is the same discipline the road
   itself is drawn under.

   Heights use the horizontal scale, the same way the car and the road
   thickness do, so a hazard keeps its proportions rather than being
   stretched by the vertical anisotropy. */
function hazardQuads(first, last, baseIndex, spread, top, parity) {
  let any = false;
  ctx.beginPath();
  for (let k = 0; k < hazards.length; k++) {
    const h = hazards[k];
    const x = hazardX(h);
    for (let i = h.from; i <= h.to; i++) {
      const n = i - baseIndex;
      if (n < first || n > last || !bvis[n]) continue;
      if (parity !== undefined && (i & 1) !== parity) continue;
      const seg = segAt(i);
      if (!seg) continue;
      any = true;
      const half = (h.half + spread) / seg.hw;
      const rise = top ? bh[n] * FEEL.HAZARD_HEIGHT : 0;
      const riseN = top ? bh[n + 1] * FEEL.HAZARD_HEIGHT : 0;
      const y1 = by[n] - rise, y2 = by[n + 1] - 1 - riseN;
      const l1 = bx[n] + bw[n] * (x - half), r1 = bx[n] + bw[n] * (x + half);
      const l2 = bx[n + 1] + bw[n + 1] * (x - half), r2 = bx[n + 1] + bw[n + 1] * (x + half);
      if (top) {
        // The near face, from the road up to the top of the box.
        ctx.moveTo(l1, by[n]); ctx.lineTo(r1, by[n]);
        ctx.lineTo(r1, y1); ctx.lineTo(l1, y1);
      } else {
        ctx.moveTo(l1, y1); ctx.lineTo(r1, y1); ctx.lineTo(r2, y2); ctx.lineTo(l2, y2);
      }
      ctx.closePath();
    }
  }
  return any;
}

/* The face that actually points at the player, drawn once per hazard
   with diagonal hazard striping across it. This is the whole "do not hit
   me" signal: a tall dark wall leaning bands across itself, which is what
   a crash barrier looks like everywhere in the world.

   Clipped rather than clamped, because a leaning band across a trapezoid
   has no closed form worth writing, and there are only ever a handful of
   hazards inside the draw distance. */
function drawHazardFronts(first, last, baseIndex) {
  for (let k = 0; k < hazards.length; k++) {
    const h = hazards[k];
    const n = h.from - baseIndex;
    if (n < first || n > last || !bvis[n]) continue;
    const seg = segAt(h.from);
    if (!seg) continue;
    const x = hazardX(h);
    const half = h.half / seg.hw;
    const l = bx[n] + bw[n] * (x - half), r = bx[n] + bw[n] * (x + half);
    const top = by[n] - bh[n] * FEEL.HAZARD_HEIGHT, bot = by[n];
    const wpx = r - l, hpx = bot - top;
    if (wpx < 3 || hpx < 3) continue;          // too small to read, skip the work
    ctx.save();
    ctx.beginPath();
    ctx.rect(l, top, wpx, hpx);
    ctx.clip();
    ctx.fillStyle = COLOUR.HAZARD_SIDE;
    ctx.fillRect(l, top, wpx, hpx);
    const slant = hpx * FEEL.HAZARD_STRIPE_SLANT;
    const step = (wpx + slant) / FEEL.HAZARD_STRIPE_COUNT;
    ctx.beginPath();
    for (let i = -1; i < FEEL.HAZARD_STRIPE_COUNT + 1; i += 2) {
      const b0 = l + i * step;
      ctx.moveTo(b0, bot); ctx.lineTo(b0 + step, bot);
      ctx.lineTo(b0 + step + slant, top); ctx.lineTo(b0 + slant, top);
      ctx.closePath();
    }
    ctx.fillStyle = COLOUR.HAZARD_TOP;
    ctx.fill();
    ctx.restore();
  }
}

let HAZARD_GLOW_FILL = 'rgb(' + COLOUR.HAZARD_GLOW + ')';
let GATE_GLOW_FILL = 'rgb(' + COLOUR.GATE_GLOW + ')';
function drawHazards(first, last, baseIndex) {
  if (!hazards.length) return;
  // Wide and faint first, the same two pass glow the road edges use, and
  // still no shadowBlur anywhere.
  if (hazardQuads(first, last, baseIndex, FEEL.HAZARD_CLIP * 2.2, false)) {
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = HAZARD_GLOW_FILL;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  // The clip shoulder, which is a real band and is drawn as one.
  if (hazardQuads(first, last, baseIndex, FEEL.HAZARD_CLIP, false)) {
    ctx.fillStyle = COLOUR.HAZARD_SIDE;
    ctx.fill();
  }
  // The near face of the core, then its top.
  if (hazardQuads(first, last, baseIndex, 0, true)) {
    ctx.fillStyle = COLOUR.HAZARD_SIDE;
    ctx.fill();
  }
  /* The top, in alternating bands along its length. Two fills rather
     than one, and between them they say "marked object" rather than
     "coloured surface". */
  if (hazardQuads(first, last, baseIndex, 0, false, 0)) {
    ctx.fillStyle = COLOUR.HAZARD_TOP;
    ctx.fill();
  }
  if (hazardQuads(first, last, baseIndex, 0, false, 1)) {
    ctx.fillStyle = COLOUR.HAZARD_DARK;
    ctx.fill();
  }
  drawHazardFronts(first, last, baseIndex);
  // The lit top edge, so the object resolves as a solid at draw distance
  // rather than as a smear, exactly as the road lip does.
  let any = false;
  ctx.beginPath();
  for (let k = 0; k < hazards.length; k++) {
    const h = hazards[k];
    const x = hazardX(h);
