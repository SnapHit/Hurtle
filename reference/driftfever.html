  const label = String(banked + Math.floor(score));
  /* THE OUTLINE COUNTS TOWARD THE WIDTH. fittedSize measures the glyphs
     and arcadeNumber strokes them, so half a line width hangs off each
     end of what was measured. At 480 by 350 with a nine figure score
     that was a one pixel overlap with the clock plate: small, real, and
     the kind of thing that is a three pixel overlap on the next screen
     size nobody tested. Reserved against the REQUESTED size, which is
     the largest it can be, so the reservation is never short. */
  const ssize = fittedSize(label, '900', size,
                           room - Math.max(3, size * 0.14));
  ctx.font = '900 ' + ssize + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const sw = ctx.measureText(label).width;
  const scx = x0 + sw / 2;
  if (scoreBeaten()) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(4, ssize * FEEL.BEST_GLOW_SPREAD);
    ctx.globalAlpha = FEEL.BEST_GLOW_ALPHA;
    ctx.strokeStyle = 'rgb(' + COLOUR.SCORE_GLOW + ')';
    ctx.strokeText(label, scx, cy);
    ctx.globalAlpha = 1;
  }
  arcadeNumber(label, scx, cy, ssize,
               flash > 0 ? COLOUR.GATE : scoreHeatColour(heat));

  // THE RIGHT: which track this is and where the ghost is, dim, in the
  // same small treatment the stack gives it, right aligned to the end.
  const info = modeLine();
  const isize = fittedSize(info.line, '700', Math.round(s * FEEL.HUD_BAR_INFO), room);
  ctx.globalAlpha = FEEL.HUD_BAR_INFO_ALPHA;
  text(info.line, x1, cy, isize, '700', 'right', info.colour);
  ctx.globalAlpha = 1;

  /* THE PIPS, FOLDED IN. Not a row of their own: one line the width of
     the strip, divided into a segment per gate, which is the same
     information as the portrait row and costs a couple of pixels of
     height instead of a whole row. It doubles as the strip's underline,
     so the four elements read as one instrument.

     CLEARED OFF THE SCORE AT ITS BIGGEST, not off the score as drawn.
     The score swells with the multiplier, kicks on every whole one
     crossed and again at a gate, up to 1.48 times its resting size, so
     hanging the line off the live size makes it twitch on every kick,
     and hanging it off the resting size lets the digits sit on top of
     it. 0.74 is half of that worst case: the line is FIXED, and the
     fattest the score can ever get still clears it. */
  const clear = Math.round(s * FEEL.HUD_BAR_SCORE) * 0.74;
  const pipY = cy + clear + s * FEEL.HUD_BAR_PIP_GAP;
  let below = cy + clear;
  if (mode === DAILY) { drawPipStrip(x0, x1, pipY); below = pipY; }
  hudBottom = below + FEEL.HUD_BAR_PIP_HEIGHT;
}

/* One line per gate, laid end to end across a span. The last one is the
   finish and keeps the score's gold, the way the portrait row does, so
   the end of the strip still reads as an end. */
function drawPipStrip(x0, x1, y) {
  const n = dailyGates;
  const hgt = FEEL.HUD_BAR_PIP_HEIGHT;
  const gap = Math.max(2, (x1 - x0) * 0.006);
  const each = ((x1 - x0) - gap * (n - 1)) / n;
  for (let i = 0; i < n; i++) {
    const x = x0 + i * (each + gap);
    const last = i === n - 1;
    const done = i < gatesPassed;
    ctx.globalAlpha = done ? FEEL.PIP_ALPHA_DONE : FEEL.PIP_ALPHA_TODO;
    ctx.fillStyle = last ? COLOUR.SCORE : COLOUR.GATE;
    roundRect(x, y - hgt / 2, each, hgt, hgt * 0.5);
    ctx.fill();
    if (!done && i === gatesPassed && state === DRIVING) {
      ctx.globalAlpha = 0.30 + 0.35 * Math.abs(Math.sin(runTime * 3));
      roundRect(x, y - hgt / 2, each, hgt, hgt * 0.5);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* The resting gold running to the best score cream, and once the stored
   best has been passed, that cream running on to white. Both tables are
   built up with the rest of the ramps, beside the palette they come out
   of. */
function scoreHeatColour(t) {
  return rampAt(scoreBeaten() ? SCORE_RECORD_RAMP : SCORE_RAMP, t);
}

/* The pit timer. A plate, tabular digits, and the distance to the next
   gate as a second, quieter figure on the same plate, because that is
   also time and it belongs in the time element rather than being a fifth
   number somewhere else.

   THE PLACEMENT IS AN ARGUMENT AND THE TREATMENT IS NOT. Portrait hangs
   it under the score and passes nothing; the landscape bar puts it in
   the middle of the strip and passes a centre and a size. One routine
   either way, so the plate, the tabular digits, the divider, the low
   time blink, the earning arrow and the gate payout are the same
   instrument in both orientations rather than two that have to be kept
   in step. */
function drawClock(w, h, atX, atY, atSize) {
  /* Drawn from the first frame, not from the end of the on ramp. It used
     to return early for the whole thirty seconds, so a run that ended
     inside the on ramp had no clock in it at all and a player never saw
     one until they had already survived twice. Not running is a state the
     readout can show; being absent is not. */
  // The same test updateClock uses, so the readout cannot say counting
  // while the rule says paused.
  const running = !(mode === DAILY && levelBand(level) <= 0)
               && (skipOnRamp || runTime >= FEEL.ONRAMP_SECONDS);
  const s = Math.min(w, h);
  const placed = atSize !== undefined;
  const size = placed ? atSize : Math.round(s * FEEL.CLOCK_SIZE);
  const gateSecs = Math.max(0, nextGate - carSegIndex) * FEEL.SEGMENT_LENGTH / FEEL.SPEED;
  const low = running && clock < FEEL.CLOCK_LOW;
  const reachable = clock >= gateSecs;
  // Paused during the on ramp: present, legible, and visibly not counting.
  const dim = running ? 1 : 0.45;

  const main = timeLabel(clock);
  const gl = timeLabel(gateSecs);
  ctx.font = '700 ' + size + 'px ' + MONO;
  const mw = ctx.measureText(main).width;
  const gsize = Math.round(size * 0.62);
  ctx.font = '600 ' + gsize + 'px ' + MONO;
  const gw = ctx.measureText(gl).width;

  const padx = size * 0.42, pady = size * 0.30, gap = size * 0.5;
  const boxW = mw + gap + gw + padx * 2;
  const boxH = size + pady * 2;
  /* Hung off the score rather than off its own screen fraction, so it sits
     directly under it in both orientations and follows the score when the
     score swells with the multiplier or flashes at a gate. scoreTop is a
     middle baseline, so half the score size clears the digits. */
  const y = placed ? atY
                   : scoreTop + scoreSize * 0.5 + s * FEEL.CLOCK_GAP + boxH * 0.5;
  /* The bottom of the whole HUD stack, so anything placed under it can
     measure rather than assume. The callouts are the only reader. The
     bar sets it for itself, once, after the pip line, because there the
     clock is not the last thing down the screen. */
  if (!placed) hudBottom = y + boxH * 0.5;
  const bx0 = (placed ? atX : w / 2) - boxW / 2, by0 = y - boxH / 2;

  ctx.globalAlpha = 0.72 * dim;
  ctx.fillStyle = COLOUR.BAR_TRACK;
  roundRect(bx0, by0, boxW, boxH, boxH * 0.28);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.font = '700 ' + size + 'px ' + MONO;
  ctx.globalAlpha = (low ? 0.62 + 0.38 * Math.abs(Math.sin(runTime * 6)) : 1) * dim;
  ctx.fillStyle = low ? COLOUR.BAR_LOW : COLOUR.GATE;
  ctx.fillText(main, bx0 + padx, y + 1);
  ctx.globalAlpha = 1;

  // The gate, quieter, and cool once it is inside what is in hand.
  ctx.font = '600 ' + gsize + 'px ' + MONO;
  ctx.globalAlpha = (reachable ? 0.9 : 0.55) * dim;
  ctx.fillStyle = reachable ? COLOUR.GATE : COLOUR.TEXT;
  ctx.fillText(gl, bx0 + padx + mw + gap, y + 1);
  ctx.globalAlpha = 1;
  // A divider, so the two figures read as one instrument with two hands.
  ctx.globalAlpha = 0.3 * dim;
  ctx.fillStyle = COLOUR.TEXT;
  ctx.fillRect(bx0 + padx + mw + gap * 0.45, by0 + pady * 0.7, 1, boxH - pady * 1.4);
  ctx.globalAlpha = 1;

  /* Earning, as an arrow rather than a number. Flow has to be visible,
     but it does not have to be another figure to read. */
  if (running && slipPay() > 0.02) {
    const a = size * 0.3;
    const ax = bx0 - a * 1.5, ay = y;
    ctx.globalAlpha = 0.55 + 0.45 * Math.min(1, slipPay() * 1.6);
    ctx.fillStyle = COLOUR.GATE;
    ctx.beginPath();
    ctx.moveTo(ax, ay - a); ctx.lineTo(ax + a * 0.85, ay + a * 0.6);
    ctx.lineTo(ax - a * 0.85, ay + a * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (clockPop > 0) {
    const t = clockPop / FEEL.CLOCK_POP_TIME;
    const psize = Math.round(size * (1.5 + 0.7 * (1 - t)));
    ctx.font = '700 ' + psize + 'px ' + MONO;
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, t * 2.2);
    const pl = '+' + FEEL.CLOCK_CHECKPOINT;
    /* IT DRIFTS AWAY FROM THE PLATE, WHICHEVER WAY THERE IS ROOM. The
       portrait stack has the score above it and a run of sky below, so
       it rises the way a payout should. The bar sits at the very top of
       the screen, where rising by a ninth of the screen puts it off the
       edge entirely: measured at minus thirty four pixels, which is a
       reward the player never sees. So there it falls instead. */
    const px = placed ? atX : w / 2;
    const away = placed ? 1 : -1;
    const py = y + away * (boxH * 0.9 + (1 - t) * s * 0.09);
    ctx.fillStyle = COLOUR.TEXT_SHADOW;
    ctx.fillText(pl, px, py + 2);
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillText(pl, px, py);
    ctx.globalAlpha = 1;
  }
  // How much room the instrument took, so the bar can lay out around it
  // rather than guess at it. Portrait has no use for it and ignores it.
  return boxW;
}

function roundRect(x, y, w2, h2, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w2 - r, y); ctx.quadraticCurveTo(x + w2, y, x + w2, y + r);
  ctx.lineTo(x + w2, y + h2 - r); ctx.quadraticCurveTo(x + w2, y + h2, x + w2 - r, y + h2);
  ctx.lineTo(x + r, y + h2); ctx.quadraticCurveTo(x, y + h2, x, y + h2 - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* The result. Not a notification: nobody needs telling they left the
   road, they watched it happen. This is the end of an arcade race, and
   the score is the hero of it.

   The count up is PURELY cosmetic and gates nothing. A tap or a key
   restarts the moment DEATH_INPUT_LOCK is up, mid animation or not,
   because section 5's one more go loop is worth more than any flourish.
   The impatient path is the fast one by construction: nothing here is
   ever waited on. */
/* The death screen.

   EVERYTHING LIVES IN THE TOP HALF OR HANGS OFF THE BOTTOM EDGE, and the
   middle band is left empty, because that is where the car is. The stats
   row used to be laid out at a fraction of the height that happened to be
   clear of the car in portrait and sat straight on top of it in
   landscape. Nothing here may drift back into that band.

   TWO RECORDS, because continues exist. BEST SCORE is what a clean run is
   worth and a continued run can never touch it; FURTHEST is how far the
   track has been seen and any run may set it. The continue count is shown
   whenever it is not zero, so it is never ambiguous which kind of run
   just ended. */
const restartRect = { x: 0, y: 0, w: 0, h: 0, live: false };

function drawResult(w, h) {
  const s = Math.min(w, h);
  const final = banked;
  const clean = continues === 0;
  const daily = mode === DAILY;
  /* On the daily the headline is TODAY's record, because that is the one
     the run was actually competing for. BEST SCORE and FURTHEST are still
     kept and still shown, they are just not what this run was about. */
  const beatToday = daily && clean && final > 0 && final >= dailyBest;
  const beat = !daily && clean && final > 0 && final >= bestScore;
  const far = !daily && runDistance > 0 && runDistance >= furthest;
  // Counts up over ROLL seconds and then sits still. Reading it early
  // costs nothing, because the run is over and the number is already
  // decided.
  const roll = clamp(deadFor / FEEL.RESULT_ROLL_TIME, 0, 1);
  const eased = 1 - Math.pow(1 - roll, 3);
  const shown = Math.round(final * eased);

  /* THE STACK IS MEASURED IN s, THE SMALLER SCREEN DIMENSION, and only
     its starting height comes from h. Every size on this screen is a
     fraction of s, so laying the positions out in fractions of h made a
     block that fitted in portrait and collided with the car in landscape,
     where h and s are the same number. The top is pushed down the taller
     screen and clamped so the block can never reach the middle band,
     which is where the car is and which stays empty. */
  const y0 = Math.min(Math.max(s * 0.085, h * 0.125), Math.max(0, h * 0.5 - s * 0.34));
  if (beatToday) {
    ctx.globalAlpha = 0.72 + 0.28 * Math.abs(Math.sin(deadFor * 5));
    text("TODAY'S BEST", w / 2, y0, Math.round(s * 0.05), '900', 'center', COLOUR.GATE);
    ctx.globalAlpha = 1;
  } else if (beat) {
    // Unmistakable, because this is the moment somebody plays again for.
    ctx.globalAlpha = 0.72 + 0.28 * Math.abs(Math.sin(deadFor * 5));
    text('NEW BEST', w / 2, y0, Math.round(s * 0.055), '900');
    ctx.globalAlpha = 1;
  } else if (far) {
    ctx.globalAlpha = 0.72 + 0.28 * Math.abs(Math.sin(deadFor * 5));
    text('FURTHEST YET', w / 2, y0, Math.round(s * 0.05), '900', 'center', COLOUR.GATE);
    ctx.globalAlpha = 1;
  } else {
    text(!clean ? 'CONTINUED RUN'
         : daily ? "TODAY  " + dailyBest
         : 'BEST  ' + bestScore,
         w / 2, y0, Math.round(s * 0.042), '700');
  }

  arcadeNumber(String(shown), w / 2, y0 + s * 0.095, Math.round(s * 0.145),
               (beat || beatToday) ? COLOUR.SCORE_BEST : COLOUR.SCORE);

  /* The publisher, small and quiet, in the air between the score and the
     run figures. Low alpha and a third of the size of anything around it,
     because the score, the records and the continue button are what this
     screen is for and none of them may be crowded by it. */
  /* MEASURED, NOT PICKED. The clear band between the score block and
     the stats row was scanned off the rendered frame at three screen
     sizes and came out 0.105 of the smaller dimension tall, centred
     here, at every one of them. The credit was at 0.169, which sat it
     nearer the score than the stats row for no reason. */
  drawCredit(w, s, y0 + s * 0.1625);

  /* The run in figures on one line. Cheap, and it turns a number into a
     story: how far, how sideways, how many gates, and on a continued run
     how many continues, which goes here rather than on a line of its own
     so that saying it costs no height at all. */
  const rowY = y0 + s * 0.205;
  const cols = [
    ['DIST', runDistance + 'm'],
    ['BEST \u00d7', runBestMult.toFixed(1)],
    ['GATES', String(gatesPassed)]
  ];
  if (continues > 0) cols.push(['CONT', String(continues)]);
  const span = Math.min(w * 0.9, s * 1.15);
  const step = span / cols.length;
  for (let i = 0; i < cols.length; i++) {
    const cx = w / 2 + (i - (cols.length - 1) / 2) * step;
    ctx.globalAlpha = 0.6;
    text(cols[i][0], cx, rowY, Math.round(s * 0.028), '700');
    ctx.globalAlpha = 1;
    ctx.font = '700 ' + Math.round(s * 0.046) + 'px ' + MONO;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = COLOUR.TEXT_SHADOW;
    ctx.fillText(cols[i][1], cx, rowY + s * 0.046 + 2);
    ctx.fillStyle = continues > 0 && i === cols.length - 1 ? COLOUR.SCORE : COLOUR.GATE;
    ctx.fillText(cols[i][1], cx, rowY + s * 0.046);
  }

  /* WHICH TRACK THAT WAS, first, because it is what the rest of the line
     is about and it is what a shared score has to name. A random road
     says so, which is the same information: there is nothing to compare
     it against. */
  const which = daily ? 'TRACK #' + trackNumber(todayStamp) : 'RANDOM TRACK';
  /* The two records on one line, always both, so the split between them
     is obvious without a word of explanation. */
  const rec = which + '     ' + (daily ? 'TODAY  ' + dailyBest + '     ' : '')
            + 'BEST  ' + bestScore + '     FURTHEST  ' + furthest + 'm';
  ctx.globalAlpha = 0.72;
  text(rec, w / 2, y0 + s * 0.30,
       fittedSize(rec, '700', Math.round(s * 0.032), w * 0.9), '700');
  ctx.globalAlpha = 1;

  /* The prompt and the buttons, anchored to the bottom edge rather than
     to a fraction of the height, so they clear the car in both
     orientations by construction and sit above the corner pads. */
  restartRect.live = false;
  dailyRect.live = false;
  shareRect.live = false;
  if (deadFor < FEEL.DEATH_INPUT_LOCK) return;
  // See the title screen: the calibration owns this band while it is up.
  if (tiltCalOnScreen()) return;
  const resume = canContinue();
  const btnY = h - safeBottom - FEEL.DEATH_BOTTOM;
  const size = Math.round(s * 0.038);
  const rowH = size * 2.2 * 1.35;
  drawShareButton(w, h, s, btnY, size);

  /* THE DAILY, OFFERED AT THE MOMENT THE PLAYER IS DECIDING WHETHER TO
     GO AGAIN. That is the honest place to say there is something else,
     and it is only offered after a RANDOM TRACK run: on a daily death
     the player is already there and a button saying so would be noise.

     IT DOES NOT TOUCH THE REFLEX TAP. The tap anywhere still continues
     or restarts the run that just ended, exactly as section 5 requires;
     this is a separate deliberate target, stacked ABOVE the restart
     button so the position restart has always occupied does not move. */
  /* RESTART DOES NOT MOVE, AND SHARE ARRIVING BESIDE IT DID NOT MOVE IT.
     It has been at btnY and centred since it was added and that position
     is muscle memory, so the daily offer stacks ABOVE it and share sits
     OFF TO THE SIDE of it. The centre of the bottom row is left free
     whenever restart is not drawn, because the centre of the bottom row
     is where a reflex tap lands hardest and nothing that changes mode or
     opens a share sheet belongs there.

     Restart is a separate, deliberate action because the reflex tap now
     continues. It is only here when continuing is possible: with no gate
     behind you the reflex tap already restarts and a second way to do
     the same thing would be clutter. */
  if (resume) canvasButton(restartRect, 'RESTART', w / 2, btnY, size, COLOUR.SCORE, w);

  let stack = btnY - rowH;
  if (mode === ENDLESS) {
    canvasButton(dailyRect, "TODAY'S TRACK", w / 2, stack, size, COLOUR.GATE, w);
    ctx.globalAlpha = 0.55;
    const sub = 'track #' + trackNumber(todayStamp) + ', '
              + levelCount() + ' levels, one road for everyone'
              + (ghost.live ? ', your ghost is waiting' : '')
              + (hasKeyboard ? '     press T' : '');
    text(sub, w / 2, stack - size * 1.5,
         fittedSize(sub, '700', Math.round(s * 0.026), w * 0.92), '700');
    ctx.globalAlpha = 1;
    stack -= rowH;
  }

  const promptText = deathPrompt(resume);
  ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(deadFor * 3));
  text(promptText, w / 2, stack - s * FEEL.DEATH_PROMPT_GAP,
       fittedSize(promptText, '600', Math.round(s * 0.040), w * 0.88), '600');
  ctx.globalAlpha = 1;
}

/* ==================================================================
   THE COMPLETION SCREEN.

   Not the death screen with a different word on it. A crash screen leads
   with what you scored before it ended; this leads with the fact that
   you got to the end, because that is the achievement and everything
   else is detail about how.

   CLEAN IS THE HEADLINE. It is the binary most worth knowing, it is the
   only thing that separates a run that counts from a run that was
   ground out on continues, and it is therefore the largest thing on the
   screen. The score is next, because this game is about drifting. The
   time is third and is what the ghost is raced against.
   ================================================================== */
function timeLabel(t) {
  const m = Math.floor(t / 60), sec = t - m * 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
}

/* ------------------------------------------------------------------
   WHAT THE ONE INPUT ACTUALLY DOES, IN WORDS.

   Both prompts are worked out here and nowhere else, and both are
   derived from the SAME EXPRESSION the input path branches on rather
   than from a parallel guess at it. That is the whole reason this is a
   function: the completion screen said "run it again" for a year of
   sessions because the copy was written for the death screen and levels
   arrived afterwards, and nothing connected the sentence to the code
   that decides where the tap goes.

   THE INPUT COUNT IS NOT TOUCHED BY ANY OF THIS. One tap continues,
   restarts or rolls forward exactly as it did; only the sentence above
   it changed.
   ------------------------------------------------------------------ */
function rollsForward() {
  /* startNextLevel's own test, and it has to stay startNextLevel's own
     test. `done` is true by the time this screen draws, because banking
     runs at the line, so the ONLY thing that decides between rolling
     forward and running the last level again is whether there is a
     level after this one. */
  return mode === DAILY && level < levelCount() && recFor(level).done;
}
/* HOW THE INPUT IS GIVEN, on the device it is being read on.

   The title screen has branched on hasKeyboard since it was written and
   these two screens never did, so a phone with no keyboard anywhere near
   it was being told to press any key. Same query, same answer, and it is
   SHORTER on the device with less room, which is the one that matters. */
function tapOrKey() { return hasKeyboard ? 'tap or press any key' : 'tap'; }
function finishPrompt() {
  /* MORE TO COME. It rolls forward, so it says where to, by number,
     because "the next level" is vaguer than the game already is: the HUD
     has been saying LEVEL 2/3 for the whole run. */
  if (rollsForward()) {
    return tapOrKey() + ' for level ' + (level + 1) + ' of ' + levelCount();
  }
  /* THE LAST LEVEL, WITH THE DAY BEHIND IT. It does not roll anywhere:
     startNextLevel's guard fails and startRun puts the player back on
     the level they just finished. So the old sentence was accidentally
     right about exactly this one case and it is kept. The day being
     over is announced by the badge a beat earlier, which reads DAY
     COMPLETE or DAY COMPLETE, CLEAN, and it has faded by the time this
     line is being read: this sentence is about the INPUT, and stating
     the outcome again underneath it would be two headlines.

     Endless lands here too. It has no finish line at all, so this is
     unreachable from play, but the input path has a defensive
     `else startRun()` and the sentence matches it. */
  return tapOrKey() + ' to run it again';
}
function deathPrompt(resume) {
  // Unchanged, and it was already right: the reflex tap continues.
  if (resume) return 'tap to continue from the last gate';
  /* AND THIS ONE NAMED NO ACTION AT ALL. "tap or press any key" says
     how to give the input and not one word about what it does with it,
     which is the same fault as the completion screen's in a quieter
     form. It restarts, so it now says so, in the words the completion
     screen was borrowing. */
  return tapOrKey() + ' to run it again';
}

function drawFinish(w, h) {
  const s = Math.min(w, h);
  const roll = clamp(deadFor / FEEL.RESULT_ROLL_TIME, 0, 1);
  const eased = 1 - Math.pow(1 - roll, 3);
  const shown = Math.round(banked * eased);

  // The same measured-in-s stack the death screen uses, for the same
  // reason: laid out in fractions of h it collides with the car in
  // landscape, where h and s are the same number.
  /* The gaps are set from the TYPE SIZES rather than picked, because the
     first pass was picked and the headline, the number and the credit
     all ran into each other: a 0.085 headline centred 0.09 above a 0.125
     number overlaps by construction whatever it looks like at one
     screen size. Every step below is at least half the sum of the two
     heights it separates. */
  const y0 = Math.min(Math.max(s * 0.06, h * 0.10), Math.max(0, h * 0.5 - s * 0.44));

  /* ----------------------------------------------------------------
     TWO BEATS. The banner lands first, large and alone in the middle of
     the screen, and the result arrives under it a moment later, at which
     point the banner has travelled up to the top of the stack and shrunk
     into being its headline. One element, two positions, one lerp: it
     reads as the banner settling into place rather than as one thing
     being replaced by another.

     Skipping winds both to the end, so an impatient tap gets the
     finished layout with no animation at all rather than a fast one.
     ---------------------------------------------------------------- */
  const bIn = finaleBanner();
  const set = finaleSettleT();
  const rev = finaleReveal();
  let bannerCy = y0;
  if (bIn > 0) {
    // Overshoot slightly on the way in, so it lands rather than fades.
    const pop = bIn < 1 ? 1 + 0.16 * Math.sin(bIn * Math.PI) : 1;
    /* FITTED, like every other headline in this file. The wordmark's
       treatment adds a stroke either side of the glyphs, so the ink is
       wider than the type is and a size that fits as text runs off the
       edge as brand text. The stroke is a share of the size, so backing
       the target width off by that share is exact rather than a guess. */
    const big = s * FEEL.FINALE_BANNER_SIZE, small = s * 0.042;
    const room = w * 0.92 * (1 - FEEL.BRAND_TEXT_STROKE)
               - s * FEEL.BRAND_TEXT_SHADOW_X * 2;
    const want = Math.round((big + (small - big) * set) * pop);
    /* LEVEL COMPLETE, NOT TRACK COMPLETE. TRACK is the day's road, the
       one with a number on it that two players can quote at each other,
       and LEVEL is one of the three inside it. The banner was firing on
       finishing one of three while the HUD directly above it read
       TRACK #8   LEVEL 3/3, so the same word meant the whole road in one
       place and a third of it in another. One word each, everywhere. */
    const size = fittedSize('LEVEL COMPLETE', '900', want, room);
    bannerCy = (h * 0.42) + (y0 - h * 0.42) * set;
    brandText('LEVEL COMPLETE', w / 2, bannerCy, Math.max(8, size),
              Math.min(1, bIn * 1.4));
  }

  /* THE BADGE, and it is the reason the finale was loud. Only present
     when there is something to say, only while the banner is still the
     hero, and it fades out as the result takes over because the result
     says all of this again in its own words. */
  const badge = finaleBadge();
  if (badge && bIn > 0 && set < 1) {
    // Hung off the banner's own position, so the pair travels together
    // rather than the badge sitting where the banner used to be.
    ctx.globalAlpha = Math.min(1, bIn * 1.4) * (1 - set)
                    * (0.75 + 0.25 * Math.abs(Math.sin(deadFor * 6)));
    text(badge, w / 2, bannerCy + s * FEEL.FINALE_BANNER_SIZE * 0.9,
         fittedSize(badge, '800', Math.round(s * 0.046), w * 0.9), '800',
         'center', COLOUR.SCORE_BEST);
    ctx.globalAlpha = 1;
  }

  /* AND EVERYTHING BELOW IS THE RESULT, which does not exist until the
     reveal has started. Nothing here is on the path to anything: the
     restart is live the moment the input lock is up, whatever this is
     doing. */
  if (rev <= 0) { restartRect.live = false; shareRect.live = false; return; }
  ctx.save();
  /* EVERY alpha below this line is multiplied through the reveal, because
     a canvas globalAlpha REPLACES rather than compounds: setting the save
     to rev and then setting 0.6 for a label throws the fade away for that
     label, and the result arrives as half of it fading up and half of it
     popping. */
  ctx.globalAlpha = rev;

  /* The binary, and it is the loudest thing here. A clean run is the
     hardest thing in the game, so on a clean run it is the hero and the
     score steps down to make room: same outlined treatment as the number,
     larger than it, pulsing in the record gold. A continued run says so
     plainly and does not, because it is not the same achievement and the
     screen must not pretend otherwise, and there the score is the hero
     again.

     The two stacks swap sizes rather than adding any, so the run of gaps
     below is unchanged and nothing new can collide with the credit. */
  let numY = y0 + s * 0.168, numSize = Math.round(s * 0.108);
  if (finishClean) {
    const label = 'CLEAN RUN';
    numY = y0 + s * 0.172; numSize = Math.round(s * 0.082);
    ctx.globalAlpha = (0.74 + 0.26 * Math.abs(Math.sin(deadFor * 4.5))) * rev;
    arcadeNumber(label, w / 2, y0 + s * 0.078,
                 fittedSize(label, '900', Math.round(s * 0.100), w * 0.9),
                 COLOUR.SCORE_BEST);
    ctx.globalAlpha = rev;
  } else {
    const label = continues === 1 ? 'ONE CONTINUE' : continues + ' CONTINUES';
    ctx.globalAlpha = 0.85 * rev;
    text(label, w / 2, y0 + s * 0.066,
         fittedSize(label, '800', Math.round(s * 0.056), w * 0.9), '800',
         'center', COLOUR.SCORE);
    ctx.globalAlpha = rev;
  }

  arcadeNumber(String(shown), w / 2, numY, numSize,
               finishRecord ? COLOUR.SCORE_BEST : COLOUR.SCORE);

  // The same scan on the completion screen. See drawResult.
  drawCredit(w, s, y0 + s * 0.2349, rev);

  /* The run in figures. TIME is what the ghost is raced against, so the
     margin against it sits directly under the time rather than in a
     line of its own. */
  const rowY = y0 + s * 0.272;
  const cols = [['TIME', timeLabel(finishTime)],
                ['SCORE', String(banked)],
                ['GATES', String(dailyGates)]];
  const span = Math.min(w * 0.9, s * 1.15);
  const step = span / cols.length;
  for (let i = 0; i < cols.length; i++) {
    const cx = w / 2 + (i - (cols.length - 1) / 2) * step;
    ctx.globalAlpha = 0.6 * rev;
    text(cols[i][0], cx, rowY, Math.round(s * 0.028), '700');
    ctx.globalAlpha = rev;
    ctx.font = '700 ' + Math.round(s * 0.044) + 'px ' + MONO;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = COLOUR.TEXT_SHADOW;
    ctx.fillText(cols[i][1], cx, rowY + s * 0.044 + 2);
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillText(cols[i][1], cx, rowY + s * 0.044);
  }

  /* THE MARGIN, which is what having a ghost is for. Faster than the
     line you were racing is the whole point of racing it, so it gets the
     record colour and a sign that reads at a glance. */
  let line, colour = COLOUR.TEXT;
  if (finishMargin !== null) {
    const faster = finishMargin < 0;
    line = (faster ? 'BEAT YOUR GHOST BY  ' : 'BEHIND YOUR GHOST BY  ')
         + Math.abs(finishMargin).toFixed(1) + 's';
    colour = faster ? COLOUR.SCORE_BEST : COLOUR.TEXT;
  } else if (finishClean && finaleFirstToday) {
    /* THE VALUE CAPTURED BEFORE THE BANK, not the live one. By the time
       this screen draws, banking has already set the clean bit, so
       reading it here meant the line could never appear. */
    line = 'FIRST CLEAN FINISH ON THIS LEVEL';
    colour = COLOUR.SCORE_BEST;
  } else if (!finishClean) {
    line = 'A CLEAN RUN IS THE ONE THAT COUNTS';
  } else {
    line = 'THIS RUN IS YOUR NEW GHOST';
    colour = COLOUR.GATE;
  }
  ctx.globalAlpha = 0.82 * rev;
  text(line, w / 2, y0 + s * 0.360,
       fittedSize(line, '700', Math.round(s * 0.031), w * 0.9), '700', 'center', colour);
  ctx.globalAlpha = rev;

  const rec = 'TRACK #' + trackNumber(todayStamp) + '     TODAY  ' + dailyBest
            + (dailyTime > 0 ? '     ' + timeLabel(dailyTime) : '');
  ctx.globalAlpha = 0.66 * rev;
  text(rec, w / 2, y0 + s * 0.405,
       fittedSize(rec, '700', Math.round(s * 0.028), w * 0.9), '700');
  ctx.globalAlpha = rev;

  /* THE REASON TO COME BACK, AND THE ONLY SCREEN THAT EARNS IT.

     Finishing the day is the best moment in this game and it said
     nothing at all about there being more. It says it here, once, on the
     one completion in five that ends a day, and never on the other four:
     a player rolling from level two into level three is not deciding
     whether to return tomorrow, they are deciding whether to tap now,
     and telling them about tomorrow at that moment argues against the
     thing they are already doing.

     IT CANNOT DELAY ANYTHING. It is inside the reveal like every other
     line on this screen, so it arrives with the result rather than
     holding it up, and the restart input is live throughout regardless
     of what this is doing. The celebration is two beats above it and has
     already happened.

     THE SAME SENTENCE THE TITLE SCREEN CARRIES, off the same countdown,
     so the promise made here is the promise kept there. */
  if (mode === DAILY && dayDone()) {
    const more = newTracksLine(true);
    ctx.globalAlpha = 0.95 * rev;
    text(more, w / 2, y0 + s * 0.452,
         fittedSize(more, '800', Math.round(s * 0.034), w * 0.9), '800',
         'center', COLOUR.SCORE_BEST);
    ctx.globalAlpha = rev;
  }

  /* One action, and there is nothing to continue from: the track is
     over. No restart button either, because with no continue on offer
     the reflex tap already restarts and a second way to do the same
     thing is clutter. That is the death screen's own rule. */
  ctx.restore();

  restartRect.live = false;
  shareRect.live = false;
  if (rev < 1) return;
  if (deadFor < FEEL.DEATH_INPUT_LOCK) return;
  if (tiltCalOnScreen()) return;
  const btnY = h - safeBottom - FEEL.DEATH_BOTTOM;
  /* The completion screen gets the same button in the same place. This
     is the screen somebody most wants to send to a friend, and having it
     on the crash screen and not on the win would be an odd thing to
     explain. */
  /* THE HERO CASE, and it is the completion screen's alone: the whole
     day, every level of it, with no continue anywhere. dayClean is the
     game's own test for that and it is what the title screen's trophy
     reads too. */
  drawShareButton(w, h, s, btnY, Math.round(s * 0.038),
                  mode === DAILY && dayDone() && dayClean());
  /* THE PROMPT MOVED UP A ROW, because it used to sit centred on btnY
     and the share button now occupies that row. It goes above the row
     rather than beside it, which is where the death screen has always
     put its own prompt and for the same reason: the row is for targets
     and the line above it is for words. */
  ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(deadFor * 3));
  /* WHAT THIS RUN EARNED, if anything, and it sits directly above the
     prompt because that is the last thing read before tapping on. The
     callout said it at the line; this is the receipt. */
  if (carJustUnlocked) {
    ctx.globalAlpha = 0.9;
    const won = 'NEW CAR UNLOCKED     ' + carJustUnlocked;
    text(won, w / 2, btnY - s * FEEL.DEATH_PROMPT_GAP - s * 0.052,
         fittedSize(won, '800', Math.round(s * 0.034), w * 0.88), '800',
         'center', COLOUR.SCORE_BEST);
    ctx.globalAlpha = 1;
  }
  const prompt = finishPrompt();
  text(prompt, w / 2, btnY - s * FEEL.DEATH_PROMPT_GAP,
       fittedSize(prompt, '600', Math.round(s * 0.040), w * 0.88), '600');
  ctx.globalAlpha = 1;

  /* SOMEWHERE TO GO WHEN THE DAY IS BEHIND YOU.

     THE REFLEX TAP IS NOT THE ANSWER AND THAT IS THE DECISION. It still
     runs the last level again, and it should, for three reasons. The
     tap means the same thing on every screen in this game, and the one
     moment most likely to be tapped fast is the frame after a finale, so
     the moment it means something new is the moment it is wrong. The
     last level is SCORED: it has today's record, today's ghost and a
     time worth beating, and a random track has none of the three and
     says so on the title screen. And demoting somebody into an unscored
     sandbox at the exact moment they finished the hardest thing in the
     game is the wrong direction to send them.

     SO THE RANDOM TRACK IS ONE DELIBERATE PRESS, which is what was
     asked for: this button, or R on a keyboard, and neither can be hit
     by a reflex. It only exists once the day is done, because before
     then this screen's whole job is to roll the player into the next
     level and a second target would compete with it.

     OPPOSITE THE SHARE BUTTON ON THE SAME ROW, which is the arrangement
     the death screen already uses for RESTART and SHARE and for exactly
     this reason: the row is targets, the line above it is words, and a
     button off to the side is a button the reflex tap cannot land on.

     IT WAS ABOVE THE PROMPT FIRST AND THAT WAS WRONG. In landscape the
     result stack is measured in s from the top and the bottom group is
     measured in pixels from the bottom, and when h and s are the same
     number, which is exactly what a phone held sideways is, the two
     meet: the button was drawn straight through "5 NEW TRACKS TOMORROW".
     The same trap the comment at the top of this function records about
     the car. On this row it cannot happen, because the share button has
     been living here without colliding with anything for sessions. */
  if (mode === DAILY && dayDone()) {
    const size = Math.round(s * 0.034);
    const dx = Math.min(w * 0.30, s * 0.28);
    // Lifted clear of the pads on the same terms as the share button.
    const y = Math.min(btnY, padsTop - size * 1.1 - 6);
    altRect.to = ENDLESS;
    canvasButton(altRect, 'RANDOM TRACK', w / 2 - dx, y, size, COLOUR.TEXT, w);
  } else {
    altRect.live = false;
  }
}

/* Did that tap land on the restart button? Canvas rather than a DOM
   button on purpose: #chrome and #pads already carry the pointer-events
   discipline the Beakdown incident bought, and a fourth overlay is a
   fourth chance to get it wrong. A rect the drawing code publishes cannot
   eat a tap it is not under. */
function hitRestart(e) {
  if (!restartRect.live || state !== DEAD) return false;
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  return x >= restartRect.x && x <= restartRect.x + restartRect.w
      && y >= restartRect.y && y <= restartRect.y + restartRect.h;
}

/* THE DATE LABEL IS GONE. The TRACK NUMBER replaced it everywhere: it is
   shorter, it is the thing two players can quote at each other, and it
   is a history rather than a calendar. Nothing needs a formatted date,
   so nothing formats one. */

/* ==================================================================
   ENTRY, AND THERE IS STILL NO MENU. Section 12 forbids one.

   THE DAILY IS THE FRONT DOOR FOR EVERYBODY, first visit included.

   The previous session made it depend on whether the browser had played
   before: a first timer got endless, a returning player got the daily.
   That is gone, and it is a simplification rather than a retreat. Two
   front doors is two things to keep right, the split rested on a
   localStorage key that this audience's locked down profiles frequently
   refuse to keep, and a first timer being handed today's track loses
   them nothing at all: it is a road with a finish line on it.

   STILL ONE TAP TO PLAY, which is what section 5 actually asks for. Tap
   anywhere, press any key, or press the primary button, and all three
   start today's track. The random road is one clearly marked button and
   nothing has to be read to ignore it.

   IT IS A TITLE SCREEN AND NOT A MENU. Section 12 forbids menus,
   settings screens and difficulty selection. There is none of that here:
   one headline, one primary action, one alternative, and nothing the
   player has to answer before driving.

   WHY NOT "REMEMBER THE LAST MODE". Remembering would send a player who
   tried the random road once straight back to it every visit after,
   which is the loop that had to be broken in the first place. Coming
   back means being offered the thing that is worth coming back for.

   And after death there is still no choice: the reflex tap continues or
   restarts the run you were in, one action, nothing to hunt for.
   ================================================================== */
const dailyRect = { x: 0, y: 0, w: 0, h: 0, live: false };
const altRect = { x: 0, y: 0, w: 0, h: 0, live: false, to: 0 };
/* THE CAR CYCLE, and it is one small control rather than a screen.
   Handoff 9 forbids new screens and BRIEF.md 12 forbids menus; a button
   that changes the paint on the car you are about to drive is neither.
   It is only drawn once there is more than one car to cycle, so a player
   who has not earned anything never sees a control for nothing. */
const carRect = { x: 0, y: 0, w: 0, h: 0, live: false };

/* Fine pointer means a trackpad or a mouse, which on this audience's
   hardware means a Chromebook, which means a keyboard. The same media
   query the tilt button already uses, read the other way round. */
const hasKeyboard = !(window.matchMedia
                      && window.matchMedia('(any-pointer: coarse)').matches);

/* One canvas button, drawn and published for the hit test. Canvas rather
   than a DOM node for the same reason the restart button is: #chrome and
   #pads already carry the pointer-events discipline the Beakdown incident
   bought, and a fourth overlay is a fourth chance to get it wrong. */
function canvasButton(rect, label, cx, cy, size, colour, w) {
  ctx.font = '800 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const bw = Math.min(w * 0.92, ctx.measureText(label).width + size * 2.4);
  const bh = size * 2.2;
  rect.x = cx - bw / 2;
  rect.y = cy - bh / 2;
  rect.w = bw;
  rect.h = bh;
  rect.live = true;
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = COLOUR.BAR_TRACK;
  roundRect(rect.x, rect.y, bw, bh, bh * 0.3);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = colour;
  ctx.stroke();
  ctx.globalAlpha = 1;
  text(label, cx, cy, size, '800', 'center', colour);
  return bh;
}

function hitRect(rect, e) {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
}

/* ==================================================================
   SHARING A RUN.

   WHICH TRACK IT WAS is the whole reason this can exist at all. A score
   off a random road is a number nobody can check; a score off track 47
   is a claim two people can settle, because they drove the same corners.
   That is what the daily bought and this is what spends it.

   NOT ONE EXTERNAL REQUEST, and there was never a risk of one. The Web
   Share API hands a string to the operating system's own sheet and the
   clipboard fallback does not leave the page at all. Nothing is fetched,
   nothing is posted, and the game works identically with both missing:
   the text goes to the on screen note and can be read off it.

   The URL is the page the player is actually on, so it stays right
   through any move of the game, and it is left out entirely off http
   and https, where it would be somebody's local file path.
   ================================================================== */
/* ==================================================================
   THE CARD.

   WHAT IS ON IT, and every one of these is here for a reason:

     THE WORDMARK, so it is obvious which game this came from before a
     single word is read. Same Path2D the title screen draws, so the two
     cannot drift apart.

     THE TRACK NUMBER, which is the whole reason a shared score means
     anything at all. Everybody on that date drove those roads, so a
     number off track 47 is a claim two people can settle.

     THE SHAPE OF THE DAY, one block per level, three states: finished
     clean, finished on continues, never got there. THIS is the Wordle
     grid and it is the point of the exercise. It is read as three
     DENSITIES before any type resolves, so it survives a thumbnail, and
     it is not carried by colour alone, so it survives a colour blind
     reader too.

     THE SCORE AND THE TIME for the day so far, and CLEAN DAY when every
     level of it was clean, which is the hardest thing in this game and
     therefore the loudest thing on the card.

     AND THE ADDRESS, INSIDE THE IMAGE. Many share targets take the file
     or the text and not both, so a card that spreads and leads nowhere
     is worse than no card. It is 40px on a 1200px card, which is larger
     than the level numbers would have been, and it is the one thing here
     that must survive being screenshotted out of a chat.

   NO SPOILERS. Nothing on it describes the road: not a corner, not a
   hazard, not a gate position, not a length beyond the count of levels
   that already shows in the HUD. A friend can read it and still drive
   the day cold, which is the property that makes it worth sending.

   NOT ONE REQUEST. A canvas, some paths and some text. Nothing is
   fetched, nothing is stored, and the whole thing is generated at share
   time and thrown away.
   ================================================================== */
const CARD_INK = '#0b0503';     // the game's own void, as the boot splash writes it
const CARD_AMBER = '#ff9424';
const CARD_CREAM = '#ffd9a2';
const CARD_GOLD = '#fbbf45';
const CARD_DIM = '#7a5a3a';

function cardRound(g, x, y, w2, h2, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w2 - r, y); g.quadraticCurveTo(x + w2, y, x + w2, y + r);
  g.lineTo(x + w2, y + h2 - r); g.quadraticCurveTo(x + w2, y + h2, x + w2 - r, y + h2);
  g.lineTo(x + r, y + h2); g.quadraticCurveTo(x, y + h2, x, y + h2 - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

/* Its own text helper rather than the game's, because the game's writes
   to the one global context and this draws to an offscreen one. */
function cardText(g, s, x, y, size, weight, colour, align) {
  g.font = weight + ' ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  g.textAlign = align || 'center';
  g.textBaseline = 'middle';
  g.fillStyle = colour;
  g.fillText(s, x, y);
}

/* THE DAY, SUMMED. The per level records are the source: a level's best
   is a clean run's score and its time is the time that run took, so the
   totals are the day driven at its best rather than whatever the last
   run happened to do. Levels never reached contribute nothing, which is
   why an unfinished day shows a smaller number and a shorter time and
   both are true. */
function dayTotals() {
  let score = 0, time = 0, done = 0, clean = 0;
  const n = levelCount();
  const rows = [];
  for (let i = 1; i <= n; i++) {
    const r = recFor(i);
    score += r.best;
    time += r.time;
    if (r.done) done++;
    if (r.clean) clean++;
    rows.push(r.done ? (r.clean ? 2 : 1) : 0);
  }
  return { score: score, time: time, done: done, clean: clean, n: n, rows: rows };
}

function buildShareCard() {
  const W = FEEL.CARD_W, H = FEEL.CARD_H, PAD = FEEL.CARD_PAD;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  if (!g) return null;
  const daily = mode === DAILY;
  const t = dayTotals();

  /* The field. A flat ground with one soft warm lift off the bottom
     edge, which is the game's own horizon glow and the cheapest way to
     make a flat rectangle read as this game rather than as a slide. */
  g.fillStyle = CARD_INK;
  g.fillRect(0, 0, W, H);
  const glow = g.createLinearGradient(0, H, 0, H * 0.35);
  glow.addColorStop(0, 'rgba(255,148,36,0.20)');
  glow.addColorStop(1, 'rgba(255,148,36,0)');
  g.fillStyle = glow;
  g.fillRect(0, H * 0.35, W, H * 0.65);
  // A hairline frame, so the card has an edge against a white chat bubble.
  g.strokeStyle = 'rgba(255,148,36,0.55)';
  g.lineWidth = 6;
  g.strokeRect(3, 3, W - 6, H - 6);

  /* THE WORDMARK, through the same routine the title screen uses. It
     takes a context, so the offscreen one goes straight in. */
  if (BRAND.wordmark.path) {
    const art = BRAND.wordmark;
    const boxW = FEEL.CARD_WORDMARK / (art.ink.r - art.ink.l);
    const boxH = boxW * art.h / art.w;
    // Pushed by the artwork's own asymmetric margin, so the ink starts
    // on the pad rather than the box doing.
    const cx = PAD + boxW / 2 - (art.ink.l - (1 - art.ink.r)) * boxW / 2;
    drawBrand(g, art, cx, 40 + boxH / 2, boxW);
  } else {
    cardText(g, 'DRIFT FEVER', PAD, 100, 76, '900', CARD_GOLD, 'left');
  }

  /* The track, top right, opposite the mark. */
  const head = daily ? 'TRACK #' + trackNumber(todayStamp) : 'RANDOM TRACK';
  cardText(g, head, W - PAD, 92, 54, '800', CARD_CREAM, 'right');
  if (daily) {
    cardText(g, t.done + ' OF ' + t.n + ' FINISHED', W - PAD, 148,
             32, '700', CARD_DIM, 'right');
  }

  /* ----------------------------------------------------------------
     THE SHAPE. One block per level, sized from the count so five, three
     or eight all fill the same width. LEVEL_COUNT is read rather than
     assumed, which is the one thing this was explicitly not allowed to
     hardcode.
     ---------------------------------------------------------------- */
  const rowY = 228;
  const bh = FEEL.CARD_BLOCK_H;
  if (daily && t.n > 0) {
    const gap = FEEL.CARD_BLOCK_GAP;
    const span = W - PAD * 2;
    const bw = (span - gap * (t.n - 1)) / t.n;
    for (let i = 0; i < t.n; i++) {
      const x = PAD + i * (bw + gap);
      const kind = t.rows[i];
      const r = Math.min(18, bw * 0.22);
      if (kind === 2) {
        /* CLEAN. Solid and bright, the densest thing in the row. */
        cardRound(g, x, rowY, bw, bh, r);
        g.fillStyle = CARD_GOLD; g.fill();
      } else if (kind === 1) {
        /* CONTINUED. The same block filled to a bar across its middle,
           so it reads as half of a full one at any size. Not merely a
           different colour: a colour blind reader gets the same answer. */
        cardRound(g, x, rowY, bw, bh, r);
        g.fillStyle = 'rgba(255,148,36,0.22)'; g.fill();
        g.strokeStyle = CARD_AMBER; g.lineWidth = 5; g.stroke();
        g.save();
        cardRound(g, x, rowY, bw, bh, r); g.clip();
        g.fillStyle = CARD_AMBER;
        g.fillRect(x, rowY + bh * 0.56, bw, bh * 0.44);
        g.restore();
      } else {
        /* NEVER GOT THERE. An outline and nothing in it. */
        cardRound(g, x, rowY, bw, bh, r);
        g.fillStyle = 'rgba(255,255,255,0.04)'; g.fill();
        g.strokeStyle = CARD_DIM; g.lineWidth = 4; g.stroke();
      }
    }
  }

  /* ----------------------------------------------------------------
     THE FIGURES, ON AN EXPLICIT BAND RATHER THAN STACKED OFFSETS.

     The first version laid every row out as "the last row plus a gap"
     and three things collided at once: a six digit score ran into the
     time, the CLEAN DAY badge sat on top of both, and the POINTS label
     landed on the same line as the address. Card space is fixed and
     small, so the bands are written down and each one is a fit rather
     than a hope.
     ---------------------------------------------------------------- */
  /* THE BANDS, WRITTEN DOWN. Every one of these was arrived at by
     drawing the card and looking at it, and the numbers are here rather
     than as offsets so the next person can see the whole budget at once:

       40 .. 210   the wordmark, whose box is 170 tall at an ink width
                   of 300, and whose SECOND LINE is the thing that ran
                   into the blocks when the ink was 360
      228 .. 320   the shape row
      336 .. 408   the figures
      410 .. 438   their labels
      460 .. 544   the clean badge, when there is one
      572 .. 612   the address */
  const FIG_Y = 372, LABEL_Y = 424, BADGE_Y = 460, BADGE_H = 84, URL_Y = 592;

  /* Shrinks until it fits, because a score is anything from two digits
     to seven and a card that overflows on a good day is a card that
     fails exactly when it is worth sending. */
  function fitText(str, x, y, want, weight, colour, align, room) {
    let size = want;
    for (let k = 0; k < 40; k++) {
      g.font = weight + ' ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      if (g.measureText(str).width <= room || size <= 12) break;
      size -= 2;
    }
    cardText(g, str, x, y, size, weight, colour, align);
    return size;
  }

  const score = daily ? t.score : banked;
  const allClean = daily && t.done === t.n && t.clean === t.n && t.n > 0;

  // LEFT: the score. A third of the width, which holds seven digits.
  fitText(String(score), PAD, FIG_Y, 72, '900', CARD_CREAM, 'left', 330);
  cardText(g, 'POINTS', PAD, LABEL_Y, 28, '700', CARD_DIM, 'left');

  // CENTRE: the time, and only when there is one.
  if (daily && t.time > 0) {
    fitText(timeLabel(t.time), W / 2, FIG_Y, 72, '900', CARD_CREAM, 'center', 300);
    cardText(g, t.done === t.n ? 'FULL DAY' : 'SO FAR', W / 2, LABEL_Y, 28,
             '700', CARD_DIM, 'center');
  }

  /* A RANDOM TRACK HAS NO SHAPE AND NO DAY, so the shape row and the two
     day figures are all absent and the card came out as a wordmark, a
     score and a lot of nothing. It gets the two figures the plain text
     share has always carried instead: how far, and how many gates. They
     are not spoilers, because a random road is different every run and
     nobody else can drive it. */
  if (!daily) {
    fitText(runDistance + 'm', W / 2, FIG_Y, 72, '900', CARD_CREAM, 'center', 300);
    cardText(g, 'DISTANCE', W / 2, LABEL_Y, 28, '700', CARD_DIM, 'center');
    fitText(String(gatesPassed), W - PAD, FIG_Y, 72, '900', CARD_CREAM, 'right', 300);
    cardText(g, gatesPassed === 1 ? 'GATE' : 'GATES', W - PAD, LABEL_Y, 28,
             '700', CARD_DIM, 'right');
  }

  /* RIGHT: how much of the day was clean, and it is only a figure when
     the badge below is not going to say it louder. */
  if (daily && !allClean) {
    fitText(t.clean + ' CLEAN', W - PAD, FIG_Y, 72, '900', CARD_AMBER, 'right', 330);
    cardText(g, 'OF ' + t.n, W - PAD, LABEL_Y, 28, '700', CARD_DIM, 'right');
  }

  /* CLEAN IS THE LOUDEST THING ON THE CARD, because it is the hardest
     thing in the game and because it is the claim worth making to
     somebody else. It gets a whole band to itself and a filled pill, so
     it is the one element that still reads when the card is a thumbnail
     in a chat list. Only when EVERY level of the day was clean. */
  if (allClean) {
    const label = 'CLEAN DAY';
    const size = 68;
    g.font = '900 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    const tw = g.measureText(label).width;
    const bw2 = tw + 72, bh2 = BADGE_H;
    cardRound(g, W / 2 - bw2 / 2, BADGE_Y, bw2, bh2, 24);
    g.fillStyle = CARD_GOLD; g.fill();
    cardText(g, label, W / 2, BADGE_Y + bh2 / 2, size, '900', CARD_INK, 'center');
  }

  /* AND THE ADDRESS. See the note at the top: this is the half of the
     card that has to work when the text does not travel with it. */
  /* 46px, not 40. Measured by rendering the card at the sizes it is
     actually seen at: at 380px, which is a phone chat bubble, 40 was
     legible and 46 is unmissable, and this is the one element on the
     card that has to survive being screenshotted out of a thread. */
  cardText(g, 'driftfever.com', W / 2, URL_Y, 46, '800', CARD_AMBER, 'center');
  return c;
}

/* ------------------------------------------------------------------
   THE BLOB, BUILT BEFORE IT IS ASKED FOR.

   navigator.share MUST BE CALLED INSIDE THE USER GESTURE. toBlob is
   asynchronous, so generating the card when the button is tapped and
   sharing in the callback loses the activation and iOS refuses it. That
   is the whole reason this is built ahead: the card is made when the end
   of run screen arrives, and by the time anybody has read the score and
   reached for the button the File already exists and share is called
   straight out of the tap.

   IT IS ALSO WHY NOTHING BLOCKS. The completion screen never waits for
   this, because it is not on the path to anything: the screen draws, the
   restart input is live, and the card turns up whenever it turns up. If
   it has not by the time the button is pressed, the button shares the
   text and says nothing about it.

   KEYED ON THE RUN, so it is built once per result rather than once per
   frame, and rebuilt when the result changes. */
const shareCard = { blob: null, key: '', want: '', building: false };

function shareCardKey() {
  const t = dayTotals();
  return (mode === DAILY ? 'd' : 'e') + ':' + level + ':' + banked + ':'
       + t.score + ':' + t.rows.join('') + ':' + Math.round(finishTime * 10);
}

/* A BUILD IN FLIGHT MUST NOT SWALLOW A NEWER RESULT, and the first
   version of this did exactly that.

   Measured: driving a whole day, onRunEnded fires once a level, the
   first call set building and every call after it returned early, so the
   card in flight was LEVEL ONE'S while the player was looking at the
   completed day. It self corrected a frame after the stale build landed,
   but for the second and a half in between the cached blob was a picture
   of a different run, and a tap in that window would have shared it.
   Sharing somebody else's result under your own name is the worst thing
   this feature could do.

   So the WANTED key and the BUILT key are separate. Asking for a new one
   clears the blob at once, because whatever is cached is now known to be
   the wrong run, and a build that finishes against a key nobody wants
   any more publishes nothing and starts again. */
function buildShareCardSoon() {
  const key = shareCardKey();
  if (key === shareCard.want) return;
  shareCard.want = key;
  shareCard.blob = null;
  shareCard.key = '';
  // The one in flight will notice on the way out and restart itself.
  if (shareCard.building) return;
  startShareCardBuild();
}

function startShareCardBuild() {
  const key = shareCard.want;
  shareCard.building = true;
  let done = false;
  const settle = function (b) {
    if (done) return;
    done = true;
    shareCard.building = false;
    if (key !== shareCard.want) { startShareCardBuild(); return; }
    shareCard.key = key;
    shareCard.blob = b || null;
  };
  /* OFF THE RENDER PATH ENTIRELY. This is asked for by the frame that
     ends a run, and doing the work there would put the whole card on the
     one frame a crash or a finale lands. A zero timeout is enough: it
     runs after the frame has been presented. */
  setTimeout(function () {
    try {
      const c = buildShareCard();
      if (!c || !c.toBlob) { settle(null); return; }
      /* A CALLBACK THAT NEVER FIRES IS EXACTLY HOW A SHARE HANGS, so it
         is given a deadline and the text share takes over if it is
         missed. Measured, toBlob delivers in about 75ms on an idle main
         thread and up to 1.5 seconds on a busy one, so the deadline is
         generous on purpose: it is a backstop, not a budget. */
      setTimeout(function () { settle(null); }, FEEL.CARD_BLOB_TIMEOUT);
      c.toBlob(function (b) { settle(b); }, 'image/png');
    } catch (e) { settle(null); }
  }, 0);
}

function shareRun() {
  const daily = mode === DAILY;
  /* THE LEVEL IS PART OF WHICH TRACK IT WAS. A score off track 47 is a
     claim two people can settle only if they drove the same corners, and
     the day is three roads now, so naming the track without the level
     names a third of it. The glyph lands next session and will do this
     properly; this keeps the plain text honest until it does. */
  const lv = daily ? levelLabel(level) : '';
  const head = 'DRIFT FEVER   '
             + (daily ? 'TRACK #' + trackNumber(todayStamp) + (lv ? '   ' + lv : '')
                      : 'RANDOM TRACK');
  let body;
  if (state === FINISHED) {
    body = banked + ' points, finished in ' + timeLabel(finishTime)
         + (finishClean ? ', clean'
            : ', on ' + continues + (continues === 1 ? ' continue' : ' continues'));
  } else {
    body = banked + ' points, ' + gatesPassed
         + (gatesPassed === 1 ? ' gate' : ' gates') + ', ' + runDistance + 'm';
  }
  let url = '';
  const proto = window.location.protocol;
  if (proto === 'http:' || proto === 'https:') {
    url = window.location.origin + window.location.pathname;
  }
  const text = head + '\n' + body + (url ? '\n' + url : '');

  /* THREE ROUTES, EACH A FALLBACK FOR THE ONE ABOVE IT, and every one of
     them can throw or be absent. A share button that breaks the end of
     run screen would be far worse than one that quietly shows the text.

     1. THE CARD PLUS THE TEXT, where the browser will take a file. This
        is every current phone, which is where sharing actually happens,
        and ChromeOS, which is section 6's machine.
     2. THE TEXT, where share exists but files are refused.
     3. THE CLIPBOARD, which is most desktop browsers.

     The card is only used if it is ALREADY BUILT. Nothing waits for it:
     an unfinished card silently becomes route two, which is exactly what
     the game did before this existed. */
  try {
    /* THE KEY IS CHECKED AT THE TAP as well as at the build. settle
       already refuses to publish a stale card, so this can only ever
       agree with it; it is here because sharing the wrong run is the one
       failure worth two guards. */
    if (navigator.share && navigator.canShare && window.File
        && shareCard.blob && shareCard.key === shareCardKey()) {
      const file = new File([shareCard.blob], 'drift-fever.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) {
        /* SYNCHRONOUS, inside the tap. See the note on shareCard: the
           File exists already precisely so this line is reached without
           an await in front of it. */
        const p1 = navigator.share({ files: [file], text: text });
        if (p1 && p1.then) p1.then(function () {}, function () {});
        return;
      }
    }
  } catch (e) {}
  try {
    if (navigator.share) {
      const p2 = navigator.share({ text: text });
      if (p2 && p2.then) p2.then(function () {}, function () {});
      return;
    }
  } catch (e) {}
  /* THE DESKTOP ROUTE IS THE CLIPBOARD, NOT A DOWNLOAD, and that is a
     decision rather than the easy option.

     A programmatic download raises a download bar or a shelf, and BRIEF
     section 6 lists popups, interstitials and prompts as the behaviour
     that gets a domain looked at and categorised by the filters this
     audience sits behind. It is also the least useful outcome on a
     managed Chromebook, where the file lands somewhere the player may
     not be able to attach it from. The clipboard is instant, silent,
     works in every desktop browser and cannot trip a filter.

     THE IMAGE GOES ON THE CLIPBOARD TOO where the browser supports it,
     which is Chrome and Edge, so a desktop player can paste the card
     straight into a chat rather than losing it. Both types go in ONE
     ClipboardItem so the receiving app picks whichever it wants, and if
     the image half is refused the text half still goes. And if the card
     is all that arrives, the address is drawn on it, which is the whole
     reason that line is there. */
  try {
    if (navigator.clipboard && window.ClipboardItem
        && shareCard.blob && shareCard.key === shareCardKey()) {
      const item = new ClipboardItem({
        'image/png': shareCard.blob,
        'text/plain': new Blob([text], { type: 'text/plain' })
      });
      navigator.clipboard.write([item]).then(
        function () { showNote('Card copied. Paste it anywhere.', 3); },
        function () { copyTextOnly(text); });
      return;
    }
  } catch (e) {}
  copyTextOnly(text);
}

function copyTextOnly(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { showNote('Copied. Paste it anywhere.', 3); },
        function () { showNote(text, 7); });
      return;
    }
  } catch (e) {}
  showNote(text, 8);
}

const shareRect = { x: 0, y: 0, w: 0, h: 0, live: false };
function hitShare(e) {
  if (!shareRect.live) return false;
  if (state !== DEAD && state !== FINISHED) return false;
  return hitRect(shareRect, e);
}

/* Beside RESTART rather than in place of it, and RESTART DOES NOT MOVE:
   it stays centred on btnY where it has always been, because that
   position is muscle memory and the reflex tap is the loop the whole
   game hangs off. Share is offset into the right hand side, far enough
   out to clear the restart button at every screen width and close enough
   in to clear the corner pads. It sits in the same place whether restart
   is drawn or not, so it never migrates under a thumb heading for the
   centre. */
function drawShareButton(w, h, s, btnY, size, hero) {
  /* THE CARD IS ASKED FOR HERE, which is the first frame the button is
     on screen and therefore the earliest moment it could possibly be
     wanted. It is keyed on the result, so this is one build per run and
     not one per frame, and it does its work on a timeout so this frame
     pays nothing for it. */
  buildShareCardSoon();
  const dx = Math.min(w * 0.30, s * 0.28);
  /* AND IT IS THE ONE THING IN THIS ROW THAT SITS OVER THE PADS, so it
     is the one thing that has to clear them. btnY is a fixed pixel drop
     from the bottom while this button's height is a fraction of s, and
     on a tablet those two disagree by enough to put the corner of the
     button inside the fullscreen pad, where the tap would go to the pad
     and the share would appear to be broken. Lifted just far enough,
     which on every phone is not at all. */
  const y = Math.min(btnY, padsTop - size * 1.1 - 6);
  /* LOUDER ON A CLEAN DAY AND NOWHERE ELSE. Finishing every level of a
     day without a continue is the best moment this game has and it is
     the one worth sending to somebody, so the button grows and takes the
     record gold there. Making it prominent everywhere would make it
     prominent nowhere, and it would be competing with the reflex tap on
     every death screen in between.

     THE SIZE IS THE ONLY THING THAT MOVES. It stays on the same row, at
     the same offset, so the landscape pairing with RANDOM TRACK that was
     measured last session still holds. */
  const big = hero ? Math.round(size * 1.22) : size;
  const yy = Math.min(y, padsTop - big * 1.1 - 6);
  /* AND IT SAYS SO WHILE THE CARD IS STILL COMING.

     On the completion screen this is never seen: the finale, the result
     roll and the input lock together are several seconds and the card is
     started the moment the run ends. On a DEATH screen the button is
     live after about 0.85 seconds, and the card was measured taking
     between 0.5 and 1.5 under a busy main thread, so there the two can
     genuinely race.

     Tapping it in that state is not an error and does not wait: it
     shares the text, which is what the game did before this session
     existed. The three dots are there so the player knows a better
     version is a moment away, not so they are made to wait for it. */
  canvasButton(shareRect, shareCard.building ? 'SHARE ...' : 'SHARE',
               w / 2 + dx, yy, big,
               hero ? COLOUR.SCORE_BEST : COLOUR.GATE, w);
}

/* THE TWO LINES OF FACT UNDER THE PROMPT, and there are two rather than
   six because six was the problem.

   ONLY WHAT EXISTS IS SHOWN. An empty slot is left out rather than drawn
   as a dash or a zero: a first visit should read as a clean start and
   not as a form with nothing filled in. On a cold profile the first line
   is the track number alone, which is exactly right.

   TIME IS NOT HERE ANY MORE. It is on the completion screen and on the
   death screen, which are where a time means something, and a fourth
   figure on a title screen is a figure nobody reads. */
/* ONE ROW, NOT TWO, and the countdown moved up into it. The music
   warning has to be big enough to actually be read, and this screen is
   spare on purpose, so it EARNS its size by taking a row rather than by
   being added underneath. What went: GHOST READY, which the ghost says
   for itself the moment it appears beside you, and SAME ROAD FOR
   EVERYONE, which the track number and a countdown to a NEW one already
   say without the sentence. */
function titleFactLine() {
  const bits = ['TRACK #' + trackNumber(todayStamp)];
  /* THE LEVEL THE TAP WILL START, not the one last played, because this
     line sits directly above a prompt that says TAP TO START and it has
     to be true about what that tap does. Once the day is complete it
     says so instead, which is the trophy and the only place it appears. */
  if (levelCount() > 1) {
    bits.push(dayDone() ? (dayClean() ? 'DAY COMPLETE, CLEAN' : 'DAY COMPLETE')
                        : levelLabel(nextLevel()));
  }
  if (bestScore > 0) bits.push('BEST ' + bestScore);
  const r = recFor(nextLevel());
  if (r.best > 0) bits.push('TODAY ' + r.best);
  /* THE COUNTDOWN HAS ITS OWN ROW NOW. See titleResetLine. It was the
     fifth item on this line and it is the reason to come back. */
  return bits.join('  \u00b7  ');
}

/* THE ONE LINE THAT SAYS WHY TO COME BACK.

   The whole set regenerates at the local midnight, every level of it,
   and it is the same set for everybody on that date. A player cannot
   see any of that from the road, so the screen has to say it, and until
   now it said it as "NEW IN 2h 2m" at the end of a dim row of five
   middot separated facts.

   THE COUNT IS IN IT, because "a new track" and "five new tracks" are
   different offers and the second one is the true one. It reads
   LEVEL_COUNT rather than saying five, like everything else that knows
   how long a day is.

   SINGULAR IS HANDLED because LEVEL_COUNT is a live tunable that goes
   down to one, and "1 NEW TRACKS" on a cycler is the sort of thing that
   ships. */
/* ONE SENTENCE, TWO SCREENS, ONE FUNCTION. The title screen says it
   every time the game is opened and the completion screen says it once,
   at the end of the day, and the two must not be able to disagree about
   how many tracks there are or when they arrive. `tomorrow` is the only
   difference: on the title screen the countdown is the whole of it,
   and on the completion screen the word is the point, because that is
   the moment the player is deciding whether there is a reason to come
   back. */
function newTracksLine(tomorrow) {
  const n = levelCount();
  const what = n === 1 ? 'A NEW TRACK' : n + ' NEW TRACKS';
  return what + (tomorrow ? ' TOMORROW, IN ' : ' IN ') + countdownLabel();
}
function titleResetLine() { return newTracksLine(false); }

/* THE BLINK. Hard on, hard off, in the arcade tradition, which is the
   single change that makes this read as a splash rather than a page. A
   sine fade was the obvious alternative and it is wrong: a fade reads as
   a web page breathing at you. */
function titleBlinkLit() {
  const period = Math.max(0.05, FEEL.TITLE_BLINK_PERIOD);
  const phase = (titleTime % period) / period;
  return phase < FEEL.TITLE_BLINK_ON;
}

/* ==================================================================
   THE TITLE SCREEN. AN ARCADE SPLASH, NOT A MENU AND NOT A PAGE.

   IT WAS SIX BLOCKS OF TEXT ON A LIT SCENE AND IT IS NOW THREE ON A
   DARK ONE. What went, and why:

     THE PLAY TODAY'S TRACK BUTTON. Tapping anywhere already started
     today's track, so a button saying so was a second way to do the
     thing the whole screen already does, and it was the biggest object
     competing with the wordmark. A blinking prompt says the same thing,
     takes a fifth of the room and is the oldest convention in the
     genre.
     THE PITCH SENTENCE. "One road for everyone today, a new one
     tomorrow, compare with anyone" was a paragraph on a splash screen.
     Three words of it survive on the countdown line, where they belong.
     THE STEERING LINE. Section 5: the first ten seconds of the game are
     the tutorial, and one gentle corner teaches hold to turn without a
     word. A line of instructions on the title screen is the thing that
     rule exists to prevent.
     THE PRESS T HINT. Any key starts today's track, and on a keyboard
     the prompt itself now says so.
     THE TIME FIGURE AND THE LONG RANDOM TRACK CAPTION. Both shortened
     into the lines that were already there.

   AND THE SCRIM UNDER ALL OF IT, which is the change the rest depends
   on. The game keeps running behind, because an attract loop is worth
   having, but it runs behind a dark wash rather than in front of the
   type. See TITLE_SCRIM_ALPHA.

   ONE WARM FAMILY. Cream for the prompt, amber for the two fact lines,
   and the wordmark's own orange untouched. Nothing on this screen is
   drawn in a colour that the biome rotates, which is why the mint went:
   it was a different colour at every hue and it fought the wordmark at
   all of them.

   THE EMPTY SPACE IS THE DESIGN. Nothing goes between the countdown and
   the bottom button. It is not a gap waiting to be filled.

   ONE LAYOUT, BOTH ORIENTATIONS. The wordmark takes whatever height is
   left once the three lines, the air and the bottom button have taken
   theirs, so landscape is the same arrangement with the mark smaller
   rather than a second set of rules to keep in step.
   ================================================================== */
function drawOverlay(w, h) {
  /* The credit is asked for by drawResult and drawFinish and by nothing
     else. Every other screen simply does not ask, and syncCredit takes
     it off the document at the end of the frame. */
  if (state === TITLE) {
    const s = Math.min(w, h);

    /* THE SCRIM, FIRST, over everything the world has drawn and under
       everything this screen will. Sized past the edges like every other
       full screen wash here, because the shake transform is not the
       identity on the frame a run ends. */
    ctx.globalAlpha = clamp(FEEL.TITLE_SCRIM_ALPHA, 0, 1);
    ctx.fillStyle = 'rgb(' + COLOUR.TITLE_SCRIM + ')';
    ctx.fillRect(-40, -40, w + 80, h + 80);
    ctx.globalAlpha = 1;

    /* The stack under the mark, measured rather than assumed, so the
       wordmark can be handed the rest. */
    const promptSize = Math.round(s * FEEL.TITLE_PROMPT_SIZE);
    const factSize = Math.round(s * FEEL.TITLE_FACT_SIZE);
    /* The music block replaced the clock row, so it is what the wordmark
       now has to be measured against. Two lines and the gap between
       them, and only when it is actually drawn. */
    const musSize = Math.round(s * FEEL.TITLE_MUSIC_SIZE);
    const musBlock = musicOn
      ? s * FEEL.TITLE_GAP_MUSIC + musSize * 0.62 + s * FEEL.TITLE_MUSIC_GAP
        + Math.round(s * FEEL.TITLE_MUSIC_SUB)
      : 0;
    /* The reset line's own row, counted into the stack the wordmark is
       measured against, or the mark grows into it on a short screen. */
    const resetSize = Math.round(s * FEEL.TITLE_RESET_SIZE);
    const resetBlock = s * FEEL.TITLE_GAP_RESET + resetSize;
    const below = s * FEEL.TITLE_GAP_PROMPT + promptSize / 2
                + s * FEEL.TITLE_GAP_FACTS + factSize + resetBlock + musBlock;
    const top = Math.max(safeTop + s * 0.030, h * FEEL.TITLE_TOP);
    /* THE FINE PRINT TAKES ONLY THE ROOM THE SCREEN CAN SPARE.

       Lifting the bottom group by the fine print's full height squeezes
       everything above it, and on a phone held sideways there is not
       always that much to give. Measured: at 568 by 320 the stack had
       eighteen pixels of slack, the fine print asked for twenty six, and
       the RANDOM TRACK button was drawn straight through "the note
       button, bottom left, turns it off".

       So the slack is worked out first, against the same floor the
       wordmark is allowed to shrink to, and the lift is clamped to it.
       Where there is room, which is every phone held upright, the fine
       print gets its whole band. Where there is not, the screen keeps
       its composition and the fine print keeps whatever is going, which
       is still more than the ten to fourteen pixels it started with,
       because the pads are below the clamp rather than inside it. */
    const bottomTop0 = h - safeBottom - FEEL.DEATH_BOTTOM - s * 0.092;
    const slack = bottomTop0 - top - below - s * FEEL.TITLE_AIR
                - s * FEEL.TITLE_WM_MIN;
    const fine = Math.max(0, Math.min(fineBand, slack));
    // The top of the RANDOM TRACK button, which the stack must clear.
    const bottomTop = bottomTop0 - fine;
    const wmMaxH = Math.min(h * FEEL.TITLE_WM_TALL,
                            Math.max(s * FEEL.TITLE_WM_MIN,
                                     bottomTop - top - below - s * FEEL.TITLE_AIR));
    const aspect = brandInkAspect(BRAND.wordmark);
    const wmW = Math.min(w * FEEL.TITLE_WM_WIDTH, wmMaxH * aspect);

    let y;
    if (brandReady()) {
      y = top + drawBrandInk(BRAND.wordmark, w / 2, top + (wmW / aspect) / 2, wmW);
    } else {
      // Path2D missing, which should never happen. Type, so the screen
      // still has a heading rather than a hole where one was.
      const title = 'DRIFT FEVER';
      const cy = top + s * 0.06;
      text(title, w / 2, cy,
           fittedSize(title, '800', Math.round(s * 0.115), w * 0.88), '800');
      y = cy + s * 0.06;
    }

    /* THE PROMPT. Blinking, centred, no border and no box, which is the
       whole of the arcade convention. It names the action the player
       actually has: a tap on a phone, a key on a Chromebook. */
    y += s * FEEL.TITLE_GAP_PROMPT + promptSize / 2;
    if (titleBlinkLit()) {
      const go = hasKeyboard ? 'PRESS ANY KEY' : 'TAP TO START';
      text(go, w / 2, y, fittedSize(go, '800', promptSize, w * 0.9), '800');
    }

    y += promptSize / 2 + s * FEEL.TITLE_GAP_FACTS;
    ctx.globalAlpha = FEEL.TITLE_FACT_ALPHA;
    const facts = titleFactLine();
    text(facts, w / 2, y, fittedSize(facts, '700', factSize, w * 0.92), '700',
         'center', COLOUR.TITLE_DIM);
    ctx.globalAlpha = 1;

    /* AND THE RESET, ON ITS OWN ROW. Bigger than the facts above it and
       at full strength, in the score's own gold rather than the dim, so
       the eye stops on it. It is the reason to come back and it used to
       be the fifth thing on the dimmest line here. */
    y += s * FEEL.TITLE_GAP_RESET + resetSize / 2;
    ctx.globalAlpha = clamp(FEEL.TITLE_RESET_ALPHA, 0, 1);
    const reset = titleResetLine();
    text(reset, w / 2, y, fittedSize(reset, '800', resetSize, w * 0.92), '800',
         'center', COLOUR.SCORE_BEST);
    ctx.globalAlpha = 1;
    y += resetSize / 2;


    /* THE WARNING, AND IT IS WHAT MAKES MUSIC ON BY DEFAULT DEFENSIBLE.

       This screen is silent. The music starts with the run. So a player
       is told what is about to happen, and shown where the off switch
       is, at a moment when nothing is playing and there is no hurry. It
       is the difference between a warning and an apology.

       Brighter than the two dim lines above it on purpose: it is the one
       thing on this screen somebody might need to act on. It is dropped
       once the player has muted, because at that point it is telling
       them about something that will not happen.

       NOT dropped when the FETCH fails, which it was at first. A failed
       fetch falls back to the procedural track, so music still plays and
       the warning is still true; hiding it there would be warning people
       only when the music is the good kind. */
    if (musicOn) {
      y += s * FEEL.TITLE_GAP_MUSIC;
      /* IN THE WORDMARK'S OWN TREATMENT. Gold on an orange outline, the
         same three draws DRIFT FEVER is built from, because this is the
         game introducing itself rather than a system message: four
         original tracks are a thing to be proud of and the line that
