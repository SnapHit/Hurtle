/* ---------------- track helpers over the recorded world ---------------- */
const SL = SEQ.world.slices;

}

const gapAt = z => SEQ.world.gaps.some(g => z >= g.z0 && z <= g.z1);

const cam = new THREE.PerspectiveCamera(60, 1, 6, 40000);

const scene = new THREE.Scene();

/* a night environment for reflections: dark sky, a few coloured light panels */
{
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ color: 0x0a0820, side: THREE.BackSide })));

  panel(0xff2e88, -30, 10, -20, 30); panel(0x2ee0ff, 30, 6, -25, 30); panel(0xff8a2a, 0, 30, 10, 26); panel(0x6a4aff, 0, -10, -40, 40);

/* ---------------- sky dome ---------------- */
const skyU = { top: { value: new THREE.Color(TIERS[0].top) }, mid: { value: new THREE.Color(TIERS[0].mid) }, hor: { value: new THREE.Color(TIERS[0].hor) },
               low: { value: new THREE.Color(TIERS[0].low) }, t: { value: 0 }, sun: { value: 1 }, stars: { value: 0 },
               sunDir: { value: new THREE.Vector3(-0.55, 0.035, -1).normalize() } };

  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,

      float s = step(0.996, h(g)) * smoothstep(0.03, 0.15, e) * (0.6 + 0.4 * sin(t * 3.0 + h(g + 1.0) * 30.0));

      // the low sun's warm glow along the horizon, and the sun itself just above it
      float d = max(dot(vD, sunDir), 0.0);
      c += vec3(1.0, 0.62, 0.32) * sun * (pow(d, 8.0) * 0.32 + pow(d, 90.0) * 0.22) * smoothstep(-0.25, 0.05, e);

    }` }));

const hemi = new THREE.HemisphereLight(0x4a4ab0, 0x100810, 0.55); scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8a9cff, 0.55); scene.add(moon, moon.target);
let winLevel = 0.75, bloomBase = 0.75;

/* ---------------- canvas textures ---------------- */
function tex(w, h, paint, ru = 1, rv = 1, srgb = true){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);

      GLOW_G = radial('rgba(60,255,140,A)'), GLOW_M = radial('rgba(255,60,160,A)'), GLOW_R = radial('rgba(255,40,60,A)');

/* ---------------- the track ---------------- */
const T = 26;
const P3 = (x, y, z) => [x, y, -z];
const edgeY = (s, side) => s.y - side * s.bank * s.hw;
function strip(fnL, fnR, uvScale){
  const pos = [], uv = [];
  for (let i = 0; i < SLc.length - 1; i++){
    const a = SLc[i], b = SLc[i + 1];
    if (gapAt((a.z + b.z) / 2)) continue;
    pos.push(...fnL(a), ...fnR(a), ...fnL(b), ...fnR(a), ...fnR(b), ...fnL(b));

const roadMap = tex(512, 512, (c, w, h) => { noise(c, w, h, '#14161d', 0.16, 16000);
  c.fillStyle = 'rgba(255,255,255,0.03)'; for (let y = 0; y < h; y += 128) c.fillRect(0, y, w, 3); });
const roadEm = tex(512, 512, (c, w, h) => { c.fillStyle = '#000'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#29d8ff'; for (const u of [1/3, 2/3]) for (let y = 0; y < h; y += 128) c.fillRect(u * w - 3, y, 6, 66);

const road = new THREE.Mesh(strip(s => P3(s.cx - s.hw, edgeY(s, -1), s.z), s => P3(s.cx + s.hw, edgeY(s, 1), s.z), 240),

const sideMat = new THREE.MeshStandardMaterial({ color: 0x0b0d16, roughness: 0.45, metalness: 0.7, side: THREE.DoubleSide,
  emissiveMap: tex(16, 64, (c, w, h) => { c.fillStyle = '#000'; c.fillRect(0, 0, w, h); c.fillStyle = '#ff6a10'; c.fillRect(0, 0, w, 5); }), emissive: 0xffffff, emissiveIntensity: 0.6 });

  scene.add(new THREE.Mesh(strip(s => P3(s.cx + side * s.hw, edgeY(s, side), s.z), s => P3(s.cx + side * s.hw, edgeY(s, side) - T, s.z), 200), sideMat));
/* rails: light strips with pulses running downhill */
const pulse = tex(16, 256, (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h);

const lips = [];
for (const g of SEQ.world.gaps){

    const s = tr(zz);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(s.hw * 2, 16), new THREE.MeshBasicMaterial({ map: chevTex, color: 0xffffff, transparent: true }));

const rings = [];
for (const tn of SEQ.world.tunnels){

    const s = tr(z), w = s.hw * 2 + 70, h = 250;

    scene.add(m); rings.push({ m, z, mouth });
  }

  const wallMat = new THREE.MeshStandardMaterial({ color: 0x0a0c14, roughness: 0.55, metalness: 0.5, side: THREE.DoubleSide });
