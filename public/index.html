<script>
"use strict";

/* ==========================================================================
   PLACEHOLDER NAME. Two lines to change when the real name arrives.
   ========================================================================== */
const GAME_NAME = "HURTLE";
const STORE_KEY = "hurtle_best_v1";
const DIAG_KEY  = "hurtle_diag_v1";
/* how many pickups this browser has ever collected. The only thing the
   explanation needs to know, and the only thing it stores. */
const TEACH_KEY = "hurtle_teach_v1";
/* v2. The defaults and the slider ranges have both moved, so a blob written by
   an earlier build loads values that are near the new defaults but not equal to
   them, and any that now fall outside a range get clamped to its edge. That is
   what was reporting an untouched game as adjusted. Old settings are dropped
   rather than migrated: they describe dials that no longer mean the same thing. */
const OPT_KEY   = "hurtle_opts_v2";
const MUTE_KEY  = "hurtle_mute_v1";
/* Its own key. Folding the track choice into an existing preference would mean
   that when the default moves, everyone who had set one is silently inverted. */
const TRACK_KEY = "hurtle_track_v1";
/* keys the game shipped under before it had a name, read once so nobody loses
   a record to a rename */
const OLD_KEYS  = { best:"descent_best_v2", diag:"descent_diag_v1" };

/* ==========================================================================
   FEEL CONSTANTS

   One block. Nothing that shapes the feel lives inline in the update loop,
   including bare multipliers. Diff this whole object against any later
   version to prove it has not moved.

   Live tuning: open devtools and assign, e.g. K.BANK_PUSH_FRAC = 0.6.
   Derived values recompute every frame so edits take effect immediately.
   ========================================================================== */
const K = {

  /* --- how fast everything escalates. ---
     One number scaling the time axis of every curve: speed, density, narrowing,
     the corridor, lookahead and the section mix. 1.5 means the whole run happens
     half again as fast. It exists because bots bracket difficulty badly: an
     oracle with exact obstacle positions dies at 70s and a bot that only sees
     what is drawn dies at 7s, and a real player sits somewhere between. Rather
     than keep guessing at that number, turn this one. */
  DIFFICULTY: 1.0,

  /* --- the late stage. ---
     Every primary curve asymptotes, which is correct for the ones bounded by
     reaction time but leaves the game static for anyone who survives the first
     minute. This is a second, slower stage that starts once the first has
     settled and keeps climbing along the axes that reward planning rather than
     reflexes: more blocks per row, and rows closer together. */
  LATE_START: 75,         // s before the second stage begins
  LATE_TAU: 132,           // s, its time constant
  LATE_ROW_ADD: 1.0,      // extra blocks per row at full late stage
  LATE_GAP_MUL: 0.80,     // clear-run multiplier at full late stage

  /* --- fixed timestep. Physics never sees a variable dt. --- */
  STEP: 1 / 120,
  MAX_STEPS: 5,           // catch-up cap per frame. Slope allows sixteen physics
                          //   steps in one frame, all consuming a single input
                          //   sample, which is how an input survives a hitch and
                          //   keeps steering after you let go. Five steps is 42ms;
                          //   past that time is dropped rather than the ball
                          //   being teleported through whatever was in the way.

  /* --- forward speed. ---
     Slope's speed rises without limit, which means it eventually outruns human
     reaction time, which is why elite play there depends on a loading bug. The
     wall is not speed, it is speed eating your lookahead. Here lookahead is an
     explicit constant with a floor (LOOK_T_MIN below), so speed cannot consume
     it. That lets the curve run far higher without ever crossing the wall, and
     it means raw speed is a feel and score axis rather than the difficulty. The
     difficulty escalates through demands that do not spend reaction time:
     density, precision, and the section mix drifting harder over a run. */
  V_START: 871,
  V_MAX: 2980,
  V_TAU: 71.7,           // 95% of V_MAX at 190s, one music track. Was 38,
                          //   which reached 97% at 120s: difficulty was maxed
                          //   before a new player had learnt the controls.

  /* --- threading. ---
     The report's complaint in 4.7 is that Slope scores pure distance, so
     precision and risk earn nothing. This is the answer, and it also fixes the
     thing that made this game too easy: a generator that guarantees a safe
     corridor rewards sitting in it. Now the corridor keeps you alive and earns
     you very little. Points come from passing CLOSE to a block without touching
     it, and from chaining those passes.

     I prototyped the report's brake and tuck first, since it flagged that call
     as unresolved. Both fail here for one measurable reason: holding both keys
     means no steering, the floor is always tilting, so there is never a moment
     you can afford to stop steering. Threading needs no new input at all: it is
     a property of the line you choose. */
  NEAR_ON: true,
  NEAR_D: 18,             // lateral gap from a block's edge that counts as threaded.
                          //   Must be well under the corridor tolerance or ordinary
                          //   drift earns it and the risk is not a choice.
  NEAR_STEP: 0.20,        // multiplier added per link in the chain
  NEAR_CAP: 12,           // most links that count toward the multiplier
  NEAR_HOLD: 2.6,         // s a chain survives without a new link
  NEAR_FLASH: 0.30,       // s the marker holds when one registers

  /* --- scoring. ---
     Slope scores pure distance, so precision and risk earn nothing, and flying
     over an obstacle can score LESS than hitting the ground beside it. Here the
     rate rises faster than linearly with speed, which is what gives the brake a
     price and makes going fast the skill being measured. */
  SCORE_RATE: 42,         // points per second at starting speed
  SCORE_POW: 1.35,        // above 1 so speed is worth more than the ground it covers

  /* --- lookahead. How many SECONDS of track you can see. ---
     This is the reaction budget, and it is the reason the speed curve is safe.
     LOOK_T_MIN is a hard floor: roughly 0.25s to notice, 0.35s to cross the
     corridor, and the rest as planning room. Never set it below about 1.0. */
  LOOK_T_START: 4.20,     // s of track visible at the start of a run
  LOOK_T_MIN: 2.30,       // s, the floor. Not a reaction budget any more but a
                          //   PREPARATION budget: long enough to see a challenge,
                          //   read it, and decide how to take it before arriving.
                          //   This is the thing that makes a hard game feel fair.
  LOOK_TAU: 64,          // stretched with V_TAU (was 34)           // s, how fast the view tightens
  NEAR_Z: 26,             // world units ahead of the camera where drawing starts
  BAND_Z: 200,            // world units per colour band at V_START. At 108 the
                          //   view held about 30 bands, and since each one now
                          //   paints its own edge lips that was 90 fills before
                          //   anything else was drawn. Sixteen larger bands cost
                          //   half as much and still pass twice as fast at top
                          //   speed, so the cue survives. Grows with
                          //   the square root of speed: bands still pass faster
                          //   as you accelerate, so the cue survives, but they
                          //   do not end up strobing at 24 a second.
  VIEW_CURVE: 1.55,       // sample distribution across the view. Above 1 packs
                          //   samples near the camera, where a slice is worth
                          //   hundreds of pixels, instead of far away where the
                          //   whole far half is worth a few.
  FOCAL_RUSH: 0.075,      // how much the view widens with speed. Pure feel.

  /* --- lateral control. The one axis. --- */
  LAT_ACC: 4200,          // u/s^2 while a direction is held
  LAT_DRAG: 5.5,          // 1/s, decay when released
  LAT_MAX: 520,           // u/s hard cap
  AIR_CTRL: 0.45,         // lateral authority while airborne. Below 1 is what
                          //   makes a long jump a commitment rather than a gap.

  /* --- player body --- */
  /* Halved along with the draw radius. Shrinking only the picture would leave a
     hitbox wider than the ball and you would be clipped by things that visibly
     missed. OBST_CLEAR drops by the same 8 units below, so the corridor you have
     to thread is unchanged in absolute terms and the game plays as before. */
  P_HW: 8,
  P_HD: 6,
  TRAIL_N: 8,
  TRAIL_DZ: 14,           // short, because the camera sits only CAM_BACK behind
                          //   the ball: anything longer is streaming away behind
                          //   the lens where nobody can see it.
  TRAIL_TAPER: 0.62,      // width of the oldest ghost, as a fraction of the ball
  TRAIL_A: 0.34,          // opacity of the newest ghost

  /* --- banked floor. The reason you cannot sit still. ---
     Tilt is a slope: rise per unit of lateral distance. Positive lifts the
     left edge, so the floor pushes you right. The push is expressed as a
     fraction of your own lateral authority, so it can never exceed what you
     are able to fight. */
  BANK_MAX: 0.62,         // steepest tilt, about 32 degrees
  BANK_PUSH_FRAC: 0.29,   // fraction of LAT_ACC applied at BANK_MAX. At 0.68 the
                          //   floor was eating two thirds of your steering and
                          //   the ball would not answer. The tilt still has to be
                          //   managed constantly; it no longer owns the wheel.
  BANK_BASE_AMP: 0.46,    // ambient tilt present even on plain track. This is
                          //   the floor of demand: no stretch of track is ever
                          //   flat enough to coast on.
  BANK_WAVE: 505,         // z per ambient tilt cycle. Shorter means the tilt
                          //   reverses more often, so you correct rather than
                          //   just leaning on one direction.
  BANK_SMOOTH: 0.020,     // per slice, how fast tilt reaches its target
  CAM_ROLL: 0.42,         // how far the camera rolls with the tilt. 0 = level.

  /* How far sideways the track steps across a hole. Slope lands you left or
     right of where you took off, and it is the best possible use of a jump: the
     flight is already a commitment, so make the commitment be aiming. Bounded by
     what is actually reachable in the air at AIR_CTRL, so it is always makeable. */
  JUMP_SHIFT: 0.45,       // fraction of reachable air displacement. 0 = no step.

  /* --- jumps. Holes in the floor, cleared automatically. No jump button:
     one axis stays one axis. The risk is the landing, not the launch. --- */
  GRAV: 4200,             // u/s^2 vertical
  GAP_T_MIN: 0.30,        // s of air, shortest hop
  GAP_T_MAX: 1.70,        // s of air, longest committed flight
  /* Six shapes rather than four, and the multipliers vary WITHIN a pattern, so a
     run of holes reads as a phrase rather than a metronome. */
  GAP_PATTERNS: [
    [1.00],                     // one, medium
    [1.00],                     // one, big: drawn from the top of the range
    [0.52, 0.52],               // a matched pair
    [0.42, 0.42, 0.42],         // a stutter
    [0.38, 0.62, 0.95],         // building
    [0.95, 0.55, 0.34]          // falling away
  ],
  GAP_BIG_AT: 1,          // which pattern draws its air time from the top
  GAP_SPACE_T: 0.85,      // s of solid ground between hops in a pattern. Has to
                          //   absorb the extra distance the descent adds to each
                          //   arc, or a stutter lands you in the next hole.
  GAP_MARGIN: 0.26,       // fraction of the arc left spare, so a hole is always
                          //   clearable. Raise if landings feel like coin flips.
  GAP_MAX_VIEW: 0.55,     // hard cap on hole length as a fraction of draw
                          //   distance, so you can always see the far lip when
                          //   you commit. A steep grade stretches the arc, and
                          //   without this a plunging jump outruns the view.
  LAND_SHAKE: 7,
  LAND_SQUASH: 0.16,      // s of visual compression on touchdown
  LIFTOFF_STEPS: 3,       // steps of grace after launch before a landing counts
  AIR_OBST_H: 0.62,       // fraction of block height you must clear to pass over

  /* --- track geometry --- */
  /* Track width is a budget shared three ways: the corridor, the margin keeping
     the safe line off the edge, and the offset that keeps the track CENTRE out
     of the corridor. Too narrow and either the centre becomes a safe place to
     sit or ordinary tracking error walks you off the edge. Sized so both hold. */
  HW_START: 288,
  HW_MIN: 215,
  HW_TAU: 64,            // stretched with V_TAU (was 34)
  SLICE_DZ: 18,
  VIEW_SLICES: 92,
  LIP_W: 11,

  /* --- wireframe grid, the way Slope draws everything. ---
     Free on the track: the projection of a plane is a projective map, so a point
     partway across the ribbon lands partway between the two edge points already
     computed. No extra projections, and every line goes into ONE path with ONE
     stroke call. */
  GRID_LONG: 6,           // lines running along the track. 0 disables.
  GLOW_W: 4.2,            // width multiplier for the bloom pass under a line
  GLOW_A: 0.30,           // its opacity. Two strokes per path is the whole
                          //   lighting model: no shadowBlur, no filters, nothing
                          //   that costs fill rate on a slow machine.
  GRID_TOWER: true,       // lattice on the near faces of buildings
  GRID_TOWER_V: 3,        // divisions across a tower face
  GRID_TOWER_H: 4,        // divisions up a tower face
  GRID_TOWER_PX: 46,      // only gridded above this on-screen height
  GRID_W: 1.15,           // line width
  GRID_A: 0.85,           // opacity on the track. The grid is now the only
                          //   thing describing the deck, so it carries the read.
  GRID_TOWER_A: 0.70,     // opacity on buildings
  FX_A: 0.92,             // opacity of the moving scenery, which is brighter than
                          //   the static lattice so the eye finds the movement

  /* --- the safe path. Generated FIRST, everything else placed around it. --- */
  SAFE_SLOPE_FRAC: 0.26,  // the safe line's own wiggle
  SAFE_TURN: 185,         // z between heading changes. Shorter means it snakes.
  SAFE_ROAM: 1100,
  SAFE_MARGIN_MUL: 1.08,  // min gap from the safe line to either edge, as a
  SAFE_MARGIN_PAD: 28,    //   multiple of the corridor plus a pad. It was a flat
                          //   88, which late in a run left the safe line able to
                          //   sit only 50u from the track centre. The centre was
                          //   therefore inside the corridor 90% of the time, and
                          //   holding it was a winning strategy.

  /* How far the track centre sits from the safe line. This is what stops the
     middle of the track being somewhere to hide. Targets are pushed toward the
     limit and alternate sides rather than random-walking around zero, which is
     what kept the centre safe. The centre may swing as fast as it likes: you
     follow the safe line, not the centre, so its speed costs no tracking effort
     and buys all of the visible snaking. */
  OFF_BIAS: 0.72,         // closest a target may sit to the centre, as a fraction
  OFF_SLOPE_FRAC: 4.60,   // how fast the centre swings
  OFF_TURN: 430,          // z between targets. Longer means it dwells out wide
                          //   instead of spending its life crossing the middle.
  OFF_FLIP: 0.44,         // chance a new target is on the other side. Below 1 so
                          //   it does not have to transit through zero every
                          //   time, and zero is where the centre and the safe
                          //   line coincide.

  /* --- the descent itself. ---
     GRADE is drop per unit travelled forward. A constant grade is INVISIBLE if
     the camera rides the surface, because the relative geometry is identical to
     flat ground. What reads as going downhill is the track's vanishing point
     sitting below the true horizon, which only happens if the camera stays
     gravity-level instead of pitching with the slope. CAM_PITCH_FOLLOW is how
     much of that it gives back: 0 keeps the camera level and the drop at its
     most dramatic, 1 pitches all the way and looks flat again. */
  GRADE_BASE: 0.72,       // average drop per unit forward
  GRADE_MAX: 0.80,        // steepest the ground may get. Without a cap, a DROP
                          //   section pushed the track's vanishing point clean
                          //   off the bottom of the screen and there was nothing
                          //   left to look at. At 1.05 it also put the BALL off
                          //   the bottom, which was a pre-existing bug at any
                          //   steep grade and is what CAM_KEEP now backstops.
  CAM_PITCH_EXTRA: 1.25,  // extra downward pitch on top of the grade-derived
                          //   part, as a tangent. This is what rakes the
                          //   buildings up toward you. Costs a little of the
                          //   horizon gap, buys a lot of "I am looking down".
  CAM_TRUE_PITCH: 1.0,    // 0 reproduces the old projection exactly, 1 is a real
                          //   camera rotation. Pitching the camera down was being
                          //   faked as a vertical shift of the horizon, which
                          //   slides the picture but leaves every vertical line
                          //   on screen dead vertical. A real rotation makes them
                          //   converge downward, which is what looking down at
                          //   something actually looks like, and it is the angle
                          //   between the buildings and the ball that was missing.
  CAM_KEEP: 0.82,         // how far down the screen the ball may sit, as a
                          //   fraction of height. Past it the whole frame is
                          //   shifted up. The gap between horizon and where the
                          //   track vanishes is grade x focal, so it survives the
                          //   shift untouched: the descent cue costs nothing.
  GRADE_WAVE_AMP: 0.07,   // ambient steepening and easing, as a fraction. Low,
                          //   so the slope is a slope rather than a series of
                          //   valleys and ridges.
  GRADE_WAVE: 2300,       // z per ambient cycle
  GRADE_SMOOTH: 0.012,    // per slice, how fast grade reaches its target
  GRADE_HOLD_PAD: 900,    // z either side of a hole where steepness is frozen
  CAM_PITCH_FOLLOW: 0.42, // 0 = camera stays level, 1 = camera follows the slope.
                          //   Raised alongside the steeper grade because at 0.16
                          //   a 0.72 grade pushed the track's vanishing point so
                          //   far down the screen that there was barely any track
                          //   left to look at. Half-follow keeps it framed while
                          //   still leaving a large, varying gap to the horizon,
                          //   and that gap is what you read as steepness.

  /* --- local undulation on top of the grade --- */
  PITCH_AMP: 0,           // No bumps at all. They read as hilly terrain rather
                          //   than as a slope, they made the ride jerky, and with
                          //   correct occlusion they hid a tenth of the blocks in
                          //   your lane. The grade is the descent; the surface
                          //   under it should be smooth.
  PITCH_WAVE: 1350,

  /* --- the city. ---
     Slope's void is full of receding wireframe blocks, and that is what makes
     it read as a world rather than a ribbon in the sky. It is also what makes
     the descent legible: a tower's base sits at the track's elevation where it
     stands, which is below you, so as you fall toward it the whole thing rises
     up past you. Perspective alone cannot show a descent with nothing in frame
     to measure it against. */
  CITY_ON: true,
  CITY_SPACING: 140,      // z between tower clusters
  CITY_CHANCE: 0.78,      // chance of a tower on a given side of a cluster
  CITY_NEAR: 150,         // clearance from the track edge
  CITY_SPREAD: 2300,      // how far out they scatter
  CITY_W_MIN: 90,
  CITY_W_MAX: 300,
  CITY_H_MIN: 380,
  CITY_H_MAX: 1750,
  CITY_SINK: 430,         // how far below the track a base may sit
  /* --- things that move out there. ---
     The city already handles placement, culling, sorting, projection and
     batching, so these cost almost nothing: rotors and craft append their
     segments to the same path the tower lattice uses and go out in the same
     single stroke. Everything is driven by animT, which the simulation never
     reads, so none of it can affect a run. They stay in the tower colour and
     well off the track, because anything moving near the ball reads as a hazard
     and players flinch at it. */
  ROTOR_ON: true,
  ROTOR_MIN_H: 200,       // any tower taller than this carries one
  ROTOR_Y: 560,           // how far up the tower it is mounted. It used to sit on
                          //   the top, and a tall tower near the camera puts its
                          //   top around y=-37000 on an 852px screen: the camera
                          //   pitches down, so anything high is far out of frame.
                          //   Mounted at a fixed height it is always in the band
                          //   you are actually looking at.
  ROTOR_CHANCE: 0.20,     // Rotors read as machinery on a building rather than
                          //   as clutter, so they can be commoner than the craft,
                          //   but at 0.80 nearly every tower had one.
  ROTOR_BLADES: 4,
  ROTOR_R: 0.85,          // as a fraction of tower width
  ROTOR_RPM: 7,           // a slow turn. Machinery, not a fan.

  CRAFT_ON: true,
  CRAFT_CHANCE: 0.10,     // per tower row. At 0.45 the sky was full of them and
                          //   they read as clutter rather than as traffic.
  CRAFT_HI: 300,          // how far above the track they fly. 1500 put them
                          //   clean off the top of the frame: the camera pitches
                          //   down 45 degrees or more, so the visible field is
                          //   mostly below the horizon. They now sit among the
                          //   tower tops, which is where you would look for them.
  CRAFT_HI_VAR: 560,
  CRAFT_RANGE: 1700,      // how far they range either side before wrapping. At
                          //   5200 they spent almost all of their sweep outside
                          //   the field of view and you would catch one every
                          //   half minute or so.
  CRAFT_V: 420,
  CRAFT_LEN: 120,
  CRAFT_W: 54,

  CRAFT_TRAIL: 5.0,       // trail length as a multiple of the body. A bare
                          //   outline triangle reads as a glitch in the sky;
                          //   a streak behind it reads as something moving.

  CITY_VIEW: 3600,        // drawn well past the end of the track
  CITY_MAX: 36,           // hard cap on towers drawn per frame
  CITY_FLAT_PX: 105,      // below this on-screen height, one fill instead of two
  CITY_EDGE_PX: 130,      // below this, no outline stroke. Strokes cost more than
                          //   fills, and on a far tower the outline is invisible.
  VOID_LINE: 1.00,        // how much darker the ground haze is than the sky
  FADE_START: 0.58,       // where the track begins fading into the void
  FADE_AMT: 0.94,         // how completely it fades by the far end
  FADE_LIP: 0.34,         // below this fade, skip the edge lips entirely

  /* --- the horizon. ---
     A constant downhill is INVISIBLE without something at eye level to measure
     it against. The track's vanishing point sits grade x FOCAL below the eye-
     level horizon, but if nothing is drawn at that horizon there is no gap to
     see, and the whole thing reads as flat hilly ground. This ridge sits at eye
     level, is effectively infinitely far away, and never descends. The gap
     between it and where the track vanishes IS the descent, made visible. */
  RIDGE_AMP: 74,          // how far the peaks rise above the horizon, in pixels
  RIDGE_BASE: 8,
  RIDGE_SCALE: 0.0042,    // horizontal frequency
  RIDGE_PARALLAX: 0.035,  // how much it slides as you steer. Near zero = far away.

  /* --- the ball --- */
  BALL_R: 10.5,           // draw radius
  BALL_HALO_A: 0.34,      // the ball throws light. Two faint rings outside it,
                          //   which is what makes it read as a source rather than
                          //   an object with a colour.
  BALL_RING: 0.86,        // radius of the glowing wheel, as a fraction
  LIP_GLOW: 0.85,         // brightness of the highlight along the inner lip

  /* --- sparks. ---
     Thrown when you scrape a rail or shave a block. The near-miss that feeds the
     threading multiplier is already detected to the frame, so this hangs off a
     hook that was firing anyway and gives that skill something to look at. */
  SPARK_ON: true,
  SPARK_GRAZE: 26,        // thrown by shaving a block
  SPARK_HIT: 64,          // thrown by actually hitting one
  SPARK_FALL: 40,         // thrown by going over an edge
  SPARK_LAUNCH: 20,       // kicked off the lip as you leave it
  SPARK_LAND: 30,         // thrown up by the touchdown
  SPARK_RAIL: 7,          // per burst while scraping an edge
  SPARK_RAIL_D: 70,       // how close to the edge counts as scraping. Measured,
                          //   not guessed: a bot chasing gaps sits a median 116
                          //   units off an edge and only its worst 5% get inside
                          //   77, so the 26 I first picked would have fired
                          //   almost never. 70 lights up on a genuine near-fall
                          //   and stays quiet the rest of the time.
  SPARK_RAIL_IN: 4,       // and how far past it before you are simply falling
  SPARK_RAIL_SPREAD: 0.8,
  SPARK_GRAZE_SPREAD: 1.0,
  SPARK_GRAZE_Y: 0.6,     // up the face of the block the shave lands
  SPARK_RAIL_HZ: 26,      // bursts a second while you stay there
  SPARK_V0: 430,          // launch speed
  SPARK_UP: 210,
  SPARK_BACK: 240,        // they fall behind you, because you are moving
  SPARK_G: 1500,
  SPARK_LIFE: 0.78,
  SPARK_TAIL: 0.070,      // seconds of travel drawn as the streak
  SPARK_W: 2.9,
  SPARK_MAX: 260,         // hard cap, so a long scrape cannot flood the frame
  SPARK_FLASH: 0.16,      // s of white bloom at the point of impact
  SPARK_FLASH_R: 60,      // and how wide it opens, in world units

  /* --- speed lines. ---
     Screen space, radiating from where the track vanishes, kept out of the
     middle so they never sit on top of the thing you are trying to read. */
  SPD_ON: true,
  SPD_V0: 900,            // u/s below which there are none. At 1500, with the
                          //   ramp running all the way to V_MAX, a typical run
                          //   sat at 5% opacity: drawn, and invisible.
  SPD_TOP: 0.40,          // fraction of V_MAX at which they are at full strength
  SPD_N: 30,
  SPD_R0: 0.30,           // inner radius, as a fraction of the smaller dimension
  SPD_CLEAR: 4.0,         // how much further out the DOWNWARD ones start. The
                          //   deck runs from the vanishing point to the bottom
                          //   of the screen, so lines heading that way were
                          //   landing straight on the thing you are reading:
                          //   measured at 64 to 77 per cent of them.
  SPD_LEN: 0.22,
  SPD_A: 0.15,            // Twice now this has crept up until it sat on the deck.
                          //   It is faint and, more to the point, FLAT: it fades
                          //   in near the bottom of the speed range and then never
                          //   changes again, so there is nothing growing in the
                          //   corner of your eye while you are concentrating.
  SPD_SPIN: 0.045,
  SPD_W: 1.8,             // line width, which also grows with speed
  SPD_SKIP: 0.62,         // drop any line pointing this steeply at the deck

  /* --- the two controls you get during a run. ---
     Small, in the bottom corners, and low contrast: reachable without becoming
     something the eye keeps going back to. Steering owns the whole screen, so
     pointerdown checks these first and returns before engaging the drag,
     otherwise pressing one would also throw you sideways. */
  BTN_R: 25,              // tap radius. 23 gave a 43px target, a hair under the
                          //   44px minimum the sliders are held to.
  BTN_M: 16,              // margin from the screen edge
  BTN_A: 0.34,            // how present they are while you play
  BTN_GAP: 10,            // between the two on the right
  SHARE_MSG: 1.8,         // s the copied confirmation stays up

  /* --- tunnels --- */
  TUNNEL_HEAD: 110,       // clear air above the camera inside a tunnel. The
                          //   ceiling used to be a flat 210 while the camera sat
                          //   at 209, so it was already outside the roof before
                          //   the banked floor lifted it another 179. Height is
                          //   now derived from the camera, which is a player
                          //   setting, so it can never be outgrown again.
  TUNNEL_PORTAL: 26,      // thickness of the bright ring at each mouth
  TUNNEL_SEG: 22,         // samples along a tunnel, taken between its real ends

  /* --- sections. The track is built from stretches with distinct characters
     rather than uniform noise, because uniform noise reads as samey no matter
     how much is in it. Multipliers are in SECTIONS below. --- */
  SEC_T_MIN: 3.2,         // s, shortest section
  SEC_T_MAX: 6.8,         // s, longest section
  SEC_BLEND: 0.55,        // s of overlap where one section fades into the next
  /* The mix drifts toward the demanding sections as a run goes on. This is the
     escalation that never hits a ceiling: it asks for better planning rather
     than faster hands, so it can keep going long after speed and density have
     settled, and it cannot outrun anyone's reflexes. */
  SEC_DRIFT_TAU: 104,    // stretched with V_TAU (was 55)      // s, how fast the mix hardens
  SEC_DRIFT_AMT: 1.00,    // how far it goes. 0 disables the drift entirely.

  /* --- practice. Straight off the Slope Plus wishlist: pick a point on the
     difficulty curve and start there. Everything advances together, so it is
     one number rather than a pile of overrides. Scores are not kept. --- */

  /* --- named tiers. Milestones inside an endless game, borrowed from Super
     Hexagon. Shape, not content: no currency, no unlocks, nothing to grind. --- */
  TIER_V: [0, 1050, 1500, 1900, 2250, 2480],
  TIER_FLASH: 1.6,        // s the name holds on screen when you cross into it

  /* --- obstacles --- */
  /* Obstacles arrive as CHALLENGES with clear track between them, not as a
     continuous stream. Slope Plus is very hard and still feels elegant because
     each thing you have to solve is separate, legible, and arrives with room to
     prepare. A row every 0.22s with seven blocks in it is not a harder version
     of that, it is a different and worse game: there is nothing to read, only
     something to survive. A challenge is a burst of rows close together; then
     the track clears so you can see the next one coming and decide. */
  BEAT_ROW_T: 0.30,       // s between rows INSIDE one challenge
  BEAT_ROWS_MAX: 3,       // most rows in one challenge, late in a run
  BEAT_ROWS_TAU: 104,    // stretched with V_TAU (was 55)      // s over which challenges grow
  BEAT_CLEAR_START: 3.00, // s of clear track after a challenge, at t=0
  BEAT_CLEAR_MIN: 1.50,   // s, asymptote. Never below the lookahead, so the next
                          //   challenge is always visible before this one ends.
  BEAT_CLEAR_TAU: 64,    // stretched with V_TAU (was 34)
  OBST_FIRST: 900,
  OBST_D: 78,             // depth in z. MUST exceed V_MAX*STEP.
  OBST_H: 42,
  OBST_HW_MIN: 22,
  OBST_HW_MAX: 62,
  /* The guaranteed corridor tightens over a run. This is precision escalation:
     it asks for finer control rather than faster hands, so it climbs without
     ever approaching the reaction wall. The floor is set from measured tracking
     error, not guessed. */
  OBST_CLEAR: 70,         // half-width of the corridor at t=0
  OBST_CLEAR_MIN: 62,     // asymptote. Tolerance is this minus P_HW: 54 units.
                          //   Sized against the wigglier safe line, not guessed:
                          //   at 48 the line-follower lost 4 runs in 90, at 54 it
                          //   loses none.
  OBST_CLEAR_TAU: 87,    // stretched with V_TAU (was 46)     // s
  OBST_CLEAR_GAIN: 0.55,  // widens the corridor where the line is turning hard,
                          //   since a moving line is harder to hold
  OBST_MAX_ROW: 3,
  OBST_EDGE_A: 0.95,      // opacity of the filament round a block. With the deck
                          //   near-black this is the only thing that makes a
                          //   block visible at all, so it is close to solid.
  OBST_MID_BIAS: 0.75,    // how strongly blocks are pulled toward the track
                          //   centre. Raised because challenges are now sparse:
                          //   with fewer blocks in play, the ones there are have
                          //   to sit where the lazy line goes.
                          //   centre when they are placed. The middle should be
                          //   the worst place to sit, not a safe default.
  OBST_MOVE_V: 105,       // u/s lateral drift of a sliding block
  OBST_SLIDE_ROOM: 26,    // room a block needs spare before it is allowed to slide
  OBST_LAND_CLEAR: 0.30,  // s of clear track after a landing before rows resume

  /* --- blocks that rise from the floor and drop from above. They cycle, so
     whether one is in your way depends on when you arrive rather than only on
     where you are. Both are telegraphed on the floor the whole time. --- */
  OBST_CYC_MIN: 1.30,     // s per full cycle, fastest
  OBST_CYC_MAX: 2.40,     // s per full cycle, slowest
  OBST_RISE_SOLID: 0.34,  // fraction risen before a riser can hit you
  OBST_DROP_H: 150,       // how high a dropper sits when it is out of the way
  OBST_DROP_SOLID: 46,    // bottom edge below this and it can hit you
  OBST_MARK_A: 0.28,      // opacity of the floor telegraph at rest
  OBST_MARK_B: 0.85,      // opacity of the floor telegraph when about to fire

  /* --- the save. One free hit, collected, off-path, expiring, never stacked.
     Timings are in seconds and converted to z with the current speed, so it
     stays a rare event as the descent accelerates. Collisions only, never
     falls: it sits toward the edge, so the risk of fetching it is exactly the
     death it will not cover. --- */
  SAVE_ON: true,
  SAVE_T_GAP: 6.0,        // s after one resolves before the next appears
  SAVE_T_LANE: 1.1,       // s of clear run-up reserved ahead of it. Also "how
                          //   long it survives": it is gone once passed.
  SAVE_T_MERGE: 0.3,      // s of clear track past it
  SAVE_LANE_PAD: 16,
  SAVE_T_FIRST: 1.2,
  SAVE_OFFPATH: 118,      // lateral distance from the safe line. The cost.
  SAVE_R: 20,
  SAVE_GRAB_H: 40,        // how high off the floor you can still grab one
  SAVE_SPIN: 3.2,
  SAVE_FLASH: 0.35,
  SAVE_BURST: 0.45,
  SAVE_FREEZE: 0.14,
  SAVE_IFRAMES: 0.9,

  /* --- naming the pickup. The mechanic was fully built and completely
     unexplained: the word appeared nowhere a player could see it, and the
     rescue was silent, so nobody learnt why they lived. Three moments, one
     word, no new mechanics. --- */
  TEACH_ON: true,
  TEACH_WORD: 'SHIELD',           // the same word in all three places
  TEACH_HIT_MSG: 'SHIELD TOOK THE HIT',
                                  // spends the causality out loud. "SAVED"
                                  //   names the thing without saying a crash
                                  //   was just paid for.
  TEACH_RING_HOLDS: 2,            // holds for which the word sits by the ring
  TEACH_LABEL_SIZE: 13,           // px at scale 1, the label by the pickup
  TEACH_LABEL_RISE: 2.6,          // label height above the pickup, in its radii
  TEACH_LABEL_FAR: 3000,          // z at which the label starts fading in
  TEACH_LABEL_NEAR: 900,          // z by which it is fully lit
  TEACH_LABEL_GONE: 150,          // z by which it has faded out again
  TEACH_RING_SIZE: 11,            // px at scale 1, the word beside the ring
  TEACH_HIT_T: 0.55,              // s the impact callout lives. Well under one.
  TEACH_HIT_SIZE: 15,             // px at scale 1
  TEACH_HIT_RISE: 300,            // world units above the block it fires on, so
                                  //   it can never sit over the ball or the
                                  //   deck the player is about to land on
  TEACH_HIT_DRIFT: 150,           // further world units it rises as it fades

  /* --- the opening. For GRACE_T seconds a death becomes a recovery: the
     sparks, the shake and the freeze all happen, only the ending does not.
     The player has to feel they nearly died, because that is what teaches the
     mechanic. Nothing here is random, and nothing here draws from run.rnd:
     the track a player gets must not depend on how they played it. --- */
  GRACE_T: 20,            // s of run time in which death is converted
  GRACE_FREEZE: 0.30,     // s. Between SAVE_FREEZE and DEATH_FREEZE: a real
                          //   pause, shorter than the one that ends a run.
  GRACE_SHAKE_MUL: 0.75,  // of the shake the same death would have thrown
  GRACE_IFRAMES: 0.80,    // s of invulnerability, so the block that got you
                          //   cannot get you again on the very next step
  GRACE_FLASH: 0.40,      // s the offending block stays lit
  GRACE_INSET: 0.45,      // on a fall, how far from the centre line the player
                          //   is put back, as a fraction of corridor half width.
                          //   Landing them on the edge they just left means
                          //   leaving it again two frames later.
  GRACE_GAP_CLEAR: 1.15,  // safety factor on the bounce out of a hole
  GRACE_HANDOVER_T: 0.15, // s. The window will not close while the player would
                          //   be off the track this soon afterwards. Closing on
                          //   a bare clock drops a wall-holder mid-lunge and
                          //   kills them a few frames later, which is worse
                          //   than never having had the window.
  GRACE_TAIL_MAX: 1.5,    // s. Hard bound on that wait, so a player who is
                          //   never settled cannot hold the window open.

  /* --- death legibility. Three kinds, three visuals, no words. --- */
  DEATH_FREEZE: 0.45,
  SHAKE_HIT: 14,          // collisions shake
  SHAKE_FALL: 0,          // falls do not. That difference is half the tell.
  FALL_G: 2600,

  /* --- camera and projection --- */
  CAM_BACK: 178,
  CAM_BACK_RUSH: 0.22,    // how much further back the camera sits at top speed
  CAM_H: 209,             // Raised to see further over crests. CAM_KEEP stops it
                          //   pushing the ball off the bottom of the screen.
  FOCAL: 340,
  CAM_LAG: 9.0,
  CAM_RISE: 0.55,         // how much the camera follows you upward in the air
  CAM_VSMOOTH: 7.0,       // 1/s damping on the airborne rise only. The
                          //   surface under the camera is banked, and the track
                          //   centre swings sideways fast, so that offset was
                          //   jumping up to 19 world units in a single frame and
                          //   throwing the ball 17px up the screen. The floor is
                          //   flat now; this was the bumpiness.
  HORIZON: 0.34,
  /* The splash now matches the share card: mixed case, tight tracking, cream,
     rather than the wide-tracked capitals it used to be. Somebody arriving from
     a shared link should recognise the thing they clicked. */
  TITLE_TRACK: -0.012,   // tracking as a fraction of size. Negative: the card
                         //   sets its wordmark tight, and caps-with-air was the
                         //   main thing making the two look unrelated.
  TITLE_GLOW: 0.16,      // opacity of each bloom repeat behind the wordmark
  TITLE_SCRIM: 0.58,     // how far the arena is knocked back behind the splash
  TITLE_HZ: 0.335,       // where the warm horizon sits, as a fraction of height
  TITLE_BLOOM: 0.92,     // radius of the amber bloom, as a fraction of width
  TITLE_BLOOM_A: 0.50,   // and how hot its centre burns
  SET_ROW_MAX: 52,       // touch target per slider row. Rows were 32px, under
                         //   every published minimum, which is why they were hard
                         //   to catch on a phone.
  SET_KNOB: 11,          // knob radius, likewise
  SET_ARENA_MIN: 0.20,   // least of the screen kept clear for the arena. On a
                         //   short phone carrying ten sliders something has to
                         //   give, and it is this rather than the touch target:
                         //   a control you cannot hit is worse than a small view.
  SET_SCRIM: 0.34,       // how dark it goes under the controls. Low, because the
                         //   whole point is watching the arena change while you
                         //   move things; the labels get their own backing so
                         //   they stay readable without dimming the picture.
  SET_LABEL_BG: 0.58,    // that backing
  SET_FOOT: 54,          // clear space kept below the buttons, px before scaling
  PREVIEW_Z: 1500,       // how far into the preview track the camera sits, so
                         //   there is ground, edges and a block in shot
  DPR_CAP: 2.0,           // Was 1.5, which on a 3x phone screen threw away most
                          //   of the panel and left every edge soft. Your device
                          //   is running 16.7ms of a 16.8ms budget with detail at
                          //   full, so the headroom is there; auto-quality still
                          //   backs the geometry off on anything that struggles.

  /* --- touch. ---
     Relative thumb drag, not tap-left and tap-right. Tapping screen halves is a
     binary input driving a momentum control, and the teardown names it as why
     the official mobile Slope is rated one star by the same people who rate the
     browser build 8.2. A drag gives the analogue value the control model
     actually wants: a small movement steers gently, a large one commits. The
     origin follows your thumb at the extremes so you can never run out of
     travel mid-corner. */
  TAP_BIAS: 0.85,         // deflection the instant you touch down, before you
                          //   have moved at all. Without this the drag needs
                          //   travel before the ball responds, which is what
                          //   made it unplayable: an instant input replaced by
                          //   one with a dead zone the width of a thumb.
  DRAG_FRAC: 0.12,        // further travel to full deflection, as a fraction of
                          //   the smaller screen dimension
  DRAG_MIN_PX: 40,

  /* --- automatic quality. ---
     The city is what makes the descent legible, so it is the last thing to cut,
     but it is also the bulk of the fill cost and the target machine is a slow
     Chromebook. Rather than pick a number blind, watch the frame time and step
     the detail down until it fits, then step back up if it recovers. Physics is
     never touched, so the game plays identically at every level. */
  AUTO_QUALITY: true,
  AUTO_MS_HI: 20.5,       // slower than this and detail steps down
  AUTO_MS_LO: 13.0,       // faster than this and it steps back up
  AUTO_HOLD: 90,          // frames between changes, so it cannot oscillate
  QUAL_MIN: 0.45,
  QUAL_STEP: 0.18,
};

/* Section characters. Every stretch of track is one of these. Each raises one
   demand and lowers another, so two demands are never stacked blind.
     safeMul  how hard the safe line swings
     densMul  obstacle density
     hwMul    track width
     bank     sustained tilt as a fraction of BANK_MAX, sign picked per section
     grade    steepness, as a multiple of GRADE_BASE
     move     chance a block slides sideways
     rise     chance a block rises from the floor or drops from above
     gap      places jumps
     tun      encloses the track
     hard     how much planning it demands, 0..1. Drives the late-run drift.
     w        base selection weight                                              */
const SECTIONS = {
  RUN:     { safeMul:1.00, densMul:1.00, hwMul:1.00, bank:0.34, grade:1.00, move:0.30, rise:0.26, gap:false, tun:false, hard:0.30, w:18  },
  SWEEP:   { safeMul:0.70, densMul:0.60, hwMul:1.00, bank:1.00, grade:0.80, move:0.14, rise:0.12, gap:false, tun:false, hard:0.35, w:16  },
  CHICANE: { safeMul:2.30, densMul:0.55, hwMul:1.15, bank:0.50, grade:0.75, move:0.10, rise:0.10, gap:false, tun:false, hard:0.60, w:14  },
  SLALOM:  { safeMul:0.45, densMul:1.90, hwMul:1.00, bank:0.38, grade:1.00, move:0.46, rise:0.36, gap:false, tun:false, hard:0.85, w:14  },
  PINCH:   { safeMul:0.65, densMul:0.45, hwMul:0.58, bank:0.52, grade:1.30, move:0.08, rise:0.14, gap:false, tun:false, hard:0.80, w: 9  },
  JUMP:    { safeMul:0.60, densMul:0.62, hwMul:1.00, bank:0.40, grade:1.15, move:0.12, rise:0.10, gap:true,  tun:false, hard:0.50, w:30  },
  TUNNEL:  { safeMul:0.55, densMul:0.95, hwMul:0.74, bank:0.44, grade:1.55, move:0.28, rise:0.46, gap:false, tun:true, hard:0.70,  w:12  },
  DROP:    { safeMul:0.40, densMul:0.58, hwMul:1.05, bank:0.56, grade:1.45, move:0.05, rise:0.05, gap:false, tun:false, hard:0.45, w:10  }
};
const SEC_KEYS = Object.keys(SECTIONS);

const D = {};
function lookNow(){
  return K.LOOK_T_MIN + (K.LOOK_T_START - K.LOOK_T_MIN) * Math.exp(-tE() / K.LOOK_TAU);
}
function derive(){
  const sp = run ? speedNow() : K.V_START;
  D.SAFE_SLOPE  = K.SAFE_SLOPE_FRAC * K.LAT_MAX / K.V_MAX;
  D.OFF_SLOPE   = K.OFF_SLOPE_FRAC  * K.LAT_MAX / K.V_MAX;
  /* the view is a fixed number of SECONDS, so it stretches in world units as
     you accelerate instead of the reaction budget shrinking */
  D.VIEW_Z      = (run ? lookNow() : K.LOOK_T_START) * sp;
  D.GEN_AHEAD   = D.VIEW_Z + 700;
  D.SLICE_AHEAD = D.GEN_AHEAD + K.CITY_VIEW + 400;
  D.FOC         = K.FOCAL / (1 + K.FOCAL_RUSH * (sp / K.V_START - 1));
  D.CAM_BACK    = K.CAM_BACK * (1 + K.CAM_BACK_RUSH * (sp / K.V_START - 1));
  D.TUNNEL_H    = K.CAM_H + K.BANK_MAX * K.HW_START + K.TUNNEL_HEAD;
  if (!D.DRAG_PX) D.DRAG_PX = K.DRAG_MIN_PX;
  D.BAND_Z      = K.BAND_Z * Math.sqrt(sp / K.V_START);
  D.SLICES      = Math.max(40, Math.round(K.VIEW_SLICES * qual));
  D.CITY_MAX    = Math.max(8,  Math.round(K.CITY_MAX   * qual));
  D.STEP_TRAVEL = K.V_MAX * K.STEP;
  D.BANK_PUSH   = K.BANK_PUSH_FRAC * K.LAT_ACC / K.BANK_MAX;   // accel per unit tilt
}

/* ==========================================================================
   PALETTE
   Pale track, dark blocks, deep indigo void. Deliberately not the genre's
   usual dark track with bright obstacles, and nothing near Slope's black and
   neon green. Also functional: dark blocks on a bright surface is the highest
   contrast arrangement available, which is what matters at speed.
   ========================================================================== */
/* Two palettes. High contrast is on the Slope Plus wishlist and it costs one
   toggle. Neither relies on hue alone for the signals that matter: a collision
   shakes the screen and a fall does not, the killing block pulses, the pickup
   is a diamond inside a ring. Colour confirms, it is never the only channel. */
/* High contrast, always. It was a toggle; it is now the only palette, because a
   contrast option that ships off by default protects nobody who does not know
   to go looking for it, and nothing here reads worse for being legible. Signals

   defined by glowing edge lines, with two opposing glows against a tinted dark.

   moves. Every colour is solved for a target relative luminance rather than
   given a lightness, because lightness is not brightness: a yellow and a blue at
   the same HSL lightness differ by a factor of four in what the eye receives. So

function mulberry32(a){

    let t = Math.imul(a ^ a >>> 15, 1 | a);

   account, no netcode: the seed IS the shared object. */
/* Days since the epoch, hashed. Everyone on Earth gets the same integer on the
   same UTC day, and because the generator is endless from any seed there is no
   content to run out of: one new track a day, for about eleven million years
   before the 32-bit space wraps. No server, no account, nothing to maintain. */

/* How long the current track has left. The seed is days since the epoch, and the
   epoch is anchored at midnight UTC, so the changeover is whatever is left of
   the current UTC day. Same instant for everyone, which is the promise the line
   above the buttons makes. */

  const ms  = dailyLeftMs();
  const h   = Math.floor(ms / 3600000);
  const m   = Math.floor(ms / 60000) % 60;
  const sec = Math.floor(ms / 1000) % 60;
  /* A clock, so the digits sit where the eye expects them: hours unpadded, then
     minutes and seconds always two wide. Without the padding the whole string
     would jump about a pixel every second as 9 became 10. */
  const pad = n => (n < 10 ? '0' : '') + n;

const OPT = [
  { k:'grade', gen:true,  label:'Steepness',     min:0.35, max:0.80, v:0 },
  /* 0.80 is GRADE_MAX. Above it the clamp bites and the slider would have dead
     travel at the top, which reads as a broken control. */
  { k:'width', gen:true,  label:'Path width',    min:0.72, max:1.55, v:0 },
  { k:'obst', gen:true,   label:'Obstacles',     min:0.45, max:1.90, v:0 },
  { k:'jump', gen:true,   label:'Jumps',         min:0.00, max:2.60, v:0 },
  { k:'tilt', gen:true,   label:'Floor tilt',    min:0.00, max:0.60, v:0 },
  { k:'speed', gen:true,  label:'Speed',         min:0.62, max:1.09, v:0 },
  /* the ceiling is measured, not chosen: past about 3250 u/s absolute, top speed

  OPT_BASE.clrS   = K.BEAT_CLEAR_START; OPT_BASE.clrM = K.BEAT_CLEAR_MIN;
  OPT_BASE.jumpW  = SECTIONS.JUMP.w;
  OPT_BASE.tilt   = K.BANK_PUSH_FRAC;

  optOf('pitch').v  = OPT_BASE.pitch;
  optOf('height').v = OPT_BASE.camH;
  optOf('neon').v   = OPT_BASE.neon;

  K.GRADE_BASE      = optOf('grade').v;

  K.HW_START        = OPT_BASE.hwS * w;
  K.HW_MIN          = OPT_BASE.hwM * w;
  const o           = optOf('obst').v;
  K.BEAT_CLEAR_START= OPT_BASE.clrS / o;
  K.BEAT_CLEAR_MIN  = OPT_BASE.clrM / o;
  SECTIONS.JUMP.w   = OPT_BASE.jumpW * optOf('jump').v;
  K.BANK_PUSH_FRAC  = optOf('tilt').v;
  const sp          = optOf('speed').v;
  K.V_START         = OPT_BASE.vS * sp;
  K.V_MAX           = OPT_BASE.vM * sp;

  K.CAM_H           = optOf('height').v;

     sit safeMarginNow() clear of the edge, and the track centre must be able to
     sit further out than the corridor is wide, or the middle becomes a safe
     place to park. That second term is (corridor tolerance / OFF_BIAS), not the
     corridor itself: getting it wrong made this clamp bind even at defaults, so
     "reset" quietly returned a different game than the one that ships. */
  const need = (K.OBST_CLEAR * K.SAFE_MARGIN_MUL + K.SAFE_MARGIN_PAD +

  const cur = OPT.map(e => e.v);

  for (let i = 0; i < OPT.length; i++) OPT[i].v = cur[i];
  /* Colour is skipped. Picking a different hue cannot make a run easier, and
     counting it meant anyone who had ever touched the theme was reported as

    const tol = (OPT[i].max - OPT[i].min) * 0.005;

function secWeight(k){
  const d = SECTIONS[k];

  let tot = 0;
  for (let i = 0; i < SEC_KEYS.length; i++) tot += secWeight(SEC_KEYS[i]);
  for (let tries = 0; tries < 8; tries++){
    let r = run.rnd() * tot;
    for (let i = 0; i < SEC_KEYS.length; i++){
      r -= secWeight(SEC_KEYS[i]);
      if (r <= 0){ if (SEC_KEYS[i] !== prev) return SEC_KEYS[i]; break; }
    }

function ensureSections(zMax){
  /* Runs one whole section past what was asked for. secAt() blends into the
     NEXT section, so if the next one does not exist yet the blend is skipped
     and the same z answers differently later. Anything placed during that
     window is placed against a value that then changes underneath it. */
  const target = zMax + K.SEC_T_MAX * speedNow();
  while (gen.secEnd < target){
    const v    = speedNow();
    const prev = gen.sections.length ? gen.sections[gen.sections.length-1].type : null;
    const type = pickSection(prev);
    const len  = (K.SEC_T_MIN + run.rnd() * (K.SEC_T_MAX - K.SEC_T_MIN)) * v;
    const sec  = { type:type, z0:gen.secEnd, z1:gen.secEnd + len,
                   sign: run.rnd() < 0.5 ? -1 : 1, blend: K.SEC_BLEND * v };
    gen.sections.push(sec);
    if (SECTIONS[type].gap) planGap(sec, v);
    if (SECTIONS[type].tun) planTunnel(sec);
    gen.secEnd = sec.z1;
  }

function secAt(z){

  let a = null, ai = -1;
  for (let i = list.length - 1; i >= 0; i--){
    if (z >= list[i].z0 && z < list[i].z1){ a = list[i]; ai = i; break; }
  }
  if (!a && list.length){ ai = list.length - 1; a = list[ai]; }
  if (!a){
    SEC_TMP.type='RUN'; SEC_TMP.safeMul=1; SEC_TMP.densMul=1; SEC_TMP.hwMul=1;
    SEC_TMP.bank=0; SEC_TMP.grade=1; SEC_TMP.move=0.25; SEC_TMP.rise=0.2; return SEC_TMP;
  }
  const da = SECTIONS[a.type];
  let safeMul = da.safeMul, densMul = da.densMul, hwMul = da.hwMul;
  let bank = da.bank * a.sign, move = da.move, grade = da.grade, rise = da.rise;

  const nxt = list[ai+1];

    const t  = clamp((z - (a.z1 - a.blend)) / a.blend, 0, 1) * 0.5;
    const dn = SECTIONS[nxt.type];
    safeMul += (dn.safeMul - safeMul) * t;
    densMul += (dn.densMul - densMul) * t;
    hwMul   += (dn.hwMul   - hwMul)   * t;

  SEC_TMP.hwMul=hwMul; SEC_TMP.bank=bank; SEC_TMP.move=move;
  SEC_TMP.grade=grade; SEC_TMP.rise=rise;

/* ==========================================================================

   A hole in the floor. Air time is fixed by the hole's own design, so it is
   always clearable and the launch is never the gamble. What you are buying is

   move underneath you, so the landing has to be aimed before you leave.
   ========================================================================== */
/* Holes are sized for FLAT ground on purpose. On a descent the floor falls away
   underneath you and the arc lasts longer, so a flat-sized hole is always
   crossed with room to spare and the steeper the section the more spare there
   is. Sizing from the real grade instead would mean sampling the ground at the
   lip, which forces the hole to be planned late, and a long section only comes
   fully into range once the player is already well inside it. Holes were being
   planned behind the launch point. */
function planGap(sec, v){
  const pi    = Math.floor(run.rnd() * K.GAP_PATTERNS.length);
  const mults = K.GAP_PATTERNS[pi];
  const big   = pi === K.GAP_BIG_AT;
  const base  = big ? K.GAP_T_MAX * (0.86 + run.rnd() * 0.14)
                    : K.GAP_T_MIN + run.rnd() * (K.GAP_T_MAX - K.GAP_T_MIN);
  let z = sec.z0 + (sec.z1 - sec.z0) * (0.18 + run.rnd() * 0.16);

  for (let i = 0; i < mults.length; i++){
    /* Never below GAP_T_MIN. The apex of an arc is GRAV*t^2/8, so shaving the
       minimum produced hops a few units tall that any bump swallowed. */
    const tAir = clamp(base * mults[i], K.GAP_T_MIN, K.GAP_T_MAX);
    const len  = Math.min(v * tAir * (1 - K.GAP_MARGIN),
                          D.VIEW_Z * K.GAP_MAX_VIEW);
    if (z + len > sec.z1 - 160) break;
    gaps.push({ z0:z, z1:z + len,
                shift: (run.rnd() < 0.5 ? -1 : 1) * airReach(tAir) * K.JUMP_SHIFT
                       * (0.55 + run.rnd() * 0.45) });
    /* Sized at V_MAX, not at the speed this was planned at. You always arrive
       faster than you were generated, and the descent stretches the arc with
       speed, so a strip measured against the planning speed comes up short at
       the top end and you touch down inside the next hole. */
    z += len + K.GAP_SPACE_T * K.V_MAX;
  }
}

function planTunnel(sec){
  tunnels.push({ z0: sec.z0 + 40, z1: sec.z1 - 40 });
}

/* The city. Bases sit at the track's own elevation where each tower stands, so
   a tower ahead is always below you by grade times distance. Falling toward it
   makes it climb the screen, which is the descent made visible. */
function genTowers(zMax){
  if (!K.CITY_ON) return;
  while (gen.nextTowerZ < zMax){
    const z  = gen.nextTowerZ;
    const tr = sampleTrack(z);
    for (let side = -1; side <= 1; side += 2){
      if (run.rnd() > K.CITY_CHANCE) continue;
      const off = tr.hw + K.CITY_NEAR + run.rnd() * run.rnd() * K.CITY_SPREAD;
      const w   = K.CITY_W_MIN + run.rnd() * (K.CITY_W_MAX - K.CITY_W_MIN);
      towers.push({
        z: z + (run.rnd() - 0.5) * K.CITY_SPACING,
        x: tr.cx + side * off,
        w: w, d: w * (0.7 + run.rnd() * 0.8),
        base: tr.y - run.rnd() * K.CITY_SINK,
        h: K.CITY_H_MIN + run.rnd() * (K.CITY_H_MAX - K.CITY_H_MIN),
        tone: run.rnd()
      });
    }
    if (K.CRAFT_ON && run.rnd() < K.CRAFT_CHANCE){
      craft.push({ z: z + (run.rnd()-0.5) * K.CITY_SPACING,
                   /* PLUS. Towers do base + h to go up, and I subtracted here,
                      so every craft was flying well below the deck. */
                   x0: tr.cx, y: tr.y + K.CRAFT_HI + run.rnd() * K.CRAFT_HI_VAR,
                   dir: run.rnd() < 0.5 ? -1 : 1,
                   sp: K.CRAFT_V * (0.55 + run.rnd() * 0.9),
                   ph: run.rnd() * 10000,
                   sz: 0.7 + run.rnd() * 0.8 });
    }
    gen.nextTowerZ += K.CITY_SPACING * (0.55 + run.rnd() * 0.9);
  }
  if (towers.length > 400){
    const cut = P.z - 600;
    towers = towers.filter(t => t.z > cut);
  }
}

function tunnelAt(z){
  for (let i = 0; i < tunnels.length; i++){
    const t = tunnels[i];
    if (z >= t.z0 && z <= t.z1) return t;
  }
  return null;
}

function gapAt(z){
  for (let i = 0; i < gaps.length; i++){
    const g = gaps[i];
    if (z >= g.z0 && z <= g.z1) return g;
  }
  return null;
}

/* ==========================================================================
   TRACK GENERATION

   Order is load-bearing. The safe path s(z) is generated first with its slope
   bounded so it is always followable at maximum speed. The track centre is an
   offset from it. Tilt is smoothed on top. Blocks are then placed in what is
   left, never inside the corridor around the safe line.

   The guarantee is that a passable path always exists. It is NOT that the path
   is easy to stand on: the tilt is what turns holding it into work.
   ========================================================================== */
function ensureSlices(zMax){
  ensureSections(zMax + K.SLICE_DZ * 4);
  const need = Math.ceil(zMax / K.SLICE_DZ) + 2;
  while (gen.idx0 + gen.slices.length < need){
    const gi  = gen.idx0 + gen.slices.length;
    const z   = gi * K.SLICE_DZ;
    const sec = secAt(z);

    if (z >= gen.sNext){
      gen.sNext = z + K.SAFE_TURN * (0.6 + run.rnd() * 0.8);
      const pull = -gen.sPos / K.SAFE_ROAM;
      gen.sDir = clamp(run.rnd()*2 - 1 + pull*1.1, -1, 1);
    }
    gen.sPos += gen.sDir * D.SAFE_SLOPE * sec.safeMul * K.SLICE_DZ;

    const hw = hwNow() * sec.hwMul;

    const lim = Math.max(10, hw - safeMarginNow());
    if (z >= gen.offNext){
      gen.offNext = z + K.OFF_TURN * (0.6 + run.rnd() * 0.8);
      if (run.rnd() < K.OFF_FLIP) gen.offSide = -gen.offSide || 1;
      gen.offGoal = gen.offSide * lim * (K.OFF_BIAS + run.rnd() * (1 - K.OFF_BIAS));
    }
    const stepMax = D.OFF_SLOPE * K.SLICE_DZ;
    gen.offPos += clamp(gen.offGoal - gen.offPos, -stepMax, stepMax);
    gen.offPos = clamp(gen.offPos, -lim, lim);

    /* A hole steps the whole track sideways, so the landing is somewhere else.
       Ramped across the hole rather than stepped at its midpoint: there is no
       ground in between so it looks identical, but a step halfway means you only
       learn where you are landing halfway through the flight. Ramped, the far
       lip is at its final offset from the moment it comes into view, and the
       line you are chasing moves smoothly under you the whole way across. */
    for (let gi2 = 0; gi2 < gaps.length; gi2++){
      const g = gaps[gi2];
      if (z > g.z0 && z <= g.z1) gen.sPos += g.shift * (K.SLICE_DZ / (g.z1 - g.z0));
    }

    const ambient = K.BANK_BASE_AMP * K.BANK_MAX * Math.sin(z * 2*Math.PI / K.BANK_WAVE);
    const target  = clamp(ambient + sec.bank * K.BANK_MAX, -K.BANK_MAX, K.BANK_MAX);
    gen.bank += (target - gen.bank) * K.BANK_SMOOTH;

    /* the descent. Elevation only ever falls, and the rate is what the eye
       reads as steepness. */
    const gWave  = 1 + K.GRADE_WAVE_AMP * Math.sin(z * 2*Math.PI / K.GRADE_WAVE);
    const gTarget = clamp(K.GRADE_BASE * sec.grade * gWave, 0.10, K.GRADE_MAX);
    /* Steepness is held constant across a hole and its landing strip. The launch
       cancels the grade AT THE LIP, so if the ground steepens or eases while you
       are in the air the arc no longer matches the hole and you land in it. A
       jump happens over uniform ground, which is fair and also reads better. */
    let holdG = false;
    for (let gi3 = 0; gi3 < gaps.length; gi3++){
      const g = gaps[gi3];
      if (z > g.z0 - K.GRADE_HOLD_PAD && z < g.z1 + K.GRADE_HOLD_PAD){ holdG = true; break; }
    }
    if (!holdG) gen.grade += (gTarget - gen.grade) * K.GRADE_SMOOTH;
    gen.elev  -= gen.grade * K.SLICE_DZ;

    gen.slices.push({ s:gen.sPos, cx:gen.sPos + gen.offPos, hw:hw,
                      y:gen.elev + pitch(z), ey:gen.elev,
                      bank:gen.bank, grade:gen.grade });
  }
}

const TR  = { cx:0, hw:0, s:0, y:0, ey:0, bank:0, grade:0 };
/* A second buffer. sampleTrack hands back a shared object for speed, which is
   fine until two samples are needed at once: the camera held one reference for
   its own position and one for the ball's, they were the same object, and the
   difference between them evaluated to zero every frame. Pass a destination to
   sample two places safely. */
const TR2 = { cx:0, hw:0, s:0, y:0, ey:0, bank:0, grade:0 };
function sampleTrack(z, out){
  const gi = z / K.SLICE_DZ;
  let i = Math.floor(gi) - gen.idx0;
  const last = gen.slices.length - 2;
  if (i < 0) i = 0;
  if (i > last) i = last;
  const T = out || TR;
  if (i < 0){ T.cx=0; T.hw=K.HW_START; T.s=0; T.y=pitch(z); T.ey=0; T.bank=0; T.grade=K.GRADE_BASE; return T; }
  const f = clamp(gi - Math.floor(gi), 0, 1);
  const a = gen.slices[i], b = gen.slices[i+1];
  T.cx    = a.cx + (b.cx - a.cx) * f;
  T.hw    = a.hw + (b.hw - a.hw) * f;
  T.s     = a.s  + (b.s  - a.s ) * f;
  T.bank  = a.bank  + (b.bank  - a.bank ) * f;
  T.grade = a.grade + (b.grade - a.grade) * f;
  T.y     = a.y + (b.y - a.y) * f;
  T.ey    = a.ey + (b.ey - a.ey) * f;
  return T;
}

/* The smooth descending plane, with neither the tilt nor the bumps on it.
   Flights are measured against THIS. Both of the others move by tens of units
   over the course of a flight, which is more than the whole arc of a short hop,
   and they were swallowing it: the ball would register a landing halfway across
   a hole it had comfortably cleared. */
function trackY(z){ return sampleTrack(z).ey; }

/* floor height at a lateral position, including tilt */
function surfaceY(z, x){
  const t = sampleTrack(z);
  return t.y + t.bank * (t.cx - x);
}

function cullSlices(){
  const keepFrom = Math.floor((P.z - D.CAM_BACK - 220) / K.SLICE_DZ);
  const drop = keepFrom - gen.idx0;
  if (drop > 32){ gen.slices.splice(0, drop); gen.idx0 += drop; }
  while (gaps.length && gaps[0].z1 < P.z - 400) gaps.shift();
  while (tunnels.length && tunnels[0].z1 < P.z - 400) tunnels.shift();
  if (towers.length > 400){ const cut = P.z - 600; towers = towers.filter(t => t.z > cut); }
  if (craft.length > 120){ const cut = P.z - 600; craft = craft.filter(t => t.z > cut); }
  /* by position, never by count: dropping a section that is still being asked
     about makes secAt() fall back to the wrong one */
  let n = 0;
  while (n < gen.sections.length - 2 && gen.sections[n].z1 < P.z - 600) n++;
  if (n > 0) gen.sections.splice(0, n);
}

/* ==========================================================================
   BLOCK PLACEMENT
   ========================================================================== */
function cutBand(list, a, b){
  const out = [];
  for (let i = 0; i < list.length; i++){
    const x0 = list[i][0], x1 = list[i][1];
    if (b <= x0 || a >= x1){ out.push([x0,x1]); continue; }
    if (a > x0) out.push([x0, a]);
    if (b < x1) out.push([b, x1]);
  }
  return out;
}

function laneOff(z){
  const L = gen.lane;
  if (!L || z < L.z0 || z > L.z1) return null;
  if (z <= L.zp) return L.off * (z - L.z0) / (L.zp - L.z0);
  return L.off * (1 - (z - L.zp) / (L.z1 - L.zp));
}

/* nothing stands in a hole, and nothing waits immediately past a landing */
function rowBlocked(z){
  for (let i = 0; i < gaps.length; i++){
    const g = gaps[i];
    if (z > g.z0 - K.OBST_D && z < g.z1 + K.OBST_LAND_CLEAR * speedNow()) return true;
  }
  return false;
}

function placeRow(z){
  if (rowBlocked(z)) return;
  const tr  = sampleTrack(z);
  const sec = secAt(z);

  /* The corridor widens where the section demands more steering, because a
     line that keeps changing direction is harder to hold. This keys off the
     section's own safeMul rather than the instantaneous slope: the slope at any
     one moment is usually small even inside a chicane, so keying off it meant
     the widening almost never fired where it was needed. Never narrows. */
  const clear = clearNow() * (1 + K.OBST_CLEAR_GAIN * Math.max(0, sec.safeMul - 1));

  let free = [[tr.cx - tr.hw + K.P_HW, tr.cx + tr.hw - K.P_HW]];
  free = cutBand(free, tr.s - clear, tr.s + clear);

  const lo = laneOff(z);
  if (lo !== null){
    const w = K.P_HW + K.SAVE_LANE_PAD;
    free = cutBand(free, tr.s + lo - w, tr.s + lo + w);
  }

  const regions = [];
  for (let i = 0; i < free.length; i++)
    if (free[i][1] - free[i][0] > K.OBST_HW_MIN * 2) regions.push(free[i]);

  let n = 1 + Math.floor(run.rnd() * (K.OBST_MAX_ROW + K.LATE_ROW_ADD * lateN()) * sec.densMul);
  if (run.rnd() > sec.densMul && n > 1) n--;

  for (let i = 0; i < n && regions.length; i++){
    const ri   = Math.floor(run.rnd() * regions.length);
    const r    = regions[ri];
    const span = r[1] - r[0];
    const hw   = Math.min(K.OBST_HW_MIN + run.rnd()*(K.OBST_HW_MAX - K.OBST_HW_MIN), span*0.5);
    const rx   = r[0] + hw + run.rnd() * (span - 2*hw);
    const aim  = clamp(tr.cx, r[0] + hw, r[1] - hw);
    const x    = rx + (aim - rx) * K.OBST_MID_BIAS;

    /* kind 0 static, 1 slides, 2 rises from the floor, 3 drops from above.
       A sliding block is bounded by the region it was placed in, so it can never
       wander into the corridor or into the pickup run-up. */
    let kind = 0, mv = 0, rate = 0, ph = 0;
    const roll = run.rnd();          /* one roll, so the table means what it says */
    if (roll < sec.rise){
      kind = run.rnd() < 0.5 ? 2 : 3;
      rate = 1 / (K.OBST_CYC_MIN + run.rnd() * (K.OBST_CYC_MAX - K.OBST_CYC_MIN));
      ph   = run.rnd();
    } else if (roll < sec.rise + sec.move && span - 2*hw > K.OBST_SLIDE_ROOM){
      kind = 1;
      mv   = (run.rnd() < 0.5 ? -1 : 1) * K.OBST_MOVE_V;
    }

    obstacles.push({ z:z, x:x, hw:hw, dead:false, scored:false, kind:kind,
                     mv:mv, rate:rate, ph:ph, lo:r[0]+hw, hi:r[1]-hw });

    const leftSpan = (x - hw) - r[0], rightSpan = r[1] - (x + hw);
    if (leftSpan >= rightSpan && leftSpan > K.OBST_HW_MIN*2) regions[ri] = [r[0], x - hw];
    else if (rightSpan > K.OBST_HW_MIN*2)                    regions[ri] = [x + hw, r[1]];
    else regions.splice(ri, 1);
  }
}

/* How far through its cycle a rising or dropping block is. 0 is fully out of
   the way, 1 is fully in it. Driven by run.t, so whether one is in your path
   depends on when you get there. */
function riseFrac(o){
  if (!o.rate) return 1;
  const c = (run.t * o.rate + o.ph) % 1;
  return 0.5 - 0.5 * Math.cos(c * Math.PI * 2);
}
/* vertical extent of a block above its patch of floor, as [bottom, top] */
function obstSpan(o, out){
  const f = riseFrac(o);
  if (o.kind === 2){ out[0] = 0; out[1] = K.OBST_H * f; }
  else if (o.kind === 3){ const b = K.OBST_DROP_H * (1 - f); out[0] = b; out[1] = b + K.OBST_H; }
  else { out[0] = 0; out[1] = K.OBST_H; }
  return out;
}
const SPAN = [0,0];

/* Swept overlap for one fixed step, solved analytically rather than tested at
   the tick position. Slope tests only where the ball IS at each tick, so once
   per-tick travel exceeds a collider's depth it can be on one side at tick n and
   past it at tick n+1 with nothing in between, which is how it clips ramps and
   tunnel walls. This removes that as a class rather than keeping a speed margin
   large enough to hide it: it is exact for linear motion inside a step, so the
   speed curve is no longer bounded by how deep a block happens to be. */
function sweptBox(cz, halfZ, cx, halfX, z0, z1, x0, x1){
  const bz0 = cz - halfZ, bz1 = cz + halfZ;
  const dz = z1 - z0;
  let t0 = 0, t1 = 1;
  if (Math.abs(dz) > 1e-9){
    t0 = Math.max(0, (bz0 - z0) / dz);
    t1 = Math.min(1, (bz1 - z0) / dz);
  } else if (z0 < bz0 || z0 > bz1) return false;
  if (t0 > t1) return false;
  const xa = x0 + (x1 - x0) * t0, xb = x0 + (x1 - x0) * t1;
  return Math.max(xa, xb) > cx - halfX && Math.min(xa, xb) < cx + halfX;
}
function obstBlocks(o, playerH){
  obstSpan(o, SPAN);
  if (o.kind === 2) return SPAN[1] > K.OBST_H * K.OBST_RISE_SOLID && playerH < SPAN[1] * K.AIR_OBST_H;
  if (o.kind === 3) return SPAN[0] < K.OBST_DROP_SOLID && playerH < SPAN[1];
  return playerH < K.OBST_H * K.AIR_OBST_H;
}

/* ==========================================================================
   THE SAVE
   ========================================================================== */
function nextSaveZ(){
  const v = speedNow();
  return Math.max(P.z + K.SAVE_T_GAP * v, gen.nextRowZ + K.SAVE_T_LANE * v + 80);
}

function decideSave(z, v){
  if (!K.SAVE_ON || P.save || P.z < P.rearmZ){ gen.saveDueZ = z + K.SAVE_T_GAP * v; return; }
  /* it can be scheduled past the frontier, and sampleTrack clamps rather than
     extends, so make sure the ground it is being placed on actually exists */
  ensureSlices(z + K.SAVE_T_MERGE * v + K.SLICE_DZ * 4);
  /* never in a hole, and never where the run-up would span one */
  if (gapAt(z) || gapAt(z - K.SAVE_T_LANE * v * 0.5)){
    gen.saveDueZ = z + K.SAVE_T_GAP * v; return;
  }
  const tr = sampleTrack(z);
  const roomL = tr.s - (tr.cx - tr.hw), roomR = (tr.cx + tr.hw) - tr.s;
  const inset = K.SAVE_R + 10;

  let side = run.rnd() < 0.5 ? -1 : 1;
  let room = side < 0 ? roomL : roomR;
  if (room - inset < K.SAVE_OFFPATH * 0.6){ side = -side; room = side < 0 ? roomL : roomR; }

  const off = Math.min(K.SAVE_OFFPATH, room - inset);
  if (off < 24){ gen.saveDueZ = z + K.SAVE_T_GAP * v; return; }

  gen.lane = { z0:z - K.SAVE_T_LANE*v, zp:z, z1:z + K.SAVE_T_MERGE*v, off:side*off };
  save.live = true; save.z = z; save.x = tr.s + side*off; save.spin = 0;
  gen.saveDueZ = Infinity;
}

function genWorld(zMax){
  const v = speedNow();
  genTowers(zMax + K.CITY_VIEW);
  while (gen.nextRowZ < zMax){
    if (gen.saveDueZ !== Infinity && gen.nextRowZ >= gen.saveDueZ - K.SAVE_T_LANE * v)
      decideSave(gen.saveDueZ, v);
    placeRow(gen.nextRowZ);
    if (gen.beatLeft > 1){                       // still inside a challenge
      gen.beatLeft--;
      gen.nextRowZ += K.BEAT_ROW_T * speedNow();
    } else {                                     // challenge over, clear the track
      gen.beatLeft = beatRows();
      gen.nextRowZ += beatClearZ();
    }
  }
  if (obstacles.length > 90){
    const cut = P.z - 420;
    obstacles = obstacles.filter(o => o.z > cut);
  }
}

function consumeSave(o){
  P.save     = false;
  P.iframes  = K.SAVE_IFRAMES;
  P.burst    = K.SAVE_BURST;
  o.dead     = true;
  run.freeze = K.SAVE_FREEZE;
  run.shake  = K.SHAKE_HIT * 0.55;
  run.flashO = o; run.flashT = 0.4;
  /* the moment the mechanic teaches itself, and it used to be silent */
  run.teachT = K.TEACH_HIT_T;
  run.teachX = o.x; run.teachZ = o.z;
  P.rearmZ   = P.z + K.SAVE_T_GAP * speedNow();
  /* surfaceY, not pitch. pitch() is the bump function and PITCH_AMP has been 0
     since the track was flattened, so it returns zero: this spawned the debris at
     world height 0 while the deck at that depth is thousands of units below.
     The death burst has been firing off screen ever since. */
  const hitY = surfaceY(o.z, o.x);
  spark(o.x + clamp(P.x - o.x, -o.hw, o.hw), hitY + K.OBST_H * 0.5, o.z,
        K.SPARK_HIT, K.SPARK_GRAZE_SPREAD);
  for (let i = 0; i < 12; i++){
    const a = run.rnd() * Math.PI * 2;
    shards.push({ x:o.x + (run.rnd()*2-1)*o.hw, y:hitY + run.rnd()*K.OBST_H, z:o.z,
                  vx:Math.cos(a)*(120 + run.rnd()*260), vy:90 + run.rnd()*320,
                  vz:-(60 + run.rnd()*180), life:0.55 });
  }
}

/* ==========================================================================
   DEATH
   Three kinds, three grammars, no words.
     hit   the block that got you lights up, and the screen shakes
     fall  the edge you crossed lights up, and it does not shake
     gap   the hole you came up short in lights up, and it does not shake
   Shake means you hit something. No shake means you fell, and the highlight
   says which way.
   ========================================================================== */
/* True for the opening of every run, for every player, identically. Deliberately
   not adaptive: the on-ramp cannot depend on skill or on how many runs this
   browser has had, or two players' scores stop being comparable. run.t is the
   simulation clock, so this is the same window at 10fps and at 144fps. */
function graceActive(){ return !!run && !run.over && !run.graceDone; }

/* Would the player still be on the track a beat from now? Not airborne, not
   over a hole, and not already committed to an edge at the speed they are
   travelling sideways. */
function graceSafe(){
  if (!P || P.air) return false;
  if (gapAt(P.z)) return false;
  const tr = sampleTrack(P.z);
  const ahead = Math.abs((P.x + P.vx * K.GRACE_HANDOVER_T) - tr.cx);
  return ahead <= tr.hw - K.P_HW;
}

/* A death, minus the ending. The hard part is not suppressing the state change,
   it is the handover: if the window simply expired while the player was mid-fall
   or off the deck they would die on the first frame after it, which is worse
   than no window at all. So a recovery has to leave them somewhere they could
   actually have been. */
function recover(kind, o, side, g){
  run.graceN = (run.graceN || 0) + 1;
  run.freeze = K.GRACE_FREEZE;
  run.shake  = (kind === 'hit' ? K.SHAKE_HIT : K.SHAKE_FALL) * K.GRACE_SHAKE_MUL;
  /* the one cost that cannot shift the world: the near miss chain */
  run.chain = 0; run.chainT = 0;
  P.iframes = Math.max(P.iframes, K.GRACE_IFRAMES);

  const tr = sampleTrack(P.z);

  /* the same sparks the death would have thrown. spark() runs on Math.random,
     not run.rnd, so none of this moves the seeded stream. */
  if (kind === 'hit' && o){
    o.dead = true;
    spark(o.x + clamp(P.x - o.x, -o.hw, o.hw), surfaceY(o.z, o.x) + K.OBST_H * 0.5,
          o.z, K.SPARK_HIT, K.SPARK_GRAZE_SPREAD);
    run.flashO = o; run.flashT = K.GRACE_FLASH;
  }
  if (kind === 'fall'){
    spark(tr.cx + (side || 1) * tr.hw, tr.y, P.z, K.SPARK_FALL, K.SPARK_RAIL_SPREAD);
  }

  /* ---- back inside the corridor ---- */
  const lim = Math.max(tr.hw - K.P_HW, 1);
  if (kind === 'fall'){
    /* far enough in to still be there a moment later at full lock */
    const inset = Math.min(lim, tr.hw * K.GRACE_INSET);
    P.x  = clamp(P.x, tr.cx - inset, tr.cx + inset);
    P.vx = 0;
  } else {
    P.x = clamp(P.x, tr.cx - lim, tr.cx + lim);
  }

  /* ---- back on the deck ---- */
  const hole = (kind === 'gap') ? (g || gapAt(P.z)) : null;
  if (hole){
    /* Bounced out on the arc the lip itself would have given, rather than
       teleported past the hole. Moving z would move where the generator is when
       it next runs, and the track must not depend on how the run went. */
    const v = speedNow();
    const need = Math.max((hole.z1 - P.z) / Math.max(v * (1 - K.GAP_MARGIN), 1),
                          K.GAP_T_MIN) * K.GRACE_GAP_CLEAR;
    P.air = true; P.h = 0;
    P.vy  = K.GRAV * need * 0.5 - tr.grade * v;
    P.elev = trackY(P.z);
    P.liftoff = K.LIFTOFF_STEPS;
    spark(P.x, P.elev, P.z, K.SPARK_LAUNCH, K.SPARK_RAIL_SPREAD);
  } else {
    P.air = false; P.vy = 0; P.h = 0; P.liftoff = 0;
    P.elev = surfaceY(P.z, P.x);
  }
  P.fallV = 0; P.fallY = 0;
  /* render interpolation reads the previous frame's position: without this the
     recovery draws as a smear from wherever they were */
  P.px = P.x; P.pz = P.z; P.ph = P.h;
}

function die(kind, o, side, g){
  /* every death funnels through here, so intercepting at the top covers all
     four call sites and all three kinds at once */
  if (graceActive()){ recover(kind, o, side, g); return; }
  run.overSec = secAt(P.z).type;
  try {
    /* Still counted, though nothing displays it any more: it costs one integer
       and it is the only record of how people actually lose. */
    diag[kind] = (diag[kind] || 0) + 1;
    localStorage.setItem(DIAG_KEY, JSON.stringify(diag));
  } catch(e){}
  run.over = true; run.overKind = kind; run.overObst = o;
  run.overSide = side; run.overGap = g || null;
  run.overX = P.x; run.overZ = P.z;
  run.freeze = K.DEATH_FREEZE;
  run.shake  = kind === 'hit' ? K.SHAKE_HIT : K.SHAKE_FALL;
  /* The debris burst elsewhere is on the SAVE path, where the pickup absorbs a
     hit and the block shatters. An actual death had no impact at all, so this is
     where hitting something needed to throw sparks. */
  if (kind === 'hit' && o){
    spark(o.x + clamp(P.x - o.x, -o.hw, o.hw), surfaceY(o.z, o.x) + K.OBST_H * 0.5,
          o.z, K.SPARK_HIT, K.SPARK_GRAZE_SPREAD);
  }
  /* going over an edge throws sparks off the rail you clipped on the way out */
  if (kind === 'fall'){
    const tf = sampleTrack(P.z);
    spark(tf.cx + (side || 1) * tf.hw, tf.y, P.z, K.SPARK_FALL, K.SPARK_RAIL_SPREAD);
  }
