  P.fallV = kind === 'gap' ? -P.vy : 0;
  state = 'dying';
  saveBest();
}

/* ==========================================================================
   RUN STATE
   ========================================================================== */
function newRun(seed){
  run = { seed:seed, rnd:mulberry32(seed), t:0, score:0, tier:0, tierT:0,
          chain:0, chainT:0, nearT:0, nearX:0, nearZ:0, best:0,
          daily:false, freeze:0, shake:0,
          over:false, overKind:null, overObst:null, overSide:0, overGap:null,
          overX:0, overZ:0, flashO:null, flashT:0, inputLock:0,
          graceN:0, graceDone:false,
          teachT:0, teachX:0, teachZ:0 };
  P = { x:0, z:0, vx:0, h:0, vy:0, elev:0, air:false, squash:0,
        pz:0, px:0, ph:0, liftoff:0,

        fallY:0, fallV:0, save:false, iframes:0, burst:0, rearmZ:0,
        trail:[], trailZ:0 };
  gen = { idx0:0, slices:[], sPos:0, sDir:0, sNext:0, offPos:0, offDir:0, offNext:0,
          bank:0, grade:K.GRADE_BASE, elev:0, offSide:1, offGoal:0,
          sections:[], secEnd:0,
          nextRowZ:K.OBST_FIRST, beatLeft:1, nextTowerZ:0,
          saveDueZ:K.SAVE_T_FIRST * K.V_START, lane:null };
  obstacles = []; gaps = []; tunnels = []; towers = []; craft = []; shards = []; sparks.length = 0;
  save = { live:false, z:0, x:0, spin:0 };
  camX = 0; roll = 0; camRise = 0;
  ensureSlices(D.SLICE_AHEAD);
  genWorld(D.GEN_AHEAD);
}
function start(){
  audioStart();
  audioRunMusic();
  const sd = dailyMode ? dailySeed()
           : (urlSeed !== null ? urlSeed : (Math.random()*2147483647)|0);
  newRun(sd);
  run.daily = dailyMode;
  state = 'play';
  shareMsg = 0;
  if (paused){ paused = false; audioResume(); }
  showChrome(false);
}

/* ==========================================================================
   PHYSICS. Fixed step only.
   ========================================================================== */
function step(dt){
  run.t += dt;

  /* The opening closes at GRACE_T, or at the first moment after it that the
     player is somewhere they could carry on from, whichever is later, and never
     later than GRACE_TAIL_MAX past it. Checked here, at the top of the step, so
     it reads the state the previous step left: right after a recovery that is a
     restored position, which is exactly the handover we want. */
  if (!run.graceDone && run.t >= K.GRACE_T &&
      (graceSafe() || run.t >= K.GRACE_T + K.GRACE_TAIL_MAX)) run.graceDone = true;

  const v = speedNow();
  const zPrev = P.z, xPrev = P.x;
  P.pz = P.z; P.px = P.x; P.ph = P.h;      // for render interpolation
  P.z += v * dt;

  run.score += scoreMul() * chainMul() * K.SCORE_RATE * dt;
  /* scraping an edge throws sparks, at a rate rather than per frame */
  if (!P.air && state === 'play'){
    const te = sampleTrack(P.z);
    const edge = te.hw - Math.abs(P.x - te.cx) - K.P_HW;
    if (edge < K.SPARK_RAIL_D && edge > -K.SPARK_RAIL_IN){
      run.sparkT = (run.sparkT || 0) + dt;
      const per = 1 / K.SPARK_RAIL_HZ;
      while (run.sparkT > per){
        run.sparkT -= per;
        const side = P.x > te.cx ? 1 : -1;
        spark(te.cx + side*te.hw, te.y + te.bank*(te.cx - P.x), P.z, K.SPARK_RAIL, K.SPARK_RAIL_SPREAD);
      }
    } else run.sparkT = 0;
  }
  if (run.chainT > 0){ run.chainT -= dt; if (run.chainT <= 0) run.chain = 0; }
  if (run.nearT > 0) run.nearT -= dt;
  const tier = tierOf(curveV());
  if (tier > run.tier){ run.tier = tier; run.tierT = K.TIER_FLASH; }
  if (run.tierT > 0) run.tierT -= dt;

  ensureSlices(P.z + D.SLICE_AHEAD);
  genWorld(P.z + D.GEN_AHEAD);
  cullSlices();

  const tr = sampleTrack(P.z);

  /* ---- lateral: thrust, tilt, drag ---- */
  const auth = P.air ? K.AIR_CTRL : 1;
  P.vx += inputDir() * K.LAT_ACC * auth * dt;
  if (!P.air) P.vx += tr.bank * D.BANK_PUSH * dt;      // the floor pushes downhill
  P.vx -= P.vx * K.LAT_DRAG * dt;
  P.vx = clamp(P.vx, -K.LAT_MAX, K.LAT_MAX);
  P.x += P.vx * dt;

  /* ---- launch: the lip of a hole throws you ---- */
  if (!P.air){
    for (let i = 0; i < gaps.length; i++){
      const g = gaps[i];
      if (zPrev < g.z0 && P.z >= g.z0){
        /* Sized from the hole and the speed you actually arrive at, rather than
           a figure stored when the hole was generated. You can now arrive
           slower than planned by braking, and a stored impulse would leave the
           hole uncrossable through no fault of the jump. */
        /* Launch TANGENTIALLY plus a ramp kick, not straight up. A ball leaving
           a lip on a downhill already carries the slope's downward velocity, and
           the ground it is flying over drops away at that same rate. Kicking
           straight up ignores both, so the steeper the ground the longer the
           hang time, and on a steep stutter you sail clean over the landing
           strip into the next hole. Subtracting grade*v makes height above the
           ground follow the designed arc exactly, whatever the ground is doing. */
        /* floored, so a hole that is short relative to your arrival speed still
           produces a real hop rather than a flat scoot across it */
        const tNeed = Math.max((g.z1 - g.z0) / Math.max(v * (1 - K.GAP_MARGIN), 1),
                               K.GAP_T_MIN);
        P.air = true; P.h = 0;
        P.vy  = K.GRAV * tNeed * 0.5 - tr.grade * v;
        /* elevation of the LIP, not of where z has already advanced to. Height
           above ground is the difference between two things that both move, and
           on the launch step only one of them has moved yet. */
        P.elev = trackY(g.z0);
        P.liftoff = K.LIFTOFF_STEPS;
        /* a kick off the lip as the wheel leaves it */
        spark(P.x, surfaceY(g.z0, P.x), g.z0, K.SPARK_LAUNCH, K.SPARK_RAIL_SPREAD);
        break;
      }
    }
  }

  /* ---- vertical. Elevation is absolute while airborne: the floor is falling
     away underneath at grade times speed, so height above it cannot be
     integrated on its own. ---- */
  if (P.air){
    P.vy   -= K.GRAV * dt;
    P.elev += P.vy * dt;
    P.h     = P.elev - trackY(P.z);
    if (P.liftoff > 0){ P.liftoff--; if (P.h < 0) P.h = 0; }
    else if (P.h <= 0){
      const g = gapAt(P.z);
      if (g){ die('gap', null, 0, g); return; }        // came up short
      P.h = 0; P.vy = 0; P.air = false; P.liftoff = 0;
      P.squash = K.LAND_SQUASH;
      /* and a heavier burst where it comes down */
      spark(P.x, surfaceY(P.z, P.x), P.z, K.SPARK_LAND, K.SPARK_GRAZE_SPREAD);
      run.shake = Math.max(run.shake, K.LAND_SHAKE);
    }
  } else {
    P.h = 0; P.elev = surfaceY(P.z, P.x);
    const g = gapAt(P.z);
    if (g){ die('gap', null, 0, g); return; }          // walked into a hole
  }
  if (P.squash > 0) P.squash -= dt;

  /* ---- off the side. Only while your wheels are down. ---- */
  if (!P.air && Math.abs(P.x - tr.cx) > tr.hw){
    die('fall', null, (P.x - tr.cx) > 0 ? 1 : -1); return;
  }

  /* ---- sliding blocks ---- */
  for (let i = 0; i < obstacles.length; i++){
    const o = obstacles[i];
    if (o.kind !== 1 || o.dead) continue;
    o.x += o.mv * dt;
    if (o.x < o.lo){ o.x = o.lo; o.mv = -o.mv; }
    else if (o.x > o.hi){ o.x = o.hi; o.mv = -o.mv; }
  }

  /* ---- the pickup ---- */
  if (save.live){
    save.spin += dt * K.SAVE_SPIN;
    if (!P.save && P.h < K.SAVE_GRAB_H &&
        sweptBox(save.z, K.P_HD + K.SAVE_R, save.x, K.P_HW + K.SAVE_R,
                 zPrev, P.z, xPrev, P.x)){
      save.live = false; P.save = true; P.burst = K.SAVE_FLASH;
      teachGot();
      gen.saveDueZ = nextSaveZ();
    } else if (P.z - K.P_HD > save.z + K.SAVE_R){
      save.live = false; gen.saveDueZ = nextSaveZ();
    }
  }

  /* ---- blocks. Per-step travel is at most V_MAX*STEP = 12.5 against a block
     depth of 46, so nothing can be tunnelled through. Clear the top of one and
     you pass over it. ---- */
  if (P.iframes > 0) P.iframes -= dt;
  else {
    for (let i = 0; i < obstacles.length; i++){
      const o = obstacles[i];
      if (o.dead) continue;
      if (sweptBox(o.z, K.OBST_D*0.5 + K.P_HD, o.x, o.hw + K.P_HW,
                   zPrev, P.z, xPrev, P.x) &&
          obstBlocks(o, P.h)){
        /* during the opening the grace recovery takes the hit, so a pickup
           collected in the first seconds is still there when it ends */
        if (P.save && !graceActive()) consumeSave(o); else die('hit', o, 0);
        break;
      }
    }
  }

  /* threaded a block: passed its depth, still alive, and close to its edge */
  if (K.NEAR_ON){
    for (let i = 0; i < obstacles.length; i++){
      const o = obstacles[i];
      if (o.scored || o.dead || o.z > P.z || o.z < zPrev) continue;
      o.scored = true;
      if (!obstBlocks(o, P.h)) continue;
      const gap = Math.abs(P.x - o.x) - o.hw - K.P_HW;
      if (gap >= 0 && gap < K.NEAR_D){
        run.chain++; run.chainT = K.NEAR_HOLD;
        run.nearT = K.NEAR_FLASH; run.nearX = o.x; run.nearZ = o.z;
        obstSpan(o, SPAN);
        spark(o.x + (P.x > o.x ? o.hw : -o.hw),
              sampleTrack(o.z).y + SPAN[1] * K.SPARK_GRAZE_Y,
              o.z, K.SPARK_GRAZE, K.SPARK_GRAZE_SPREAD);
        if (run.chain > run.best) run.best = run.chain;
      }
    }
  }

  if (P.z - P.trailZ > K.TRAIL_DZ){
    P.trailZ = P.z;
    P.trail.push({ x:P.x, z:P.z, h:P.h });
    if (P.trail.length > K.TRAIL_N) P.trail.shift();
  }
}

let flashX = 0, flashY = 0, flashZ = 0, flashLife = 0;
function spark(x, y, z, n, spread){
  if (!K.SPARK_ON) return;
  if (n >= K.SPARK_GRAZE){ flashX = x; flashY = y; flashZ = z; flashLife = K.SPARK_FLASH; }
  for (let i = 0; i < n && sparks.length < K.SPARK_MAX; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = K.SPARK_V0 * (0.35 + Math.random() * 0.9);
    sparks.push({ x:x, y:y, z:z,
      vx: Math.cos(a) * sp * spread,
      vy: Math.abs(Math.sin(a)) * sp * 0.7 + K.SPARK_UP,
      vz: -K.SPARK_BACK * (0.3 + Math.random() * 0.9),
      life: K.SPARK_LIFE * (0.55 + Math.random() * 0.7) });
  }
}
function updateSparks(dt){
  if (flashLife > 0) flashLife -= dt;
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.life -= dt;
    if (s.life <= 0){ sparks.splice(i,1); continue; }
    s.vy -= K.SPARK_G * dt;
    s.x += s.vx*dt; s.y += s.vy*dt; s.z += s.vz*dt;
  }
}
function drawSpeedLines(){
  if (!K.SPD_ON || state !== 'play') return;
  const v = speedNow();
  const top = Math.max(K.V_MAX * K.SPD_TOP, K.SPD_V0 + 1);
  const f = clamp((v - K.SPD_V0) / (top - K.SPD_V0), 0, 1);
  if (f < 0.02) return;
  const m = Math.min(W, H), cx = HALFW, cy = projBase;
  ctx.beginPath();
  for (let i = 0; i < K.SPD_N; i++){
    const a  = (i / K.SPD_N) * Math.PI * 2 + animT * K.SPD_SPIN;
    /* deterministic scatter from the index, so they hold still instead of
       strobing a fresh random set at every frame */
    const j1 = (i * 0.6180339887) % 1, j2 = (i * 0.3819660113) % 1;
    /* sin is positive downward on a canvas, so this is 1 for a line heading
       straight at the deck and 0 for one going sideways or up */
    const down = Math.max(0, Math.sin(a));
    const r0 = m * K.SPD_R0 * (1 + down * K.SPD_CLEAR) * (0.75 + j1 * 0.9);
    /* and the ones aimed hardest at the deck are simply left out */
    if (down > K.SPD_SKIP) continue;
    const ln = m * K.SPD_LEN * f * (0.45 + j2 * 1.1);
    const c = Math.cos(a), sn = Math.sin(a);
    ctx.moveTo(cx + c*r0, cy + sn*r0);
    ctx.lineTo(cx + c*(r0+ln), cy + sn*(r0+ln));
  }
  glowStroke('#ffffff', C.player, K.SPD_W * (0.5 + f), K.SPD_A * f);
}

function drawSparks(){
  /* the bloom goes down first, so the streaks read on top of it */
  if (flashLife > 0){
    const dz = flashZ - camZ;
    if (dz > 18){
      const sc = D.FOC / dz, f = flashLife / K.SPARK_FLASH;
      ctx.globalAlpha = f * 0.75;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(projX(flashX, flashY, sc), projY(flashX, flashY, sc),
              K.SPARK_FLASH_R * sc * (1.4 - f * 0.6), 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  if (!sparks.length) return;
  const tl = K.SPARK_TAIL;
  ctx.beginPath();
  let any = false;
  for (let i = 0; i < sparks.length; i++){
    const s = sparks[i];
    const dz = s.z - camZ;
    if (dz < 18) continue;
    const sc = D.FOC / dz;
    const bx = s.x - s.vx*tl, by = s.y - s.vy*tl, bz = s.z - s.vz*tl;
    const dz2 = bz - camZ;
    if (dz2 < 18) continue;
    ctx.moveTo(projX(s.x,s.y,sc), projY(s.x,s.y,sc));
    ctx.lineTo(projX(bx,by,D.FOC/dz2), projY(bx,by,D.FOC/dz2));
    any = true;
  }
  if (any) glowStroke('#ffffff', C.lip, K.SPARK_W, 1);
}

function updateShards(dt){
  for (let i = shards.length - 1; i >= 0; i--){
    const s = shards[i];
    s.life -= dt;
    if (s.life <= 0){ shards.splice(i,1); continue; }
    s.vy -= 1800 * dt;
    s.x += s.vx*dt; s.y += s.vy*dt; s.z += s.vz*dt;
  }
}

function tick(dt){
  if (run.flashT > 0) run.flashT -= dt;
  if (run.teachT > 0) run.teachT -= dt;
  if (P && P.burst > 0) P.burst -= dt;
  if (run.shake > 0.2) run.shake -= run.shake * 10 * dt; else run.shake = 0;
  updateShards(dt);
  updateSparks(dt);

  if (state === 'dying'){
    run.freeze -= dt;
    if (run.overKind !== 'hit'){
      P.fallV += K.FALL_G * dt;
      P.fallY -= P.fallV * dt;
      P.x     += P.vx * dt;
    }
    if (run.freeze <= 0){ state = 'dead'; run.inputLock = 0.3; showChrome(true); }
    return;
  }
  if (run.freeze > 0){ run.freeze -= dt; return; }
  step(dt);
}

/* The title holds still. It used to creep forward, which meant the picture was
   sliding and bobbing behind the buttons you were trying to read. */
function tickTitle(dt){}

/* ==========================================================================
   INPUT. e.code throughout, so caps lock cannot produce dead keys.
   ========================================================================== */
const keys = { l:false, r:false };
const drag = { id:null, ox:0, val:0 };

function inputDir(){
  let d = 0;
  if (keys.l) d -= 1;
  if (keys.r) d += 1;
  if (d === 0 && drag.id !== null) d = drag.val;   // analogue on touch
  return clamp(d, -1, 1);
}
function dragMove(x){
  let d = (x - drag.ox) / D.DRAG_PX;
  if (d >  1){ drag.ox = x - D.DRAG_PX; d =  1; }   // origin follows at the stops
  if (d < -1){ drag.ox = x + D.DRAG_PX; d = -1; }
  drag.val = d;
}
function anyInput(){
  if (setOpen) return;                       // the panel owns the screen
  if (state === 'title') start();
  else if (state === 'dead' && run.inputLock <= 0) start();
}
/* Rebuild the scene behind the panel from the current settings. Colours and the
   camera take effect on the next frame by themselves, but steepness, width,
   obstacles and the rest are baked into the track when it is generated, so
   without this the only way to see them was to start a run and find out. */
function previewRefresh(){
  const keep = state;
  newRun(dailyMode ? dailySeed() : run.seed);
  state = keep;
  P.z = K.PREVIEW_Z;
  ensureSlices(P.z + D.SLICE_AHEAD);
  genWorld(P.z + D.GEN_AHEAD);
  const tr = sampleTrack(P.z);
  P.x = tr.s;
  /* Render interpolates between the previous tick and this one. Moving the ball
     without moving its previous position left the interpolator swinging between
     z=0 and z=1500 every frame, which is the vibration. */
  P.pz = P.z; P.px = P.x; P.ph = P.h; P.vx = 0; P.vy = 0;
  rZ = P.z; rX = P.x; rH = P.h;
  camX = P.x; camZ = P.z - D.CAM_BACK; camRise = 0;
}
function setFromX(i, x){
  const e = OPT[i];
  const g = setGeom();
  e.v = e.min + (e.max - e.min) * clamp((x - g.barX) / g.barW, 0, 1);
  applyOpts(); saveOpts();
  if (e.gen) previewRefresh();
}
/* one source of truth for the layout, so the hit areas cannot drift from the
   drawing: the old code computed the bar position twice */
function setGeom(){
  const s = Math.min(1, W/420);
  const rows = OPT.length;
  /* the buttons sit above this, and this sits above anything the page or the
     phone puts at the bottom of the window */
  const foot = K.SET_FOOT*s + 34*s;
  const head = 34*s;
  const rowH = Math.max(12, Math.min(K.SET_ROW_MAX*s,
                        (H*(1 - K.SET_ARENA_MIN) - head - foot) / rows));
  const top = Math.max(H*K.SET_ARENA_MIN, H - (head + rowH*rows + foot));
  return { s:s, rowH:rowH, top:top, head:head,
           firstY: top + head + rowH*0.5,
           barX: W*0.40, barW: W*0.46 };
}
/* returns a UI control if the tap landed on one, else null */
/* ==========================================================================
   FULLSCREEN

   Read from the document, never tracked in a boolean of our own: the player can
   leave with Escape, with the Android back gesture or with a system control,
   and a flag would desync and draw the wrong icon.
   ========================================================================== */
function fsAvailable(){
  if (!cv) return false;
  const can = cv.requestFullscreen || cv.webkitRequestFullscreen;
  /* fullscreenEnabled is the honest answer to "would this work here": it is
     false on an iPhone, which has no Fullscreen API, and false in an iframe
     that was not given allow="fullscreen". A control that does nothing is
     worse than no control, so in both cases the button is not drawn and its
     space is not reserved. */
  const allowed = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  return !!(can && allowed);
}
function fsOn(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function fsToggle(){
  if (!fsAvailable()) return;
  try {
    let p = null;
    if (fsOn()){
      p = document.exitFullscreen ? document.exitFullscreen()
        : document.webkitExitFullscreen ? document.webkitExitFullscreen() : null;
    } else {
      p = cv.requestFullscreen ? cv.requestFullscreen()
        : cv.webkitRequestFullscreen ? cv.webkitRequestFullscreen() : null;
    }
    /* rejects when the gesture has expired or permission is refused, and an
       unhandled rejection is a console error */
    if (p && p.catch) p.catch(function(){});
  } catch(e){}
}

function uiHit(x, y){
  for (const k in UI){
    const r = UI[k];
    if (r && x >= r[0] && x <= r[0]+r[2] && y >= r[1] && y <= r[1]+r[3]) return k;
  }
  return null;
}

addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'ArrowLeft'  || c === 'KeyA'){ keys.l = true; e.preventDefault(); }
  else if (c === 'ArrowRight' || c === 'KeyD'){ keys.r = true; e.preventDefault(); }
  else if (c === 'KeyF'){ perf.show = !perf.show; return; }
  else if (c === 'KeyR' && state === 'title'){ dailyMode = false; audioStart(); start(); return; }
  else if (c === 'KeyM'){ audioToggle(); return; }
  else if (c === 'KeyN'){ audioNewTrack(); return; }
  else if ((c === 'KeyP' || c === 'Escape') && state === 'play'){
    paused = !paused;
    if (paused) audioPause(); else audioResume();
    return;
  }
  if (e.repeat) return;
  if (c === 'Tab' || e.metaKey || e.ctrlKey || e.altKey) return;
  anyInput();
}, { passive:false });
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') keys.l = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.r = false;
});
addEventListener('blur', () => { drag.id = null; drag.val = 0; keys.l = keys.r = false; });

/* ==========================================================================
   RENDER
   ========================================================================== */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, K.DPR_CAP);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width  = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  HALFW = W * 0.5; horizonY = H * K.HORIZON;
  D.DRAG_PX = Math.max(K.DRAG_MIN_PX, Math.min(W, H) * K.DRAG_FRAC);
  skyGrad = null; titleBloomKey = '';
}

function drawSky(){
  if (!skyGrad){
    skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0.00, C.skyTop);
    skyGrad.addColorStop(0.24, C.skyMid);
    skyGrad.addColorStop(0.34, C.skyLow);
    skyGrad.addColorStop(0.40, C.skyHaze);
    skyGrad.addColorStop(0.58, C.skyMid);
    skyGrad.addColorStop(1.00, C.skyTop);
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(-40, -40, W + 80, H + 80);
}

/* Roll is applied to world points only, about the horizon, so the sky stays
   put and no overdraw is needed to cover rotated corners. */
/* Depth is recovered from the scale the caller already computed, so every call
   site is untouched: sc is FOCAL/dz by construction. */
function projX(x, y, sc){
  const dz = D.FOC / sc;
  const Y  = y - camY;
  const Zp = Math.max(dz * pitchC - Y * pitchS, 8);
  const sx = D.FOC * (x - camX) / Zp;
  const sy = -D.FOC * (Y * pitchC + dz * pitchS) / Zp;
  return HALFW + sx * rollC - sy * rollS;
}
function projY(x, y, sc){
  const dz = D.FOC / sc;
  const Y  = y - camY;
  const Zp = Math.max(dz * pitchC - Y * pitchS, 8);
  const sx = D.FOC * (x - camX) / Zp;
  const sy = -D.FOC * (Y * pitchC + dz * pitchS) / Zp;
  return projBase + sx * rollS + sy * rollC;
}

function buildPts(){
  pts.length = 0;
  /* Sampled at a fixed number of steps across the visible SECONDS rather than on
     the generation grid. The grid stays at SLICE_DZ for indexing; how far ahead
     we draw is now free to stretch with speed at no extra cost. */
  const spanZ = D.VIEW_Z - K.NEAR_Z;
  for (let i = 0; i < D.SLICES; i++){
    const dz = K.NEAR_Z + spanZ * Math.pow(i / (D.SLICES - 1), K.VIEW_CURVE);
    const z  = camZ + dz;
    const sl = sampleTrack(z);
    const sc = D.FOC / dz;
    const xl = sl.cx - sl.hw,          xr  = sl.cx + sl.hw;
    const xli= xl + K.LIP_W,           xri = xr - K.LIP_W;
    const yl = sl.y + sl.bank * sl.hw,  yr = sl.y - sl.bank * sl.hw;
    const yli= sl.y + sl.bank * (sl.hw - K.LIP_W);
    const yri= sl.y - sl.bank * (sl.hw - K.LIP_W);
    const q = { band: Math.floor(z / D.BAND_Z), z:z, sc:sc, solid: !gapAt(z),
      lx:projX(xl,yl,sc),   ly:projY(xl,yl,sc),
      rx:projX(xr,yr,sc),   ry:projY(xr,yr,sc),
      lix:projX(xli,yli,sc),liy:projY(xli,yli,sc),
      rix:projX(xri,yri,sc),riy:projY(xri,yri,sc) };
    pts.push(q);
  }
}

/* Everything below the horizon gets a darker fill. Without it, the space beside
   the track is the same gradient as the sky above it, and the track reads as
   floating rather than cutting through a landscape. Rotated with the roll. */
/* A ridge sitting exactly at eye level, effectively infinitely far away, that
   never descends. Everything below it is void. This is the reference the descent
   is measured against: the track vanishes a long way below this line, and the
   gap grows as the ground steepens. Without it a constant grade is geometrically
   identical to flat ground and reads as flat hilly terrain, which is what it did. */
function ridgeAt(u){
  return K.RIDGE_AMP * (0.52 * Math.sin(u) +
                        0.31 * Math.sin(u * 2.37 + 1.7) +
                        0.17 * Math.sin(u * 5.11 + 0.4));
}
/* Bloom without shadowBlur or filters: stroke the path wide and faint, then
   narrow and bright. Two calls, no fill-rate cost, and it is the entire reason
   a black deck reads as a lit surface. */
function glowStroke(col, glowCol, w, alpha){
  ctx.strokeStyle = glowCol;
  ctx.globalAlpha = alpha * K.GLOW_A;
  ctx.lineWidth   = w * K.GLOW_W;
  ctx.stroke();
  ctx.strokeStyle = col;
  ctx.globalAlpha = alpha;
  ctx.lineWidth   = w;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawHorizon(){
  const par = camX * K.RIDGE_PARALLAX;
  const N = 30, M = (W + H);
  ctx.fillStyle = C.void;
  ctx.globalAlpha = K.VOID_LINE;
  ctx.beginPath();
  for (let i = 0; i <= N; i++){
    const sx = -M*0.5 + (W + M) * i / N;
    const sy = -(K.RIDGE_BASE + Math.abs(ridgeAt((sx + par) * K.RIDGE_SCALE)));
    const x = HALFW + sx*rollC - sy*rollS;
    const y = hY    + sx*rollS + sy*rollC;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  /* close the shape downward, well past the bottom of the screen */
  const dx = -rollS * M * 3, dy = rollC * M * 3;
  const ex = HALFW + (W*0.5 + M*0.5)*rollC, ey = hY + (W*0.5 + M*0.5)*rollS;
  ctx.lineTo(ex + dx, ey + dy);
  ctx.lineTo(HALFW - (W*0.5 + M*0.5)*rollC + dx, hY - (W*0.5 + M*0.5)*rollS + dy);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  /* a thin bright line on the horizon itself, so the eye has something to
     measure the drop against even where the ridge is low */
  ctx.strokeStyle = C.horizon;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.42;
  ctx.beginPath();
  ctx.moveTo(HALFW - M*rollC, hY - M*rollS);
  ctx.lineTo(HALFW + M*rollC, hY + M*rollS);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawTower(t){
  const zn = t.z - t.d*0.5, zf = t.z + t.d*0.5;
  if (zn - camZ < 24) return;
  const pn = D.FOC / (zn - camZ);
  const l = t.x - t.w*0.5, r = t.x + t.w*0.5;
  const y0 = t.base, y1 = t.base + t.h;
  const topY = projY(t.x, y1, pn), botY = projY(t.x, y0, pn);
  const px0 = projX(l, y0, pn), px1 = projX(r, y0, pn);

  /* far ones are a silhouette only: at this size a second face buys nothing */
  if (Math.abs(botY - topY) < K.CITY_FLAT_PX){
    ctx.fillStyle = t.tone < 0.5 ? C.cityA : C.cityB;
    ctx.beginPath();
    ctx.moveTo(projX(l,y1,pn), projY(l,y1,pn)); ctx.lineTo(projX(r,y1,pn), projY(r,y1,pn));
    ctx.lineTo(projX(r,y0,pn), projY(r,y0,pn)); ctx.lineTo(projX(l,y0,pn), projY(l,y0,pn));
    ctx.closePath(); ctx.fill();
    towerGrid(l, r, y0, y1, pn, 0, Math.abs(botY - topY) > K.GRID_TOWER_PX);
    return;
  }
  const pf = D.FOC / (zf - camZ);
  ctx.fillStyle = C.cityB;
  ctx.beginPath();
  ctx.moveTo(projX(l,y1,pf), projY(l,y1,pf)); ctx.lineTo(projX(r,y1,pf), projY(r,y1,pf));
  ctx.lineTo(projX(r,y1,pn), projY(r,y1,pn)); ctx.lineTo(projX(l,y1,pn), projY(l,y1,pn));
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.cityA;
  ctx.beginPath();
  ctx.moveTo(projX(l,y1,pn), projY(l,y1,pn)); ctx.lineTo(projX(r,y1,pn), projY(r,y1,pn));
  ctx.lineTo(projX(r,y0,pn), projY(r,y0,pn)); ctx.lineTo(projX(l,y0,pn), projY(l,y0,pn));
  ctx.closePath(); ctx.fill();
  if (Math.abs(botY - topY) > K.CITY_EDGE_PX){
    ctx.strokeStyle = C.cityEdge;
    ctx.lineWidth = Math.max(1, 3*pn);
    ctx.stroke();
  }
  towerGrid(l, r, y0, y1, pn, pf, Math.abs(botY - topY) > K.GRID_TOWER_PX);
  towerRotor(t, (l + r) * 0.5, y1, r - l);
}

/* One path for every building's lattice, one stroke at the end. Per-tower
   strokes would be 36 state changes a frame; this is one. */
const gridSeg = [];
/* Block outlines get their own batch, one stroke per obstacle kind. */
const obstSeg = [];
let obstEdgeCol = '';
/* One bucket per accent. The static lattice still goes out in a single stroke;
   the moving parts are split so each can carry its own colour, which is four
   extra strokes a frame in total. */
const fxSeg = [[],[],[],[]];
function gseg(x0,y0,x1,y1){ gridSeg.push(x0,y0,x1,y1); }
function fseg(ci,x0,y0,x1,y1){ const a = fxSeg[ci & 3]; a.push(x0,y0,x1,y1); }
/* Colour index from position rather than from the seeded stream: drawing a
   random number here would shift every later call and change the whole track. */
function fxOf(z, x){ return (Math.floor(z * 0.0131) + Math.floor(x * 0.0073)) & 3; }


/* One path for every building's lattice, one stroke at the end. Per-tower
   strokes would be 36 state changes a frame; this is one. */
function towerGrid(l, r, y0, y1, pn, pf, tall){
  if (!K.GRID_TOWER || !tall) return;
  for (let i = 1; i < K.GRID_TOWER_V; i++){
    const x = l + (r - l) * i / K.GRID_TOWER_V;
    gseg(projX(x,y1,pn), projY(x,y1,pn), projX(x,y0,pn), projY(x,y0,pn));
  }
  for (let i = 1; i < K.GRID_TOWER_H; i++){
    const y = y0 + (y1 - y0) * i / K.GRID_TOWER_H;
    gseg(projX(l,y,pn), projY(l,y,pn), projX(r,y,pn), projY(r,y,pn));
  }
  if (pf){                                   // rungs across the visible roof
    for (let i = 1; i < K.GRID_TOWER_V; i++){
      const x = l + (r - l) * i / K.GRID_TOWER_V;
      gseg(projX(x,y1,pf), projY(x,y1,pf), projX(x,y1,pn), projY(x,y1,pn));
    }
  }
}

/* A slow rotor. Mounted partway up rather than on the roof: a tall tower near
   the camera puts its roof tens of thousands of pixels above the frame. */
function towerRotor(t, cx, top, w){
  if (!K.ROTOR_ON || t.h < K.ROTOR_MIN_H || t.tone > K.ROTOR_CHANCE) return;
  const dz = t.z - camZ;
  if (dz < 60) return;
  const sc = D.FOC / dz;
  const r  = w * K.ROTOR_R;
  const a0 = animT * (K.ROTOR_RPM / 60) * Math.PI * 2 + t.tone * 9;
  const hub = t.base + Math.min(t.h * 0.9, K.ROTOR_Y);
  const ci  = fxOf(t.z, t.x);
  const hx = projX(cx, hub, sc), hy = projY(cx, hub, sc);
  for (let b = 0; b < K.ROTOR_BLADES; b++){
    const a = a0 + b * Math.PI * 2 / K.ROTOR_BLADES;
    fseg(ci, hx, hy, projX(cx + Math.cos(a)*r, hub + Math.sin(a)*r, sc),
                     projY(cx + Math.cos(a)*r, hub + Math.sin(a)*r, sc));
  }
}

/* Craft crossing the sky, well above and off the track, with a trail so the
   motion reads: a bare outline triangle looks like a glitch. */
function drawCraft(){
  if (!K.CRAFT_ON || !craft || !craft.length) return;
  const far = camZ + K.CITY_VIEW;
  for (let i = 0; i < craft.length; i++){
    const c = craft[i];
    if (c.z < camZ + 200 || c.z > far) continue;
    const dz = c.z - camZ, sc = D.FOC / dz;
    const span = K.CRAFT_RANGE * 2;
    let u = (c.sp * animT + c.ph) % span;
    if (u < 0) u += span;
    const x = c.x0 + c.dir * (u - K.CRAFT_RANGE);
    const L = K.CRAFT_LEN * c.sz, Wd = K.CRAFT_W * c.sz;
    const nose = x + c.dir * L * 0.5, tail = x - c.dir * L * 0.5;
    const px1 = projX(nose, c.y, sc), py1 = projY(nose, c.y, sc);
    const px2 = projX(tail, c.y + Wd*0.35, sc), py2 = projY(tail, c.y + Wd*0.35, sc);
    const px3 = projX(tail, c.y - Wd*0.35, sc), py3 = projY(tail, c.y - Wd*0.35, sc);
    const ci = fxOf(c.z, c.ph);
    fseg(ci,px1,py1,px2,py2); fseg(ci,px2,py2,px3,py3); fseg(ci,px3,py3,px1,py1);
    const tx = x - c.dir * L * K.CRAFT_TRAIL;
    fseg(ci, px1, py1, projX(tx, c.y, sc), projY(tx, c.y, sc));
    ctx.fillStyle = C.fx[ci];
    ctx.globalAlpha = 0.9;
    const r = Math.max(1.2, 5 * sc * c.sz);
    ctx.beginPath(); ctx.arc(px1, py1, r, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawCity(){
  if (!K.CITY_ON) return;
  gridSeg.length = 0;
  const far = camZ + K.CITY_VIEW;
  const vis = [];
  for (let i = 0; i < towers.length; i++){
    const t = towers[i];
    if (t.z < camZ + 40 || t.z > far) continue;
    vis.push(t);
  }
  vis.sort((a,b) => b.z - a.z);
  const n = Math.min(vis.length, D.CITY_MAX);
  for (let i = vis.length - n; i < vis.length; i++) drawTower(vis[i]);
  drawCraft();
  if (gridSeg.length){
    ctx.beginPath();
    for (let i = 0; i < gridSeg.length; i += 4){
      ctx.moveTo(gridSeg[i], gridSeg[i+1]);
      ctx.lineTo(gridSeg[i+2], gridSeg[i+3]);
    }
    glowStroke(C.gridTower, C.cityEdge, K.GRID_W, K.GRID_TOWER_A);
    gridSeg.length = 0;
  }
  for (let i = 0; i < fxSeg.length; i++){
    const a = fxSeg[i];
    if (!a.length) continue;
    ctx.beginPath();
    for (let j = 0; j < a.length; j += 4){
      ctx.moveTo(a[j], a[j+1]); ctx.lineTo(a[j+2], a[j+3]);
    }
    glowStroke(C.fx[i], C.fx[i], K.GRID_W * 1.25, K.FX_A);
    a.length = 0;
  }
}

/* Ceiling and walls, drawn before the floor so the floor stays on top. */
const TUN = { lx:[], ly:[], rx:[], ry:[], clx:[], cly:[], crx:[], cry:[] };
function tunnelRing(k, dz){
  ctx.beginPath();
  ctx.moveTo(TUN.lx[k], TUN.ly[k]);   ctx.lineTo(TUN.clx[k], TUN.cly[k]);
  ctx.lineTo(TUN.crx[k], TUN.cry[k]); ctx.lineTo(TUN.rx[k], TUN.ry[k]);
  glowStroke(C.portal, C.cityEdge,
             Math.max(2, K.TUNNEL_PORTAL * D.FOC / Math.max(dz, 20)), 0.95);
}
/* Built from the tunnel's OWN z range, not from whichever view samples happen to
   fall inside it. Those samples slide continuously as the camera advances, so the
   index where the tunnel flag flipped snapped from one to the next every frame
   and the mouth jumped by a whole sample spacing. Samples are packed near the
   camera, so the far mouth had the widest spacing and quivered hardest. Walking
   the real endpoints removes it exactly. */
function drawTunnels(){
  if (!tunnels.length) return;
  const near = camZ + K.NEAR_Z, far = camZ + D.VIEW_Z;
  for (let ti = 0; ti < tunnels.length; ti++){
    const t = tunnels[ti];
    if (t.z1 < near || t.z0 > far) continue;
    const a = Math.max(t.z0, near), b = Math.min(t.z1, far);
    if (b - a < 2) continue;
    for (const kk in TUN) TUN[kk].length = 0;
    const N = K.TUNNEL_SEG;
    for (let i2 = 0; i2 <= N; i2++){
      const z  = a + (b - a) * i2 / N;
      const dz = z - camZ;
      if (dz < 14) continue;
      const sc = D.FOC / dz;
      const sl = sampleTrack(z);
      const xl = sl.cx - sl.hw, xr = sl.cx + sl.hw;
      const yl = sl.y + sl.bank * sl.hw, yr = sl.y - sl.bank * sl.hw;
      const yc = yl + D.TUNNEL_H,        yd = yr + D.TUNNEL_H;
      TUN.lx.push(projX(xl,yl,sc));  TUN.ly.push(projY(xl,yl,sc));
      TUN.rx.push(projX(xr,yr,sc));  TUN.ry.push(projY(xr,yr,sc));
      TUN.clx.push(projX(xl,yc,sc)); TUN.cly.push(projY(xl,yc,sc));
      TUN.crx.push(projX(xr,yd,sc)); TUN.cry.push(projY(xr,yd,sc));
    }
    const n = TUN.lx.length;
    if (n < 2) continue;
    const band = (ax,ay,bx,by) => {
      ctx.beginPath();
      ctx.moveTo(ax[0], ay[0]);
      for (let k = 1; k < n; k++) ctx.lineTo(ax[k], ay[k]);
      for (let k = n-1; k >= 0; k--) ctx.lineTo(bx[k], by[k]);
      ctx.closePath(); ctx.fill();
    };
    ctx.fillStyle = C.tunnel;     band(TUN.clx, TUN.cly, TUN.crx, TUN.cry);
    ctx.fillStyle = C.tunnelWall; band(TUN.lx,  TUN.ly,  TUN.clx, TUN.cly);
                                  band(TUN.rx,  TUN.ry,  TUN.crx, TUN.cry);
    if (a <= t.z0 + 1) tunnelRing(0, a - camZ);
    if (b >= t.z1 - 1) tunnelRing(n - 1, b - camZ);
  }
}

function ribbonRun(i0, i1){
  /* Painter's algorithm, FAR TO NEAR. It used to run near to far, so far bands
     were painted last and drew straight over the crest in front of them: you
     could see through a hill before you went over it. A heightfield viewed from
     one end only occludes correctly in this order. */
  const bands = [];
  let i = i0;
  while (i < i1){
    const bandIdx = pts[i].band;
    let j = i;
    while (j < i1 && pts[j+1].band === bandIdx) j++;
    if (j === i) j = i + 1;
    if (j > i1) j = i1;
    bands.push(i, j, bandIdx);
    i = j;
  }

  for (let b = bands.length - 3; b >= 0; b -= 3){
    const a = bands[b], c = bands[b+1], bi = bands[b+2];
    /* fade the far end into the void so the track dissolves instead of stopping
       at a hard edge in mid air */
    const frac = (pts[a].z - camZ) / Math.max(D.VIEW_Z, 1);
    const fade = 1 - clamp((frac - K.FADE_START) / (1 - K.FADE_START), 0, 1) * K.FADE_AMT;
    ctx.globalAlpha = fade;

    ctx.beginPath();
    ctx.moveTo(pts[a].lx, pts[a].ly);
    for (let k = a+1; k <= c; k++) ctx.lineTo(pts[k].lx, pts[k].ly);
    for (let k = c; k >= a; k--)   ctx.lineTo(pts[k].rx, pts[k].ry);
    ctx.closePath();
    ctx.fillStyle = (bi & 1) ? C.bandB : C.bandA;
    ctx.fill();

    if (fade > K.FADE_LIP){                 // far lips are not worth the fill
      ctx.fillStyle = C.lip;
      ctx.beginPath();
      ctx.moveTo(pts[a].lx, pts[a].ly);
      for (let k = a+1; k <= c; k++) ctx.lineTo(pts[k].lx, pts[k].ly);
      for (let k = c; k >= a; k--)   ctx.lineTo(pts[k].lix, pts[k].liy);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(pts[a].rx, pts[a].ry);
      for (let k = a+1; k <= c; k++) ctx.lineTo(pts[k].rx, pts[k].ry);
      for (let k = c; k >= a; k--)   ctx.lineTo(pts[k].rix, pts[k].riy);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  /* the lips of a hole get a bright bar, so a jump reads from a long way out */
  ctx.fillStyle = C.lipEdge;
  const cap = (k) => {
    const w = Math.max(2.5, 9 * pts[k].sc);
    ctx.beginPath();
    ctx.moveTo(pts[k].lx, pts[k].ly);      ctx.lineTo(pts[k].rx, pts[k].ry);
    ctx.lineTo(pts[k].rx, pts[k].ry + w);  ctx.lineTo(pts[k].lx, pts[k].ly + w);
    ctx.closePath(); ctx.fill();
  };
  if (i0 > 0) cap(i0);
  if (i1 < pts.length - 1) cap(i1);
}

/* Lattice over the ribbon. A point a fraction t across the track projects to
   exactly lerp(leftEdge, rightEdge, t), because the surface is planar across its
   width, so this costs nothing but path building. */
function drawTrackGrid(runs){
  if (!K.GRID_LONG) return;
  ctx.beginPath();
  for (let r = 0; r < runs.length; r += 2){
    const i0 = runs[r], i1 = runs[r+1];
    for (let g = 1; g < K.GRID_LONG; g++){
      const t = g / K.GRID_LONG;
      for (let k = i0; k <= i1; k++){
        const p = pts[k];
        const x = p.lx + (p.rx - p.lx) * t, y = p.ly + (p.ry - p.ly) * t;
        if (k === i0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
    }
    for (let k = i0 + 1; k <= i1; k++){
      if (pts[k].band === pts[k-1].band) continue;   // one rung per colour band
      ctx.moveTo(pts[k].lx, pts[k].ly);
      ctx.lineTo(pts[k].rx, pts[k].ry);
    }
  }
  glowStroke(C.grid, C.gridGlow, K.GRID_W, K.GRID_A);

  /* a bright line where the lip meets the deck, so the edge reads as an edge
     rather than a flat band of colour */
  ctx.beginPath();
  for (let r = 0; r < runs.length; r += 2){
    const i0 = runs[r], i1 = runs[r+1];
    for (let k = i0; k <= i1; k++){
      if (k === i0) ctx.moveTo(pts[k].lix, pts[k].liy); else ctx.lineTo(pts[k].lix, pts[k].liy);
    }
    for (let k = i0; k <= i1; k++){
      if (k === i0) ctx.moveTo(pts[k].rix, pts[k].riy); else ctx.lineTo(pts[k].rix, pts[k].riy);
    }
  }
  glowStroke(C.lipEdge, C.lip, K.GRID_W * 1.3, K.LIP_GLOW);
}

function drawRibbon(){
  if (pts.length < 2) return;
  /* Solid stretches are collected first and drawn far to near as well. Fixing
     the order inside a run but leaving the runs themselves near-first still lets
     the track beyond a hole paint over the lip in front of it. */
  const runs = [];
  let i = 0;
  while (i < pts.length){
    while (i < pts.length && !pts[i].solid) i++;
    if (i >= pts.length) break;
    let j = i;
    while (j + 1 < pts.length && pts[j+1].solid) j++;
    if (j > i) runs.push(i, j);
    i = j + 1;
  }
  for (let r = runs.length - 2; r >= 0; r -= 2) ribbonRun(runs[r], runs[r+1]);
  drawTrackGrid(runs);
}

function oseg(x0,y0,x1,y1){ obstSeg.push(x0,y0,x1,y1); }
function quadEdges(ax,ay,bx,by,cx2,cy2,dx,dy){
  oseg(ax,ay,bx,by); oseg(bx,by,cx2,cy2); oseg(cx2,cy2,dx,dy); oseg(dx,dy,ax,ay);
}
function drawBox(o, faceCol, topCol, outline){
  const zn = o.z - K.OBST_D*0.5, zf = o.z + K.OBST_D*0.5;
  if (zn - camZ < 16) return;
  const pn = D.FOC / (zn - camZ), pf = D.FOC / (zf - camZ);
  const bn = surfaceY(zn, o.x), bf = surfaceY(zf, o.x);
  const l = o.x - o.hw, r = o.x + o.hw;
  obstSpan(o, SPAN);
  const y0 = SPAN[0], y1 = SPAN[1];

  /* the floor telegraph: a patch that says where this thing lives, always on */
  if (o.kind >= 2){
    const f = riseFrac(o);
    ctx.globalAlpha = K.OBST_MARK_A + (K.OBST_MARK_B - K.OBST_MARK_A) * f;
    ctx.fillStyle = o.kind === 2 ? C.obstRise : C.obstDrop;
    ctx.beginPath();
    ctx.moveTo(projX(l,bf,pf), projY(l,bf,pf));
    ctx.lineTo(projX(r,bf,pf), projY(r,bf,pf));
    ctx.lineTo(projX(r,bn,pn), projY(r,bn,pn));
    ctx.lineTo(projX(l,bn,pn), projY(l,bn,pn));
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    if (y1 - y0 < 2) return;
  }

  ctx.fillStyle = topCol;
  ctx.beginPath();
  ctx.moveTo(projX(l,bf+y1,pf), projY(l,bf+y1,pf));
  ctx.lineTo(projX(r,bf+y1,pf), projY(r,bf+y1,pf));
  ctx.lineTo(projX(r,bn+y1,pn), projY(r,bn+y1,pn));
  ctx.lineTo(projX(l,bn+y1,pn), projY(l,bn+y1,pn));
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = faceCol;
  ctx.beginPath();
  ctx.moveTo(projX(l,bn+y1,pn), projY(l,bn+y1,pn));
  ctx.lineTo(projX(r,bn+y1,pn), projY(r,bn+y1,pn));
  ctx.lineTo(projX(r,bn+y0,pn), projY(r,bn+y0,pn));
  ctx.lineTo(projX(l,bn+y0,pn), projY(l,bn+y0,pn));
  ctx.closePath(); ctx.fill();

  /* the filament. Without it a black block on a black deck is nothing at all. */
  if (!outline){
    quadEdges(projX(l,bn+y1,pn), projY(l,bn+y1,pn), projX(r,bn+y1,pn), projY(r,bn+y1,pn),
              projX(r,bn+y0,pn), projY(r,bn+y0,pn), projX(l,bn+y0,pn), projY(l,bn+y0,pn));
    quadEdges(projX(l,bf+y1,pf), projY(l,bf+y1,pf), projX(r,bf+y1,pf), projY(r,bf+y1,pf),
              projX(r,bn+y1,pn), projY(r,bn+y1,pn), projX(l,bn+y1,pn), projY(l,bn+y1,pn));
  }

  if (outline){ ctx.strokeStyle = outline; ctx.lineWidth = Math.max(1.6, 2.4*pn); ctx.stroke(); }
}

function drawObstacles(){
  const far = camZ + D.VIEW_Z;
  const vis = [];
  for (let i = 0; i < obstacles.length; i++){
    const o = obstacles[i];
    if (o.dead || o.z < camZ + 20 || o.z > far) continue;
    vis.push(o);
  }
  vis.sort((a,b) => b.z - a.z);
  /* Grouped by kind so each colour of filament is one batched pass. Sliding,
     rising and dropping blocks each get their own hue, which is now the only way
     to tell them apart: the faces are all the same near-black. */
  const kinds = [[0,C.obstEdge],[1,C.obstMove],[2,C.obstRise],[3,C.obstDrop]];
  for (let ki = 0; ki < kinds.length; ki++){
    obstSeg.length = 0;
    for (let i = 0; i < vis.length; i++){
      if (vis[i].kind !== kinds[ki][0]) continue;
      drawBox(vis[i], C.obstFace, C.obstTop, null);
    }
    if (!obstSeg.length) continue;
    ctx.beginPath();
    for (let i = 0; i < obstSeg.length; i += 4){
      ctx.moveTo(obstSeg[i], obstSeg[i+1]);
      ctx.lineTo(obstSeg[i+2], obstSeg[i+3]);
    }
    glowStroke(kinds[ki][1], kinds[ki][1], K.GRID_W * 1.35, K.OBST_EDGE_A);
  }
  obstSeg.length = 0;
}

function drawSave(){
  if (!save.live) return;
  const dz = save.z - camZ;
  if (dz < 30) return;
  const sc = D.FOC / dz;
  const base = surfaceY(save.z, save.x);
  const bx = projX(save.x, base + K.SAVE_R*1.5, sc);
  const by = projY(save.x, base + K.SAVE_R*1.5, sc);
  const tx = projX(save.x, base + 320, sc), ty = projY(save.x, base + 320, sc);
  const r  = K.SAVE_R * sc;

  ctx.strokeStyle = 'rgba(255,198,61,0.22)';
  ctx.lineWidth = Math.max(2.4, 5*sc);
  ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(bx,by); ctx.stroke();

  const wob = 0.55 + 0.45 * Math.abs(Math.cos(save.spin));
  ctx.fillStyle = C.save;
  ctx.beginPath();
  ctx.moveTo(bx, by-r); ctx.lineTo(bx+r*wob, by);
  ctx.lineTo(bx, by+r); ctx.lineTo(bx-r*wob, by);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(bx, by, r*1.55, 0, Math.PI*2);
  glowStroke(C.save, C.save, Math.max(1.4, 2.2*sc), 0.9);

  /* Moment one: what it is. Only until this browser has collected one, and
     faded out as it is reached so it never sits on top of the pickup at the
     moment the player is steering into it. */
  if (K.TEACH_ON && taught.got === 0){
    const inA  = clamp((K.TEACH_LABEL_FAR - dz) /
                       Math.max(K.TEACH_LABEL_FAR - K.TEACH_LABEL_NEAR, 1), 0, 1);
    const outA = clamp((dz - K.TEACH_LABEL_GONE) /
                       Math.max(K.TEACH_LABEL_NEAR - K.TEACH_LABEL_GONE, 1), 0, 1);
    const a = Math.min(inA, outA);
    if (a > 0.01){
      ctx.globalAlpha = a;
      text(K.TEACH_WORD, bx, by - r * K.TEACH_LABEL_RISE,
           Math.max(9, K.TEACH_LABEL_SIZE * Math.min(1, W/420)), '700', C.save);
      ctx.globalAlpha = 1;
    }
  }
}

/* Moment three: the spend. Drawn in the world so it lands on the block that
   was just shattered, lifted well clear of the deck so nothing sits over the
   ball or the ground it is about to cross. */
function drawSaveCall(){
  if (!K.TEACH_ON || !run || run.teachT <= 0) return;
  const dz = run.teachZ - camZ;
  if (dz < 30) return;
  const k  = 1 - clamp(run.teachT / K.TEACH_HIT_T, 0, 1);   // 0 fresh, 1 gone
  const sc = D.FOC / dz;
  const y  = surfaceY(run.teachZ, run.teachX) + K.TEACH_HIT_RISE + K.TEACH_HIT_DRIFT * k;
  const px = projX(run.teachX, y, sc), py = projY(run.teachX, y, sc);
  ctx.globalAlpha = clamp(1 - k*k, 0, 1);
  text(K.TEACH_HIT_MSG, px, py,
       Math.max(11, K.TEACH_HIT_SIZE * Math.min(1, W/420)), '800', C.save);
  ctx.globalAlpha = 1;
}

function drawShards(){
  for (let i = 0; i < shards.length; i++){
    const s = shards[i];
    const dz = s.z - camZ;
    if (dz < 20) continue;
    const sc = D.FOC / dz;
    ctx.globalAlpha = clamp(s.life / 0.55, 0, 1);
    ctx.fillStyle = C.save;
    const w = Math.max(2, 7*sc);
    ctx.fillRect(projX(s.x,s.y,sc) - w*0.5, projY(s.x,s.y,sc) - w*0.5, w, w);
  }
  ctx.globalAlpha = 1;
}

/* A fading silhouette of the ball rather than a wall of light: full width where
   it meets the ball, shrinking and dimming to nothing behind, which is what the
   reference actually shows trailing a cycle. Drawn oldest first so the newest
   ghosts sit on top and the streak reads solid at the ball. */
function drawTrail(){
  const n = P.trail.length;
  if (n < 2) return;
  ctx.fillStyle = C.player;
  for (let i = 0; i < n; i++){
    const t  = P.trail[i];
    const dz = t.z - camZ;
    if (dz < 20) continue;
    const sc = D.FOC / dz;
    const f  = i / (n - 1);                       // 0 oldest, 1 newest
    const rr = K.BALL_R * sc * (K.TRAIL_TAPER + (1 - K.TRAIL_TAPER) * f);
    const y  = surfaceY(t.z, t.x) + t.h;
    ctx.globalAlpha = K.TRAIL_A * f * f;
    ctx.beginPath();
    ctx.arc(projX(t.x, y, sc), projY(t.x, y, sc) - K.BALL_R * sc, rr, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPlayer(bright){
  const dz = rZ - camZ;
  if (dz < 24) return;
  const sc   = D.FOC / dz;
  /* Always drawn from the banked surface. Physics measures the arc against the
     smooth plane, but switching the DRAWN base between the two at launch jumped
     the ball by the whole bank term in one frame. */
  const surf = surfaceY(rZ, rX);
  const py   = surf + P.fallY + rH;
  const r    = K.BALL_R * sc;

  /* the shadow stays on the floor, so height reads while airborne */
  if (P.fallY === 0 && !gapAt(rZ)){
    ctx.globalAlpha = 0.26 * (P.air ? 0.55 : 1);
    ctx.fillStyle = '#3a2a2a';
    ctx.beginPath();
    ctx.ellipse(projX(rX,surf,sc), projY(rX,surf,sc), r*1.15, r*0.42, roll, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  const blink = (P.iframes > 0 && !bright) ? (Math.floor(P.iframes*18) % 2 === 0) : false;
  if (blink) return;

  const cx0 = projX(rX, py, sc), cy0 = projY(rX, py, sc) - r;
  const sq  = P.squash > 0 ? 1 + K.LAND_SQUASH * 2 * (P.squash / K.LAND_SQUASH) : 1;

  ctx.save();
  ctx.translate(cx0, cy0);
  ctx.rotate(roll);
  ctx.scale(sq, 1/sq);

  /* Solid black, one neon ring. Nothing spins. */
  ctx.strokeStyle = C.player;
  ctx.globalAlpha = K.BALL_HALO_A;
  ctx.lineWidth = r * 0.7;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.28, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.fillStyle = C.playerBody;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();

  ctx.beginPath(); ctx.arc(0, 0, r * K.BALL_RING, 0, Math.PI*2);
  glowStroke(C.player, C.player, Math.max(1.3, r * 0.22), 0.95);

  if (P.save){
    ctx.strokeStyle = C.save;
    ctx.lineWidth = Math.max(2, 3.2*sc);
    ctx.globalAlpha = 0.65 + 0.35 * Math.sin(performance.now() * 0.006);
    ctx.beginPath(); ctx.arc(0,0,r*1.75,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (P.burst > 0){
    const k = 1 - P.burst / K.SAVE_BURST;
    ctx.strokeStyle = C.save; ctx.globalAlpha = clamp(1-k,0,1);
    ctx.lineWidth = Math.max(2, 4*sc*(1-k));
    ctx.beginPath(); ctx.arc(0,0,r*(1.75 + k*3.2),0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function markCrossing(){
  const dz = run.overZ - camZ;
  if (dz < 20) return;
  const sc = D.FOC / dz, y = surfaceY(run.overZ, run.overX);
  ctx.fillStyle = '#ffffff';
  const w = Math.max(4, 14*sc);
  ctx.fillRect(projX(run.overX,y,sc) - w*0.5, projY(run.overX,y,sc) - w*0.5, w, w*0.55);
}

function drawDeathFx(){
  ctx.fillStyle = 'rgba(7,5,15,0.60)';
  ctx.fillRect(-40, -40, W+80, H+80);

  if (run.overKind === 'hit' && run.overObst){
    ctx.globalAlpha = 0.72 + 0.28 * Math.sin(performance.now()*0.014);
    drawBox(run.overObst, C.die, '#ff7a84', '#ffffff');
    ctx.globalAlpha = 1;
    const o = run.overObst, zn = o.z - K.OBST_D*0.5;
    if (zn - camZ > 16){
      const pn = D.FOC / (zn - camZ), bn = surfaceY(zn, run.overX);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = Math.max(3, 9*pn);
      ctx.beginPath();
      ctx.moveTo(projX(run.overX, bn+K.OBST_H, pn), projY(run.overX, bn+K.OBST_H, pn));
      ctx.lineTo(projX(run.overX, bn, pn),          projY(run.overX, bn, pn));
      ctx.stroke();
    }
  } else if (run.overKind === 'fall' && pts.length > 1){
    const n = pts.length - 1, side = run.overSide;
    ctx.fillStyle = C.die; ctx.globalAlpha = 0.90;
    ctx.beginPath();
    if (side > 0){
      ctx.moveTo(pts[0].rx, pts[0].ry);
      for (let k=1;k<=n;k++) ctx.lineTo(pts[k].rx, pts[k].ry);
      for (let k=n;k>=0;k--) ctx.lineTo(pts[k].rx + (pts[k].rix - pts[k].rx)*2.1,
                                        pts[k].ry + (pts[k].riy - pts[k].ry)*2.1);
    } else {
      ctx.moveTo(pts[0].lx, pts[0].ly);
      for (let k=1;k<=n;k++) ctx.lineTo(pts[k].lx, pts[k].ly);
      for (let k=n;k>=0;k--) ctx.lineTo(pts[k].lx + (pts[k].lix - pts[k].lx)*2.1,
                                        pts[k].ly + (pts[k].liy - pts[k].ly)*2.1);
    }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    markCrossing();
  } else if (run.overKind === 'gap' && run.overGap){
    const g = run.overGap;
    ctx.fillStyle = C.die; ctx.globalAlpha = 0.50;
    for (let k = 0; k < pts.length-1; k++){
      if (pts[k].z < g.z0 - K.SLICE_DZ || pts[k].z > g.z1 + K.SLICE_DZ) continue;
      ctx.beginPath();
      ctx.moveTo(pts[k].lx, pts[k].ly);       ctx.lineTo(pts[k].rx, pts[k].ry);
      ctx.lineTo(pts[k+1].rx, pts[k+1].ry);   ctx.lineTo(pts[k+1].lx, pts[k+1].ly);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    markCrossing();
  }
  drawPlayer(true);
}

/* ---------- HUD ---------- */
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
function text(s, x, y, size, weight, col, align){
  ctx.font = weight + ' ' + size + 'px ' + FONT;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = col;
  ctx.fillText(s, x, y);
}

/* the in-run controls, drawn last so nothing overlaps them */
function drawRunButtons(){
  const s = Math.min(1, W/420);
  const r = K.BTN_R*s, m = K.BTN_M*s, gap = K.BTN_GAP*s;
  const y = H - m - r;
  UI.pause = [m, y - r, r*2, r*2];
  /* Next to pause, so the two audio controls stay together on the right. Null,
     not disabled, where the API is unavailable. */
  const fsOk = fsAvailable();
  UI.full  = fsOk ? [m + r*2 + gap, y - r, r*2, r*2] : null;
  UI.skip  = [W - m - r*2, y - r, r*2, r*2];
  UI.mute  = [W - m - r*4 - gap, y - r, r*2, r*2];
  ctx.globalAlpha = K.BTN_A;
  ctx.strokeStyle = C.hud; ctx.lineWidth = 1.6*s;
  ctx.fillStyle = C.hud;

  const px = m + r;
  ctx.beginPath(); ctx.arc(px, y, r, 0, Math.PI*2); ctx.stroke();
  if (paused){
    ctx.beginPath();
    ctx.moveTo(px - r*0.26, y - r*0.34);
    ctx.lineTo(px + r*0.38, y);
    ctx.lineTo(px - r*0.26, y + r*0.34);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillRect(px - r*0.30, y - r*0.34, r*0.22, r*0.68);
    ctx.fillRect(px + r*0.08, y - r*0.34, r*0.22, r*0.68);
  }

  /* A plain X, dimmed when the music was off, gave no way back: it read as a
     disabled control rather than as the switch that turns the music on again.
     This shows the STATE instead, the way every mute button does, and stays at
     full weight in both. */
  if (fsOk){
    const fx = m + r*3 + gap;
    ctx.beginPath(); ctx.arc(fx, y, r, 0, Math.PI*2); ctx.stroke();
    /* Four corner brackets. Out at the frame when there is room to open, pulled
       in and reversed when there is room to close, so the two states are not
       the same picture. */
    const inFS = fsOn();
    const fq = r*0.44, arm = fq*0.62, d = inFS ? -arm : arm;
    for (let i = 0; i < 4; i++){
      const ex = (i === 1 || i === 2) ? 1 : -1;
      const ey = (i < 2) ? -1 : 1;
      const cx2 = fx + ex * (inFS ? fq*0.40 : fq);
      const cy2 = y  + ey * (inFS ? fq*0.40 : fq);
      ctx.beginPath();
      ctx.moveTo(cx2 - ex*d, cy2);
      ctx.lineTo(cx2, cy2);
      ctx.lineTo(cx2, cy2 - ey*d);
      ctx.stroke();
    }
  }

  const mx = W - m - r*3 - gap;
  const q  = r*0.32;
  ctx.beginPath(); ctx.arc(mx, y, r, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mx - q*1.05, y - q*0.34);
  ctx.lineTo(mx - q*0.35, y - q*0.34);
  ctx.lineTo(mx + q*0.30, y - q*0.95);
  ctx.lineTo(mx + q*0.30, y + q*0.95);
  ctx.lineTo(mx - q*0.35, y + q*0.34);
  ctx.lineTo(mx - q*1.05, y + q*0.34);
  ctx.closePath(); ctx.fill();
  if (audioOn()){
    ctx.beginPath(); ctx.arc(mx + q*0.55, y, q*0.78, -0.85, 0.85); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(mx + q*0.66, y - q*0.52); ctx.lineTo(mx + q*1.32, y + q*0.52);
    ctx.moveTo(mx + q*1.32, y - q*0.52); ctx.lineTo(mx + q*0.66, y + q*0.52);
    ctx.stroke();
  }

  const sx = W - m - r;
  ctx.beginPath(); ctx.arc(sx, y, r, 0, Math.PI*2); ctx.stroke();
  for (let i = 0; i < 2; i++){
    const o = -r*0.34 + i*r*0.36;
    ctx.beginPath();
    ctx.moveTo(sx + o, y - r*0.32);
    ctx.lineTo(sx + o + r*0.30, y);
    ctx.lineTo(sx + o, y + r*0.32);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillRect(sx + r*0.40, y - r*0.32, r*0.13, r*0.64);
  ctx.globalAlpha = 1;
}

function drawPaused(){
  ctx.fillStyle = 'rgba(4,3,2,0.62)';
  ctx.fillRect(-40,-40,W+80,H+80);
  const s = Math.min(1, W/420);
  textTracked('PAUSED', HALFW, H*0.42, 26*s, '700', C.cream, 6*s);
  text('tap anywhere to carry on', HALFW, H*0.42 + 26*s, 12*s, '400',
       'rgba(255,255,255,0.72)');
}

function drawHUD(){
  const s = H < 620 ? 0.82 : 1;
  text(String(score()), HALFW, 52*s, 40*s, '300', C.hud);

  /* the multiplier is the whole point of the brake: you can watch it fall */
  const cm = chainMul();
  ctx.globalAlpha = 0.75;
  text('x' + (scoreMul()*cm).toFixed(1), HALFW, 96*s, 19*s, '500', C.lip);
  ctx.globalAlpha = 1;
  if (run.chain > 0){
    const hot = clamp(run.chainT / K.NEAR_HOLD, 0, 1);
    ctx.globalAlpha = 0.35 + 0.65*hot;
    text('THREADED ' + run.chain, HALFW, 117*s, 12.5*s, '600', C.save);
    ctx.globalAlpha = 1;
  }

  if (run.tierT > 0){
    ctx.globalAlpha = clamp(run.tierT / K.TIER_FLASH, 0, 1);
    text(TIER_NAME[run.tier] || '', HALFW, H*0.30, 30*s, '200', C.lip);
    ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = 0.45;
    text(TIER_NAME[run.tier] || '', HALFW, H - 58*s, 11*s, '500', C.hud);
    ctx.globalAlpha = 1;
  }
  if (run.daily)
    text('daily', HALFW, 74*s, 13*s, '500', C.lip);
  else if (best > 0)
    text('best ' + best, HALFW, 74*s, 13*s, '400', 'rgba(239,232,220,0.5)');
  if (K.SAVE_ON){
    const cx0 = HALFW, cy0 = H - 34*s, r = 11*s;
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = P.save ? C.save : 'rgba(239,232,220,0.22)';
    ctx.beginPath(); ctx.arc(cx0, cy0, r, 0, Math.PI*2); ctx.stroke();
    if (P.save){ ctx.fillStyle = C.save; ctx.beginPath(); ctx.arc(cx0,cy0,r*0.46,0,Math.PI*2); ctx.fill(); }
    /* Moment two: that you have it. The ring alone says nothing about what it
       means, so the word sits beside it for the first couple of holds and then
       gets out of the way. The indicator itself does not change. */
    if (K.TEACH_ON && P.save && taught.got <= K.TEACH_RING_HOLDS){
      text(K.TEACH_WORD, cx0 + r + 7*s, cy0 + 4*s, K.TEACH_RING_SIZE*s, '700', C.save, 'left');
    }
  }
}

function drawPerf(){
  if (!perf.show) return;
  const lines = [
    perf.avg.toFixed(1)+' ms avg   '+perf.worst.toFixed(1)+' ms worst',
    (1000/Math.max(perf.avg,0.001)).toFixed(0)+' fps   '+perf.steps+' steps   dpr '+DPR.toFixed(2)
      +'   q'+qual.toFixed(2),
    secAt(P.z).type + '   tilt ' + sampleTrack(P.z).bank.toFixed(2) + (P.air ? '   AIR' : ''),
    'look ' + lookNow().toFixed(2) + 's   ' + speedNow().toFixed(0) + ' u/s   d' + K.DIFFICULTY.toFixed(2),
    'seed '+(run?run.seed:0)+'   F to hide'
  ];
  ctx.font = '400 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.fillRect(8, 8, 220, 14*lines.length + 8);
  ctx.fillStyle = perf.worst > 22 ? '#ff9a6b' : 'rgba(239,232,220,0.78)';
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], 14, 22 + i*14);
}

/* Sliders drawn straight onto the canvas. Every row is a rect; a tap or drag
   anywhere along it sets the value from the x position. */
function drawSettings(){
  const g = setGeom(), s = g.s;

  /* The arena above the panel is left alone. Dimming the whole screen, which is
     what this did before, meant you could not see what any of these did until
     you started a run, by which point it was too late to judge. */
  const fade = 26*s;
  for (let i = 0; i < 8; i++){
    ctx.fillStyle = 'rgba(2,6,10,' + (K.SET_SCRIM * (i+1)/8 * 0.5).toFixed(3) + ')';
    ctx.fillRect(-40, g.top - fade + fade*i/8, W+80, fade/8 + 1);
  }
  ctx.fillStyle = 'rgba(2,6,10,' + K.SET_SCRIM + ')';
  ctx.fillRect(-40, g.top, W+80, H - g.top + 40);
  ctx.strokeStyle = 'rgba(205,243,255,0.10)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, g.top); ctx.lineTo(W, g.top); ctx.stroke();

  text('SETTINGS', HALFW, g.top + 21*s, 15*s, '500', C.hud);
  text('changes show above as you make them', HALFW, g.top + 21*s + 15*s, 10.5*s,
       '400', 'rgba(205,243,255,0.38)');

  let y = g.firstY;
  for (let i = 0; i < OPT.length; i++){
    const e = OPT[i];
    /* the whole row is the target, and the row is now tall enough to hit */
    UI['opt'+i] = [0, y - g.rowH*0.5, W, g.rowH];
    const t = (e.v - e.min) / (e.max - e.min);
    const kx = g.barX + g.barW*t;
    /* a narrow strip behind the row, so the type reads over whatever the arena
       happens to be doing without darkening the arena itself */
    ctx.fillStyle = 'rgba(2,6,10,' + (setDrag === i ? 0.74 : K.SET_LABEL_BG) + ')';
    ctx.fillRect(0, y - g.rowH*0.42, W, g.rowH*0.84);
    ctx.lineWidth = 5*s;
    ctx.strokeStyle = 'rgba(205,243,255,0.16)';
    ctx.beginPath(); ctx.moveTo(g.barX, y); ctx.lineTo(g.barX+g.barW, y); ctx.stroke();
    ctx.strokeStyle = C.lip;
    ctx.beginPath(); ctx.moveTo(g.barX, y); ctx.lineTo(kx, y); ctx.stroke();
    const kr = K.SET_KNOB*s * (setDrag === i ? 1.3 : 1);
    ctx.fillStyle = 'rgba(2,6,10,0.9)';
    ctx.beginPath(); ctx.arc(kx, y, kr*1.15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = C.hud;
    ctx.beginPath(); ctx.arc(kx, y, kr, 0, Math.PI*2); ctx.fill();
    text(e.label, g.barX - 14*s, y + 4.5*s, 12.5*s, '400',
         setDrag === i ? C.hud : 'rgba(205,243,255,0.80)', 'right');
    y += g.rowH;
  }

  const bw = 118*s, bh = 32*s, gap = 10*s;
  const by = H - bh - K.SET_FOOT*s;
  UI.setReset = [HALFW - bw - gap*0.5, by, bw, bh];
  UI.setDone  = [HALFW + gap*0.5,      by, bw, bh];
  const btns = [['setReset','reset','rgba(205,243,255,0.55)'],['setDone','done',C.lip]];
  for (let bi = 0; bi < btns.length; bi++){
    const r = UI[btns[bi][0]];
    ctx.strokeStyle = btns[bi][2]; ctx.lineWidth = 1.5;
    ctx.strokeRect(r[0], r[1], r[2], r[3]);
    text(btns[bi][1], r[0]+r[2]*0.5, r[1]+r[3]*0.66, 13*s, '500', btns[bi][2]);
  }
}

/* Letter-by-letter so the wordmark can be tracked out wide, which is most of
   what makes a title look designed rather than typed. Canvas letterSpacing is
   not reliable across the browsers this has to run on. */
function textTracked(str, cx, y, size, weight, col, track, alpha){
  ctx.font = weight + ' ' + size + 'px ' + FONT;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  let w = -track;
  for (let i = 0; i < str.length; i++) w += ctx.measureText(str[i]).width + track;
  let x = cx - w * 0.5;
  ctx.fillStyle = col;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  for (let i = 0; i < str.length; i++){
    ctx.fillText(str[i], x, y);
    x += ctx.measureText(str[i]).width + track;
  }
  ctx.globalAlpha = 1;
}
/* bloom on text, the same trick as the line work: repeats at small offsets */
function textGlow(str, cx, y, size, weight, col, track){
  for (let i = 0; i < 4; i++){
    const a = i * Math.PI * 0.5, d = size * 0.045;
    textTracked(str, cx + Math.cos(a)*d, y + Math.sin(a)*d, size, weight, col, track, K.TITLE_GLOW);
  }
  textTracked(str, cx, y, size, weight, col, track, 1);
}
function uiButton(key, x, y, w, h, label, size, primary){
  UI[key] = [x, y, w, h];
  ctx.beginPath(); ctx.rect(x, y, w, h);
  /* The primary button is amber and stays that way. Everything else is white:
     the warm tints read beautifully against the bloom in the middle of the
     screen and then disappeared against the black at the edges, and the borders
     were the worst of it at 2.1 to 1. */
  if (primary) glowStroke(C.warm, C.warm, 2, 0.95);
  else { ctx.strokeStyle = 'rgba(255,255,255,0.62)'; ctx.lineWidth = 1.6; ctx.stroke(); }
  textTracked(label, x + w*0.5, y + h*0.645, size, primary ? '600' : '500',
              primary ? C.warm : '#ffffff', size*0.10);
}

function drawTitle(){
  const s  = Math.min(1, W/420);
  const bw = Math.min(W*0.78, 300*s), bx = HALFW - bw*0.5;
  const hz = H * K.TITLE_HZ;

  /* Knock the arena back, then light it the way the card is lit: a broad amber
     bloom rising off a horizon, and a thin warm line across it. The gradient is
     built once and cached, because the title is static and rebuilding one every
     frame is exactly the sort of thing that shows on a slow machine. */
  ctx.fillStyle = 'rgba(4,3,2,' + K.TITLE_SCRIM + ')';
  ctx.fillRect(-40, -40, W+80, H+80);

  const key = W + 'x' + H;
  if (titleBloomKey !== key){
    const r = W * K.TITLE_BLOOM;
    const g2 = ctx.createRadialGradient(HALFW, hz, 0, HALFW, hz, r);
    g2.addColorStop(0,    'rgba(255,150,40,' + K.TITLE_BLOOM_A + ')');
    g2.addColorStop(0.16, 'rgba(240,120,30,' + (K.TITLE_BLOOM_A*0.42).toFixed(3) + ')');
    g2.addColorStop(0.42, 'rgba(190,80,20,'  + (K.TITLE_BLOOM_A*0.13).toFixed(3) + ')');
    g2.addColorStop(1,    'rgba(120,50,12,0)');
    titleBloom = g2; titleBloomKey = key;
  }
  ctx.fillStyle = titleBloom;
  ctx.fillRect(-40, -40, W+80, H+80);

  ctx.strokeStyle = C.warm;
  ctx.globalAlpha = 0.30;
  ctx.lineWidth = Math.max(1, 1.2*s);
  ctx.beginPath(); ctx.moveTo(0, hz); ctx.lineTo(W, hz); ctx.stroke();
  ctx.globalAlpha = 1;

  let y = H*0.17;
  const mark = GAME_NAME.charAt(0) + GAME_NAME.slice(1).toLowerCase();
  textGlow(mark, HALFW, y, 60*s, '800', C.cream, K.TITLE_TRACK * 60*s);
  y += 14*s;
  ctx.beginPath();
  ctx.moveTo(HALFW - bw*0.42, y); ctx.lineTo(HALFW + bw*0.42, y);
  glowStroke(C.warm, C.warm, 1.2, 0.80);

  /* what the daily track is, said plainly, because nobody should have to guess */
  /* Two thoughts, and the spacing has to say so. Which track it is and how long
     it lasts belong together, so the clock sits tight under the number at 16.
     What the daily mode actually is, is a separate point, so it starts after 25,
     comfortably more than the 15 holding its own two lines together. Grouping by
     gap size rather than by rule or colour keeps the block quiet. */
  y += 40*s;
  textTracked('TODAY: TRACK #' + dailyNumber(), HALFW, y, 15*s, '600', '#ffffff', 2.2*s);

  y += 16*s;
  /* 'italic 400' rather than '400': the helper drops this straight into the CSS
     font shorthand, where style comes before weight. Get the order wrong and the
     whole string is invalid, which canvas ignores silently, leaving whatever font
     was set last. */
  text(dailyCountdown(), HALFW, y, 11.5*s, 'italic 400', 'rgba(255,255,255,0.90)');

  y += 25*s;
  text('The same track for everyone in the world today.', HALFW, y, 11.5*s, '400',
       'rgba(255,255,255,0.90)');
  y += 15*s;
  text('A new one every day. Compare your score with anyone.', HALFW, y, 11.5*s, '400',
       'rgba(255,255,255,0.90)');

  y += 24*s;
  const bh = 40*s;
  uiButton('play', bx, y, bw, bh, "PLAY TODAY'S TRACK", 13*s, true);
  y += bh + 9*s;
  uiButton('random', bx, y, bw, 32*s, 'RANDOM TRACK', 11.5*s, false);
  y += 32*s + 5*s;
  text('a fresh layout right now, not scored against the world',
       HALFW, y + 10*s, 10*s, '400', 'rgba(255,255,255,0.74)');

  y += 24*s;

       HALFW, y, 10.5*s, '400', 'rgba(255,255,255,0.78)');

    textTracked('BEST ' + best, HALFW, y + 18*s, 11*s, '500', 'rgba(255,255,255,0.92)', 2*s);

function drawDead(){
  /* Same treatment as the splash: cream numeral with the wordmark's bloom, the
     accent in amber tracked caps, body copy in white, and one amber button. It
     used to have its own smaller, greyer, differently tracked set of styles and
     read as a different screen from the one you had just come off. */
  const s = Math.min(1, W/420);

  textGlow(String(score()), HALFW, y, 68*s, '800', C.cream, K.TITLE_TRACK * 68*s);

  ctx.beginPath();

  glowStroke(C.warm, C.warm, 1.2, 0.80);

  const isBest = score() >= best && score() > 0;

              isBest ? C.warm : 'rgba(255,255,255,0.72)', 2.2*s);

  /* The cause of death and the running tally used to sit here. They were useful
     to me while tuning and they are clutter to a player: the score, whether it
     beat the last one, and how to go again is the whole of what this screen is
     for. The diagnostics are still recorded, just not shown. */

  /* What the score was set on. Short, and the only thing standing between a
     daily leaderboard and somebody widening the path to three times normal. */
  y += 20*s;
  const dflt = optsAreDefault();
  textTracked(runLabel().toUpperCase() + '  \u00b7  ' + (dflt ? 'UNCHANGED' : 'ADJUSTED'),
              HALFW, y, 10*s, '500',
              dflt ? 'rgba(255,255,255,0.54)' : 'rgba(255,180,90,0.78)', 1.6*s);

  y += 26*s;
  if (run.inputLock <= 0)
    text('press anything to go again', HALFW, y, 11.5*s, '400',
         'rgba(255,255,255,0.74)');

  y += 16*s;
  const gap = 8*s, half = (bw - gap) * 0.5;
  uiButton('menu', bx, y, half, 38*s, 'HOME', 12*s, false);
  uiButton('share', bx + half + gap, y, half, 38*s,
           shareMsg > 0 ? 'COPIED' : 'SHARE', 12*s, true);
  UI.settings = null;
}

function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  /* Render between simulation ticks rather than snapping to the last one. Slope
     runs physics at 50Hz with interpolation off on every rigidbody, so on a 60Hz
     display the two beat against each other at 10Hz of visible judder and what
     you see is up to 20ms stale. This costs three lerps. */
  const a = clamp(acc / K.STEP, 0, 1);
  rZ = P.pz + (P.z - P.pz) * a;
  rX = P.px + (P.x - P.px) * a;
  rH = P.ph + (P.h - P.ph) * a;
  let shx = 0, shy = 0;
  if (run && run.shake > 0.2){
    shx = (Math.random()*2-1) * run.shake;
    shy = (Math.random()*2-1) * run.shake;
  }
  ctx.save();
  ctx.translate(shx, shy);

  drawSky();

  camZ = rZ - D.CAM_BACK;
  const ct = sampleTrack(camZ);
  /* The camera's height references the surface under the BALL, not the surface
     under itself. The floor is banked and the track centre swings sideways fast,
     so referencing its own position made the ball bob up to 47px a frame. This
     is the bumpiness that survived flattening the track. Damping the camera made
     it worse, because the ball rides the bank and any lag shows up as the ball
     moving relative to the view. Only the airborne rise is damped, so a landing
     does not snap. */
  const tB = sampleTrack(rZ, TR2);
  /* CAM_H above the floor beneath ITSELF, using its own elevation. Referencing
     the elevation to the ball put the camera 178 units back from where it was
     measuring, on ground 113 units higher, which left it 5 units above the floor
     and drew the ball through the track. Only the BANK is taken from under the
     ball, because that is the term that swings fast and the term the ball rides,
     so the ball still sits still in frame. */
  camRise += (rH * K.CAM_RISE - camRise) * (1 - Math.exp(-K.CAM_VSMOOTH * lastFt));
  camY  = K.CAM_H + ct.y + tB.bank * (tB.cx - rX) + camRise;
  roll  = -ct.bank * K.CAM_ROLL;
  rollC = Math.cos(roll); rollS = Math.sin(roll);
  /* The camera stays gravity-level. The track's vanishing point therefore sits
     grade*FOCAL below the true horizon, which is what the eye reads as downhill.
     CAM_PITCH_FOLLOW gives some of that back so a plunge stays on screen. */
  hY = horizonY - ct.grade * D.FOC * K.CAM_PITCH_FOLLOW;

  /* However far the horizon has been lifted from its nominal place is how far
     the camera is looking down. Turn that into an actual rotation. projBase is
     set so the eye-level horizon still lands exactly on hY, which keeps every
     bit of framing already tuned, and the rotation is pure gain: verticals
     converge and the ground reads as tilted rather than merely offset. */
  const pt = (horizonY - hY) / D.FOC * K.CAM_TRUE_PITCH + K.CAM_PITCH_EXTRA;
  const th = Math.atan(pt);
  pitchC = Math.cos(th); pitchS = Math.sin(th);
  projBase = hY + D.FOC * pt;

  /* Keep the ball on screen, measured through the REAL projection rather than
     predicted by a formula. The old clamp solved the un-rotated equations, which
     stopped describing anything once the camera became a true rotation; it went
     unnoticed only because the camera was low enough to hide it. Raising the
     camera put the ball off the bottom of the screen. projY is linear in
     projBase, so one pass is exact. */
  const bT = sampleTrack(rZ, TR2);
  const bY = projY(rX, bT.y + bT.bank * (bT.cx - rX) + rH, D.FOC / D.CAM_BACK);
  const keepY = H * K.CAM_KEEP;
  if (bY > keepY){ const shift = bY - keepY; projBase -= shift; hY -= shift; }

  drawHorizon();
  drawCity();
  buildPts();
  drawTunnels();
  drawRibbon();
  drawObstacles();

  if (state !== 'title'){
    drawSave();
    drawTrail();
    if (run.flashT > 0 && run.flashO) drawBox(run.flashO, '#fff3d0', '#ffffff', null);
    drawShards();
    drawSparks();
    drawSpeedLines();
    drawSaveCall();
    if (state === 'play') drawPlayer(false);
  }
  if (state === 'dying' || state === 'dead') drawDeathFx();

  ctx.restore();

  if (state === 'play'){ drawHUD(); drawRunButtons(); if (paused) drawPaused(); }
  else if (setOpen)      drawSettings();
  else if (state === 'title') drawTitle();
  else if (state === 'dead')  drawDead();
  drawPerf();
}

/* ==========================================================================
   MUSIC

   Synthesised, not streamed. The zero-external-requests rule has held since the
   first session and it is not worth breaking for audio: a lo-fi hip hop loop is
   a slow swung drum pattern, a jazzy chord every bar or two, a root note under
   it, and a lot of filtering. All of that is cheaper to generate than to fetch.

   It is also endless and never repeats exactly, which suits a game you put on to
   zone out to. Four progressions, each in its own key and tempo, cycling, with
   the pattern varying bar to bar from the same kind of seeded noise the track
   generator uses.

   Nothing here touches the simulation. If AudioContext is missing or blocked,
   every entry point is a no-op and the game plays in silence.
   ========================================================================== */
const MU = {
  MASTER: 0.085,          // overall level. Background, not foreground.
  INT_TAU: 0.55,          // s of smoothing on intensity, so the music lifts with
                          //   the run rather than snapping to it
  INT_IDLE: 0.10,         // where it sits on the title and after a death

  /* --- the five recorded tracks. Streamed through an HTMLAudioElement and
     routed into the same graph, so gain, muting and the fades all still apply.
     Deliberately NOT decodeAudioData: three minutes of PCM is tens of megabytes
     and the device this is built for is a five year old Chromebook. --- */
  REC_ON: true,
  REC_N: 5,               // files on disk, track-1 to track-5
  REC_PATH: '/music/track-',
  REC_EXT: '.m4a',
  REC_GAIN: 3.6,          // relative to MASTER, which is set for the synth's own
                          //   raw levels rather than for a mastered file
  REC_FADE_T: 2.0,        // s to bring a track up, so it never lands on the splash
  REC_STALL_T: 6.0,       // s without progress AFTER playback has begun. A track
                          //   that is still downloading also has a currentTime
                          //   that is not moving, so this clock only ever runs
                          //   once something has actually played.
  REC_STALL_MIN: 0.02,    // s of movement that counts as progress
  REC_RETRY_T: 25,        // s before a failed track gets another go. A hiccup
                          //   must not silence real music for the session.
  REC_DUCK_T: 0.35,       // s to pull a failed track down before the synth takes over
  REC_POKE_T: 0.5,        // s between asking a paused element to play again.
                          //   The first play() can be refused, and a refusal is
                          //   not a failure, so nothing was ever asking twice:
                          //   the music then waited for the mute button to be
                          //   toggled, which is exactly what was reported.
  REC_NOSRC_T: 2.0        // s a "no source" network state has to persist before it
                          //   is believed. It reads 3 for a moment after src is
                          //   set, before resource selection has run, and acting
                          //   on that killed a perfectly healthy track three
                          //   milliseconds into a run: the same premature
                          //   give-up as the currentTime trap, wearing a
                          //   different hat.
};
/* ==========================================================================
   MUSIC

   Ten procedural tracks, still synthesised, still no audio assets and no
   external requests. Every name is prefixed au or AU because the engine and the
   game both wanted ctx, tick, start, draw, step, speed, kick and hat, and a
   silent collision there would have been very hard to find.

   One knob drives the lot: auSpeed, 0 to 1, taken from where the run currently
   sits on its own speed curve. It opens the tone filter, pushes the saturation,
   lifts the delay feedback, brings the pad and lead up, adds an open hat and a
   half-bar snare near the top, and stretches the tempo by up to a third. So the
   music does not merely play under the game, it reports on it.
   ========================================================================== */
const AU_SCALES = {
  minorPent:[0,3,5,7,10],
  dorian:[0,2,3,5,7,9,10],

const auMtof = m => 440*Math.pow(2,(m-69)/12);
function auDeg(root,scale,d){
  const s=AU_SCALES[scale], n=s.length;
  const oct=Math.floor(d/n), i=((d%n)+n)%n;
  return root+s[i]+12*oct;
}
// "x..x" -> [0,3].  Uppercase X = accent.
function auParse(p){
  const out=[];
  for(let i=0;i<p.length;i++){
    const c=p[i];
    if(c==='x') out.push({s:i,v:0.75});
    else if(c==='X') out.push({s:i,v:1});
    else if(c==='o') out.push({s:i,v:0.4});   // ghost
    else if(c==='O') out.push({s:i,v:0.6,open:true}); // open auHat
  }
  return out;
}
