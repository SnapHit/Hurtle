/* Engine state. These were declared between the track table and the functions in
   the source file, and my first slice cut straight through them. */
let AC=null, auNoise=null, auMaster=null, auDrum=null, auBass=null, auLead=null, auPad=null,
    auTone=null, auShaper=null, auDelay=null, auFb=null;
let auCur=0, auStep=0, auNextT=0, auSpeed=0;
/* Every source the engine starts, so a track change can silence them. The
   scheduler only looks 0.12s ahead, so the overlap was never queued notes: it
   was long voices already ringing. A pad is held for most of its duration and
   the chords run for seconds, so switching tracks left the old one sounding
   over the new one. Wrapping the two factory methods catches every creation
   site in one place rather than hoping eleven of them were all found. */
const auLive = [];
function auWatch(){
  const co = AC.createOscillator.bind(AC), cb = AC.createBufferSource.bind(AC);
  const hold = n => {
    const st = n.stop.bind(n);
    n.stop = function(t){ n._end = t; try { st(t); } catch(e){} };
    auLive.push(n);
    return n;
  };
  AC.createOscillator   = function(){ return hold(co()); };
  AC.createBufferSource = function(){ return hold(cb()); };
}
function auSilence(){
  if (!AC) return;
  const t = AC.currentTime;
  for (let i = 0; i < auLive.length; i++){
    try { auLive[i].stop(t + 0.02); } catch(e){}
  }
  auLive.length = 0;
  /* and duck the delay, or the old track echoes on through the new one */
  if (auFb){
    auFb.gain.cancelScheduledValues(t);
    auFb.gain.setValueAtTime(0, t);
  }
}
function auPrune(){
  const t = AC.currentTime;
  let w = 0;
  for (let i = 0; i < auLive.length; i++){
    const n = auLive[i];
    if (n._end === undefined || n._end > t) auLive[w++] = n;
  }
  auLive.length = w;
}

function auBuild(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const n=AC.sampleRate*2, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  auNoise=b;

  const lim=AC.createDynamicsCompressor();
  lim.threshold.value=-8; lim.knee.value=4; lim.ratio.value=12;
  lim.attack.value=.003; lim.release.value=.2;
  lim.connect(AC.destination);

  auMaster=AC.createGain(); auMaster.gain.value=.85; auMaster.connect(lim);

  auShaper=AC.createWaveShaper(); auShaper.curve=auDrive(0); auShaper.oversample="2x";
  auShaper.connect(auMaster);

  auTone=AC.createBiquadFilter();
  auTone.type="lowpass"; auTone.frequency.value=700; auTone.Q.value=.7;
  auTone.connect(auShaper);

  auDelay=AC.createDelay(1); auDelay.delayTime.value=.28;
  auFb=AC.createGain(); auFb.gain.value=.28;
  auDelay.connect(auFb); auFb.connect(auDelay); auDelay.connect(auTone);

  auDrum=AC.createGain(); auDrum.gain.value=.9;  auDrum.connect(auMaster);
  auBass=AC.createGain(); auBass.gain.value=.85; auBass.connect(auShaper);
  auLead=AC.createGain(); auLead.gain.value=.5;  auLead.connect(auTone);
  auPad =AC.createGain(); auPad.gain.value=.28;  auPad.connect(auTone);
}
function auDrive(k){
  const n=1024,c=new Float32Array(n),a=k*90;
  for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+a)*x/(1+a*Math.abs(x));}
  return c;
}

/* --- voices --- */
function auKick(t,v){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type="sine";
  o.frequency.setValueAtTime(165,t);
  o.frequency.exponentialRampToValueAtTime(44,t+.07);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(v,t+.004);
  g.gain.exponentialRampToValueAtTime(.0008,t+.34);
  o.connect(g).connect(auDrum); o.start(t); o.stop(t+.36);
}
function auSnare(t,v){
  const s=AC.createBufferSource();s.buffer=auNoise;
  const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=1900;f.Q.value=.9;
  const g=AC.createGain();
  g.gain.setValueAtTime(v*.6,t); g.gain.exponentialRampToValueAtTime(.0008,t+.15);
  s.connect(f).connect(g).connect(auDrum); s.start(t); s.stop(t+.18);
  const o=AC.createOscillator(),og=AC.createGain();
  o.type="triangle"; o.frequency.setValueAtTime(200,t);
  o.frequency.exponentialRampToValueAtTime(125,t+.08);
  og.gain.setValueAtTime(v*.45,t); og.gain.exponentialRampToValueAtTime(.0008,t+.1);
  o.connect(og).connect(auDrum); o.start(t); o.stop(t+.12);
}
function auHat(t,v,open){
  const s=AC.createBufferSource();s.buffer=auNoise;
  const f=AC.createBiquadFilter();f.type="highpass";f.frequency.value=7800;
  const g=AC.createGain(); const dur=open?.24:.042;
  g.gain.setValueAtTime(v*.3,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f).connect(g).connect(auDrum); s.start(t); s.stop(t+dur+.02);
}
function auClap(t,v){
  for(let i=0;i<3;i++){
    const s=AC.createBufferSource();s.buffer=auNoise;
    const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=1250;f.Q.value=1.6;
    const g=AC.createGain(); const st=t+i*.011;
    g.gain.setValueAtTime(v*.4,st); g.gain.exponentialRampToValueAtTime(.0008,st+.05);
    s.connect(f).connect(g).connect(auDrum); s.start(st); s.stop(st+.07);
  }
  const s=AC.createBufferSource();s.buffer=auNoise;
  const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=1050;f.Q.value=1.1;
  const g=AC.createGain();
  g.gain.setValueAtTime(v*.25,t+.03); g.gain.exponentialRampToValueAtTime(.0008,t+.2);
  s.connect(f).connect(g).connect(auDrum); s.start(t+.03); s.stop(t+.22);
}
function auBassV(t,freq,dur,v,cfg,acid){
  const o=AC.createOscillator(); o.type=cfg.wave;
  const f=AC.createBiquadFilter(); f.type="lowpass"; f.Q.value=cfg.q;
  const open=cfg.cut*(acid?(5+auSpeed*10):3.2);
  f.frequency.setValueAtTime(Math.min(open,12000),t);
  f.frequency.exponentialRampToValueAtTime(Math.max(cfg.cut*(1+auSpeed*1.5),60),t+dur*.75);
  const g=AC.createGain();
  o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(v,t+.006);
  g.gain.setValueAtTime(v,t+dur*.6);
  g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(f).connect(g).connect(auBass); o.start(t); o.stop(t+dur+.03);
}
function auClav(t,freq,v){
  const o=AC.createOscillator(); o.type="square";
  const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq*2.6; f.Q.value=3.5;
  const g=AC.createGain();
  o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v*.5,t+.003);
  g.gain.exponentialRampToValueAtTime(.0008,t+.13);
  o.connect(f).connect(g); g.connect(auLead); g.connect(auDelay);
  o.start(t); o.stop(t+.15);
}
function auPluck(t,freq,v){
  const o=AC.createOscillator(); o.type="sawtooth";
  const f=AC.createBiquadFilter(); f.type="lowpass"; f.Q.value=6;
  f.frequency.setValueAtTime(freq*7,t);
  f.frequency.exponentialRampToValueAtTime(freq*1.5,t+.2);
  const g=AC.createGain();
  o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v*.4,t+.005);
  g.gain.exponentialRampToValueAtTime(.0008,t+.28);
  o.connect(f).connect(g); g.connect(auLead); g.connect(auDelay);
  o.start(t); o.stop(t+.3);
}
function auSq(t,freq,v){
  const o=AC.createOscillator(); o.type="square";
  const g=AC.createGain();
  o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v*.28,t+.004);
  g.gain.exponentialRampToValueAtTime(.0008,t+.11);
  o.connect(g); g.connect(auLead); g.connect(auDelay);
  o.start(t); o.stop(t+.13);
}
function auChord(t,freqs,dur,v,wave,pad){
  freqs.forEach((fr,i)=>{
    [-6,6].forEach(det=>{
      const o=AC.createOscillator(); o.type=wave;
      o.frequency.value=fr; o.detune.value=det;
      const g=AC.createGain();
      const a=pad?.06:.008, r=pad?dur*.9:dur*.5;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(v*.16/freqs.length,t+a);
      g.gain.exponentialRampToValueAtTime(.0006,t+r+.05);
      o.connect(g).connect(pad?auPad:auLead);
      o.start(t); o.stop(t+r+.1);
    });
  });
}

/* --- scheduling --- */
function auStepDur(tr){ return 60/(tr.bpm*(1+auSpeed*.35))/4; }

function auSchedule(tr,i,t){
  const L=tr.len;
  const at=(pat,fn)=>{ if(!pat)return; auParse(pat).forEach(h=>{ if(h.s%L===i) fn(t,h.v,h.open); }); };
  at(tr.kick,(t,v)=>auKick(t,v));
  at(tr.snare,(t,v)=>auSnare(t,v));
  if(auSpeed>.12||!tr.clap) at(tr.hat,(t,v,o)=>auHat(t,v,o||(auSpeed>.55&&Math.random()<.15)));
  at(tr.clap,(t,v)=>auClap(t,v));

  (tr.bass||[]).forEach(([s,d,len])=>{
    if(s%L!==i) return;
    auBassV(t,auMtof(auDeg(tr.root,tr.scale,d)),auStepDur(tr)*len*.95,.5,tr.bassCfg,tr.acid);
  });
  (tr.chord||[]).forEach(([s,ds,len])=>{
    if(s%L!==i) return;
    if(tr.pad&&auSpeed<.08) return;
    auChord(t,ds.map(d=>auMtof(auDeg(tr.root+12,tr.scale,d))),auStepDur(tr)*len,.9,tr.chordWave||"sawtooth",tr.pad);
  });
  if(auSpeed>.3||!tr.pad){
    (tr.lead||[]).forEach(([s,d,len])=>{
      if(s%L!==i) return;
      const f=auMtof(auDeg(tr.root+12,tr.scale,d));
      const v=.8;
      if(tr.leadVoice==="auClav") auClav(t,f,v);
      else if(tr.leadVoice==="square") auSq(t,f,v);
      else auPluck(t,f,v);
    });
  }
  if(auSpeed>.75 && i%4===2) auHat(t,.35,true);
  if(auSpeed>.9 && i%8===6) auSnare(t,.3);
}

function auRun(){
  const tr=AU_TRACKS[auCur];
  while(auNextT < AC.currentTime+.12){
    const sw=(auStep%2===1)?auStepDur(tr)*tr.swing:0;
    auSchedule(tr,auStep,auNextT+sw);
    auNextT+=auStepDur(tr);
    auStep=(auStep+1)%tr.len;
  }
}

function auApply(){
  if(!AC) return;
  const tr=AU_TRACKS[auCur];
  const cut=tr.cutBase*Math.pow(9,auSpeed);
  auTone.frequency.setTargetAtTime(Math.min(cut,15000),AC.currentTime,.06);
  auShaper.curve=auDrive((tr.dirty?.25:0)+auSpeed*.55);
  auFb.gain.setTargetAtTime(.18+auSpeed*.22,AC.currentTime,.1);
  auPad.gain.setTargetAtTime(.2+auSpeed*.18,AC.currentTime,.1);
  auLead.gain.setTargetAtTime(.36+auSpeed*.3,AC.currentTime,.1);
}


/* --- the game side: lifecycle, muting, and one track per run --- */
let muMuted = false, muWant = false, muArm = false;

/* ==========================================================================
   THE RECORDED TRACKS

   Five files, streamed. Track 1 for everyone the first time, the skip button
   steps through and wraps, the choice is remembered, and a track loops when it
   ends because nobody listens to five in order and a player who picked a
   favourite wants to hear it.

   Nothing here ever blocks the game. A run starts whether or not audio is
   ready, and the music fades in when it arrives.
   ========================================================================== */
let musEl = null, musSrc = null, musGain = null;
let musTrack = 0;                 // 0 based; the file is musTrack + 1
let musState = 'idle';            // idle | loading | playing | failed
let musLastT = 0, musStillT = 0, musRetryT = 0, musLoadT = 0, musPokeT = 0;
let musWantPlay = false;          // a run has asked for music at least once
let musProcActive = false;        // is the synth the thing currently sounding?

function musLoadPref(){
  let v = null;
  try { v = localStorage.getItem(TRACK_KEY); } catch(e){}
  const i = (v === null) ? 0 : (parseInt(v, 10) - 1);
  /* Unreadable storage means track one, every visit, which is the right way
     round for this to fail. */
  musTrack = (isFinite(i) && i >= 0 && i < MU.REC_N) ? i : 0;
}
function musSavePref(){
  try { localStorage.setItem(TRACK_KEY, String(musTrack + 1)); } catch(e){}
}

function musBuild(){
  if (musEl || !AC || !auMaster) return;
  try {
    musEl = new Audio();
    musEl.preload = 'none';       // nothing is fetched until a run asks for it
    musEl.loop = true;
    musEl.addEventListener('playing', musOnPlaying);
    musEl.addEventListener('error', musOnFail);
    musSrc  = AC.createMediaElementSource(musEl);
    musGain = AC.createGain();
    musGain.gain.value = 0;
    musSrc.connect(musGain);
    musGain.connect(auMaster);    // so mute and the master fade still own it
  } catch(e){
    musEl = null;
    musOnFail();
  }
}

/* Only ever the track being played. Never all five, never a prefetch of the
   next one, because the player is not going through them in order. */
function musUrl(){ return MU.REC_PATH + (musTrack + 1) + MU.REC_EXT; }

function musPlay(){
  if (!MU.REC_ON || muMuted || !AC) return;
  musWantPlay = true;
  musBuild();
  if (!musEl) return;
  const url = musUrl();
  musState  = 'loading';
  musStillT = 0; musLastT = 0; musRetryT = 0; musLoadT = 0;
  try {
    if (musGain){
      const now = AC.currentTime;
      musGain.gain.cancelScheduledValues(now);
      musGain.gain.setValueAtTime(0, now);
    }
    /* Comparing the resolved src against the relative one, so re-entering with
       the same track does not restart a download that is already in flight. */
    if (!musEl.src || musEl.src.indexOf(url) === -1){ musEl.src = url; musEl.load(); }
    else if (musEl.readyState > 0){ try { musEl.currentTime = 0; } catch(e){} }
    const pr = musEl.play();
    /* An autoplay refusal is not a broken file. The next run asks again. */
    if (pr && pr.catch) pr.catch(function(){});
  } catch(e){ musOnFail(); }
}

function musOnPlaying(){
  musState = 'playing';
  musRetryT = 0;
  /* Real music won, so the synth stands down. This is also the only place it
     ever does, which is what stops a genre switch a couple of seconds into a
     first run: the synth is never started while a track is merely arriving. */
  if (musProcActive){ musProcActive = false; auSilence(); }
  if (musGain && AC){
    const now = AC.currentTime;
    musGain.gain.cancelScheduledValues(now);
    musGain.gain.setValueAtTime(musGain.gain.value, now);
    musGain.gain.linearRampToValueAtTime(MU.REC_GAIN, now + MU.REC_FADE_T);
  }
}

/* A genuine failure: an error event, a dead network state, or a stall that
   began after playback had already started. Waiting is not failing. */
function musOnFail(){
  if (musState === 'failed') return;
  musState  = 'failed';
  musRetryT = MU.REC_RETRY_T;
  musStillT = 0;
  if (musGain && AC){
    const now = AC.currentTime;
    musGain.gain.cancelScheduledValues(now);
    musGain.gain.setValueAtTime(musGain.gain.value, now);
    musGain.gain.linearRampToValueAtTime(0, now + MU.REC_DUCK_T);
  }
  /* the synth picks it up from here, re-anchored so it does not try to catch
     up on a scheduler clock that has run on without it */
  if (!musProcActive){ musProcActive = true; muArm = true; }
}

function musTick(dt){
  if (!MU.REC_ON || muMuted) return;

  /* If a run has asked for music and the element is not running, ask again.
     Deliberately a condition rather than a diagnosis: it covers a context that
     was still resuming when play() was called, a play() the browser refused,
     and a device that wanted a second gesture, without any of them having to be
     told apart. The same shape as the muWant loop that retries AC.resume().
     Calling play() on an element that already has its src does not restart a
     download that is in flight, and once it is playing the condition is false,
     so this does not keep firing. */
  musPokeT += dt;
  if (musPokeT >= MU.REC_POKE_T){
    musPokeT = 0;
    if (musWantPlay && musEl && musEl.paused && musState !== 'failed' &&
        AC && AC.state === 'running'){
      try {
        const pr = musEl.play();
        if (pr && pr.catch) pr.catch(function(){});   // still not a failure
      } catch(e){}
    }
  }

  if (musState === 'failed'){
    if (musRetryT > 0){
      musRetryT -= dt;
      /* the route back: a temporary hiccup does not cost the whole session */
      if (musRetryT <= 0 && musWantPlay) musPlay();
    }
    return;
  }
  if (!musEl) return;
  if (musState !== 'playing'){
    /* Still arriving. NOT a stall, and the difference matters: a downloading
       track has a currentTime that is not advancing either, so a detector that
       watched only that would give up on a healthy file about twelve seconds
       into a first run and never play real music again.

       A genuine failure arrives as an error event, which is immediate and
       unambiguous. This is only the backstop for a source the browser quietly
       gave up on without one, and it has to wait: networkState reads NO_SOURCE
       for a moment after src is set, before resource selection has run. */
    musLoadT += dt;
    if (musEl.networkState === 3 /* NETWORK_NO_SOURCE */ && musLoadT > MU.REC_NOSRC_T) musOnFail();
    return;
  }
  /* Playback has actually begun and then stopped: now a stall clock means
     something. */
  if (musEl.paused){ musStillT = 0; musLastT = musEl.currentTime; return; }
  const now = musEl.currentTime;
  if (Math.abs(now - musLastT) > MU.REC_STALL_MIN){ musLastT = now; musStillT = 0; return; }
  musStillT += dt;
  if (musStillT > MU.REC_STALL_T) musOnFail();
}

function musPause(){ try { if (musEl && !musEl.paused) musEl.pause(); } catch(e){} }
function musResume(){
  if (!MU.REC_ON || muMuted || !musEl || musState === 'failed') return;
  try { const pr = musEl.play(); if (pr && pr.catch) pr.catch(function(){}); } catch(e){}
}
function musStop(){
  try {
    if (musEl){ musEl.pause(); musEl.removeAttribute('src'); musEl.load(); }
  } catch(e){}
}
/* true when the synth is the thing that should be sounding */
function musProcOn(){ return !MU.REC_ON || musProcActive; }


function audioOn(){ return !muMuted; }

function audioInit(){
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return false;
  try { auBuild(); }
  catch(e){
    /* This runs at boot to warm the device. An unguarded failure anywhere in it
       would take the whole game down, which is far worse than silence. */
    try { if (AC) AC.close(); } catch(e2){}
    AC = null; auMaster = null;
    return false;
  }
  if (auMaster) auMaster.gain.value = muMuted ? 0 : MU.MASTER;
  auWatch();
  return true;
}
function audioWarm(){ if (!AC && !muMuted) audioInit(); }

/* The skip button and KeyN: one step through the five, wrapping, remembered.
   When the recorded tracks are the ones sounding this is all it does; the synth
   only gets a fresh pick when it is the thing being heard. */
function audioNewTrack(){
  if (MU.REC_ON){
    musTrack = (musTrack + 1) % MU.REC_N;
    musSavePref();
    musPlay();
    if (!musProcActive) return;
  }
  audioProcTrack();
}

/* At the top of a run: carry on with the remembered track, or start it. This is
   not the skip button, so it does not advance. */
function audioRunMusic(){
  if (MU.REC_ON){
    if (musState === 'playing' && musEl && !musEl.paused) return;
    if (musState !== 'failed') musPlay();
    else if (!musProcActive) musPlay();
    if (!musProcActive) return;
  }
  audioProcTrack();
}

/* A different synth track every run, never the same one twice running. */
/* A fresh track, and the old one actually stops. */
function audioProcTrack(){
  if (!AC) return;
  auSilence();
  const n = AU_TRACKS.length;
  /* a straight draw from everything except what is playing, so it is properly
     random rather than a fixed step from wherever it happened to be */
  let pick = Math.floor(Math.random() * (n - 1));
  if (pick >= auCur) pick++;
  auCur  = pick;
  auStep = 0;
  auNextT = AC.currentTime + 0.02;
  auApply();
}

function audioStart(){
  if (muMuted) return;
  if (!AC && !audioInit()) return;
  if (AC.state === 'suspended') AC.resume();
  try {
    const b = AC.createBuffer(1, 1, AC.sampleRate);
    const sN = AC.createBufferSource();
    sN.buffer = b; sN.connect(AC.destination);
    sN.start(AC.currentTime); sN.stop(AC.currentTime + 0.001);
  } catch(e){}
  muWant = true; muArm = true;
  auStep = 0;
  auNextT = AC.currentTime + 0.02;
}
function audioToggle(){
  muMuted = !muMuted;
  try { localStorage.setItem(MUTE_KEY, muMuted ? '1' : '0'); } catch(e){}
  /* stopping the music button stops the download too, rather than paying for
     bytes nobody is listening to */
  if (muMuted) musPause(); else if (musWantPlay) musResume();
  if (!AC){ if (!muMuted) audioInit(); return; }
  auMaster.gain.setTargetAtTime(muMuted ? 0 : MU.MASTER, AC.currentTime, 0.05);
  if (!muMuted && AC.state === 'suspended'){ muWant = true; muArm = true; AC.resume(); }
}
function audioLoadMute(){
  let stored = null;
  try { stored = localStorage.getItem(MUTE_KEY); } catch(e){}
  muMuted = stored === null ? FRAMED : (stored === '1');
}
function audioSuspend(){ muWant = false; musPause(); try { if (AC && AC.state === 'running') AC.suspend(); } catch(e){} }
/* Pausing the game pauses the music. Suspending freezes the audio clock as well,
   so nothing is scheduled into a gap, and arming on the way back makes the
   scheduler pick up from the moment it actually starts running again rather than
   from wherever the clock had got to. */
function audioPause(){ audioSuspend(); }
function audioResume(){
  if (muMuted || !AC) return;
  muWant = true; muArm = true;
  try { AC.resume(); } catch(e){}
  musResume();
}
function audioClose(){
  musStop();
  if (!AC) return;
  try { if (auMaster) auMaster.gain.value = 0; AC.close(); } catch(e){}
  AC = null; auMaster = null;
}
function audioBindLifecycle(){
  addEventListener('pagehide', audioClose);
  addEventListener('beforeunload', audioClose);
  addEventListener('visibilitychange', function(){
    const hid = (typeof document !== 'undefined') && document.hidden;
    if (hid) audioSuspend(); else audioStart();
  });
}

/* where the run currently sits on its own speed curve, 0 to 1 */
function muTargetIntensity(){
  if (state !== 'play' || !run) return MU.INT_IDLE;
  return clamp((curveV() - K.V_START) / Math.max(K.V_MAX - K.V_START, 1), 0, 1);
}
function audioTick(){
  if (!AC || muMuted) return;
  /* resume() is asynchronous and the context is still suspended when it
     returns, so a scheduler started against that clock never ran. Keep asking,
     then begin from the moment it is genuinely running. */
  if (AC.state !== 'running'){
    if (muWant){ try { AC.resume(); } catch(e){} }
    return;
  }
  if (muArm){ muArm = false; auStep = 0; auNextT = AC.currentTime + 0.02; }
  musTick(lastFt);
  const want = muTargetIntensity();
  auSpeed += (want - auSpeed) * (1 - Math.exp(-lastFt / MU.INT_TAU));
  if ((muFrame++ & 7) === 0){ auApply(); auPrune(); }
  /* The synth only sounds when it is the fallback. While a recorded track is
     merely on its way, nothing plays: starting the synth there and swapping it
     out on arrival is an audible genre change two seconds into the run. */
  if (musProcOn()) auRun();
}
let muFrame = 0;

/* ==========================================================================
   PERSISTENCE. Best score only, every call wrapped. A blocked or unavailable
   store degrades to a game with no memory rather than throwing.
   ========================================================================== */
/* Read once at boot. If storage is unavailable this stays at zero, so the
   explanation shows every time rather than never, which is the right way for
   this to fail. */
let taught = { got: 0 };
function loadTaught(){
  try {
    const o = JSON.parse(localStorage.getItem(TEACH_KEY) || 'null');
    if (o && typeof o.got === 'number' && isFinite(o.got)) taught.got = Math.max(0, o.got | 0);
  } catch(e){ taught.got = 0; }
}
/* Called when a pickup is collected. Storage only, no simulation state: the
   run must play out identically whether or not this browser has seen the
   explanation before. */
function teachGot(){
  taught.got++;
  try { localStorage.setItem(TEACH_KEY, JSON.stringify({ got: taught.got })); } catch(e){}
}

function loadBest(){
  try {
    let v = localStorage.getItem(STORE_KEY);
    if (v === null) v = localStorage.getItem(OLD_KEYS.best);   // carried over
    best = v ? (parseInt(v,10)||0) : 0;
  }
  catch(e){ best = 0; bestOK = false; }
  try { diag = JSON.parse(localStorage.getItem(DIAG_KEY) || localStorage.getItem(OLD_KEYS.diag) || '{}') || {}; }
  catch(e){ diag = {}; }
  loadTaught();
}
function saveBest(){
  if (!bestOK) return;
  try { const s = score(); if (s > best){ best = s; localStorage.setItem(STORE_KEY, String(best)); } }
  catch(e){ bestOK = false; }
}

/* ==========================================================================
   LOOP. Fixed timestep with an accumulator, so physics is identical on a
   144Hz desktop and a stuttering Celeron.
   ========================================================================== */
let acc = 0, last = 0, perfTick = 0;
function pushPerf(ms){
  perf.hist[perf.i] = ms; perf.i = (perf.i+1) % perf.hist.length;
  if (perf.n < perf.hist.length) perf.n++;
  if (++perfTick >= 15){
    perfTick = 0;
    let sum = 0, mx = 0;
    for (let i = 0; i < perf.n; i++){ const v = perf.hist[i]; sum += v; if (v > mx) mx = v; }
    perf.avg = sum / perf.n; perf.worst = mx;
  }
}

function frame(now){
  requestAnimationFrame(frame);
  if (!last) last = now;
  let ft = (now - last)/1000; last = now;
  lastFt = Math.min(ft, 0.05);
  /* THE animation clock. Every moving thing in the background reads this, and
     the line that advanced it was lost in a failed edit: animT sat at 0, so the
     rotors held one angle and every craft hung motionless in the sky. Nothing
     was ever going to move. */
  animT += lastFt;
  pushPerf(ft*1000);
  if (ft > 0.25) ft = 0.25;

  derive();
  audioTick();
  if (K.AUTO_QUALITY && ++qualHold > K.AUTO_HOLD && perf.n > 60){
    if (perf.avg > K.AUTO_MS_HI && qual > K.QUAL_MIN){ qual -= K.QUAL_STEP; qualHold = 0; }
    else if (perf.avg < K.AUTO_MS_LO && qual < 1){ qual = Math.min(1, qual + K.QUAL_STEP); qualHold = 0; }
  }
  if (state === 'dead' && run.inputLock > 0) run.inputLock -= ft;
  if (shareMsg > 0) shareMsg -= ft;

  /* A paused run still renders, so the scenery keeps turning behind the veil,
     but nothing in the simulation moves. */
  if (paused && state === 'play') ft = 0;
  acc += ft;
  let steps = 0;
  while (acc >= K.STEP && steps < K.MAX_STEPS){
    acc -= K.STEP; steps++;
    if (state === 'title') tickTitle(K.STEP);
    else if (state === 'play' || state === 'dying') tick(K.STEP);
  }
  if (acc > K.STEP * K.MAX_STEPS) acc = 0;
  perf.steps = steps;

  const targetX = (state === 'title') ? sampleTrack(P.z).cx : P.x;
  if (state === 'title'){ rZ = P.z; rX = P.x; rH = 0; }
  camX += (targetX - camX) * (1 - Math.exp(-K.CAM_LAG * ft));

  draw();
}

/* ==========================================================================
   BOOT
   ========================================================================== */
function boot(){
  cv  = document.getElementById('c');
  ctx = cv.getContext('2d', { alpha:false });
  derive();
  resize();
  addEventListener('resize', resize);
  addEventListener('fullscreenchange', resize);
  addEventListener('webkitfullscreenchange', resize);
  addEventListener('orientationchange', () => setTimeout(resize, 120));

  cv.addEventListener('pointerdown', e => {
    if (state === 'title' || state === 'dead' || setOpen){
      const hit = uiHit(e.clientX, e.clientY);
      if (setOpen){
        e.preventDefault();
        if (hit === 'setDone'){ setOpen = false; UI.settings = null; showChrome(true); return; }
        if (hit === 'setReset'){ resetOpts(); previewRefresh(); return; }
        if (hit && hit.slice(0,3) === 'opt'){
          setDrag = +hit.slice(3); setFromX(setDrag, e.clientX);
        }
        return;
      }
      if (state === 'title'){
        if (hit === 'play')   { dailyMode = true;  audioStart(); start(); e.preventDefault(); return; }
        if (hit === 'random') { dailyMode = false; audioStart(); start(); e.preventDefault(); return; }
        if (hit === 'sound')  { audioToggle(); e.preventDefault(); return; }
      }
      if (hit === 'share' && state === 'dead'){ doShare(); e.preventDefault(); return; }
      if (hit === 'menu' && state === 'dead'){
        state = 'title'; paused = false; showChrome(true);
        UI.menu = null; UI.settings = null;
        previewRefresh();
        e.preventDefault(); return;
      }
      if (hit === 'settings'){
        /* The chrome is a fixed HTML footer. The panel is canvas. They do not
           know about each other, so the bottom sliders and the buttons were
           landing on top of the links. */
        setOpen = true; setFrom = state; showChrome(false); previewRefresh();
        for (const k in UI) if (k.slice(0,3) === 'opt') UI[k] = null;
        e.preventDefault(); return;
      }
    }
    if (state === 'play'){
      const h2 = uiHit(e.clientX, e.clientY);
      if (h2 === 'pause'){
        paused = !paused;
        if (paused) audioPause(); else audioResume();
        e.preventDefault(); return;
      }
      if (h2 === 'full'){ fsToggle(); e.preventDefault(); return; }
      if (h2 === 'skip'){ audioNewTrack(); e.preventDefault(); return; }
      if (h2 === 'mute'){ audioToggle(); e.preventDefault(); return; }
      if (paused){ paused = false; audioResume(); e.preventDefault(); return; }
    }
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    if (drag.id === null){
      /* Touch down steers at once, in the direction of the half you touched.
         Dragging from there refines it continuously, so it is responsive like a
         tap and analogue like a stick. */
      const side = e.clientX < cv.clientWidth * 0.5 ? -1 : 1;
      drag.id  = e.pointerId;
      drag.val = side * K.TAP_BIAS;
      drag.ox  = e.clientX - drag.val * D.DRAG_PX;
    }
    anyInput(); e.preventDefault();
  }, { passive:false });
  cv.addEventListener('pointermove', e => {
    if (setOpen){ if (setDrag >= 0) setFromX(setDrag, e.clientX); return; }
    if (e.pointerId === drag.id) dragMove(e.clientX);
  });
  const lift = e => { setDrag = -1; if (e.pointerId === drag.id){ drag.id = null; drag.val = 0; } };
  cv.addEventListener('pointerup',     lift);
  cv.addEventListener('pointercancel', lift);
  cv.addEventListener('contextmenu',   e => e.preventDefault());

  loadBest();
  audioLoadMute();
  musLoadPref();
  audioBindLifecycle();
  audioWarm();
  captureOptBase();
  defaultOpts();
  loadOpts();
  newRun(dailyMode ? dailySeed() : (urlSeed !== null ? urlSeed : (Math.random()*2147483647)|0));
  state = 'title';
  requestAnimationFrame(frame);
}
boot();
</script>
